name: Library CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Install Mike Farah yq (pinned + verified)
        env:
          YQ_VERSION: v4.44.3
          YQ_SHA256: a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          curl -fsSL \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -o "$tmp"
          echo "${YQ_SHA256}  $tmp" | sha256sum -c -
          sudo install -m 0755 "$tmp" /usr/local/bin/yq
          rm -f "$tmp"

      - name: Validate library.json
        run: jq -e '.min_cli_version' library.json > /dev/null

      - name: Determine CLI version
        id: cli
        run: echo "version=$(jq -r '.min_cli_version' library.json)" >> "$GITHUB_OUTPUT"

      - name: Cache CLI binary
        id: cache
        uses: actions/cache@v5
        with:
          path: /usr/local/bin/tracemill
          key: tracemill-${{ steps.cli.outputs.version }}-linux-amd64

      - name: Download CLI
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          CLI_VERSION: ${{ steps.cli.outputs.version }}
        run: |
          curl -fsSL \
            "https://dl.tracemill.io/cli/${CLI_VERSION}/tracemill_linux_amd64.tar.gz" \
            -o /tmp/tracemill.tar.gz
          tar xzf /tmp/tracemill.tar.gz -C /tmp
          install -m 755 /tmp/tracemill /usr/local/bin/tracemill

      - name: Verify CLI
        run: tracemill version

      - name: Validate event types
        run: scripts/validate-event-types.sh

      - name: Compile scenarios and jobs (dry-run)
        run: scripts/compile-content.sh

      - name: Lint public job taxonomy
        run: scripts/check-job-taxonomy.sh

  skill-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install bats and jq
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bats jq

      - name: Install Mike Farah yq (pinned + verified)
        env:
          YQ_VERSION: v4.44.3
          YQ_SHA256: a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          curl -fsSL \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -o "$tmp"
          echo "${YQ_SHA256}  $tmp" | sha256sum -c -
          sudo install -m 0755 "$tmp" /usr/local/bin/yq
          rm -f "$tmp"

      - name: Run job taxonomy lint tests
        run: bats scripts/tests/check-job-taxonomy.bats

      - name: Run skill script tests
        run: bats .claude/skills/scenario-authoring/scripts/tests/
