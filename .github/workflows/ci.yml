name: Library CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Validate library.json
        run: jq -e '.min_cli_version' library.json > /dev/null

      - name: Determine CLI version
        id: cli
        run: echo "version=$(jq -r '.min_cli_version' library.json)" >> "$GITHUB_OUTPUT"

      - name: Cache CLI binary
        id: cache
        uses: actions/cache@v5
        with:
          path: /usr/local/bin/tracemill
          key: tracemill-${{ steps.cli.outputs.version }}-linux-amd64

      - name: Download CLI
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          CLI_VERSION: ${{ steps.cli.outputs.version }}
        run: |
          curl -fsSL \
            "https://dl.tracemill.io/cli/${CLI_VERSION}/tracemill_linux_amd64.tar.gz" \
            -o /tmp/tracemill.tar.gz
          tar xzf /tmp/tracemill.tar.gz -C /tmp
          install -m 755 /tmp/tracemill /usr/local/bin/tracemill

      - name: Verify CLI
        run: tracemill version

      - name: Validate event types
        run: |
          shopt -s globstar nullglob
          failures=()
          for f in event-types/**/*.yaml; do
            echo "::group::validate $f"
            if ! tracemill validate --event-type "$f"; then
              failures+=("$f")
              echo "::error file=$f::event-type validation failed"
            fi
            echo "::endgroup::"
          done
          if (( ${#failures[@]} > 0 )); then
            echo "::error::${#failures[@]} event-type(s) failed validation"
            printf '  - %s\n' "${failures[@]}"
            exit 1
          fi

      - name: Compile scenarios and jobs (dry-run)
        run: |
          shopt -s globstar nullglob
          failures=()
          for f in scenarios/**/*.yaml jobs/**/*.yaml; do
            echo "::group::dry-run $f"
            if ! tracemill run --dry-run "$f"; then
              failures+=("$f")
              echo "::error file=$f::dry-run failed"
            fi
            echo "::endgroup::"
          done
          if (( ${#failures[@]} > 0 )); then
            echo "::error::${#failures[@]} file(s) failed dry-run"
            printf '  - %s\n' "${failures[@]}"
            exit 1
          fi
