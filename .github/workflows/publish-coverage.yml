name: Publish Coverage

# Started by `Library Release` on its own tag, or by hand for recovery:
#   gh workflow run publish-coverage.yml -R tracemill/tracemill --ref lib-v<version>
# It must run on a lib-v* tag: the downloads upload role trusts tag refs only.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-coverage
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/lib-v')
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.GORELEASER_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish latest coverage and badges
        id: publish
        env:
          STACK_NAME: TracemillDownloadsStack-prod
        run: |
          VERSION="${GITHUB_REF_NAME#lib-v}"
          BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" --output text)
          HEAD=$(aws s3 cp "s3://${BUCKET}/library/version.json" - | jq -r '.version')
          if [ "$HEAD" != "$VERSION" ]; then
            echo "::notice::Feed head is ${HEAD}; ${VERSION} does not own the latest coverage objects. Run this workflow on lib-v${HEAD} instead."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          aws s3 cp "s3://${BUCKET}/library/${VERSION}/coverage.json" coverage.json
          scripts/coverage-badges.sh coverage.json badges
          aws s3 cp coverage.json "s3://${BUCKET}/library/coverage.json" \
            --content-type application/json --cache-control "no-cache"
          aws s3 cp badges/ "s3://${BUCKET}/library/badges/" --recursive \
            --content-type application/json --cache-control "no-cache"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Mint platform dispatch token
        if: steps.publish.outputs.published == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PLATFORM_DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLATFORM_DISPATCH_APP_PRIVATE_KEY }}
          owner: tracemill
          repositories: platform
          permission-actions: write

      - name: Rebuild tracemill.io with the released coverage
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh workflow run web-deploy.yml --repo tracemill/platform --ref main
