type: pool
id: cisco-sfw-blocked-web-destinations
description: |
  Coherent (URL, responder address, web application, server-certificate
  status, server-certificate fingerprint) tuples for HTTPS destinations
  reached from a corporate LAN -- content-delivery, telemetry, font, and ad
  hosts belonging to a handful of large web properties.

  The five columns must stay on the same row. The responder address is the
  one that host actually resolves to, the web application is the property
  the firewall attributes that address to, and the certificate status and
  fingerprint are what validation returned for that host. Drawing them
  independently produces incoherent flows -- a Wikipedia URL attributed to
  Google, or a certificate status that never applied to that host.

  The fingerprint is a property of the certificate, not of the row, so rows
  legitimately share one: a single certificate covering several hostnames of
  the same property presents the same fingerprint on each of them, and one
  hostname served from several addresses presents the same fingerprint on
  each address. Generating a fresh fingerprint per flow would lose that --
  the same host would appear to present a different certificate every time
  it was reached.

  Several rows share a web application on purpose: one property serves
  content from many hostnames and many addresses, which is what makes a
  per-destination block list look like a real one. Rows are ordinary
  browsing destinations, not malicious infrastructure -- use this pool for
  policy-driven blocking, egress filtering, and URL-category scenarios,
  where the point is that the destination is forbidden, not that it is
  hostile.

  Sources:
    Splunk attack_data
      cisco_secure_firewall_threat_defense/connection_event/connection_events.log
      -- the 16 distinct blocked-destination tuples, reproduced 1:1.
sampling:
  mode: round_robin
csv:
  data: |
    url,responder_ip,web_application,ssl_server_cert_status,ssl_cert_fingerprint
