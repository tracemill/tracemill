type: event-type
id: gcp.audit
version: v1
full_name: Google Cloud Platform Cloud Audit Log

# Native shape = the bare Cloud Audit LogEntry that GCP's Cloud Logging Log Router
# publishes to a Pub/Sub topic. This is the vendor-neutral record every consumer
# leg starts from: the `gcp_pubsub` sink publishes it as-is at the pipeline entry
# point, and the Dataflow "Pub/Sub to Splunk" PUSH template forwards it bare.
#
# The Splunk Add-on for Google Cloud Platform (the PULL collector) wraps this
# record under a top-level `data` object when it indexes, so its detections read
# `data.protoPayload.*`, `data.resource.*`, `data.logName`. That `data` wrapper is
# a Splunk-collector artifact, NOT part of the record GCP emits -- so it is
# reconstructed at delivery by the HEC pipeline's `envelope: data` transform
# rather than baked into this event type. (HEC with no envelope therefore models
# the Dataflow PUSH leg; HEC with `envelope: data` models the Add-on PULL leg.)
#
# The record is a Cloud Logging LogEntry whose `protoPayload` is a
# google.cloud.audit.AuditLog. The envelope fields (logName, resource, insertId,
# severity, timestamp) are common to every audit log; the protoPayload.request /
# protoPayload.response shapes vary per service and are left open via
# additionalProperties: true.
#
# The engine stamps the `timestamp` field on every emit -- this is the record's
# event time. `insertId` is the globally-unique LogEntry id Cloud Logging assigns,
# used here for SIEM correlation.
#
# LogEntry schema:
#   https://cloud.google.com/logging/docs/reference/v2/rest/v2/LogEntry
# Cloud Audit Logs (AuditLog payload) schema:
#   https://cloud.google.com/logging/docs/audit/understanding-audit-logs
timestamp: timestamp
timestamp_format: RFC3339Nano
correlation: [insertId]

splunk:
  sourcetype: "google:gcp:pubsub:message"
  # The Splunk Add-on for GCP (and the equivalent HEC envelope:data delivery)
  # indexes the bare LogEntry under a top-level `data` object, so a canonical
  # correlation path such as `insertId` is indexed as `data.insertId`. The
  # validator wraps correlation paths under this key before searching.
  field_shape:
    wrap: data

schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required:
    - logName
    - resource
    - protoPayload
    - insertId
    - timestamp
  properties:
    logName:
      type: string
      description: "Cloud Logging resource name of the audit log, e.g. projects/<project-id>/logs/cloudaudit.googleapis.com%2Factivity (Admin Activity) or %2Fdata_access (Data Access)."
    resource:
      type: object
      description: "Monitored resource the audited operation acted on."
      required:
        - type
      properties:
        type:
          type: string
          description: "Monitored resource type, e.g. cloud_function, gce_instance, gcs_bucket, project."
        labels:
          type: object
          description: "Resource labels; commonly carries project_id, region/location, and a resource name label."
          properties:
            project_id:
              type: string
              description: "GCP project id that owns the audited resource."
          additionalProperties: true
      additionalProperties: true
    severity:
      type: string
      description: "LogEntry severity, e.g. NOTICE for Admin Activity, INFO for Data Access, ERROR on a denied/failed call."
    timestamp:
      type: string
      description: "Event time of the audited operation (RFC3339Nano, e.g. 2026-06-19T10:22:31.135Z)."
    receiveTimestamp:
      type: string
      description: "Time Cloud Logging received the entry (RFC3339); at or just after timestamp."
    insertId:
      type: string
      description: "Globally-unique id Cloud Logging assigns to this LogEntry. Used for SIEM correlation."
    operation:
      type: object
      description: "Optional grouping id for entries that are part of one long-running operation."
      additionalProperties: true
    labels:
      type: object
      description: "Optional user-defined LogEntry labels."
      additionalProperties: true
    protoPayload:
      type: object
      description: "The Cloud Audit Log payload (google.cloud.audit.AuditLog)."
      required:
        - "@type"
        - serviceName
        - methodName
      properties:
        "@type":
          type: string
          description: "Always type.googleapis.com/google.cloud.audit.AuditLog."
        serviceName:
          type: string
          description: "API service that produced the log, e.g. cloudfunctions.googleapis.com, compute.googleapis.com, iam.googleapis.com."
        methodName:
          type: string
          description: "Audited API method, e.g. google.cloud.functions.v1.CloudFunctionsService.CreateFunction."
        resourceName:
          type: string
          description: "Full resource path the method acted on, e.g. projects/<p>/locations/<r>/functions/<name>."
        authenticationInfo:
          type: object
          description: "Identity that made the request."
          properties:
            principalEmail:
              type: string
              description: "Email of the authenticated principal (user or service account). The SIEM CIM maps this to src_user."
          additionalProperties: true
        requestMetadata:
          type: object
          description: "Metadata about the request and its caller."
          properties:
            callerIp:
              type: string
              description: "Source IP of the caller. The SIEM CIM maps this to src."
            callerSuppliedUserAgent:
              type: string
              description: "User-Agent the caller supplied, e.g. a gcloud or google-cloud-sdk string. The SIEM CIM maps this to http_user_agent."
          additionalProperties: true
        authorizationInfo:
          type: array
          description: "Authorization decisions, one entry per permission the method checked."
          items:
            type: object
            properties:
              resource:
                type: string
              permission:
                type: string
                description: "IAM permission checked, e.g. cloudfunctions.functions.create."
              granted:
                type: boolean
            additionalProperties: true
        request:
          type: object
          description: "Method request body (shape varies per service/method)."
          additionalProperties: true
        response:
          type: object
          description: "Method response body (shape varies per service/method)."
          additionalProperties: true
        status:
          type: object
          description: "gRPC status of the operation; empty/absent on success, populated with code+message on failure."
          properties:
            code:
              type: integer
            message:
              type: string
          additionalProperties: true
      additionalProperties: true
  additionalProperties: true
