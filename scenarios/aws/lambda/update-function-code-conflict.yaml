type: scenario
description: |
  A deployment tries to update a Lambda function's code while a previous
  update to the same function is still in progress. Lambda rejects the call
  with ResourceConflictException and the package is not changed -- the
  routine outcome of two overlapping deploys racing on one function.

state:
  aws_region:    us-east-1
  account_id:    "000000000000"
  actor_name:    gen.username()
  actor:         gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  source_ip:     gen.ipv4()
  user_agent:    "aws-cli/2.15.30 Python/3.11.8 Darwin/23.4.0 source/x86_64 prompt/off command/lambda.update-function-code tracemill/1.0"
  tls_version:   "TLSv1.3"
  tls_cipher:    TLS_AES_128_GCM_SHA256
  function_name: gen.regex(pattern=[a-z]{8}-processor)
  function_arn:  "arn:aws:lambda:${ref.aws_region}:${ref.account_id}:function:${ref.function_name}"

steps:
  - emit:
      event_type: aws.cloudtrail@v1
      fields:
        eventVersion:       "1.11"
        eventTime:          gen.timestamp()
        eventID:            gen.uuid()
        eventSource:        lambda.amazonaws.com
        eventName:          UpdateFunctionCode20150331v2
        eventType:          AwsApiCall
        eventCategory:      Management
        awsRegion:          ref.aws_region
        sourceIPAddress:    ref.source_ip
        userAgent:          ref.user_agent
        errorCode:          ResourceConflictException
        errorMessage:       "The operation cannot be performed at this time. An update is in progress for resource: ${ref.function_arn}"
        requestID:          gen.uuid()
        requestParameters:
          fullyQualifiedArn:
            arnPrefix:
              partition: aws
              region:    ref.aws_region
              account:   ref.account_id
            relativeId:
              functionName: ref.function_name
            functionQualifier: {}
          functionName: ref.function_arn
          publish:      true
          dryRun:       false
        responseElements:   null
        readOnly:           false
        managementEvent:    true
        recipientAccountId: ref.account_id
        userIdentity:       ref.actor
        tlsDetails:
          tlsVersion:               ref.tls_version
          cipherSuite:              ref.tls_cipher
          clientProvidedHostHeader: "lambda.${ref.aws_region}.amazonaws.com"
