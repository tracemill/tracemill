type: scenario
description: |
  Persistence: an IAM user grants any principal ("*") permission to read a
  version of a Lambda layer, limited only by a condition on the caller's
  AWS Organization. Any account that satisfies the condition can download
  the layer's code or attach it to its own functions.
mitre:
  tactics: [persistence]
  techniques: ["T1098"]

state:
  aws_region:    us-east-1
  account_id:    "000000000000"
  actor_name:    gen.username()
  actor:         gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  source_ip:     gen.ipv4()
  user_agent:    "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/lambda#1.72.0 tracemill/1.0"
  tls_version:   "TLSv1.3"
  tls_cipher:    TLS_AES_128_GCM_SHA256
  layer_name:    gen.regex(pattern=[a-z]{8}-deps)
  layer_version: 1
  statement_id:  gen.regex(pattern=[a-z]{8}-share)
  principal:     "*"
  org_id:        gen.regex(pattern=o-[a-z0-9]{10})
  revision_id:   gen.uuid()

steps:
  - emit:
      event_type: aws.cloudtrail@v1
      fields:
        eventVersion:       "1.11"
        eventTime:          gen.timestamp()
        eventID:            gen.uuid()
        eventSource:        lambda.amazonaws.com
        eventName:          AddLayerVersionPermission20181031
        eventType:          AwsApiCall
        eventCategory:      Management
        awsRegion:          ref.aws_region
        sourceIPAddress:    ref.source_ip
        userAgent:          ref.user_agent
        requestID:          gen.uuid()
        requestParameters:
          action:         "lambda:GetLayerVersion"
          layerName:      ref.layer_name
          organizationId: ref.org_id
          principal:      ref.principal
          statementId:    ref.statement_id
          versionNumber:  ref.layer_version
        responseElements:
          revisionId: ref.revision_id
          statement:  '{"Sid":"${ref.statement_id}","Effect":"Allow","Principal":"${ref.principal}","Action":"lambda:GetLayerVersion","Resource":"arn:aws:lambda:${ref.aws_region}:${ref.account_id}:layer:${ref.layer_name}:${ref.layer_version}","Condition":{"StringEquals":{"aws:PrincipalOrgID":"${ref.org_id}"}}}'
        readOnly:           false
        managementEvent:    true
        recipientAccountId: ref.account_id
        userIdentity:       ref.actor
        tlsDetails:
          tlsVersion:               ref.tls_version
          cipherSuite:              ref.tls_cipher
          clientProvidedHostHeader: "lambda.${ref.aws_region}.amazonaws.com"
