type: scenario
description: |
  Discovery: an IAM user reads one Lambda function. GetFunction returns the
  function's configuration, including its environment variables, and a
  presigned URL to download its deployment package, so repeated calls
  across many functions collect their code and embedded secrets.
mitre:
  tactics: [discovery]
  techniques: ["T1526"]

state:
  aws_region:    us-east-1
  account_id:    "000000000000"
  actor_name:    gen.username()
  actor:         gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  source_ip:     gen.ipv4()
  user_agent:    "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/lambda#1.72.0 tracemill/1.0"
  tls_version:   "TLSv1.3"
  tls_cipher:    TLS_AES_128_GCM_SHA256
  function_name: gen.regex(pattern=[a-z]{6,10}-(api|worker|processor|handler))

steps:
  - emit:
      event_type: aws.cloudtrail@v1
      fields:
        eventVersion:       "1.11"
        eventTime:          gen.timestamp()
        eventID:            gen.uuid()
        eventSource:        lambda.amazonaws.com
        eventName:          GetFunction20150331v2
        eventType:          AwsApiCall
        eventCategory:      Management
        awsRegion:          ref.aws_region
        sourceIPAddress:    ref.source_ip
        userAgent:          ref.user_agent
        requestID:          gen.uuid()
        requestParameters:
          functionName: ref.function_name
        responseElements:   null
        readOnly:           true
        managementEvent:    true
        recipientAccountId: ref.account_id
        userIdentity:       ref.actor
        tlsDetails:
          tlsVersion:               ref.tls_version
          cipherSuite:              ref.tls_cipher
          clientProvidedHostHeader: "lambda.${ref.aws_region}.amazonaws.com"
