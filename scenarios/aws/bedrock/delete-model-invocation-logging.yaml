type: scenario
description: |
  Defense evasion: actor deletes the AWS Bedrock model invocation logging
  configuration, removing the audit trail of model interactions for the
  account and region so subsequent model usage leaves no logged record.
mitre:
  tactics: [defense-evasion]
  techniques: [T1562.008]

state:
  aws_region:  us-east-1
  account_id:  "000000000000"
  actor:       gen.aws_identity(type=IAMUser, userName=attacker-user, accountId=ref.account_id)
  source_ip:   gen.ipv4()
  user_agent:  "aws-cli/2.24.22 md/awscrt#0.23.8 ua/2.1 os/linux md/command#bedrock.delete-model-invocation-logging-configuration tracemill/1.0"
  tls_version: "TLSv1.3"
  tls_cipher:  TLS_AES_128_GCM_SHA256

steps:
  - emit:
      event_type: aws.cloudtrail@v1
      fields:
        eventVersion:       "1.09"
        eventTime:          gen.timestamp()
        eventID:            gen.uuid()
        eventSource:        bedrock.amazonaws.com
        eventName:          DeleteModelInvocationLoggingConfiguration
        eventType:          AwsApiCall
        eventCategory:      Management
        awsRegion:          ref.aws_region
        sourceIPAddress:    ref.source_ip
        userAgent:          ref.user_agent
        requestID:          gen.uuid()
        requestParameters:  null
        responseElements:   null
        readOnly:           false
        managementEvent:    true
        recipientAccountId: ref.account_id
        userIdentity:       ref.actor
        tlsDetails:
          tlsVersion:               ref.tls_version
          cipherSuite:              ref.tls_cipher
          clientProvidedHostHeader: "bedrock.${ref.aws_region}.amazonaws.com"
