type: scenario
description: |
  Impact: actor deletes an AWS Bedrock knowledge base, destroying the
  domain-specific data store that backs retrieval-augmented generation
  for downstream models and agents. The action is irreversible and can
  disrupt business operations or remove forensic context after a
  preceding compromise.
mitre:
  tactics: [impact]
  techniques: [T1485]

state:
  aws_region:    us-east-1
  account_id:    "000000000000"
  actor:         gen.aws_identity(type=AssumedRole, accountId=ref.account_id)
  source_ip:     gen.ipv4()
  user_agent:    "aws-cli/2.15.30 Python/3.11.8 Darwin/23.4.0 source/x86_64 prompt/off tracemill/1.0"
  kb_id:         gen.hex(len=10, case=upper)

steps:
  - emit:
      event_type: aws.cloudtrail@v1
      fields:
        eventVersion:       "1.09"
        eventTime:          gen.timestamp()
        eventID:            gen.uuid()
        eventSource:        bedrock.amazonaws.com
        eventName:          DeleteKnowledgeBase
        eventType:          AwsApiCall
        eventCategory:      Management
        awsRegion:          ref.aws_region
        sourceIPAddress:    ref.source_ip
        userAgent:          ref.user_agent
        requestID:          gen.uuid()
        requestParameters:
          knowledgeBaseId:  ref.kb_id
        responseElements:
          knowledgeBaseId:  ref.kb_id
          status:           DELETING
        readOnly:           false
        managementEvent:    true
        recipientAccountId: ref.account_id
        userIdentity:       ref.actor
