type: scenario
description: |
  Collection: an IAM user creates a new single-region CloudTrail trail that
  delivers log files to an S3 bucket of their choosing. A trail the actor
  controls copies the account's API activity to storage they can read, and
  a new trail is also a common first step before tampering with logging.
mitre:
  tactics: [collection]
  techniques: ["T1530"]

state:
  aws_region:  us-east-1
  account_id:  "000000000000"
  actor_name:  gen.username()
  actor:       gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  source_ip:   gen.ipv4()
  user_agent:  "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/cloudtrail#1.46.0 tracemill/1.0"
  tls_version: "TLSv1.3"
  tls_cipher:  TLS_AES_128_GCM_SHA256
  trail_name:  gen.regex(pattern=audit-[a-z]{6})
  bucket_name: gen.regex(pattern=[a-z]{8}-trail-logs)

steps:
  - emit:
      event_type: aws.cloudtrail@v1
      fields:
        eventVersion:       "1.11"
        eventTime:          gen.timestamp()
        eventID:            gen.uuid()
        eventSource:        cloudtrail.amazonaws.com
        eventName:          CreateTrail
        eventType:          AwsApiCall
        eventCategory:      Management
        awsRegion:          ref.aws_region
        sourceIPAddress:    ref.source_ip
        userAgent:          ref.user_agent
        requestID:          gen.uuid()
        requestParameters:
          isMultiRegionTrail: false
          name:               ref.trail_name
          s3BucketName:       ref.bucket_name
        responseElements:
          includeGlobalServiceEvents: true
          isMultiRegionTrail:         false
          isOrganizationTrail:        false
          logFileValidationEnabled:   false
          name:                       ref.trail_name
          recursiveLogging:           true
          s3BucketName:               ref.bucket_name
          trailARN:                   "arn:aws:cloudtrail:${ref.aws_region}:${ref.account_id}:trail/${ref.trail_name}"
        readOnly:           false
        managementEvent:    true
        recipientAccountId: ref.account_id
        userIdentity:       ref.actor
        tlsDetails:
          tlsVersion:               ref.tls_version
          cipherSuite:              ref.tls_cipher
          clientProvidedHostHeader: "cloudtrail.${ref.aws_region}.amazonaws.com"
