type: scenario
description: |
  Defense evasion: an IAM user calls BatchUpdateFindings to set a Security
  Hub finding's workflow status to SUPPRESSED with an "accepted risk" note,
  which would drop it from the active findings view. Security Hub is not
  enabled in the account, so the call is refused with
  InvalidAccessException.
mitre:
  tactics: [defense-evasion]
  techniques: ["T1562"]

state:
  aws_region:  us-east-1
  account_id:  "000000000000"
  actor_name:  gen.username()
  actor:       gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  source_ip:   gen.ipv4()
  user_agent:  "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/securityhub#1.57.0 tracemill/1.0"
  tls_version: "TLSv1.3"
  tls_cipher:  TLS_AES_128_GCM_SHA256
  finding_id:  gen.uuid()
  control_id:  S3.1

steps:
  - emit:
      event_type: aws.cloudtrail@v1
      fields:
        eventVersion:       "1.11"
        eventTime:          gen.timestamp()
        eventID:            gen.uuid()
        eventSource:        securityhub.amazonaws.com
        eventName:          BatchUpdateFindings
        eventType:          AwsApiCall
        eventCategory:      Management
        awsRegion:          ref.aws_region
        sourceIPAddress:    ref.source_ip
        userAgent:          ref.user_agent
        requestID:          gen.uuid()
        errorCode:          InvalidAccessException
        requestParameters:
          FindingIdentifiers:
            - Id:         "arn:aws:securityhub:${ref.aws_region}:${ref.account_id}:subscription/aws-foundational-security-best-practices/v/1.0.0/${ref.control_id}/finding/${ref.finding_id}"
              ProductArn: "arn:aws:securityhub:${ref.aws_region}::product/aws/securityhub"
          Note:
            Text:      Accepted risk
            UpdatedBy: secops
          Workflow:
            Status: SUPPRESSED
        responseElements:
          Code:      InvalidAccessException
          Message:   "Account ${ref.account_id} is not subscribed to AWS Security Hub"
          RequestId: gen.uuid()
          Type:      InvalidAccessException
        readOnly:           false
        managementEvent:    true
        recipientAccountId: ref.account_id
        userIdentity:       ref.actor
        tlsDetails:
          tlsVersion:               ref.tls_version
          cipherSuite:              ref.tls_cipher
          clientProvidedHostHeader: "securityhub.${ref.aws_region}.amazonaws.com"
          keyExchange:              RSA2048
