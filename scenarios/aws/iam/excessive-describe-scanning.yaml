type: scenario
description: |
  Excessive security scanning: a single IAMUser issues a burst of read-only
  Describe API calls spanning many AWS services in quick succession -- the
  signature of an automated cloud-recon tool enumerating the account's
  attack surface. Every call is denied (the principal lacks the
  permissions), but the volume and breadth of distinct API actions from one
  identity is the behavior of interest.

  All events share the same user/account/source IP, so a detection that
  counts the number of DISTINCT read-only API actions per user collapses
  this burst into one identity whose distinct-action count clears the
  reconnaissance threshold. Each entry in `actions` produces one CloudTrail
  event; override `actions` to widen or narrow the surface being scanned.

mitre:
  tactics: [discovery]
  techniques: ["T1526"]

state:
  account_id:  "111122223333"
  aws_region:  us-east-1
  source_ip:   gen.ipv4()
  user_name:   scanner
  user_agent:  "aws-sdk-nodejs/2.885.0 linux/v14.16.1 callback tracemill/1.0"
  actor:       gen.aws_identity(type=IAMUser, userName=ref.user_name, accountId=ref.account_id)

  # Pacing between calls in the burst. Defaults to no delay so the whole scan
  # lands in one tight window; override via job bindings to spread it out.
  # jitter_pct randomises each gap by +/- the given fraction. Keep the total
  # spread well inside the detection's per-user counting window, or the
  # distinct-action count may split across windows and fall under threshold.
  step_delay:  "0s"
  step_jitter: 0

  # Inline default scan surface. Each entry is a record whose fields stay
  # correlated within an iteration (same-row name/source/action). Nested
  # record fields are literals -- they are NOT evaluated as ExprStr -- so any
  # dynamic value (gen.*, ref.*) must be declared as a top-level state
  # variable instead. The list carries more than fifty distinct read-only
  # actions so the per-user distinct-action count clears a reconnaissance
  # threshold in the 50s.
  actions:
    - { event_name: DescribeAccountAttributes, event_source: ec2.amazonaws.com, service_action: "ec2:DescribeAccountAttributes" }
    - { event_name: DescribeActiveReceiptRuleSet, event_source: ses.amazonaws.com, service_action: "ses:DescribeActiveReceiptRuleSet" }
    - { event_name: DescribeAddresses, event_source: ec2.amazonaws.com, service_action: "ec2:DescribeAddresses" }
    - { event_name: DescribeAutoScalingGroups, event_source: autoscaling.amazonaws.com, service_action: "autoscaling:DescribeAutoScalingGroups" }
    - { event_name: DescribeClusterParameterGroups, event_source: redshift.amazonaws.com, service_action: "redshift:DescribeClusterParameterGroups" }
    - { event_name: DescribeClusters, event_source: redshift.amazonaws.com, service_action: "redshift:DescribeClusters" }
    - { event_name: DescribeConfigurationRecorders, event_source: config.amazonaws.com, service_action: "config:DescribeConfigurationRecorders" }
    - { event_name: DescribeConfigurationRecorderStatus, event_source: config.amazonaws.com, service_action: "config:DescribeConfigurationRecorderStatus" }
    - { event_name: DescribeDBClusters, event_source: rds.amazonaws.com, service_action: "rds:DescribeDBClusters" }
    - { event_name: DescribeDBEngineVersions, event_source: rds.amazonaws.com, service_action: "rds:DescribeDBEngineVersions" }
    - { event_name: DescribeDBInstances, event_source: rds.amazonaws.com, service_action: "rds:DescribeDBInstances" }
    - { event_name: DescribeDBParameterGroups, event_source: rds.amazonaws.com, service_action: "rds:DescribeDBParameterGroups" }
    - { event_name: DescribeDBSnapshots, event_source: rds.amazonaws.com, service_action: "rds:DescribeDBSnapshots" }
    - { event_name: DescribeEgressOnlyInternetGateways, event_source: ec2.amazonaws.com, service_action: "ec2:DescribeEgressOnlyInternetGateways" }
    - { event_name: DescribeEmergencyContactSettings, event_source: shield.amazonaws.com, service_action: "shield:DescribeEmergencyContactSettings" }
    - { event_name: DescribeEnvironments, event_source: elasticbeanstalk.amazonaws.com, service_action: "elasticbeanstalk:DescribeEnvironments" }
    - { event_name: DescribeFileSystems, event_source: elasticfilesystem.amazonaws.com, service_action: "elasticfilesystem:DescribeFileSystems" }
    - { event_name: DescribeFlowLogs, event_source: ec2.amazonaws.com, service_action: "ec2:DescribeFlowLogs" }
    - { event_name: DescribeImages, event_source: ec2.amazonaws.com, service_action: "ec2:DescribeImages" }
    - { event_name: DescribeInstanceInformation, event_source: ssm.amazonaws.com, service_action: "ssm:DescribeInstanceInformation" }
    - { event_name: DescribeInstances, event_source: ec2.amazonaws.com, service_action: "ec2:DescribeInstances" }
    - { event_name: DescribeInternetGateways, event_source: ec2.amazonaws.com, service_action: "ec2:DescribeInternetGateways" }
    - { event_name: DescribeIpGroups, event_source: workspaces.amazonaws.com, service_action: "workspaces:DescribeIpGroups" }
    - { event_name: DescribeLaunchConfigurations, event_source: autoscaling.amazonaws.com, service_action: "autoscaling:DescribeLaunchConfigurations" }
    - { event_name: DescribeLoadBalancers, event_source: elasticloadbalancing.amazonaws.com, service_action: "elasticloadbalancing:DescribeLoadBalancers" }
    - { event_name: DescribeLogGroups, event_source: logs.amazonaws.com, service_action: "logs:DescribeLogGroups" }
    - { event_name: DescribeMetricFilters, event_source: logs.amazonaws.com, service_action: "logs:DescribeMetricFilters" }
    - { event_name: DescribeNatGateways, event_source: ec2.amazonaws.com, service_action: "ec2:DescribeNatGateways" }
    - { event_name: DescribeNetworkAcls, event_source: ec2.amazonaws.com, service_action: "ec2:DescribeNetworkAcls" }
    - { event_name: DescribeNetworkInterfaces, event_source: ec2.amazonaws.com, service_action: "ec2:DescribeNetworkInterfaces" }
    - { event_name: DescribeOrganization, event_source: organizations.amazonaws.com, service_action: "organizations:DescribeOrganization" }
    - { event_name: DescribeParameters, event_source: ssm.amazonaws.com, service_action: "ssm:DescribeParameters" }
    - { event_name: DescribeReplicationInstances, event_source: dms.amazonaws.com, service_action: "dms:DescribeReplicationInstances" }
    - { event_name: DescribeRepositories, event_source: ecr.amazonaws.com, service_action: "ecr:DescribeRepositories" }
    - { event_name: DescribeReservedNodes, event_source: redshift.amazonaws.com, service_action: "redshift:DescribeReservedNodes" }
    - { event_name: DescribeRouteTables, event_source: ec2.amazonaws.com, service_action: "ec2:DescribeRouteTables" }
    - { event_name: DescribeSecurityGroups, event_source: ec2.amazonaws.com, service_action: "ec2:DescribeSecurityGroups" }
    - { event_name: DescribeSnapshots, event_source: ec2.amazonaws.com, service_action: "ec2:DescribeSnapshots" }
    - { event_name: DescribeSubnets, event_source: ec2.amazonaws.com, service_action: "ec2:DescribeSubnets" }
    - { event_name: DescribeSubscription, event_source: shield.amazonaws.com, service_action: "shield:DescribeSubscription" }
    - { event_name: DescribeTags, event_source: ec2.amazonaws.com, service_action: "ec2:DescribeTags" }
    - { event_name: DescribeTargetGroups, event_source: elasticloadbalancing.amazonaws.com, service_action: "elasticloadbalancing:DescribeTargetGroups" }
    - { event_name: DescribeTrails, event_source: cloudtrail.amazonaws.com, service_action: "cloudtrail:DescribeTrails" }
    - { event_name: DescribeTrustedAdvisorChecks, event_source: support.amazonaws.com, service_action: "support:DescribeTrustedAdvisorChecks" }
    - { event_name: DescribeVolumes, event_source: ec2.amazonaws.com, service_action: "ec2:DescribeVolumes" }
    - { event_name: DescribeVpcEndpoints, event_source: ec2.amazonaws.com, service_action: "ec2:DescribeVpcEndpoints" }
    - { event_name: DescribeVpcEndpointServices, event_source: ec2.amazonaws.com, service_action: "ec2:DescribeVpcEndpointServices" }
    - { event_name: DescribeVpcPeeringConnections, event_source: ec2.amazonaws.com, service_action: "ec2:DescribeVpcPeeringConnections" }
    - { event_name: DescribeVpcs, event_source: ec2.amazonaws.com, service_action: "ec2:DescribeVpcs" }
    - { event_name: DescribeVpnConnections, event_source: ec2.amazonaws.com, service_action: "ec2:DescribeVpnConnections" }
    - { event_name: DescribeVpnGateways, event_source: ec2.amazonaws.com, service_action: "ec2:DescribeVpnGateways" }
    - { event_name: DescribeWorkspaceDirectories, event_source: workspaces.amazonaws.com, service_action: "workspaces:DescribeWorkspaceDirectories" }
    - { event_name: DescribeWorkspaces, event_source: workspaces.amazonaws.com, service_action: "workspaces:DescribeWorkspaces" }

steps:
  - foreach:
      in: ref.actions       # required; ref.<var> only
      as: action            # required; dot-free; the per-iteration binding name
      steps:
        - emit:
            event_type: aws.cloudtrail@v1
            fields:
              eventVersion:       "1.08"
              eventTime:          gen.timestamp()
              eventID:            gen.uuid()
              eventSource:        ref.action.event_source
              eventName:          ref.action.event_name
              eventType:          AwsApiCall
              eventCategory:      Management
              awsRegion:          ref.aws_region
              sourceIPAddress:    ref.source_ip
              userAgent:          ref.user_agent
              errorCode:          AccessDenied
              errorMessage:       "User: ${ref.actor.arn} is not authorized to perform: ${ref.action.service_action}"
              requestID:          gen.uuid()
              requestParameters:  null
              responseElements:   null
              readOnly:           true
              managementEvent:    true
              recipientAccountId: ref.account_id
              userIdentity:       ref.actor
        - wait:
            duration:   ref.step_delay
            jitter_pct: ref.step_jitter
