    - { event_name: DescribeTable, event_source: dynamodb.amazonaws.com, service_action: "dynamodb:DescribeTable", session_name: recon-session-03, access_key_id: ASIAEXAMPLE0000000S3, error_code: "AccessDenied", host_header: "dynamodb.us-east-1.amazonaws.com" }
