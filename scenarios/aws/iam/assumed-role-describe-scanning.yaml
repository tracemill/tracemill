type: scenario
description: |
  Excessive security scanning by a role-assuming principal: an automated recon
  tool assumes one IAM role across 5 sessions and enumerates the account's
  attack surface with read-only Describe and Get calls spanning many AWS
  services. Every call is denied (the role carries no permissions); the breadth
  of distinct read-only actions performed under a single role is the behavior
  of interest.

  All sessions share the role, account, source IP and user agent; only the
  session name (the last segment of the assumed-role ARN) varies. The scan
  covers 60 distinct actions split across the sessions (~12 each). Each
  entry in `actions` produces one CloudTrail event and carries its own session
  name; override `actions` to change the scanned surface.

mitre:
  tactics: [discovery]
  techniques: ["T1526"]

state:
  account_id:  "111122223333"
  aws_region:  us-east-1
  source_ip:   gen.ipv4()
  user_agent:  "aws-cli/2.31.27 md/awscrt#0.27.6 ua/2.1 os/linux#6.1.0 md/arch#x86_64 lang/python#3.13.9 md/pyimpl#CPython cfg/retry-mode#standard md/installer#exe"

  # The single role every session assumes. `role_principal_id` is the role's
  # stable AROA principal id (the part before the ':' in an assumed-role
  # principalId).
  role_name:          recon-role
  role_principal_id:  AROAEXAMPLE00000RECON

  # Pacing between calls in the burst. Defaults to no delay so the whole scan
  # lands in one tight window; override via job bindings to spread it out.
  # jitter_pct randomises each gap by +/- the given fraction.
  step_delay:  "0s"
  step_jitter: 0

  # Inline scan surface. Each entry is a record whose fields stay correlated
  # within an iteration (same-row name/source/action/session). Nested record
  # fields are evaluated per row, so `session_name` drives the assumed-role ARN
  # and principalId built in the emit step below. The list carries 60
  # distinct read-only actions across 5 session names.
  actions:
    - { event_name: DescribeLogStreams, event_source: logs.amazonaws.com, service_action: "logs:DescribeLogStreams", session_name: recon-session-01, access_key_id: ASIAEXAMPLE0000000S1, error_code: "AccessDenied", host_header: "logs.us-east-1.amazonaws.com" }
    - { event_name: DescribeLoggingConfiguration, event_source: network-firewall.amazonaws.com, service_action: "network-firewall:DescribeLoggingConfiguration", session_name: recon-session-01, access_key_id: ASIAEXAMPLE0000000S1, error_code: "AccessDenied", host_header: "network-firewall.us-east-1.amazonaws.com" }
    - { event_name: DescribeNatGateways, event_source: ec2.amazonaws.com, service_action: "ec2:DescribeNatGateways", session_name: recon-session-01, access_key_id: ASIAEXAMPLE0000000S1, error_code: "Client.UnauthorizedOperation", host_header: "ec2.us-east-1.amazonaws.com" }
    - { event_name: DescribeNetworkAcls, event_source: ec2.amazonaws.com, service_action: "ec2:DescribeNetworkAcls", session_name: recon-session-01, access_key_id: ASIAEXAMPLE0000000S1, error_code: "Client.UnauthorizedOperation", host_header: "ec2.us-east-1.amazonaws.com" }
    - { event_name: DescribeNetworkInterfaces, event_source: ec2.amazonaws.com, service_action: "ec2:DescribeNetworkInterfaces", session_name: recon-session-01, access_key_id: ASIAEXAMPLE0000000S1, error_code: "Client.UnauthorizedOperation", host_header: "ec2.us-east-1.amazonaws.com" }
    - { event_name: DescribeNotebookInstance, event_source: sagemaker.amazonaws.com, service_action: "sagemaker:DescribeNotebookInstance", session_name: recon-session-01, access_key_id: ASIAEXAMPLE0000000S1, error_code: "AccessDenied", host_header: "sagemaker.us-east-1.amazonaws.com" }
    - { event_name: DescribeOrganizationConfiguration, event_source: guardduty.amazonaws.com, service_action: "guardduty:DescribeOrganizationConfiguration", session_name: recon-session-01, access_key_id: ASIAEXAMPLE0000000S1, error_code: "AccessDenied", host_header: "guardduty.us-east-1.amazonaws.com" }
    - { event_name: DescribeAccountAttributes, event_source: ec2.amazonaws.com, service_action: "ec2:DescribeAccountAttributes", session_name: recon-session-01, access_key_id: ASIAEXAMPLE0000000S1, error_code: "Client.UnauthorizedOperation", host_header: "ec2.us-east-1.amazonaws.com" }
    - { event_name: DescribeActiveReceiptRuleSet, event_source: ses.amazonaws.com, service_action: "ses:DescribeActiveReceiptRuleSet", session_name: recon-session-01, access_key_id: ASIAEXAMPLE0000000S1, error_code: "AccessDenied", host_header: "ses.us-east-1.amazonaws.com" }
    - { event_name: DescribeAddresses, event_source: ec2.amazonaws.com, service_action: "ec2:DescribeAddresses", session_name: recon-session-01, access_key_id: ASIAEXAMPLE0000000S1, error_code: "Client.UnauthorizedOperation", host_header: "ec2.us-east-1.amazonaws.com" }
    - { event_name: DescribeAutoScalingGroups, event_source: autoscaling.amazonaws.com, service_action: "autoscaling:DescribeAutoScalingGroups", session_name: recon-session-01, access_key_id: ASIAEXAMPLE0000000S1, error_code: "AccessDenied", host_header: "autoscaling.us-east-1.amazonaws.com" }
    - { event_name: DescribeClusterParameterGroups, event_source: redshift.amazonaws.com, service_action: "redshift:DescribeClusterParameterGroups", session_name: recon-session-01, access_key_id: ASIAEXAMPLE0000000S1, error_code: "AccessDenied", host_header: "redshift.us-east-1.amazonaws.com" }
    - { event_name: DescribeRepositories, event_source: ecr.amazonaws.com, service_action: "ecr:DescribeRepositories", session_name: recon-session-02, access_key_id: ASIAEXAMPLE0000000S2, error_code: "AccessDenied", host_header: "ecr.us-east-1.amazonaws.com" }
    - { event_name: DescribeReservedDBInstances, event_source: rds.amazonaws.com, service_action: "rds:DescribeReservedDBInstances", session_name: recon-session-02, access_key_id: ASIAEXAMPLE0000000S2, error_code: "AccessDenied", host_header: "rds.us-east-1.amazonaws.com" }
    - { event_name: DescribeReservedInstances, event_source: ec2.amazonaws.com, service_action: "ec2:DescribeReservedInstances", session_name: recon-session-02, access_key_id: ASIAEXAMPLE0000000S2, error_code: "Client.UnauthorizedOperation", host_header: "ec2.us-east-1.amazonaws.com" }
    - { event_name: DescribeReservedInstancesListings, event_source: ec2.amazonaws.com, service_action: "ec2:DescribeReservedInstancesListings", session_name: recon-session-02, access_key_id: ASIAEXAMPLE0000000S2, error_code: "Client.UnauthorizedOperation", host_header: "ec2.us-east-1.amazonaws.com" }
    - { event_name: DescribeRouteTables, event_source: ec2.amazonaws.com, service_action: "ec2:DescribeRouteTables", session_name: recon-session-02, access_key_id: ASIAEXAMPLE0000000S2, error_code: "Client.UnauthorizedOperation", host_header: "ec2.us-east-1.amazonaws.com" }
    - { event_name: DescribeRules, event_source: elasticloadbalancing.amazonaws.com, service_action: "elasticloadbalancing:DescribeRules", session_name: recon-session-02, access_key_id: ASIAEXAMPLE0000000S2, error_code: "AccessDenied", host_header: "elasticloadbalancing.us-east-1.amazonaws.com" }
    - { event_name: DescribeSecurityGroupRules, event_source: ec2.amazonaws.com, service_action: "ec2:DescribeSecurityGroupRules", session_name: recon-session-02, access_key_id: ASIAEXAMPLE0000000S2, error_code: "Client.UnauthorizedOperation", host_header: "ec2.us-east-1.amazonaws.com" }
    - { event_name: DescribeClusters, event_source: redshift.amazonaws.com, service_action: "redshift:DescribeClusters", session_name: recon-session-02, access_key_id: ASIAEXAMPLE0000000S2, error_code: "AccessDenied", host_header: "redshift.us-east-1.amazonaws.com" }
    - { event_name: DescribeConfigurationRecorders, event_source: config.amazonaws.com, service_action: "config:DescribeConfigurationRecorders", session_name: recon-session-02, access_key_id: ASIAEXAMPLE0000000S2, error_code: "AccessDenied", host_header: "config.us-east-1.amazonaws.com" }
    - { event_name: DescribeConfigurationRecorderStatus, event_source: config.amazonaws.com, service_action: "config:DescribeConfigurationRecorderStatus", session_name: recon-session-02, access_key_id: ASIAEXAMPLE0000000S2, error_code: "AccessDenied", host_header: "config.us-east-1.amazonaws.com" }
    - { event_name: DescribeDBClusters, event_source: rds.amazonaws.com, service_action: "rds:DescribeDBClusters", session_name: recon-session-02, access_key_id: ASIAEXAMPLE0000000S2, error_code: "AccessDenied", host_header: "rds.us-east-1.amazonaws.com" }
    - { event_name: DescribeDBInstances, event_source: rds.amazonaws.com, service_action: "rds:DescribeDBInstances", session_name: recon-session-02, access_key_id: ASIAEXAMPLE0000000S2, error_code: "AccessDenied", host_header: "rds.us-east-1.amazonaws.com" }
    - { event_name: DescribeSecurityGroups, event_source: ec2.amazonaws.com, service_action: "ec2:DescribeSecurityGroups", session_name: recon-session-03, access_key_id: ASIAEXAMPLE0000000S3, error_code: "Client.UnauthorizedOperation", host_header: "ec2.us-east-1.amazonaws.com" }
    - { event_name: DescribeSnapshots, event_source: ec2.amazonaws.com, service_action: "ec2:DescribeSnapshots", session_name: recon-session-03, access_key_id: ASIAEXAMPLE0000000S3, error_code: "Client.UnauthorizedOperation", host_header: "ec2.us-east-1.amazonaws.com" }
    - { event_name: DescribeStacks, event_source: cloudformation.amazonaws.com, service_action: "cloudformation:DescribeStacks", session_name: recon-session-03, access_key_id: ASIAEXAMPLE0000000S3, error_code: "AccessDenied", host_header: "cloudformation.us-east-1.amazonaws.com" }
    - { event_name: DescribeStream, event_source: kinesis.amazonaws.com, service_action: "kinesis:DescribeStream", session_name: recon-session-03, access_key_id: ASIAEXAMPLE0000000S3, error_code: "AccessDenied", host_header: "kinesis.us-east-1.amazonaws.com" }
