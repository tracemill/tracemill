    - { event_name: DescribeUserProfiles, event_source: opsworks.amazonaws.com, service_action: "opsworks:DescribeUserProfiles", session_name: recon-session-04, access_key_id: ASIAEXAMPLE0000000S4, error_code: "AccessDenied", host_header: "opsworks.us-east-1.amazonaws.com" }
    - { event_name: DescribeVolumes, event_source: ec2.amazonaws.com, service_action: "ec2:DescribeVolumes", session_name: recon-session-04, access_key_id: ASIAEXAMPLE0000000S4, error_code: "Client.UnauthorizedOperation", host_header: "ec2.us-east-1.amazonaws.com" }
    - { event_name: DescribeVpcEndpointServicePermissions, event_source: ec2.amazonaws.com, service_action: "ec2:DescribeVpcEndpointServicePermissions", session_name: recon-session-04, access_key_id: ASIAEXAMPLE0000000S4, error_code: "Client.UnauthorizedOperation", host_header: "ec2.us-east-1.amazonaws.com" }
