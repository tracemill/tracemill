steps:
  - foreach:
      in: ref.actions       # required; ref.<var> only
      as: action            # required; dot-free; the per-iteration binding name
      steps:
        - emit:
            event_type: aws.cloudtrail@v1
            fields:
              eventVersion:       "1.11"
              eventTime:          gen.timestamp()
              eventID:            gen.uuid()
              eventSource:        ref.action.event_source
              eventName:          ref.action.event_name
              eventType:          AwsApiCall
              eventCategory:      Management
              awsRegion:          ref.aws_region
              sourceIPAddress:    ref.source_ip
              userAgent:          ref.user_agent
              errorCode:          ref.action.error_code
              errorMessage:       "User: arn:aws:sts::${ref.account_id}:assumed-role/${ref.role_name}/${ref.action.session_name} is not authorized to perform: ${ref.action.service_action}"
              requestParameters:  null
              responseElements:   null
              requestID:          gen.uuid()
              readOnly:           true
              managementEvent:    true
              recipientAccountId: ref.account_id
              tlsDetails:
                tlsVersion:               "TLSv1.3"
                cipherSuite:              "TLS_AES_128_GCM_SHA256"
                clientProvidedHostHeader: ref.action.host_header
              userIdentity:
                type:        AssumedRole
                principalId: "${ref.role_principal_id}:${ref.action.session_name}"
                arn:         "arn:aws:sts::${ref.account_id}:assumed-role/${ref.role_name}/${ref.action.session_name}"
                accountId:   ref.account_id
                accessKeyId: ref.action.access_key_id
                sessionContext:
                  sessionIssuer:
                    type:        Role
                    principalId: ref.role_principal_id
                    arn:         "arn:aws:iam::${ref.account_id}:role/${ref.role_name}"
                    accountId:   ref.account_id
                    userName:    ref.role_name
                  attributes:
                    creationDate:     gen.timestamp()
                    mfaAuthenticated: "false"
        - wait:
            duration:   ref.step_delay
            jitter_pct: ref.step_jitter
