type: scenario
description: |
  Benign control: an actor whose role lacks iam:UpdateAccountPasswordPolicy
  attempts the rewrite and is refused. The policy is unchanged, so this must
  not be reported as a password policy change.
state:
  aws_region:    us-east-1
  account_id:    "111111111111"
  actor:         gen.aws_identity(type=AssumedRole, accountId=ref.account_id)
  source_ip:     gen.ipv4()
  user_agent:    "aws-cli/2.31.27 md/awscrt#0.27.6 ua/2.1 os/linux md/arch#x86_64 lang/python#3.13.9 md/pyimpl#CPython cfg/retry-mode#standard md/command#iam.update-account-password-policy tracemill/1.0"
  tls_version:   "TLSv1.3"
  tls_cipher:    TLS_AES_128_GCM_SHA256
  error_code:    AccessDenied
  error_message: "User: ${ref.actor.arn} is not authorized to perform: iam:UpdateAccountPasswordPolicy on resource: arn:aws:iam::${ref.account_id}:root because no identity-based policy allows the iam:UpdateAccountPasswordPolicy action"

steps:
  - emit:
      event_type: aws.cloudtrail@v1
      fields:
        eventVersion:       "1.11"
        eventTime:          gen.timestamp()
        eventID:            gen.uuid()
        eventSource:        iam.amazonaws.com
        eventName:          UpdateAccountPasswordPolicy
        eventType:          AwsApiCall
        eventCategory:      Management
        awsRegion:          ref.aws_region
        sourceIPAddress:    ref.source_ip
        userAgent:          ref.user_agent
        requestID:          gen.uuid()
        errorCode:          ref.error_code
        errorMessage:       ref.error_message
        requestParameters:
          minimumPasswordLength:      6
          requireSymbols:             true
          requireNumbers:             false
          requireUppercaseCharacters: false
          requireLowercaseCharacters: false
          allowUsersToChangePassword: false
          hardExpiry:                 false
        responseElements:   null
        readOnly:           false
        managementEvent:    true
        recipientAccountId: ref.account_id
        userIdentity:       ref.actor
        tlsDetails:
          tlsVersion:               ref.tls_version
          cipherSuite:              ref.tls_cipher
          clientProvidedHostHeader: iam.amazonaws.com
