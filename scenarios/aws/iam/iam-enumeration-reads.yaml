type: scenario
description: |
  Discovery: one identity walks the account's IAM configuration with eight
  different read calls: the account summary, the user and role lists, one
  user and one role in detail, the user's attached policies, the account
  alias and the customer-managed policies. It is the survey an actor runs
  right after gaining access, to learn who holds which permissions.

  The inspected user and role names are bindable, as is the pacing.
  Master events: sandbox capture (success), CloudTrail GetAccountSummary,
  ListUsers, ListRoles, GetUser, GetRole, ListAttachedUserPolicies,
  ListAccountAliases and ListPolicies, 2026-09-22.
mitre:
  tactics: [discovery]
  techniques: ["T1087.004", "T1069.003"]

state:
  aws_region:  us-east-1
  account_id:  "000000000000"
  actor_name:  gen.username()
  actor:       gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  source_ip:   gen.ipv4()
  user_agent:  "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/iam#1.44.0 tracemill/1.0"
  tls_version: "TLSv1.3"
  tls_cipher:  TLS_AES_128_GCM_SHA256
  user_name:   gen.username()
  role_name:   gen.username()
  step_delay:  "1s"
  step_jitter: 0.3

steps:
  - emit:
      event_type: aws.cloudtrail@v1
      fields:
        eventVersion:       "1.11"
        eventTime:          gen.timestamp()
        eventID:            gen.uuid()
        eventSource:        iam.amazonaws.com
        eventName:          GetAccountSummary
        eventType:          AwsApiCall
        eventCategory:      Management
        awsRegion:          ref.aws_region
        sourceIPAddress:    ref.source_ip
        userAgent:          ref.user_agent
        requestID:          gen.uuid()
        requestParameters:   null
        responseElements:    null
        readOnly:           true
        managementEvent:    true
        recipientAccountId: ref.account_id
        userIdentity:       ref.actor
        tlsDetails:
          tlsVersion:               ref.tls_version
          cipherSuite:              ref.tls_cipher
          clientProvidedHostHeader: iam.amazonaws.com
  - wait:
      duration:   ref.step_delay
      jitter_pct: ref.step_jitter
  - emit:
      event_type: aws.cloudtrail@v1
      fields:
        eventVersion:       "1.11"
        eventTime:          gen.timestamp()
        eventID:            gen.uuid()
        eventSource:        iam.amazonaws.com
        eventName:          ListUsers
