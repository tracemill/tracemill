type: scenario
description: |
  Defense evasion / persistence: actor rewrites the account IAM password
  policy to the weakest settings the API accepts -- six-character minimum,
  no character-class requirement, and users barred from rotating their own
  password.
mitre:
  tactics: [defense-evasion, persistence]
  techniques: [T1556]

state:
  aws_region:          us-east-1
  account_id:          "111111111111"
  actor:               gen.aws_identity(type=AssumedRole, accountId=ref.account_id)
  source_ip:           gen.ipv4()
  user_agent:          "aws-cli/2.31.27 md/awscrt#0.27.6 ua/2.1 os/linux md/arch#x86_64 lang/python#3.13.9 md/pyimpl#CPython cfg/retry-mode#standard md/command#iam.update-account-password-policy tracemill/1.0"
  tls_version:         "TLSv1.3"
  tls_cipher:          TLS_AES_128_GCM_SHA256
  min_password_length: 6  # API floor; valid range is 6-128.

steps:
  - emit:
      event_type: aws.cloudtrail@v1
      fields:
        eventVersion:       "1.11"
        eventTime:          gen.timestamp()
        eventID:            gen.uuid()
        eventSource:        iam.amazonaws.com
        eventName:          UpdateAccountPasswordPolicy
        eventType:          AwsApiCall
        eventCategory:      Management
        awsRegion:          ref.aws_region
        sourceIPAddress:    ref.source_ip
        userAgent:          ref.user_agent
        requestID:          gen.uuid()
        # No partial update: parameters the caller omits revert to their
        # defaults, so a real call always carries the whole set.
        requestParameters:
          minimumPasswordLength:      ref.min_password_length
          requireSymbols:             true
          requireNumbers:             false
          requireUppercaseCharacters: false
          requireLowercaseCharacters: false
          allowUsersToChangePassword: false
          hardExpiry:                 false
        responseElements:   null
        readOnly:           false
        managementEvent:    true
        recipientAccountId: ref.account_id
        userIdentity:       ref.actor
        tlsDetails:
          tlsVersion:               ref.tls_version
          cipherSuite:              ref.tls_cipher
          clientProvidedHostHeader: iam.amazonaws.com
