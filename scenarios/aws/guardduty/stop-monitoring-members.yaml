type: scenario
description: |
  Defense evasion: an IAM user asks the GuardDuty administrator detector
  to stop monitoring a member account. The call succeeds; the response
  lists the account under unprocessedAccounts because it is not an
  associated member of this administrator.
mitre:
  tactics: [defense-evasion]
  techniques: ["T1562.001"]

state:
  aws_region:  us-east-1
  account_id:  "000000000000"
  actor_name:  gen.username()
  actor:       gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  source_ip:   gen.ipv4()
  user_agent:  "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/guardduty#1.54.0 tracemill/1.0"
  tls_version: "TLSv1.3"
  tls_cipher:  TLS_AES_128_GCM_SHA256
  detector_id:       gen.regex(pattern=[0-9a-f]{32})
  member_account_id: gen.regex(pattern=[0-9]{12})

steps:
  - emit:
      event_type: aws.cloudtrail@v1
      fields:
        eventVersion:       "1.11"
        eventTime:          gen.timestamp()
        eventID:            gen.uuid()
        eventSource:        guardduty.amazonaws.com
        eventName:          StopMonitoringMembers
        eventType:          AwsApiCall
        eventCategory:      Management
        awsRegion:          ref.aws_region
        sourceIPAddress:    ref.source_ip
        userAgent:          ref.user_agent
        requestID:          gen.uuid()
        requestParameters:
          accountIds: [ref.member_account_id]
          detectorId: ref.detector_id
        responseElements:
          unprocessedAccounts:
            - accountId: ref.member_account_id
              result:    "The request is rejected because the given account ID is not an associated member of the current account."
        readOnly:           false
        managementEvent:    true
        recipientAccountId: ref.account_id
        userIdentity:       ref.actor
        tlsDetails:
          tlsVersion:  ref.tls_version
          cipherSuite: ref.tls_cipher
