type: scenario
description: |
  An actor creates an AWS DataSync task with CreateTask, defining an automated
  transfer from a private source location to an attacker-controlled destination (T1119).
mitre:
  tactics: [collection]
  techniques: [T1119]

state:
  aws_region:      us-east-1
  dest_region:     us-west-2
  account_id:      "111111111111"
  actor:           gen.aws_identity(type=AssumedRole, accountId=ref.account_id)
  source_ip:       gen.ipv4()
  user_agent:      "aws-cli/2.15.30 Python/3.11.8 Linux/6.5.0-1018-aws exec-env/CloudShell exe/x86_64.amzn.2 prompt/off tracemill/1.0"
  src_loc_hex:     gen.hex(len=17, case=lower)
  dst_loc_hex:     gen.hex(len=17, case=lower)
  task_hex:        gen.hex(len=17, case=lower)
  source_location: "arn:aws:datasync:${ref.aws_region}:${ref.account_id}:location/loc-${ref.src_loc_hex}"
  dest_location:   "arn:aws:datasync:${ref.dest_region}:${ref.account_id}:location/loc-${ref.dst_loc_hex}"
  log_group:       "arn:aws:logs:${ref.aws_region}:${ref.account_id}:log-group:/aws/datasync"
  task_arn:        "arn:aws:datasync:${ref.aws_region}:${ref.account_id}:task/task-${ref.task_hex}"
  request_uuid:    gen.uuid()

steps:
  - emit:
      event_type: aws.cloudtrail@v1
      fields:
        eventVersion:       "1.08"
        eventTime:          gen.timestamp()
        eventID:            gen.uuid()
        eventSource:        datasync.amazonaws.com
        eventName:          CreateTask
        eventType:          AwsApiCall
        eventCategory:      Management
        awsRegion:          ref.aws_region
        sourceIPAddress:    ref.source_ip
        userAgent:          ref.user_agent
        requestID:          ref.request_uuid
        requestParameters:
          sourceLocationArn:      ref.source_location
          destinationLocationArn: ref.dest_location
          cloudWatchLogGroupArn:  ref.log_group
          options:
            verifyMode: ONLY_FILES_TRANSFERRED
            logLevel:   BASIC
          excludes: []
          schedule:
            scheduleExpression: "cron(0 * * * ? *)"
          tags: []
          includes: []
        responseElements:
          taskArn: ref.task_arn
        readOnly:           false
        managementEvent:    true
        recipientAccountId: ref.account_id
        userIdentity:       ref.actor
        sessionCredentialFromConsole: "true"
        tlsDetails:
          tlsVersion:               TLSv1.2
          cipherSuite:              ECDHE-RSA-AES128-GCM-SHA256
          clientProvidedHostHeader: "datasync.${ref.aws_region}.amazonaws.com"
