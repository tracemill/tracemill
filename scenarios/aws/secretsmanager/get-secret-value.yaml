type: scenario
description: |
  Credential access: an IAM user reads a secret from AWS Secrets Manager with
  GetSecretValue. The record names the secret that was read; the secret
  value itself is never logged.
mitre:
  tactics: [credential-access]
  techniques: ["T1555.006"]

state:
  aws_region:  us-east-1
  account_id:  "000000000000"
  actor_name:  gen.username()
  actor:       gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  source_ip:   gen.ipv4()
  user_agent:  "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/secretsmanager#1.35.0 tracemill/1.0"
  tls_version: "TLSv1.3"
  tls_cipher:  TLS_AES_128_GCM_SHA256
  secret_id:   gen.regex(pattern=(prod|staging|shared)/[a-z]{6}-[a-z]{5}-[0-9]{4})

steps:
  - emit:
      event_type: aws.cloudtrail@v1
      fields:
        eventVersion:       "1.11"
        eventTime:          gen.timestamp()
        eventID:            gen.uuid()
        eventSource:        secretsmanager.amazonaws.com
        eventName:          GetSecretValue
        eventType:          AwsApiCall
        eventCategory:      Management
        awsRegion:          ref.aws_region
        sourceIPAddress:    ref.source_ip
        userAgent:          ref.user_agent
        requestID:          gen.uuid()
        requestParameters:
          secretId: ref.secret_id
        responseElements:   null
        readOnly:           true
        managementEvent:    true
        recipientAccountId: ref.account_id
        userIdentity:       ref.actor
        tlsDetails:
          tlsVersion:               ref.tls_version
          cipherSuite:              ref.tls_cipher
          keyExchange:              x25519
          clientProvidedHostHeader: "secretsmanager.${ref.aws_region}.amazonaws.com"
