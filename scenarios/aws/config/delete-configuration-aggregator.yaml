type: scenario
description: |
  Defense evasion: an IAM user deletes an AWS Config configuration
  aggregator. The aggregator is the multi-account, multi-region view of
  resource configuration and compliance; deleting it removes that view
  without touching the recorders that feed it.
mitre:
  tactics: [defense-evasion]
  techniques: ["T1562.001"]

state:
  aws_region:      us-east-1
  account_id:      "000000000000"
  actor_name:      gen.username()
  actor:           gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  source_ip:       gen.ipv4()
  user_agent:      "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/configservice#1.52.0 tracemill/1.0"
  tls_version:     "TLSv1.3"
  tls_cipher:      TLS_AES_128_GCM_SHA256
  aggregator_name: gen.regex(pattern=org-[a-z]{6}-aggregator)

steps:
  - emit:
      event_type: aws.cloudtrail@v1
      fields:
        eventVersion:       "1.11"
        eventTime:          gen.timestamp()
        eventID:            gen.uuid()
        eventSource:        config.amazonaws.com
        eventName:          DeleteConfigurationAggregator
        eventType:          AwsApiCall
        eventCategory:      Management
        awsRegion:          ref.aws_region
        sourceIPAddress:    ref.source_ip
        userAgent:          ref.user_agent
        requestID:          gen.uuid()
        requestParameters:
          configurationAggregatorName: ref.aggregator_name
        responseElements:   null
        readOnly:           false
        managementEvent:    true
        recipientAccountId: ref.account_id
        userIdentity:       ref.actor
        tlsDetails:
          tlsVersion:               ref.tls_version
          cipherSuite:              ref.tls_cipher
          clientProvidedHostHeader: "config.${ref.aws_region}.amazonaws.com"
          keyExchange:              secp256r1
