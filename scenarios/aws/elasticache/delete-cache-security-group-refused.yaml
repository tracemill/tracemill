type: scenario
description: |
  Defense evasion: an IAM user tries to delete an ElastiCache cache
  security group, the EC2-Classic mechanism that controls which EC2
  security groups may reach a cache cluster. The account has no
  EC2-Classic, so ElastiCache refuses the call with
  InvalidParameterValueException and CloudTrail records the attempt with
  that error.
mitre:
  tactics: [defense-evasion]
  techniques: ["T1562.007"]

state:
  aws_region:          us-east-1
  account_id:          "000000000000"
  actor_name:          gen.username()
  actor:               gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  source_ip:           gen.ipv4()
  user_agent:          "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/elasticache#1.46.0 tracemill/1.0"
  tls_version:         "TLSv1.3"
  tls_cipher:          TLS_AES_128_GCM_SHA256
  security_group_name: gen.regex(pattern=[a-z]{8}-cache-sg)

steps:
  - emit:
      event_type: aws.cloudtrail@v1
      fields:
        eventVersion:       "1.11"
        eventTime:          gen.timestamp()
        eventID:            gen.uuid()
        eventSource:        elasticache.amazonaws.com
        eventName:          DeleteCacheSecurityGroup
        eventType:          AwsApiCall
        eventCategory:      Management
        awsRegion:          ref.aws_region
        sourceIPAddress:    ref.source_ip
        userAgent:          ref.user_agent
        requestID:          gen.uuid()
        errorCode:          InvalidParameterValueException
        errorMessage:       "Use of cache security groups is not permitted in this API version for your account."
        requestParameters:
          cacheSecurityGroupName: ref.security_group_name
        responseElements:   null
        readOnly:           false
        managementEvent:    true
        recipientAccountId: ref.account_id
        userIdentity:       ref.actor
        tlsDetails:
          tlsVersion:               ref.tls_version
          cipherSuite:              ref.tls_cipher
          clientProvidedHostHeader: "elasticache.${ref.aws_region}.amazonaws.com"
          keyExchange:              secp256r1
