type: scenario
description: |
  An actor imports externally generated key material into a KMS key created
  with origin EXTERNAL. Whoever holds a copy of that material can decrypt
  data protected by the key outside AWS, and can later delete the material
  to make the data unrecoverable.
mitre:
  tactics: [persistence, impact]
  techniques: ["T1098", "T1486"]

state:
  aws_region:  us-east-1
  account_id:  "000000000000"
  actor_name:  gen.username()
  actor:       gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  source_ip:   gen.ipv4()
  user_agent:  "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/kms#1.38.0 tracemill/1.0"
  tls_version: "TLSv1.3"
  tls_cipher:  TLS_AES_256_GCM_SHA384
  request_id:  gen.uuid()
  key_id:      gen.uuid()
  key_arn:     "arn:aws:kms:${ref.aws_region}:${ref.account_id}:key/${ref.key_id}"
  key_material_id: gen.hex(len=64, case=lower)
  expiration_model: KEY_MATERIAL_DOES_NOT_EXPIRE

steps:
  - emit:
      event_type: aws.cloudtrail@v1
      fields:
        eventVersion:       "1.11"
        eventTime:          gen.timestamp()
        eventID:            gen.uuid()
        eventSource:        kms.amazonaws.com
        eventName:          ImportKeyMaterial
        eventType:          AwsApiCall
        eventCategory:      Management
        awsRegion:          ref.aws_region
        sourceIPAddress:    ref.source_ip
        userAgent:          ref.user_agent
        requestID:          ref.request_id
        requestParameters:
          expirationModel: ref.expiration_model
          keyId:           ref.key_id
        responseElements:
          keyId:         ref.key_arn
          keyMaterialId: ref.key_material_id
        readOnly:           false
        managementEvent:    true
        recipientAccountId: ref.account_id
        userIdentity:       ref.actor
        resources:
          - ARN:       ref.key_arn
            accountId: ref.account_id
            type:      "AWS::KMS::Key"
        tlsDetails:
          tlsVersion:               ref.tls_version
          cipherSuite:              ref.tls_cipher
          clientProvidedHostHeader: "kms.${ref.aws_region}.amazonaws.com"
          keyExchange:              x25519
