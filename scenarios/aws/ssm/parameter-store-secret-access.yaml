type: scenario
description: |
  Credential access: an actor lists the SSM Parameter Store with
  DescribeParameters and then reads a secret parameter by name with
  GetParameter and withDecryption set, so the plaintext of a SecureString is
  returned. The pair is the signal -- an application reads the one parameter
  it already knows about, while an actor has to enumerate first and only then
  knows what to fetch. Both calls share one identity and source address.
  See https://docs.aws.amazon.com/systems-manager/latest/APIReference/API_GetParameter.html
mitre:
  tactics: [credential-access, collection]
  techniques: [T1552.006, T1119]

state:
  aws_region:     us-east-1
  account_id:     "111122223333"
  user_name:      scanner
  actor:          gen.aws_identity(type=IAMUser, userName=ref.user_name, accountId=ref.account_id)
  source_ip:      gen.ipv4()
  user_agent:     "Boto3/1.34.51 Python/3.11.8 Linux/5.15.0-101-generic Botocore/1.34.51 tracemill/1.0"
  parameter_name: "/prod/database/master-password"
  tls_version:    "TLSv1.3"
  tls_cipher:     TLS_AES_128_GCM_SHA256
  step_delay:     "1s"
  step_jitter:    0.2

steps:
  - emit:
      event_type: aws.cloudtrail@v1
      fields:
        eventVersion:       "1.11"
        eventTime:          gen.timestamp()
        eventID:            gen.uuid()
        eventSource:        ssm.amazonaws.com
        eventName:          DescribeParameters
        eventType:          AwsApiCall
        eventCategory:      Management
        awsRegion:          ref.aws_region
        sourceIPAddress:    ref.source_ip
        userAgent:          ref.user_agent
        requestID:          gen.uuid()
        requestParameters:
          maxResults: 50
        responseElements:   null
        readOnly:           true
        managementEvent:    true
        recipientAccountId: ref.account_id
        userIdentity:       ref.actor
        tlsDetails:
          tlsVersion:               ref.tls_version
          cipherSuite:              ref.tls_cipher
          clientProvidedHostHeader: "ssm.${ref.aws_region}.amazonaws.com"
  - wait:
      duration:   ref.step_delay
      jitter_pct: ref.step_jitter
  - emit:
      event_type: aws.cloudtrail@v1
      fields:
        eventVersion:       "1.11"
        eventTime:          gen.timestamp()
        eventID:            gen.uuid()
        eventSource:        ssm.amazonaws.com
        eventName:          GetParameter
        eventType:          AwsApiCall
        eventCategory:      Management
        awsRegion:          ref.aws_region
        sourceIPAddress:    ref.source_ip
        userAgent:          ref.user_agent
        requestID:          gen.uuid()
        requestParameters:
          name:           ref.parameter_name
          withDecryption: true
        responseElements:   null
        readOnly:           true
        managementEvent:    true
        recipientAccountId: ref.account_id
        userIdentity:       ref.actor
        resources:
          - accountId: ref.account_id
            ARN:       "arn:aws:ssm:${ref.aws_region}:${ref.account_id}:parameter${ref.parameter_name}"
        tlsDetails:
          tlsVersion:               ref.tls_version
          cipherSuite:              ref.tls_cipher
          clientProvidedHostHeader: "ssm.${ref.aws_region}.amazonaws.com"
