type: scenario
description: |
  An actor opens an S3 bucket to outside principals with a single
  PutBucketAcl request that carries every explicit-grant header
  (x-amz-grant-read, x-amz-grant-read-acp, x-amz-grant-write,
  x-amz-grant-write-acp, x-amz-grant-full-control), each naming the
  AuthenticatedUsers or AllUsers group by URI. The bucket becomes
  listable, writable, and re-grantable by requesters outside the account.
mitre:
  tactics: [collection]
  techniques: [T1530]

state:
  aws_region:         us-east-1
  account_id:         "000000000000"
  actor:              gen.aws_identity(type=IAMUser, accountId=ref.account_id)
  source_ip:          gen.ipv4()
  user_agent:         "[aws-cli/2.0.45 Python/3.7.4 Darwin/20.2.0 exe/x86_64 command/s3api.put-bucket-acl tracemill/1.0]"
  bucket_name:        gen.regex(pattern=[a-z]{6,10}-(exports|data|assets)-[0-9]{4})
  bucket_arn:         "arn:aws:s3:::${ref.bucket_name}"
  bucket_host:        "${ref.bucket_name}.s3.${ref.aws_region}.amazonaws.com"
  grant_read:         "uri=http://acs.amazonaws.com/groups/global/AuthenticatedUsers"
  grant_read_acp:     "uri=http://acs.amazonaws.com/groups/global/AuthenticatedUsers"
  grant_write:        "uri=http://acs.amazonaws.com/groups/global/AuthenticatedUsers"
  grant_write_acp:    "uri=http://acs.amazonaws.com/groups/global/AuthenticatedUsers"
  grant_full_control: "uri=http://acs.amazonaws.com/groups/global/AllUsers"
  request_id:         gen.hex(len=16, case=upper)
  amz_id2:            gen.hex(len=76, case=lower)

steps:
  - emit:
      event_type: aws.cloudtrail@v1
      fields:
        eventVersion:       "1.11"
        eventTime:          gen.timestamp()
        eventID:            gen.uuid()
        eventSource:        s3.amazonaws.com
        eventName:          PutBucketAcl
        eventType:          AwsApiCall
        eventCategory:      Management
        awsRegion:          ref.aws_region
        sourceIPAddress:    ref.source_ip
        userAgent:          ref.user_agent
        requestID:          ref.request_id
        requestParameters:
          bucketName: ref.bucket_name
          Host:       ref.bucket_host
          acl:        ""
          accessControlList:
            "x-amz-grant-read":         ref.grant_read
            "x-amz-grant-read-acp":     ref.grant_read_acp
            "x-amz-grant-write":        ref.grant_write
            "x-amz-grant-write-acp":    ref.grant_write_acp
            "x-amz-grant-full-control": ref.grant_full_control
        responseElements:   null
        readOnly:           false
        managementEvent:    true
        recipientAccountId: ref.account_id
        userIdentity:       ref.actor
        additionalEventData:
          SignatureVersion:     SigV4
          CipherSuite:          TLS_AES_128_GCM_SHA256
          AuthenticationMethod: AuthHeader
          aclRequired:          "Yes"
          bytesTransferredIn:   0
          bytesTransferredOut:  0
          "x-amz-id-2":         ref.amz_id2
        tlsDetails:
          tlsVersion:               TLSv1.3
          cipherSuite:              TLS_AES_128_GCM_SHA256
          clientProvidedHostHeader: ref.bucket_host
        resources:
          - accountId: ref.account_id
            type:      "AWS::S3::Bucket"
            ARN:       ref.bucket_arn
