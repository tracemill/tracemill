type: scenario
description: |
  An administrator turns on versioning for an S3 bucket via PutBucketVersioning
  with VersioningConfiguration.Status set to Enabled. This is the routine,
  protective use of bucket versioning and serves as a benign baseline alongside
  versioning-suspension activity.

state:
  aws_region:  us-west-2
  account_id:  "111111111111"
  actor:       gen.aws_identity(type=AssumedRole, accountId=ref.account_id)
  source_ip:   gen.ipv4()
  user_agent:  "[S3Console/0.4, aws-internal/3 aws-sdk-java/1.12.0 Linux/5.10 OpenJDK_64-Bit_Server_VM/25 java/1.8.0 vendor/Oracle_Corporation tracemill/1.0]"
  bucket_name: prod-data-backups
  bucket_arn:  "arn:aws:s3:::${ref.bucket_name}"
  bucket_host: "s3.${ref.aws_region}.amazonaws.com"
  tls_version: "TLSv1.2"
  tls_cipher:  ECDHE-RSA-AES128-GCM-SHA256
  request_id:  gen.hex(len=16, case=upper)
  amz_id2:     gen.hex(len=76, case=lower)

steps:
  - emit:
      event_type: aws.cloudtrail@v1
      fields:
        eventVersion:       "1.11"
        eventTime:          gen.timestamp()
        eventID:            gen.uuid()
        eventSource:        s3.amazonaws.com
        eventName:          PutBucketVersioning
        eventType:          AwsApiCall
        eventCategory:      Management
        awsRegion:          ref.aws_region
        sourceIPAddress:    ref.source_ip
        userAgent:          ref.user_agent
        requestID:          ref.request_id
        requestParameters:
          bucketName: ref.bucket_name
          Host:       ref.bucket_host
          versioning: ""
          VersioningConfiguration:
            Status: Enabled
            xmlns:  "http://s3.amazonaws.com/doc/2006-03-01/"
        responseElements:   null
        readOnly:           false
        managementEvent:    true
        recipientAccountId: ref.account_id
        userIdentity:       ref.actor
        additionalEventData:
          SignatureVersion:     SigV4
          CipherSuite:          ref.tls_cipher
          bytesTransferredIn:   123
          AuthenticationMethod: AuthHeader
          "x-amz-id-2":         ref.amz_id2
          bytesTransferredOut:  0
        tlsDetails:
          tlsVersion:               ref.tls_version
          cipherSuite:              ref.tls_cipher
          clientProvidedHostHeader: ref.bucket_host
        resources:
          - accountId: ref.account_id
            type:      "AWS::S3::Bucket"
            ARN:       ref.bucket_arn
