type: scenario
description: |
  An IAM user tries to assume a role through STS and is refused with
  AccessDenied. The error message names both the caller and the role it
  tried, so a run of these records shows which roles were probed.
mitre:
  tactics: [discovery, credential-access]
  techniques: ["T1069.003", "T1110"]

state:
  aws_region:  us-east-1
  account_id:  "000000000000"
  actor_name:  gen.username()
  actor:       gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  source_ip:   gen.ipv4()
  user_agent:  "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/sts#1.34.0 tracemill/1.0"
  tls_version: "TLSv1.3"
  tls_cipher:  TLS_AES_128_GCM_SHA256
  role_name:   gen.regex(pattern=[a-z]{6}-[a-z]{5}-role)

steps:
  - emit:
      event_type: aws.cloudtrail@v1
      fields:
        eventVersion:       "1.11"
        eventTime:          gen.timestamp()
        eventID:            gen.uuid()
        eventSource:        sts.amazonaws.com
        eventName:          AssumeRole
        eventType:          AwsApiCall
        eventCategory:      Management
        awsRegion:          ref.aws_region
        sourceIPAddress:    ref.source_ip
        userAgent:          ref.user_agent
        errorCode:          AccessDenied
        errorMessage:       "User: ${ref.actor.arn} is not authorized to perform: sts:AssumeRole on resource: arn:aws:iam::${ref.account_id}:role/${ref.role_name}"
        requestID:          gen.uuid()
        requestParameters:  null
        responseElements:   null
        readOnly:           true
        managementEvent:    true
        recipientAccountId: ref.account_id
        userIdentity:       ref.actor
        tlsDetails:
          tlsVersion:               ref.tls_version
          cipherSuite:              ref.tls_cipher
          keyExchange:              secp256r1
          clientProvidedHostHeader: "sts.${ref.aws_region}.amazonaws.com"
