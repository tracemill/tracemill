type: scenario
description: |
  An IAM user calls STS GetSessionToken with its long-lived access key and
  receives a set of temporary credentials. The session keeps the user's own
  permissions but carries a new ASIA access key, so activity performed with
  it no longer shows the original AKIA key that issued it.
mitre:
  tactics: [defense-evasion, lateral-movement]
  techniques: ["T1550.001"]

state:
  aws_region:          us-east-1
  account_id:          "000000000000"
  actor_name:          gen.username()
  actor:               gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  source_ip:           gen.ipv4()
  user_agent:          "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/sts#1.34.0 tracemill/1.0"
  tls_version:         "TLSv1.3"
  tls_cipher:          TLS_AES_128_GCM_SHA256
  duration:            900
  session_key_id:      gen.regex(pattern=ASIA[A-Z0-9]{16})
  session_token:       gen.regex(pattern=IQoJb3JpZ2luX2Vj[A-Za-z0-9+/]{658}==)
  extended_request_id: gen.regex(pattern=MTp1cy1lYXN0LTE6[A-Za-z0-9]{35}=)
  # Written as a literal because a generator argument cannot read state; it
  # has to move with `duration`.
  expires_at:          gen.timestamp(offset=15m)

steps:
  - emit:
      event_type: aws.cloudtrail@v1
      fields:
        eventVersion:       "1.11"
        eventTime:          gen.timestamp()
        eventID:            gen.uuid()
        eventSource:        sts.amazonaws.com
        eventName:          GetSessionToken
        eventType:          AwsApiCall
        eventCategory:      Management
        awsRegion:          ref.aws_region
        sourceIPAddress:    ref.source_ip
        userAgent:          ref.user_agent
        requestID:          gen.uuid()
        requestParameters:
          durationSeconds: ref.duration
        responseElements:
          credentials:
            accessKeyId:  ref.session_key_id
            expiration:   ref.expires_at
            sessionToken: ref.session_token
          sessionTokenSize:        676
          sessionTokenUtilization: 16
        additionalEventData:
          ExtendedRequestId: ref.extended_request_id
          RequestDetails:
            awsServingRegion: ref.aws_region
            endpointType:     regional
        readOnly:           false
        managementEvent:    true
        recipientAccountId: ref.account_id
        userIdentity:       ref.actor
        tlsDetails:
          tlsVersion:               ref.tls_version
          cipherSuite:              ref.tls_cipher
          keyExchange:              secp256r1
          clientProvidedHostHeader: "sts.${ref.aws_region}.amazonaws.com"
