type: scenario
description: |
  A read-only Amazon ECR DescribeImageScanFindings call whose response reports
  container-image scan findings including at least one MEDIUM-severity
  vulnerability -- the medium-severity result flags a vulnerable image.

mitre:
  tactics: [execution]
  techniques: ["T1204.003"]

state:
  account_id:      "111111111111"
  aws_region:      us-east-1
  source_ip:       gen.ipv4()
  user_agent:      "aws-sdk-java/1.11.1030 Linux/5.15.0 OpenJDK_64-Bit_Server_VM/25.302 java/1.8.0_302 tracemill/1.0"
  actor:           gen.aws_identity(type=AssumedRole, accountId=ref.account_id)
  repository_name: "devsecops/catalog-service"
  image_hash:      gen.hex(len=64, case=lower)
  image_digest:    "sha256:${ref.image_hash}"
  repository_arn:  "arn:aws:ecr:${ref.aws_region}:${ref.account_id}:repository/${ref.repository_name}"
  max_results:     1000

  scan_completed_at:      gen.timestamp(format="Jan 2, 2006, 3:04:05 PM", offset=-15m, jitter=5m)
  vuln_source_updated_at: gen.timestamp(format="Jan 2, 2006, 3:04:05 PM", offset=-8h, jitter=1h)

  findings:
    - name: "CVE-2018-12886"
      description: "stack_protect_prologue in cfgexpand.c and stack_protect_epilogue in function.c in GNU Compiler Collection (GCC) 4.1 through 8 (under certain circumstances) generate instruction sequences when targeting ARM targets that spill the address of the stack protector guard, which allows an attacker to bypass the protection of -fstack-protector, -fstack-protector-all, -fstack-protector-strong, and -fstack-protector-explicit against stack overflow by controlling what the stack canary is compared against."
      uri: "https://security-tracker.debian.org/tracker/CVE-2018-12886"
      severity: MEDIUM
      attributes:
        - { key: package_version, value: "8.3.0-6" }
        - { key: package_name, value: gcc-8 }
        - { key: CVSS2_VECTOR, value: "AV:N/AC:M/Au:N/C:P/I:P/A:P" }
        - { key: CVSS2_SCORE, value: "6.8" }
    - name: "CVE-2020-1751"
      description: "An out-of-bounds write vulnerability was found in glibc before 2.31 when handling signal trampolines on PowerPC. Specifically, the backtrace function did not properly check the array bounds when storing the frame address, resulting in a denial of service or potential code execution. The highest threat from this vulnerability is to system availability."
      uri: "https://security-tracker.debian.org/tracker/CVE-2020-1751"
      severity: MEDIUM
      attributes:
        - { key: package_version, value: "2.28-10" }
        - { key: package_name, value: glibc }
        - { key: CVSS2_VECTOR, value: "AV:L/AC:M/Au:N/C:P/I:P/A:C" }
        - { key: CVSS2_SCORE, value: "5.9" }
    - name: "CVE-2021-3326"
      description: "The iconv function in the GNU C Library (aka glibc or libc6) 2.32 and earlier, when processing invalid input sequences in the ISO-2022-JP-3 encoding, fails an assertion in the code path and aborts the program, potentially resulting in a denial of service."
      uri: "https://security-tracker.debian.org/tracker/CVE-2021-3326"
      severity: MEDIUM
      attributes:
        - { key: package_version, value: "2.28-10" }
        - { key: package_name, value: glibc }
        - { key: CVSS2_VECTOR, value: "AV:N/AC:L/Au:N/C:N/I:N/A:P" }
        - { key: CVSS2_SCORE, value: "5" }
  finding_severity_counts:
    MEDIUM: 3

steps:
  - emit:
      event_type: aws.cloudtrail@v1
      fields:
        eventVersion:       "1.08"
        eventTime:          gen.timestamp()
        eventID:            gen.uuid()
        eventSource:        ecr.amazonaws.com
        eventName:          DescribeImageScanFindings
        eventType:          AwsApiCall
        eventCategory:      Management
        awsRegion:          ref.aws_region
        sourceIPAddress:    ref.source_ip
        userAgent:          ref.user_agent
        requestID:          gen.uuid()
        readOnly:           true
        managementEvent:    true
        recipientAccountId: ref.account_id
        userIdentity:       ref.actor
        requestParameters:
          repositoryName: ref.repository_name
          imageId:
            imageDigest: ref.image_digest
          maxResults: ref.max_results
        responseElements:
          registryId:     ref.account_id
          repositoryName: ref.repository_name
          imageId:
            imageDigest: ref.image_digest
          imageScanStatus:
            status:      COMPLETE
            description: "The scan was completed successfully."
          imageScanFindings:
            imageScanCompletedAt:         ref.scan_completed_at
            vulnerabilitySourceUpdatedAt: ref.vuln_source_updated_at
            findings:                     ref.findings
            findingSeverityCounts:        ref.finding_severity_counts
        resources:
          - ARN: ref.repository_arn
            accountId: ref.account_id
            type: "AWS::ECR::Repository"
