type: scenario
description: |
  Collection setup: an actor creates a VPC traffic mirror filter, the first
  piece of a mirror session that copies an interface's packets to a
  target the actor chooses.
mitre:
  tactics: [collection]
  techniques: ["T1040"]

state:
  aws_region:  us-east-1
  account_id:  "000000000000"
  actor_name:  gen.username()
  actor:       gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  source_ip:   gen.ipv4()
  user_agent:  "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/ec2#1.231.0 tracemill/1.0"
  tls_version: "TLSv1.3"
  tls_cipher:  TLS_AES_128_GCM_SHA256
  request_id:  gen.uuid()
  filter_hex:   gen.hex(len=17, case=lower)
  filter_id:    "tmf-${ref.filter_hex}"
  client_token: gen.uuid()
  filter_description: gen.regex(pattern=(netmon|packet-capture|ids-feed|debug-mirror)-[0-9]{2})

steps:
  - emit:
      event_type: aws.cloudtrail@v1
      fields:
        eventVersion:       "1.11"
        eventTime:          gen.timestamp()
        eventID:            gen.uuid()
        eventSource:        ec2.amazonaws.com
        eventName:          CreateTrafficMirrorFilter
        eventType:          AwsApiCall
        eventCategory:      Management
        awsRegion:          ref.aws_region
        sourceIPAddress:    ref.source_ip
        userAgent:          ref.user_agent
        requestID:          ref.request_id
        requestParameters:
          CreateTrafficMirrorFilterRequest:
            ClientToken: ref.client_token
            Description: ref.filter_description
        responseElements:
          CreateTrafficMirrorFilterResponse:
            clientToken: ref.client_token
            requestId:   ref.request_id
            trafficMirrorFilter:
              description:          ref.filter_description
              egressFilterRuleSet:  ""
              ingressFilterRuleSet: ""
              networkServiceSet:    ""
              tagSet:               ""
              trafficMirrorFilterId: ref.filter_id
            xmlns: "http://ec2.amazonaws.com/doc/2016-11-15/"
        readOnly:           false
        managementEvent:    true
        recipientAccountId: ref.account_id
        userIdentity:       ref.actor
        tlsDetails:
          tlsVersion:               ref.tls_version
          cipherSuite:              ref.tls_cipher
          clientProvidedHostHeader: "ec2.${ref.aws_region}.amazonaws.com"
