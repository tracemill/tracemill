type: scenario
description: |
  An actor authorizes an inbound (ingress) rule on an EC2 security group
  that permits all protocols (-1) from 0.0.0.0/0, exposing every resource
  attached to the group to unrestricted inbound access from any address.

  Models a single authorization event. The security group the rule is
  added to (group_id) and the acting identity (user_name) are bindable so
  a job can drive one identity across many distinct security groups in a
  short window -- the shape of an account abruptly rewriting its network
  exposure.
mitre:
  tactics: [defense-evasion]
  techniques: [T1578.005]

state:
  aws_region:  us-east-1
  account_id:  "111111111111"
  user_name:   gen.username()
  actor:       gen.aws_identity(type=IAMUser, userName=ref.user_name, accountId=ref.account_id)
  source_ip:   gen.ipv4()
  user_agent:  "aws-cli/2.15.0 Python/3.11.8 Darwin/23.5.0 source/arm64 prompt/off command/ec2.authorize-security-group-ingress tracemill/1.0"
  group_hex:   gen.hex(len=17, case=lower)
  group_id:    "sg-${ref.group_hex}"
  rule_hex:    gen.hex(len=17, case=lower)
  rule_id:     "sgr-${ref.rule_hex}"
  request_id:  gen.uuid()

steps:
  - emit:
      event_type: aws.cloudtrail@v1
      fields:
        eventVersion:       "1.11"
        eventTime:          gen.timestamp()
        eventID:            gen.uuid()
        eventSource:        ec2.amazonaws.com
        eventName:          AuthorizeSecurityGroupIngress
        eventType:          AwsApiCall
        eventCategory:      Management
        awsRegion:          ref.aws_region
        sourceIPAddress:    ref.source_ip
        userAgent:          ref.user_agent
        requestID:          ref.request_id
        requestParameters:
          groupId: ref.group_id
          ipPermissions:
            items:
              - ipProtocol: "-1"
                fromPort:   -1
                toPort:     -1
                groups:     {}
                ipRanges:
                  items:
                    - cidrIp: 0.0.0.0/0
                ipv6Ranges:    {}
                prefixListIds: {}
        responseElements:
          requestId: ref.request_id
          _return:   true
          securityGroupRuleSet:
            items:
              - groupOwnerId:        ref.account_id
                groupId:             ref.group_id
                securityGroupRuleId: ref.rule_id
                isEgress:            false
                ipProtocol:          "-1"
                fromPort:            -1
                toPort:              -1
                cidrIpv4:            0.0.0.0/0
        readOnly:           false
        managementEvent:    true
        recipientAccountId: ref.account_id
        userIdentity:       ref.actor
        tlsDetails:
          tlsVersion:               TLSv1.3
          cipherSuite:              TLS_AES_128_GCM_SHA256
          clientProvidedHostHeader: "ec2.${ref.aws_region}.amazonaws.com"
