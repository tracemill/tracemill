type: scenario
description: |
  An actor adds a TCP (protocol 6) ingress network ACL entry allowing a port
  span (port_from..port_to) from 0.0.0.0/0. The span is parameterised: a wide
  range (e.g. 0-65000) exposes effectively every TCP service, while the
  default 0-1024 exposes the privileged port range -- the boundary of a common 
  "wider than a single service" heuristic.
mitre:
  tactics: [defense-evasion]
  techniques: [T1562.007]

state:
  aws_region:  us-east-1
  account_id:  "111111111111"
  actor:       gen.aws_identity(type=AssumedRole, accountId=ref.account_id)
  source_ip:   gen.ipv4()
  user_agent:  "aws-cli/2.15.0 Python/3.11.8 Linux/5.15.0 botocore/2.4.5 tracemill/1.0"
  acl_hex:     gen.hex(len=17, case=lower)
  acl_id:      "acl-${ref.acl_hex}"
  request_id:  gen.uuid()
  rule_number: gen.int(min=100, max=32000)
  # Ingress TCP port span. Defaults model the privileged-range boundary case
  # (0-1024, span exactly 1024). Override via job bindings for other spans.
  port_from:   0
  port_to:     1024

steps:
  - emit:
      event_type: aws.cloudtrail@v1
      fields:
        eventVersion:       "1.11"
        eventTime:          gen.timestamp()
        eventID:            gen.uuid()
        eventSource:        ec2.amazonaws.com
        eventName:          CreateNetworkAclEntry
        eventType:          AwsApiCall
        eventCategory:      Management
        awsRegion:          ref.aws_region
        sourceIPAddress:    ref.source_ip
        userAgent:          ref.user_agent
        requestID:          ref.request_id
        requestParameters:
          networkAclId: ref.acl_id
          ruleNumber:   ref.rule_number
          egress:       false
          ruleAction:   allow
          icmpTypeCode: {}
          portRange:
            from: ref.port_from
            to:   ref.port_to
          aclProtocol:  "6"
          cidrBlock:    0.0.0.0/0
        responseElements:
          requestId: ref.request_id
          _return:   true
        readOnly:           false
        managementEvent:    true
        recipientAccountId: ref.account_id
        userIdentity:       ref.actor
        tlsDetails:
          tlsVersion:               TLSv1.3
          cipherSuite:              TLS_AES_128_GCM_SHA256
          clientProvidedHostHeader: "ec2.${ref.aws_region}.amazonaws.com"
