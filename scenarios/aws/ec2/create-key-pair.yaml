type: scenario
description: |
  An actor creates a new EC2 SSH key pair by calling CreateKeyPair, which
  succeeds and returns the key's fingerprint and id; CloudTrail redacts the
  private key material.
  See https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_CreateKeyPair.html
mitre:
  tactics: [persistence]
  techniques: [T1098]

state:
  aws_region:      us-east-1
  account_id:      "111111111111"
  user_name:       gen.username()
  actor:           gen.aws_identity(type=IAMUser, userName=ref.user_name, accountId=ref.account_id)
  source_ip:       gen.ipv4()
  user_agent:      "aws-cli/2.31.27 md/awscrt#0.27.6 ua/2.1 os/linux#6.1.0 md/arch#x86_64 lang/python#3.13.9 md/pyimpl#CPython cfg/retry-mode#standard md/command#ec2.create-key-pair tracemill/1.0"
  key_name:        gen.username()
  key_pair_hex:    gen.hex(len=17, case=lower)
  key_pair_id:     "key-${ref.key_pair_hex}"
  key_fingerprint: gen.regex(pattern=([0-9a-f]{2}:){19}[0-9a-f]{2})
  request_id:      gen.uuid()

steps:
  - emit:
      event_type: aws.cloudtrail@v1
      fields:
        eventVersion:       "1.11"
        eventTime:          gen.timestamp()
        eventID:            gen.uuid()
        eventSource:        ec2.amazonaws.com
        eventName:          CreateKeyPair
        eventType:          AwsApiCall
        eventCategory:      Management
        awsRegion:          ref.aws_region
        sourceIPAddress:    ref.source_ip
        userAgent:          ref.user_agent
        requestID:          ref.request_id
        requestParameters:
          keyName:   ref.key_name
          keyType:   rsa
          keyFormat: pem
        responseElements:
          requestId:      ref.request_id
          keyName:        ref.key_name
          keyFingerprint: ref.key_fingerprint
          keyMaterial:    "<sensitiveDataRemoved>"
          keyPairId:      ref.key_pair_id
        readOnly:           false
        managementEvent:    true
        recipientAccountId: ref.account_id
        userIdentity:       ref.actor
        resources:
          - accountId: ref.account_id
            type:      "AWS::EC2::KeyPair"
            ARN:       "arn:aws:ec2:${ref.aws_region}:${ref.account_id}:key-pair/${ref.key_name}"
        tlsDetails:
          tlsVersion:               TLSv1.3
          cipherSuite:              TLS_AES_128_GCM_SHA256
          clientProvidedHostHeader: "ec2.${ref.aws_region}.amazonaws.com"
