type: scenario
description: |
  A single denied (Client.UnauthorizedOperation) call to the Amazon EC2
  GetPasswordData API -- a principal attempting to retrieve the encrypted
  local administrator password of a running Windows instance it is not
  permitted to read. The call names one instance by id. Loop it in a job
  (pinning the calling identity, source IP, account, and Region through
  bindings, while the instance id varies per run) to model the rapid
  enumeration of many instances' password data from one identity.

  API reference: https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_GetPasswordData.html

mitre:
  tactics: [credential-access]
  techniques: ["T1552"]

state:
  account_id:  "111122223333"
  aws_region:  us-east-1
  source_ip:   gen.ipv4()
  user_agent:  "aws-cli/2.27.0 md/awscrt#0.27.0 ua/2.1 os/macos#15.3.1 md/arch#arm64 lang/python#3.13.0 md/command#ec2.get-password-data tracemill/1.0"
  actor:       gen.aws_identity(type=AssumedRole, accountId=ref.account_id)

  # EC2 instance id is i- followed by 17 hex chars (the API reference sample
  # request shows i-1234567890abcdef0). State is re-evaluated each job loop
  # pass, so the id is fresh per call -- the distinct-instance count the
  # enumeration is keyed on.
  instance_hex:    gen.hex(len=17, case=lower)
  instance_id:     "i-${ref.instance_hex}"
  encoded_failure: gen.hex(len=128, case=lower)

steps:
  - emit:
      event_type: aws.cloudtrail@v1
      fields:
        eventVersion:       "1.11"
        eventTime:          gen.timestamp()
        eventID:            gen.uuid()
        eventSource:        ec2.amazonaws.com
        eventName:          GetPasswordData
        eventType:          AwsApiCall
        eventCategory:      Management
        awsRegion:          ref.aws_region
        sourceIPAddress:    ref.source_ip
        userAgent:          ref.user_agent
        errorCode:          Client.UnauthorizedOperation
        errorMessage:       "You are not authorized to perform this operation. Encoded authorization failure message: ${ref.encoded_failure}"
        requestID:          gen.uuid()
        requestParameters:
          instanceId:       ref.instance_id
        responseElements:   null
        readOnly:           true
        managementEvent:    true
        recipientAccountId: ref.account_id
        userIdentity:       ref.actor
        tlsDetails:
          tlsVersion:               "TLSv1.2"
          cipherSuite:              "ECDHE-RSA-AES128-GCM-SHA256"
          clientProvidedHostHeader: "ec2.${ref.aws_region}.amazonaws.com"
