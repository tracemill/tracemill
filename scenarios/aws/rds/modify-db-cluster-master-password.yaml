type: scenario
description: |
  Credential access and persistence: an IAM user resets the master user
  password of an Aurora PostgreSQL DB cluster and applies it immediately.
  Whoever sets the master password owns every database in the cluster, and
  the application's stored credentials stop working. CloudTrail redacts the
  new password but records that the parameter was set.
mitre:
  tactics: [credential-access, persistence]
  techniques: ["T1098", "T1078.004"]

state:
  aws_region:          us-east-1
  account_id:          "000000000000"
  actor_name:          gen.username()
  actor:               gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  source_ip:           gen.ipv4()
  user_agent:          "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/rds#1.103.0 tracemill/1.0"
  tls_version:         "TLSv1.3"
  tls_cipher:          TLS_AES_128_GCM_SHA256
  db_cluster_id:       gen.regex(pattern=[a-z]{6}-aurora-cluster)
  cluster_resource_id: gen.regex(pattern=cluster-[A-Z0-9]{26})
  endpoint_suffix:     gen.regex(pattern=c[a-z0-9]{11})
  master_username:     postgres
  security_group_id:   gen.regex(pattern=sg-[0-9a-f]{17})

steps:
  - emit:
      event_type: aws.cloudtrail@v1
      fields:
        awsRegion:          ref.aws_region
        eventCategory:      "Management"
        eventID:            gen.uuid()
        eventName:          "ModifyDBCluster"
        eventSource:        "rds.amazonaws.com"
        eventTime:          gen.timestamp()
        eventType:          "AwsApiCall"
        eventVersion:       "1.11"
        managementEvent:    true
        readOnly:           false
        recipientAccountId: ref.account_id
        requestID:          gen.uuid()
        requestParameters:
          allowEngineModeChange:    false
          allowMajorVersionUpgrade: false
          applyImmediately:         true
          dBClusterIdentifier:      ref.db_cluster_id
          masterUserPassword:       "HIDDEN_DUE_TO_SECURITY_REASONS"
        responseElements:
          allocatedStorage:                 1
          associatedRoles:                  []
          autoMinorVersionUpgrade:          true
          availabilityZones:
            - "${ref.aws_region}a"
            - "${ref.aws_region}b"
            - "${ref.aws_region}c"
          backupRetentionPeriod:            1
          clusterCreateTime:                gen.timestamp(offset=-2160h)
          copyTagsToSnapshot:               false
          crossAccountClone:                false
          customDataGroupPresent:           false
          dBClusterArn:                     "arn:aws:rds:${ref.aws_region}:${ref.account_id}:cluster:${ref.db_cluster_id}"
          dBClusterIdentifier:              ref.db_cluster_id
          dBClusterMembers:                 []
          dBClusterParameterGroup:          "default.aurora-postgresql17"
          dBSubnetGroup:                    "default"
          databaseInsightsMode:             "standard"
          dbClusterResourceId:              ref.cluster_resource_id
          deletionProtection:               false
          docdbAnalyticsEnabled:            false
          domainMemberships:                []
          earliestRestorableTime:           gen.timestamp(offset=-5m)
          endpoint:                         "${ref.db_cluster_id}.cluster-${ref.endpoint_suffix}.${ref.aws_region}.rds.amazonaws.com"
          engine:                           "aurora-postgresql"
          engineLifecycleSupport:           "open-source-rds-extended-support"
          engineMode:                       "provisioned"
          engineVersion:                    "17.9"
          hostedZoneId:                     "Z2R2ITUGPM61AM"
          httpEndpointEnabled:              false
          iAMDatabaseAuthenticationEnabled: false
          internetAccessGatewayEnabled:     false
          latestRestorableTime:             gen.timestamp(offset=-5m)
          localWriteForwardingStatus:       "disabled"
          masterUsername:                   ref.master_username
          multiAZ:                          false
          networkType:                      "IPV4"
          port:                             5432
          preferredBackupWindow:            "09:31-10:01"
          preferredMaintenanceWindow:       "sun:04:57-sun:05:27"
          readReplicaIdentifiers:           []
          readerEndpoint:                   "${ref.db_cluster_id}.cluster-ro-${ref.endpoint_suffix}.${ref.aws_region}.rds.amazonaws.com"
          status:                           "available"
          storageEncrypted:                 false
          storageEncryptionType:            "sse-rds"
          tagList:                          []
          upgradeRolloutOrder:              "second"
          vPCNetworkingEnabled:             true
          vpcSecurityGroups:
            - status:             "active"
              vpcSecurityGroupId: ref.security_group_id
        sourceIPAddress:    ref.source_ip
        tlsDetails:
          cipherSuite:              ref.tls_cipher
          clientProvidedHostHeader: "rds.${ref.aws_region}.amazonaws.com"
          tlsVersion:               ref.tls_version
        userAgent:          ref.user_agent
        userIdentity:       ref.actor
