type: scenario
description: |
  Exfiltration: an IAM user sets an Amazon EFS file system policy whose
  Allow statement grants ClientMount to every AWS principal ("*"), with
  only a condition that access arrives through a mount target. Any
  identity that can reach a mount target over the network can then mount
  the file system and read its data.
mitre:
  tactics: [exfiltration]
  techniques: ["T1537"]

state:
  aws_region:     us-east-1
  account_id:     "000000000000"
  actor_name:     gen.username()
  actor:          gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  source_ip:      gen.ipv4()
  user_agent:     "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/efs#1.36.0 tracemill/1.0"
  tls_version:    "TLSv1.3"
  tls_cipher:     TLS_AES_128_GCM_SHA256
  file_system_id: gen.regex(pattern=fs-[0-9a-f]{17})
  policy:         '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":"*"},"Action":"elasticfilesystem:ClientMount","Resource":"arn:aws:elasticfilesystem:${ref.aws_region}:${ref.account_id}:file-system/${ref.file_system_id}","Condition":{"Bool":{"elasticfilesystem:AccessedViaMountTarget":"true"}}}]}'

steps:
  - emit:
      event_type: aws.cloudtrail@v1
      fields:
        eventVersion:       "1.11"
        eventTime:          gen.timestamp()
        eventID:            gen.uuid()
        eventSource:        elasticfilesystem.amazonaws.com
        eventName:          PutFileSystemPolicy
        eventType:          AwsApiCall
        eventCategory:      Management
        apiVersion:         "2015-02-01"
        awsRegion:          ref.aws_region
        sourceIPAddress:    ref.source_ip
        userAgent:          ref.user_agent
        requestID:          gen.uuid()
        requestParameters:
          bypassPolicyLockoutSafetyCheck: false
          fileSystemId:                   ref.file_system_id
          policy:                         ref.policy
        responseElements:
          fileSystemId: ref.file_system_id
          policy:       ref.policy
        readOnly:           false
        managementEvent:    true
        recipientAccountId: ref.account_id
        userIdentity:       ref.actor
        tlsDetails:
          tlsVersion:               ref.tls_version
          cipherSuite:              ref.tls_cipher
          clientProvidedHostHeader: "elasticfilesystem.${ref.aws_region}.amazonaws.com"
