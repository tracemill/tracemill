type: scenario
description: |
  Collection: a role session reads one block of an EBS snapshot through the
  EBS direct APIs. Reading blocks copies a disk's contents out of the
  account without creating or attaching a volume.
mitre:
  tactics: [collection, exfiltration]
  techniques: ["T1005", "T1537"]

state:
  aws_region:  us-east-1
  account_id:  "000000000000"
  role_name:          gen.username()
  role_id:            gen.regex(pattern=AROA[A-Z0-9]{17})
  session_name:       gen.username()
  session_key_id:     gen.regex(pattern=ASIA[A-Z0-9]{16})
  session_created_at: gen.timestamp(offset=-2m)
  source_ip:   gen.ipv4()
  user_agent:  "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/ebs#1.29.0 tracemill/1.0"
  tls_version: "TLSv1.3"
  tls_cipher:  TLS_AES_128_GCM_SHA256
  request_id:  gen.uuid()
  snapshot_hex: gen.hex(len=17, case=lower)
  snapshot_id:  "snap-${ref.snapshot_hex}"
  block_index:  0
  block_token:  gen.regex(pattern=[A-Za-z0-9_-]{95})

steps:
  - emit:
      event_type: aws.cloudtrail@v1
      fields:
        eventVersion:       "1.11"
        eventTime:          gen.timestamp()
        eventID:            gen.uuid()
        eventSource:        ebs.amazonaws.com
        eventName:          GetSnapshotBlock
        eventType:          AwsApiCall
        eventCategory:      Data
        awsRegion:          ref.aws_region
        sourceIPAddress:    ref.source_ip
        userAgent:          ref.user_agent
        requestID:          ref.request_id
        requestParameters:
          blockIndex: ref.block_index
          blockToken: ref.block_token
          snapshotId: ref.snapshot_id
        resources:
          - ARN:       "arn:aws:ec2:${ref.aws_region}::snapshot/${ref.snapshot_id}"
            accountId: ref.account_id
            type:      AWS::EC2::Snapshot
        responseElements: null
        readOnly:           true
        managementEvent:    false
        recipientAccountId: ref.account_id
        userIdentity:
          type:        AssumedRole
          principalId: "${ref.role_id}:${ref.session_name}"
          arn:         "arn:aws:sts::${ref.account_id}:assumed-role/${ref.role_name}/${ref.session_name}"
          accountId:   ref.account_id
          accessKeyId: ref.session_key_id
          sessionContext:
            sessionIssuer:
              type:        Role
              principalId: ref.role_id
              arn:         "arn:aws:iam::${ref.account_id}:role/${ref.role_name}"
              accountId:   ref.account_id
              userName:    ref.role_name
            attributes:
              creationDate:     ref.session_created_at
              mfaAuthenticated: "false"
        tlsDetails:
          tlsVersion:               ref.tls_version
          cipherSuite:              ref.tls_cipher
          clientProvidedHostHeader: "ebs.${ref.aws_region}.amazonaws.com"
