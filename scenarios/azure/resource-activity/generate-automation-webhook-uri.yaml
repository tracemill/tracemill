type: scenario
description: |
  An Azure Activity Log record showing an Azure Resource Manager
  "Generate a URI for an Azure Automation webhook" operation that
  succeeded -- a read-only-effect action that produces a candidate
  webhook URL without creating or modifying any webhook resource. On
  its own this is routine exploration of the Automation account's
  webhook tooling, distinct from actually creating a webhook.
state:
  subscription_id: "22222222-2222-2222-2222-222222222222"
  resource_group:  "ResourceGroup1"
  account_name:    "ExistingAutomationAccount"
  caller_upn:      "admin@example.onmicrosoft.com"
  caller_display:  "Routine Admin"
  src_ip:          gen.ipv4()
  correlation_id:  gen.uuid()
  event_data_id:   gen.uuid()
  operation_id:    gen.uuid()
  ticks:           gen.int(min=637000000000000000, max=637999999999999999)
  event_time:      gen.timestamp()
steps:
  - emit:
      event_type: azure.resource.activity@v1
      fields:
        resourceUri: "/subscriptions/${ref.subscription_id}/resourceGroups/${ref.resource_group}/providers/Microsoft.Automation/automationAccounts/${ref.account_name}/webhooks/generateUri"
        id: "/subscriptions/${ref.subscription_id}/resourceGroups/${ref.resource_group}/providers/Microsoft.Automation/automationAccounts/${ref.account_name}/webhooks/generateUri/events/${ref.event_data_id}/ticks/${ref.ticks}"
        eventDataId: ref.event_data_id
        correlationId: ref.correlation_id
        eventTimestamp: ref.event_time
        submissionTimestamp: ref.event_time
        level: "Informational"
        channels: "Operation"
        description: ""
        caller: ref.caller_upn
        authorization:
          action: "Microsoft.Automation/automationAccounts/webhooks/action"
          scope: "/subscriptions/${ref.subscription_id}/resourceGroups/${ref.resource_group}/providers/Microsoft.Automation/automationAccounts/${ref.account_name}/webhooks/generateUri"
        claims:
          name: ref.caller_display
          ipaddr: ref.src_ip
          appid: "c44b4083-3bb0-49c1-b47d-974e53cbdf3c"
        resourceGroupName: ref.resource_group
        resourceProviderName:
          value: "Microsoft.Automation"
          localizedValue: "Microsoft.Automation"
        subscriptionId: ref.subscription_id
        operationId: ref.operation_id
        operationName:
          value: "Microsoft.Automation/automationAccounts/webhooks/action"
          localizedValue: "Generate a URI for an Azure Automation webhook"
        eventName:
          value: "EndRequest"
          localizedValue: "End request"
        eventSource:
          value: "Administrative"
          localizedValue: "Administrative"
        httpRequest:
          clientRequestId: gen.uuid()
          clientIpAddress: ref.src_ip
          method: "POST"
        status:
          value: "Succeeded"
          localizedValue: "Succeeded"
        subStatus:
          value: "OK"
          localizedValue: "OK (HTTP Status Code: 200)"
        properties:
          statusCode: "OK"
          serviceRequestId: null
          eventCategory: "Administrative"
          entity: "/subscriptions/${ref.subscription_id}/resourceGroups/${ref.resource_group}/providers/Microsoft.Automation/automationAccounts/${ref.account_name}/webhooks/generateUri"
          message: "Microsoft.Automation/automationAccounts/webhooks/action"
          hierarchy: ref.subscription_id
