type: scenario
description: |
  A Microsoft Entra ID (Azure AD) sign-in attempt where the password is
  correct but the sign-in is blocked pending multi-factor
  authentication. On its own this is routine MFA enforcement; repeated
  against one account through many client applications and user agents,
  it is consistent with an adversary probing which endpoints enforce
  MFA for credentials it already holds.

  The identity and client application fields are bound by the job so a
  burst can vary them per attempt.
mitre:
  tactics: [defense-evasion, initial-access, persistence, privilege-escalation]
  techniques: [T1078]
state:
  tenant_id:         "11111111-1111-1111-1111-111111111111"
  src_ip:            gen.ipv4()
  user_upn:          "employee@example.onmicrosoft.com"
  user_display:      "Routine Employee"
  user_id:           gen.uuid()
  app_id:            "1b730954-1685-4b74-9bfd-dac224a7b894"
  app_display_name:  "Azure Active Directory PowerShell"
  client_app_used:   "Mobile Apps and Desktop clients"
  user_agent:        "Mozilla/5.0 (Windows NT; Windows NT 10.0; en-US) WindowsPowerShell/5.1.22621.2428"
  city:              "New York"
  region_state:      "New York"
  country:           "US"
  signin_id:         gen.uuid()
  correlation_id:    gen.uuid()
  session_token:     gen.hex(len=22, case=lower)
  resource_sp_id:    gen.uuid()
steps:
  - emit:
      event_type: azure.monitor.aad@v1
      fields:
        category: SignInLogs
        resourceId: "/tenants/${ref.tenant_id}/providers/Microsoft.aadiam"
        operationName: "Sign-in activity"
        operationVersion: "1.0"
        tenantId: ref.tenant_id
        resultType: "50076"
        resultSignature: "None"
        resultDescription: "Due to a configuration change made by your administrator, or because you moved to a new location, you must use multi-factor authentication to access the resource."
        durationMs: 0
        callerIpAddress: ref.src_ip
        correlationId: ref.correlation_id
        identity: ref.user_display
        Level: 4
        location: ref.country
        properties:
          id: ref.signin_id
          createdDateTime: gen.timestamp()
          userDisplayName: ref.user_display
          userPrincipalName: ref.user_upn
          userId: ref.user_id
          appId: ref.app_id
          appDisplayName: ref.app_display_name
          ipAddress: ref.src_ip
          status:
            errorCode: 50076
            failureReason: "Due to a configuration change made by your administrator, or because you moved to a new location, you must use multi-factor authentication to access the resource."
            additionalDetails: "MFA required in Azure AD"
          clientAppUsed: ref.client_app_used
          userAgent: ref.user_agent
          deviceDetail:
            deviceId: ""
            operatingSystem: "Windows"
          location:
            city: ref.city
            state: ref.region_state
            countryOrRegion: ref.country
            geoCoordinates:
              latitude: 40.756160736083984
              longitude: -73.99697875976562
          mfaDetail: {}
          correlationId: ref.correlation_id
          conditionalAccessStatus: "notApplied"
          appliedConditionalAccessPolicies: []
          authenticationContextClassReferences: []
          originalRequestId: ref.signin_id
          isInteractive: true
          tokenIssuerName: ""
          tokenIssuerType: "AzureAD"
          authenticationProcessingDetails:
            - key: "Legacy TLS (TLS 1.0, 1.1, 3DES)"
              value: "False"
            - key: "Is CAE Token"
              value: "False"
          networkLocationDetails: []
          clientCredentialType: "none"
          processingTimeInMilliseconds: 72
          riskDetail: "none"
          riskLevelAggregated: "none"
          riskLevelDuringSignIn: "none"
          riskState: "none"
          riskEventTypes: []
          riskEventTypes_v2: []
          resourceDisplayName: "Windows Azure Active Directory"
          resourceId: "00000002-0000-0000-c000-000000000000"
          resourceTenantId: ref.tenant_id
          homeTenantId: ref.tenant_id
          tenantId: ref.tenant_id
          authenticationDetails:
            - authenticationStepDateTime: gen.timestamp()
              authenticationMethod: "Password"
              authenticationMethodDetail: "Password in the cloud"
              succeeded: true
              authenticationStepResultDetail: "Correct password"
              authenticationStepRequirement: "Primary authentication"
              StatusSequence: 0
              RequestSequence: 1
            - authenticationStepDateTime: gen.timestamp()
              succeeded: false
              authenticationStepResultDetail: "MFA required in Azure AD"
              authenticationStepRequirement: "Primary authentication"
          authenticationRequirementPolicies:
            - requirementProvider: "user"
              detail: "Per-user MFA"
          sessionLifetimePolicies: []
          authenticationRequirement: "multiFactorAuthentication"
          alternateSignInName: ref.user_upn
          signInIdentifier: ref.user_upn
          servicePrincipalId: ""
          userType: "Member"
          flaggedForReview: false
          isTenantRestricted: false
          autonomousSystemNumber: 12271
          crossTenantAccessType: "none"
          privateLinkDetails: {}
          ssoExtensionVersion: ""
          uniqueTokenIdentifier: ref.session_token
          authenticationStrengths: []
          incomingTokenType: "none"
          authenticationProtocol: "ropc"
          appServicePrincipalId: null
          resourceServicePrincipalId: ref.resource_sp_id
          rngcStatus: 0
          signInTokenProtectionStatus: "none"
          originalTransferMethod: "none"
