type: scenario
description: |
  A successful Microsoft Entra ID (Azure AD) sign-in whose client
  application is "Microsoft Azure PowerShell", the display name the
  Azure PowerShell cmdlets present. Regular users rarely authenticate
  this way, so it can signal an attacker enumerating the tenant.

  All identity fields are bound by the job so the sign-in is
  internally consistent.
mitre:
  tactics: [defense-evasion, initial-access, persistence, privilege-escalation]
  techniques: [T1078.004]
state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  src_ip: gen.ipv4()
  user_upn: "employee@example.onmicrosoft.com"
  user_display: "Routine Employee"
  user_id: gen.uuid()
  city: "Boardman"
  region_state: "Oregon"
  country: "US"
  signin_id: gen.uuid()
  correlation_id: gen.uuid()
  session_token: gen.hex(len=22, case=lower)
  resource_sp_id: gen.uuid()
steps:
  - emit:
      event_type: azure.monitor.aad@v1
      fields:
        category: SignInLogs
        resourceId: "/tenants/${ref.tenant_id}/providers/Microsoft.aadiam"
        operationName: "Sign-in activity"
        operationVersion: "1.0"
        tenantId: ref.tenant_id
        resultType: "0"
        resultSignature: "None"
        durationMs: 0
        callerIpAddress: ref.src_ip
        correlationId: ref.correlation_id
        identity: ref.user_display
        Level: 4
        location: ref.country
        properties:
          id: ref.signin_id
          createdDateTime: gen.timestamp()
          userDisplayName: ref.user_display
          userPrincipalName: ref.user_upn
          userId: ref.user_id
          appId: "1950a258-227b-4e31-a9cf-717495945fc2"
          appDisplayName: "Microsoft Azure PowerShell"
          ipAddress: ref.src_ip
          status:
            errorCode: 0
            additionalDetails: "MFA completed in Azure AD"
          clientAppUsed: "Mobile Apps and Desktop clients"
          userAgent: "Mozilla/4.0 (compatible; MSIE 7.0; Windows NT 10.0; Win64; x64; Trident/7.0; .NET4.0C; .NET4.0E)"
          deviceDetail:
            deviceId: ""
            operatingSystem: "Windows10"
            browser: "IE 7.0"
          location:
            city: ref.city
            state: ref.region_state
            countryOrRegion: ref.country
            geoCoordinates:
              latitude: 45.83599853515625
              longitude: -119.6989974975586
          mfaDetail:
            authMethod: "Text message"
            authDetail: "+X XXXXXXXX92"
          correlationId: ref.correlation_id
          conditionalAccessStatus: "notApplied"
          appliedConditionalAccessPolicies:
            - id: "SecurityDefaults"
              displayName: "Security Defaults"
              enforcedGrantControls:
                - "Mfa"
              enforcedSessionControls: []
              result: "success"
              conditionsSatisfied: 3
              conditionsNotSatisfied: 0
          authenticationContextClassReferences: []
          originalRequestId: ref.signin_id
          isInteractive: true
          tokenIssuerName: ""
          tokenIssuerType: "AzureAD"
          authenticationProcessingDetails:
            - key: "Legacy TLS (TLS 1.0, 1.1, 3DES)"
              value: "False"
            - key: "Is CAE Token"
              value: "False"
          networkLocationDetails: []
          clientCredentialType: "none"
          processingTimeInMilliseconds: 85
          riskDetail: "userPassedMFADrivenByRiskBasedPolicy"
          riskLevelAggregated: "none"
          riskLevelDuringSignIn: "low"
          riskState: "remediated"
          riskEventTypes:
            - "unfamiliarFeatures"
          riskEventTypes_v2:
            - "unfamiliarFeatures"
          resourceDisplayName: "Windows Azure Service Management API"
          resourceId: "797f4846-ba00-4fd7-ba43-dac1f8f63013"
          resourceTenantId: ref.tenant_id
          homeTenantId: ref.tenant_id
          tenantId: ref.tenant_id
          authenticationDetails:
            - authenticationStepDateTime: gen.timestamp()
              authenticationMethod: "Password"
              authenticationMethodDetail: "Password in the cloud"
              succeeded: true
              authenticationStepResultDetail: "Correct password"
              authenticationStepRequirement: "Primary authentication"
              StatusSequence: 0
              RequestSequence: 1
            - authenticationStepDateTime: gen.timestamp()
              authenticationMethod: "Text message"
              authenticationMethodDetail: "+X XXXXXXXX11"
              succeeded: true
              authenticationStepResultDetail: "MFA completed in Azure AD"
              authenticationStepRequirement: "Primary authentication"
          authenticationRequirementPolicies:
            - requirementProvider: "securityDefaults"
              detail: "Security Defaults"
          sessionLifetimePolicies: []
          authenticationRequirement: "multiFactorAuthentication"
          alternateSignInName: ref.user_upn
          signInIdentifier: ref.user_upn
          servicePrincipalId: ""
          userType: "Member"
          flaggedForReview: false
          isTenantRestricted: false
          autonomousSystemNumber: 16509
          crossTenantAccessType: "none"
          privateLinkDetails: {}
          ssoExtensionVersion: ""
          uniqueTokenIdentifier: ref.session_token
          authenticationStrengths: []
          incomingTokenType: "none"
          authenticationProtocol: "none"
          appServicePrincipalId: null
          resourceServicePrincipalId: ref.resource_sp_id
          rngcStatus: 0
