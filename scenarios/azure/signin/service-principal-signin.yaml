type: scenario
description: |
  A successful Microsoft Entra ID (Azure AD) service principal
  sign-in (ServicePrincipalSignInLogs): a non-interactive
  authentication by an application's credential rather than a human
  user, which can bypass interactive sign-in and MFA controls.

  All identity fields (tenant, service principal id/name/app id,
  source IP) are bound by the job so the sign-in is internally
  consistent.
mitre:
  tactics: [defense-evasion, initial-access, persistence, privilege-escalation]
  techniques: [T1078.004]
state:
  tenant_id:                     "11111111-1111-1111-1111-111111111111"
  src_ip:                        gen.ipv4()
  sp_id:                         gen.uuid()
  sp_name:                       "Research"
  app_id:                        gen.uuid()
  sp_credential_key_id:          gen.uuid()
  resource_display_name:         "Office 365 Management APIs"
  resource_app_id:               "c5393580-f805-4401-95e8-94b7a6ef2fc2"
  resource_service_principal_id: gen.uuid()
  correlation_id:                gen.uuid()
  city:                          "Boardman"
  region_state:                  "Ohio"
  country:                       "US"
steps:
  - emit:
      event_type: azure.monitor.aad@v1
      fields:
        resourceId: "/tenants/${ref.tenant_id}/providers/Microsoft.aadiam"
        operationName: "Sign-in activity"
        operationVersion: "1.0"
        category: ServicePrincipalSignInLogs
        tenantId: ref.tenant_id
        resultType: "0"
        resultSignature: "None"
        durationMs: 0
        callerIpAddress: ref.src_ip
        correlationId: ref.correlation_id
        Level: 4
        location: ref.country
        properties:
          id: gen.uuid()
          createdDateTime: gen.timestamp()
          userId: null
          appId: ref.app_id
          ipAddress: ref.src_ip
          status:
            errorCode: 0
          location:
            city: ref.city
            state: ref.region_state
            countryOrRegion: ref.country
            geoCoordinates:
              latitude: 12.83599853515625
              longitude: -94.6989974975586
          correlationId: ref.correlation_id
          conditionalAccessStatus: "notApplied"
          appliedConditionalAccessPolicies: []
          isInteractive: false
          tokenIssuerType: "AzureAD"
          authenticationProcessingDetails:
            - key: "Azure AD App Authentication Library"
              value: ""
          clientCredentialType: "none"
          processingTimeInMilliseconds: 0
          riskDetail: "none"
          riskLevelAggregated: "low"
          riskLevelDuringSignIn: "low"
          riskState: "none"
          resourceDisplayName: ref.resource_display_name
          resourceId: ref.resource_app_id
          servicePrincipalName: ref.sp_name
          servicePrincipalId: ref.sp_id
          flaggedForReview: false
          isTenantRestricted: false
          crossTenantAccessType: "none"
          servicePrincipalCredentialKeyId: ref.sp_credential_key_id
          uniqueTokenIdentifier: gen.regex(pattern=[A-Za-z0-9_-]{22})
          incomingTokenType: "none"
          authenticationProtocol: "none"
          appServicePrincipalId: null
          resourceServicePrincipalId: ref.resource_service_principal_id
          signInTokenProtectionStatus: "none"
          originalTransferMethod: "none"
