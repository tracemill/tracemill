          userType: "Member"
          flaggedForReview: false
          isTenantRestricted: false
          autonomousSystemNumber: 12252
          crossTenantAccessType: "none"
          privateLinkDetails: {}
          ssoExtensionVersion: ""
          uniqueTokenIdentifier: ref.session_token
          authenticationStrengths: []
          incomingTokenType: "none"
          authenticationProtocol: ref.auth_protocol
          appServicePrincipalId: null
          resourceServicePrincipalId: "333b3653-e622-4b8a-a55c-b67d878113db"
          rngcStatus: 0
