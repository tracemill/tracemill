type: scenario
description: |
  A Microsoft Entra ID (Azure AD) interactive sign-in that completed
  using the OAuth device-code authentication protocol: a client polls
  a token endpoint after the user enters a short code shown by the
  client into a separate browser session, rather than signing in
  directly through the client's own UI. Device-code phishing abuses
  this flow to bypass MFA and Conditional Access enforcement -- an
  attacker sends a victim a real Microsoft device-code link, and once
  the victim enters the code, the attacker's client receives a valid
  session token. The authentication protocol is a state parameter so
  a job can drive both a device-code sign-in and an ordinary sign-in
  using no special protocol.
mitre:
  tactics: [credential-access, initial-access]
  techniques: [T1528, T1566.002]
state:
  tenant_id:        "11111111-1111-1111-1111-111111111111"
  src_ip:           gen.ipv4()
  user_upn:         "employee@example.onmicrosoft.com"
  user_display:     "Routine Employee"
  user_id:          gen.uuid()
  app_id:           "d3590ed6-52b3-4102-aeff-aad2292ab01c"
  app_display_name: "Microsoft Office"
  city:             "Portland"
  region_state:     "Portland Province"
  country:          "US"
  signin_id:        gen.uuid()
  correlation_id:   gen.uuid()
  session_token:    gen.hex(len=22, case=lower)
  auth_protocol:    "deviceCode"
steps:
  - emit:
      event_type: azure.monitor.aad@v1
      fields:
        category: SignInLogs
        resourceId: "/tenants/${ref.tenant_id}/providers/Microsoft.aadiam"
        operationName: "Sign-in activity"
        operationVersion: "1.0"
        tenantId: ref.tenant_id
        resultType: "0"
        resultSignature: "None"
        durationMs: 0
        callerIpAddress: ref.src_ip
        correlationId: ref.correlation_id
        identity: ref.user_display
        Level: 4
        location: ref.country
        properties:
          id: ref.signin_id
          createdDateTime: gen.timestamp()
          userDisplayName: ref.user_display
          userPrincipalName: ref.user_upn
          userId: ref.user_id
          appId: ref.app_id
          appDisplayName: ref.app_display_name
          ipAddress: ref.src_ip
          status:
            errorCode: 0
          clientAppUsed: "Mobile Apps and Desktop clients"
          userAgent: "Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:109.0) Gecko/20100101 Firefox/115.0"
          deviceDetail:
            deviceId: ""
            operatingSystem: "Windows"
            browser: "Firefox 115.0"
          location:
            city: ref.city
            state: ref.region_state
            countryOrRegion: ref.country
            geoCoordinates:
              latitude: 2.05
              longitude: -77.05
          correlationId: ref.correlation_id
          conditionalAccessStatus: "notApplied"
          appliedConditionalAccessPolicies:
            - id: "SecurityDefaults"
              displayName: "Security Defaults"
              enforcedGrantControls: []
              enforcedSessionControls: []
              result: "success"
              conditionsSatisfied: 3
              conditionsNotSatisfied: 0
          authenticationContextClassReferences: []
          originalRequestId: ref.signin_id
          isInteractive: true
          tokenIssuerName: ""
          tokenIssuerType: "AzureAD"
          authenticationProcessingDetails:
            - key: "Legacy TLS (TLS 1.0, 1.1, 3DES)"
              value: "False"
            - key: "Is CAE Token"
              value: "False"
          networkLocationDetails: []
          clientCredentialType: "none"
          processingTimeInMilliseconds: 315
          riskDetail: "none"
          riskLevelAggregated: "none"
          riskLevelDuringSignIn: "none"
          riskState: "none"
          riskEventTypes: []
          riskEventTypes_v2: []
          resourceDisplayName: "Microsoft Graph"
          resourceId: "00000003-0000-0000-c000-000000000000"
          resourceTenantId: ref.tenant_id
          homeTenantId: ref.tenant_id
          tenantId: ref.tenant_id
          authenticationDetails: []
