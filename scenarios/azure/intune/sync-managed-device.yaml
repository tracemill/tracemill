type: scenario
description: |
  A Microsoft Intune audit record showing an administrator manually
  triggering a managed-device sync -- pushing pending policy, script,
  or app changes to a device immediately rather than waiting for its
  normal poll interval. This is a legitimate convenience feature, used
  to expedite delivery in a pinch, but an attacker who has already
  staged a malicious payload (a device health script, a configuration
  policy) can use the same manual sync to speed up its delivery to
  target devices instead of waiting for the normal poll cycle.

  Tenant, the acting administrator, and the correlation and audit-event
  ids are generated or bound so each emitted record is self-consistent
  and individually correlatable.
mitre:
  tactics: [execution, lateral-movement, impact]
  techniques: [T1021.007, T1072, T1529]
state:
  tenant_id:       "11111111-1111-1111-1111-111111111111"
  admin_upn:       "admin@example.onmicrosoft.com"
  admin_object_id: gen.uuid()
  device_object_id: gen.uuid()
  correlation_id:  gen.uuid()
  audit_event_id:  gen.uuid()
  event_time:      gen.timestamp()
steps:
  - emit:
      event_type: azure.monitor.activity@v1
      fields:
        tenantId: ref.tenant_id
        category: "AuditLogs"
        operationName: "syncDevice ManagedDevice"
        resultType: "Success"
        resultDescription: "None"
        correlationId: ref.correlation_id
        identity: ref.admin_upn
        properties:
          ActivityDate: "4/29/2024 1:53:24 PM"
          ActivityResultStatus: 1
          ActivityType: 3
          Actor:
            ActorType: 1
            Application: "5926fc8e-304e-4f59-8bed-58ca97cc39a4"
            ApplicationName: "Microsoft Intune portal extension"
            IsDelegatedAdmin: false
            Name: null
            ObjectId: ref.admin_object_id
            PartnerTenantId: "00000000-0000-0000-0000-000000000000"
            UPN: ref.admin_upn
            UserPermissions:
              - "*"
          AdditionalDetails: ""
          AuditEventId: ref.audit_event_id
          Category: 4
          RelationId: null
          TargetDisplayNames:
            - "syncDevice"
          TargetObjectIds:
            - ref.device_object_id
          Targets:
            - Name: "syncDevice"
              ModifiedProperties:
                - Name: "DeviceManagementAPIVersion"
                  Old: null
                  New: "5024-02-13"
