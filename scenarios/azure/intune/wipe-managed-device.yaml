type: scenario
description: |
  A Microsoft Intune audit record for a device wipe triggered from the
  admin portal, factory-resetting an enrolled device. One is routine
  offboarding or a lost-device response; several from one
  administrator in a short window suggest a large-scale wiping attack.
mitre:
  tactics: [impact]
  techniques: [T1561.001]
state:
  tenant_id:          "11111111-1111-1111-1111-111111111111"
  admin_upn:          "admin@example.onmicrosoft.com"
  admin_object_id:    gen.uuid()
  device_object_id:   gen.uuid()
  azure_ad_device_id: gen.uuid()
  correlation_id:     gen.uuid()
  audit_event_id:     gen.uuid()
steps:
  - emit:
      event_type: azure.monitor.activity@v1
      fields:
        tenantId: ref.tenant_id
        category: "AuditLogs"
        operationName: "wipe ManagedDevice"
        resultType: "Success"
        resultDescription: "None"
        correlationId: ref.correlation_id
        identity: ref.admin_upn
        properties:
          ActivityDate: "3/29/2026 12:09:20 AM"
          ActivityResultStatus: 1
          ActivityType: 3
          Actor:
            ActorType: 1
            Application: "5926fc8e-304e-4f59-8bed-58ca97cc39a4"
            ApplicationName: "Microsoft Intune portal extension"
            IsDelegatedAdmin: false
            Name: null
            ObjectId: ref.admin_object_id
            PartnerTenantId: "00000000-0000-0000-0000-000000000000"
            UserPermissions:
              - "Microsoft.Intune/RemoteTasks/BypassActivationLock;Microsoft.Intune/RemoteTasks/LocateDevice;Microsoft.Intune/ManagedDevices/ViewReports;Microsoft.Intune/RemoteTasks/Wipe;Microsoft.Intune/ManagedDevices/Read;Microsoft.Intune/RemoteTasks/ResetPasscode;Microsoft.Intune/RemoteTasks/RemoteLock;Microsoft.Intune/RemoteTasks/DisableLostMode;Microsoft.Intune/RemoteTasks/EnableLostMode"
            UPN: ref.admin_upn
          AdditionalDetails: ""
          AuditEventId: ref.audit_event_id
          Category: 4
          RelationId: null
          TargetDisplayNames:
            - "wipe"
          TargetObjectIds:
            - ref.device_object_id
          Targets:
            - ModifiedProperties:
                - Name: "keepEnrollmentData"
                  Old: null
                  New: "False"
                - Name: "AzureADDeviceId"
                  Old: null
                  New: ref.azure_ad_device_id
                - Name: "DeviceManagementAPIVersion"
                  Old: null
                  New: "5025-10-23"
              Name: "wipe"
