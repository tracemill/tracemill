type: scenario
description: |
  A Microsoft Intune audit record for a device health (remediation)
  script being created. These scripts run with local SYSTEM privileges
  on every managed device they target, so the same capability can be
  abused for code execution and lateral movement onto those endpoints.
mitre:
  tactics: [execution, lateral-movement, defense-evasion, command-and-control]
  techniques: [T1072, T1021.007, T1202, T1105]
state:
  tenant_id:       "11111111-1111-1111-1111-111111111111"
  admin_upn:       "admin@example.onmicrosoft.com"
  admin_object_id: gen.uuid()
  script_object_id: gen.uuid()
  correlation_id:  gen.uuid()
  audit_event_id:  gen.uuid()
steps:
  - emit:
      event_type: azure.monitor.activity@v1
      fields:
        tenantId: ref.tenant_id
        category: "AuditLogs"
        operationName: "createDeviceHealthScript DeviceHealthScript"
        resultType: "Success"
        resultDescription: "None"
        correlationId: ref.correlation_id
        identity: ref.admin_upn
        properties:
          ActivityDate: "4/29/2024 1:30:28 PM"
          ActivityResultStatus: 1
          ActivityType: 0
          Actor:
            ActorType: 1
            Application: "5926fc8e-304e-4f59-8bed-58ca97cc39a4"
            ApplicationName: "Microsoft Intune portal extension"
            IsDelegatedAdmin: false
            Name: null
            ObjectId: ref.admin_object_id
            PartnerTenantId: "00000000-0000-0000-0000-000000000000"
            UPN: ref.admin_upn
            UserPermissions:
              - "*"
          AdditionalDetails: ""
          AuditEventId: ref.audit_event_id
          Category: 3
          RelationId: null
          TargetDisplayNames:
            - "<null>"
          TargetObjectIds:
            - ref.script_object_id
          Targets:
            - Name: null
              ModifiedProperties:
                - Name: "DeviceManagementAPIVersion"
                  Old: null
                  New: "5024-02-13"
