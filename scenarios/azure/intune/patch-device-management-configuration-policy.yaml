type: scenario
description: |
  A Microsoft Intune audit record showing a device management
  configuration policy being updated in the tenant -- for example, a
  security baseline or compliance policy pushed out to managed
  devices. This is routine, expected administrative activity;
  configuration policy changes at scale can also be a vector for
  weakening endpoint security controls tenant-wide (disabling
  antivirus, loosening compliance requirements), so the record is
  worth distinguishing from other Intune management operations such as
  device health script or mobile app changes.

  Tenant, the acting administrator, and the correlation and audit-event
  ids are generated or bound so each emitted record is self-consistent
  and individually correlatable.
mitre:
  tactics: [execution, lateral-movement, defense-evasion, privilege-escalation]
  techniques: [T1072, T1484, T1021.007, T1562.001, T1562.004]
state:
  tenant_id:       "11111111-1111-1111-1111-111111111111"
  admin_upn:       "admin@example.onmicrosoft.com"
  admin_object_id: gen.uuid()
  policy_object_id: gen.uuid()
  policy_display:  "No AV"
  correlation_id:  gen.uuid()
  audit_event_id:  gen.uuid()
  event_time:      gen.timestamp()
steps:
  - emit:
      event_type: azure.monitor.activity@v1
      fields:
        tenantId: ref.tenant_id
        category: "AuditLogs"
        operationName: "Patch DeviceManagementConfigurationPolicy"
        resultType: "Success"
        resultDescription: "None"
        correlationId: ref.correlation_id
        identity: ref.admin_upn
        properties:
          ActivityDate: "4/29/2024 10:09:37 AM"
          ActivityResultStatus: 1
          ActivityType: 2
          Actor:
            ActorType: 1
            Application: "5926fc8e-304e-4f59-8bed-58ca97cc39a4"
            ApplicationName: "Microsoft Intune portal extension"
            IsDelegatedAdmin: false
            Name: null
            ObjectId: ref.admin_object_id
            PartnerTenantId: "00000000-0000-0000-0000-000000000000"
            UPN: ref.admin_upn
            UserPermissions:
              - "*"
          AdditionalDetails: "Key = AccountQuotaEntityValue = DeviceConfiguration\r\n"
          AuditEventId: ref.audit_event_id
          Category: 3
          RelationId: null
          TargetDisplayNames:
            - ref.policy_display
          TargetObjectIds:
            - ref.policy_object_id
          Targets:
            - Name: ref.policy_display
              ModifiedProperties:
                - Name: "Name"
                  Old: null
                  New: ref.policy_display
                - Name: "Description"
                  Old: null
                  New: ""
                - Name: "Platforms"
                  Old: null
                  New: "Windows10"
                - Name: "SettingCount"
                  Old: null
                  New: "20"
                - Name: "DeviceManagementAPIVersion"
                  Old: null
                  New: "5024-02-12"
