type: scenario
description: |
  A Microsoft Intune audit record showing a packaged mobile
  application being added to the tenant's app catalog for deployment
  to managed devices. Software deployment tooling of this kind is
  routine, but the same delivery path can be abused to push a
  malicious payload to every device the app targets -- code execution
  and lateral movement onto Intune-managed endpoints. The record is
  also a genuinely different Intune operation from device health
  script, device management configuration policy, and managed-device
  sync operations, so it doubles as a neutral event for detections
  scoped to one of those other operation types.

  The operationName follows the verb+ObjectType naming pattern observed
  across the other captured Intune operations in this same audit
  stream (e.g. "createDeviceHealthScript DeviceHealthScript"); no
  captured master sample exists for this specific operation, so this
  is a documented, pattern-derived event rather than a fidelity-checked
  one.

  Tenant, the acting administrator, and the correlation and audit-event
  ids are generated or bound so each emitted record is self-consistent
  and individually correlatable.
mitre:
  tactics: [execution, lateral-movement, defense-evasion, command-and-control]
  techniques: [T1072, T1021.007, T1202, T1105]
state:
  tenant_id:       "11111111-1111-1111-1111-111111111111"
  admin_upn:       "admin@example.onmicrosoft.com"
  admin_object_id: gen.uuid()
  app_object_id:   gen.uuid()
  app_display:     "Company Portal"
  correlation_id:  gen.uuid()
  audit_event_id:  gen.uuid()
  event_time:      gen.timestamp()
steps:
  - emit:
      event_type: azure.monitor.activity@v1
      fields:
        tenantId: ref.tenant_id
        category: "AuditLogs"
        operationName: "createMobileApp MobileApp"
        resultType: "Success"
        resultDescription: "None"
        correlationId: ref.correlation_id
        identity: ref.admin_upn
        properties:
          ActivityDate: "4/29/2024 2:10:00 PM"
          ActivityResultStatus: 1
          ActivityType: 0
          Actor:
            ActorType: 1
            Application: "5926fc8e-304e-4f59-8bed-58ca97cc39a4"
            ApplicationName: "Microsoft Intune portal extension"
            IsDelegatedAdmin: false
            Name: null
            ObjectId: ref.admin_object_id
            PartnerTenantId: "00000000-0000-0000-0000-000000000000"
            UPN: ref.admin_upn
            UserPermissions:
              - "*"
          AdditionalDetails: ""
          AuditEventId: ref.audit_event_id
          Category: 3
          RelationId: null
          TargetDisplayNames:
            - ref.app_display
          TargetObjectIds:
            - ref.app_object_id
          Targets:
            - Name: ref.app_display
              ModifiedProperties:
                - Name: "DeviceManagementAPIVersion"
                  Old: null
                  New: "5024-02-13"
