type: scenario
description: |
  A Microsoft Entra ID (Azure AD) directory audit record ("Add member to
  role") assigning a built-in directory role to a user. The
  targetResources modifiedProperties record the role's display name,
  object id, and (for built-in roles with one) its well-known template
  id. Global Administrator is the most privileged built-in role --
  holders have unrestricted access to every Azure AD-managed resource
  and setting in the tenant, comparable to a Domain Administrator in
  traditional Active Directory -- so its assignment is a common
  persistence and privilege-escalation step once an attacker gains any
  administrative foothold. The role name is a state parameter so a job
  can drive both a Global Administrator assignment and an assignment of
  an unrelated, narrower role that should not trip a detection scoped
  to the Global Administrator role.
mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1098.003]
state:
  tenant_id:             "11111111-1111-1111-1111-111111111111"
  admin_upn:             "admin@example.onmicrosoft.com"
  admin_object_id:       gen.uuid()
  target_upn:            "user@example.onmicrosoft.com"
  target_object_id:      gen.uuid()
  src_ip:                gen.ipv4()
  correlation_id:        gen.uuid()
  record_suffix:         gen.hex(len=5, case=upper)
  record_seq:            gen.int(min=100000000, max=999999999)
  activity_time:         gen.timestamp()
  role_object_id:        gen.uuid()
  role_display_name:     "Global Administrator"
  role_template_id:      "62e90394-69f5-4237-9190-012177145e10"
  role_well_known_name:  "\"TenantAdmins\""
steps:
  - emit:
      event_type: azure.monitor.aad@v1
      fields:
        resourceId: "/tenants/${ref.tenant_id}/providers/Microsoft.aadiam"
        operationName: "Add member to role"
        operationVersion: "1.0"
        category: AuditLogs
        tenantId: ref.tenant_id
        resultSignature: "None"
        durationMs: 0
        callerIpAddress: ref.src_ip
        correlationId: ref.correlation_id
        Level: 4
        properties:
          id: "Directory_${ref.correlation_id}_${ref.record_suffix}_${ref.record_seq}"
          category: RoleManagement
          correlationId: ref.correlation_id
          result: success
          resultReason: ""
          activityDisplayName: "Add member to role"
          activityDateTime: ref.activity_time
          loggedByService: "Core Directory"
          operationType: Assign
          userAgent: null
          initiatedBy:
            user:
              id: ref.admin_object_id
              displayName: null
              userPrincipalName: ref.admin_upn
              ipAddress: ref.src_ip
              roles: []
          targetResources:
            - id: ref.target_object_id
              displayName: null
              type: User
              userPrincipalName: ref.target_upn
              modifiedProperties:
                - displayName: "Role.ObjectID"
                  oldValue: null
                  newValue: "\"${ref.role_object_id}\""
                - displayName: "Role.DisplayName"
                  oldValue: null
                  newValue: "\"${ref.role_display_name}\""
                - displayName: "Role.TemplateId"
                  oldValue: null
                  newValue: "\"${ref.role_template_id}\""
                - displayName: "Role.WellKnownObjectName"
                  oldValue: null
                  newValue: ref.role_well_known_name
              administrativeUnits: []
            - id: ref.role_object_id
              displayName: null
              type: Role
              modifiedProperties: []
              administrativeUnits: []
          additionalDetails: []
