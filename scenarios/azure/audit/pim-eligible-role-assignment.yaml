type: scenario
description: |
  A Microsoft Entra ID (Azure AD) directory audit record from the
  Privileged Identity Management (PIM) service for a user's eligible
  assignment to a built-in directory role. PIM records the completion
  of the assignment across five targetResources entries: the role
  itself, the eligibility request or role-assignment object, the
  target user, the tenant directory, and the built-in-roles provider.
  Once eligible, the user can activate the role on demand without
  further approval, so an attacker who can create this assignment
  gains a standing path to privileged access. The operation name, its
  operationType, and the second targetResources entry (a "Request" for
  a new eligibility grant, a "RoleAssignment" for its removal) are
  state parameters so a job can drive both an eligible-role grant and
  its removal, which should not trip a detection scoped to grants.
mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1098.003]
state:
  tenant_id:            "11111111-1111-1111-1111-111111111111"
  admin_object_id:      gen.uuid()
  admin_display:        "PIM Assignment Service"
  target_upn:           "targetUser@example.onmicrosoft.com"
  target_display:       "Target User"
  target_object_id:     gen.uuid()
  role_id:              "62e90394-69f5-4237-9190-012177145e10"
  role_display:         "Global Administrator"
  src_ip:               gen.ipv4()
  correlation_id:       gen.uuid()
  record_suffix:        gen.regex(pattern=[0-9A-Z]{5})
  record_seq:           gen.int(min=100000000, max=999999999)
  activity_time:        gen.timestamp()
  start_time:           gen.timestamp()
  expiration_time:      gen.timestamp()
  operation_name:       "Add eligible member to role in PIM completed (timebound)"
  operation_type:       "AssignEligibleRole"
  second_resource_id:   gen.uuid()
  second_resource_type: "Request"
steps:
  - emit:
      event_type: azure.monitor.aad@v1
      fields:
        resourceId: "/tenants/${ref.tenant_id}/providers/Microsoft.aadiam"
        operationName: ref.operation_name
        operationVersion: "1.0"
        category: AuditLogs
        tenantId: ref.tenant_id
        resultSignature: "None"
        durationMs: 0
        correlationId: ref.correlation_id
        identity: ref.admin_display
        Level: 4
        properties:
          id: "PIM_${ref.correlation_id}_${ref.record_suffix}_${ref.record_seq}"
          category: RoleManagement
          correlationId: ref.correlation_id
          result: success
          resultReason: null
          activityDisplayName: ref.operation_name
          activityDateTime: ref.activity_time
          loggedByService: "PIM"
          operationType: ref.operation_type
          userAgent: null
          initiatedBy:
            user:
              id: ref.admin_object_id
              displayName: ref.admin_display
              userPrincipalName: ""
              ipAddress: null
              roles: []
          targetResources:
            - id: ref.role_id
              displayName: ref.role_display
              type: Role
              modifiedProperties:
                - displayName: "RoleDefinitionOriginId"
                  oldValue: "\"\""
                  newValue: "\"${ref.role_id}\""
                - displayName: "RoleDefinitionOriginType"
                  oldValue: "\"\""
                  newValue: "\"BuiltInRole\""
                - displayName: "TemplateId"
                  oldValue: "\"\""
                  newValue: "\"${ref.role_id}\""
              administrativeUnits: []
            - id: ref.second_resource_id
              displayName: null
              type: ref.second_resource_type
              modifiedProperties: []
              administrativeUnits: []
            - id: ref.target_object_id
              displayName: ref.target_display
              type: User
              userPrincipalName: ref.target_upn
              modifiedProperties: []
              administrativeUnits: []
            - id: ref.tenant_id
              displayName: "Default Directory"
              type: Directory
              modifiedProperties: []
              administrativeUnits: []
            - id: "00000000-0000-0000-0000-000000000001"
              displayName: "Azure AD Directory Roles"
              type: Provider
              modifiedProperties: []
              administrativeUnits: []
          additionalDetails:
            - key: "RoleDefinitionOriginId"
              value: ref.role_id
            - key: "RoleDefinitionOriginType"
              value: "BuiltInRole"
            - key: "TemplateId"
              value: ref.role_id
            - key: "StartTime"
              value: ref.start_time
            - key: "ExpirationTime"
              value: ref.expiration_time
            - key: "oid"
              value: ref.admin_object_id
            - key: "tid"
              value: ref.tenant_id
            - key: "wids"
              value: "${ref.role_id},b79fbf4d-3ef9-4689-8143-76b194e85509"
            - key: "ipaddr"
              value: ref.src_ip
