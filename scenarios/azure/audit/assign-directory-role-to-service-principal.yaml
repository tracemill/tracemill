type: scenario
description: |
  A Microsoft Entra ID (Azure AD) directory audit record ("Add member
  to role") assigning a built-in directory role to a service principal
  (an application identity) rather than a human user. The
  targetResources modifiedProperties record the role's display name,
  object id, and well-known template id, plus the service principal's
  own AppId. Assigning a privileged role to a service principal is a
  documented privilege-escalation and persistence technique: unlike a
  user account, a service principal authenticates with a credential an
  attacker can mint or steal without triggering interactive sign-in or
  MFA controls. The role name is a state parameter so a job can drive
  both a privileged-role assignment and an assignment of a genuinely
  non-privileged role that should not trip a detection scoped to
  privileged roles.
mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1098.003]
state:
  tenant_id:             "11111111-1111-1111-1111-111111111111"
  admin_upn:             "admin@example.onmicrosoft.com"
  admin_object_id:       gen.uuid()
  sp_display:            "App 5"
  sp_object_id:          gen.uuid()
  sp_app_id:             gen.uuid()
  src_ip:                gen.ipv4()
  correlation_id:        gen.uuid()
  record_suffix:         gen.regex(pattern=[0-9A-Z]{5})
  record_seq:            gen.int(min=100000000, max=999999999)
  activity_time:         gen.timestamp()
  role_object_id:        gen.uuid()
  role_display_name:     "Privileged Role Administrator"
  role_template_id:      "e8611ab8-c189-46e8-94e1-60213ab1f814"
  role_well_known_name:  "\"ApplicationAdministrators\""
steps:
  - emit:
      event_type: azure.monitor.aad@v1
      fields:
        resourceId: "/tenants/${ref.tenant_id}/providers/Microsoft.aadiam"
        operationName: "Add member to role"
        operationVersion: "1.0"
        category: AuditLogs
        tenantId: ref.tenant_id
        resultSignature: "None"
        durationMs: 0
        callerIpAddress: ref.src_ip
        correlationId: ref.correlation_id
        Level: 4
        properties:
          id: "Directory_${ref.correlation_id}_${ref.record_suffix}_${ref.record_seq}"
          category: RoleManagement
          correlationId: ref.correlation_id
          result: success
          resultReason: ""
          activityDisplayName: "Add member to role"
          activityDateTime: ref.activity_time
          loggedByService: "Core Directory"
          operationType: Assign
          userAgent: null
          initiatedBy:
            user:
              id: ref.admin_object_id
              displayName: null
              userPrincipalName: ref.admin_upn
              ipAddress: ref.src_ip
              roles: []
          targetResources:
            - id: ref.sp_object_id
              displayName: ref.sp_display
              type: ServicePrincipal
              modifiedProperties:
                - displayName: "Role.ObjectID"
                  oldValue: null
                  newValue: "\"${ref.role_object_id}\""
                - displayName: "Role.DisplayName"
                  oldValue: null
                  newValue: "\"${ref.role_display_name}\""
                - displayName: "Role.TemplateId"
                  oldValue: null
                  newValue: "\"${ref.role_template_id}\""
                - displayName: "Role.WellKnownObjectName"
                  oldValue: null
                  newValue: ref.role_well_known_name
                - displayName: "TargetId.ServicePrincipalNames"
                  oldValue: null
                  newValue: "\"${ref.sp_app_id}\""
              administrativeUnits: []
            - id: ref.role_object_id
              displayName: null
              type: Role
              modifiedProperties: []
              administrativeUnits: []
          additionalDetails:
            - key: "AppId"
              value: ref.sp_app_id
