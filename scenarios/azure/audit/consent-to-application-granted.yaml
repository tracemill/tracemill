type: scenario
description: |
  A Microsoft Entra ID (Azure AD) directory audit record for a user
  granting OAuth consent to an application. The operationName is
  "Consent to application", and the targetResources modifiedProperties
  record the consent context and the granted delegated permission
  scopes. A successful consent exposes organizational data to the
  application within those scopes -- a common vector for
  consent-phishing, since the application need never touch the user's
  password. The result and its reason are state parameters so a job
  can drive both a successful grant and a failed consent attempt
  (e.g. the user or tenant policy declined it) that should not trip a
  detection scoped to successful grants specifically.
mitre:
  tactics: [credential-access]
  techniques: [T1528]
state:
  tenant_id:          "11111111-1111-1111-1111-111111111111"
  user_upn:           "user@example.onmicrosoft.com"
  user_object_id:     gen.uuid()
  app_display:        "Bad App 1"
  app_object_id:      gen.uuid()
  app_id:             gen.uuid()
  resource_sp_id:     gen.uuid()
  consent_grant_id:   "AAAAAAAAAAAAAAAAAAAAALSZcc5Sj_NGtUtP2B3pYeI2veRXIpdKSpcpcgPY4Aty"
  consent_scope:      "Mail.Read Mail.Read.Shared Mail.ReadBasic Mail.ReadBasic.Shared Mail.ReadWrite Mail.ReadWrite.Shared Mail.Send Mail.Send.Shared User.Read"
  src_ip:             gen.ipv4()
  correlation_id:     gen.uuid()
  record_suffix:      gen.regex(pattern=[0-9A-Z]{5})
  record_seq:         gen.int(min=100000000, max=999999999)
  activity_time:      gen.timestamp()
  result:             "success"
  result_reason:      ""
steps:
  - emit:
      event_type: azure.monitor.aad@v1
      fields:
        resourceId: "/tenants/${ref.tenant_id}/providers/Microsoft.aadiam"
        operationName: "Consent to application"
        operationVersion: "1.0"
        category: AuditLogs
        tenantId: ref.tenant_id
        resultSignature: "None"
        durationMs: 0
        callerIpAddress: ref.src_ip
        correlationId: ref.correlation_id
        Level: 4
        properties:
          id: "Directory_${ref.correlation_id}_${ref.record_suffix}_${ref.record_seq}"
          category: ApplicationManagement
          correlationId: ref.correlation_id
          result: ref.result
          resultReason: ref.result_reason
          activityDisplayName: "Consent to application"
          activityDateTime: ref.activity_time
          loggedByService: "Core Directory"
          operationType: Assign
          userAgent: null
          initiatedBy:
            user:
              id: ref.user_object_id
              displayName: null
              userPrincipalName: ref.user_upn
              ipAddress: ref.src_ip
              roles: []
          targetResources:
            - id: ref.app_object_id
              displayName: ref.app_display
              type: ServicePrincipal
              modifiedProperties:
                - displayName: "ConsentContext.IsAdminConsent"
                  oldValue: null
                  newValue: "\"False\""
                - displayName: "ConsentContext.IsAppOnly"
                  oldValue: null
                  newValue: "\"False\""
                - displayName: "ConsentContext.OnBehalfOfAll"
                  oldValue: null
                  newValue: "\"False\""
                - displayName: "ConsentContext.Tags"
                  oldValue: null
                  newValue: "\"WindowsAzureActiveDirectoryIntegratedApp\""
                - displayName: "ConsentAction.Permissions"
                  oldValue: null
                  newValue: "\"[] => [[Id: ${ref.consent_grant_id}, ClientId: 00000000-0000-0000-0000-000000000000, PrincipalId: ${ref.user_object_id}, ResourceId: ${ref.resource_sp_id}, ConsentType: Principal, Scope: ${ref.consent_scope}, CreatedDateTime: , LastModifiedDateTime ]]; \""
                - displayName: "TargetId.ServicePrincipalNames"
                  oldValue: null
                  newValue: "\"${ref.app_id}\""
              administrativeUnits: []
          additionalDetails:
            - key: "User-Agent"
              value: "EvoSTS"
            - key: "AppId"
              value: ref.app_id
