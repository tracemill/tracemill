type: scenario
description: |
  A routine Microsoft Entra ID (Azure AD) directory audit record in which an
  administrator resets an existing user account's password (a "Reset password
  (by admin)" operation). On its own, with no account-enable on the same target
  beforehand, this is ordinary help-desk activity -- a benign control showing
  that a detector keyed on an enable-then-reset chain does not raise on a lone
  reset.
state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  admin_upn: "admin@example.onmicrosoft.com"
  admin_object_id: gen.uuid()
  target_upn: "user@example.onmicrosoft.com"
  target_object_id: gen.uuid()
  src_ip: gen.ipv4()
  reset_correlation_id: gen.uuid()
  reset_suffix: gen.hex(len=5, case=upper)
  reset_seq: gen.int(min=1000000, max=9999999)
steps:
  - emit:
      event_type: azure.monitor.aad@v1
      fields:
        resourceId: "/tenants/${ref.tenant_id}/providers/Microsoft.aadiam"
        operationName: "Reset password (by admin)"
        operationVersion: "1.0"
        category: AuditLogs
        tenantId: ref.tenant_id
        resultSignature: "None"
        resultDescription: "None"
        durationMs: 0
        callerIpAddress: ref.src_ip
        correlationId: ref.reset_correlation_id
        Level: 4
        properties:
          id: "SSPR_${ref.reset_correlation_id}_${ref.reset_suffix}_${ref.reset_seq}"
          category: UserManagement
          correlationId: ref.reset_correlation_id
          result: success
          resultReason: "None"
          activityDisplayName: "Reset password (by admin)"
          activityDateTime: gen.timestamp()
          loggedByService: "Self-service Password Management"
          operationType: Update
          userAgent: null
          initiatedBy:
            user:
              id: ref.admin_object_id
              displayName: null
              userPrincipalName: ref.admin_upn
              ipAddress: ref.src_ip
              roles: []
          targetResources:
            - id: ref.target_object_id
              displayName: null
              type: User
              userPrincipalName: ref.target_upn
              modifiedProperties: []
              administrativeUnits: []
          additionalDetails:
            - key: OnPremisesAgent
              value: "None"
