type: scenario
description: |
  A Microsoft Entra ID (Azure AD) directory audit record for a user's
  multi-factor authentication being disabled. The operationName is
  "Disable Strong Authentication" with a success result, and the
  targetResources modifiedProperties record the
  StrongAuthenticationRequirement setting clearing to an empty list --
  removing the per-relying-party MFA enforcement state that was
  previously in place. Disabling a user's MFA removes an essential
  security control and is a documented persistence technique: an
  attacker who compromises an account, or who has admin rights to
  disable MFA for another user, can maintain access without
  re-triggering a multi-factor challenge. The operation name is a
  state parameter so a job can drive both an MFA-disabling change and
  an unrelated, ordinary directory operation that should not trip a
  detection scoped to "Disable Strong Authentication".
mitre:
  tactics: [credential-access, defense-evasion, persistence, resource-development]
  techniques: [T1556.006, T1586.003]
state:
  tenant_id:        "11111111-1111-1111-1111-111111111111"
  admin_upn:        "admin@example.onmicrosoft.com"
  admin_object_id:  gen.uuid()
  target_upn:       "user@example.onmicrosoft.com"
  target_object_id: gen.uuid()
  src_ip:           gen.ipv4()
  correlation_id:   gen.uuid()
  record_suffix:    gen.hex(len=5, case=upper)
  record_seq:       gen.int(min=100000000, max=999999999)
  activity_time:    gen.timestamp()
  operation_name:   "Disable Strong Authentication"
steps:
  - emit:
      event_type: azure.monitor.aad@v1
      fields:
        resourceId: "/tenants/${ref.tenant_id}/providers/Microsoft.aadiam"
        operationName: ref.operation_name
        operationVersion: "1.0"
        category: AuditLogs
        tenantId: ref.tenant_id
        resultSignature: "None"
        durationMs: 0
        callerIpAddress: ref.src_ip
        correlationId: ref.correlation_id
        Level: 4
        properties:
          id: "Directory_${ref.correlation_id}_${ref.record_suffix}_${ref.record_seq}"
          category: UserManagement
          correlationId: ref.correlation_id
          result: success
          resultReason: ""
          activityDisplayName: ref.operation_name
          activityDateTime: ref.activity_time
          loggedByService: "Core Directory"
          operationType: Update
          userAgent: null
          initiatedBy:
            user:
              id: ref.admin_object_id
              displayName: null
              userPrincipalName: ref.admin_upn
              ipAddress: ref.src_ip
              roles: []
          targetResources:
            - id: ref.target_object_id
              displayName: null
              type: User
              userPrincipalName: ref.target_upn
              modifiedProperties:
                - displayName: "StrongAuthenticationRequirement"
                  oldValue: "[{\"RelyingParty\":\"*\",\"State\":1,\"RememberDevicesNotIssuedBefore\":\"${ref.activity_time}\"}]"
                  newValue: "[]"
                - displayName: "Included Updated Properties"
                  oldValue: null
                  newValue: "\"StrongAuthenticationRequirement\""
              administrativeUnits: []
          additionalDetails: []
