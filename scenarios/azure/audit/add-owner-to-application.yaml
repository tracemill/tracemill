type: scenario
description: |
  A Microsoft Entra ID (Azure AD) directory audit record for a user
  being added as an owner of an application registration. The
  targetResources modifiedProperties record the application's object
  id, display name, and app id. Application owners can manage the
  application's credentials and permissions without needing a
  directory role, and service principals don't support MFA or
  conditional access, so adding an owner is a documented persistence
  and privilege-escalation technique -- an attacker who compromises an
  admin account can add another identity (or an already-compromised
  one) as an owner to gain a durable, less-visible foothold. The new
  owner's UPN is a state parameter so a job can drive both an admin
  adding a different user as owner and an admin adding themselves,
  which should not trip a detection scoped to a different initiator
  and owner.
mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1098]
state:
  tenant_id:            "11111111-1111-1111-1111-111111111111"
  admin_upn:            "admin@example.onmicrosoft.com"
  admin_object_id:      gen.uuid()
  new_owner_upn:        "targetUser@example.onmicrosoft.com"
  new_owner_object_id:  gen.uuid()
  app_object_id:        gen.uuid()
  app_display:          "CloudForge"
  app_id:               gen.uuid()
  src_ip:               gen.ipv4()
  correlation_id:       gen.uuid()
  record_suffix:        gen.regex(pattern=[0-9A-Z]{5})
  record_seq:           gen.int(min=100000000, max=999999999)
  activity_time:        gen.timestamp()
  user_agent:           "Mozilla/5.0 (Macintosh; Darwin 22.4.0 Darwin Kernel Version 22.4.0: Mon Mar  6 21:00:17 PST 2023; root:xnu-8796.101.5~3/RELEASE_X86_64; en-US) PowerShell/7.3.4"
steps:
  - emit:
      event_type: azure.monitor.aad@v1
      fields:
        resourceId: "/tenants/${ref.tenant_id}/providers/Microsoft.aadiam"
        operationName: "Add owner to application"
        operationVersion: "1.0"
        category: AuditLogs
        tenantId: ref.tenant_id
        resultSignature: "None"
        durationMs: 0
        callerIpAddress: ref.src_ip
        correlationId: ref.correlation_id
        Level: 4
        properties:
          id: "Directory_${ref.correlation_id}_${ref.record_suffix}_${ref.record_seq}"
          category: ApplicationManagement
          correlationId: ref.correlation_id
          result: success
          resultReason: ""
          activityDisplayName: "Add owner to application"
          activityDateTime: ref.activity_time
          loggedByService: "Core Directory"
          operationType: Assign
          userAgent: null
          initiatedBy:
            user:
              id: ref.admin_object_id
              displayName: null
              userPrincipalName: ref.admin_upn
              ipAddress: ref.src_ip
              roles: []
          targetResources:
            - id: ref.new_owner_object_id
              displayName: null
              type: User
              userPrincipalName: ref.new_owner_upn
              modifiedProperties:
                - displayName: "Application.ObjectID"
                  oldValue: null
                  newValue: "\"${ref.app_object_id}\""
                - displayName: "Application.DisplayName"
                  oldValue: null
                  newValue: "\"${ref.app_display}\""
                - displayName: "Application.AppId"
                  oldValue: null
                  newValue: "\"${ref.app_id}\""
              administrativeUnits: []
            - id: ref.app_object_id
              displayName: null
              type: Application
              modifiedProperties: []
              administrativeUnits: []
          additionalDetails:
            - key: "User-Agent"
              value: ref.user_agent
