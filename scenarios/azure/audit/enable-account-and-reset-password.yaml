type: scenario
description: |
  A Microsoft Entra ID (Azure AD) directory audit trail in which an
  administrator re-enables a previously disabled user account and resets that
  same account's password within two minutes -- reviving a dormant identity and
  seizing its credentials for persistent, backdoor access. The enable emits two
  Core Directory records (a high-level "Enable account" and the granular "Update
  user" carrying the AccountEnabled false -> true change), followed seconds later
  by a "Reset password (by admin)" record on the same target. The administrator
  and target are held in state so all three records share one initiator and one
  target.
mitre:
  tactics: [persistence]
  techniques: [T1098]
state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  # The administrator performing both actions (the records' initiator).
  admin_upn: "admin@example.onmicrosoft.com"
  admin_object_id: gen.uuid()
  # The account being enabled and then password-reset; held once so the enable
  # and reset legs share one target -- the link the sequence keys on.
  target_upn: "user@example.onmicrosoft.com"
  target_object_id: gen.uuid()
  # Source address of the administrator, shared across the legs of one session.
  src_ip: gen.ipv4()
  # The two enable records belong to one logical operation: shared correlation
  # id and record suffix, distinct per-record sequence numbers.
  enable_correlation_id: gen.uuid()
  enable_suffix: gen.hex(len=5, case=upper)
  enable_seq_1: gen.int(min=100000000, max=999999999)
  enable_seq_2: gen.int(min=100000000, max=999999999)
  # The password reset is a separate operation with its own correlation id.
  reset_correlation_id: gen.uuid()
  reset_suffix: gen.hex(len=5, case=upper)
  reset_seq: gen.int(min=1000000, max=9999999)
  # Tight staggers: the enable co-records land back to back, the reset trails by
  # a few seconds, and the whole chain stays well inside the two-minute window
  # the sequence is correlated over.
  enable_record_gap: "1s"
  reset_delay: "5s"
  step_jitter: 0.2
steps:
  # Leg 1a: the high-level account-enable operation.
  - emit:
      event_type: azure.monitor.aad@v1
      fields:
        resourceId: "/tenants/${ref.tenant_id}/providers/Microsoft.aadiam"
        operationName: "Enable account"
        operationVersion: "1.0"
        category: AuditLogs
        tenantId: ref.tenant_id
        resultSignature: "None"
        durationMs: 0
        callerIpAddress: ref.src_ip
        correlationId: ref.enable_correlation_id
        Level: 4
        properties:
          id: "Directory_${ref.enable_correlation_id}_${ref.enable_suffix}_${ref.enable_seq_1}"
          category: UserManagement
          correlationId: ref.enable_correlation_id
          result: success
          resultReason: ""
          activityDisplayName: "Enable account"
          activityDateTime: gen.timestamp()
          loggedByService: "Core Directory"
          operationType: Update
          userAgent: null
          initiatedBy:
            user:
              id: ref.admin_object_id
              displayName: null
              userPrincipalName: ref.admin_upn
              ipAddress: ref.src_ip
              roles: []
          targetResources:
            - id: ref.target_object_id
              displayName: null
              type: User
              userPrincipalName: ref.target_upn
              modifiedProperties:
                - displayName: AccountEnabled
                  oldValue: "[false]"
                  newValue: "[true]"
                - displayName: "Included Updated Properties"
                  oldValue: null
                  newValue: "\"AccountEnabled\""
              administrativeUnits: []
          additionalDetails: []

  # The granular enable record follows the high-level one immediately.
  - wait:
      duration:   ref.enable_record_gap
      jitter_pct: ref.step_jitter

  # Leg 1b: the granular Core Directory record carrying the AccountEnabled
  # false -> true change, sharing the enable operation's correlation id.
  - emit:
      event_type: azure.monitor.aad@v1
      fields:
        resourceId: "/tenants/${ref.tenant_id}/providers/Microsoft.aadiam"
        operationName: "Update user"
        operationVersion: "1.0"
        category: AuditLogs
        tenantId: ref.tenant_id
        resultSignature: "None"
        durationMs: 0
        callerIpAddress: ref.src_ip
        correlationId: ref.enable_correlation_id
        Level: 4
        properties:
          id: "Directory_${ref.enable_correlation_id}_${ref.enable_suffix}_${ref.enable_seq_2}"
          category: UserManagement
          correlationId: ref.enable_correlation_id
          result: success
          resultReason: ""
          activityDisplayName: "Update user"
          activityDateTime: gen.timestamp()
          loggedByService: "Core Directory"
          operationType: Update
          userAgent: null
          initiatedBy:
            user:
              id: ref.admin_object_id
              displayName: null
              userPrincipalName: ref.admin_upn
              ipAddress: ref.src_ip
              roles: []
          targetResources:
            - id: ref.target_object_id
              displayName: null
              type: User
              userPrincipalName: ref.target_upn
              modifiedProperties:
                - displayName: AccountEnabled
                  oldValue: "[false]"
                  newValue: "[true]"
                - displayName: "Included Updated Properties"
                  oldValue: null
                  newValue: "\"AccountEnabled\""
                - displayName: "TargetId.UserType"
                  oldValue: null
                  newValue: "\"Member\""
              administrativeUnits: []
          additionalDetails:
            - key: UserType
              value: Member

  # The administrator resets the now-enabled account's password.
  - wait:
      duration:   ref.reset_delay
      jitter_pct: ref.step_jitter

  # Leg 2: the password reset on the same target, closing the sequence.
  - emit:
      event_type: azure.monitor.aad@v1
      fields:
        resourceId: "/tenants/${ref.tenant_id}/providers/Microsoft.aadiam"
        operationName: "Reset password (by admin)"
        operationVersion: "1.0"
        category: AuditLogs
        tenantId: ref.tenant_id
        resultSignature: "None"
        resultDescription: "None"
        durationMs: 0
        callerIpAddress: ref.src_ip
        correlationId: ref.reset_correlation_id
        Level: 4
        properties:
          id: "SSPR_${ref.reset_correlation_id}_${ref.reset_suffix}_${ref.reset_seq}"
          category: UserManagement
          correlationId: ref.reset_correlation_id
          result: success
          resultReason: "None"
          activityDisplayName: "Reset password (by admin)"
          activityDateTime: gen.timestamp()
          loggedByService: "Self-service Password Management"
          operationType: Update
          userAgent: null
          initiatedBy:
            user:
              id: ref.admin_object_id
              displayName: null
              userPrincipalName: ref.admin_upn
              ipAddress: ref.src_ip
              roles: []
          targetResources:
            - id: ref.target_object_id
              displayName: null
              type: User
              userPrincipalName: ref.target_upn
              modifiedProperties: []
              administrativeUnits: []
          additionalDetails:
            - key: OnPremisesAgent
              value: "None"
