type: scenario
description: |
  Defense evasion: a file is written to disk with a right-to-left
  override (RTLO, U+202E) character embedded in its name. Sysmon EID
  11 (File Create) records the writing process and the full target
  path. An RTLO character reverses the display order of the text that
  follows it, letting an attacker disguise a malicious file's true
  extension as something benign (e.g. an .htm payload named to
  display as a .docx file). The file name is a state parameter so a
  job can drive both an RTLO-bearing name and an ordinary file name
  that should not trip a detection scoped to the RTLO character.
tags: [eid11, rtlo]
mitre:
  tactics: [defense-evasion]
  techniques: [T1036.002]

state:
  domain_short:        CORP
  domain_tld:           local
  domain_short_lower:   fn.lower(ref.domain_short)
  domain_fqdn:          "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:             gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:           gen.int(min=1000, max=4000)
  sysmon_tid:           gen.int(min=1000, max=9999)
  process_guid_raw:     gen.uuid()
  process_guid:         "{${ref.process_guid_raw}}"
  process_id:           gen.int(min=1000, max=9999)
  event_record_id:      gen.int(min=5000, max=9999999)
  image:                "C:\\Windows\\Explorer.EXE"
  username:             gen.username()
  file_dir:             "C:\\Users\\${ref.username}\\Desktop"
  file_name:            "test_malware\u202Excod.htm"
  target_filename:      "${ref.file_dir}\\${ref.file_name}"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 11
          Version: 2
          Level: 4
          Task: 11
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": Desktop
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetFilename
              "#text": ref.target_filename
            - "@Name": CreationUtcTime
              "#text": gen.timestamp(format=sysmon)
