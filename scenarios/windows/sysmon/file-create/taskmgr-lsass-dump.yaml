type: scenario
description: |
  Credential access: Windows Task Manager writes a memory dump file
  targeting lsass.exe. Sysmon EID 11 (File Create) records the writing
  process and the full target path. Task Manager's built-in "Create
  dump file" action against a running process is a legitimate
  administrative feature that requires no additional tooling, making it
  an attractive way to capture LSASS memory (which holds cached
  authentication credentials) without triggering detections scoped to
  known credential-dumping utilities. The target path is a state
  parameter so a job can drive both an lsass dump and a dump of an
  unrelated process that should not trip a detection scoped to lsass.
tags: [eid11]
mitre:
  tactics: [credential-access]
  techniques: [T1003.001]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  process_guid_raw:    gen.uuid()
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=100000, max=999999)
  username:            gen.username()
  file_dir:            "C:\\Users\\${ref.username}\\AppData\\Local\\Temp\\2"
  file_name:            "lsass (2).DMP"
  target_filename:      "${ref.file_dir}\\${ref.file_name}"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 11
          Version: 2
          Level: 4
          Task: 11
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": "C:\\Windows\\system32\\taskmgr.exe"
            - "@Name": TargetFilename
              "#text": ref.target_filename
            - "@Name": CreationUtcTime
              "#text": gen.timestamp(format=sysmon)
