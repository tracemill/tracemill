type: scenario
description: |
  Initial access: a `.aspx`/`.ashx` file is written into one of the
  Microsoft Exchange HttpProxy/OAB front-end directories -- known drop
  locations for a web shell following ProxyShell/ProxyNotShell-style
  exploitation (the technique HAFNIUM used against on-premises
  Exchange servers). Sysmon EID 11 (File Create) records the writing
  process and the full target path; the IIS worker process (w3wp.exe)
  frequently performs this write under SYSTEM impersonation, so the
  recorded Image is often just "System". The directory and file name
  are state parameters so a job can drive each of the drop locations
  and extensions this technique covers, plus files that share only
  the path or only the extension.
tags: [eid11, proxyshell]
mitre:
  tactics: [initial-access]
  techniques: [T1133, T1190, T1505.003]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  process_guid_raw:    gen.uuid()
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          4
  event_record_id:     gen.int(min=5000, max=9999999)
  image:               System
  file_dir:             "C:\\Program Files\\Microsoft\\Exchange Server\\V15\\FrontEnd\\HttpProxy\\owa\\auth"
  file_name:            shell.aspx
  target_filename:      "${ref.file_dir}\\${ref.file_name}"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 11
          Version: 2
          Level: 4
          Task: 11
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetFilename
              "#text": ref.target_filename
            - "@Name": CreationUtcTime
              "#text": gen.timestamp(format=sysmon)
