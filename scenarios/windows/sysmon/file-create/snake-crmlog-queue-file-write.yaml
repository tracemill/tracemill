type: scenario
description: |
  A .crmlog file is written into the Windows Registration directory. Sysmon
  EID 11 (File Create) records a process, for example powershell.exe,
  creating a file with a GUID-based .crmlog name, for example
  <guid>.<guid>.crmlog, in C:\Windows\Registration. The Snake implant keeps
  its queue file there under a <RANDOM_GUID>.<RANDOM_GUID>.crmlog name: a
  CAST-128 encrypted store of its key material, communication channels and
  configuration
  (https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-129a). The
  event is evidence of the file write, not of the file's content or of the
  Snake implant running on the host.
tags: [eid11, snake]
mitre:
  tactics: [defense-evasion]
  techniques: [T1027]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  host_short:          gen.hostname(class=windows-server)
  host_short_lower:    fn.lower(ref.host_short)
  host_short_upper:    fn.upper(ref.host_short)
  computer:            "${ref.host_short_lower}.${ref.domain_fqdn}"
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=100000, max=999999)
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  user_name:           Administrator
  user:                "${ref.host_short_upper}\\${ref.user_name}"
  image:               "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe"
  file_guid:           fn.lower(gen.uuid())
  file_name:           "${ref.file_guid}.${ref.file_guid}.crmlog"
  target_filename:     "C:\\Windows\\Registration\\${ref.file_name}"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 11
          Version: 2
          Level: 4
          Task: 11
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetFilename
              "#text": ref.target_filename
            - "@Name": CreationUtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": User
              "#text": ref.user
