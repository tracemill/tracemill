type: scenario
description: |
  Print spooler driver DLL write: Sysmon EID 1 (Process Create) records
  services.exe starting the Print Spooler service process, spoolsv.exe, as
  SYSTEM, and Sysmon EID 11 (File Create) records that same spoolsv.exe
  process writing a DLL into the x64 printer driver directory, for example
  C:\Windows\System32\spool\drivers\x64\3\New\evil.dll. A PrintNightmare
  (CVE-2021-34527) exploit has the spooler copy an attacker-supplied DLL
  there as a printer driver file. The events record the write, not the
  printer driver installation that would load the DLL.
tags: [eid1, eid11, cve-2021-34527]
mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1547.012]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  process_guid_raw:    gen.uuid()
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  parent_guid_raw:     gen.uuid()
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=400, max=999)
  logon_guid_raw:      gen.uuid()
  logon_guid:          "{${ref.logon_guid_raw}}"
  process_record_id:   gen.int(min=5000, max=4999999)
  file_record_id:      gen.int(min=5000000, max=9999999)
  image:               "C:\\Windows\\System32\\spoolsv.exe"
  file_dir:            "C:\\Windows\\System32\\spool\\drivers\\x64\\3\\New"
  file_name:           evil.dll
  target_filename:     "${ref.file_dir}\\${ref.file_name}"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.process_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": FileVersion
              "#text": "10.0.14393.4169 (rs1_release.210107-1130)"
            - "@Name": Description
              "#text": Spooler SubSystem App
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": spoolsv.exe
            - "@Name": CommandLine
              "#text": ref.image
            - "@Name": CurrentDirectory
              "#text": "C:\\Windows\\system32\\"
            - "@Name": User
              "#text": "NT AUTHORITY\\SYSTEM"
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": "0x3e7"
            - "@Name": TerminalSessionId
              "#text": 0
            - "@Name": IntegrityLevel
              "#text": System
            - "@Name": Hashes
              "#text": "MD5=87E844BD124333302C9DCF947D98B3A3,SHA256=4C3316B6F7671B2E859B2BC98702C7973FB9BC7A6EA71EDB6ACDFE2CF23EB7A0,IMPHASH=A40033EBEE6E37CE4B1D96B817E1BCC7"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": "C:\\Windows\\System32\\services.exe"
            - "@Name": ParentCommandLine
              "#text": "C:\\Windows\\system32\\services.exe"

  # No wait step: detections that pair the two events by time bucket need
  # both in the same bucket.
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 11
          Version: 2
          Level: 4
          Task: 11
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.file_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetFilename
              "#text": ref.target_filename
            - "@Name": CreationUtcTime
              "#text": gen.timestamp(format=sysmon)
