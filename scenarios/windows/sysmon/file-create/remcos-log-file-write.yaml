type: scenario
description: |
  A process running from the user's roaming AppData folder writes a .dat file
  into a remcos folder in the same AppData\Roaming tree. Sysmon EID 11 (File
  Create) records the process, for example the Remcos RAT agent installed as
  AppData\Roaming\WIN32\WIN32.exe, creating a file such as logs.dat in
  AppData\Roaming\remcos. Remcos keeps the log its keylogger writes in that
  folder, by default as logs.dat. The event shows the file being written, not
  its content or whether any keystrokes were recorded.
tags: [eid11, remcos]
mitre:
  tactics: [collection, credential-access]
  techniques: [T1056.001]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=100000, max=999999)
  user_name:           Administrator
  appdata_roaming:     "C:\\Users\\${ref.user_name}\\AppData\\Roaming"
  image:               "${ref.appdata_roaming}\\WIN32\\WIN32.exe"
  file_dir:            "${ref.appdata_roaming}\\remcos"
  file_name:           logs.dat
  target_filename:     "${ref.file_dir}\\${ref.file_name}"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 11
          Version: 2
          Level: 4
          Task: 11
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetFilename
              "#text": ref.target_filename
            - "@Name": CreationUtcTime
              "#text": gen.timestamp(format=sysmon)
