type: scenario
description: |
  Accessibility program replacement: Sysmon EID 11 (File Create) records a
  process, for example cmd.exe, overwriting an accessibility program in
  C:\Windows\System32, for example sethc.exe (Sticky Keys). CreationUtcTime
  keeps the replaced file's original creation time. Windows starts these
  programs as SYSTEM from the sign-in screen, before anyone signs in, so if
  the new file is a working program, for example a copy of cmd.exe, invoking
  the feature at the sign-in screen runs it as SYSTEM.
tags: [eid11]
mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1546.008]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  process_guid_raw:    gen.uuid()
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=99999)
  image:               "C:\\Windows\\system32\\cmd.exe"
  file_dir:            "C:\\Windows\\System32"
  file_name:           sethc.exe
  target_filename:     "${ref.file_dir}\\${ref.file_name}"
  file_creation_time:  "2020-07-15 06:35:26.643"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 11
          Version: 2
          Level: 4
          Task: 11
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetFilename
              "#text": ref.target_filename
            - "@Name": CreationUtcTime
              "#text": ref.file_creation_time
