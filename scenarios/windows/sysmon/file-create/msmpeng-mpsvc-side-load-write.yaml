type: scenario
description: |
  A process writes the file pair msmpeng.exe and mpsvc.dll into one directory.
  Sysmon EID 11 (File Create) records a process, for example cmd.exe, writing
  msmpeng.exe and then mpsvc.dll into the same directory, for example
  C:\Windows. This is the layout of a DLL side-load of the Defender
  antimalware service executable: MsMpEng.exe loads a DLL named mpsvc.dll and
  looks for it in its own directory first, so a copy of MsMpEng.exe started
  from that directory loads the mpsvc.dll placed beside it. In the REvil
  attack on Kaseya VSA customers the dropper wrote an old, Microsoft-signed
  MsMpEng.exe and the ransomware payload as mpsvc.dll
  (https://www.sophos.com/en-us/blog/independence-day-revil-uses-supply-chain-exploit-to-attack-hundreds-of-businesses/).
  The events record the writes, not a load: the DLL runs only if a copy of
  MsMpEng.exe is started from that directory.
tags: [eid11, revil]
mitre:
  tactics: [persistence, privilege-escalation, defense-evasion]
  techniques: [T1574.001]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  exe_record_id:       gen.int(min=5000, max=49999)
  dll_record_id:       gen.int(min=50000, max=99999)
  user_sid:            S-1-5-18
  image:               "C:\\Windows\\system32\\cmd.exe"
  target_dir:          "C:\\Windows"
  exe_filename:        "${ref.target_dir}\\msmpeng.exe"
  dll_filename:        "${ref.target_dir}\\mpsvc.dll"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 11
          Version: 2
          Level: 4
          Task: 11
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.exe_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": ref.user_sid
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetFilename
              "#text": ref.exe_filename
            - "@Name": CreationUtcTime
              "#text": gen.timestamp(format=sysmon)

  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 11
          Version: 2
          Level: 4
          Task: 11
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.dll_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": ref.user_sid
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetFilename
              "#text": ref.dll_filename
            - "@Name": CreationUtcTime
              "#text": gen.timestamp(format=sysmon)
