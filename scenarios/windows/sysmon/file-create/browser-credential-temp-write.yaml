type: scenario
description: |
  Browser credential files staged in the Temp folder: Sysmon EID 11 (File
  Create) records a process, for example python.exe running from the user's
  Downloads folder, creating a file with a browser credential file name, for
  example Login Data, in a per-browser subfolder, for example Chrome 0, of a
  folder under the user's AppData\Local\Temp directory. The Braodo stealer
  writes copies of Chrome's Login Data, Local State and Cookies and of
  Firefox's logins.json and cookies.sqlite, plus files named pass.txt and
  master_key.txt, into such subfolders. The event is evidence of the file
  write, not of the credentials being decrypted or sent off the host.
tags: [eid11, braodo]
mitre:
  tactics: [credential-access]
  techniques: [T1555.003]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  host_short:          gen.hostname(class=windows-workstation)
  host_short_lower:    fn.lower(ref.host_short)
  host_short_upper:    fn.upper(ref.host_short)
  computer:            "${ref.host_short_lower}.${ref.domain_fqdn}"
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=100000, max=999999)
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  user_name:           Administrator
  user_short_name:     ADMINI~1
  user:                "${ref.host_short_upper}\\${ref.user_name}"
  image:               "C:\\Users\\${ref.user_name}\\Downloads\\10tymonth-main_2\\10tymonth-main\\python.exe"
  temp_dir:            "C:\\Users\\${ref.user_short_name}\\AppData\\Local\\Temp\\2"
  staging_folder:      "US 13.52.167.115 9h37m15s-24-9-2024"
  store_dir:           "Chrome 0"
  file_name:           "Login Data"
  target_filename:     "${ref.temp_dir}\\${ref.staging_folder}\\${ref.store_dir}\\${ref.file_name}"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 11
          Version: 2
          Level: 4
          Task: 11
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetFilename
              "#text": ref.target_filename
            - "@Name": CreationUtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": User
              "#text": ref.user
