type: scenario
description: |
  Initial access: a file is written into the ScreenConnect application's
  extensions directory by the ScreenConnect service process itself. Sysmon
  EID 11 (File Create) records the writing process and the full target
  path. A path traversal vulnerability in ScreenConnect (CVE-2024-1708 /
  CVE-2024-1709) lets an attacker manipulate file_path and file_name
  request parameters so the service writes an attacker-controlled file
  into this directory instead of its intended upload location; a
  server-side script extension dropped here executes on the next
  request. The file name and extension are state parameters so a job can
  drive both a webshell drop and a legitimate extension deployment that
  should not trip a detection scoped to script extensions.
tags: [eid11, connectwise-screenconnect-vulnerabilities, seashell-blizzard, cve-2024-1708, cve-2024-1709]
mitre:
  tactics: [initial-access]
  techniques: [T1190]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  process_guid_raw:    gen.uuid()
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=1000000, max=99999999)
  username:            gen.username()
  user:                "${ref.domain_short}\\${ref.username}"
  image:               "C:\\Program Files (x86)\\ScreenConnect\\Bin\\ScreenConnect.Service.exe"
  file_dir:            "C:\\Program Files (x86)\\ScreenConnect\\App_Extensions"
  file_name:            "evilapp - Copy.aspx"
  target_filename:      "${ref.file_dir}\\${ref.file_name}"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 11
          Version: 2
          Level: 4
          Task: 11
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetFilename
              "#text": ref.target_filename
            - "@Name": CreationUtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": User
              "#text": ref.user
