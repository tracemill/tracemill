type: scenario
description: |
  A process writes a data file into the boot directory of the EFI system
  partition. Sysmon EID 11 (File Create) records a process, for example
  powershell.exe, writing a data file, for example cloak.dat, into the
  \EFI\Boot directory of the EFI system partition, addressed by the
  partition's volume GUID path (\\?\Volume{...}\EFI\Boot\...). Bootkits that
  abuse a vulnerable signed boot loader place their payload in a data file
  next to it: in CVE-2024-7344 the loader reads cloak.dat from its own
  directory and starts the unsigned UEFI image in it before Windows starts,
  with Secure Boot on. The event is evidence of the write, not of a
  boot-time effect: the file is loaded only if such a loader is installed
  and started, from a boot entry or as the removable-media fallback loader,
  and the Secure Boot revocation list does not block that loader.
tags: [eid11]
mitre:
  tactics: [persistence, defense-evasion, impact]
  techniques: [T1542.001, T1490]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=99999)
  username:            gen.username()
  user:                "${ref.domain_short}\\${ref.username}"
  image:               "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe"
  volume_guid:         gen.uuid()
  file_dir:            "\\\\?\\Volume{${ref.volume_guid}}\\EFI\\Boot"
  file_name:           cloak.dat
  target_filename:     "${ref.file_dir}\\${ref.file_name}"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 11
          Version: 2
          Level: 4
          Task: 11
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetFilename
              "#text": ref.target_filename
            - "@Name": CreationUtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": User
              "#text": ref.user
