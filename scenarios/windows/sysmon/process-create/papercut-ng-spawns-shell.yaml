type: scenario
description: |
  The PaperCut NG application server starts a Windows command shell and
  PowerShell. Sysmon EID 1 (Process Create) records pc-app.exe, the Java
  runtime of the PaperCut NG service under C:\Program Files\PaperCut NG,
  running as NT AUTHORITY\SYSTEM in the server directory, starting cmd.exe
  with a command line that runs PowerShell, for example
  `cmd.exe /c powershell.exe calc.exe`. A second Sysmon EID 1 records the
  same pc-app.exe process starting powershell.exe directly with an encoded
  command, for example
  `powershell.exe -EncodedCommand "V3JpdGUtSG9zdCAnSGVsbG8gV29ybGQn"`. The
  events record the shell launches from the print management server, not
  the request that caused them or what the commands did next.
tags: [eid1]
mitre:
  tactics: [initial-access, execution]
  techniques: [T1190, T1059.003, T1059.001]

state:
  domain_short:            CORP
  domain_tld:              local
  domain_short_lower:      fn.lower(ref.domain_short)
  domain_fqdn:             "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:                gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:              gen.int(min=1000, max=4000)
  sysmon_tid:              gen.int(min=1000, max=9999)
  shell_record_id:         gen.int(min=5000, max=4999999)
  powershell_record_id:    gen.int(min=5000000, max=9999999)
  guid_head:               gen.hex(len=8, case=upper)
  parent_guid_mid1:        gen.hex(len=4, case=upper)
  parent_guid_mid2:        gen.hex(len=4, case=upper)
  parent_guid_seq:         gen.hex(len=4, case=upper)
  parent_process_guid:     "{${ref.guid_head}-${ref.parent_guid_mid1}-${ref.parent_guid_mid2}-${ref.parent_guid_seq}-00000000CE02}"
  parent_process_id:       gen.int(min=1000, max=4999)
  shell_guid_mid1:         gen.hex(len=4, case=upper)
  shell_guid_mid2:         gen.hex(len=4, case=upper)
  shell_guid_seq:          gen.hex(len=4, case=upper)
  shell_process_guid:      "{${ref.guid_head}-${ref.shell_guid_mid1}-${ref.shell_guid_mid2}-${ref.shell_guid_seq}-00000000CE02}"
  shell_process_id:        gen.int(min=5000, max=9999)
  powershell_guid_mid1:    gen.hex(len=4, case=upper)
  powershell_guid_mid2:    gen.hex(len=4, case=upper)
  powershell_guid_seq:     gen.hex(len=4, case=upper)
  powershell_process_guid: "{${ref.guid_head}-${ref.powershell_guid_mid1}-${ref.powershell_guid_mid2}-${ref.powershell_guid_seq}-00000000CE02}"
  powershell_process_id:   gen.int(min=10000, max=14999)
  logon_guid_mid1:         gen.hex(len=4, case=upper)
  logon_guid_mid2:         gen.hex(len=4, case=upper)
  logon_guid:              "{${ref.guid_head}-${ref.logon_guid_mid1}-${ref.logon_guid_mid2}-E703-000000000000}"
  current_directory:       "C:\\Program Files\\PaperCut NG\\server\\"
  parent_image:            "C:\\Program Files\\PaperCut NG\\runtime\\win64\\jre\\bin\\pc-app.exe"
  # Per-start secret the service wrapper passes to the JVM.
  wrapper_key:             gen.regex(pattern=[A-Za-z0-9]{16})
  shell_command_line:      cmd.exe /c powershell.exe calc.exe
  powershell_command_line: 'powershell.exe -EncodedCommand "V3JpdGUtSG9zdCAnSGVsbG8gV29ybGQn"'
  parent_command_line:     '"..\runtime\win64\jre\bin\pc-app" -Djava.io.tmpdir=tmp -Dserver.home=. -Xverify:none -XX:+UseParallelOldGC -server -Dpc-reserved=X -Dpc-reserved=X -Dpc-reserved=X -Dpc-reserved=X -Dpc-reserved=X -Xrs -Dpc-reserved=X -XX:+PrintGCDetails -XX:+PrintGCApplicationConcurrentTime -XX:+PrintGCApplicationStoppedTime -XX:+PrintGCTimeStamps -XX:+PrintGCDateStamps -XX:+UseGCLogFileRotation -XX:NumberOfGCLogFiles=10 -XX:GCLogFileSize=1M -Xloggc:logs/gc.log -Dlog4j.configuration=file:lib/log4j.properties -Djava.library.path="bin/win/lib64" -classpath "bin/win/lib/wrapper-3.1.2.jar;lib;lib/activation-1.1.1.jar;lib/akka-actor_2.12-2.5.4.jar;lib/animal-sniffer-annotations-1.14.jar;lib/antlr-2.7.6.jar;lib/aopalliance-1.0.jar;lib/apache-el-8.5.9.1.jar;lib/apache-jsp-8.5.9.1.jar;lib/apache-jsp-9.4.7.v20170914.jar;lib/apacheds-all-1.5.5-pc.jar;lib/asm-5.1.jar;lib/asm-commons-5.1.jar;lib/asm-tree-5.1.jar;lib/aspectjrt-1.8.4.jar;lib/aspectjweaver-1.8.10.jar;lib/bcprov-jdk15on-1.46.jar;lib/binary-rpc-0.2.10.jar;lib/bsf-2.3.0.jar;lib/c3p0-0.9.1.2.jar;lib/classmate-1.1.0.jar;lib/common-soap-1.0.0.jar;lib/commons-beanutils-1.9.0.jar;lib/commons-cli-1.4.jar;lib/commons-codec-1.3.jar;lib/commons-collections-3.2.2.jar;lib/commons-configuration-1.10.jar;lib/commons-dbutils-1.7.jar;lib/commons-digester-2.1.jar;lib/commons-el-1.0.jar;lib/commons-fileupload-1.2.1.jar;lib/commons-io-2.5.jar;lib/commons-javaflow-20060411.jar;lib/commons-lang-2.6.jar;lib/commons-logging-1.2.jar;lib/config-1.3.1.jar;lib/converter-jackson-2.3.0.jar;lib/derby-10.13.1.1.jar;lib/derbytools-10.13.1.1.jar;lib/dom4j-1.6.1.jar;lib/ecj-4.4.2.jar;lib/error_prone_annotations-2.0.18.jar;lib/fast-classpath-scanner-2.0.3.jar;lib/FastInfoset-2.1.10.jar;lib/fontbox-2.0.7.jar;lib/fuji-xerox-apeos-soap-1.19.1.jar;lib/google-auth-library-credentials-0.9.0.jar;lib/google-auth-library-oauth2-http-0.9.0.jar;lib/google-http-client-1.19.0.jar;lib/google-http-client-jackson2-1.19.0.jar;lib/groovy-2.4.12.jar;lib/gson-