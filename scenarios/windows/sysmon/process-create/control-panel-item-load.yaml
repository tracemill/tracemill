type: scenario
description: |
  Execution: the Windows Control Panel binary (control.exe) loads a
  Control Panel item file from a target path. Sysmon EID 1 (Process
  Create) records the launch with the full CommandLine. CVE-2021-40444
  lets a malicious Office document drop a .cpl (or .inf) file into a
  world-writable directory and load it via control.exe, achieving code
  execution outside the browser sandbox that downloaded it. The target
  path is a state parameter so a job can drive both a load from a
  writable user-profile directory and a load from an ordinary system
  path that should not trip a detection scoped to writable directories.
tags: [eid1, microsoft-mshtml-remote-code-execution-cve-2021-40444, living-off-the-land, compromised-windows-host, cve-2021-40444]
mitre:
  tactics: [defense-evasion]
  techniques: [T1218.002]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  process_guid_raw:    gen.uuid()
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  parent_guid_raw:     gen.uuid()
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=9999)
  logon_guid_raw:      gen.uuid()
  logon_guid:          "{${ref.logon_guid_raw}}"
  event_record_id:     gen.int(min=5000, max=9999999)
  username:            gen.username()
  user:                "${ref.domain_short}\\${ref.username}"
  target_path:         "c:\\users\\administrator\\appdata\\local\\temp\\docusign.cpl"
  command_line:        "control.exe  ${ref.target_path} "
  current_directory:   "C:\\Users\\ADMINI~1\\AppData\\Local\\Temp\\2\\"
  parent_command_line: "\"C:\\Windows\\system32\\cmd.exe\" /c \"control.exe ${ref.target_path}\" "

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": "C:\\Windows\\System32\\control.exe"
            - "@Name": FileVersion
              "#text": "10.0.14393.0 (rs1_release.160715-1616)"
            - "@Name": Description
              "#text": Windows Control Panel
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": CONTROL.EXE
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": "0x38c60b"
            - "@Name": TerminalSessionId
              "#text": 2
            - "@Name": IntegrityLevel
              "#text": High
            - "@Name": Hashes
              "#text": "MD5=924219B426830FF7476AF7D22AE91DE1,SHA256=CB089C50698BEE280244437BCAF56D3955402A582E5E928DBC8812A5D9C0EF4D"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": "C:\\Windows\\System32\\cmd.exe"
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
