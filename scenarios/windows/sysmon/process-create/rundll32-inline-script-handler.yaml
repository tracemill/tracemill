type: scenario
description: |
  Defense evasion: rundll32.exe (a trusted Windows host process) is
  launched with an inline "javascript:" or "vbscript:" protocol handler
  referencing mshtml's RunHTMLApplication entry point, letting an
  attacker execute arbitrary script code fileless, under a trusted
  process name. Sysmon EID 1 (Process Create) records the launch with
  the full CommandLine. The command line is a state parameter so a job
  can drive either scripting-protocol variant, plus an unrelated,
  ordinary rundll32.exe invocation that should not trip a detection
  scoped to the vbscript/javascript protocol handlers.
tags: [eid1]
mitre:
  tactics: [defense-evasion]
  techniques: [T1218.005]

state:
  domain_short:         CORP
  domain_tld:           local
  domain_short_lower:   fn.lower(ref.domain_short)
  domain_fqdn:          "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:             gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:           gen.int(min=1000, max=4000)
  sysmon_tid:           gen.int(min=1000, max=9999)
  process_guid_raw:     gen.uuid()
  process_guid:         "{${ref.process_guid_raw}}"
  process_id:           gen.int(min=1000, max=9999)
  parent_guid_raw:      gen.uuid()
  parent_process_guid:  "{${ref.parent_guid_raw}}"
  parent_process_id:    gen.int(min=1000, max=9999)
  logon_guid_raw:       gen.uuid()
  logon_guid:           "{${ref.logon_guid_raw}}"
  logon_id_hex:         gen.hex(len=6)
  logon_id:             "0x${ref.logon_id_hex}"
  username:             gen.username()
  user:                 "${ref.domain_short}\\${ref.username}"
  current_directory:    "C:\\Windows\\system32\\"
  event_record_id:      gen.int(min=5000, max=9999999)
  command_line:         "\"C:\\Windows\\System32\\rundll32.exe\" javascript:\"\\..\\mshtml,RunHTMLApplication \";a=new ActiveXObject(\"WScript.Shell\");a.Run(\"powershell.exe -nop -Command exit\",0,true);close();"
  parent_image:         "C:\\Windows\\System32\\wbem\\WmiPrvSE.exe"
  parent_command_line:  "C:\\Windows\\system32\\wbem\\wmiprvse.exe -secured -Embedding"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": "C:\\Windows\\System32\\rundll32.exe"
            - "@Name": FileVersion
              "#text": "10.0.14393.4169 (rs1_release.210107-1130)"
            - "@Name": Description
              "#text": "Windows host process (Rundll32)"
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": RUNDLL32.EXE
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": 2
            - "@Name": IntegrityLevel
              "#text": High
            - "@Name": Hashes
              "#text": "MD5=23DB802097F7B7E520E40068A7E68B14,SHA256=28DE7D3E8BF4B19E44063A4BFC2E7C30AE488CD9A1F63320ED374E14AAECA667,IMPHASH=7D1CE1BAFE48B63D9D19E8E0E5DF3E6C"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": ref.parent_image
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
