type: scenario
description: |
  Windows Installer starts the WinDbg debugger from a temporary folder.
  Sysmon EID 1 (Process Create) records the 32-bit MsiExec.exe from
  C:\Windows\SysWOW64, started with the -Embedding argument, starting
  windbg.exe, the Windows GUI symbolic debugger with Microsoft version
  information, from a folder under the user's AppData\Local\Temp directory,
  for example MW-<GUID>\files, at High integrity under a user account, for
  example Administrator. Windows Installer does not normally start a
  debugger. The event records the launch, not what the debugger then loaded
  or ran.
tags: [eid1, darkgate]
mitre:
  tactics: [defense-evasion]
  techniques: [T1218.007]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  host_short:          gen.hostname(class=windows-workstation)
  host_short_lower:    fn.lower(ref.host_short)
  host_short_upper:    fn.upper(ref.host_short)
  computer:            "${ref.host_short_lower}.${ref.domain_fqdn}"
  user_name:           Administrator
  user_short_name:     ADMINI~1
  user:                "${ref.host_short_upper}\\${ref.user_name}"
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=99999)
  logon_guid_raw:      fn.upper(gen.uuid())
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=7, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  terminal_session_id: 2
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  parent_guid_raw:     fn.upper(gen.uuid())
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=9999)
  extract_folder_id:   gen.uuid()
  extract_folder:      "MW-${ref.extract_folder_id}"
  install_dir:         "C:\\Users\\${ref.user_short_name}\\AppData\\Local\\Temp\\${ref.extract_folder}\\files"
  image:               "${ref.install_dir}\\windbg.exe"
  # The trailing space is part of the recorded command line.
  command_line:        "\"${ref.image}\" "
  current_directory:   "${ref.install_dir}\\"
  embedding_key:       gen.hex(len=32, case=upper)
  parent_command_line: "C:\\Windows\\syswow64\\MsiExec.exe -Embedding ${ref.embedding_key}"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": FileVersion
              "#text": "10.0.19041.685 (WinBuild.160101.0800)"
            - "@Name": Description
              "#text": Windows GUI symbolic debugger
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": windbg.exe
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": ref.terminal_session_id
            - "@Name": IntegrityLevel
              "#text": High
            - "@Name": Hashes
              "#text": "MD5=04EC4F58A1F4A87B5EEB1F4B7AFC48E0,SHA256=BD1AF3DBA56B129E6C624297EEED40C898FA2981FCE5CAAFE467D88A748988A4"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": "C:\\Windows\\SysWOW64\\msiexec.exe"
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
            - "@Name": ParentUser
              "#text": ref.user
