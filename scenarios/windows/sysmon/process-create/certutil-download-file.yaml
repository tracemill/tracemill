type: scenario
description: |
  A process runs certutil.exe to download a file from a URL. Sysmon EID 1
  (Process Create) records a parent process, for example cmd.exe, starting
  certutil.exe with a URL-fetching verb and the `-split -f` switches, for
  example `-urlcache -split -f <url> <file>`, which retrieves the URL through
  the URL cache and writes it to the named file, or
  `-verifyctl -split -f <url>`, which retrieves the URL and writes it to the
  current directory. The event records the command, not whether the download
  succeeded.
tags: [eid1]
mitre:
  tactics: [command-and-control]
  techniques: [T1105]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=9999999)
  user_name:           Administrator
  user_short_name:     ADMINI~1
  user:                "${ref.domain_short}\\${ref.user_name}"
  current_directory:   "C:\\Users\\${ref.user_short_name}\\AppData\\Local\\Temp\\2\\"
  logon_guid_raw:      fn.upper(gen.uuid())
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=6, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  parent_guid_raw:     fn.upper(gen.uuid())
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=9999)
  download_url:        "https://raw.githubusercontent.com/redcanaryco/atomic-red-team/master/LICENSE.txt"
  output_file:         Atomic-license.txt
  certutil_arguments:  "-urlcache -split -f ${ref.download_url} ${ref.output_file}"
  # cmd.exe /c with nested quoting leaves the closing quote and trailing spaces on both command lines.
  command_line:        "certutil  ${ref.certutil_arguments}\"  "
  parent_image:        "C:\\Windows\\System32\\cmd.exe"
  parent_command_line: "\"cmd /c certutil ${ref.certutil_arguments}\"  "

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": "C:\\Windows\\System32\\certutil.exe"
            - "@Name": FileVersion
              "#text": "10.0.14393.4169 (rs1_release.210107-1130)"
            - "@Name": Description
              "#text": CertUtil.exe
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": CertUtil.exe
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": 2
            - "@Name": IntegrityLevel
              "#text": High
            - "@Name": Hashes
              "#text": "MD5=BF7CEA72AE186A10239F830F93492A73,SHA256=A50DFE408565C2BB011D013AC43E616B2A595B1D06EB9B083F519672732498DA,IMPHASH=442218E88D4D6AA0BE3165DD7B20A4C4"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": ref.parent_image
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
