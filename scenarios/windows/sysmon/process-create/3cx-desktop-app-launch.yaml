type: scenario
description: |
  A user starts the 3CX Desktop App at version 18.12.407, one of the
  Windows releases affected by the 2023 3CX supply chain compromise.
  Sysmon EID 1 (Process Create) records 3CXDesktopApp.exe, with file
  version 18.12.407 and original file name 3CXDesktopApp.exe, starting
  from explorer.exe out of the app folder under the user's
  AppData\Local\Programs\3CXDesktopApp directory. The event records the
  affected version starting, not the loading of its trojanized libraries
  or any connection to attacker infrastructure.
tags: [eid1, 3cx, cve-2023-29059]
mitre:
  tactics: [initial-access]
  techniques: [T1195.002]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=99999)
  user_name:           gen.username()
  user:                "${ref.domain_short}\\${ref.user_name}"
  logon_guid_raw:      fn.upper(gen.uuid())
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=6, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  terminal_session_id: 2
  integrity_level:     High
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  parent_guid_raw:     fn.upper(gen.uuid())
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=9999)
  app_dir:             'C:\Users\${ref.user_name}\AppData\Local\Programs\3CXDesktopApp\app'
  image:               '${ref.app_dir}\3CXDesktopApp.exe'
  current_directory:   '${ref.app_dir}\'
  # The trailing space is part of the recorded command line.
  command_line:        '"${ref.image}" '
  hashes:              "MD5=BB915073385DD16A846DFA318AFA3C19,SHA256=DDE03348075512796241389DFEA5560C20A3D2A2EAC95C894E7BBED5E85A0ACC"
  parent_image:        'C:\Windows\explorer.exe'
  parent_command_line: '"C:\Windows\explorer.exe" /NOUACCHECK'

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": FileVersion
              "#text": "18.12.407"
            - "@Name": Description
              "#text": 3CX Desktop App
            - "@Name": Product
              "#text": 3CX Desktop App
            - "@Name": Company
              "#text": 3CX Ltd.
            - "@Name": OriginalFileName
              "#text": 3CXDesktopApp.exe
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": ref.terminal_session_id
            - "@Name": IntegrityLevel
              "#text": ref.integrity_level
            - "@Name": Hashes
              "#text": ref.hashes
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": ref.parent_image
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
            - "@Name": ParentUser
              "#text": ref.user
