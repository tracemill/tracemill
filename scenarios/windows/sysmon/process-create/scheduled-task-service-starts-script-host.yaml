type: scenario
description: |
  A scheduled task runs a JScript file with the Windows Script Host. Sysmon
  EID 1 (Process Create) records the Task Scheduler service, svchost.exe
  -k netsvcs -p -s Schedule, starting wscript.exe with a script file named
  by its 8.3 short name, for example PROOFO~1.JS, in a working directory
  under the user's roaming AppData folder, for example com.adobe.dunamis.
  The event records the task starting the script host, not how the task
  was registered or what the script does.
tags: [eid1]
mitre:
  tactics: [execution, persistence]
  techniques: [T1053.005, T1059.007]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=9999)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=4999999)
  user_name:           VICTIM
  user:                "${ref.domain_short}\\${ref.user_name}"
  profile_name:        fn.lower(ref.user_name)
  logon_guid_raw:      gen.uuid()
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=5, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  process_guid_raw:    gen.uuid()
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=5000, max=29999)
  parent_guid_raw:     gen.uuid()
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=4999)
  working_dir_name:    com.adobe.dunamis
  current_directory:   "C:\\Users\\${ref.profile_name}\\AppData\\Roaming\\${ref.working_dir_name}\\"
  script_name:         PROOFO~1.JS
  command_line:        "\"C:\\WINDOWS\\system32\\wscript.EXE\" ${ref.script_name}"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385f-c22a-43e0-bf4c-06f5698ffbd9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": "C:\\Windows\\System32\\wscript.exe"
            - "@Name": FileVersion
              "#text": "5.812.10240.16384"
            - "@Name": Description
              "#text": "Microsoft ® Windows Based Script Host"
            - "@Name": Product
              "#text": "Microsoft ® Windows Script Host"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": wscript.exe
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": 1
            - "@Name": IntegrityLevel
              "#text": Medium
            - "@Name": Hashes
              "#text": "MD5=A47CBE969EA935BDD3AB568BB126BC80,SHA256=34008E2057DF8842DF210246995385A0441DC1E081D60AD15BD481E062E7F100,IMPHASH=0F71D5F6F4CBB935CE1B09754102419C"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": "C:\\Windows\\System32\\svchost.exe"
            - "@Name": ParentCommandLine
              "#text": "C:\\WINDOWS\\system32\\svchost.exe -k netsvcs -p -s Schedule"
