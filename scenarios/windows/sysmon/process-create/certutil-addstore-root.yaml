type: scenario
description: |
  certutil.exe adds a certificate file from a temporary directory to the
  trusted root certification authorities store. Sysmon EID 1 (Process
  Create) records cmd.exe starting certutil.exe with the command line
  `certutil.exe  -f -Enterprise -addstore root <file>`, where the file is,
  for example, crt3C5C.tmp in the user's AppData\Local\Temp directory.
  -Enterprise selects the local machine enterprise store and -f forces an
  overwrite. The event records the request to add the certificate, not
  whether the store accepted it.
tags: [eid1, secret-blizzard]
mitre:
  tactics: [resource-development]
  techniques: [T1587.003]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=9999999)
  user_name:           Administrator
  user:                "${ref.domain_short}\\${ref.user_name}"
  logon_guid_raw:      fn.upper(gen.uuid())
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=5, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  terminal_session_id: 2
  integrity_level:     High
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  parent_guid_raw:     fn.upper(gen.uuid())
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=9999)
  current_directory:   'C:\Temp\'
  cert_path:           'C:\Users\ADMINI~1\AppData\Local\Temp\crt3C5C.tmp'
  command_line:        'certutil.exe  -f -Enterprise -addstore root "${ref.cert_path}"'
  parent_image:        'C:\Windows\System32\cmd.exe'
  # The trailing space is part of the recorded command line.
  parent_command_line: '"C:\Windows\system32\cmd.exe" '

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": 'C:\Windows\System32\certutil.exe'
            - "@Name": FileVersion
              "#text": "10.0.14393.7426 (rs1_release.240926-1524)"
            - "@Name": Description
              "#text": CertUtil.exe
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": CertUtil.exe
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": ref.terminal_session_id
            - "@Name": IntegrityLevel
              "#text": ref.integrity_level
            - "@Name": Hashes
              "#text": "MD5=2390EB9A3244347E024CC81ECD67B7FD,SHA256=DDE8CBB9565BFE0BF8E46C83D5E52FED73DEE8460D3B8D98BE18E48EDBB73DCD,IMPHASH=442218E88D4D6AA0BE3165DD7B20A4C4"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": ref.parent_image
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
            - "@Name": ParentUser
              "#text": ref.user
