type: scenario
description: |
  A command shell runs auditpol to turn off the FullPrivilegeAuditing audit
  option. Sysmon EID 1 (Process Create) records cmd.exe starting
  auditpol.exe with the command line
  `/set /option:FullPrivilegeAuditing /value:disable`, run by an account,
  for example Administrator, at high integrity. FullPrivilegeAuditing is
  the audit option behind the "Audit: Audit the use of Backup and Restore
  privilege" security policy setting. The event records the request, not
  whether the option changed.
tags: [eid1]
mitre:
  tactics: [defense-impairment]
  techniques: [T1685.001]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  record_id:           gen.int(min=5000, max=9999999)
  user_name:           Administrator
  user:                "${ref.domain_short}\\${ref.user_name}"
  current_directory:   'C:\Users\${ref.user_name}\'
  logon_guid_raw:      gen.uuid()
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=6, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  terminal_session_id: 2
  parent_guid_raw:     gen.uuid()
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=9999)
  process_guid_raw:    gen.uuid()
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385f-c22a-43e0-bf4c-06f5698ffbd9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": 'C:\Windows\System32\auditpol.exe'
            - "@Name": FileVersion
              "#text": "10.0.17763.1 (WinBuild.160101.0800)"
            - "@Name": Description
              "#text": Audit Policy Program
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": AUDITPOL.EXE
            - "@Name": CommandLine
              "#text": "auditpol  /set /option:FullPrivilegeAuditing /value:disable"
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": ref.terminal_session_id
            - "@Name": IntegrityLevel
              "#text": High
            - "@Name": Hashes
              "#text": "SHA1=0A81854C79D49EF3241A962EBFBAEE438CEF1160,MD5=F97C0041886519CEAE336B06AEBFC9E1,SHA256=969306E33A469096EFA20BEE264FB37AC4DA86899F2659007D6BE0D1EB666B1C,IMPHASH=D401223A63DBFDCD11C945B9EEE0BD7E"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": 'C:\Windows\System32\cmd.exe'
            - "@Name": ParentCommandLine
              "#text": '"C:\Windows\system32\cmd.exe" '
            - "@Name": ParentUser
              "#text": ref.user
