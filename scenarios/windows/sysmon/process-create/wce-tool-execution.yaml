type: scenario
description: |
  Credential access: the Windows Credential Editor (wce.exe) tool is launched
  on an endpoint via a Sysmon EID 1 (Process Create). The process keeps its
  known on-disk name (wce.exe) and the command line invokes its
  credential-dumping routine (-o writes the recovered logon credentials to an
  output file). This is a true-positive for detections that flag known
  attacker-tool process names on a host.
tags: [eid1, wce]
mitre:
  tactics: [credential-access]
  techniques: [T1003.001]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  process_guid_raw:    gen.uuid()
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  parent_guid_raw:     gen.uuid()
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=9999)
  logon_guid_raw:      gen.uuid()
  logon_guid:          "{${ref.logon_guid_raw}}"
  event_record_id:     gen.int(min=5000, max=99999)
  username:            gen.username()
  user_domain:         ref.domain_short
  user:                "${ref.user_domain}\\${ref.username}"
  image:               "C:\\Users\\${ref.username}\\Downloads\\wce.exe"
  original_file_name:  wce.exe
  command_line:        "\"C:\\Users\\${ref.username}\\Downloads\\wce.exe\" -o C:\\Windows\\Temp\\wce-output.txt"
  current_directory:   "C:\\Users\\${ref.username}\\Downloads\\"
  parent_image:        C:\Windows\System32\cmd.exe
  parent_command_line: "\"C:\\Windows\\system32\\cmd.exe\" /c \"\"C:\\Users\\${ref.username}\\Downloads\\wce.exe\" -o C:\\Windows\\Temp\\wce-output.txt\""

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": FileVersion
              "#text": "-"
            - "@Name": Description
              "#text": "-"
            - "@Name": Product
              "#text": "-"
            - "@Name": Company
              "#text": "-"
            - "@Name": OriginalFileName
              "#text": ref.original_file_name
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": "0xc7cab"
            - "@Name": TerminalSessionId
              "#text": 2
            - "@Name": IntegrityLevel
              "#text": High
            - "@Name": Hashes
              "#text": "MD5=BE9387BF647993E501C5D78E49BD4AB5,SHA256=C6333C684762ED4B4129C7F9F49C88C33384B66DFB1F100E459EC6F18526DFF7,IMPHASH=8AB93B061287C79F3088C5BC7E7D97ED"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": ref.parent_image
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
