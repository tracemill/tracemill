type: scenario
description: |
  ldifde.exe exports Active Directory objects to an LDIF file. Sysmon EID 1
  (Process Create) records C:\Windows\System32\ldifde.exe, with original
  file name ldifde.exe, started from cmd.exe with -f and the path of an
  output file, for example C:\Windows\temp\atomic_ldifde.txt, and
  optionally -p subtree to set the search scope. Without -i, ldifde.exe
  runs in export mode. The process runs as a domain account, for example
  Administrator, at high integrity. The event records the launch and its
  arguments, not which objects were written to the file.
tags: [eid1, volt-typhoon]
mitre:
  tactics: [discovery]
  techniques: [T1069.002]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=99999)
  user_name:           Administrator
  user_short_name:     ADMINI~1
  user:                "${ref.domain_short}\\${ref.user_name}"
  logon_guid_raw:      fn.upper(gen.uuid())
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=7, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  terminal_session_id: 2
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  parent_guid_raw:     fn.upper(gen.uuid())
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=9999)
  output_file:         'C:\Windows\temp\atomic_ldifde.txt'
  # The double space after the program name is part of the recorded
  # command line; cmd.exe passes a single space.
  command_line:        'ldifde.exe  -f ${ref.output_file} -p subtree'
  current_directory:   'C:\Users\${ref.user_short_name}\AppData\Local\Temp\'
  parent_command_line: '"cmd.exe" /c "ldifde.exe -f ${ref.output_file} -p subtree"'

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": 'C:\Windows\System32\ldifde.exe'
            - "@Name": FileVersion
              "#text": "10.0.14393.0 (rs1_release.160715-1616)"
            - "@Name": Description
              "#text": NT5DS
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": ldifde.exe
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": ref.terminal_session_id
            - "@Name": IntegrityLevel
              "#text": High
            - "@Name": Hashes
              "#text": "MD5=51BBF7AA4242A7E0C56ED4704AE94E58,SHA256=B1FDBDE11B6DAC3E4B69702040083FAD2A02B8BDFECBFA5AFDE9890D70A4DFCD"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": 'C:\Windows\System32\cmd.exe'
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
            - "@Name": ParentUser
              "#text": ref.user
