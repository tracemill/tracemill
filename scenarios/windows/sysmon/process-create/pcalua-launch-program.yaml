type: scenario
description: |
  The Program Compatibility Assistant starts a program named on its command
  line. Sysmon EID 1 (Process Create) records cmd.exe starting pcalua.exe with
  `-a` and the program to run, for example calc.exe or its full path
  C:\Windows\System32\calc.exe. A second Sysmon EID 1 records the program
  pcalua.exe starts, for example C:\Windows\System32\calc.exe, with pcalua.exe
  as its parent image and the `-a` command line as its parent command line.
  The events record the launch and its command line, not what the program did
  next.
tags: [eid1]
mitre:
  tactics: [defense-evasion]
  techniques: [T1202]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  user_name:           Administrator
  user:                "${ref.domain_short}\\${ref.user_name}"
  current_directory:   "C:\\Users\\ADMINI~1\\AppData\\Local\\Temp\\"
  logon_guid_raw:      fn.upper(gen.uuid())
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=6, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  shell_guid_raw:      fn.upper(gen.uuid())
  shell_process_guid:  "{${ref.shell_guid_raw}}"
  shell_process_id:    gen.int(min=1000, max=9999)
  shell_command_line:  '"cmd.exe" /c "pcalua.exe -a calc.exe & pcalua.exe -a C:\Windows\System32\calc.exe"'
  pcalua_guid_raw:     fn.upper(gen.uuid())
  pcalua_process_guid: "{${ref.pcalua_guid_raw}}"
  pcalua_process_id:   gen.int(min=1000, max=9999)
  pcalua_record_id:    gen.int(min=5000, max=4999999)
  program_argument:    "calc.exe "
  pcalua_command_line: "pcalua.exe  -a ${ref.program_argument}"
  program_guid_raw:    fn.upper(gen.uuid())
  program_process_guid: "{${ref.program_guid_raw}}"
  program_process_id:  gen.int(min=1000, max=9999)
  program_record_id:   gen.int(min=5000000, max=9999999)
  program_image:       "C:\\Windows\\System32\\calc.exe"
  program_file_version: "10.0.14393.4169 (rs1_release.210107-1130)"
  program_description: Windows Calculator
  program_product:     "Microsoft® Windows® Operating System"
  program_company:     Microsoft Corporation
  program_original_file_name: CALC.EXE
  program_command_line: '"C:\Windows\System32\calc.exe" '
  program_hashes:      "MD5=2A5CC198FEFC04C2B6B95207A91D3668,SHA256=04FA16D1FBB5F047E7BF9756E8DDC1365AFEAAB22DD4A2C3F03E067B75BED8EA,IMPHASH=3843C3D4A5A7D1045ABE9A4BFCFAAB28"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.pcalua_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.pcalua_process_guid
            - "@Name": ProcessId
              "#text": ref.pcalua_process_id
            - "@Name": Image
              "#text": "C:\\Windows\\System32\\pcalua.exe"
            - "@Name": FileVersion
              "#text": "10.0.14393.4946 (rs1_release.220131-0721)"
            - "@Name": Description
              "#text": Program Compatibility Assistant
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": "-"
            - "@Name": CommandLine
              "#text": ref.pcalua_command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": 0
            - "@Name": IntegrityLevel
              "#text": High
            - "@Name": Hashes
              "#text": "MD5=B5931AF4C873CCEEF02C0208B715A565,SHA256=194A95C23EF95E9BFD64F4B2706F61692B36C0E0673592BCE0EE0DD6FFEE9E79,IMPHASH=C11D16E312D93C5AF886445DE7172050"
            - "@Name": ParentProcessGuid
              "#text": ref.shell_process_guid
            - "@Name": ParentProcessId
              "#text": ref.shell_process_id
            - "@Name": ParentImage
              "#text": "C:\\Windows\\System32\\cmd.exe"
            - "@Name": ParentCommandLine
              "#text": ref.shell_command_line

  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.program_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.program_process_guid
            - "@Name": ProcessId
              "#text": ref.program_process_id
            - "@Name": Image
              "#text": ref.program_image
            - "@Name": FileVersion
              "#text": ref.program_file_version
            - "@Name": Description
              "#text": ref.program_description
            - "@Name": Product
              "#text": ref.program_product
            - "@Name": Company
              "#text": ref.program_company
            - "@Name": OriginalFileName
              "#text": ref.program_original_file_name
            - "@Name": CommandLine
              "#text": ref.program_command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": 0
            - "@Name": IntegrityLevel
              "#text": High
            - "@Name": Hashes
              "#text": ref.program_hashes
            - "@Name": ParentProcessGuid
              "#text": ref.pcalua_process_guid
            - "@Name": ParentProcessId
              "#text": ref.pcalua_process_id
            - "@Name": ParentImage
              "#text": "C:\\Windows\\System32\\pcalua.exe"
            - "@Name": ParentCommandLine
              "#text": ref.pcalua_command_line
