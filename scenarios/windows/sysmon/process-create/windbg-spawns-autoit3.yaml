type: scenario
description: |
  The WinDbg debugger, started from a temporary folder, starts the AutoIt v3
  script interpreter with a script file. Sysmon EID 1 (Process Create)
  records windbg.exe, from a folder under the user's AppData\Local\Temp
  directory, for example MW-<GUID>\files, starting AutoIt3.exe, for example
  from C:\tmpa, with a command line that names an AutoIt script, for example
  script.au3, at High integrity under a user account, for example
  Administrator. The original file name in the file's version information
  is AutoIt3.exe.
  The event records the launch and the script path, not what the script
  does.
tags: [eid1, darkgate, autoit]
mitre:
  tactics: [execution]
  techniques: [T1059]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  host_short:          gen.hostname(class=windows-workstation)
  host_short_lower:    fn.lower(ref.host_short)
  host_short_upper:    fn.upper(ref.host_short)
  computer:            "${ref.host_short_lower}.${ref.domain_fqdn}"
  user_name:           Administrator
  user_short_name:     ADMINI~1
  user:                "${ref.host_short_upper}\\${ref.user_name}"
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=99999)
  logon_guid_raw:      fn.upper(gen.uuid())
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=7, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  terminal_session_id: 2
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=4999)
  parent_guid_raw:     fn.upper(gen.uuid())
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=5000, max=9999)
  extract_folder_id:   gen.uuid()
  extract_folder:      "MW-${ref.extract_folder_id}"
  parent_dir:          "C:\\Users\\${ref.user_short_name}\\AppData\\Local\\Temp\\${ref.extract_folder}\\files"
  parent_image:        "${ref.parent_dir}\\windbg.exe"
  # The trailing space is part of the recorded command line.
  parent_command_line: "\"${ref.parent_image}\" "
  current_directory:   "${ref.parent_dir}\\"
  image:               "C:\\tmpa\\Autoit3.exe"
  # The command line keeps the path as typed, which can differ in case from Image.
  command_image:       "c:\\tmpa\\Autoit3.exe"
  script_path:         "c:\\tmpa\\script.au3"
  command_line:        "${ref.command_image} ${ref.script_path}"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": FileVersion
              "#text": "3, 3, 14, 5"
            - "@Name": Description
              "#text": AutoIt v3 Script
            - "@Name": Product
              "#text": AutoIt v3 Script
            - "@Name": Company
              "#text": AutoIt Team
            - "@Name": OriginalFileName
              "#text": AutoIt3.exe
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": ref.terminal_session_id
            - "@Name": IntegrityLevel
              "#text": High
            - "@Name": Hashes
              "#text": "MD5=C56B5F0201A3B3DE53E561FE76912BFD,SHA256=237D1BCA6E056DF5BB16A1216A434634109478F882D3B1D58344C801D184F95D"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": ref.parent_image
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
            - "@Name": ParentUser
              "#text": ref.user
