type: scenario
description: |
  A user opens a Remote Desktop connection file (.rdp) from Windows Explorer.
  Sysmon EID 1 (Process Create) records explorer.exe starting the Remote
  Desktop Connection client mstsc.exe with the path of the .rdp file as its
  argument, for example a file in the user's Downloads folder such as
  "C:\Users\Administrator\Downloads\invoice\remote_connection (14).rdp", or
  one in the folder under the user's Temp directory that Windows Explorer
  extracts to when a file is opened from inside a .zip archive, such as
  "C:\Users\Administrator\AppData\Local\Temp\2\<GUID>_invoice.zip.ada\". The
  event records the launch and the file path, not the connection settings
  in the file or whether a connection was made.
tags: [eid1]
mitre:
  tactics: [reconnaissance, lateral-movement]
  techniques: [T1598.002, T1021.001]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=99999)
  user_name:           Administrator
  user:                "${ref.domain_short}\\${ref.user_name}"
  logon_guid_raw:      gen.uuid()
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=5, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  process_guid_raw:    gen.uuid()
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  parent_guid_raw:     gen.uuid()
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=9999)
  rdp_path:            'C:\Users\${ref.user_name}\Downloads\invoice\remote_connection (14).rdp'
  command_line:        '"mstsc.exe" "${ref.rdp_path}"'
  current_directory:   'C:\Users\${ref.user_name}\Downloads\invoice\'

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385f-c22a-43e0-bf4c-06f5698ffbd9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": 'C:\Windows\System32\mstsc.exe'
            - "@Name": FileVersion
              "#text": "10.0.20348.2520 (WinBuild.160101.0800)"
            - "@Name": Description
              "#text": Remote Desktop Connection
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": mstsc.exe
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": 2
            - "@Name": IntegrityLevel
              "#text": High
            - "@Name": Hashes
              "#text": "MD5=D67005D6F03D78B6FBFFB93E62D49369,SHA256=81A6E1EA20CB60DD1007E8536D878FF80A43D475ED2801F6937A3C5ADDA5FCED,IMPHASH=30032A2217E731047F591BC73887FA80"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": 'C:\Windows\explorer.exe'
            - "@Name": ParentCommandLine
              "#text": 'C:\Windows\Explorer.EXE'
            - "@Name": ParentUser
              "#text": ref.user
