type: scenario
description: |
  Windows Explorer opens a script file from inside a zip archive. Sysmon EID 1
  (Process Create) records explorer.exe starting the Windows Script Host,
  wscript.exe, with a command line that names a JScript file, for example
  can you cancel ideal image contract 79426.js, inside the folder Windows
  creates in the user's Temp directory when a file is opened from a zip
  archive, for example Temp1_Can_you_cancel_ideal_image_contract_95756.zip.
  The event records the script host starting with that file, not how the
  archive reached the host or what the script does.
tags: [eid1]
mitre:
  tactics: [execution]
  techniques: [T1204.002, T1059.007]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=9999)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=4999999)
  user_name:           VICTIM
  user:                "${ref.domain_short}\\${ref.user_name}"
  logon_guid_raw:      gen.uuid()
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=5, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  terminal_session_id: 1
  process_guid_raw:    gen.uuid()
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=29999)
  parent_guid_raw:     gen.uuid()
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=9999)
  temp_dir:            "C:\\Users\\${ref.user_name}\\AppData\\Local\\Temp\\${ref.terminal_session_id}"
  archive_name:        Can_you_cancel_ideal_image_contract_95756.zip
  script_name:         can you cancel ideal image contract 79426.js
  script_path:         "${ref.temp_dir}\\Temp1_${ref.archive_name}\\${ref.script_name}"
  # The trailing space is part of the recorded command line.
  command_line:        "\"C:\\Windows\\System32\\WScript.exe\" \"${ref.script_path}\" "

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385f-c22a-43e0-bf4c-06f5698ffbd9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": "C:\\Windows\\System32\\wscript.exe"
            - "@Name": FileVersion
              "#text": "5.812.10240.16384"
            - "@Name": Description
              "#text": "Microsoft ® Windows Based Script Host"
            - "@Name": Product
              "#text": "Microsoft ® Windows Script Host"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": wscript.exe
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": "C:\\WINDOWS\\system32\\"
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": ref.terminal_session_id
            - "@Name": IntegrityLevel
              "#text": Medium
            - "@Name": Hashes
              "#text": "MD5=A47CBE969EA935BDD3AB568BB126BC80,SHA256=34008E2057DF8842DF210246995385A0441DC1E081D60AD15BD481E062E7F100,IMPHASH=0F71D5F6F4CBB935CE1B09754102419C"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": "C:\\Windows\\explorer.exe"
            - "@Name": ParentCommandLine
              "#text": "C:\\WINDOWS\\Explorer.EXE"
