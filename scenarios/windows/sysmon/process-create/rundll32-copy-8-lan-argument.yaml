type: scenario
description: |
  A command shell starts an executable from the public user folder with the
  arguments `8 LAN`. Sysmon EID 1 (Process Create) records powershell.exe
  starting cmd.exe with `/c` and a command line that runs an executable in
  C:\Users\Public, for example QKumYdZSplan.exe, with the arguments `8 LAN`.
  A second Sysmon EID 1 records the process cmd.exe starts with the same
  arguments; its version information and hashes identify the image as a copy
  of the Windows rundll32.exe host process saved under that name. The events
  record the launch and its command line, not what the process did next.
tags: [eid1]
mitre:
  tactics: [execution]
  techniques: [T1059.003]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  user_name:           Administrator
  user:                "${ref.domain_short}\\${ref.user_name}"
  current_directory:   "C:\\Users\\${ref.user_name}\\"
  logon_guid_raw:      gen.uuid()
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=6, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  shell_guid_raw:      gen.uuid()
  shell_process_guid:  "{${ref.shell_guid_raw}}"
  shell_process_id:    gen.int(min=1000, max=9999)
  wrapper_guid_raw:    gen.uuid()
  wrapper_process_guid: "{${ref.wrapper_guid_raw}}"
  wrapper_process_id:  gen.int(min=1000, max=9999)
  process_guid_raw:    gen.uuid()
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  wrapper_record_id:   gen.int(min=5000, max=4999999)
  process_record_id:   gen.int(min=5000000, max=9999999)
  image_name:          QKumYdZSplan.exe
  image:               "C:\\Users\\Public\\${ref.image_name}"
  wrapper_command_line: '"C:\Windows\system32\cmd.exe" /c C:\users\Public\${ref.image_name} 8 LAN'
  command_line:        'C:\users\Public\${ref.image_name}  8 LAN'

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.wrapper_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.wrapper_process_guid
            - "@Name": ProcessId
              "#text": ref.wrapper_process_id
            - "@Name": Image
              "#text": "C:\\Windows\\System32\\cmd.exe"
            - "@Name": FileVersion
              "#text": "10.0.14393.0 (rs1_release.160715-1616)"
            - "@Name": Description
              "#text": Windows Command Processor
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": Cmd.Exe
            - "@Name": CommandLine
              "#text": ref.wrapper_command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": 2
            - "@Name": IntegrityLevel
              "#text": High
            - "@Name": Hashes
              "#text": "MD5=F4F684066175B77E0C3A000549D2922C,SHA256=935C1861DF1F4018D698E8B65ABFA02D7E9037D8F68CA3C2065B6CA165D44AD2,IMPHASH=3062ED732D4B25D1C64F084DAC97D37A"
            - "@Name": ParentProcessGuid
              "#text": ref.shell_process_guid
            - "@Name": ParentProcessId
              "#text": ref.shell_process_id
            - "@Name": ParentImage
              "#text": "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe"
            - "@Name": ParentCommandLine
              "#text": '"C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" '

  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.process_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": FileVersion
              "#text": "10.0.14393.4169 (rs1_release.210107-1130)"
            - "@Name": Description
              "#text": Windows host process (Rundll32)
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": RUNDLL32.EXE
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": 2
            - "@Name": IntegrityLevel
              "#text": High
            - "@Name": Hashes
              "#text": "MD5=23DB802097F7B7E520E40068A7E68B14,SHA256=28DE7D3E8BF4B19E44063A4BFC2E7C30AE488CD9A1F63320ED374E14AAECA667,IMPHASH=7D1CE1BAFE48B63D9D19E8E0E5DF3E6C"
            - "@Name": ParentProcessGuid
              "#text": ref.wrapper_process_guid
            - "@Name": ParentProcessId
              "#text": ref.wrapper_process_id
            - "@Name": ParentImage
              "#text": "C:\\Windows\\System32\\cmd.exe"
            - "@Name": ParentCommandLine
              "#text": ref.wrapper_command_line
