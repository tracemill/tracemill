type: scenario
description: |
  A program adds itself to the Windows Firewall allowed programs list with
  netsh. Sysmon EID 1 (Process Create) records a program, for example the
  njRAT client server.exe in the user's AppData\Local\Temp folder, starting
  the 32-bit netsh.exe with the command line `netsh firewall add
  allowedprogram "<program path>" "<name>" ENABLE`. The command names the
  program's own path, for example
  C:\Users\Administrator\AppData\Local\Temp\server.exe, and its file name,
  for example server.exe, as an enabled exception in the legacy netsh
  firewall context. The event records the command that adds the exception,
  not whether netsh applied it or any traffic the program then sends or
  receives.
tags: [eid1, njrat]
mitre:
  tactics: [defense-impairment]
  techniques: [T1686]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=99999)
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  parent_guid_raw:     fn.upper(gen.uuid())
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=9999)
  logon_guid_raw:      fn.upper(gen.uuid())
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=5, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  terminal_session_id: 2
  user_name:           Administrator
  user:                "${ref.domain_short}\\${ref.user_name}"
  program_dir:         "C:\\Users\\${ref.user_name}\\AppData\\Local\\Temp"
  program_name:        server.exe
  program_path:        "${ref.program_dir}\\${ref.program_name}"
  command_line:        'netsh firewall add allowedprogram "${ref.program_path}" "${ref.program_name}" ENABLE'
  current_directory:   "C:\\Users\\${ref.user_name}\\Downloads\\Server\\"
  parent_command_line: '"${ref.program_path}" '

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": "C:\\Windows\\SysWOW64\\netsh.exe"
            - "@Name": FileVersion
              "#text": "10.0.14393.0 (rs1_release.160715-1616)"
            - "@Name": Description
              "#text": Network Command Shell
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": netsh.exe
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": ref.terminal_session_id
            - "@Name": IntegrityLevel
              "#text": High
            - "@Name": Hashes
              "#text": "MD5=C3542EE1B9198274179B797C9B2A4633,SHA256=00B424FCE60E8C3ABB5BC05E2E1C4D86F14B07DB48D08660A5A7BB25FC9E3C23,IMPHASH=458D7E5D4617D66110F9AA49F8F7C3C3"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": ref.program_path
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
            - "@Name": ParentUser
              "#text": ref.user
