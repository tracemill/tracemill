type: scenario
description: |
  A command shell runs taskkill to force-stop a web browser by its image
  name. Sysmon EID 1 (Process Create) records a process, for example
  python.exe running from a folder under the user's Downloads directory,
  starting cmd.exe with a `/c taskkill /f /im` command line that names a
  browser image, for example chrome.exe. A second Sysmon EID 1 records the
  taskkill.exe process cmd.exe starts with the same `/f /im` arguments, which
  ask Windows to forcefully end every process with that image name. The
  events record the command, not whether the browser was running or what the
  parent process did next.
tags: [eid1, braodo]
mitre:
  tactics: [defense-impairment]
  techniques: [T1685]

state:
  domain_short:         CORP
  domain_tld:           local
  domain_short_lower:   fn.lower(ref.domain_short)
  domain_fqdn:          "${ref.domain_short_lower}.${ref.domain_tld}"
  host_short:           gen.hostname(class=windows-workstation)
  host_short_lower:     fn.lower(ref.host_short)
  host_short_upper:     fn.upper(ref.host_short)
  computer:             "${ref.host_short_lower}.${ref.domain_fqdn}"
  sysmon_pid:           gen.int(min=1000, max=4000)
  sysmon_tid:           gen.int(min=1000, max=9999)
  wrapper_record_id:    gen.int(min=100000, max=499999)
  process_record_id:    gen.int(min=500000, max=999999)
  user_name:            Administrator
  user:                 "${ref.host_short_upper}\\${ref.user_name}"
  logon_guid_raw:       fn.upper(gen.uuid())
  logon_guid:           "{${ref.logon_guid_raw}}"
  logon_id_hex:         gen.hex(len=5, case=lower)
  logon_id:             "0x${ref.logon_id_hex}"
  parent_guid_raw:      fn.upper(gen.uuid())
  parent_process_guid:  "{${ref.parent_guid_raw}}"
  parent_process_id:    gen.int(min=1000, max=9999)
  wrapper_guid_raw:     fn.upper(gen.uuid())
  wrapper_process_guid: "{${ref.wrapper_guid_raw}}"
  wrapper_process_id:   gen.int(min=1000, max=9999)
  process_guid_raw:     fn.upper(gen.uuid())
  process_guid:         "{${ref.process_guid_raw}}"
  process_id:           gen.int(min=1000, max=9999)
  parent_dir:           "C:\\Users\\${ref.user_name}\\Downloads\\10tymonth-main_2\\10tymonth-main"
  parent_image:         "${ref.parent_dir}\\python.exe"
  parent_command_line:  "python.exe  Lib/sim.py"
  current_directory:    "${ref.parent_dir}\\"
  browser_image:        chrome.exe
  wrapper_command_line: "C:\\Windows\\system32\\cmd.exe /c taskkill /f /im ${ref.browser_image}"
  command_line:         "taskkill  /f /im ${ref.browser_image}"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.wrapper_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.wrapper_process_guid
            - "@Name": ProcessId
              "#text": ref.wrapper_process_id
            - "@Name": Image
              "#text": "C:\\Windows\\System32\\cmd.exe"
            - "@Name": FileVersion
              "#text": "10.0.14393.0 (rs1_release.160715-1616)"
            - "@Name": Description
              "#text": Windows Command Processor
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": Cmd.Exe
            - "@Name": CommandLine
              "#text": ref.wrapper_command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": 2
            - "@Name": IntegrityLevel
              "#text": High
            - "@Name": Hashes
              "#text": "MD5=F4F684066175B77E0C3A000549D2922C,SHA256=935C1861DF1F4018D698E8B65ABFA02D7E9037D8F68CA3C2065B6CA165D44AD2,IMPHASH=3062ED732D4B25D1C64F084DAC97D37A"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": ref.parent_image
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
            - "@Name": ParentUser
              "#text": ref.user

