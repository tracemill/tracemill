type: scenario
description: |
  A process grants read-only access to a file or directory with icacls.
  Sysmon EID 1 (Process Create) records a parent process, for example
  powershell.exe running an encoded command, starting icacls.exe with
  `/inheritance:e /grant` and the permission set `(R,REA,RA,RD)` for a
  principal, for example SYSTEM, on a target path, for example
  C:\ProgramData\migrate.exe. `/inheritance:e` enables inheritance on the
  target, and R, REA, RA and RD are read-only access, read extended
  attributes, read attributes and read data / list directory. The process
  runs as an account, for example Administrator, at high integrity. The
  event records the command, not whether the permissions changed.
tags: [eid1]
mitre:
  tactics: [defense-evasion]
  techniques: [T1222.001]

state:
  host_short:          gen.hostname(class=windows-server)
  computer:            fn.lower(ref.host_short)
  host_short_upper:    fn.upper(ref.host_short)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=9999999)
  user_name:           Administrator
  user:                "${ref.host_short_upper}\\${ref.user_name}"
  current_directory:   'C:\Users\${ref.user_name}\'
  logon_guid_raw:      gen.uuid()
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id:            gen.regex(pattern=0x[1-9a-f][0-9a-f]{6})
  parent_guid_raw:     gen.uuid()
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=9999)
  process_guid_raw:    gen.uuid()
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  target_path:         'C:\ProgramData\migrate.exe'
  grants:              "SYSTEM:(R,REA,RA,RD)"
  command_line:        '"C:\Windows\system32\icacls.exe" ${ref.target_path} /inheritance:e /grant ${ref.grants}'
  parent_image:        'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
  parent_command_line: 'powershell  -encodedcommand '

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385f-c22a-43e0-bf4c-06f5698ffbd9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": 'C:\Windows\System32\icacls.exe'
            - "@Name": FileVersion
              "#text": "10.0.20348.1 (WinBuild.160101.0800)"
            - "@Name": Description
              "#text": "-"
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": iCACLS.EXE
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": 0
            - "@Name": IntegrityLevel
              "#text": High
            - "@Name": Hashes
              "#text": "MD5=4B8207877186FAFFB90E3A4D9358CBA6,SHA256=054355C415F5686DA598011065E6FDF6BED35C5FDDA81BC5BF22B9D093CC30E2,IMPHASH=446163A548337B5BCF2727BCD1CFB399"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": ref.parent_image
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
            - "@Name": ParentUser
              "#text": ref.user
