type: scenario
description: |
  A command shell runs the MOF compiler on a MOF file. Sysmon EID 1 (Process
  Create) records a parent shell, for example cmd.exe /c, starting
  mofcomp.exe from the \Windows\System32\wbem directory with the path of a
  MOF file, for example test.mof in the user's Desktop folder. When the file
  compiles, mofcomp.exe adds the classes and instances it declares to the
  WMI repository. The event records the command, not the contents of the
  MOF file or whether it compiled.
tags: [eid1]
mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1546.003]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  host_short:          gen.hostname(class=windows-server)
  host_short_lower:    fn.lower(ref.host_short)
  host_short_upper:    fn.upper(ref.host_short)
  computer:            "${ref.host_short_lower}.${ref.domain_fqdn}"
  user_name:           Administrator
  user_name_lower:     fn.lower(ref.user_name)
  # The 8.3 short name of the profile folder, which Windows puts in the Temp path.
  user_short_name:     ADMINI~1
  user:                "${ref.host_short_upper}\\${ref.user_name}"
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=9999999)
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  parent_guid_raw:     fn.upper(gen.uuid())
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=9999)
  logon_guid_raw:      fn.upper(gen.uuid())
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=5, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  mof_file:            'c:\users\${ref.user_name_lower}\desktop\test.mof'
  current_directory:   'C:\Users\${ref.user_short_name}\AppData\Local\Temp\2\'
  # cmd.exe /c strips the quotes and leaves two spaces after the image path.
  command_line:        'c:\windows\system32\wbem\mofcomp.exe  ${ref.mof_file}'
  parent_image:        'C:\Windows\System32\cmd.exe'
  parent_command_line: '"cmd.exe" /c "c:\windows\system32\wbem\mofcomp.exe ${ref.mof_file}"'

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": "C:\\Windows\\System32\\wbem\\mofcomp.exe"
            - "@Name": FileVersion
              "#text": "10.0.14393.4169 (rs1_release.210107-1130)"
            - "@Name": Description
              "#text": "The Managed Object Format (MOF) Compiler "
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": mofcomp.exe
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": 2
            - "@Name": IntegrityLevel
              "#text": High
            - "@Name": Hashes
              "#text": "MD5=62E71E4B2AA812B92067E3BBC1225974,SHA256=E480029A0CEFD09E84F474BEF944C4DC56AF44F0AA7063D4E259621846F29BFA"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": ref.parent_image
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
            - "@Name": ParentUser
              "#text": ref.user
