type: scenario
description: |
  VMware Tools starts a command shell that lists the whole file system.
  Sysmon EID 1 (Process Create) records vmtoolsd.exe, running as SYSTEM,
  starting cmd.exe with a recursive directory listing redirected into a file
  under the Windows Temp directory. The event records the launch and the
  redirection target, not what was read from the listing.
tags: [eid1]
mitre:
  tactics: [execution]
  techniques: [T1059]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:         gen.int(min=1000, max=4000)
  sysmon_tid:         gen.int(min=1000, max=9999)
  event_record_id:    gen.int(min=5000, max=9999999)
  user_name:          gen.username()
  user:               "${ref.domain_short}\\${ref.user_name}"
  logon_guid_raw:     fn.upper(gen.uuid())
  logon_id_hex:       gen.hex(len=6, case=lower)
  logon_id:           "0x${ref.logon_id_hex}"
  process_guid_raw:   fn.upper(gen.uuid())
  process_id:         gen.int(min=1000, max=9999)
  parent_guid_raw:    fn.upper(gen.uuid())
  parent_process_id:  gen.int(min=1000, max=9999)

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "5770385F-C22A-43E0-BF4C-06F5698FFBD9"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid_raw
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": "C:\\Windows\\System32\\cmd.exe"
            - "@Name": FileVersion
              "#text": "10.0.19041.4355 (WinBuild.160101.0800)"
            - "@Name": Description
              "#text": "Windows Command Processor"
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": "Microsoft Corporation"
            - "@Name": OriginalFileName
              "#text": "Cmd.Exe"
            - "@Name": CommandLine
              "#text": "\"c:\\Windows\\System32\\cmd.exe\" \"/c dir /od /s /a c:\\ > C:\\Windows\\Temp\\TS_Aahoivw.tmp 2>nul\""
            - "@Name": CurrentDirectory
              "#text": "C:\\Windows\\system32\\"
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid_raw
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": "0"
            - "@Name": IntegrityLevel
              "#text": "High"
            - "@Name": Hashes
              "#text": "MD5=2B40C98ED0F7A1D3B091A3E8353132DC,SHA256=BADF4752413CB0CBDC03FB95820CA167F0CDC63B597CCDB5EF43111180E088B0,IMPHASH=272245E2988E1E430500B852C4FB5E18"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_guid_raw
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": "C:\\Program Files\\VMware\\VMware Tools\\vmtoolsd.exe"
            - "@Name": ParentCommandLine
              "#text": "\"C:\\Program Files\\VMware\\VMware Tools\\vmtoolsd.exe\""
            - "@Name": ParentUser
              "#text": "NT AUTHORITY\\SYSTEM"
