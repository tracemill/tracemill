type: scenario
description: |
  The RDP Wrapper Library installer is started from a batch file to install
  the wrapper. Sysmon EID 1 (Process Create) records RDPWInst.exe, the RDP
  Wrapper Library installer, for example run from C:\rdp, started by a
  32-bit cmd.exe running a batch file, for example bat.bat, with -i to
  install the wrapper and -o to fetch its configuration file online. The
  wrapper enables Remote Desktop host support and concurrent sessions on
  Windows editions that lack them (https://github.com/stascorp/rdpwrap).
  The event records the launch and its arguments, not whether the
  installation succeeds.
tags: [eid1, azorult, rdp-wrapper]
mitre:
  tactics: [lateral-movement]
  techniques: [T1021.001]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=99999)
  user_name:           gen.username()
  user:                "${ref.domain_short}\\${ref.user_name}"
  logon_guid_raw:      fn.upper(gen.uuid())
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=5, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  terminal_session_id: 2
  integrity_level:     High
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=5000, max=9999)
  parent_guid_raw:     fn.upper(gen.uuid())
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=4999)
  tool_dir:            'C:\rdp'
  batch_file:          bat.bat
  image:               '${ref.tool_dir}\RDPWInst.exe'
  current_directory:   '${ref.tool_dir}\'
  command_line:        '"RDPWInst.exe"  -i -o'
  hashes:              "MD5=3288C284561055044C489567FD630AC2,SHA256=AC92D4C6397EB4451095949AC485EF4EC38501D7BB6F475419529AE67E297753,IMPHASH=A89655FAA2B6840E801BE1E1C779FC67"
  parent_image:        'C:\Windows\SysWOW64\cmd.exe'
  parent_command_line: 'C:\Windows\system32\cmd.exe /c ""${ref.tool_dir}\${ref.batch_file}" "'

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": FileVersion
              "#text": 2.5.0.0
            - "@Name": Description
              "#text": RDP Wrapper Library Installer
            - "@Name": Product
              "#text": RDP Host Support
            - "@Name": Company
              "#text": "Stas'M Corp."
            - "@Name": OriginalFileName
              "#text": RDPWInst.exe
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": ref.terminal_session_id
            - "@Name": IntegrityLevel
              "#text": ref.integrity_level
            - "@Name": Hashes
              "#text": ref.hashes
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": ref.parent_image
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
