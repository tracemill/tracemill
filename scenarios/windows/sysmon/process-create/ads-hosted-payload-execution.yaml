type: scenario
description: |
  An interpreter runs a payload stored in an alternate data stream of
  another file, so directory listings show only the innocuous host file.
  Sysmon EID 1 (Process Create) records the interpreter, for example
  powershell.exe, with the stream named on its command line in
  `host.ext:stream.ext` form, for example an executable stream on a desktop
  text file. The event records the launch, not what the payload did.
tags: [eid1]
mitre:
  tactics: [defense-evasion]
  techniques: [T1564.004]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=99999)
  user_name:           gen.username()
  user:                "${ref.domain_short}\\${ref.user_name}"
  logon_guid_raw:      fn.upper(gen.uuid())
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=5, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  terminal_session_id: 1
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=5000, max=9999)
  parent_guid_raw:     fn.upper(gen.uuid())
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=200, max=4999)
  work_dir:            "C:\\Users\\${ref.user_name}\\Desktop"
  ads_host_file:       test_ads_abuse.txt
  ads_stream:          not_malware.exe
  ads_ref:             "${ref.ads_host_file}:${ref.ads_stream}"
  driver_script:       test_ads_abuse.ps1
  image:               'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
  file_version:        10.0.17134.1 (WinBuild.160101.0800)
  binary_description:  Windows PowerShell
  original_file_name:  PowerShell.EXE
  hashes:              "SHA1=1B3B40FBC889FD4C645CC12C85D0805AC36BA254,MD5=95000560239032BC68B4C2FDFCDEF913,SHA256=D3F8FADE829D2B7BD596C4504A6DAE5C034E789B6A3DEFBE013BDA7D14466677,IMPHASH=741776AACCFC5B71FF59832DCDCACE0F"
  command_line:        "\"${ref.image}\" -command \"& {Set-Location ${ref.work_dir} ; .\\${ref.ads_ref}}\""
  current_directory:   "${ref.work_dir}\\"
  parent_image:        'C:\Windows\System32\WindowsPowerShell\v1.0\powershell_ise.exe'
  parent_command_line: "\"${ref.parent_image}\" \"${ref.work_dir}\\${ref.driver_script}\""

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": FileVersion
              "#text": ref.file_version
            - "@Name": Description
              "#text": ref.binary_description
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": ref.original_file_name
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": ref.terminal_session_id
            - "@Name": IntegrityLevel
              "#text": Medium
            - "@Name": Hashes
              "#text": ref.hashes
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": ref.parent_image
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
            - "@Name": ParentUser
              "#text": ref.user
