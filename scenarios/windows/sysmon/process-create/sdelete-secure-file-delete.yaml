type: scenario
description: |
  SDelete, the Sysinternals secure-delete utility, is started against a
  file. SDelete overwrites a file's data before it deletes the file
  (https://learn.microsoft.com/en-us/sysinternals/downloads/sdelete).
  Sysmon EID 1 (Process Create) records a copy of SDelete, for example one
  saved as sdel.exe in C:\Temp, started from cmd.exe with the /accepteula
  and -q (quiet) switches and a file to delete, for example
  C:\Temp\malware.exe. The original file name in the file's version
  information is sdelete.exe. The event records the launch, not whether
  the file's data was overwritten.
tags: [eid1, sdelete]
mitre:
  tactics: [defense-evasion, impact]
  techniques: [T1070.004, T1485]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=99999)
  username:            gen.username()
  user:                "${ref.domain_short}\\${ref.username}"
  logon_guid_raw:      fn.upper(gen.uuid())
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=5, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  terminal_session_id: 2
  integrity_level:     High
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  parent_guid_raw:     fn.upper(gen.uuid())
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=9999)
  working_dir:         "C:\\Temp"
  program_name:        sdel
  image:               "${ref.working_dir}\\${ref.program_name}.exe"
  target_file:         "C:\\Temp\\malware.exe"
  command_line:        "${ref.program_name}  /accepteula -q ${ref.target_file}"
  current_directory:   "${ref.working_dir}\\"
  original_file_name:  sdelete.exe
  file_version:        "2.04"
  file_description:    Secure file delete
  product:             Sysinternals Sdelete
  company:             Sysinternals - www.sysinternals.com
  hashes:              "MD5=803DF907D936E08FBBD06020C411BE93,SHA256=E8EAA39E2ADFD49AB69D7BB8504CCB82A902C8B48FBC256472F36F41775E594C,IMPHASH=BF6D322BC62D8BD901E253F67BC61C4E"
  parent_image:        "C:\\Windows\\System32\\cmd.exe"
  parent_command_line: "\"cmd.exe\" /s /k pushd \"${ref.working_dir}\""

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": FileVersion
              "#text": ref.file_version
            - "@Name": Description
              "#text": ref.file_description
            - "@Name": Product
              "#text": ref.product
            - "@Name": Company
              "#text": ref.company
            - "@Name": OriginalFileName
              "#text": ref.original_file_name
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": ref.terminal_session_id
            - "@Name": IntegrityLevel
              "#text": ref.integrity_level
            - "@Name": Hashes
              "#text": ref.hashes
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": ref.parent_image
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
