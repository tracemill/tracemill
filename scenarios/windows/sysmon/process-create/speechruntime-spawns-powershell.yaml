type: scenario
description: |
  The Speech Runtime host, started by COM, starts PowerShell. Sysmon EID 1
  (Process Create) records SpeechRuntime.exe from its Speech_OneCore
  directory, running with the `-Embedding` argument that COM passes to a
  server it activates, starting powershell.exe with a command line, for
  example `powershell.exe -c calc.exe`, at high integrity under the
  logged-on user, for example Administrator. The event records the
  PowerShell launch from the speech host, not how the COM class was
  activated or what code ran inside SpeechRuntime.exe.
tags: [eid1]
mitre:
  tactics: [lateral-movement, execution]
  techniques: [T1021.003, T1059.001]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  user_name:           Administrator
  user:                "${ref.domain_short}\\${ref.user_name}"
  sysmon_pid:          gen.int(min=1000, max=4999)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=9999999)
  guid_head:           gen.hex(len=8, case=upper)
  guid_mid1:           gen.hex(len=4, case=upper)
  guid_mid2:           gen.hex(len=4, case=upper)
  process_guid_seq:    gen.hex(len=4, case=upper)
  process_guid:        "{${ref.guid_head}-${ref.guid_mid1}-${ref.guid_mid2}-${ref.process_guid_seq}-000000000A00}"
  process_id:          gen.int(min=10000, max=19999)
  parent_guid_seq:     gen.hex(len=4, case=upper)
  parent_process_guid: "{${ref.guid_head}-${ref.guid_mid1}-${ref.guid_mid2}-${ref.parent_guid_seq}-000000000A00}"
  parent_process_id:   gen.int(min=5000, max=9999)
  logon_guid_mid1:     gen.hex(len=4, case=upper)
  logon_guid_mid2:     gen.hex(len=4, case=upper)
  logon_guid_seq:      gen.hex(len=4, case=upper)
  logon_guid:          "{${ref.guid_head}-${ref.logon_guid_mid1}-${ref.logon_guid_mid2}-${ref.logon_guid_seq}-140000000000}"
  logon_id_hex:        gen.hex(len=6, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  terminal_session_id: 1
  command_line:        powershell.exe -c calc.exe

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
            - "@Name": FileVersion
              "#text": "10.0.20348.1 (WinBuild.160101.0800)"
            - "@Name": Description
              "#text": Windows PowerShell
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": PowerShell.EXE
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": 'C:\Windows\system32\'
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": ref.terminal_session_id
            - "@Name": IntegrityLevel
              "#text": High
            - "@Name": Hashes
              "#text": "MD5=2E0CCB27064856E3D55017FA2D33A7B9,SHA256=1C84C8632C5269F24876ED9F49FA810B49F77E1E92E8918FC164C34B020F9A94,IMPHASH=BF7A6E7A62C3F5B2E8E069438AC1DD3D"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": 'C:\Windows\System32\Speech_OneCore\common\SpeechRuntime.exe'
            - "@Name": ParentCommandLine
              "#text": 'C:\Windows\System32\Speech_OneCore\Common\SpeechRuntime.exe -Embedding'
            - "@Name": ParentUser
              "#text": ref.user
