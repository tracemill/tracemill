type: scenario
description: |
  A user runs gdrive, a command-line client for Google Drive, against a
  Drive account. Sysmon EID 1 (Process Create) records powershell.exe
  starting gdrive.exe from the user's profile directory, with an OAuth
  token passed in the --refresh-token option and a Drive subcommand, for
  example `list` to
  list the account's files, `download --path c:\Windows\Temp -f <file id>`
  to fetch a Drive file into a local directory, or `upload --name` with a
  file path under c:\Windows\Temp. The event records the command, not
  whether the Drive request succeeded.
tags: [eid1, gdrive]
mitre:
  tactics: [exfiltration]
  techniques: [T1567]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=99999)
  user_name:           user
  user:                "${ref.domain_short}\\${ref.user_name}"
  logon_guid_raw:      fn.upper(gen.uuid())
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=5, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  parent_guid_raw:     fn.upper(gen.uuid())
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=9999)
  tool_dir:            "C:\\Users\\${ref.user_name}"
  image:               "${ref.tool_dir}\\gdrive.exe"
  current_directory:   "${ref.tool_dir}\\"
  oauth_token:         gen.regex(pattern=ya29\.[A-Za-z0-9]{28}-[A-Za-z0-9]{130}-[A-Za-z0-9]{42}_[A-Za-z0-9]{13})
  drive_command:       list
  command_line:        "\"${ref.image}\" --refresh-token ${ref.oauth_token} ${ref.drive_command}"
  parent_image:        'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
  parent_command_line: "\"${ref.parent_image}\""

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": FileVersion
              "#text": "-"
            - "@Name": Description
              "#text": "-"
            - "@Name": Product
              "#text": "-"
            - "@Name": Company
              "#text": "-"
            - "@Name": OriginalFileName
              "#text": "-"
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": 2
            - "@Name": IntegrityLevel
              "#text": Medium
            - "@Name": Hashes
              "#text": "MD5=3C1E607DE1AB44B97ACD19578F0D9289,SHA256=3CD28B0B5DA00838005E87AE2DA6BFDDBEBA652C3CE1265CDE03BE32A44C40BE,IMPHASH=F0070935B15A909B9DC00BE7997E6112"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": ref.parent_image
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
            - "@Name": ParentUser
              "#text": ref.user
