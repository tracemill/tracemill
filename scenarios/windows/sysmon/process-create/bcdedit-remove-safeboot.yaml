type: scenario
description: |
  Impact: bcdedit.exe clears the safe-mode boot flag from the running boot
  entry via `/deletevalue {current} safeboot`. Sysmon EID 1 (Process
  Create) records the bcdedit.exe launch with the flag-clearing
  CommandLine. Ransomware boots a host into Safe Mode to encrypt it with
  endpoint protection unloaded, then clears the flag so it returns to a
  normal boot.
tags: [eid1]
mitre:
  tactics: [impact]
  techniques: [T1490]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  process_guid_raw:    gen.uuid()
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  parent_guid_raw:     gen.uuid()
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=9999)
  logon_guid_raw:      gen.uuid()
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=6)
  logon_id:            "0x${ref.logon_id_hex}"
  event_record_id:     gen.int(min=5000, max=99999)
  username:            gen.username()
  user:                "${ref.domain_short}\\${ref.username}"
  image:               C:\Windows\System32\bcdedit.exe
  original_file_name:  bcdedit.exe
  command_line:        "bcdedit.exe  /deletevalue {current} safeboot"
  current_directory:   C:\Temp\
  parent_image:        C:\Windows\System32\cmd.exe
  parent_command_line: '"C:\Windows\system32\cmd.exe" /c "bcdedit.exe /deletevalue {current} safeboot"'

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": FileVersion
              "#text": 10.0.14393.4583 (rs1_release.210730-1850)
            - "@Name": Description
              "#text": Boot Configuration Data Editor
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": ref.original_file_name
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": 2
            - "@Name": IntegrityLevel
              "#text": High
            - "@Name": Hashes
              "#text": "MD5=18A7F41EC0239BFA02C9B3903356377E,SHA256=DC21C5A8BCAA1EDA369801A297FFB1AB6AC73887F676E25A71140BDDC5553462,IMPHASH=640CFCF7F00029D52EF0C4D45E2E87A6"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": ref.parent_image
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
