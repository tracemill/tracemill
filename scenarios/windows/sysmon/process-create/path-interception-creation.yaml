type: scenario
description: |
  Sysmon EID 1 (Process Create) representing privilege escalation via path interception
  on an unquoted service path. In this attack, a service is configured with an
  unquoted executable path containing spaces (e.g. C:\Program Files\windows_service.exe).
  When started, Windows attempts to execute C:\program.exe first. The scenario
  models services.exe spawning the malicious C:\program.exe.
tags: [eid1]
mitre:
  tactics: [privilege-escalation]
  techniques: [T1574.009]

state:
  computer:            gen.hostname(class=windows-workstation, domain=attackrange.local)
  user:                "NT AUTHORITY\\SYSTEM"
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  process_guid_raw:    gen.uuid()
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  parent_guid_raw:     gen.uuid()
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=9999)
  logon_guid_raw:      gen.uuid()
  logon_guid:          "{${ref.logon_guid_raw}}"
  event_record_id:     gen.int(min=5000, max=99999)

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": "C:\\program.exe"
            - "@Name": FileVersion
              "#text": "1.0.0.0"
            - "@Name": Description
              "#text": WindowsServiceExample
            - "@Name": Product
              "#text": WindowsServiceExample
            - "@Name": Company
              "#text": "-"
            - "@Name": OriginalFileName
              "#text": WindowsServiceExample.exe
            - "@Name": CommandLine
              "#text": "C:\\Program Files\\windows_service.exe"
            - "@Name": CurrentDirectory
              "#text": "C:\\Windows\\system32\\"
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": "0x3e7"
            - "@Name": TerminalSessionId
              "#text": "0"
            - "@Name": IntegrityLevel
              "#text": System
            - "@Name": Hashes
              "#text": "MD5=0655D1BD0C0C8C35999C9644A214EA4F,SHA256=F37FDC504696F1BD51F634EACE4786A3D13E9E77E0A015633BB3674A95BE84BD,IMPHASH=F34D5F2D4577ED6D9CEEC516C1F5A744"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": "C:\\Windows\\System32\\services.exe"
            - "@Name": ParentCommandLine
              "#text": "C:\\Windows\\system32\\services.exe"
