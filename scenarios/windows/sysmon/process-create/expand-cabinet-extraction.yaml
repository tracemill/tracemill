type: scenario
description: |
  A command shell extracts the contents of a cabinet archive with expand.exe.
  Sysmon EID 1 (Process Create) records cmd.exe starting expand.exe with
  `-F:*` to extract every file from a cabinet, for example
  C:\ProgramData\wonder.cab, into the current directory, for example
  C:\ProgramData. The event records the extraction command, not which files
  the archive holds or whether they run.
tags: [eid1, apt37]
mitre:
  tactics: [defense-evasion]
  techniques: [T1140]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=99999)
  process_guid_raw:    gen.uuid()
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  parent_guid_raw:     gen.uuid()
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=9999)
  logon_guid_raw:      gen.uuid()
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=5, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  terminal_session_id: 2
  integrity_level:     High
  username:            gen.username()
  user:                "${ref.domain_short}\\${ref.username}"
  cab_path:            'C:\ProgramData\wonder.cab'
  current_directory:   'C:\ProgramData\'
  command_line:        'expand  "${ref.cab_path}" -F:* . '
  parent_image:        'C:\Windows\System32\cmd.exe'
  parent_command_line: '"cmd.exe" /c mkdir "C:\ProgramData" >nul 2>&1 & echo hello from atomic red team > "C:\AtomicRedTeam\atomics\T1140\src\art-expand-source.txt" & makecab "C:\AtomicRedTeam\atomics\T1140\src\art-expand-source.txt" "${ref.cab_path}" & pushd "C:\ProgramData" & expand "${ref.cab_path}" -F:* . & popd'

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385f-c22a-43e0-bf4c-06f5698ffbd9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": 'C:\Windows\System32\expand.exe'
            - "@Name": FileVersion
              "#text": "5.00 (WinBuild.160101.0800)"
            - "@Name": Description
              "#text": LZ Expansion Utility
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": expand
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": ref.terminal_session_id
            - "@Name": IntegrityLevel
              "#text": ref.integrity_level
            - "@Name": Hashes
              "#text": "MD5=7395D1ACEAC1FD7790DD59F12DFCDEFB,SHA256=3D263DF4D7AB8B2B408713ED42B87EC355E33617B8B8249FCBD8BE52D1A50F25,IMPHASH=8BB8291E08A891E3DCA4B595B2F1D718"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": ref.parent_image
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
            - "@Name": ParentUser
              "#text": ref.user
