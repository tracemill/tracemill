type: scenario
description: |
  The Group Policy Management Editor opens the Default Domain Policy.
  Sysmon EID 1 (Process Create) records mmc.exe running the Group Policy
  Management console (gpmc.msc) starting a second mmc.exe with gpme.msc
  and a /gpobject LDAP path to the Default Domain Policy, identified by its
  well-known GUID {31B2F340-016D-11D2-945F-00C04FB984F9}, on a domain
  controller. The editor is run by a domain account, for example
  Administrator, at high integrity. The Default Domain Policy is linked at
  the root of the domain. The event records the editor opening on that
  policy, not which settings were changed.
tags: [eid1]
mitre:
  tactics: [defense-evasion, privilege-escalation]
  techniques: [T1484.001]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  domain_dn:           "DC=${ref.domain_short_lower},DC=${ref.domain_tld}"
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  record_id:           gen.int(min=5000, max=9999999)
  user_name:           Administrator
  user:                "${ref.domain_short}\\${ref.user_name}"
  current_directory:   'C:\Users\${ref.user_name}\'
  logon_guid_raw:      gen.uuid()
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=5, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  terminal_session_id: 2
  parent_guid_raw:     gen.uuid()
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=9999)
  process_guid_raw:    gen.uuid()
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385f-c22a-43e0-bf4c-06f5698ffbd9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": 'C:\Windows\System32\mmc.exe'
            - "@Name": FileVersion
              "#text": "10.0.17763.1697 (WinBuild.160101.0800)"
            - "@Name": Description
              "#text": Microsoft Management Console
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": mmc.exe
            - "@Name": CommandLine
              "#text": '"C:\Windows\system32\mmc.exe" "C:\Windows\System32\gpme.msc" /s /gpobject:"LDAP://${ref.computer}/cn={31B2F340-016D-11D2-945F-00C04FB984F9},cn=policies,cn=system,${ref.domain_dn}"'
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": ref.terminal_session_id
            - "@Name": IntegrityLevel
              "#text": High
            - "@Name": Hashes
              "#text": "MD5=7A769B71B7FAE44E4F57B6BE4206DD97,SHA256=03048F7A610EE24CA36007019C6D5D200A9E94172D7F7A46CF71D7E792163E8D,IMPHASH=B8EE2D6252332A68B70B22E3D6E377D2"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": 'C:\Windows\System32\mmc.exe'
            - "@Name": ParentCommandLine
              "#text": '"C:\Windows\system32\mmc.exe" C:\Windows\system32\gpmc.msc'
            - "@Name": ParentUser
              "#text": ref.user
