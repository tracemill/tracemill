type: scenario
description: |
  Windows Explorer is started with the `/root,` switch and a program path as
  its root target. Sysmon EID 1 (Process Create) records explorer.exe starting
  with a command line of `explorer.exe`, the `/root,` switch and a quoted
  program path, for example "c:\windows\system32\calc.exe". The parent image,
  parent command line and parent user are recorded as `-` and the parent
  process GUID as all zeros, so the event names no parent image for the new
  explorer.exe process. The event records the launch and its command line,
  not what the target program did next.
tags: [eid1]
mitre:
  tactics: [defense-evasion, privilege-escalation]
  techniques: [T1134.004]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=99999)
  user_name:           Administrator
  user_name_lower:     fn.lower(ref.user_name)
  user:                "${ref.domain_short}\\${ref.user_name}"
  current_directory:   "C:\\Users\\${ref.user_name_lower}.${ref.domain_short}\\"
  logon_guid_raw:      fn.upper(gen.uuid())
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=5, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  parent_process_id:   gen.int(min=300, max=9999)
  target_path:         'c:\windows\system32\calc.exe'
  command_line:        'explorer.exe  /root, "${ref.target_path}"'

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": "C:\\Windows\\explorer.exe"
            - "@Name": FileVersion
              "#text": "10.0.14393.6250 (rs1_release.230807-1736)"
            - "@Name": Description
              "#text": Windows Explorer
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": EXPLORER.EXE
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": 2
            - "@Name": IntegrityLevel
              "#text": High
            - "@Name": Hashes
              "#text": "MD5=96A50F3FB59F515212196EE8339D54CE,SHA256=0435C56A9B2D19C830BBE27308E5E430A8EC7FD5BCB64A9CC0B38E554D60197E,IMPHASH=8D2880102609AA4B23679BD4FEBEBC95"
            - "@Name": ParentProcessGuid
              "#text": "{00000000-0000-0000-0000-000000000000}"
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": "-"
            - "@Name": ParentCommandLine
              "#text": "-"
            - "@Name": ParentUser
              "#text": "-"
