type: scenario
description: |
  The Windows Compatibility Telemetry host runs a program registered under
  its controller key, so it starts as SYSTEM on the appraiser task's
  schedule. Sysmon EID 1 (Process Create) records the host starting the
  program, for example one staged under a temporary directory, with only the
  correlation-vector switch on its command line. The event records the child
  launch, not the registry write that registered it.
tags: [eid1]
mitre:
  tactics: [execution, persistence, privilege-escalation]
  techniques: [T1546, T1053.005]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=99999)
  user:                NT AUTHORITY\SYSTEM
  logon_guid_raw:      gen.uuid()
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id:            "0x3e7"
  terminal_session_id: 0
  process_guid_raw:    gen.uuid()
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=5000, max=29999)
  parent_guid_raw:     gen.uuid()
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=20000, max=29999)
  image:               'C:\Temp\malware.exe'
  file_version:        10.0.19041.4355 (WinBuild.160101.0800)
  binary_description:  MALWARE
  binary_product:      Hacket Stuff
  binary_company:      We Breach You
  original_file_name:  MALWARE.EXE
  hashes:              "MD5=BD33AA772F4751C5A79F94636088774E,SHA256=C286747D319818C1205FD487040840353C5F4542FAFFDABAE9131481BDFEB92A,IMPHASH=09ED737A03DB7295BF734A9953F6EB5E"
  correlation_vector:  "veoHBnl+fEWk9ZwL.8"
  child_switches:      "-cv:${ref.correlation_vector}"
  command_line:        "${ref.image} ${ref.child_switches}"
  current_directory:   'C:\WINDOWS\system32\'
  parent_image:        'C:\Windows\System32\CompatTelRunner.exe'
  parent_command_line: '"C:\WINDOWS\system32\compattelrunner.exe"'

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385f-c22a-43e0-bf4c-06f5698ffbd9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": FileVersion
              "#text": ref.file_version
            - "@Name": Description
              "#text": ref.binary_description
            - "@Name": Product
              "#text": ref.binary_product
            - "@Name": Company
              "#text": ref.binary_company
            - "@Name": OriginalFileName
              "#text": ref.original_file_name
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": ref.terminal_session_id
            - "@Name": IntegrityLevel
              "#text": System
            - "@Name": Hashes
              "#text": ref.hashes
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": ref.parent_image
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
            - "@Name": ParentUser
              "#text": ref.user
