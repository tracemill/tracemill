type: scenario
description: |
  NirSoft AdvancedRun is started with options that tell it which program to
  run and how. Sysmon EID 1 (Process Create) records AdvancedRun.exe, for
  example extracted under the user's AppData\Local\Temp folder, started from
  powershell.exe with a command line that names the program to run, for
  example /EXEFilename C:\Windows\System32\sc.exe with /CommandLine "stop
  WinDefend", /WindowState 0 and /RunAs 8, which NirSoft documents as
  running the program as TrustedInstaller. Other command lines, for example
  /cfg naming an AdvancedRun.cfg settings file followed by /run, take the
  program and its options from that file instead. The original file
  name in the file's version information is AdvancedRun.exe. The event
  records the AdvancedRun launch and its arguments, not whether the target
  program runs or what it changes.
tags: [eid1, advancedrun]
mitre:
  tactics: [resource-development]
  techniques: [T1588.002]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=99999)
  user_name:           Administrator
  user:                "${ref.domain_short}\\${ref.user_name}"
  logon_guid_raw:      fn.upper(gen.uuid())
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=5, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  terminal_session_id: 2
  integrity_level:     High
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=4999)
  parent_guid_raw:     fn.upper(gen.uuid())
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=5000, max=9999)
  install_dir:         'C:\Users\${ref.user_name}\AppData\Local\Temp\advancedrun'
  image:               '${ref.install_dir}\AdvancedRun.exe'
  # The double space after /StartDirectory is part of the recorded command line.
  run_arguments:       '/EXEFilename C:\Windows\System32\sc.exe /WindowState 0 /CommandLine "stop WinDefend" /StartDirectory  /RunAs 8 /Run'
  command_line:        '"${ref.image}" ${ref.run_arguments}'
  current_directory:   '${ref.install_dir}\'
  hashes:              "MD5=2F06A497BACD1F270363B22A3498BDC2,SHA256=8EF8957A60BC02849E0CDE21278C7432F4782E27559CEECE306FEF2CDA70CEE8"
  parent_image:        'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
  # The trailing space is part of the recorded command line.
  parent_command_line: '"C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" '

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": FileVersion
              "#text": "1.50"
            - "@Name": Description
              "#text": Run a program with different settings that you choose.
            - "@Name": Product
              "#text": AdvancedRun
            - "@Name": Company
              "#text": NirSoft
            - "@Name": OriginalFileName
              "#text": AdvancedRun.exe
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": ref.terminal_session_id
            - "@Name": IntegrityLevel
              "#text": ref.integrity_level
            - "@Name": Hashes
              "#text": ref.hashes
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": ref.parent_image
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
            - "@Name": ParentUser
              "#text": ref.user
