type: scenario
description: |
  The .NET build tool runs a project file, so code compiled inline from it
  executes under a signed Microsoft binary. Sysmon EID 1 (Process Create)
  records the build tool started by a command shell with the project file on
  its command line, for example a copy of the tool under a temporary folder
  or under another name. The event records the build starting, not what the
  project's inline task did.
tags: [eid1]
mitre:
  tactics: [defense-evasion]
  techniques: [T1036.003, T1127.001]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=99999)
  user_name:           Administrator
  user:                "${ref.domain_short}\\${ref.user_name}"
  logon_guid_raw:      fn.upper(gen.uuid())
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=7, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  terminal_session_id: 2
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=5000, max=9999)
  parent_guid_raw:     fn.upper(gen.uuid())
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=200, max=4999)
  image:               'C:\Temp\MSBuild.exe'
  hashes:              "MD5=25AF350BC14E22D38408E60A71DF6A73,SHA256=10332B7807D8397DAB04D8796C418B0074C1980CD88CBA0CFAFE9491D1C71AAF,IMPHASH=F34D5F2D4577ED6D9CEEC516C1F5A744"
  exe_invoked:         'c:\temp\msbuild.exe'
  project_path:        'C:\AtomicRedTeam\atomics\T1127.001\src\T1127.001.csproj'
  command_line:        "${ref.exe_invoked}  ${ref.project_path} "
  current_directory:   'C:\Users\ADMINI~1\AppData\Local\Temp\'
  parent_image:        'C:\Windows\System32\cmd.exe'
  parent_command_line: "\"C:\\Windows\\system32\\cmd.exe\" /c \"${ref.exe_invoked} ${ref.project_path}\" "

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": FileVersion
              "#text": "4.7.2053.0 built by: NET47REL1"
            - "@Name": Description
              "#text": MSBuild.exe
            - "@Name": Product
              "#text": "Microsoft® .NET Framework"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": MSBuild.exe
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": ref.terminal_session_id
            - "@Name": IntegrityLevel
              "#text": High
            - "@Name": Hashes
              "#text": ref.hashes
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": ref.parent_image
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
