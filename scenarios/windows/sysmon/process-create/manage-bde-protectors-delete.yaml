type: scenario
description: |
  A user removes the BitLocker key protectors from a volume with
  manage-bde.exe. Sysmon EID 1 (Process Create) records cmd.exe starting
  manage-bde.exe at High integrity with the arguments `-protectors -delete`
  and a volume, for example C:, which asks BitLocker to delete every key
  protector on that volume. The event records the request, not whether any
  protector is removed.
tags: [eid1, shrinklocker]
mitre:
  tactics: [impact]
  techniques: [T1486, T1490]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=99999)
  user_name:           gen.username()
  user:                "${ref.domain_short}\\${ref.user_name}"
  current_directory:   'C:\Users\${ref.user_name}\'
  logon_guid_raw:      gen.uuid()
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=6, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  terminal_session_id: 1
  integrity_level:     High
  process_guid_raw:    gen.uuid()
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  parent_guid_raw:     gen.uuid()
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=9999)
  volume:              "C:"
  # The double space after the program name is part of the recorded command line.
  command_line:        "Manage-bde  -protectors -delete ${ref.volume}"
  # The trailing space is part of the recorded command line.
  parent_command_line: '"C:\WINDOWS\system32\cmd.exe" '

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385f-c22a-43e0-bf4c-06f5698ffbd9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": 'C:\Windows\System32\manage-bde.exe'
            - "@Name": FileVersion
              "#text": "10.0.19041.1 (WinBuild.160101.0800)"
            - "@Name": Description
              "#text": "BitLocker Drive Encryption: Configuration Tool"
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": manage-bde.exe
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": ref.terminal_session_id
            - "@Name": IntegrityLevel
              "#text": ref.integrity_level
            - "@Name": Hashes
              "#text": "MD5=84021D418863A3E530D2E3F65F5D154C,SHA256=38F20A75E04BB9A53C563152A90A5B29AB689AFF58D6ABD3E005D156EE4E4C73,IMPHASH=817DDC8CC4FA183F801D96706E452A3B"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": 'C:\Windows\System32\cmd.exe'
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
            - "@Name": ParentUser
              "#text": ref.user
