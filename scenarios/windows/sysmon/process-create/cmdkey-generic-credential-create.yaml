type: scenario
description: |
  A command shell runs cmdkey.exe to store a generic credential in Windows
  Credential Manager. Sysmon EID 1 (Process Create) records cmd.exe starting
  cmdkey.exe with `/generic:` naming the credential's target, for example
  127.0.0.2, `/user:` naming an account, for example SafeMode, and `/pass:`
  carrying its password in clear text, for example darkgatepassword0. The
  event records the command line, not whether the credential was stored.
tags: [eid1, darkgate]
mitre:
  tactics: [credential-access]
  techniques: [T1555]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=99999)
  user_name:           gen.username()
  user:                "${ref.domain_short}\\${ref.user_name}"
  logon_guid_raw:      fn.upper(gen.uuid())
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=5, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  terminal_session_id: 2
  integrity_level:     High
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  parent_guid_raw:     fn.upper(gen.uuid())
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=9999)
  target:              127.0.0.2
  credential_user:     SafeMode
  credential_password: darkgatepassword0
  cmdkey_arguments:    '/generic:"${ref.target}" /user:"${ref.credential_user}" /pass:"${ref.credential_password}"'
  command_line:        'cmdkey  ${ref.cmdkey_arguments}'
  parent_command_line: 'cmd.exe  /c cmdkey ${ref.cmdkey_arguments}'

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": 'C:\Windows\System32\cmdkey.exe'
            - "@Name": FileVersion
              "#text": "10.0.14393.2430 (rs1_release_inmarket_aim.180806-1810)"
            - "@Name": Description
              "#text": Credential Manager Command Line Utility
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": cmdkey.exe
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": 'C:\Temp\'
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": ref.terminal_session_id
            - "@Name": IntegrityLevel
              "#text": ref.integrity_level
            - "@Name": Hashes
              "#text": "MD5=343E6DA0ADF3D528C54E1767254432A6,SHA256=89B6A8CB5CF989E3D999482CECF779BA295871A9C80C8CA151694942D5881114,IMPHASH=02CCF792E6FC0981B34A77557B081489"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": 'C:\Windows\System32\cmd.exe'
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
            - "@Name": ParentUser
              "#text": ref.user
