type: scenario
description: |
  A NorthStar C2 stager starts on a Windows host. Sysmon EID 1 (Process
  Create) records NorthstarStager.exe, whose version information names it
  System Health Check, starting from a user profile directory with a high
  integrity level, and records its parent process fields as -. The event
  records the stager starting, not any connection to a command-and-control
  server.
tags: [eid1, northstar]
mitre:
  tactics: [execution]
  techniques: [T1204.002]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  host_short:          gen.hostname(class=windows-workstation)
  host_short_lower:    fn.lower(ref.host_short)
  computer:            "${ref.host_short_lower}.${ref.domain_fqdn}"
  user_name:           gen.username()
  user:                "${ref.domain_short}\\${ref.user_name}"
  profile_user:        gen.username()
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=99999)
  process_guid_raw:    gen.uuid()
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  parent_process_id:   gen.int(min=1000, max=9999)
  logon_guid_raw:      gen.uuid()
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=5, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": "C:\\Users\\${ref.profile_user}\\NorthstarStager.exe"
            - "@Name": FileVersion
              "#text": "1.0.0.0"
            - "@Name": Description
              "#text": System Health Check
            - "@Name": Product
              "#text": System Health Check
            - "@Name": Company
              "#text": "-"
            - "@Name": OriginalFileName
              "#text": NorthstarStager.exe
            - "@Name": CommandLine
              "#text": "\"C:\\users\\${ref.profile_user}\\NorthstarStager.exe\""
            - "@Name": CurrentDirectory
              "#text": "C:\\users\\${ref.profile_user}\\"
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": 1
            - "@Name": IntegrityLevel
              "#text": High
            - "@Name": Hashes
              "#text": "MD5=FB33F5DF25747FC0E31D6F09FD38C564,SHA256=0A2882CD53C8047647D6CD153D034BA194C5838EA90D45F096A91D4394FD1201,IMPHASH=F34D5F2D4577ED6D9CEEC516C1F5A744"
            - "@Name": ParentProcessGuid
              "#text": "{00000000-0000-0000-0000-000000000000}"
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": "-"
            - "@Name": ParentCommandLine
              "#text": "-"
            - "@Name": ParentUser
              "#text": "-"
