type: scenario
description: |
  Rubeus, the .NET Kerberos abuse tool, starts monitoring the host for new
  ticket-granting tickets. Sysmon EID 1 (Process Create) records a process,
  for example C:\Tools\Rubeus.exe, started from cmd.exe at High integrity
  with a monitor command line. Rubeus's monitor command extracts
  ticket-granting tickets from the host's logon sessions at a set interval,
  for example every 5 seconds, and prints the newly captured ones for a
  target account, for example administrator; /nowrap prints each base64
  ticket on one line. The event records the launch and its command line, not
  which tickets were collected.
tags: [eid1, rubeus]
mitre:
  tactics: [credential-access]
  techniques: [T1558]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  parent_guid_raw:     fn.upper(gen.uuid())
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=9999)
  logon_guid_raw:      fn.upper(gen.uuid())
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=7, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  event_record_id:     gen.int(min=5000, max=999999)
  username:            Administrator
  user:                "${ref.domain_short}\\${ref.username}"
  tool_dir:            "C:\\Tools"
  image:               "${ref.tool_dir}\\Rubeus.exe"
  current_directory:   "${ref.tool_dir}\\"
  interval:            5
  target_user:         administrator
  command_line:        "Rubeus.exe  monitor /interval:${ref.interval}  /targetuser:${ref.target_user} /nowrap"
  integrity_level:     High
  terminal_session_id: 3

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": FileVersion
              "#text": "1.0.0.0"
            - "@Name": Description
              "#text": Rubeus
            - "@Name": Product
              "#text": Rubeus
            - "@Name": Company
              "#text": "-"
            - "@Name": OriginalFileName
              "#text": Rubeus.exe
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": ref.terminal_session_id
            - "@Name": IntegrityLevel
              "#text": ref.integrity_level
            - "@Name": Hashes
              "#text": "MD5=ECCFE02363BDC0068F2DAEF326EA356F,SHA256=BE95105C17452B68806C1DE4DF5725A4ADE81A0FB05AEC047AA2C30C633DD05E,IMPHASH=F34D5F2D4577ED6D9CEEC516C1F5A744"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": "C:\\Windows\\System32\\cmd.exe"
            - "@Name": ParentCommandLine
              "#text": "\"C:\\Windows\\system32\\cmd.exe\" "
