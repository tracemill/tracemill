type: scenario
description: |
  A process starts from an executable whose file name puts a document
  extension in front of .exe. Sysmon EID 1 (Process Create) records the
  launch of a file, for example a .pdf.exe file in the user's
  AppData\Local\Temp folder, started by a parent process, for example
  cmd.exe, with a command line that is only the file's path. The original
  file name in the file's version information belongs to a different
  program, for example CALC.EXE. The event records the launch, not how the
  file reached the host or who chose to open it.
tags: [eid1]
mitre:
  tactics: [defense-evasion]
  techniques: [T1036.003]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=99999)
  user_name:           Administrator
  user_short_name:     ADMINI~1
  user:                "${ref.domain_short}\\${ref.user_name}"
  logon_guid_raw:      fn.upper(gen.uuid())
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=5, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  terminal_session_id: 0
  integrity_level:     High
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  parent_guid_raw:     fn.upper(gen.uuid())
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=9999)
  temp_dir:            "C:\\Users\\${ref.user_short_name}\\AppData\\Local\\Temp"
  file_name:           T1036.003_masquerading.pdf.exe
  image:               "${ref.temp_dir}\\${ref.file_name}"
  # The trailing spaces are part of the recorded command line; SIEM field
  # extraction trims them, so the extracted value still ends in .exe.
  command_line:        "${ref.image}  "
  current_directory:   "${ref.temp_dir}\\"
  original_file_name:  CALC.EXE
  file_version:        "10.0.14393.0 (rs1_release.160715-1616)"
  file_description:    Windows Calculator
  product:             "Microsoft® Windows® Operating System"
  company:             Microsoft Corporation
  hashes:              "MD5=4673C27FDCAB6166578A1863060D83FF,SHA256=B093FD472121CDA0BBB1E0079479DE36325F1B2FAA7FDA54C4F757565572FE1D,IMPHASH=3843C3D4A5A7D1045ABE9A4BFCFAAB28"
  parent_image:        "C:\\Windows\\System32\\cmd.exe"
  parent_command_line: "\"C:\\Windows\\system32\\cmd.exe\" /c \"copy C:\\Windows\\System32\\calc.exe %temp%\\T1036.003_masquerading.docx.exe /Y & copy C:\\Windows\\System32\\calc.exe %temp%\\T1036.003_masquerading.pdf.exe /Y & copy C:\\Windows\\System32\\calc.exe %temp%\\T1036.003_masquerading.ps1.exe /Y & copy C:\\AtomicRedTeam\\atomics\\T1036.003\\src\\T1036.003_masquerading.vbs %temp%\\T1036.003_masquerading.xls.vbs /Y & copy C:\\AtomicRedTeam\\atomics\\T1036.003\\src\\T1036.003_masquerading.vbs %temp%\\T1036.003_masquerading.xlsx.vbs /Y & copy C:\\AtomicRedTeam\\atomics\\T1036.003\\src\\T1036.003_masquerading.vbs %temp%\\T1036.003_masquerading.png.vbs /Y & copy C:\\AtomicRedTeam\\atomics\\T1036.003\\src\\T1036.003_masquerading.ps1 %temp%\\T1036.003_masquerading.doc.ps1 /Y & copy C:\\AtomicRedTeam\\atomics\\T1036.003\\src\\T1036.003_masquerading.ps1 %temp%\\T1036.003_masquerading.pdf.ps1 /Y & copy C:\\AtomicRedTeam\\atomics\\T1036.003\\src\\T1036.003_masquerading.ps1 %temp%\\T1036.003_masquerading.rtf.ps1 /Y & %temp%\\T1036.003_masquerading.docx.exe & %temp%\\T1036.003_masquerading.pdf.exe & %temp%\\T1036.003_masquerading.ps1.exe & %temp%\\T1036.003_masquerading.xls.vbs & %temp%\\T1036.003_masquerading.xlsx.vbs & %temp%\\T1036.003_masquerading.png.vbs & C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe -File %temp%\\T1036.003_masquerading.doc.ps1 & C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe -File %temp%\\T1036.003_masquerading.pdf.ps1 & C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe -File %temp%\\T1036.003_masquerading.rtf.ps1\" "

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": FileVersion
              "#text": ref.file_version
            - "@Name": Description
              "#text": ref.file_description
            - "@Name": Product
              "#text": ref.product
            - "@Name": Company
              "#text": ref.company
            - "@Name": OriginalFileName
              "#text": ref.original_file_name
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": ref.terminal_session_id
            - "@Name": IntegrityLevel
              "#text": ref.integrity_level
            - "@Name": Hashes
              "#text": ref.hashes
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": ref.parent_image
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
