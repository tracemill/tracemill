type: scenario
description: |
  A batch file stops services in bulk: Sysmon EID 1 (Process Create) records
  cmd.exe running an update.bat script and starting sc.exe once per service,
  each invocation stopping a different named service within the same few
  seconds. Ransomware and coin miners clear the way like this -- stopping
  security, database and backup services so their files are unlocked and
  nothing restarts them -- and it is the volume in a short window, not any one
  stop, that separates this from ordinary administration.
tags: [eid1]
mitre:
  tactics: [impact]
  techniques: [T1489]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  user_name:           gen.username()
  user:                "${ref.domain_short}\\${ref.user_name}"
  logon_guid_raw:      fn.upper(gen.uuid())
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=6, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  terminal_session_id: 2
  integrity_level:     High
  parent_guid_raw:     fn.upper(gen.uuid())
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=3000, max=4999)
  image:               'C:\Windows\SysWOW64\sc.exe'
  file_version:        "10.0.14393.0 (rs1_release.160715-1616)"
  binary_description:  Service Control Manager Configuration Tool
  binary_product:      "Microsoft® Windows® Operating System"
  binary_company:      Microsoft Corporation
  original_file_name:  sc.exe
  current_directory:   'C:\Windows\fonts\'
  hashes:              "MD5=98C455ABA6069ADC9B25ECB3F2A05A64,SHA256=B6CE75E1D5B462CF6814C917D294232E8B83083539E6898EE2DEAC009F60E56D,IMPHASH=5CDCD767BE64415AA5CBF49DE5F34086"
  parent_image:        'C:\Windows\SysWOW64\cmd.exe'
  parent_command_line: 'C:\Windows\system32\cmd.exe /c ""C:\Windows\fonts\update.bat" "'

  # One row per service the script stops. Each carries its own process
  # identity so the burst reads as separate sc.exe invocations rather than one
  # process repeated.
  stops:
    - { service: localSystem, guid_raw: fn.upper(gen.uuid()), pid: "gen.int(min=5000, max=9999)", record_id: "gen.int(min=244000, max=244999)" }
    - { service: DeviceInstaller, guid_raw: fn.upper(gen.uuid()), pid: "gen.int(min=5000, max=9999)", record_id: "gen.int(min=244000, max=244999)" }
    - { service: TrustedDriver, guid_raw: fn.upper(gen.uuid()), pid: "gen.int(min=5000, max=9999)", record_id: "gen.int(min=244000, max=244999)" }
    - { service: sqlbrowsers, guid_raw: fn.upper(gen.uuid()), pid: "gen.int(min=5000, max=9999)", record_id: "gen.int(min=244000, max=244999)" }
    - { service: syswl, guid_raw: fn.upper(gen.uuid()), pid: "gen.int(min=5000, max=9999)", record_id: "gen.int(min=244000, max=244999)" }
    - { service: Googler, guid_raw: fn.upper(gen.uuid()), pid: "gen.int(min=5000, max=9999)", record_id: "gen.int(min=244000, max=244999)" }

steps:
  - foreach:
      in: ref.stops
      as: stop
      steps:
        - emit:
            event_type: windows.wineventlog@v1
            fields:
              System:
                Provider:
                  "@Name": Microsoft-Windows-Sysmon
                  "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
                EventID: 1
                Version: 5
                Level: 4
                Task: 1
                Opcode: 0
                Keywords: "0x8000000000000000"
                TimeCreated:
                  "@SystemTime": gen.timestamp(format=wineventlog)
                EventRecordID: ref.stop.record_id
                Correlation: {}
                Execution:
                  "@ProcessID": ref.sysmon_pid
                  "@ThreadID": ref.sysmon_tid
                Channel: Microsoft-Windows-Sysmon/Operational
                Computer: ref.computer
                Security:
                  "@UserID": S-1-5-18
              EventData:
                Data:
                  - "@Name": RuleName
                    "#text": "-"
                  - "@Name": UtcTime
                    "#text": gen.timestamp(format=sysmon)
                  - "@Name": ProcessGuid
                    "#text": "{${ref.stop.guid_raw}}"
                  - "@Name": ProcessId
                    "#text": ref.stop.pid
                  - "@Name": Image
                    "#text": ref.image
                  - "@Name": FileVersion
                    "#text": ref.file_version
                  - "@Name": Description
                    "#text": ref.binary_description
                  - "@Name": Product
                    "#text": ref.binary_product
                  - "@Name": Company
                    "#text": ref.binary_company
                  - "@Name": OriginalFileName
                    "#text": ref.original_file_name
                  - "@Name": CommandLine
                    "#text": "sc  stop ${ref.stop.service}"
                  - "@Name": CurrentDirectory
                    "#text": ref.current_directory
                  - "@Name": User
                    "#text": ref.user
                  - "@Name": LogonGuid
                    "#text": ref.logon_guid
                  - "@Name": LogonId
                    "#text": ref.logon_id
                  - "@Name": TerminalSessionId
                    "#text": ref.terminal_session_id
                  - "@Name": IntegrityLevel
                    "#text": ref.integrity_level
                  - "@Name": Hashes
                    "#text": ref.hashes
                  - "@Name": ParentProcessGuid
                    "#text": ref.parent_process_guid
                  - "@Name": ParentProcessId
                    "#text": ref.parent_process_id
                  - "@Name": ParentImage
                    "#text": ref.parent_image
                  - "@Name": ParentCommandLine
                    "#text": ref.parent_command_line
