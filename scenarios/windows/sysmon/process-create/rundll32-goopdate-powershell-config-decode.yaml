type: scenario
description: |
  Rundll32 runs the DllRegisterServer export of a DLL named goopdate.dll,
  which starts PowerShell to decode and run the contents of a config.txt
  file. Sysmon EID 1 (Process Create) records the 32-bit rundll32.exe in
  SysWOW64, with a command line naming goopdate.dll,DllRegisterServer in a
  folder on the user's Desktop, for example C:\users\user\Desktop\powgoop,
  starting the 32-bit powershell.exe in that folder at high integrity with
  -exec bypass and an inline command. The command defines functions that
  base64-decode their input with FromBase64String and subtract 2 from each
  byte, reads config.txt with get-content, and runs the decoded text
  through Invoke-Expression, spelled `&($ShellId[1] + 'ex')`. The event
  records the PowerShell launch, not the decoded script or any network
  traffic it then makes.
tags: [eid1, powgoop]
mitre:
  tactics: [execution, defense-evasion]
  techniques: [T1059.001, T1140, T1218.011]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=99999)
  user_name:           user
  user:                "${ref.domain_short}\\${ref.user_name}"
  logon_id_hex:        gen.hex(len=5, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  terminal_session_id: 2
  guid_head:           gen.hex(len=8, case=upper)
  guid_tail:           gen.hex(len=4, case=upper)
  guid_time_lo:        gen.hex(len=4, case=upper)
  guid_time_hi:        gen.hex(len=4, case=upper)
  process_guid_seq:    gen.hex(len=4, case=upper)
  process_guid:        "{${ref.guid_head}-${ref.guid_time_lo}-${ref.guid_time_hi}-${ref.process_guid_seq}-00000000${ref.guid_tail}}"
  process_id:          gen.int(min=10000, max=19999)
  parent_guid_seq:     gen.hex(len=4, case=upper)
  parent_process_guid: "{${ref.guid_head}-${ref.guid_time_lo}-${ref.guid_time_hi}-${ref.parent_guid_seq}-00000000${ref.guid_tail}}"
  parent_process_id:   gen.int(min=4000, max=9999)
  logon_guid_mid1:     gen.hex(len=4, case=upper)
  logon_guid_mid2:     gen.hex(len=4, case=upper)
  logon_guid_seq:      gen.hex(len=4, case=upper)
  logon_guid_node:     gen.hex(len=2, case=upper)
  logon_guid:          "{${ref.guid_head}-${ref.logon_guid_mid1}-${ref.logon_guid_mid2}-${ref.logon_guid_seq}-${ref.logon_guid_node}0000000000}"
  dll_dir:             "C:\\users\\${ref.user_name}\\Desktop\\powgoop"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": 'C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe'
            - "@Name": FileVersion
              "#text": "10.0.19041.546 (WinBuild.160101.0800)"
            - "@Name": Description
              "#text": Windows PowerShell
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": PowerShell.EXE
            # The doubled quotes are part of the recorded command line.
            - "@Name": CommandLine
              "#text": 'powershell -exec bypass ""function bdec($in){$out = [System.Convert]::FromBase64String($in);return [System.Text.Encoding]::UTF8.GetString($out);}function bDec2($szinput){$in = [System.Text.Encoding]::UTF8.GetBytes($szinput);for ($i=0; $i -le $in.count -1; $i++){$in[$i] = $in[$i] - 2;}return [System.Text.Encoding]::UTF8.GetString($in);}function bDd($in){$dec = bdec $in;$temp = bDec2 $dec;return $temp;}$a=get-content "config.txt";$t =bDd $a;&($ShellId[1] + ''ex'') $t;""'
            - "@Name": CurrentDirectory
              "#text": "${ref.dll_dir}\\"
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": ref.terminal_session_id
            - "@Name": IntegrityLevel
              "#text": High
            - "@Name": Hashes
              "#text": "MD5=C32CA4ACFCC635EC1EA6ED8A34DF5FAC,SHA256=73A3C4AEF5DE385875339FC2EB7E58A9E8A47B6161BDC6436BF78A763537BE70,IMPHASH=194427A488ED1DD0A91731658B071667"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": 'C:\Windows\SysWOW64\rundll32.exe'
            - "@Name": ParentCommandLine
              "#text": "Rundll32.exe ${ref.dll_dir}\\goopdate.dll,DllRegisterServer"
            - "@Name": ParentUser
              "#text": ref.user
