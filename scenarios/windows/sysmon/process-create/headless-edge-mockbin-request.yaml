type: scenario
description: |
  Microsoft Edge starts headless and opens a mockbin.org address. Sysmon EID 1
  (Process Create) records msedge.exe, started by cmd.exe running a batch
  file, with a command line that runs the browser without a visible window
  (--headless=new), with GPU acceleration disabled (--disable-gpu), and opens
  a mockbin.org bin URL, for example
  https://mockbin.org/bin/31b1332f-8f5c-490e-8ec0-78e77b4e5709. The event
  records the launch and the URL, not what the page returned.
tags: [eid1]
mitre:
  tactics: [defense-evasion]
  techniques: [T1564.003]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  host_short:          gen.hostname(class=windows-server)
  host_short_lower:    fn.lower(ref.host_short)
  host_short_upper:    fn.upper(ref.host_short)
  computer:            "${ref.host_short_lower}.${ref.domain_fqdn}"
  user_name:           Administrator
  user:                "${ref.host_short_upper}\\${ref.user_name}"
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=99999)
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=12000)
  parent_guid_raw:     fn.upper(gen.uuid())
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=12000)
  logon_guid_raw:      fn.upper(gen.uuid())
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=6, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  image:               "C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe"
  target_url:          "https://mockbin.org/bin/31b1332f-8f5c-490e-8ec0-78e77b4e5709"
  command_line:        "\"${ref.image}\"  --headless=new --disable-gpu ${ref.target_url} "
  current_directory:   "C:\\Users\\${ref.user_name}\\Desktop\\11719307473\\749533eef943e019e1f6ccf61f36cc0939f7aa0c730bac84467d83441a0584f0~\\"
  parent_command_line: "C:\\Windows\\system32\\cmd.exe /c \"\"C:\\ProgramData\\b207a288-3e1f-42cc-baed-709385117200.bat\" \""

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": FileVersion
              "#text": 116.0.1938.76
            - "@Name": Description
              "#text": Microsoft Edge
            - "@Name": Product
              "#text": Microsoft Edge
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": msedge.exe
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": 2
            - "@Name": IntegrityLevel
              "#text": High
            - "@Name": Hashes
              "#text": "MD5=86E2284C8AB340D17BECC6BDFC889198,SHA256=DC4E8127DC7801D5D92C9446E852F0262E4B63CE2B1AE459573BEED0E85A3A14"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": "C:\\Windows\\System32\\cmd.exe"
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
            - "@Name": ParentUser
              "#text": ref.user
