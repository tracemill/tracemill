type: scenario
description: |
  Sysmon EID 1 (Process Create) representing standard service execution (benign-control).
  Models services.exe launching svchost.exe normally. This acts as a false positive control,
  verifying that standard service launches do not trigger the path interception alert.
tags: [eid1]

state:
  computer:            gen.hostname(class=windows-workstation, domain=attackrange.local)
  user:                "NT AUTHORITY\\SYSTEM"
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  process_guid_raw:    gen.uuid()
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  parent_guid_raw:     gen.uuid()
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=9999)
  logon_guid_raw:      gen.uuid()
  logon_guid:          "{${ref.logon_guid_raw}}"
  event_record_id:     gen.int(min=5000, max=99999)

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": "C:\\Windows\\System32\\svchost.exe"
            - "@Name": FileVersion
              "#text": "10.0.14393.0 (rs1_release.160715-1616)"
            - "@Name": Description
              "#text": "Host Process for Windows Services"
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": "Microsoft Corporation"
            - "@Name": OriginalFileName
              "#text": "svchost.exe"
            - "@Name": CommandLine
              "#text": "C:\\Windows\\System32\\svchost.exe -k smbsvcs"
            - "@Name": CurrentDirectory
              "#text": "C:\\Windows\\system32\\"
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": "0x3e7"
            - "@Name": TerminalSessionId
              "#text": "0"
            - "@Name": IntegrityLevel
              "#text": System
            - "@Name": Hashes
              "#text": "MD5=36F670D89040709013F6A460176767EC,SHA256=438B6CCD84F4DD32D9684ED7D58FD7D1E5A75FE3F3D12AB6C788E6BB0FFAD5E7,IMPHASH=2CED93915677390B76EE1916B92F3EF6"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": "C:\\Windows\\System32\\services.exe"
            - "@Name": ParentCommandLine
              "#text": "C:\\Windows\\system32\\services.exe"
