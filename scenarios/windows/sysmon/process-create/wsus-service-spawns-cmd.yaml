type: scenario
description: |
  The Windows Server Update Services (WSUS) service process starts a
  Windows command shell. Sysmon EID 1 (Process Create) records
  wsusservice.exe, installed under C:\Program Files\Update Services\Services,
  starting cmd.exe with a command line, for example
  `C:\Windows\system32\cmd.exe`, from the WSUS WebServices directory as
  NT AUTHORITY\SYSTEM at System integrity. The event records the shell
  launch from the update service, not the request that caused it or the
  commands the shell then runs.
tags: [eid1, cve-2025-59287]
mitre:
  tactics: [initial-access, execution]
  techniques: [T1190, T1059.003]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=9999999)
  guid_head:           gen.hex(len=8, case=upper)
  guid_tail:           gen.hex(len=4, case=upper)
  process_guid_mid1:   gen.hex(len=4, case=upper)
  process_guid_mid2:   gen.hex(len=4, case=upper)
  process_guid_seq:    gen.hex(len=4, case=upper)
  process_guid:        "{${ref.guid_head}-${ref.process_guid_mid1}-${ref.process_guid_mid2}-${ref.process_guid_seq}-00000000${ref.guid_tail}}"
  process_id:          gen.int(min=5000, max=19999)
  parent_guid_mid1:    gen.hex(len=4, case=upper)
  parent_guid_mid2:    gen.hex(len=4, case=upper)
  parent_guid_seq:     gen.hex(len=4, case=upper)
  parent_process_guid: "{${ref.guid_head}-${ref.parent_guid_mid1}-${ref.parent_guid_mid2}-${ref.parent_guid_seq}-00000000${ref.guid_tail}}"
  parent_process_id:   gen.int(min=1000, max=4999)
  logon_guid_mid1:     gen.hex(len=4, case=upper)
  logon_guid_mid2:     gen.hex(len=4, case=upper)
  logon_guid:          "{${ref.guid_head}-${ref.logon_guid_mid1}-${ref.logon_guid_mid2}-E703-000000000000}"
  command_line:        'C:\Windows\system32\cmd.exe'

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": 'C:\Windows\System32\cmd.exe'
            - "@Name": FileVersion
              "#text": "10.0.17763.1 (WinBuild.160101.0800)"
            - "@Name": Description
              "#text": Windows Command Processor
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": Cmd.Exe
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": 'C:\Program Files\Update Services\WebServices\'
            - "@Name": User
              "#text": 'NT AUTHORITY\SYSTEM'
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": "0x3e7"
            - "@Name": TerminalSessionId
              "#text": 0
            - "@Name": IntegrityLevel
              "#text": System
            - "@Name": Hashes
              "#text": "MD5=F4F684066175B77E0C3A000549D2922C,SHA256=935C1861DF1F4018D698E8B65ABFA02D7E9037D8F68CA3C2065B6CA165D44AD2,IMPHASH=3062ED732D4B25D1C64F084DAC97D37A"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": 'C:\Program Files\Update Services\Services\wsusservice.exe'
            - "@Name": ParentCommandLine
              "#text": '"C:\Program Files\Update Services\Services\wsusservice.exe"'
