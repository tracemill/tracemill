type: scenario
description: |
  SOAPHound, an Active Directory collection tool that queries a domain
  controller through Active Directory Web Services, is started with
  collection options. Sysmon EID 1 (Process Create) records SOAPHound.exe,
  with original file name SOAPHound.exe, run from the folder an operator
  copied it to and started from cmd.exe with a command line that names the
  domain account and password to authenticate with, the domain, the domain
  controller to query, and a collection mode, for example --buildcache,
  which SOAPHound documents as building a cache of directory objects, with
  --cachefilename naming the cache file, for example c:\temp\cach2.txt.
  Other command lines, for example --bhdump with --outputdirectory, select
  another collection mode. The event records the launch and its arguments,
  not the query results.
tags: [eid1, soaphound]
mitre:
  tactics: [discovery]
  techniques: [T1087.002, T1069.002, T1482]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  domain_fqdn_upper:   fn.upper(ref.domain_fqdn)
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=99999)
  user_name:           Administrator
  user_short_name:     ADMINI~1
  user:                "${ref.domain_short}\\${ref.user_name}"
  logon_guid_raw:      fn.upper(gen.uuid())
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=5, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  terminal_session_id: 2
  integrity_level:     High
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=5000, max=9999)
  parent_guid_raw:     fn.upper(gen.uuid())
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=4999)
  image:               'C:\AtomicRedTeam\atomics\T1059.001\src\SOAPHound.exe'
  domain_account:      "administrator@${ref.domain_fqdn}"
  domain_password:     gen.regex(pattern=[A-Z]@[a-z]{6}[0-9])
  dc_ip_octet:         gen.int(min=2, max=254)
  dc_address:          "10.0.1.${ref.dc_ip_octet}"
  collection_args:     '--buildcache --cachefilename c:\temp\cach2.txt'
  soaphound_args:      '--user ${ref.domain_account} --password ${ref.domain_password} --domain ${ref.domain_fqdn_upper} --dc ${ref.dc_address} ${ref.collection_args}'
  # cmd.exe /c passes the inner command on with a doubled space after the image.
  command_line:        '${ref.image}  ${ref.soaphound_args}'
  current_directory:   'C:\Users\${ref.user_short_name}\AppData\Local\Temp\2\'
  hashes:              "MD5=5B44F064C41A5AEF381D088CA1DA4EA9,SHA256=3F498F307754573E23555DC370ED7CA01B4485A1137C873B0012C1A6E8BC6228,IMPHASH=F34D5F2D4577ED6D9CEEC516C1F5A744"
  parent_image:        'C:\Windows\System32\cmd.exe'
  parent_command_line: '"cmd.exe" /c ${ref.image} ${ref.soaphound_args}'

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": FileVersion
              "#text": "1.0.0.0"
            - "@Name": Description
              "#text": SOAPHound
            - "@Name": Product
              "#text": SOAPHound
            - "@Name": Company
              "#text": "-"
            - "@Name": OriginalFileName
              "#text": SOAPHound.exe
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": ref.terminal_session_id
            - "@Name": IntegrityLevel
              "#text": ref.integrity_level
            - "@Name": Hashes
              "#text": ref.hashes
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": ref.parent_image
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
            - "@Name": ParentUser
              "#text": ref.user
