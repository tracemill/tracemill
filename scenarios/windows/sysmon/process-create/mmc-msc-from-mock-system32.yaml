type: scenario
description: |
  Microsoft Management Console opens a console file from a look-alike of a
  trusted Windows directory. Sysmon EID 1 (Process Create) records
  powershell.exe starting mmc.exe with a command line that names a console
  (.msc) file, for example WmiMgmt.msc, in a look-alike of C:\Windows\System32
  with a space after Windows, for example C:\Windows \System32\mock. The event
  records mmc.exe starting with that console file, not what the console file
  loads.
tags: [eid1]
mitre:
  tactics: [defense-evasion]
  techniques: [T1218.014, T1036.005]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  host_short:          gen.hostname(class=windows-workstation)
  host_short_lower:    fn.lower(ref.host_short)
  host_short_upper:    fn.upper(ref.host_short)
  computer:            "${ref.host_short_lower}.${ref.domain_fqdn}"
  user_name:           Administrator
  user:                "${ref.host_short_upper}\\${ref.user_name}"
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=999999)
  process_guid_raw:    gen.uuid()
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  parent_guid_raw:     gen.uuid()
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=9999)
  logon_guid_raw:      gen.uuid()
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=6, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  console_dir:         "C:\\Windows \\System32\\mock"
  console_name:        WmiMgmt.msc
  # The trailing space is part of the recorded command line.
  command_line:        '"C:\Windows\system32\mmc.exe" ${ref.console_dir}\${ref.console_name} '

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385f-c22a-43e0-bf4c-06f5698ffbd9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": "C:\\Windows\\System32\\mmc.exe"
            - "@Name": FileVersion
              "#text": "10.0.17763.6766 (WinBuild.160101.0800)"
            - "@Name": Description
              "#text": Microsoft Management Console
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": mmc.exe
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": "C:\\Users\\${ref.user_name}\\"
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": 2
            - "@Name": IntegrityLevel
              "#text": High
            - "@Name": Hashes
              "#text": "MD5=4740E5DF94DFAAACA8E556B236D38764,SHA256=02159C30DCDB34254E407C0870FF44FECFE3B9A22227EC2D14CCF38D7C1E989E,IMPHASH=B8EE2D6252332A68B70B22E3D6E377D2"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe"
            - "@Name": ParentCommandLine
              "#text": '"C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" '
            - "@Name": ParentUser
              "#text": ref.user
