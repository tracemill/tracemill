type: scenario
description: |
  A user starts an executable from the root of a non-system drive, for
  example a USB drive, through Explorer. Sysmon EID 1 (Process Create)
  records the program, for example E:\CefSub.exe with no version resource,
  running at Medium integrity with explorer.exe as its parent and the drive
  root as its working directory. The event records the launch, not what the
  program loaded.
tags: [eid1]
mitre:
  tactics: [execution]
  techniques: [T1204.002]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=9999999)
  user_name:           gen.username()
  user:                "${ref.domain_short}\\${ref.user_name}"
  logon_guid_raw:      fn.upper(gen.uuid())
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=6, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  parent_guid_raw:     fn.upper(gen.uuid())
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=9999)
  drive:               'E:'
  program:             CefSub.exe
  image:               "${ref.drive}\\${ref.program}"
  command_line:        '"${ref.image}" '
  current_directory:   "${ref.drive}\\"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": FileVersion
              "#text": "1,0,0,843"
            - "@Name": Description
              "#text": "-"
            - "@Name": Product
              "#text": "-"
            - "@Name": Company
              "#text": "-"
            - "@Name": OriginalFileName
              "#text": "-"
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": "1"
            - "@Name": IntegrityLevel
              "#text": "Medium"
            - "@Name": Hashes
              "#text": "MD5=ECFCF5AA6D8B07038CE9F5DA3F32AC23,SHA256=CB8A83B590893DAA9B02B8E1A1C9AFB68D6F2A82C9E0D2D2C63A36A510F6FDA3,IMPHASH=0C8ACABF5B3C8767726BAE981A422705"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": "C:\\Windows\\explorer.exe"
            - "@Name": ParentCommandLine
              "#text": "C:\\Windows\\Explorer.EXE"
            - "@Name": ParentUser
              "#text": ref.user
