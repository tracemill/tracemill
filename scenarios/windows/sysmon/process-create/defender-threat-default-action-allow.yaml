type: scenario
description: |
  Execution: PowerShell sets the Windows Defender default action for
  each threat severity to allow, through `Set-MpPreference`. Sysmon EID 1
  (Process Create) records the launch with the severity switches and the
  action number on the command line. Detection still runs, but on a host
  without tamper protection nothing it finds is quarantined or removed.
tags: [eid1]
mitre:
  tactics: [execution]
  techniques: [T1059.001]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  parent_guid_raw:     fn.upper(gen.uuid())
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=9999)
  logon_guid_raw:      fn.upper(gen.uuid())
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=7)
  logon_id:            "0x${ref.logon_id_hex}"
  event_record_id:     gen.int(min=5000, max=99999)
  username:            gen.username()
  user:                "${ref.domain_short}\\${ref.username}"
  image:               C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe
  file_version:        10.0.17763.1 (WinBuild.160101.0800)
  description:         Windows PowerShell
  product:             "Microsoft® Windows® Operating System"
  company:             Microsoft Corporation
  original_file_name:  PowerShell.EXE
  threat_action:        "6"
  preference_args:     "Set-MpPreference -HighThreatDefaultAction ${ref.threat_action} -ModerateThreatDefaultAction ${ref.threat_action} -LowThreatDefaultAction ${ref.threat_action} -SevereThreatDefaultAction ${ref.threat_action}"
  command_line:        '"powershell" -WindowStyle Hidden -Command "${ref.preference_args}"'
  current_directory:   "C:\\Users\\${ref.username}\\Downloads\\BottingCentral\\"
  integrity_level:     High
  hashes:              "MD5=83767E18DB29B51A804A9E312D0ED99C,SHA256=1EE3D7C80D075D64F97D04D036E558043F2F6BC959C87CD5B0A6D53B96B96A0F,IMPHASH=D1A922C94A1F407CB2BBCAD033C8ED7A"
  loader_dir:          "C:\\Users\\${ref.username}\\AppData\\Roaming\\Microsoft\\Windows\\UpdateManager"
  parent_image:        "${ref.loader_dir}\\docconv.exe"
  parent_command_line: '"${ref.parent_image}" --carrier'
  parent_user:         ref.user

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": FileVersion
              "#text": ref.file_version
            - "@Name": Description
              "#text": ref.description
            - "@Name": Product
              "#text": ref.product
            - "@Name": Company
              "#text": ref.company
            - "@Name": OriginalFileName
              "#text": ref.original_file_name
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": 2
            - "@Name": IntegrityLevel
              "#text": ref.integrity_level
            - "@Name": Hashes
              "#text": ref.hashes
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": ref.parent_image
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
            - "@Name": ParentUser
              "#text": ref.parent_user
