type: scenario
description: |
  The Visual Basic command-line compiler resolves a domain name. Sysmon EID 22
  (DnsQuery) records vbc.exe, for example the .NET Framework copy in
  C:\Windows\Microsoft.NET\Framework\v4.0.30319, querying a domain name, for
  example electrico.co.zw, with the query status and the address it resolved
  to. The event shows the lookup and its answer, not a connection to that
  address or anything the compiler built.
tags: [eid22]
mitre:
  tactics: [command-and-control]
  techniques: [T1071.004]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:         gen.int(min=1000, max=4000)
  sysmon_tid:         gen.int(min=1000, max=9999)
  event_record_id:    gen.int(min=5000, max=99999)
  process_pid:        gen.int(min=1000, max=9999)
  process_guid_raw:   gen.uuid()
  process_guid:       "{${ref.process_guid_raw}}"
  username:           gen.username()
  user:               "${ref.domain_short}\\${ref.username}"
  image:              "C:\\Windows\\Microsoft.NET\\Framework\\v4.0.30319\\vbc.exe"
  query_name:         "electrico.co.zw"
  query_status:       "0"
  query_results:      "176.32.230.3;"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385f-c22a-43e0-bf4c-06f5698ffbd9}"
          EventID: 22
          Version: 5
          Level: 4
          Task: 22
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_pid
            - "@Name": QueryName
              "#text": ref.query_name
            - "@Name": QueryStatus
              "#text": ref.query_status
            - "@Name": QueryResults
              "#text": ref.query_results
            - "@Name": Image
              "#text": ref.image
            - "@Name": User
              "#text": ref.user
