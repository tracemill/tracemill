type: scenario
description: |
  A Windows Script Host process resolves a public text-paste site. Sysmon
  EID 22 (DnsQuery) records a script host process, for example
  C:\Windows\System32\WScript.exe, querying a text-paste site, for example
  pastebin.com, and the addresses the lookup returned. The event shows the
  name lookup and its answer, not a connection to the site or what was
  fetched from it.
tags: [eid22, remcos]
mitre:
  tactics: [execution]
  techniques: [T1059.005]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:         gen.int(min=1000, max=4000)
  sysmon_tid:         gen.int(min=1000, max=9999)
  process_pid:        gen.int(min=1000, max=9999)
  process_guid_raw:   fn.upper(gen.uuid())
  process_guid:       "{${ref.process_guid_raw}}"
  event_record_id:    gen.int(min=5000, max=99999)
  image:              "C:\\Windows\\System32\\WScript.exe"
  query_name:         pastebin.com
  query_status:       "0"
  query_results:      "::ffff:104.23.98.190;::ffff:104.23.99.190;"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 22
          Version: 5
          Level: 4
          Task: 22
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_pid
            - "@Name": QueryName
              "#text": ref.query_name
            - "@Name": QueryStatus
              "#text": ref.query_status
            - "@Name": QueryResults
              "#text": ref.query_results
            - "@Name": Image
              "#text": ref.image
