type: scenario
description: |
  The Windows DLL host rundll32.exe resolves a domain name. Sysmon EID 22
  (DnsQuery) records C:\Windows\System32\rundll32.exe querying a domain, for
  example supplementik.top, a command-and-control domain of the IcedID
  loader, and the answer it received, for example a single IPv4 address. The
  event shows the lookup and its answer, not a connection to that address or
  a download.
tags: [eid22, icedid]
mitre:
  tactics: [defense-evasion]
  techniques: [T1218.011]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=99999)
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  query_name:          supplementik.top
  query_results:       "::ffff:54.197.173.238;"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 22
          Version: 5
          Level: 4
          Task: 22
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": QueryName
              "#text": ref.query_name
            - "@Name": QueryStatus
              "#text": "0"
            - "@Name": QueryResults
              "#text": ref.query_results
            - "@Name": Image
              "#text": "C:\\Windows\\System32\\rundll32.exe"
