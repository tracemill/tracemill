type: scenario
description: |
  Credential access: LSASS memory dump via rundll32.exe + comsvcs.dll,
  Sysmon EID 10 (ProcessAccess).  Living-off-the-land technique using only
  built-in Windows binaries (rundll32 comsvcs.dll, MiniDump).  CallTrace
  includes dbgcore.dll + comsvcs.dll to trigger the "Access LSASS Memory
  for Dump Creation" detection.
tags: [windows, sysmon]
mitre:
  tactics: [credential-access]
  techniques: [T1003.001]

state:
  computer:            gen.hostname(class=windows-workstation, domain=corp.local)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  source_guid_raw:     gen.uuid()
  source_process_guid: "{${ref.source_guid_raw}}"
  source_pid:          gen.int(min=1000, max=9999)
  source_tid:          gen.int(min=1000, max=9999)
  target_guid_raw:     gen.uuid()
  target_process_guid: "{${ref.target_guid_raw}}"
  target_pid:          gen.int(min=500, max=1200)
  event_record_id:     gen.int(min=5000, max=99999)
  source_image:        C:\Windows\System32\rundll32.exe
  granted_access:      "0x1fffff"
  # CallTrace from real rundll32+comsvcs.dll MiniDump attack: dbgcore.DLL
  # frames followed by comsvcs.dll and rundll32.exe frames.
  call_trace:          "C:\\Windows\\SYSTEM32\\ntdll.dll+a5a94|C:\\Windows\\SYSTEM32\\ntdll.dll+6cd1a|C:\\Windows\\System32\\KERNEL32.DLL+1cff8|C:\\Windows\\System32\\KERNEL32.DLL+25a87|C:\\Windows\\SYSTEM32\\dbgcore.DLL+15a38|C:\\Windows\\SYSTEM32\\dbgcore.DLL+e3f5|C:\\Windows\\SYSTEM32\\dbgcore.DLL+b027|C:\\Windows\\SYSTEM32\\dbgcore.DLL+5db1|C:\\Windows\\SYSTEM32\\dbgcore.DLL+67d3|C:\\windows\\System32\\comsvcs.dll+39d24|C:\\Windows\\System32\\rundll32.exe+3b0c|C:\\Windows\\System32\\rundll32.exe+6017|C:\\Windows\\System32\\KERNEL32.DLL+84d4|C:\\Windows\\SYSTEM32\\ntdll.dll+51791"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 10
          Version: 3
          Level: 4
          Task: 10
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": SourceProcessGUID
              "#text": ref.source_process_guid
            - "@Name": SourceProcessId
              "#text": ref.source_pid
            - "@Name": SourceThreadId
              "#text": ref.source_tid
            - "@Name": SourceImage
              "#text": ref.source_image
            - "@Name": TargetProcessGUID
              "#text": ref.target_process_guid
            - "@Name": TargetProcessId
              "#text": ref.target_pid
            - "@Name": TargetImage
              "#text": C:\Windows\system32\lsass.exe
            - "@Name": GrantedAccess
              "#text": ref.granted_access
            - "@Name": CallTrace
              "#text": ref.call_trace
