type: scenario
description: |
  Defense evasion: Sysmon EID 13 (RegistryEvent value-set) records a
  Windows Firewall rule being written under the SharedAccess FirewallRules
  registry key. The rule allows inbound TCP traffic on a local port, which
  can expose remote-access services or other listening services for lateral
  movement.
tags: [eid13]
mitre:
  tactics: [lateral-movement]
  techniques: [T1021.001]

state:
  computer:         gen.hostname(class=windows-workstation, domain=corp.local)
  sysmon_pid:       gen.int(min=1000, max=4000)
  sysmon_tid:       gen.int(min=1000, max=9999)
  process_pid:      gen.int(min=1000, max=9999)
  process_guid_raw: gen.uuid()
  process_guid:     "{${ref.process_guid_raw}}"
  image:            "C:\\Windows\\System32\\svchost.exe"
  rule_guid_raw:    gen.uuid()
  rule_guid:        "{${ref.rule_guid_raw}}"
  target_object:    "HKLM\\System\\CurrentControlSet\\Services\\SharedAccess\\Parameters\\FirewallPolicy\\FirewallRules\\${ref.rule_guid}"
  local_port:       gen.int(min=1024, max=65535)
  rule_name:        RDPPORT
  details:          "v2.26|Action=Allow|Active=TRUE|Dir=In|Protocol=6|Profile=Public|LPort=${ref.local_port}|Name=${ref.rule_name}|"
  event_record_id:  gen.int(min=5000, max=99999)

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 13
          Version: 2
          Level: 4
          Task: 13
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": EventType
              "#text": SetValue
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_pid
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetObject
              "#text": ref.target_object
            - "@Name": Details
              "#text": ref.details
