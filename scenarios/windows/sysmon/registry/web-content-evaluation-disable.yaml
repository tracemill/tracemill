type: scenario
description: |
  SmartScreen checking of Microsoft Store app web content turned off for a
  user: Sysmon EID 13 (RegistryEvent value-set) records reg.exe setting the
  EnableWebContentEvaluation DWORD to 0 under the user's
  HKU\<SID>\SOFTWARE\Microsoft\Windows\CurrentVersion\AppHost key. With this
  value at 0, SmartScreen stops checking the URLs that Microsoft Store apps
  load for that user, so a malicious or phishing page opened inside a Store
  app is no longer flagged. SmartScreen checks of downloaded files and in
  the browser are not changed.
tags: [eid13]
mitre:
  tactics: [defense-impairment]
  techniques: [T1685]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:         gen.int(min=1000, max=4000)
  sysmon_tid:         gen.int(min=1000, max=9999)
  process_pid:        gen.int(min=1000, max=9999)
  process_guid_raw:   gen.uuid()
  process_guid:       "{${ref.process_guid_raw}}"
  event_record_id:    gen.int(min=5000, max=99999)
  image:              "C:\\Windows\\system32\\reg.exe"
  user_rid:           gen.int(min=1100, max=9999)
  user_sid:           "S-1-5-21-111222333-444555666-777888999-${ref.user_rid}"
  target_object:      "HKU\\${ref.user_sid}\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\AppHost\\EnableWebContentEvaluation"
  details:            "DWORD (0x00000000)"
  user:               gen.username()
  user_qualified:     "${ref.domain_short}\\${ref.user}"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 13
          Version: 2
          Level: 4
          Task: 13
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": EventType
              "#text": SetValue
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_pid
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetObject
              "#text": ref.target_object
            - "@Name": Details
              "#text": ref.details
            - "@Name": User
              "#text": ref.user_qualified
