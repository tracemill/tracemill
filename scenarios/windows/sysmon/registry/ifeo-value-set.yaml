type: scenario
description: |
  Image File Execution Options abuse: Sysmon EID 13 (RegistryEvent value-set)
  as reg.exe writes a value under
  HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\<target>.
  Two variants share this shape. Debugger hijack (the default): a Debugger
  value makes Windows launch the payload in place of the target binary every
  time the target starts. GlobalFlag silent-process-exit monitoring: GlobalFlag
  = 0x200 (FLG_MONITOR_SILENT_PROCESS_EXIT) makes Windows run a configured
  monitor process whenever the target exits. Either way the attacker gains
  execution tied to a legitimate binary -- a persistence and
  privilege-escalation path. Bind target_binary, value_name and details to
  select the variant.
  https://attack.mitre.org/techniques/T1546/012/
tags: [eid13]
mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1546.012]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:         gen.int(min=1000, max=4000)
  sysmon_tid:         gen.int(min=1000, max=9999)
  process_pid:        gen.int(min=1000, max=9999)
  process_guid_raw:   gen.uuid()
  process_guid:       "{${ref.process_guid_raw}}"
  event_record_id:    gen.int(min=5000, max=99999)
  image:              "C:\\Windows\\system32\\reg.exe"
  target_binary:      "C:\\Windows\\System32\\calc.exe"
  value_name:         Debugger
  details:            "C:\\Windows\\System32\\cmd.exe"
  target_object:      "HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Image File Execution Options\\${ref.target_binary}\\${ref.value_name}"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 13
          Version: 2
          Level: 4
          Task: 13
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": EventType
              "#text": SetValue
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_pid
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetObject
              "#text": ref.target_object
            - "@Name": Details
              "#text": ref.details
