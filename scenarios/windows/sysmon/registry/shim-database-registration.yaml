type: scenario
description: |
  Application shim database registration: two Sysmon EID 13 (RegistryEvent
  value-set) writes under
  HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags -- a
  per-executable entry under Custom, then an entry under InstalledSDB. Once
  registered, the shim is applied every time the targeted executable
  launches, which adversaries abuse for persistence and privilege
  escalation (T1546.011). When sdbinst.exe installs a custom shim
  database, Custom\<exe>\{GUID}.sdb receives the install timestamp and
  InstalledSDB\{GUID}\DatabasePath points at the database file under
  C:\Windows\AppPatch\Custom. A script host such as PowerShell can write
  the same registration directly, bypassing the database installer.
tags: [eid13]
mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1546.011]

state:
  domain_short:            CORP
  domain_tld:              local
  domain_short_lower:      fn.lower(ref.domain_short)
  domain_fqdn:             "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:                gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:              gen.int(min=1000, max=4000)
  sysmon_tid:              gen.int(min=1000, max=9999)
  process_pid:             gen.int(min=1000, max=9999)
  process_guid_raw:        gen.uuid()
  process_guid:            "{${ref.process_guid_raw}}"
  image:                   "C:\\Windows\\system32\\sdbinst.exe"
  target_exe:              setup.exe
  sdb_guid_raw:            gen.uuid()
  sdb_guid:                "{${ref.sdb_guid_raw}}"
  install_ts_hi:           gen.hex(len=4, case=lower)
  install_ts_lo:           gen.hex(len=8, case=lower)
  custom_target_object:    "HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\AppCompatFlags\\Custom\\${ref.target_exe}\\${ref.sdb_guid}.sdb"
  custom_details:          "QWORD (0x01dc${ref.install_ts_hi}-0x${ref.install_ts_lo})"
  installed_target_object: "HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\AppCompatFlags\\InstalledSDB\\${ref.sdb_guid}\\DatabasePath"
  installed_details:       "C:\\Windows\\AppPatch\\Custom\\${ref.sdb_guid}.sdb"
  custom_record_id:        gen.int(min=5000, max=99999)
  installed_record_id:     gen.int(min=5000, max=99999)

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 13
          Version: 2
          Level: 4
          Task: 13
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.custom_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": EventType
              "#text": SetValue
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_pid
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetObject
              "#text": ref.custom_target_object
            - "@Name": Details
              "#text": ref.custom_details
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 13
          Version: 2
          Level: 4
          Task: 13
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.installed_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": EventType
              "#text": SetValue
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_pid
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetObject
              "#text": ref.installed_target_object
            - "@Name": Details
              "#text": ref.installed_details
