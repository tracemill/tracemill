type: scenario
description: |
  Existing service repointed at a shell: Sysmon EID 13 (RegistryEvent
  value-set) records reg.exe overwriting the ImagePath value of a service
  under HKLM\System\CurrentControlSet\Services so that it names cmd.exe
  instead of the binary the service was installed with. The Service Control
  Manager launches whatever ImagePath names, as SYSTEM and at the start
  type the service already has, so the substitution turns an existing
  service entry into a way to run code without installing anything new.
tags: [eid13]
mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1574.011]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:         gen.int(min=1000, max=9999)
  sysmon_tid:         gen.int(min=1000, max=9999)
  process_pid:        gen.int(min=1000, max=9999)
  process_guid_raw:   fn.upper(gen.uuid())
  process_guid:       "{${ref.process_guid_raw}}"
  event_record_id:    gen.int(min=16000, max=16999)
  image:              "C:\\Windows\\system32\\reg.exe"
  service_name:       "calcservice"
  target_object:      "HKLM\\System\\CurrentControlSet\\Services\\${ref.service_name}\\ImagePath"
  details:            "%%windir%%\\system32\\cmd.exe"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 13
          Version: 2
          Level: 4
          Task: 13
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "T1031,T1050"
            - "@Name": EventType
              "#text": SetValue
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_pid
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetObject
              "#text": ref.target_object
            - "@Name": Details
              "#text": ref.details
