type: scenario
description: |
  ValleyRAT storing its configuration in the registry (T1112): two Sysmon
  EID 13 (RegistryEvent value-set) events record valleyrat.exe writing
  values under the user's HKU\<SID>\Console key. SelfPath receives the
  full path of the running malware binary, and IpDateInfo, a binary value,
  holds the address and port of its command-and-control server.
tags: [eid13, valleyrat]
mitre:
  tactics: [defense-evasion]
  techniques: [T1112]

state:
  domain_short:         CORP
  domain_tld:           local
  domain_short_lower:   fn.lower(ref.domain_short)
  domain_fqdn:          "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:             gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  user:                 Administrator
  user_qualified:       "${ref.domain_short}\\${ref.user}"
  user_sid:             "S-1-5-21-111222333-444555666-777888999-500"
  sysmon_pid:           gen.int(min=1000, max=4000)
  sysmon_tid:           gen.int(min=1000, max=9999)
  process_pid:          gen.int(min=1000, max=9999)
  process_guid_raw:     gen.uuid()
  process_guid:         "{${ref.process_guid_raw}}"
  selfpath_record_id:   gen.int(min=5000, max=99999)
  ipdateinfo_record_id: gen.int(min=5000, max=99999)
  image:                "C:\\Temp\\valleyrat.exe"
  console_key:          "HKU\\${ref.user_sid}\\Console"
  ipdateinfo_details:   Binary Data

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385f-c22a-43e0-bf4c-06f5698ffbd9}"
          EventID: 13
          Version: 2
          Level: 4
          Task: 13
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.selfpath_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": EventType
              "#text": SetValue
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_pid
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetObject
              "#text": "${ref.console_key}\\SelfPath"
            - "@Name": Details
              "#text": ref.image
            - "@Name": User
              "#text": ref.user_qualified

  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385f-c22a-43e0-bf4c-06f5698ffbd9}"
          EventID: 13
          Version: 2
          Level: 4
          Task: 13
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.ipdateinfo_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": EventType
              "#text": SetValue
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_pid
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetObject
              "#text": "${ref.console_key}\\IpDateInfo"
            - "@Name": Details
              "#text": ref.ipdateinfo_details
            - "@Name": User
              "#text": ref.user_qualified
