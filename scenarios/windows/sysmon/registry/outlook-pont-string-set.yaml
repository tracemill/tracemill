type: scenario
description: |
  Outlook dialog suppression: a process launches (Sysmon EID 1, Process
  Create) and then writes the PONT_STRING value under the current user's
  HKU\<SID>\SOFTWARE\Microsoft\Office\16.0\Outlook\Options\General key
  (Sysmon EID 13, RegistryEvent value-set). PONT_STRING lists the Outlook
  dialogs the user has dismissed, so populating it silences the prompts
  Outlook would otherwise show while a malicious VBA project runs. The
  NotDoor backdoor loader, a renamed OneDrive.exe in C:\ProgramData that
  side-loads a malicious SSPICLI.dll, makes this change when it installs
  its Outlook macro.
tags: [eid1, eid13, notdoor]
mitre:
  tactics: [defense-evasion, defense-impairment]
  techniques: [T1112, T1685]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  username:            gen.username()
  user:                "${ref.domain_short}\\${ref.username}"
  user_rid:            gen.int(min=1001, max=1999)
  user_sid:            "S-1-5-21-111222333-444555666-777888999-${ref.user_rid}"
  logon_guid_raw:      gen.uuid()
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=6)
  logon_id:            "0x${ref.logon_id_hex}"
  process_guid_raw:    gen.uuid()
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  parent_guid_raw:     gen.uuid()
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=9999)
  process_record_id:   gen.int(min=5000, max=9999999)
  registry_record_id:  gen.int(min=5000, max=9999999)
  image:               "C:\\ProgramData\\Onedrive.exe"
  command_line:        "Onedrive.exe"
  current_directory:   "c:\\ProgramData\\"
  file_version:        "25.031.0217.0003"
  file_description:    "Microsoft OneDrive"
  product:             "Microsoft OneDrive"
  original_file_name:  "OneDrive.exe"
  integrity_level:     High
  hashes:              "MD5=B8C558EC430EC9693CCBAE4C5BC5815B,SHA256=FCB6DC17F96AF2568D7FA97A6087E4539285141206185AEC5C85FA9CF73C9193,IMPHASH=B573D180C7D6F492B722BBAF15AA0B48"
  parent_image:        "C:\\Windows\\System32\\cmd.exe"
  parent_command_line: "\"C:\\Windows\\system32\\cmd.exe\""
  target_object:       "HKU\\${ref.user_sid}\\SOFTWARE\\Microsoft\\Office\\16.0\\Outlook\\Options\\General\\PONT_STRING"
  details:             "32,"
  time_gap:            "5s" # both events must land in the same one-minute dispatch window

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.process_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": FileVersion
              "#text": ref.file_version
            - "@Name": Description
              "#text": ref.file_description
            - "@Name": Product
              "#text": ref.product
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": ref.original_file_name
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": 2
            - "@Name": IntegrityLevel
              "#text": ref.integrity_level
            - "@Name": Hashes
              "#text": ref.hashes
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": ref.parent_image
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
            - "@Name": ParentUser
              "#text": ref.user

  - wait:
      duration: ref.time_gap

  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 13
          Version: 2
          Level: 4
          Task: 13
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.registry_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": EventType
              "#text": SetValue
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetObject
              "#text": ref.target_object
            - "@Name": Details
              "#text": ref.details
            - "@Name": User
              "#text": ref.user
