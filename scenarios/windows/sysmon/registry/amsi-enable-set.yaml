type: scenario
description: |
  Defense evasion: a script host sets the per-user AmsiEnable value under
  HKU\<SID>\SOFTWARE\Microsoft\Windows Script\Settings to 0, turning off the
  Antimalware Scan Interface for Windows Script Host so later VBScript and
  JScript run unscanned. Sysmon EID 13 (Registry value set). `amsi_enable` is
  a state parameter so a job can drive the restore to 1.
tags: [eid13]
mitre:
  tactics: [defense-evasion]
  techniques: [T1562.001]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:         gen.int(min=1000, max=4000)
  sysmon_tid:         gen.int(min=1000, max=9999)
  process_pid:        gen.int(min=400, max=9999)
  process_guid_raw:   gen.uuid()
  process_guid:       "{${ref.process_guid_raw}}"
  event_record_id:    gen.int(min=5000, max=99999)
  user_rid:           gen.int(min=1100, max=9999)
  user_sid:           "S-1-5-21-111222333-444555666-777888999-${ref.user_rid}"
  image:              "C:\\Windows\\System32\\WScript.exe"
  target_object:      "HKU\\${ref.user_sid}\\SOFTWARE\\Microsoft\\Windows Script\\Settings\\AmsiEnable"
  amsi_enable:        "0x00000000"
  details:            "DWORD (${ref.amsi_enable})"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 13
          Version: 2
          Level: 4
          Task: 13
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": EventType
              "#text": SetValue
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_pid
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetObject
              "#text": ref.target_object
            - "@Name": Details
              "#text": ref.details
