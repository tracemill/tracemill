type: scenario
description: |
  COM server registration abused for proxy execution: regsvr32.exe registers
  a DLL dropped in the user's temp directory as the in-process server of the
  DynamicWrapperX COM class, CLSID {89565275-A714-4a43-912E-978B935EDCCC}.
  Sysmon EID 13 (RegistryEvent value-set) records the write to the class's
  InProcServer32 default value under the per-user Classes hive. Script-based
  loaders such as Remcos droppers register this class so their scripts can
  call native Windows APIs; any COM activation of the CLSID then loads the
  attacker-controlled DLL.
tags: [eid13, remcos, dynwrapx]
mitre:
  tactics: [defense-evasion]
  techniques: [T1218.010, T1112]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:         gen.int(min=1000, max=4000)
  sysmon_tid:         gen.int(min=1000, max=9999)
  process_pid:        gen.int(min=1000, max=9999)
  process_guid_raw:   gen.uuid()
  process_guid:       "{${ref.process_guid_raw}}"
  event_record_id:    gen.int(min=5000, max=99999)
  image:              "C:\\Windows\\SysWOW64\\regsvr32.exe"
  domain_sid:         "S-1-5-21-3946589728-3102711660-3528854901"
  user_rid:           "500"
  user_sid:           "${ref.domain_sid}-${ref.user_rid}"
  clsid:              "{89565275-A714-4a43-912E-978B935EDCCC}"
  target_object:      "HKU\\${ref.user_sid}_Classes\\Wow6432Node\\CLSID\\${ref.clsid}\\InProcServer32\\(Default)"
  details:            "C:\\Users\\ADMINI~1\\AppData\\Local\\Temp\\2\\dynwrapx.dll"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 13
          Version: 2
          Level: 4
          Task: 13
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": EventType
              "#text": SetValue
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_pid
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetObject
              "#text": ref.target_object
            - "@Name": Details
              "#text": ref.details
