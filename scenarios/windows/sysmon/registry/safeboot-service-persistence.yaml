type: scenario
description: |
  Safe Mode service persistence: Sysmon EID 13 (RegistryEvent value-set)
  as reg.exe writes the default value of a new subkey under
  HKLM\System\CurrentControlSet\Control\SafeBoot\Minimal with the data
  "Service". Windows starts every service registered this way when it
  boots into Safe Mode, where most security products do not load, so the
  attacker's service keeps running after a forced Safe Mode reboot. The
  Snatch ransomware registers its SuperBackupMan service this way before
  rebooting to encrypt files. Registering under SafeBoot\Network instead
  also starts the service in Safe Mode with Networking.
tags: [eid13, snatch]
mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1547.001]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:         gen.int(min=1000, max=4000)
  sysmon_tid:         gen.int(min=1000, max=9999)
  process_pid:        gen.int(min=1000, max=9999)
  process_guid_raw:   gen.uuid()
  process_guid:       "{${ref.process_guid_raw}}"
  event_record_id:    gen.int(min=5000, max=99999)
  image:              "C:\\Windows\\system32\\reg.exe"
  safeboot_mode:      Minimal
  service_name:       SuperBackupMan
  target_object:      "HKLM\\System\\CurrentControlSet\\Control\\SafeBoot\\${ref.safeboot_mode}\\${ref.service_name}\\(Default)"
  details:            Service

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 13
          Version: 2
          Level: 4
          Task: 13
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": EventType
              "#text": SetValue
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_pid
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetObject
              "#text": ref.target_object
            - "@Name": Details
              "#text": ref.details
