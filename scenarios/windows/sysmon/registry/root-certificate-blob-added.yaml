type: scenario
description: |
  Certificate added to the machine root store: Sysmon EID 13 (RegistryEvent
  value-set) records certutil.exe writing the Blob value for a new
  certificate under
  SOFTWARE\Microsoft\SystemCertificates\ROOT\Certificates. Anything the
  machine root store holds is trusted for the whole host, so a certificate
  placed there makes code and connections signed with it look legitimate to
  Windows and to the tools that defer to it.
tags: [eid13]
mitre:
  tactics: [defense-evasion]
  techniques: [T1553.004]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:         gen.int(min=1000, max=4000)
  sysmon_tid:         gen.int(min=1000, max=9999)
  process_pid:        gen.int(min=1000, max=9999)
  process_guid_raw:   fn.upper(gen.uuid())
  process_guid:       "{${ref.process_guid_raw}}"
  event_record_id:    gen.int(min=716000, max=716999)
  username:           gen.username()
  user_qualified:     "${ref.domain_short}\\${ref.username}"
  image:              "C:\\Windows\\system32\\certutil.exe"
  cert_thumbprint:    "0022882F61DA349DE9FE5CD1C9EBA96AD7BDF266"
  target_object:      "HKLM\\SOFTWARE\\Microsoft\\SystemCertificates\\ROOT\\Certificates\\${ref.cert_thumbprint}\\Blob"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 13
          Version: 2
          Level: 4
          Task: 13
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": EventType
              "#text": SetValue
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_pid
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetObject
              "#text": ref.target_object
            - "@Name": Details
              "#text": "Binary Data"
            - "@Name": User
              "#text": ref.user_qualified
