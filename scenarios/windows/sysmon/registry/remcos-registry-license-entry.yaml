type: scenario
description: |
  Remcos RAT client installation: on first run the agent creates its
  per-user configuration key HKCU\SOFTWARE\Remcos-<mutex ID> and writes its
  licence value there. Sysmon EID 13 (RegistryEvent value-set) records the
  write, attributed to the Remcos binary running from the user's roaming
  AppData folder. The key persists for the life of the infection and is a
  host-level indicator of a Remcos agent.
tags: [eid13, remcos]
mitre:
  tactics: [defense-evasion]
  techniques: [T1112]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:         gen.int(min=1000, max=4000)
  sysmon_tid:         gen.int(min=1000, max=9999)
  process_pid:        gen.int(min=1000, max=9999)
  process_guid_raw:   gen.uuid()
  process_guid:       "{${ref.process_guid_raw}}"
  event_record_id:    gen.int(min=5000, max=99999)
  user_name:          Administrator
  image:              "C:\\Users\\${ref.user_name}\\AppData\\Roaming\\remcos\\remcos.exe"
  domain_sid:         "S-1-5-21-3946589728-3102711660-3528854901"
  user_rid:           "500"
  user_sid:           "${ref.domain_sid}-${ref.user_rid}"
  remcos_mutex:       "831TYD"
  target_object:      "HKU\\${ref.user_sid}\\SOFTWARE\\Remcos-${ref.remcos_mutex}\\licence"
  details:            "(Empty)"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 13
          Version: 2
          Level: 4
          Task: 13
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": EventType
              "#text": SetValue
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_pid
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetObject
              "#text": ref.target_object
            - "@Name": Details
              "#text": ref.details
