type: scenario
description: |
  njRAT keylogger buffer stored in the registry (T1027.011, T1056.001):
  Sysmon EID 13 (RegistryEvent value-set) records server.com, running from
  the user's temp directory, writing its keylog buffer to the [kl] value
  under a 32-hex-character key in the user's HKU\<SID>\SOFTWARE hive. The
  multi-line value data holds the captured keystrokes, with [ENTER],
  [Back] and [TAP] markers for special keys, and the title of each window
  the user typed into, so the log is kept in the user's registry hive
  instead of a file on disk.
tags: [eid13, njrat]
mitre:
  tactics: [defense-evasion, collection]
  techniques: [T1027.011, T1056.001]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  user:               Administrator
  user_qualified:     "${ref.domain_short}\\${ref.user}"
  user_sid:           "S-1-5-21-2846193751-1938204417-3307561942-500"
  sysmon_pid:         gen.int(min=1000, max=4000)
  sysmon_tid:         gen.int(min=1000, max=9999)
  process_pid:        gen.int(min=1000, max=9999)
  process_guid_raw:   gen.uuid()
  process_guid:       "{${ref.process_guid_raw}}"
  event_record_id:    gen.int(min=5000, max=99999)
  image:              "C:\\Users\\Administrator\\AppData\\Local\\Temp\\server.com"
  njrat_key:          0ff91641118b8ba71feb1aa87725fe56
  target_object:      "HKU\\${ref.user_sid}\\SOFTWARE\\${ref.njrat_key}\\[kl]"
  details:            "%%temp%%[ENTER]\r\n\
                      r%%[Back][Back][Back]e\r\n\
                      \\x0123/09/12 notepad++ *C:\\Program Files\\ansible\\SwiftOnSecurity.xml - Notepad++ [Administrator]\\x01\r\n\
                      [ENTER]\r\n\
                      [Back][Back][Back]com\r\n\
                      \\x0123/09/12 cmd Administrator: C:\\Windows\\system32\\cmd.exe\\x01\r\n\
                      Sysmon64[TAP]\r\n\
                      \ -c \r\n\
                      \\x0123/09/12 cmd Administrator: C:\\Windows\\system32\\cmd.exe - Sysmon64.exe  -c \"C:\\Program Files\\ansible\\SwiftOnSecurity.xml\"\\x01\r\n\
                      [ENTER]\r\n\
                      rregedit[ENTER]\r\n\
                      \r\n\
                      \\x0123/09/14 notepad++ *C:\\Program Files\\ansible\\SwiftOnSecurity.xml - Notepad++ [Administrator]\\x01\r\n\
                      [Back][\r\n\
                      \\x0123/09/14 cmd Administrator: C:\\Windows\\system32\\cmd.exe\\x01\r\n\
                      Sysmon6[TAP]\r\n\
                      \ -c \r\n\
                      \\x0123/09/14 cmd Administrator: C:\\Windows\\system32\\cmd.exe - Sysmon64.exe  -c \"C:\\Program Files\\ansible\\SwiftOnSecurity.xml\"\\x01\r\n\
                      [ENTER]\r\n\
                      \r\n\
                      \\x0123/09/14 notepad++ *C:\\Program Files\\ansible\\SwiftOnSecurity.xml - Notepad++ [Administrator]\\x01\r\n\
                      [Back]4d 5a 90 00s\r\n\
                      \\x0123/09/14 cmd Administrator: C:\\Windows\\system32\\cmd.exe - Sysmon64.exe  -c \"C:\\Program Files\\ansible\\SwiftOnSecurity.xml\"\\x01\r\n\
                      [ENTER]\r\n"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 13
          Version: 2
          Level: 4
          Task: 13
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": EventType
              "#text": SetValue
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_pid
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetObject
              "#text": ref.target_object
            - "@Name": Details
              "#text": ref.details
            - "@Name": User
              "#text": ref.user_qualified
