type: scenario
description: |
  Snake encrypted registry blob stored under the .wav file association:
  Sysmon EID 13 (RegistryEvent value-set) records the Snake installer,
  jpsetup.exe, writing a binary value with a non-standard name under
  HKLM\SOFTWARE\Classes\.wav\OpenWithProgIds, which Sysmon reports as
  HKCR\.wav\OpenWithProgIds. The value holds the encrypted AES key, IV and
  file path that Snake's WerFault.exe later reads to decrypt and load its
  kernel driver; Sysmon records its data as Binary Data.
tags: [eid13, snake]
mitre:
  tactics: [defense-evasion]
  techniques: [T1112]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:         gen.int(min=1000, max=4000)
  sysmon_tid:         gen.int(min=1000, max=9999)
  process_pid:        gen.int(min=1000, max=9999)
  process_guid_raw:   gen.uuid()
  process_guid:       "{${ref.process_guid_raw}}"
  user:               gen.username()
  user_qualified:     "${ref.domain_short}\\${ref.user}"
  image:              "C:\\Users\\${ref.user}\\AppData\\Local\\Temp\\jpsetup.exe"
  value_name_raw:     gen.uuid()
  value_name:         "{${ref.value_name_raw}}"
  target_object:      "HKCR\\.wav\\OpenWithProgIds\\${ref.value_name}"
  details:            Binary Data
  event_record_id:    gen.int(min=5000, max=999999)

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 13
          Version: 2
          Level: 4
          Task: 13
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": EventType
              "#text": SetValue
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_pid
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetObject
              "#text": ref.target_object
            - "@Name": Details
              "#text": ref.details
            - "@Name": User
              "#text": ref.user_qualified
