type: scenario
description: |
  Scheduled task security descriptor removed: Sysmon EID 12 (RegistryEvent
  value-delete) records reg.exe running as SYSTEM deleting the SD value of
  a task under
  SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree.
  That value holds the task's security descriptor, and without it the task
  stops being listed by the Task Scheduler interface and by the tools that
  enumerate tasks through it, while the task itself stays registered and
  continues to run.
tags: [eid12]
mitre:
  tactics: [defense-evasion, persistence]
  techniques: [T1053.005, T1685]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:         gen.int(min=1000, max=4000)
  sysmon_tid:         gen.int(min=1000, max=9999)
  process_pid:        gen.int(min=1000, max=9999)
  process_guid_raw:   fn.upper(gen.uuid())
  process_guid:       "{${ref.process_guid_raw}}"
  event_record_id:    gen.int(min=1202100, max=1202199)
  user_qualified:     "NT AUTHORITY\\SYSTEM"
  image:              "C:\\Windows\\System32\\reg.exe"
  task_name:          "AtomicTask"
  taskcache_tree:     "HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Schedule\\TaskCache\\Tree"
  target_object:      "${ref.taskcache_tree}\\${ref.task_name}\\SD"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 12
          Version: 2
          Level: 4
          Task: 12
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": EventType
              "#text": DeleteValue
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_pid
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetObject
              "#text": ref.target_object
            - "@Name": User
              "#text": ref.user_qualified
