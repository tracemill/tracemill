type: scenario
description: |
  Removable drive registered as a portable device: Sysmon EID 13
  (RegistryEvent value-set) records the user-mode driver host writing the
  FriendlyName value for a USB mass-storage device under
  SOFTWARE\Microsoft\Windows Portable Devices\Devices. Windows writes this
  when a removable drive is attached, and the key name carries the device
  vendor, product and serial, so the entry is a durable record on the host
  that this particular drive was connected and the drive letter it was
  given.
tags: [eid13]
mitre:
  tactics: [collection, initial-access]
  techniques: [T1200, T1025, T1091]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:         gen.int(min=1000, max=4000)
  sysmon_tid:         gen.int(min=1000, max=9999)
  process_pid:        gen.int(min=1000, max=9999)
  process_guid_raw:   fn.upper(gen.uuid())
  process_guid:       "{${ref.process_guid_raw}}"
  event_record_id:    gen.int(min=2587700, max=2587799)
  user_qualified:     "NT AUTHORITY\\LOCAL SERVICE"
  image:              "C:\\Windows\\System32\\WUDFHost.exe"
  device_vendor:      "BUFFALO"
  device_product:     "ClipDrive"
  device_revision:    "1.88"
  device_serial:      "230760A43F02327B"
  target_object:      "HKLM\\SOFTWARE\\Microsoft\\Windows Portable Devices\\Devices\\SWD#WPDBUSENUM#_??_USBSTOR#DISK&VEN_${ref.device_vendor}&PROD_CLIPDRIVE&REV_${ref.device_revision}#${ref.device_serial}&0#{53F56307-B6BF-11D0-94F2-00A0C91EFB8B}\\FriendlyName"
  details:            "D:\\"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385f-c22a-43e0-bf4c-06f5698ffbd9}"
          EventID: 13
          Version: 2
          Level: 4
          Task: 13
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "Context,DeviceConnectedOrUpdated"
            - "@Name": EventType
              "#text": SetValue
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_pid
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetObject
              "#text": ref.target_object
            - "@Name": Details
              "#text": ref.details
            - "@Name": User
              "#text": ref.user_qualified
