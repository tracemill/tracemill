type: scenario
description: |
  Outbound firewall block rule for a security agent: Sysmon EID 13
  (RegistryEvent value-set) records the Windows Firewall service, running in
  svchost.exe, writing a new rule under the SharedAccess FirewallRules
  registry key. The rule blocks all outbound traffic from an EDR or
  antivirus executable, such as the Microsoft Defender engine MsMpEng.exe,
  so that process keeps running on the host but its outbound connections,
  including those to its vendor's cloud service, are dropped.
tags: [eid13]
mitre:
  tactics: [defense-impairment]
  techniques: [T1685]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:         gen.int(min=1000, max=4000)
  sysmon_tid:         gen.int(min=1000, max=9999)
  process_pid:        gen.int(min=1000, max=9999)
  process_guid_raw:   gen.uuid()
  process_guid:       "{${ref.process_guid_raw}}"
  event_record_id:    gen.int(min=5000, max=999999)
  image:              "C:\\Windows\\system32\\svchost.exe"
  rule_guid_raw:      gen.uuid()
  rule_guid:          "{${ref.rule_guid_raw}}"
  target_object:      "HKLM\\System\\CurrentControlSet\\Services\\SharedAccess\\Parameters\\FirewallPolicy\\FirewallRules\\${ref.rule_guid}"
  edr_app:            "C:\\ProgramData\\Microsoft\\Windows Defender\\Platform\\4.18.24090.11-0\\MsMpEng.exe"
  rule_name:          gen.regex(pattern=[A-Za-z0-9]{12})
  details:            "v2.30|Action=Block|Active=TRUE|Dir=Out|App=${ref.edr_app}|Name=${ref.rule_name}|"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 13
          Version: 2
          Level: 4
          Task: 13
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": EventType
              "#text": SetValue
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_pid
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetObject
              "#text": ref.target_object
            - "@Name": Details
              "#text": ref.details
            - "@Name": User
              "#text": "NT AUTHORITY\\LOCAL SERVICE"
