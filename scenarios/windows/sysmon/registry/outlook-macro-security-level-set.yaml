type: scenario
description: |
  Outlook macro security lowered through the registry (T1137, T1112):
  Sysmon EID 13 (RegistryEvent value-set) records a process, for example
  c:\ProgramData\Onedrive.exe, setting the Level DWORD under a user's
  HKU\<SID>\SOFTWARE\Microsoft\Office\16.0\Outlook\Security key to 1.
  Level 1 is the Outlook "Enable all macros" setting, so VBA macros in that
  user's Outlook run without a security prompt unless a Group Policy
  setting for the Outlook macro security level overrides it. The NotDoor
  backdoor loader, a copy of the signed OneDrive.exe in C:\ProgramData that
  side-loads a malicious SSPICLI.dll, makes this change when it installs
  its Outlook macro.
tags: [eid13, notdoor]
mitre:
  tactics: [persistence, defense-evasion]
  techniques: [T1137, T1112]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:         gen.int(min=1000, max=4000)
  sysmon_tid:         gen.int(min=1000, max=9999)
  username:           gen.username()
  user:               "${ref.domain_short}\\${ref.username}"
  user_rid:           gen.int(min=1001, max=1999)
  user_sid:           "S-1-5-21-111222333-444555666-777888999-${ref.user_rid}"
  process_guid_raw:   gen.uuid()
  process_guid:       "{${ref.process_guid_raw}}"
  process_id:         gen.int(min=1000, max=9999)
  event_record_id:    gen.int(min=5000, max=9999999)
  image:              "c:\\ProgramData\\Onedrive.exe"
  target_object:      "HKU\\${ref.user_sid}\\SOFTWARE\\Microsoft\\Office\\16.0\\Outlook\\Security\\Level"
  details:            "DWORD (0x00000001)"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 13
          Version: 2
          Level: 4
          Task: 13
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": EventType
              "#text": SetValue
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetObject
              "#text": ref.target_object
            - "@Name": Details
              "#text": ref.details
            - "@Name": User
              "#text": ref.user
