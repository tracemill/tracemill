type: scenario
description: |
  Audit policy option changed through the registry: Sysmon EID 13
  (RegistryEvent value-set) records auditpol.exe writing the
  FullPrivilegeAuditing value under
  HKLM\System\CurrentControlSet\Control\Lsa. The four values under that key
  decide how much the security log keeps -- whether every privilege use is
  recorded, whether base objects and directories are audited, and whether the
  host halts when the log fills -- so a change here quietly narrows what any
  later investigation can see.
tags: [eid13]
mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1547.014]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:         gen.int(min=1000, max=4000)
  sysmon_tid:         gen.int(min=1000, max=9999)
  process_pid:        gen.int(min=1000, max=9999)
  process_guid_raw:   gen.uuid()
  process_guid:       "{${ref.process_guid_raw}}"
  user:               gen.username()
  user_qualified:     "${ref.domain_short}\\${ref.user}"
  event_record_id:    gen.int(min=5000000, max=59999999)
  image:              "C:\\Windows\\system32\\auditpol.exe"
  target_object:      "HKLM\\System\\CurrentControlSet\\Control\\Lsa\\FullPrivilegeAuditing"
  details:            "Binary Data"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385f-c22a-43e0-bf4c-06f5698ffbd9}"
          EventID: 13
          Version: 2
          Level: 4
          Task: 13
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": EventType
              "#text": SetValue
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_pid
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetObject
              "#text": ref.target_object
            - "@Name": Details
              "#text": ref.details
            - "@Name": User
              "#text": ref.user_qualified
