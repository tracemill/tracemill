type: scenario
description: |
  Fileless payload stored in the registry (T1027.011): a script host
  writes an encoded payload blob into a value under the user's hive, so
  a later stage can read, decode and run it from memory without a
  payload file on disk. Sysmon EID 13 (RegistryEvent value-set) records
  the write, with the writing process image and the encoded blob as the
  value data. The Gootloader loader, for example, has wscript.exe split
  its payload into base64 chunks of up to about 1,800 characters, stored
  in numbered values under
  HKU\<user SID>\SOFTWARE\Microsoft\Phone\<user name>.
tags: [eid13, gootloader]
mitre:
  tactics: [defense-evasion]
  techniques: [T1027.011]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:         gen.int(min=1000, max=4000)
  sysmon_tid:         gen.int(min=1000, max=9999)
  process_pid:        gen.int(min=1000, max=9999)
  process_guid_raw:   gen.uuid()
  process_guid:       "{${ref.process_guid_raw}}"
  event_record_id:    gen.int(min=5000, max=99999)
  user_name:          jsmith
  domain_sid:         "S-1-5-21-3946589728-3102711660-3528854901"
  user_rid:           "1104"
  user_sid:           "${ref.domain_sid}-${ref.user_rid}"
  image:              "C:\\Windows\\System32\\wscript.exe"
  chunk_index:        "6"
  target_object:      "HKU\\${ref.user_sid}\\SOFTWARE\\Microsoft\\Phone\\${ref.user_name}\\${ref.chunk_index}"
  details:            ""

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 13
          Version: 2
          Level: 4
          Task: 13
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": EventType
              "#text": SetValue
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_pid
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetObject
              "#text": ref.target_object
            - "@Name": Details
              "#text": ref.details
