type: scenario
description: |
  DLL path added under the Routing and Remote Access router manager: Sysmon
  EID 13 (RegistryEvent value-set) records reg.exe writing a value under
  System\CurrentControlSet\Services\RemoteAccess\RouterManagers\Ip that
  names a DLL in a user's Downloads folder. The service reads its router
  manager configuration from this key and loads the libraries it names, so
  a path placed here is read by a service process rather than by the user
  who wrote it.
tags: [eid13]
mitre:
  tactics: [defense-evasion]
  techniques: [T1112]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:         gen.int(min=1000, max=4000)
  sysmon_tid:         gen.int(min=1000, max=9999)
  process_pid:        gen.int(min=1000, max=9999)
  process_guid_raw:   fn.upper(gen.uuid())
  process_guid:       "{${ref.process_guid_raw}}"
  event_record_id:    gen.int(min=135000, max=135999)
  username:           gen.username()
  user_qualified:     "${ref.domain_short}\\${ref.username}"
  image:              "C:\\Windows\\system32\\reg.exe"
  value_name:         "TestDLL"
  payload_dll:        "C:\\Users\\${ref.username}\\Downloads\\hello.dll"
  target_object:      "HKLM\\System\\CurrentControlSet\\Services\\RemoteAccess\\RouterManagers\\Ip\\${ref.value_name}"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385f-c22a-43e0-bf4c-06f5698ffbd9}"
          EventID: 13
          Version: 2
          Level: 4
          Task: 13
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": EventType
              "#text": SetValue
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_pid
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetObject
              "#text": ref.target_object
            - "@Name": Details
              "#text": ref.payload_dll
            - "@Name": User
              "#text": ref.user_qualified
