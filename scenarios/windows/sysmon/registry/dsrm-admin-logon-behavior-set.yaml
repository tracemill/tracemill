type: scenario
description: |
  Directory Services Restore Mode administrator logon enabled through the
  registry: Sysmon EID 13 (RegistryEvent value-set) records reg.exe writing
  the DSRMAdminLogonBehavior DWORD under
  HKLM\System\CurrentControlSet\Control\Lsa on a domain controller. The DSRM
  administrator is a local account whose password is separate from every
  domain account. With a value of 1 it can log on to the domain controller
  while the AD DS service is stopped; with a value of 2 it can log on at any
  time, including over the network, so anyone holding the DSRM password or
  its hash keeps administrator access to the domain controller.
tags: [eid13]
mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1098]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  process_pid:         gen.int(min=1000, max=9999)
  process_guid_raw:    gen.uuid()
  process_guid:        "{${ref.process_guid_raw}}"
  user:                gen.username()
  user_qualified:      "${ref.domain_short}\\${ref.user}"
  event_record_id:     gen.int(min=5000, max=999999)
  image:               "C:\\Windows\\System32\\reg.exe"
  target_object:       "HKLM\\System\\CurrentControlSet\\Control\\Lsa\\DSRMAdminLogonBehavior"
  dsrm_logon_behavior: "2"
  details:             "DWORD (0x0000000${ref.dsrm_logon_behavior})"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 13
          Version: 2
          Level: 4
          Task: 13
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": EventType
              "#text": SetValue
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_pid
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetObject
              "#text": ref.target_object
            - "@Name": Details
              "#text": ref.details
            - "@Name": User
              "#text": ref.user_qualified
