type: scenario
description: |
  Windows Firewall rule deleted through the registry (T1112): Sysmon EID 12
  (RegistryEvent object create and delete) records the Windows Firewall
  service, running in svchost.exe, deleting a rule value under the
  SharedAccess FirewallRules registry key. Deleting a rule removes whatever
  that rule enforced: a deleted block rule lets the traffic it blocked
  through, and a deleted allow rule blocks the traffic it allowed unless
  another rule or the profile's default action still permits it.
tags: [eid12]
mitre:
  tactics: [defense-evasion]
  techniques: [T1112]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:         gen.int(min=1000, max=4000)
  sysmon_tid:         gen.int(min=1000, max=9999)
  process_pid:        gen.int(min=1000, max=9999)
  process_guid_raw:   gen.uuid()
  process_guid_upper: fn.upper(ref.process_guid_raw)
  process_guid:       "{${ref.process_guid_upper}}"
  event_record_id:    gen.int(min=5000, max=999999)
  image:              "C:\\Windows\\system32\\svchost.exe"
  rule_guid_raw:      gen.uuid()
  rule_guid_upper:    fn.upper(ref.rule_guid_raw)
  rule_guid:          "{${ref.rule_guid_upper}}"
  target_object:      "HKLM\\System\\CurrentControlSet\\Services\\SharedAccess\\Parameters\\FirewallPolicy\\FirewallRules\\${ref.rule_guid}"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 12
          Version: 2
          Level: 4
          Task: 12
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": EventType
              "#text": DeleteValue
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_pid
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetObject
              "#text": ref.target_object
            - "@Name": User
              "#text": "NT AUTHORITY\\LOCAL SERVICE"
