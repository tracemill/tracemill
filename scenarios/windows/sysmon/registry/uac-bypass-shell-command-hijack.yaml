type: scenario
description: |
  UAC bypass by shell command handler hijack: Sysmon EID 13 (RegistryEvent
  value-set) planting an attacker-chosen command in a per-user file-class
  handler under HKCU\Software\Classes (logged under HKU\<user SID>_Classes).
  Auto-elevating Windows binaries resolve these handlers from the per-user
  hive before HKLM, so the next launch runs the planted command at high
  integrity without a UAC prompt. Event Viewer (eventvwr.exe) reads
  mscfile\shell\open\command, Backup and Restore (sdclt.exe) reads the
  IsolatedCommand value of exefile\shell\runas\command, and WSReset.exe
  reads the AppX82a6gwre4fdg3bt635tn5ctqjf8msdd2\Shell\open\command
  handler of the Store app.
tags: [eid13]
mitre:
  tactics: [privilege-escalation, defense-evasion]
  techniques: [T1548.002]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:         gen.int(min=1000, max=4000)
  sysmon_tid:         gen.int(min=1000, max=9999)
  process_pid:        gen.int(min=1000, max=9999)
  process_guid_raw:   gen.uuid()
  process_guid:       "{${ref.process_guid_raw}}"
  user_rid:           gen.int(min=1001, max=1999)
  user_sid:           "S-1-5-21-111222333-444555666-777888999-${ref.user_rid}"
  image:              "C:\\Windows\\system32\\reg.exe"
  handler_value:      "mscfile\\shell\\open\\command\\(Default)"
  target_object:      "HKU\\${ref.user_sid}_Classes\\${ref.handler_value}"
  payload:            "C:\\Windows\\System32\\cmd.exe"
  event_record_id:    gen.int(min=5000, max=99999)

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 13
          Version: 2
          Level: 4
          Task: 13
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": EventType
              "#text": SetValue
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_pid
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetObject
              "#text": ref.target_object
            - "@Name": Details
              "#text": ref.payload
