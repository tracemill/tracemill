type: scenario
description: |
  Remote Desktop connections allowed through the registry: Sysmon EID 13
  (RegistryEvent value-set) records a process, for example reg.exe or the
  RDP Wrapper installer RDPWInst.exe, setting the fDenyTSConnections DWORD
  under HKLM\System\CurrentControlSet\Control\Terminal Server to 0. AzoRult
  malware makes this write both through reg.exe and through the RDP Wrapper
  installer it drops. The write needs administrative rights. With the value
  at 0 the host accepts Remote Desktop connections, but only if the Remote
  Desktop Services service is running and the firewall lets the traffic in.
tags: [eid13, azorult]
mitre:
  tactics: [lateral-movement]
  techniques: [T1021.001]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:         gen.int(min=1000, max=4000)
  sysmon_tid:         gen.int(min=1000, max=9999)
  process_pid:        gen.int(min=1000, max=9999)
  process_guid_raw:   gen.uuid()
  process_guid:       "{${ref.process_guid_raw}}"
  event_record_id:    gen.int(min=5000, max=99999)
  image:              "C:\\Windows\\SysWOW64\\reg.exe"
  target_object:      "HKLM\\System\\CurrentControlSet\\Control\\Terminal Server\\fDenyTSConnections"
  details:            "DWORD (0x00000000)"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 13
          Version: 2
          Level: 4
          Task: 13
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": EventType
              "#text": SetValue
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_pid
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetObject
              "#text": ref.target_object
            - "@Name": Details
              "#text": ref.details
