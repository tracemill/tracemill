type: scenario
description: |
  AppLocker rule that blocks security software (T1685): Sysmon EID 13
  (RegistryEvent value-set) records powershell.exe writing an AppLocker
  executable rule into the local Group Policy object, under
  HKU\<SID>\SOFTWARE\Microsoft\Windows\CurrentVersion\Group Policy
  Objects\{<GPO GUID>}Machine\Software\Policies\Microsoft\Windows\SrpV2\Exe\<rule
  GUID>. The rule XML has Action="Deny" for Everyone on every executable
  signed by an antivirus vendor's publisher certificate, for example
  O=KASPERSKY LAB, L=MOSCOW, C=RU. Once the policy is applied and the
  Application Identity service enforces AppLocker, Windows refuses to start
  any executable signed by that vendor.
tags: [eid13]
mitre:
  tactics: [defense-impairment]
  techniques: [T1685]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  user_sid:           "S-1-5-21-111222333-444555666-777888999-500"
  sysmon_pid:         gen.int(min=1000, max=4000)
  sysmon_tid:         gen.int(min=1000, max=9999)
  process_pid:        gen.int(min=1000, max=9999)
  process_guid_raw:   gen.uuid()
  process_guid:       "{${ref.process_guid_raw}}"
  event_record_id:    gen.int(min=5000, max=99999)
  image:              "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe"
  gpo_guid_raw:       gen.uuid()
  gpo_guid:           fn.upper(ref.gpo_guid_raw)
  rule_id:            gen.uuid()
  publisher:          "O=KASPERSKY LAB, L=MOSCOW, C=RU"
  target_object:      "HKU\\${ref.user_sid}\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Group Policy Objects\\{${ref.gpo_guid}}Machine\\Software\\Policies\\Microsoft\\Windows\\SrpV2\\Exe\\${ref.rule_id}\\Value"
  details:            '<FilePublisherRule Id="${ref.rule_id}" Name="${ref.publisher}" Description="" UserOrGroupSid="S-1-1-0" Action="Deny"><Conditions><FilePublisherCondition PublisherName="${ref.publisher}" ProductName="*" BinaryName="*"><BinaryVersionRange LowSection="*" HighSection="*"/></FilePublisherCondition></Conditions></FilePublisherRule>'

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 13
          Version: 2
          Level: 4
          Task: 13
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": EventType
              "#text": SetValue
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_pid
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetObject
              "#text": ref.target_object
            - "@Name": Details
              "#text": ref.details
