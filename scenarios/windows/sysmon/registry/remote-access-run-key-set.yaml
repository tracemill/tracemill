type: scenario
description: |
  Remote-access client pinned to user logon: Sysmon EID 13 (RegistryEvent
  value-set) records reg.exe adding a value under the per-user
  SOFTWARE\Microsoft\Windows\CurrentVersion\Run key whose data points at a
  remote-support client binary in the user's AppData folder. A Run entry
  needs no service installation and no administrative rights, so the agent
  comes back with the next interactive logon and keeps whoever holds the
  matching console able to reach the host.
tags: [eid13]
mitre:
  tactics: [command-and-control, persistence]
  techniques: [T1219, T1547.001]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:         gen.int(min=1000, max=4000)
  sysmon_tid:         gen.int(min=1000, max=9999)
  process_pid:        gen.int(min=1000, max=9999)
  process_guid_raw:   fn.upper(gen.uuid())
  process_guid:       "{${ref.process_guid_raw}}"
  event_record_id:    gen.int(min=500000, max=599999)
  image:              "C:\\Windows\\system32\\reg.exe"
  username:           gen.username()
  user_qualified:     "${ref.domain_short}\\${ref.username}"
  user_rid:           gen.int(min=1001, max=1999)
  user_sid:           "S-1-5-21-111222333-444555666-777888999-${ref.user_rid}"
  client_instance:    gen.hex(len=16)
  value_name:         "ScreenConnect Client (${ref.client_instance})"
  target_object:      "HKU\\${ref.user_sid}\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run\\${ref.value_name}"
  details:            "\"C:\\Users\\${ref.username}\\AppData\\Local\\Apps\\ScreenConnect Client (${ref.client_instance})\\ScreenConnect.ClientService.exe\""

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 13
          Version: 2
          Level: 4
          Task: 13
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": EventType
              "#text": SetValue
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_pid
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetObject
              "#text": ref.target_object
            - "@Name": Details
              "#text": ref.details
            - "@Name": User
              "#text": ref.user_qualified
