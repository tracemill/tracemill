type: scenario
description: |
  Antivirus automatic start turned off through the registry: Sysmon EID 13
  (RegistryEvent value-set) records regedit.exe setting an antivirus
  product's autostart DWORD to 0 under its HKLM configuration key, for
  example AutoStart under
  HKLM\SOFTWARE\WOW6432Node\kingsoft\antivirus\KAVReport (Kingsoft
  Antivirus) or autostart under HKLM\SOFTWARE\WOW6432Node\Tencent\QQPCMgr
  (Tencent PC Manager). The write needs administrative rights. With the
  value at 0, the product's automatic start is off: from the next boot it no
  longer launches on its own until someone starts it by hand or restores the
  value.
tags: [eid13, valleyrat]
mitre:
  tactics: [defense-evasion, defense-impairment]
  techniques: [T1112, T1685]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  user:               Administrator
  user_qualified:     "${ref.domain_short}\\${ref.user}"
  sysmon_pid:         gen.int(min=1000, max=4000)
  sysmon_tid:         gen.int(min=1000, max=9999)
  process_pid:        gen.int(min=1000, max=9999)
  process_guid_raw:   gen.uuid()
  process_guid:       "{${ref.process_guid_raw}}"
  event_record_id:    gen.int(min=5000, max=99999)
  image:              "C:\\Windows\\regedit.exe"
  registry_key:       "HKLM\\SOFTWARE\\WOW6432Node\\kingsoft\\antivirus\\KAVReport"
  value_name:         AutoStart
  details:            "DWORD (0x00000000)"
  target_object:      "${ref.registry_key}\\${ref.value_name}"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 13
          Version: 2
          Level: 4
          Task: 13
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": EventType
              "#text": SetValue
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_pid
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetObject
              "#text": ref.target_object
            - "@Name": Details
              "#text": ref.details
            - "@Name": User
              "#text": ref.user_qualified
