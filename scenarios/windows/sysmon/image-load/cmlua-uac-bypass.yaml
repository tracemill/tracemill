type: scenario
description: |
  Privilege escalation: a process loads CMLUA.dll (or CMSTPLUA.dll /
  CMLUAUTIL.dll), the COM elevation helper Windows' auto-elevating
  Connection Manager binaries use, from a location other than a
  standard Windows executable directory. Sysmon EID 7 (Image Load)
  records the loading process and the DLL path. This COM-hijack pattern
  lets a non-elevated process invoke the auto-elevated COM interface's
  UAC bypass without spawning a recognizable auto-elevating binary.
  The loading process path is a state parameter so a job can drive both
  the attack path and a standard-directory (Windows system) load that
  falls outside the detection's scope.
tags: [eid7, darkside]
mitre:
  tactics: [privilege-escalation, defense-evasion]
  techniques: [T1218.003]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  process_guid_raw:    gen.uuid()
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=99999)
  image:               "C:\\Temp\\darkside.exe"
  image_loaded:         C:\Windows\SysWOW64\cmlua.dll
  file_version:        "7.2.14393.4169 (rs1_release.210107-1130)"
  description:          Connection Manager Admin API Helper
  original_file_name:   CMLUA.DLL
  hashes:               "MD5=A632AD7B63AD2C9EDA3A912FDE29B1E9,SHA256=19219212E762D9226620DA0B333BBDC4191DC65AEC907010E610E9F681D0E03E,IMPHASH=3841E6E6CEA9DE26C2413D87A44F27CE"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 7
          Version: 3
          Level: 4
          Task: 7
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": ImageLoaded
              "#text": ref.image_loaded
            - "@Name": FileVersion
              "#text": ref.file_version
            - "@Name": Description
              "#text": ref.description
            - "@Name": Product
              "#text": "Microsoft(R) Connection Manager"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": ref.original_file_name
            - "@Name": Hashes
              "#text": ref.hashes
            - "@Name": Signed
              "#text": "true"
            - "@Name": Signature
              "#text": Microsoft Windows
            - "@Name": SignatureStatus
              "#text": Valid
