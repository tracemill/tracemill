type: scenario
description: |
  InstallUtil.exe, the .NET Framework installation utility, loads the Windows
  SAM and Credential Vault client libraries. Sysmon EID 7 (Image Load) records
  one 64-bit InstallUtil.exe process loading samlib.dll, the SAM Library DLL,
  and then vaultcli.dll, the Credential Vault Client Library, both signed by
  Microsoft and loaded from System32. The events show the two libraries mapped
  into InstallUtil.exe, not which accounts or stored credentials code in that
  process then read.
tags: [eid7]
mitre:
  tactics: [defense-evasion]
  techniques: [T1218.004]

state:
  domain_short:          CORP
  domain_tld:            local
  domain_short_lower:    fn.lower(ref.domain_short)
  domain_fqdn:           "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:              gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:            gen.int(min=1000, max=4000)
  samlib_tid:            gen.int(min=1000, max=9999)
  vaultcli_tid:          gen.int(min=1000, max=9999)
  installutil_guid_raw:  fn.upper(gen.uuid())
  installutil_guid:      "{${ref.installutil_guid_raw}}"
  installutil_pid:       gen.int(min=1000, max=9999)
  samlib_record_id:      gen.int(min=5000, max=49999)
  vaultcli_record_id:    gen.int(min=50000, max=99999)

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 7
          Version: 3
          Level: 4
          Task: 7
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.samlib_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.samlib_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.installutil_guid
            - "@Name": ProcessId
              "#text": ref.installutil_pid
            - "@Name": Image
              "#text": "C:\\Windows\\Microsoft.NET\\Framework64\\v4.0.30319\\InstallUtil.exe"
            - "@Name": ImageLoaded
              "#text": "C:\\Windows\\System32\\samlib.dll"
            - "@Name": FileVersion
              "#text": "10.0.14393.4530 (rs1_release.210705-0736)"
            - "@Name": Description
              "#text": SAM Library DLL
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": SAMLib.DLL
            - "@Name": Hashes
              "#text": "MD5=92CD5DA45ABA4CE45313783FCB345D99,SHA256=B0F20BE2B144056E488F8FF51E266F426625E64E3C91CCD17895A441A0935C46"
            - "@Name": Signed
              "#text": "true"
            - "@Name": Signature
              "#text": Microsoft Windows
            - "@Name": SignatureStatus
              "#text": Valid

  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 7
          Version: 3
          Level: 4
          Task: 7
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.vaultcli_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.vaultcli_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.installutil_guid
            - "@Name": ProcessId
              "#text": ref.installutil_pid
            - "@Name": Image
              "#text": "C:\\Windows\\Microsoft.NET\\Framework64\\v4.0.30319\\InstallUtil.exe"
            - "@Name": ImageLoaded
              "#text": "C:\\Windows\\System32\\vaultcli.dll"
            - "@Name": FileVersion
              "#text": "10.0.14393.4169 (rs1_release.210107-1130)"
            - "@Name": Description
              "#text": Credential Vault Client Library
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": vaultcli.dll
            - "@Name": Hashes
              "#text": "MD5=3A4413FEB384CA47420B1A7CB9099BF0,SHA256=338D718FF68D1ACF8AFC366E923B44128E821DDD50A9C282A5F55502BAF288FA"
            - "@Name": Signed
              "#text": "true"
            - "@Name": Signature
              "#text": Microsoft Windows
            - "@Name": SignatureStatus
              "#text": Valid
