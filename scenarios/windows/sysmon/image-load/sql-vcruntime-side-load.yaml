type: scenario
description: |
  A copied Microsoft SQL Server program side-loads a Visual C++ runtime DLL
  from its own directory. Sysmon EID 7 (Image Load) records a SQL Server
  program, for example sqlwriter.exe, running from a directory outside the
  Windows system directories, for example C:\Windows\Tasks, loading an
  unsigned vcruntime140.dll from that same directory. The DLL's version
  information names Microsoft Corporation as the company and
  vcruntime140.dll as the original file name, but it carries no signature.
  The event shows the DLL mapped into the process, not what code it then
  ran.
tags: [eid7, wineloader]
mitre:
  tactics: [persistence, privilege-escalation, defense-evasion]
  techniques: [T1574.001]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  host_short:          gen.hostname(class=windows-server)
  host_short_lower:    fn.lower(ref.host_short)
  host_short_upper:    fn.upper(ref.host_short)
  computer:            "${ref.host_short_lower}.${ref.domain_fqdn}"
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=99999)
  user_name:           Administrator
  user:                "${ref.host_short_upper}\\${ref.user_name}"
  side_load_dir:       "C:\\Windows\\Tasks"
  image_name:          sqlwriter.exe
  image:               "${ref.side_load_dir}\\${ref.image_name}"
  image_loaded:        "${ref.side_load_dir}\\vcruntime140.dll"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 7
          Version: 3
          Level: 4
          Task: 7
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": ImageLoaded
              "#text": ref.image_loaded
            - "@Name": FileVersion
              "#text": "14.32.31332.0"
            - "@Name": Description
              "#text": "Microsoft® C Runtime Library"
            - "@Name": Product
              "#text": "Microsoft® Visual Studio®"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": vcruntime140.dll
            - "@Name": Hashes
              "#text": "MD5=7961263963841010A049265956B14666,SHA256=72B92683052E0C813890CAF7B4F8BFD331A8B2AFC324DD545D46138F677178C4"
            - "@Name": Signed
              "#text": "false"
            - "@Name": Signature
              "#text": "-"
            - "@Name": SignatureStatus
              "#text": Unavailable
            - "@Name": User
              "#text": ref.user
