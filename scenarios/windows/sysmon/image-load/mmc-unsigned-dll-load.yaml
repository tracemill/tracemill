type: scenario
description: |
  The Microsoft Management Console loads an unsigned DLL during a UAC
  bypass. Sysmon EID 7 (Image Load) records mmc.exe, an auto-elevating
  Windows binary, loading an unsigned DLL that carries no version
  information, company name or signature, for example C:\Temp\test.dll. One
  documented way to cause this load is to point the .NET profiler variables
  in the user's environment at the DLL, so that the .NET runtime in an
  auto-elevated process such as mmc.exe loads it. mmc.exe starts elevated
  without a consent prompt only for a user in the local Administrators
  group with UAC at its default level. The event shows the DLL mapped into
  mmc.exe, not how the load was set up or what the DLL then ran.
tags: [eid7]
mitre:
  tactics: [defense-evasion, privilege-escalation]
  techniques: [T1218.014, T1548.002]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  host_short:          gen.hostname(class=windows-server)
  host_short_lower:    fn.lower(ref.host_short)
  computer:            "${ref.host_short_lower}.${ref.domain_fqdn}"
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=99999)
  image_loaded:        "C:\\Temp\\test.dll"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 7
          Version: 3
          Level: 4
          Task: 7
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": "C:\\Windows\\System32\\mmc.exe"
            - "@Name": ImageLoaded
              "#text": ref.image_loaded
            - "@Name": FileVersion
              "#text": "-"
            - "@Name": Description
              "#text": "-"
            - "@Name": Product
              "#text": "-"
            - "@Name": Company
              "#text": "-"
            - "@Name": OriginalFileName
              "#text": "-"
            - "@Name": Hashes
              "#text": "MD5=BAD072DD3BD7B46B8C7BD7D27569D9D5,SHA256=25EC6A50C36ED42C4AEC92B0DAD67F49DD39ED10C9048185AD72F2FE4816E5C8,IMPHASH=3DA185B95597422D5F87D0C5E8C33CC7"
            - "@Name": Signed
              "#text": "false"
            - "@Name": Signature
              "#text": "-"
            - "@Name": SignatureStatus
              "#text": Unavailable
