type: scenario
description: |
  The Microsoft Management Console loads a .NET Framework native image.
  Sysmon EID 7 (Image Load) records mmc.exe loading System.ni.dll, the
  precompiled native image of the .NET Framework System assembly, from the
  native image cache under C:\Windows\assembly. Native images are not
  signed, so the event carries Signed false with no signature, while its
  version information names Microsoft Corporation as the company, .NET
  Framework as the product and System.dll as the original file name. The
  event shows a .NET Framework library from the Windows native image cache
  mapped into mmc.exe.
tags: [eid7]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  host_short:          gen.hostname(class=windows-server)
  host_short_lower:    fn.lower(ref.host_short)
  host_short_upper:    fn.upper(ref.host_short)
  computer:            "${ref.host_short_lower}.${ref.domain_fqdn}"
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  process_guid_raw:    fn.lower(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=99999)
  user_name:           Administrator
  user:                "${ref.host_short_upper}\\${ref.user_name}"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385f-c22a-43e0-bf4c-06f5698ffbd9}"
          EventID: 7
          Version: 3
          Level: 4
          Task: 7
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": "C:\\Windows\\System32\\mmc.exe"
            - "@Name": ImageLoaded
              "#text": "C:\\Windows\\assembly\\NativeImages_v4.0.30319_64\\System\\057f86919ea12b362e9919ffa2b7a235\\System.ni.dll"
            - "@Name": FileVersion
              "#text": "4.8.4798.0 built by: NET48REL1LAST_B"
            - "@Name": Description
              "#text": .NET Framework
            - "@Name": Product
              "#text": "Microsoft® .NET Framework"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": System.dll
            - "@Name": Hashes
              "#text": "MD5=5F6362881F64D61ABEA073400E342FD8,SHA256=8C530B2EF6B6705E5DD2B23F23723D4B2CA348F1554A3E8E7DAF21A4821FDFA6,IMPHASH=00000000000000000000000000000000"
            - "@Name": Signed
              "#text": "false"
            - "@Name": Signature
              "#text": "-"
            - "@Name": SignatureStatus
              "#text": Unavailable
            - "@Name": User
              "#text": ref.user
