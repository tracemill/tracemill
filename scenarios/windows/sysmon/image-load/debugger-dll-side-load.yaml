type: scenario
description: |
  A process side-loads an unsigned DLL from its own directory. Sysmon EID 7
  (Image Load) records a process, for example the debugger x32dbg.exe,
  running from a directory outside the Windows system and Program Files
  directories, for example C:\Temp\debugger_dll_sideload, loading a DLL from
  that same directory, for example x32bridge.dll. The DLL is unsigned
  (SignatureStatus Unavailable) and carries no version, product or company
  information; the event also records its hashes and the user the process
  runs as. The event shows the DLL loaded into the process, not what code it
  then ran.
tags: [eid7]
mitre:
  tactics: [persistence, privilege-escalation, defense-evasion]
  techniques: [T1574.001]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  host_short:          gen.hostname(class=windows-workstation)
  host_short_lower:    fn.lower(ref.host_short)
  host_short_upper:    fn.upper(ref.host_short)
  computer:            "${ref.host_short_lower}.${ref.domain_fqdn}"
  user_name:           Administrator
  user:                "${ref.host_short_upper}\\${ref.user_name}"
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=100, max=9999)
  event_record_id:     gen.int(min=5000, max=99999)
  side_load_dir:       "C:\\Temp\\debugger_dll_sideload"
  image_name:          x32dbg.exe
  dll_name:            x32bridge.dll
  image:               "${ref.side_load_dir}\\${ref.image_name}"
  image_loaded:        "${ref.side_load_dir}\\${ref.dll_name}"
  hashes:              "MD5=242F1BEFDC41AE290D27349DCA28668B,SHA256=0834A43828D8ABE11C2CA4AD720F81A201B13511B29F0F0A72D95F51821D1EC1,IMPHASH=04996D1467B9783027C29634D5E6ECA9"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 7
          Version: 3
          Level: 4
          Task: 7
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": ImageLoaded
              "#text": ref.image_loaded
            - "@Name": FileVersion
              "#text": "-"
            - "@Name": Description
              "#text": "-"
            - "@Name": Product
              "#text": "-"
            - "@Name": Company
              "#text": "-"
            - "@Name": OriginalFileName
              "#text": "-"
            - "@Name": Hashes
              "#text": ref.hashes
            - "@Name": Signed
              "#text": "false"
            - "@Name": Signature
              "#text": "-"
            - "@Name": SignatureStatus
              "#text": Unavailable
            - "@Name": User
              "#text": ref.user
