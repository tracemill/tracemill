type: scenario
description: |
  A copied SQL Server VSS Writer program loads the Visual C++ runtime from
  the Windows system directory. Sysmon EID 7 (Image Load) records
  sqlwriter.exe running from C:\Windows\Tasks loading vcruntime140.dll from
  C:\Windows\System32, with a valid signature from Microsoft Windows
  Software Compatibility Publisher. The event shows the signed system copy
  of the runtime mapped into the process, not a DLL from the program's own
  directory.
tags: [eid7]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  host_short:          gen.hostname(class=windows-server)
  host_short_lower:    fn.lower(ref.host_short)
  host_short_upper:    fn.upper(ref.host_short)
  computer:            "${ref.host_short_lower}.${ref.domain_fqdn}"
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=99999)
  user_name:           Administrator
  user:                "${ref.host_short_upper}\\${ref.user_name}"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 7
          Version: 3
          Level: 4
          Task: 7
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": "C:\\Windows\\Tasks\\sqlwriter.exe"
            - "@Name": ImageLoaded
              "#text": "C:\\Windows\\System32\\vcruntime140.dll"
            - "@Name": FileVersion
              "#text": "14.36.32532.0"
            - "@Name": Description
              "#text": "Microsoft® C Runtime Library"
            - "@Name": Product
              "#text": "Microsoft® Visual Studio®"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": vcruntime140.dll
            - "@Name": Hashes
              "#text": "MD5=49C96CECDA5C6C660A107D378FDFC3D4,SHA256=69320F278D90EFAAEB67E2A1B55E5B0543883125834C812C8D9C39676E0494FC"
            - "@Name": Signed
              "#text": "true"
            - "@Name": Signature
              "#text": Microsoft Windows Software Compatibility Publisher
            - "@Name": SignatureStatus
              "#text": Valid
            - "@Name": User
              "#text": ref.user
