type: scenario
description: |
  Mark-of-the-Web removal: a process deletes the Zone.Identifier alternate
  data stream that Windows attaches to a file downloaded from the internet.
  Sysmon EID 23 (File Delete) records a process, for example powershell.exe,
  deleting the Zone.Identifier stream of a downloaded file, for example a
  .zip archive in the user's Downloads folder, along with the user the
  process runs as and the MD5 and SHA256 of the deleted stream. Windows
  features such as SmartScreen and Office Protected View read this stream to
  tell that a file came from the internet. The event records the stream's
  deletion, not the file being opened or run afterwards.
tags: [eid23]
mitre:
  tactics: [defense-evasion]
  techniques: [T1553.005]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  user_name:           Administrator
  user:                "${ref.domain_short}\\${ref.user_name}"
  process_guid_raw:    gen.uuid()
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=99999)
  image:               "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe"
  file_dir:            "C:\\Users\\${ref.user_name}\\Downloads"
  file_name:           PS-MOTW-main(1).zip
  target_filename:     "${ref.file_dir}\\${ref.file_name}:Zone.Identifier"
  stream_hashes:       "MD5=AF85BA08FDEF888FD62EB51E2D20D45C,SHA256=1A23E24E9459BDE7D5837E243B59A6C6D6CAEB7D565FB112E867C017F162A35E,IMPHASH=00000000000000000000000000000000"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 23
          Version: 5
          Level: 4
          Task: 23
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": User
              "#text": ref.user
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetFilename
              "#text": ref.target_filename
            - "@Name": Hashes
              "#text": ref.stream_hashes
            - "@Name": IsExecutable
              "#text": "false"
            - "@Name": Archived
              "#text": "false - rename failed with status 0xc000000d"
