type: scenario
description: |
  MSI rollback script tampering: a process deletes a Windows Installer
  rollback script (.rbs) from C:\Config.Msi, the folder where the Windows
  Installer service, running as SYSTEM, keeps the scripts it runs to undo an
  installation that fails. Sysmon EID 23 (File Delete) records a process, for
  example FolderOrFileDeleteToSystem.exe from the public FilesystemEoPs proof
  of concept, run from the user's profile, deleting a rollback script, for
  example 1a6db9.rbs, along with the user the process runs as and the MD5 and
  SHA256 of the deleted script. An attacker who has replaced C:\Config.Msi
  with a folder they control deletes the Installer's rollback script so that
  a script of their own can take its place; the Installer service runs the
  rollback script it finds there if the installation rolls back. The event
  records the deletion, not a replacement script being written or run.
tags: [eid23]
mitre:
  tactics: [privilege-escalation, defense-evasion]
  techniques: [T1068, T1218.007]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  user_name:           jsmith
  user:                "${ref.domain_short}\\${ref.user_name}"
  process_guid_raw:    gen.uuid()
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=99999)
  image:               "C:\\Users\\${ref.user_name}\\filesystemeop\\PoC-main\\FilesystemEoPs\\x64\\Debug\\FolderOrFileDeleteToSystem.exe"
  rollback_script:     1a6db9.rbs
  target_filename:     "C:\\Config.Msi\\${ref.rollback_script}"
  script_hashes:       "MD5=2060E7D7C5C70D83FB0A2842E7C1FCFA,SHA256=DF245D3D084A8C00E0E78A0C32605B92AA5906A7155BD49FFDF0C9A99608ADB6,IMPHASH=00000000000000000000000000000000"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 23
          Version: 5
          Level: 4
          Task: 23
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": User
              "#text": ref.user
            - "@Name": Image
              "#text": ref.image
            - "@Name": TargetFilename
              "#text": ref.target_filename
            - "@Name": Hashes
              "#text": ref.script_hashes
            - "@Name": IsExecutable
              "#text": "false"
            - "@Name": Archived
              "#text": "true"
