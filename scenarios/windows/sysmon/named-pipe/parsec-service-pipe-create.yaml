type: scenario
description: |
  A remote-desktop product opens its own service pipe: Sysmon EID 17 (Pipe
  Created) records pservice.exe, installed under Program Files, creating the
  named pipe \PARSEC-NP that its user-session process connects to. Ordinary
  desktop software creates named pipes constantly, so this is the shape of a
  normal pipe event from a path no allow list covers.
tags: [eid17]
mitre:
  tactics: [execution]
  techniques: [T1559]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:         gen.int(min=1000, max=4000)
  sysmon_tid:         gen.int(min=1000, max=9999)
  event_record_id:    gen.int(min=2000, max=2999)
  process_pid:        gen.int(min=1000, max=9999)
  process_guid:       fn.upper(gen.uuid())
  user:               'NT AUTHORITY\SYSTEM'
  pipe_name:          '\PARSEC-NP'
  image:              'C:\Program Files\Parsec\pservice.exe'

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": 5770385F-C22A-43E0-BF4C-06F5698FFBD9
          EventID: 17
          Version: 1
          Level: 4
          Task: 17
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": EventType
              "#text": CreatePipe
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_pid
            - "@Name": PipeName
              "#text": ref.pipe_name
            - "@Name": Image
              "#text": ref.image
            - "@Name": User
              "#text": ref.user
