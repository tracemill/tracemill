type: scenario
description: |
  A Remote Manipulator System (RMS) client process connects to an RMS named
  pipe. Sysmon EID 18 (PipeEvent, Pipe Connected) records the RMS client
  binary, for example rfusclient.exe running from C:\ProgramData\Windows,
  connecting to a named pipe that the RMS components use to communicate on
  the machine, for example \RManFUSServerNotify32. The event shows the local
  inter-process pipe connection, not a remote connection to the host or
  control of it.
tags: [eid18, rms]
mitre:
  tactics: [command-and-control]
  techniques: [T1219]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:         gen.int(min=1000, max=4000)
  sysmon_tid:         gen.int(min=1000, max=9999)
  process_pid:        gen.int(min=1000, max=9999)
  process_guid_raw:   fn.upper(gen.uuid())
  process_guid:       "{${ref.process_guid_raw}}"
  event_record_id:    gen.int(min=5000, max=99999)
  install_dir:        "C:\\ProgramData\\Windows"
  image:              "${ref.install_dir}\\rfusclient.exe"
  pipe_name:          "\\RManFUSServerNotify32"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 18
          Version: 1
          Level: 4
          Task: 18
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": EventType
              "#text": ConnectPipe
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_pid
            - "@Name": PipeName
              "#text": ref.pipe_name
            - "@Name": Image
              "#text": ref.image
