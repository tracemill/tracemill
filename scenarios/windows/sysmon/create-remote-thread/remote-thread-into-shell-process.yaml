type: scenario
description: |
  Defense evasion / privilege escalation: a process creates a remote
  thread inside a running command-shell process. Sysmon EID 8
  (CreateRemoteThread) records the source and target process identities
  along with the thread's start address. Malware such as IcedID injects
  into a legitimate shell process (cmd.exe, powershell.exe, pwsh.exe) to
  execute code under a trusted process name and evade process-name-based
  defenses. The target process image is a state parameter so a job can
  drive both a shell-process target and a non-shell target that should
  not trip a detection scoped to command-shell processes.
tags: [eid8, icedid]
mitre:
  tactics: [defense-evasion, privilege-escalation]
  techniques: [T1055]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=100000, max=999999)
  source_guid_raw:     gen.uuid()
  source_process_guid: "{${ref.source_guid_raw}}"
  source_process_id:   gen.int(min=1000, max=9999)
  source_image:        "C:\\Python39\\rundll32.exe"
  target_guid_raw:     gen.uuid()
  target_process_guid: "{${ref.target_guid_raw}}"
  target_process_id:   gen.int(min=1000, max=9999)
  target_image:        "C:\\Windows\\System32\\cmd.exe"
  new_thread_id:        gen.int(min=1000, max=9999)
  start_address:       "0x000000000AF20000"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 8
          Version: 2
          Level: 4
          Task: 8
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": SourceProcessGuid
              "#text": ref.source_process_guid
            - "@Name": SourceProcessId
              "#text": ref.source_process_id
            - "@Name": SourceImage
              "#text": ref.source_image
            - "@Name": TargetProcessGuid
              "#text": ref.target_process_guid
            - "@Name": TargetProcessId
              "#text": ref.target_process_id
            - "@Name": TargetImage
              "#text": ref.target_image
            - "@Name": NewThreadId
              "#text": ref.new_thread_id
            - "@Name": StartAddress
              "#text": ref.start_address
            - "@Name": StartModule
              "#text": "-"
            - "@Name": StartFunction
              "#text": "-"
