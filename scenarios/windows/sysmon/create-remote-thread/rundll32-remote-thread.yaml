type: scenario
description: |
  The Windows DLL host rundll32.exe creates a thread inside another running
  process. Sysmon EID 8 (CreateRemoteThread) records
  C:\Windows\System32\rundll32.exe as the source process creating a new
  thread inside a target executable, for example the Firefox browser
  firefox.exe, along with the new thread's ID and start address; no start
  module or function is recorded. The event shows a thread created in the
  target process, not what code it ran.
tags: [eid8, icedid]
mitre:
  tactics: [defense-evasion, privilege-escalation]
  techniques: [T1055]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=99999)
  source_guid_raw:     fn.upper(gen.uuid())
  source_process_guid: "{${ref.source_guid_raw}}"
  source_process_id:   gen.int(min=1000, max=9999)
  target_guid_raw:     fn.upper(gen.uuid())
  target_process_guid: "{${ref.target_guid_raw}}"
  target_process_id:   gen.int(min=1000, max=9999)
  target_image:        "C:\\Program Files\\Mozilla Firefox\\firefox.exe"
  new_thread_id:       gen.int(min=1000, max=9999)

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 8
          Version: 2
          Level: 4
          Task: 8
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": SourceProcessGuid
              "#text": ref.source_process_guid
            - "@Name": SourceProcessId
              "#text": ref.source_process_id
            - "@Name": SourceImage
              "#text": "C:\\Windows\\System32\\rundll32.exe"
            - "@Name": TargetProcessGuid
              "#text": ref.target_process_guid
            - "@Name": TargetProcessId
              "#text": ref.target_process_id
            - "@Name": TargetImage
              "#text": ref.target_image
            - "@Name": NewThreadId
              "#text": ref.new_thread_id
            - "@Name": StartAddress
              "#text": "0x0000000032A22CAC"
            - "@Name": StartModule
              "#text": "-"
            - "@Name": StartFunction
              "#text": "-"
