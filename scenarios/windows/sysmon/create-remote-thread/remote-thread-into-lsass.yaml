type: scenario
description: |
  Credential access: a process creates a remote thread inside lsass.exe,
  the process that holds cached authentication credentials in memory.
  Sysmon EID 8 (CreateRemoteThread) records the source and target
  process identities along with the thread's start address. This is
  the injection mechanism credential-dumping tools use to read LSASS
  memory without an intermediate access-plus-dump step. The target
  process image is a state parameter so a job can drive both an LSASS
  target and a non-LSASS target that should not trip a detection
  scoped to lsass.exe.
tags: [eid8]
mitre:
  tactics: [credential-access]
  techniques: [T1003.001]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=100000, max=999999)
  source_guid_raw:     gen.uuid()
  source_process_guid: "{${ref.source_guid_raw}}"
  source_process_id:   gen.int(min=1000, max=9999)
  username:            gen.username()
  source_image:        "C:\\Users\\${ref.username}\\AppData\\Local\\Temp\\dumper.exe"
  target_guid_raw:     gen.uuid()
  target_process_guid: "{${ref.target_guid_raw}}"
  target_process_id:   gen.int(min=500, max=1200)
  target_image:        "C:\\Windows\\System32\\lsass.exe"
  new_thread_id:        gen.int(min=1000, max=9999)
  start_address:       "0x00000161B50D082C"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 8
          Version: 2
          Level: 4
          Task: 8
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": SourceProcessGuid
              "#text": ref.source_process_guid
            - "@Name": SourceProcessId
              "#text": ref.source_process_id
            - "@Name": SourceImage
              "#text": ref.source_image
            - "@Name": TargetProcessGuid
              "#text": ref.target_process_guid
            - "@Name": TargetProcessId
              "#text": ref.target_process_id
            - "@Name": TargetImage
              "#text": ref.target_image
            - "@Name": NewThreadId
              "#text": ref.new_thread_id
            - "@Name": StartAddress
              "#text": ref.start_address
            - "@Name": StartModule
              "#text": "-"
            - "@Name": StartFunction
              "#text": "-"
