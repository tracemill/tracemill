type: scenario
description: |
  A process opens winlogon.exe with full access rights. Sysmon EID 10
  (ProcessAccess) records a process, for example C:\Tools\Rubeus.exe, the
  .NET Kerberos abuse tool, opening C:\Windows\system32\winlogon.exe with the
  legacy full-access mask (GrantedAccess 0x1f3fff). The call stack runs
  through ntdll.dll and KERNELBASE.dll into the .NET Framework System.ni.dll
  native image and ends in a frame Sysmon cannot map to a loaded module. A
  handle with these rights lets the process read winlogon.exe's memory,
  duplicate its handles and open its access token; the event records the
  handle request, not which Kerberos tickets were read or exported.
tags: [eid10, rubeus]
mitre:
  tactics: [defense-evasion, lateral-movement]
  techniques: [T1550.003]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  source_guid_raw:     fn.upper(gen.uuid())
  source_process_guid: "{${ref.source_guid_raw}}"
  source_pid:          gen.int(min=1000, max=9999)
  source_tid:          gen.int(min=100, max=9999)
  target_guid_raw:     fn.upper(gen.uuid())
  target_process_guid: "{${ref.target_guid_raw}}"
  target_pid:          gen.int(min=400, max=900)
  event_record_id:     gen.int(min=5000, max=99999)
  source_image:        "C:\\Tools\\Rubeus.exe"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 10
          Version: 3
          Level: 4
          Task: 10
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": SourceProcessGUID
              "#text": ref.source_process_guid
            - "@Name": SourceProcessId
              "#text": ref.source_pid
            - "@Name": SourceThreadId
              "#text": ref.source_tid
            - "@Name": SourceImage
              "#text": ref.source_image
            - "@Name": TargetProcessGUID
              "#text": ref.target_process_guid
            - "@Name": TargetProcessId
              "#text": ref.target_pid
            - "@Name": TargetImage
              "#text": "C:\\Windows\\system32\\winlogon.exe"
            - "@Name": GrantedAccess
              "#text": "0x1f3fff"
            - "@Name": CallTrace
              "#text": "C:\\Windows\\SYSTEM32\\ntdll.dll+a6134|C:\\Windows\\System32\\KERNELBASE.dll+221bd|C:\\Windows\\assembly\\NativeImages_v4.0.30319_64\\System\\92b818b675d92827ce6f9fe02da8f648\\System.ni.dll+381f60|C:\\Windows\\assembly\\NativeImages_v4.0.30319_64\\System\\92b818b675d92827ce6f9fe02da8f648\\System.ni.dll+2fa12e|C:\\Windows\\assembly\\NativeImages_v4.0.30319_64\\System\\92b818b675d92827ce6f9fe02da8f648\\System.ni.dll+2f8cd5|C:\\Windows\\assembly\\NativeImages_v4.0.30319_64\\System\\92b818b675d92827ce6f9fe02da8f648\\System.ni.dll+2c3b1e|C:\\Windows\\assembly\\NativeImages_v4.0.30319_64\\System\\92b818b675d92827ce6f9fe02da8f648\\System.ni.dll+2c01f5|UNKNOWN(00007FFD8E245F0C)"
