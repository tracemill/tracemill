type: scenario
description: |
  The Volume Shadow Copy service opens a handle to the Microsoft Defender
  antimalware service process. Sysmon EID 10 (ProcessAccess) records
  vssvc.exe, running as SYSTEM, opening MsMpEng.exe in a Defender platform
  directory, for example Platform\4.18.26030.3011-0, with
  PROCESS_QUERY_LIMITED_INFORMATION access (0x1000) from a call stack that
  runs through vssvc.exe and combase.dll. Such an access occurs during a run
  of RedSun, a local privilege escalation exploit against Microsoft Defender,
  but the event shows only that the service opened a query handle to the
  Defender process, not an exploit or a privilege escalation.
tags: [eid10, redsun]
mitre:
  tactics: [privilege-escalation]
  techniques: [T1068]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  host_short:          gen.hostname(class=windows-workstation)
  host_short_upper:    fn.upper(ref.host_short)
  computer:            "${ref.host_short_upper}.${ref.domain_fqdn}"
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=99999)
  source_guid_raw:     fn.upper(gen.uuid())
  source_process_guid: "{${ref.source_guid_raw}}"
  source_pid:          gen.int(min=1000, max=12000)
  source_tid:          gen.int(min=1000, max=9999)
  target_guid_raw:     fn.upper(gen.uuid())
  target_process_guid: "{${ref.target_guid_raw}}"
  target_pid:          gen.int(min=1000, max=12000)
  platform_version:    4.18.26030.3011-0
  target_image:        "C:\\ProgramData\\Microsoft\\Windows Defender\\Platform\\${ref.platform_version}\\MsMpEng.exe"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 10
          Version: 3
          Level: 4
          Task: 10
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": SourceProcessGUID
              "#text": ref.source_process_guid
            - "@Name": SourceProcessId
              "#text": ref.source_pid
            - "@Name": SourceThreadId
              "#text": ref.source_tid
            - "@Name": SourceImage
              "#text": C:\Windows\system32\vssvc.exe
            - "@Name": TargetProcessGUID
              "#text": ref.target_process_guid
            - "@Name": TargetProcessId
              "#text": ref.target_pid
            - "@Name": TargetImage
              "#text": ref.target_image
            - "@Name": GrantedAccess
              "#text": "0x1000"
            - "@Name": CallTrace
              "#text": "C:\\Windows\\SYSTEM32\\ntdll.dll+9f234|C:\\Windows\\System32\\KERNELBASE.dll+3212e|C:\\Windows\\system32\\vssvc.exe+c75c3|C:\\Windows\\system32\\vssvc.exe+5d911|C:\\Windows\\system32\\vssvc.exe+5aa58|C:\\Windows\\system32\\vssvc.exe+47dd9|C:\\Windows\\system32\\vssvc.exe+48cd9|C:\\Windows\\system32\\vssvc.exe+47643|C:\\Windows\\System32\\combase.dll+8bb6c|C:\\Windows\\System32\\combase.dll+8b8f3|C:\\Windows\\System32\\combase.dll+d6697|C:\\Windows\\System32\\combase.dll+d6313|C:\\Windows\\System32\\combase.dll+5c880|C:\\Windows\\System32\\combase.dll+6b33e|C:\\Windows\\system32\\vssvc.exe+488e4|C:\\Windows\\system32\\vssvc.exe+49d0a|C:\\Windows\\system32\\vssvc.exe+4a239|C:\\Windows\\System32\\msvcrt.dll+3e634|C:\\Windows\\System32\\msvcrt.dll+3e70c|C:\\Windows\\System32\\KERNEL32.DLL+1244d|C:\\Windows\\SYSTEM32\\ntdll.dll+5df78"
            - "@Name": SourceUser
              "#text": NT AUTHORITY\SYSTEM
            - "@Name": TargetUser
              "#text": NT AUTHORITY\SYSTEM
