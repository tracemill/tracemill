type: scenario
description: |
  A user runs mimikatz, which opens lsass.exe. Sysmon EID 10
  (ProcessAccess) records mimikatz.exe, for example in a mimikatz_trunk\x64
  folder under the user's Downloads directory, opening lsass.exe with access
  mask 0x1010 (PROCESS_VM_READ and PROCESS_QUERY_LIMITED_INFORMATION). The
  event carries the call stack through mimikatz.exe, the account the tool
  runs as, for example a domain administrator, and the account of lsass.exe,
  NT AUTHORITY\SYSTEM. It shows the handle request with memory-read rights,
  not which credentials were read.
tags: [eid10, mimikatz]
mitre:
  tactics: [credential-access]
  techniques: [T1003.001]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  source_guid_raw:     fn.upper(gen.uuid())
  source_process_guid: "{${ref.source_guid_raw}}"
  source_pid:          gen.int(min=1000, max=9999)
  source_tid:          gen.int(min=1000, max=9999)
  target_guid_raw:     fn.upper(gen.uuid())
  target_process_guid: "{${ref.target_guid_raw}}"
  target_pid:          gen.int(min=500, max=1200)
  event_record_id:     gen.int(min=5000, max=99999)
  user_name:           Administrator
  source_user:         "${ref.domain_short}\\${ref.user_name}"
  source_image:        "C:\\Users\\${ref.user_name}\\Downloads\\mimikatz_trunk\\x64\\mimikatz.exe"
  call_trace:          "C:\\Windows\\SYSTEM32\\ntdll.dll+a6144|C:\\Windows\\System32\\KERNELBASE.dll+221bd|${ref.source_image}+c0612|${ref.source_image}+c0e27|${ref.source_image}+85738|${ref.source_image}+85570|${ref.source_image}+852a3|${ref.source_image}+c7435|C:\\Windows\\System32\\KERNEL32.DLL+84d4|C:\\Windows\\SYSTEM32\\ntdll.dll+51791"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 10
          Version: 3
          Level: 4
          Task: 10
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": SourceProcessGUID
              "#text": ref.source_process_guid
            - "@Name": SourceProcessId
              "#text": ref.source_pid
            - "@Name": SourceThreadId
              "#text": ref.source_tid
            - "@Name": SourceImage
              "#text": ref.source_image
            - "@Name": TargetProcessGUID
              "#text": ref.target_process_guid
            - "@Name": TargetProcessId
              "#text": ref.target_pid
            - "@Name": TargetImage
              "#text": C:\Windows\system32\lsass.exe
            - "@Name": GrantedAccess
              "#text": "0x1010"
            - "@Name": CallTrace
              "#text": ref.call_trace
            - "@Name": SourceUser
              "#text": ref.source_user
            - "@Name": TargetUser
              "#text": NT AUTHORITY\SYSTEM
