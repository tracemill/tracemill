type: scenario
description: |
  Benign LSASS access via Sysmon EID 10 (ProcessAccess).  Models normal OS
  activity — svchost.exe accessing lsass.exe with limited access rights
  (0x1400) through the lsm.dll + RPCRT4.dll call path.  No dbgcore.dll or
  dbghelp.dll in CallTrace, so this should NOT trigger the "Access LSASS
  Memory for Dump Creation" detection.  Designed to be composed with attack
  scenarios in jobs to test detection specificity.
tags: [windows, sysmon, eid10]

state:
  computer:            gen.hostname(class=windows-workstation, domain=corp.local)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  target_guid_raw:     gen.uuid()
  target_process_guid: "{${ref.target_guid_raw}}"
  target_pid:          gen.int(min=500, max=1200)
  source_guid_raw:     gen.uuid()
  source_process_guid: "{${ref.source_guid_raw}}"
  source_pid:          gen.int(min=400, max=900)
  source_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=5000, max=99999)
  source_image:        C:\Windows\system32\svchost.exe
  granted_access:      "0x1400"
  call_trace:          "C:\\Windows\\SYSTEM32\\ntdll.dll+a5a94|C:\\Windows\\System32\\KERNELBASE.dll+5eab4|c:\\windows\\system32\\lsm.dll+e9d6|c:\\windows\\system32\\lsm.dll+d3ae|C:\\Windows\\System32\\RPCRT4.dll+78603|C:\\Windows\\System32\\RPCRT4.dll+d96bd|C:\\Windows\\System32\\RPCRT4.dll+610fc|C:\\Windows\\System32\\RPCRT4.dll+52734|C:\\Windows\\System32\\RPCRT4.dll+5164d|C:\\Windows\\System32\\RPCRT4.dll+51efb|C:\\Windows\\System32\\RPCRT4.dll+2552c|C:\\Windows\\System32\\RPCRT4.dll+259ac|C:\\Windows\\System32\\RPCRT4.dll+1122c|C:\\Windows\\System32\\RPCRT4.dll+12a8b|C:\\Windows\\System32\\RPCRT4.dll+1efba|C:\\Windows\\SYSTEM32\\ntdll.dll+1d34e|C:\\Windows\\SYSTEM32\\ntdll.dll+1ecb9|C:\\Windows\\System32\\KERNEL32.DLL+84d4|C:\\Windows\\SYSTEM32\\ntdll.dll+51791"

steps:
  # Benign svchost.exe → lsass.exe access via lsm.dll + RPCRT4.dll.
  # GrantedAccess 0x1400 = PROCESS_QUERY_LIMITED_INFORMATION | PROCESS_QUERY_INFORMATION.
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 10
          Version: 3
          Level: 4
          Task: 10
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": SourceProcessGUID
              "#text": ref.source_process_guid
            - "@Name": SourceProcessId
              "#text": ref.source_pid
            - "@Name": SourceThreadId
              "#text": ref.source_tid
            - "@Name": SourceImage
              "#text": ref.source_image
            - "@Name": TargetProcessGUID
              "#text": ref.target_process_guid
            - "@Name": TargetProcessId
              "#text": ref.target_pid
            - "@Name": TargetImage
              "#text": C:\Windows\system32\lsass.exe
            - "@Name": GrantedAccess
              "#text": ref.granted_access
            - "@Name": CallTrace
              "#text": ref.call_trace
