type: scenario
description: |
  Persistence: a WMI event consumer is registered in the root\subscription
  namespace (Sysmon EID 20). A CommandLineEventConsumer runs its command
  whenever the bound event filter fires, surviving reboots without a file in
  any autorun location. `operation` is a state parameter so a job can drive
  registration and removal.
tags: [eid20]
mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1546.003]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  event_record_id:     gen.int(min=1000, max=99999)
  username:            gen.username()
  user:                "${ref.domain_short}\\${ref.username}"
  subscription_name:   AtomicRedTeam-WMIPersistence-Example
  operation:           Created
  consumer_type:       Command Line
  destination:         ' "C:\\Windows\\System32\\notepad.exe"'

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 20
          Version: 3
          Level: 4
          Task: 20
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": EventType
              "#text": WmiConsumerEvent
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": Operation
              "#text": ref.operation
            - "@Name": User
              "#text": ref.user
            - "@Name": Name
              "#text": ' "${ref.subscription_name}"'
            - "@Name": Type
              "#text": ref.consumer_type
            - "@Name": Destination
              "#text": ref.destination
