type: scenario
description: |
  A SearchProtocolHost.exe process starts with no command-line arguments and
  then opens an outbound network connection. Sysmon EID 1 (Process Create)
  records a process, for example an executable on the user's desktop,
  launching SearchProtocolHost.exe, for example the 32-bit copy under
  SysWOW64, with a command line that is only the binary's path. Sysmon EID 3
  (Network Connect) records the same process, by process ID and process
  GUID, opening an outbound TCP connection, for example to a public host on
  port 443.
tags: [eid1, eid3, cobalt-strike]
mitre:
  tactics: [defense-evasion]
  techniques: [T1055]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  process_tid:         gen.int(min=1000, max=9999)
  network_tid:         gen.int(min=1000, max=9999)
  username:            gen.username()
  user:                "${ref.domain_short}\\${ref.username}"
  logon_guid_raw:      fn.upper(gen.uuid())
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=6)
  logon_id:            "0x${ref.logon_id_hex}"
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  parent_guid_raw:     fn.upper(gen.uuid())
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=9999)
  process_record_id:   gen.int(min=5000, max=49999)
  network_record_id:   gen.int(min=50000, max=99999)
  image:               "C:\\Windows\\SysWOW64\\SearchProtocolHost.exe"
  command_line:        "C:\\Windows\\syswow64\\searchprotocolhost.exe"
  network_image:       "C:\\Windows\\syswow64\\searchprotocolhost.exe"
  current_directory:   "C:\\Users\\${ref.username}\\Desktop\\"
  parent_image:        "C:\\Users\\${ref.username}\\Desktop\\beacon_sph.exe"
  parent_command_line: "\"${ref.parent_image}\" "
  source_ip_octet:     gen.int(min=2, max=254)
  source_ip:           "10.0.1.${ref.source_ip_octet}"
  source_port:         1270
  source_port_name:    opsmgr
  dest_ip:             "34.218.235.219"
  dest_hostname:       "ec2-34-218-235-219.us-west-2.compute.amazonaws.com"
  dest_port:           443
  dest_port_name:      https

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.process_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.process_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": FileVersion
              "#text": "7.0.14393.4169 (rs1_release.210107-1130)"
            - "@Name": Description
              "#text": Microsoft Windows Search Protocol Host
            - "@Name": Product
              "#text": "Windows® Search"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": SearchProtocolHost.exe
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": 2
            - "@Name": IntegrityLevel
              "#text": High
            - "@Name": Hashes
              "#text": "MD5=C5AF53A2CF9DEFD90F8634598C292B8E,SHA256=88B1A268AF7C0E847449C91580DB7E831A72E7BF1FE59BED11730BF65FC8ECB4,IMPHASH=0D54F4E9925B2D7C00A1ABD0E1B770C4"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": ref.parent_image
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line

  # No wait step: detections that join the two events by host and process need
  # both in the same search window.
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 3
          Version: 5
          Level: 4
          Task: 3
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.network_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.network_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.network_image
            - "@Name": User
              "#text": ref.user
            - "@Name": Protocol
              "#text": tcp
            - "@Name": Initiated
              "#text": "true"
            - "@Name": SourceIsIpv6
              "#text": "false"
            - "@Name": SourceIp
              "#text": ref.source_ip
            - "@Name": SourceHostname
              "#text": ref.computer
            - "@Name": SourcePort
              "#text": ref.source_port
            - "@Name": SourcePortName
              "#text": ref.source_port_name
            - "@Name": DestinationIsIpv6
              "#text": "false"
            - "@Name": DestinationIp
              "#text": ref.dest_ip
            - "@Name": DestinationHostname
              "#text": ref.dest_hostname
            - "@Name": DestinationPort
              "#text": ref.dest_port
            - "@Name": DestinationPortName
              "#text": ref.dest_port_name
