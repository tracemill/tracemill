type: scenario
description: |
  LSASS connects to a domain controller's Kerberos port. Sysmon EID 1
  (Process Create) records C:\Windows\System32\lsass.exe started by
  wininit.exe as NT AUTHORITY\SYSTEM in session 0, and Sysmon EID 3 (Network
  Connect) records an outbound TCP connection from the same process on the
  same host to port 88 (kerberos) on a domain controller.
tags: [eid1, eid3]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  network_tid:         gen.int(min=1000, max=9999)
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=400, max=900)
  parent_guid_raw:     fn.upper(gen.uuid())
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=400, max=900)
  logon_guid_head:     gen.hex(len=8, case=upper)
  logon_guid_mid1:     gen.hex(len=4, case=upper)
  logon_guid_mid2:     gen.hex(len=4, case=upper)
  logon_guid:          "{${ref.logon_guid_head}-${ref.logon_guid_mid1}-${ref.logon_guid_mid2}-E703-000000000000}"
  image:               "C:\\Windows\\System32\\lsass.exe"
  process_record_id:   gen.int(min=5000, max=49999)
  network_record_id:   gen.int(min=50000, max=99999)
  source_ip:           "10.0.1.15"
  source_port:         gen.int(min=49152, max=65535)
  kdc_ip:              "10.0.1.14"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.process_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": FileVersion
              "#text": "10.0.14393.2580 (rs1_release_inmarket.181009-1745)"
            - "@Name": Description
              "#text": Local Security Authority Process
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": lsass.exe
            - "@Name": CommandLine
              "#text": "C:\\Windows\\system32\\lsass.exe"
            - "@Name": CurrentDirectory
              "#text": "C:\\Windows\\system32\\"
            - "@Name": User
              "#text": "NT AUTHORITY\\SYSTEM"
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": "0x3e7"
            - "@Name": TerminalSessionId
              "#text": 0
            - "@Name": IntegrityLevel
              "#text": System
            - "@Name": Hashes
              "#text": "MD5=5AE8589CDDE46ED132AEF8280BC8894A,SHA256=D957A03C6EA35CBF0C90B0B088DF07E7803A1A3EEB4BA889038F88DB066BBDC4,IMPHASH=0AA67FE637515AC7535797573607EAA2"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": "C:\\Windows\\System32\\wininit.exe"
            - "@Name": ParentCommandLine
              "#text": wininit.exe

  # No wait step: the detection joins the two events within one search
  # window, so both must land in it.
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 3
          Version: 5
          Level: 4
          Task: 3
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.network_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.network_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": User
              "#text": "NT AUTHORITY\\SYSTEM"
            - "@Name": Protocol
              "#text": tcp
            - "@Name": Initiated
              "#text": "true"
            - "@Name": SourceIsIpv6
              "#text": "false"
            - "@Name": SourceIp
              "#text": ref.source_ip
            - "@Name": SourceHostname
              "#text": ref.computer
            - "@Name": SourcePort
              "#text": ref.source_port
            - "@Name": SourcePortName
              "#text": "-"
            - "@Name": DestinationIsIpv6
              "#text": "false"
            - "@Name": DestinationIp
              "#text": ref.kdc_ip
            - "@Name": DestinationHostname
              "#text": "-"
            - "@Name": DestinationPort
              "#text": 88
            - "@Name": DestinationPortName
              "#text": kerberos
