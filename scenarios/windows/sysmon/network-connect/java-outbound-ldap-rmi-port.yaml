type: scenario
description: |
  A Java process opens an outbound connection to an LDAP or RMI port. Sysmon
  EID 1 (Process Create) records a Java runtime, for example the 32-bit
  Oracle Java 8 java.exe, starting a Java server application, for example an
  Apache ActiveMQ broker launched by its activemq.bat script, and Sysmon EID 3
  (Network Connect) records the same process initiating a TCP connection to a
  remote host on an LDAP or RMI port, for example 1389. The events record the
  connection, not what was sent or received over it.
tags: [eid1, eid3]
mitre:
  tactics: [initial-access]
  techniques: [T1190]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  user_name:           Administrator
  user:                "${ref.domain_short}\\${ref.user_name}"
  logon_guid_raw:      gen.uuid()
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=6)
  logon_id:            "0x${ref.logon_id_hex}"
  process_guid_raw:    gen.uuid()
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  parent_guid_raw:     gen.uuid()
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=9999)
  process_record_id:   gen.int(min=5000, max=4999999)
  network_record_id:   gen.int(min=5000000, max=9999999)
  image:               "C:\\Program Files (x86)\\Java\\jre1.8.0_491\\bin\\java.exe"
  command_line:        "\"${ref.image}\"  -Dcom.sun.management.jmxremote  -Xms1G -Xmx1G -Djava.util.logging.config.file=logging.properties -Djava.security.auth.login.config=\"C:\\Users\\${ref.user_name}\\Downloads\\apache-activemq-5.18.1-bin\\apache-activemq-5.18.1\\bin\\..\\conf\\login.config\"  -Dactivemq.classpath=\"C:\\Users\\${ref.user_name}\\Downloads\\apache-activemq-5.18.1-bin\\apache-activemq-5.18.1\\bin\\..\\conf;C:\\Users\\${ref.user_name}\\Downloads\\apache-activemq-5.18.1-bin\\apache-activemq-5.18.1\\bin\\../conf;C:\\Users\\${ref.user_name}\\Downloads\\apache-activemq-5.18.1-bin\\apache-activemq-5.18.1\\bin\\../conf;\" -Dactivemq.home=\"C:\\Users\\${ref.user_name}\\Downloads\\apache-activemq-5.18.1-bin\\apache-activemq-5.18.1\\bin\\..\" -Dactivemq.base=\"C:\\Users\\${ref.user_name}\\Downloads\\apache-activemq-5.18.1-bin\\apache-activemq-5.18.1\\bin\\..\" -Dactivemq.conf=\"C:\\Users\\${ref.user_name}\\Downloads\\apache-activemq-5.18.1-bin\\apache-activemq-5.18.1\\bin\\..\\conf\" -Dactivemq.data=\"C:\\Users\\${ref.user_name}\\Downloads\\apache-activemq-5.18.1-bin\\apache-activemq-5.18.1\\bin\\..\\data\" -Djolokia.conf=\"file:C:\\\\Users\\\\${ref.user_name}\\\\Downloads\\\\apache-activemq-5.18.1-bin\\\\apache-activemq-5.18.1\\\\bin\\\\..\\\\conf\\\\jolokia-access.xml\" -Djava.io.tmpdir=\"C:\\Users\\${ref.user_name}\\Downloads\\apache-activemq-5.18.1-bin\\apache-activemq-5.18.1\\bin\\..\\data\\tmp\" -jar \"C:\\Users\\${ref.user_name}\\Downloads\\apache-activemq-5.18.1-bin\\apache-activemq-5.18.1\\bin\\../bin/activemq.jar\" start"
  current_directory:   "C:\\Users\\${ref.user_name}\\Downloads\\apache-activemq-5.18.1-bin\\apache-activemq-5.18.1\\"
  parent_command_line: "C:\\Windows\\system32\\cmd.exe /c \"\"C:\\Users\\${ref.user_name}\\Downloads\\apache-activemq-5.18.1-bin\\apache-activemq-5.18.1\\bin\\activemq.bat\" start\""
  hashes:              "MD5=292758B05F5245B15FE7FE0984DAE19D,SHA256=3A9A3876484A9F42D342AEF50861B3D645F473E202B7D70BCB280578B7571779,IMPHASH=54F9870E328033CC3FA0AD5D0DD5F9BE"
  parent_image:        "C:\\Windows\\System32\\cmd.exe"
  source_ip:           "10.0.1.15"
  source_port:         gen.port()
  dest_ip:             "10.0.1.16"
  dest_hostname:       ip-10-0-1-16.us-west-2.compute.internal
  dest_port:           1389

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385f-c22a-43e0-bf4c-06f5698ffbd9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.process_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": FileVersion
              "#text": "8.0.4910.10"
            - "@Name": Description
              "#text": "Java(TM) Platform SE binary"
            - "@Name": Product
              "#text": "Java(TM) Platform SE 8"
            - "@Name": Company
              "#text": Oracle Corporation
            - "@Name": OriginalFileName
              "#text": java.exe
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": "2"
            - "@Name": IntegrityLevel
              "#text": High
            - "@Name": Hashes
              "#text": ref.hashes
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": ref.parent_image
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
            - "@Name": ParentUser
              "#text": ref.user

  # No wait step: detections that join the two events on host and process id
  # need both in the same search window.
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 3
          Version: 5
          Level: 4
          Task: 3
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.network_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": User
              "#text": ref.user
            - "@Name": Protocol
              "#text": tcp
            - "@Name": Initiated
              "#text": "true"
            - "@Name": SourceIsIpv6
              "#text": "false"
            - "@Name": SourceIp
              "#text": ref.source_ip
            - "@Name": SourceHostname
              "#text": ref.computer
            - "@Name": SourcePort
              "#text": ref.source_port
            - "@Name": SourcePortName
              "#text": "-"
            - "@Name": DestinationIsIpv6
              "#text": "false"
            - "@Name": DestinationIp
              "#text": ref.dest_ip
            - "@Name": DestinationHostname
              "#text": ref.dest_hostname
            - "@Name": DestinationPort
              "#text": ref.dest_port
            - "@Name": DestinationPortName
              "#text": "-"
