type: scenario
description: |
  A process other than LSASS connects to a domain controller's Kerberos port.
  Sysmon EID 1 (Process Create) records a Kerberos abuse tool, for example
  C:\Tools\Rubeus.exe, started from PowerShell with an asktgt command line
  that asks for a ticket-granting ticket for a named domain account using that
  account's RC4 (NT) hash and for the ticket to be passed into the current
  logon session (/ptt). Sysmon EID 3 (Network Connect) records an outbound TCP
  connection from the same process ID on the same host to port 88 (kerberos)
  on a domain controller. The connection event carries the image
  <unknown process> and an all-zero ProcessGuid, which is how Sysmon logs a
  connection it cannot map to a process image. The events show the request
  being sent, not whether a ticket was issued.
tags: [eid1, eid3, rubeus]
mitre:
  tactics: [defense-evasion, lateral-movement]
  techniques: [T1550]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  network_tid:         gen.int(min=1000, max=9999)
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  parent_guid_raw:     fn.upper(gen.uuid())
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=9999)
  logon_guid_raw:      fn.upper(gen.uuid())
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=5, case=lower)
  logon_id:            "0x${ref.logon_id_hex}"
  username:            gen.username()
  user:                "${ref.domain_short}\\${ref.username}"
  target_user:         gen.username()
  rc4_hash:            gen.hex(len=32, case=lower)
  tool_dir:            "C:\\Tools"
  image:               "${ref.tool_dir}\\Rubeus.exe"
  command_line:        "\"${ref.image}\" asktgt /domain:${ref.domain_fqdn} /user:${ref.target_user} /rc4:${ref.rc4_hash} /ptt"
  current_directory:   "${ref.tool_dir}\\"
  parent_image:        "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe"
  parent_command_line: "\"${ref.parent_image}\" "
  process_record_id:   gen.int(min=5000, max=49999)
  network_record_id:   gen.int(min=50000, max=99999)
  source_ip:           "10.0.1.15"
  source_port:         gen.int(min=49152, max=65535)
  kdc_ip:              "10.0.1.14"
  kdc_hostname:        "ip-10-0-1-14.us-west-2.compute.internal"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.process_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": FileVersion
              "#text": "1.0.0.0"
            - "@Name": Description
              "#text": Rubeus
            - "@Name": Product
              "#text": Rubeus
            - "@Name": Company
              "#text": "-"
            - "@Name": OriginalFileName
              "#text": Rubeus.exe
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": 2
            - "@Name": IntegrityLevel
              "#text": Medium
            - "@Name": Hashes
              "#text": "MD5=ECCFE02363BDC0068F2DAEF326EA356F,SHA256=BE95105C17452B68806C1DE4DF5725A4ADE81A0FB05AEC047AA2C30C633DD05E,IMPHASH=F34D5F2D4577ED6D9CEEC516C1F5A744"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": ref.parent_image
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line
            - "@Name": ParentUser
              "#text": ref.user

  # No wait step: the detection joins the two events within one search
  # window, so both must land in it.
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 3
          Version: 5
          Level: 4
          Task: 3
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.network_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.network_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": "{00000000-0000-0000-0000-000000000000}"
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": "<unknown process>"
            - "@Name": User
              "#text": "-"
            - "@Name": Protocol
              "#text": tcp
            - "@Name": Initiated
              "#text": "true"
            - "@Name": SourceIsIpv6
              "#text": "false"
            - "@Name": SourceIp
              "#text": ref.source_ip
            - "@Name": SourceHostname
              "#text": ref.computer
            - "@Name": SourcePort
              "#text": ref.source_port
            - "@Name": SourcePortName
              "#text": "-"
            - "@Name": DestinationIsIpv6
              "#text": "false"
            - "@Name": DestinationIp
              "#text": ref.kdc_ip
            - "@Name": DestinationHostname
              "#text": ref.kdc_hostname
            - "@Name": DestinationPort
              "#text": 88
            - "@Name": DestinationPortName
              "#text": kerberos
