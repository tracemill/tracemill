type: scenario
description: |
  Microsoft Word starts gpupdate.exe with no command-line arguments, and the
  new process opens an outbound network connection. Sysmon EID 1 (Process
  Create) records WINWORD.EXE, with a macro-enabled template open, starting
  the 32-bit C:\Windows\SysWOW64\gpupdate.exe with a command line that is
  only its image path. Sysmon EID 3 (Network Connect) records the same
  process opening an outbound TCP connection to a public address on port
  443, for example 34.218.235.219. The events record the launch and the
  connection, not what code ran inside the process.
tags: [eid1, eid3, cobalt-strike]
mitre:
  tactics: [defense-evasion]
  techniques: [T1055]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  process_sysmon_tid:  gen.int(min=1000, max=9999)
  network_sysmon_tid:  gen.int(min=1000, max=9999)
  user_name:           gen.username()
  user:                "${ref.domain_short}\\${ref.user_name}"
  logon_guid_raw:      fn.upper(gen.uuid())
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id_hex:        gen.hex(len=5)
  logon_id:            "0x${ref.logon_id_hex}"
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  parent_guid_raw:     fn.upper(gen.uuid())
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=9999)
  process_record_id:   gen.int(min=5000, max=4999999)
  network_record_id:   gen.int(min=5000000, max=9999999)
  current_directory:   "C:\\Users\\${ref.user_name}\\AppData\\Roaming\\Microsoft\\Templates\\"
  parent_command_line: "\"C:\\Program Files\\Microsoft Office\\Root\\Office16\\WINWORD.EXE\" /n /f \"C:\\Users\\${ref.user_name}\\Desktop\\cs_doc1_rundll32.dotm\""
  source_ip_octet:     gen.int(min=10, max=250)
  source_ip:           "10.0.1.${ref.source_ip_octet}"
  source_port:         gen.int(min=49152, max=65535)
  dest_ip:             "34.218.235.219"
  dest_hostname:       "ec2-34-218-235-219.us-west-2.compute.amazonaws.com"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.process_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.process_sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": "C:\\Windows\\SysWOW64\\gpupdate.exe"
            - "@Name": FileVersion
              "#text": "10.0.14393.3986 (rs1_release.201002-1707)"
            - "@Name": Description
              "#text": "Microsoft® Group Policy Update Utility"
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": GPUpdate.exe
            - "@Name": CommandLine
              "#text": "C:\\Windows\\SysWOW64\\gpupdate.exe"
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": 2
            - "@Name": IntegrityLevel
              "#text": High
            - "@Name": Hashes
              "#text": "MD5=11718C7688951810F480208782DDC28F,SHA256=F531B0C8BCEA7456FB863389AE86CE7DB0DE7596D5DEC6E16F702045296E56E7,IMPHASH=638C52EA09848BE6F51AB625D0D2305D"
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": "C:\\Program Files\\Microsoft Office\\root\\Office16\\WINWORD.EXE"
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line

  # No wait step: detections that pair the two events by time bucket need
  # both in the same bucket.
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 3
          Version: 5
          Level: 4
          Task: 3
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.network_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.network_sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": "C:\\Windows\\SysWOW64\\gpupdate.exe"
            - "@Name": User
              "#text": ref.user
            - "@Name": Protocol
              "#text": tcp
            - "@Name": Initiated
              "#text": "true"
            - "@Name": SourceIsIpv6
              "#text": "false"
            - "@Name": SourceIp
              "#text": ref.source_ip
            - "@Name": SourceHostname
              "#text": ref.computer
            - "@Name": SourcePort
              "#text": ref.source_port
            - "@Name": SourcePortName
              "#text": "-"
            - "@Name": DestinationIsIpv6
              "#text": "false"
            - "@Name": DestinationIp
              "#text": ref.dest_ip
            - "@Name": DestinationHostname
              "#text": ref.dest_hostname
            - "@Name": DestinationPort
              "#text": 443
            - "@Name": DestinationPortName
              "#text": https
