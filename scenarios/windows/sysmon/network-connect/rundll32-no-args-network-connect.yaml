type: scenario
description: |
  rundll32.exe starts with no arguments and then connects out. Sysmon EID 1
  (Process Create) records rundll32.exe, for example
  C:\Windows\System32\rundll32.exe, launching with a command line that is
  only its own path, started by a parent process, for example a service
  executable run from the ADMIN$ share. Sysmon EID 3 (Network Connect) then
  records the same process, by process ID and process GUID, opening an
  outbound TCP connection, for example to port 443 on a cloud-hosted
  address. The events record the launch and the connection, not what code
  ran inside the process.
tags: [eid1, eid3, cobalt-strike]
mitre:
  tactics: [defense-evasion]
  techniques: [T1218.011]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  network_sysmon_tid:  gen.int(min=1000, max=9999)
  process_guid_raw:    fn.upper(gen.uuid())
  process_guid:        "{${ref.process_guid_raw}}"
  process_id:          gen.int(min=1000, max=9999)
  parent_guid_raw:     fn.upper(gen.uuid())
  parent_process_guid: "{${ref.parent_guid_raw}}"
  parent_process_id:   gen.int(min=1000, max=9999)
  logon_guid_raw:      fn.upper(gen.uuid())
  logon_guid:          "{${ref.logon_guid_raw}}"
  logon_id:            "0x3e7"
  terminal_session_id: 0
  integrity_level:     System
  user:                "NT AUTHORITY\\SYSTEM"
  current_directory:   "C:\\Windows\\system32\\"
  image:               "C:\\Windows\\System32\\rundll32.exe"
  command_line:        ref.image
  hashes:              "MD5=23DB802097F7B7E520E40068A7E68B14,SHA256=28DE7D3E8BF4B19E44063A4BFC2E7C30AE488CD9A1F63320ED374E14AAECA667,IMPHASH=7D1CE1BAFE48B63D9D19E8E0E5DF3E6C"
  parent_image:        "\\\\127.0.0.1\\ADMIN$\\dcf35e4.exe"
  parent_command_line: ref.parent_image
  event_record_id:     gen.int(min=5000, max=49999)
  network_record_id:   gen.int(min=50000, max=99999)
  source_ip_octet:     gen.int(min=10, max=250)
  source_ip:           "10.0.1.${ref.source_ip_octet}"
  source_port:         gen.int(min=49152, max=65535)
  dest_ip:             "34.218.235.219"
  dest_hostname:       "ec2-34-218-235-219.us-west-2.compute.amazonaws.com"
  dest_port:           443
  dest_port_name:      https

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 1
          Version: 5
          Level: 4
          Task: 1
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": FileVersion
              "#text": "10.0.14393.4169 (rs1_release.210107-1130)"
            - "@Name": Description
              "#text": "Windows host process (Rundll32)"
            - "@Name": Product
              "#text": "Microsoft® Windows® Operating System"
            - "@Name": Company
              "#text": Microsoft Corporation
            - "@Name": OriginalFileName
              "#text": RUNDLL32.EXE
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": CurrentDirectory
              "#text": ref.current_directory
            - "@Name": User
              "#text": ref.user
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": LogonId
              "#text": ref.logon_id
            - "@Name": TerminalSessionId
              "#text": ref.terminal_session_id
            - "@Name": IntegrityLevel
              "#text": ref.integrity_level
            - "@Name": Hashes
              "#text": ref.hashes
            - "@Name": ParentProcessGuid
              "#text": ref.parent_process_guid
            - "@Name": ParentProcessId
              "#text": ref.parent_process_id
            - "@Name": ParentImage
              "#text": ref.parent_image
            - "@Name": ParentCommandLine
              "#text": ref.parent_command_line

  # No wait step: detections that join the two events by process need both in
  # the same search window.
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Sysmon
            "@Guid": "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
          EventID: 3
          Version: 5
          Level: 4
          Task: 3
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.network_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.sysmon_pid
            "@ThreadID": ref.network_sysmon_tid
          Channel: Microsoft-Windows-Sysmon/Operational
          Computer: ref.computer
          Security:
            "@UserID": S-1-5-18
        EventData:
          Data:
            - "@Name": RuleName
              "#text": "-"
            - "@Name": UtcTime
              "#text": gen.timestamp(format=sysmon)
            - "@Name": ProcessGuid
              "#text": ref.process_guid
            - "@Name": ProcessId
              "#text": ref.process_id
            - "@Name": Image
              "#text": ref.image
            - "@Name": User
              "#text": ref.user
            - "@Name": Protocol
              "#text": tcp
            - "@Name": Initiated
              "#text": "true"
            - "@Name": SourceIsIpv6
              "#text": "false"
            - "@Name": SourceIp
              "#text": ref.source_ip
            - "@Name": SourceHostname
              "#text": ref.computer
            - "@Name": SourcePort
              "#text": ref.source_port
            - "@Name": SourcePortName
              "#text": "-"
            - "@Name": DestinationIsIpv6
              "#text": "false"
            - "@Name": DestinationIp
              "#text": ref.dest_ip
            - "@Name": DestinationHostname
              "#text": ref.dest_hostname
            - "@Name": DestinationPort
              "#text": ref.dest_port
            - "@Name": DestinationPortName
              "#text": ref.dest_port_name
