type: scenario
description: |
  The system audit policy for one audit subcategory is changed under the
  local SYSTEM account. Security EID 4719 (System audit policy was changed)
  records the computer account, with the SYSTEM security ID and logon ID
  0x3e7, changing the auditing of a subcategory, for example Process
  Creation, named by its category and subcategory IDs and its subcategory
  GUID. The change list records what changed, for example %%8448, %%8450
  (success removed, failure removed). This version of the event carries no
  client process fields.
tags: [eid4719]
mitre:
  tactics: [defense-impairment]
  techniques: [T1685]

state:
  domain_short:         CORP
  domain_tld:           local
  domain_short_lower:   fn.lower(ref.domain_short)
  domain_fqdn:          "${ref.domain_short_lower}.${ref.domain_tld}"
  host_short:           gen.hostname(class=windows-server)
  host_short_lower:     fn.lower(ref.host_short)
  host_short_upper:     fn.upper(ref.host_short)
  computer:             "${ref.host_short_lower}.${ref.domain_fqdn}"
  machine_account:      "${ref.host_short_upper}$"
  category_id:          "%%8276"
  subcategory_id:       "%%13312"
  subcategory_guid:     "{0CCE922B-69AE-11D9-BED3-505054503030}"
  audit_policy_changes: "%%8448, %%8450"
  activity_id_raw:      fn.upper(gen.uuid())
  activity_id:          "{${ref.activity_id_raw}}"
  lsa_pid:              gen.int(min=500, max=900)
  lsa_tid:              gen.int(min=500, max=4000)
  event_record_id:      gen.int(min=200000, max=999999)

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Security-Auditing
            "@Guid": "{54849625-5478-4994-A5BA-3E3B0328C30D}"
          EventID: 4719
          Version: 0
          Level: 0
          Task: 13568
          Opcode: 0
          Keywords: "0x8020000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation:
            "@ActivityID": ref.activity_id
          Execution:
            "@ProcessID": ref.lsa_pid
            "@ThreadID": ref.lsa_tid
          Channel: Security
          Computer: ref.computer
          Security: {}
        EventData:
          Data:
            - "@Name": SubjectUserSid
              "#text": "NT AUTHORITY\\SYSTEM"
            - "@Name": SubjectUserName
              "#text": ref.machine_account
            - "@Name": SubjectDomainName
              "#text": ref.domain_short
            - "@Name": SubjectLogonId
              "#text": "0x3e7"
            - "@Name": CategoryId
              "#text": ref.category_id
            - "@Name": SubcategoryId
              "#text": ref.subcategory_id
            - "@Name": SubcategoryGuid
              "#text": ref.subcategory_guid
            - "@Name": AuditPolicyChanges
              "#text": ref.audit_policy_changes
