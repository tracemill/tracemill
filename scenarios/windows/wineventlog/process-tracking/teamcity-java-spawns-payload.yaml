type: scenario
description: |
  The Java runtime bundled with JetBrains TeamCity starts another Java
  process that runs a payload class from a temporary spawn folder, the way
  Metasploit's Java payload relaunches itself. Windows Security EID 4688
  (Process Creation) records the computer account, with the SYSTEM security
  ID and logon ID 0x3e7, starting C:\TeamCity\jre\bin\java.exe from a parent
  java.exe at the same path, with `-classpath` set to a
  `~spawn<digits>.tmp.dir` folder under C:\Windows\TEMP and a main class whose
  name ends in `.Payload`, for example YtnERCQyHb.Payload. The new process
  has the System mandatory label. The event records the launch and its
  command line, not how the payload reached the server or what it did next.
tags: [eid4688, metasploit]
mitre:
  tactics: [persistence]
  techniques: [T1505.003]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  host_short:          gen.hostname(class=windows-server)
  host_short_lower:    fn.lower(ref.host_short)
  host_short_upper:    fn.upper(ref.host_short)
  computer:            "${ref.host_short_lower}.${ref.domain_fqdn}"
  machine_account:     "${ref.host_short_upper}$"
  event_record_id:     gen.int(min=5000, max=999999)
  thread_id:           gen.int(min=1000, max=9999)
  process_id:          gen.regex(pattern=0x[1-9a-f][0-9a-f]{2}[048c])
  parent_process_id:   gen.regex(pattern=0x[1-9a-f][0-9a-f]{2}[048c])
  payload_class:       YtnERCQyHb.Payload
  spawn_id:            "5413030552937782312"
  command_line:        'c:\TeamCity\jre\bin\java.exe -classpath C:\Windows\TEMP\~spawn${ref.spawn_id}.tmp.dir ${ref.payload_class}'

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Security-Auditing
            "@Guid": "{54849625-5478-4994-A5BA-3E3B0328C30D}"
          EventID: 4688
          Version: 2
          Level: 0
          Task: 13312
          Opcode: 0
          Keywords: "0x8020000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": 4
            "@ThreadID": ref.thread_id
          Channel: Security
          Computer: ref.computer
          Security: {}
        EventData:
          Data:
            - "@Name": SubjectUserSid
              "#text": S-1-5-18
            - "@Name": SubjectUserName
              "#text": ref.machine_account
            - "@Name": SubjectDomainName
              "#text": ref.domain_short
            - "@Name": SubjectLogonId
              "#text": "0x3e7"
            - "@Name": NewProcessId
              "#text": ref.process_id
            - "@Name": NewProcessName
              "#text": "C:\\TeamCity\\jre\\bin\\java.exe"
            - "@Name": TokenElevationType
              "#text": "%%1936"
            - "@Name": ProcessId
              "#text": ref.parent_process_id
            - "@Name": CommandLine
              "#text": ref.command_line
            - "@Name": TargetUserSid
              "#text": S-1-0-0
            - "@Name": TargetUserName
              "#text": "-"
            - "@Name": TargetDomainName
              "#text": "-"
            - "@Name": TargetLogonId
              "#text": "0x0"
            - "@Name": ParentProcessName
              "#text": "C:\\TeamCity\\jre\\bin\\java.exe"
            - "@Name": MandatoryLabel
              "#text": S-1-16-16384
