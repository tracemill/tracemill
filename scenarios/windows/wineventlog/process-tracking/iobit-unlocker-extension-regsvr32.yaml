type: scenario
description: |
  The IObit Unlocker setup program registers the IObitUnlockerExtension.dll
  library with regsvr32. Windows Security EID 4688 (Process Creation)
  records unlocker-setup.tmp, running from an is-*.tmp folder in the user's
  Temp directory, starting C:\Windows\SysWOW64\regsvr32.exe with /s (silent
  mode) and the path C:\Program Files (x86)\IObit\IObit
  Unlocker\IObitUnlockerExtension.dll. The command line names
  C:\Windows\system32\regsvr32.exe; the new process image is the 32-bit copy
  in SysWOW64 that file system redirection gives a 32-bit parent. The new
  process has a full elevated token and the High mandatory label. The event
  records the registration command, not whether the registration succeeded.
tags: [eid4688, iobit-unlocker]
mitre:
  tactics: [defense-evasion]
  techniques: [T1218.010]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  host_short:          gen.hostname(class=windows-workstation)
  host_short_upper:    fn.upper(ref.host_short)
  computer:            "${ref.host_short_upper}.${ref.domain_fqdn}"
  user_name:           gen.username()
  sid_a:               gen.int(min=1000000000, max=2147483647)
  sid_b:               gen.int(min=10000000, max=2147483647)
  sid_c:               gen.int(min=1000000000, max=2147483647)
  user_rid:            gen.int(min=1000, max=1099)
  user_sid:            "S-1-5-21-${ref.sid_a}-${ref.sid_b}-${ref.sid_c}-${ref.user_rid}"
  logon_id:            gen.regex(pattern=0x[1-9a-f][0-9a-f]{4})
  event_record_id:     gen.int(min=5000, max=9999999)
  thread_id:           gen.int(min=100, max=9999)
  process_id:          gen.regex(pattern=0x[1-9a-f][0-9a-f]{2}[048c])
  parent_process_id:   gen.regex(pattern=0x[1-9a-f][0-9a-f]{1,2}[048c])
  setup_tmp_id:        gen.regex(pattern=[0-9A-Z]{5})
  setup_path:          "C:\\Users\\${ref.user_name}\\AppData\\Local\\Temp\\is-${ref.setup_tmp_id}.tmp\\unlocker-setup.tmp"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Security-Auditing
            "@Guid": "{54849625-5478-4994-A5BA-3E3B0328C30D}"
          EventID: 4688
          Version: 2
          Level: 0
          Task: 13312
          Opcode: 0
          Keywords: "0x8020000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": 4
            "@ThreadID": ref.thread_id
          Channel: Security
          Computer: ref.computer
          Security: {}
        EventData:
          Data:
            - "@Name": SubjectUserSid
              "#text": ref.user_sid
            - "@Name": SubjectUserName
              "#text": ref.user_name
            - "@Name": SubjectDomainName
              "#text": ref.host_short_upper
            - "@Name": SubjectLogonId
              "#text": ref.logon_id
            - "@Name": NewProcessId
              "#text": ref.process_id
            - "@Name": NewProcessName
              "#text": "C:\\Windows\\SysWOW64\\regsvr32.exe"
            - "@Name": TokenElevationType
              "#text": "%%1937"
            - "@Name": ProcessId
              "#text": ref.parent_process_id
            - "@Name": CommandLine
              "#text": '"C:\Windows\system32\regsvr32.exe" /s "C:\Program Files (x86)\IObit\IObit Unlocker\IObitUnlockerExtension.dll"'
            - "@Name": TargetUserSid
              "#text": S-1-0-0
            - "@Name": TargetUserName
              "#text": "-"
            - "@Name": TargetDomainName
              "#text": "-"
            - "@Name": TargetLogonId
              "#text": "0x0"
            - "@Name": ParentProcessName
              "#text": ref.setup_path
            - "@Name": MandatoryLabel
              "#text": S-1-16-12288
