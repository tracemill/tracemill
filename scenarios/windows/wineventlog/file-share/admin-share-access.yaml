type: scenario
description: |
  Windows file-share access event (EventID 5140, Security channel): a
  remote client reaching an administrative share. ShareName defaults to
  IPC$; override to \\*\ADMIN$ or \\*\C$ for the disk shares. AccessMask
  0x1 / AccessList %%4416 model a read/list access.
tags: [eid5140]
mitre:
  tactics: [discovery]
  techniques: ["T1135"]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  # Generator so a burst job's iterations yield distinct target hosts --
  # the distinct-target count is what the multi-host detection keys on.
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  # A burst job pins these in job state so the burst shares one
  # (source, account) pair.
  src_ip:             gen.ipv4()
  subject_user:       gen.username()
  # Placeholder domain SID base; the account SID is this plus a RID.
  domain_sid:         "S-1-5-21-1004336348-1177238915-682003330"
  subject_rid:        gen.int(min=1104, max=4999)
  subject_sid:        "${ref.domain_sid}-${ref.subject_rid}"
  logon_id_hex:       gen.hex(len=6, case=lower)
  logon_id:           "0x${ref.logon_id_hex}"
  share_name:         '\\*\IPC$'
  src_port:           gen.int(min=49152, max=65535)
  thread_id:          gen.int(min=1000, max=5000)
  event_record_id:    gen.int(min=100000, max=999999)

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Security-Auditing
            "@Guid": "{54849625-5478-4994-A5BA-3E3B0328C30D}"
          EventID: 5140
          Version: 1
          Level: 0
          Task: 12808
          Opcode: 0
          # 0x8020000000000000 = Audit Success.
          Keywords: "0x8020000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          # ProcessID 4 = the System process; the SMB server serves share
          # access from kernel context.
          Execution:
            "@ProcessID": 4
            "@ThreadID": ref.thread_id
          Channel: Security
          Computer: ref.computer
          Security: {}
        EventData:
          Data:
            - "@Name": SubjectUserSid
              "#text": ref.subject_sid
            - "@Name": SubjectUserName
              "#text": ref.subject_user
            - "@Name": SubjectDomainName
              "#text": ref.domain_short
            - "@Name": SubjectLogonId
              "#text": ref.logon_id
            - "@Name": ObjectType
              "#text": File
            - "@Name": IpAddress
              "#text": ref.src_ip
            - "@Name": IpPort
              "#text": ref.src_port
            - "@Name": ShareName
              "#text": ref.share_name
            - "@Name": ShareLocalPath
              "#text": ""
            - "@Name": AccessMask
              "#text": "0x1"
            - "@Name": AccessList
              "#text": "%%4416"
