type: scenario
description: |
  An account starts a backup of a certification authority. Security EID 4876
  (Certificate Services backup started) records the backup on the server that
  runs Active Directory Certificate Services, with the account that started
  it, for example administrator, its domain, SID and logon ID, and the backup
  type. The event records that the backup started, not where the backup was
  written or whether it completed.
tags: [eid4876]
mitre:
  tactics: [credential-access]
  techniques: [T1649]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  domain_sid:         "S-1-5-21-111222333-444555666-777888999"
  subject_user:       administrator
  subject_sid:        "${ref.domain_sid}-500"
  logon_id_hex:       gen.hex(len=5, case=lower)
  logon_id:           "0x${ref.logon_id_hex}"
  activity_guid_raw:  fn.upper(gen.uuid())
  activity_guid:      "{${ref.activity_guid_raw}}"
  lsass_pid:          gen.int(min=500, max=900)
  thread_id:          gen.int(min=200, max=5000)
  event_record_id:    gen.int(min=1000, max=99999)

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Security-Auditing
            "@Guid": "{54849625-5478-4994-A5BA-3E3B0328C30D}"
          EventID: 4876
          Version: 0
          Level: 0
          Task: 12805
          Opcode: 0
          Keywords: "0x8020000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation:
            "@ActivityID": ref.activity_guid
          Execution:
            "@ProcessID": ref.lsass_pid
            "@ThreadID": ref.thread_id
          Channel: Security
          Computer: ref.computer
          Security: {}
        EventData:
          Data:
            - "@Name": BackupType
              "#text": "1"
            - "@Name": SubjectUserSid
              "#text": ref.subject_sid
            - "@Name": SubjectUserName
              "#text": ref.subject_user
            - "@Name": SubjectDomainName
              "#text": ref.domain_short
            - "@Name": SubjectLogonId
              "#text": ref.logon_id
