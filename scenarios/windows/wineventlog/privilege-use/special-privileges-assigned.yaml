type: scenario
description: |
  An account receives administrative privileges at logon on a host. Security
  EventID 4672 (Special privileges assigned to new logon) records a domain
  account, for example jsmith in the CORP domain, being granted sensitive
  privileges on a computer, for example SeDebugPrivilege, SeBackupPrivilege,
  SeTakeOwnershipPrivilege and SeImpersonatePrivilege. Windows logs this event
  on the host whenever a new logon is assigned any of these sensitive
  privileges, which is the case for an administrator-equivalent account.
tags: [eid4672]
mitre:
  tactics: [defense-evasion, persistence, privilege-escalation]
  techniques: ["T1078"]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  subject_user:       gen.username()
  # The Security-channel WinEventLog input resolves SID fields to DOMAIN\account
  # before indexing.
  subject_sid:        "${ref.domain_short}\\${ref.subject_user}"
  logon_id_hex:       gen.hex(len=6, case=lower)
  logon_id:           "0x${ref.logon_id_hex}"
  privilege_list:     "SeSecurityPrivilege\r\n\t\t\tSeBackupPrivilege\r\n\t\t\tSeRestorePrivilege\r\n\t\t\tSeTakeOwnershipPrivilege\r\n\t\t\tSeDebugPrivilege\r\n\t\t\tSeSystemEnvironmentPrivilege\r\n\t\t\tSeLoadDriverPrivilege\r\n\t\t\tSeImpersonatePrivilege\r\n\t\t\tSeDelegateSessionUserImpersonatePrivilege"
  activity_id:        fn.upper(gen.uuid())
  proc_id:            gen.int(min=500, max=900)
  thread_id:          gen.int(min=500, max=8000)
  event_record_id:    gen.int(min=200000, max=999999)

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Security-Auditing
            "@Guid": "{54849625-5478-4994-A5BA-3E3B0328C30D}"
          EventID: 4672
          Version: 0
          Level: 0
          Task: 12548
          Opcode: 0
          Keywords: "0x8020000000000000"   # Audit Success
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation:
            "@ActivityID": "{${ref.activity_id}}"
          Execution:
            "@ProcessID": ref.proc_id
            "@ThreadID": ref.thread_id
          Channel: Security
          Computer: ref.computer
          Security: {}
        EventData:
          Data:
            - {"@Name": SubjectUserSid, "#text": ref.subject_sid}
            - {"@Name": SubjectUserName, "#text": ref.subject_user}
            - {"@Name": SubjectDomainName, "#text": ref.domain_short}
            - {"@Name": SubjectLogonId, "#text": ref.logon_id}
            - {"@Name": PrivilegeList, "#text": ref.privilege_list}
