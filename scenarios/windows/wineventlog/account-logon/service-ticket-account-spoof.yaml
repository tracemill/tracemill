type: scenario
description: |
  A Kerberos service-ticket request (EventID 4769) whose ServiceName equals the
  requesting account's own name -- a machine account (name ending in $) asking
  the KDC for a ticket to a service named identically to itself. That self-
  reference is the observable artifact of sAMAccountName-spoofing / domain-
  controller impersonation (CVE-2021-42278, CVE-2021-42287), where a renamed
  computer account obtains a ticket in a higher-privileged context. Loop it in a
  job to model a burst.
tags: [eid4769, cve-2021-42278, cve-2021-42287]
mitre:
  tactics: [privilege-escalation]
  techniques: ["T1078.002"]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  domain_realm:        fn.upper(ref.domain_fqdn)              # Kerberos realm: uppercase FQDN
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  spoofed_host:        gen.hostname(class=windows-server)
  spoofed_machine:     fn.upper(ref.spoofed_host)
  spoofed_account:     "${ref.spoofed_machine}$"
  # ServiceName equals the pre-@ segment of client_principal -- both are
  # spoofed_account -- which is the equality the detection fires on.
  client_principal:    "${ref.spoofed_account}@${ref.domain_realm}"
  # ServiceSid renders as DOMAIN\account: the WinEventLog input resolves the SID
  # to the account name on ingest, matching real 4769 telemetry.
  service_sid:         "${ref.domain_short}\\${ref.spoofed_account}"
  src_ip:              gen.ipv4()
  ip_address:          "::ffff:${ref.src_ip}"                 # KDC logs the client as an IPv4-mapped IPv6 literal
  src_port:            gen.int(min=49152, max=65535)
  logon_guid_raw:      fn.lower(gen.uuid())
  logon_guid:          "{${ref.logon_guid_raw}}"
  proc_id:             gen.int(min=600, max=900)
  thread_id:           gen.int(min=1000, max=4000)
  event_record_id:     gen.int(min=200000, max=999999)

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Security-Auditing
            "@Guid": "{54849625-5478-4994-A5BA-3E3B0328C30D}"
          EventID: 4769
          Version: 0
          Level: 0
          Task: 14337                      # Kerberos Service Ticket Operations
          Opcode: 0
          Keywords: "0x8020000000000000"   # Audit Success
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.proc_id
            "@ThreadID": ref.thread_id
          Channel: Security
          Computer: ref.computer
          Security: {}
        EventData:
          Data:
            - "@Name": TargetUserName
              "#text": ref.client_principal
            - "@Name": TargetDomainName
              "#text": ref.domain_realm
            - "@Name": ServiceName
              "#text": ref.spoofed_account
            - "@Name": ServiceSid
              "#text": ref.service_sid
            - "@Name": TicketOptions
              "#text": "0x40810000"
            - "@Name": TicketEncryptionType
              "#text": "0x12"             # AES256-CTS-HMAC-SHA1-96
            - "@Name": IpAddress
              "#text": ref.ip_address
            - "@Name": IpPort
              "#text": ref.src_port
            - "@Name": Status
              "#text": "0x0"
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": TransmittedServices
              "#text": "-"
