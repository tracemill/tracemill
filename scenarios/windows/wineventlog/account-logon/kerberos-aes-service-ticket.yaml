type: scenario
description: |
  A routine Kerberos service-ticket request (EventID 4769) for a service
  account, negotiating AES256-HMAC encryption (TicketEncryptionType 0x12) --
  the default on a modern Active Directory domain. Represents normal Kerberos
  activity that must not be mistaken for a Kerberoasting SPN request, which is
  distinguished by RC4-HMAC (0x17) rather than AES.
tags: [eid4769]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  domain_realm:       fn.upper(ref.domain_fqdn)
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  requesting_user:    gen.username()
  requesting_principal: "${ref.requesting_user}@${ref.domain_realm}"
  service_account:    gen.username()
  service_sid:        "${ref.domain_short}\\${ref.service_account}"
  src_ip:             gen.ipv4()
  ip_address:         "::ffff:${ref.src_ip}"
  src_port:           gen.int(min=49152, max=65535)
  logon_guid_raw:     fn.lower(gen.uuid())
  logon_guid:         "{${ref.logon_guid_raw}}"
  proc_id:            gen.int(min=600, max=900)
  thread_id:          gen.int(min=1000, max=4000)
  event_record_id:    gen.int(min=200000, max=999999)

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Security-Auditing
            "@Guid": "{54849625-5478-4994-A5BA-3E3B0328C30D}"
          EventID: 4769
          Version: 0
          Level: 0
          Task: 14337
          Opcode: 0
          Keywords: "0x8020000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.proc_id
            "@ThreadID": ref.thread_id
          Channel: Security
          Computer: ref.computer
          Security: {}
        EventData:
          Data:
            - "@Name": TargetUserName
              "#text": ref.requesting_principal
            - "@Name": TargetDomainName
              "#text": ref.domain_realm
            - "@Name": ServiceName
              "#text": ref.service_account
            - "@Name": ServiceSid
              "#text": ref.service_sid
            - "@Name": TicketOptions
              "#text": "0x40810000"
            - "@Name": TicketEncryptionType
              "#text": "0x12"             # AES256-HMAC (normal)
            - "@Name": IpAddress
              "#text": ref.ip_address
            - "@Name": IpPort
              "#text": ref.src_port
            - "@Name": Status
              "#text": "0x0"
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": TransmittedServices
              "#text": "-"
