type: scenario
description: |
  Single Kerberos AS-REQ (TGT request) failure on the Security channel:
  EventID 4768, failure code 0x12 (KDC_ERR_CLIENT_REVOKED) -- a domain
  controller rejecting a ticket request for a disabled or revoked account.
  One run = one 4768; loop it in a job to spray many accounts from a single
  source. Machine-account requests (names ending in $) are out of scope --
  the generated username never carries a trailing $.
tags: [eid4768]
mitre:
  tactics: [credential-access]
  techniques: ["T1110.003"]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)  # the DC (KDC)
  krbtgt_service:     "krbtgt/${ref.domain_fqdn}"
  target_user:        gen.username()
  # KDC logs the client address as an IPv4-mapped IPv6 literal.
  src_ip:             gen.ipv4()
  ip_address:         "::ffff:${ref.src_ip}"
  src_port:           gen.int(min=49152, max=65535)
  proc_id:            gen.int(min=600, max=900)
  thread_id:          gen.int(min=1000, max=4000)
  event_record_id:    gen.int(min=200000, max=999999)

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Security-Auditing
            "@Guid": "{54849625-5478-4994-A5BA-3E3B0328C30D}"
          EventID: 4768
          Version: 0
          Level: 0
          Task: 14339                      # Kerberos Authentication Service
          Opcode: 0
          Keywords: "0x8010000000000000"   # Audit Failure
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.proc_id
            "@ThreadID": ref.thread_id
          Channel: Security
          Computer: ref.computer
          Security: {}
        EventData:
          Data:
            - "@Name": TargetUserName
              "#text": ref.target_user
            - "@Name": TargetDomainName
              "#text": ref.domain_fqdn
            - "@Name": TargetSid
              "#text": "NULL SID"
            - "@Name": ServiceName
              "#text": ref.krbtgt_service
            - "@Name": ServiceSid
              "#text": "NULL SID"
            - "@Name": TicketOptions
              "#text": "0x40810010"
            - "@Name": Status
              "#text": "0x12"
            - "@Name": TicketEncryptionType
              "#text": "0xffffffff"
            - "@Name": PreAuthType
              "#text": "-"
            - "@Name": IpAddress
              "#text": ref.ip_address
            - "@Name": IpPort
              "#text": ref.src_port
            - "@Name": CertIssuerName
              "#text": ""
            - "@Name": CertSerialNumber
              "#text": ""
            - "@Name": CertThumbprint
              "#text": ""
