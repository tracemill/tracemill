type: scenario
description: |
  An NTLM credential-validation failure (EventID 4776) logged by the
  authenticating server, carrying the account name, the originating workstation,
  and a status code for why validation failed -- 0xC0000064 (account does not
  exist) or 0xC000006A (bad password). A burst of many distinct account names
  failing from one workstation in a short window is the signature of a password
  spray. Loop it in a job -- varying the account name, holding the workstation
  constant -- to model the sweep.
tags: [eid4776]
mitre:
  tactics: [credential-access]
  techniques: ["T1110.003"]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  workstation:         gen.hostname(class=windows-workstation)
  workstation_upper:   fn.upper(ref.workstation)
  target_user:         gen.username()
  target_user_upper:   fn.upper(ref.target_user)
  status:              "0xc0000064"            # bad-username default; jobs bind 0xc000006a for bad-password
  package_name:        MICROSOFT_AUTHENTICATION_PACKAGE_V1_0
  proc_id:             gen.int(min=500, max=900)
  thread_id:           gen.int(min=1000, max=8000)
  event_record_id:     gen.int(min=200000, max=999999)

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Security-Auditing
            "@Guid": "{54849625-5478-4994-A5BA-3E3B0328C30D}"
          EventID: 4776
          Version: 0
          Level: 0
          Task: 14336                      # Credential Validation
          Opcode: 0
          Keywords: "0x8010000000000000"   # Audit Failure
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.proc_id
            "@ThreadID": ref.thread_id
          Channel: Security
          Computer: ref.computer
          Security: {}
        EventData:
          Data:
            - "@Name": PackageName
              "#text": ref.package_name
            - "@Name": TargetUserName
              "#text": ref.target_user_upper
            - "@Name": Workstation
              "#text": ref.workstation_upper
            - "@Name": Status
              "#text": ref.status
