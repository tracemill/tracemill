type: scenario
description: |
  A single Kerberos service-ticket request (EventID 4769) that selects RC4-HMAC
  encryption (TicketEncryptionType 0x17) for a machine-account service (name
  ending in $). RC4 for service tickets is rare on modern domains, where AES128
  or AES256 is the default; a Ticket-Granting Ticket forged from an account's
  NTLM hash yields RC4-encrypted service-ticket requests, making this pattern an
  indicator of a forged (Golden) Kerberos ticket. One run = one 4769 logged by
  the domain controller; the encryption type and the machine-account service
  name are what a detection keys on. Loop it in a job to model a burst of
  service-ticket requests.
tags: [eid4769]
mitre:
  tactics: [credential-access]
  techniques: ["T1558.001"]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  domain_realm:        fn.upper(ref.domain_fqdn)                              # Kerberos realm: uppercase FQDN
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)  # the DC (KDC) that logs the request
  service_host:        gen.hostname(class=windows-server)                    # short name of the machine-account service
  service_machine:     fn.upper(ref.service_host)
  service_account:     "${ref.service_machine}$"                             # machine account (name ends in $)
  service_principal:   "${ref.service_account}@${ref.domain_realm}"          # requesting client principal (SAM@REALM)
  # ServiceSid renders as DOMAIN\account, not a raw SID: the Splunk WinEventLog input resolves the SID to the
  # account name on ingest, matching the real 4769 attack_data master (ServiceSid = ATTACKRANGE\AR-WIN-2$).
  service_sid:         "${ref.domain_short}\\${ref.service_account}"         # DOMAIN\MACHINE$
  # KDC logs the client address as an IPv4-mapped IPv6 literal.
  src_ip:              gen.ipv4()
  ip_address:          "::ffff:${ref.src_ip}"
  src_port:            gen.int(min=49152, max=65535)
  logon_guid_raw:      fn.lower(gen.uuid())
  logon_guid:          "{${ref.logon_guid_raw}}"
  proc_id:             gen.int(min=600, max=900)
  thread_id:           gen.int(min=1000, max=4000)
  event_record_id:     gen.int(min=200000, max=999999)

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Security-Auditing
            "@Guid": "{54849625-5478-4994-A5BA-3E3B0328C30D}"
          EventID: 4769
          Version: 0
          Level: 0
          Task: 14337                      # Kerberos Service Ticket Operations
          Opcode: 0
          Keywords: "0x8020000000000000"   # Audit Success
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.proc_id
            "@ThreadID": ref.thread_id
          Channel: Security
          Computer: ref.computer
          Security: {}
        EventData:
          Data:
            - "@Name": TargetUserName
              "#text": ref.service_principal
            - "@Name": TargetDomainName
              "#text": ref.domain_realm
            - "@Name": ServiceName
              "#text": ref.service_account
            - "@Name": ServiceSid
              "#text": ref.service_sid
            - "@Name": TicketOptions
              "#text": "0x40810000"
            - "@Name": TicketEncryptionType
              "#text": "0x17"             # RC4-HMAC
            - "@Name": IpAddress
              "#text": ref.ip_address
            - "@Name": IpPort
              "#text": ref.src_port
            - "@Name": Status
              "#text": "0x0"
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": TransmittedServices
              "#text": "-"
