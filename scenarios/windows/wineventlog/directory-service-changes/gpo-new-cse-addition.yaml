type: scenario
description: |
  Persistence / defense evasion: a new client-side extension is added to an
  existing Group Policy Object's machine extension list on a domain
  controller. Emits a single directory-service attribute write (EventID 5136)
  on the gPCMachineExtensionNames attribute of a groupPolicyContainer, adding
  a CSE GUID pair beyond the object's prior value. A Client Side Extension
  determines what a GPO can push to joined machines (registry values,
  scripts, security settings); adding one to an existing, trusted policy
  lets an attacker piggyback new configuration onto machines that already
  apply that policy, without creating a new, more visible GPO.
tags: [eid5136]
mitre:
  tactics: [defense-evasion, persistence]
  techniques: [T1484.001]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  domain_dn:           "DC=${ref.domain_short_lower},DC=${ref.domain_tld}"
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  subject_user:        Administrator
  subject_domain:      ref.domain_short
  # The Security-channel WinEventLog input resolves SID fields to DOMAIN\account
  # before indexing, so this field carries a resolved name rather than a raw
  # S-1-5-21 SID. Pre-rendered here because nothing downstream resolves it.
  subject_sid:         "${ref.domain_short}\\${ref.subject_user}"
  subject_logon_id:    "0x8561a"
  policy_guid_raw:     fn.upper(gen.uuid())
  policy_guid:         "{${ref.policy_guid_raw}}"
  object_guid_raw:     fn.upper(gen.uuid())
  object_guid:         "{${ref.object_guid_raw}}"
  # Security auditing records this ObjectDN fully uppercase (verified against
  # the ESCU master sample); the detection's admon-side join uppercases its
  # own distinguishedName to match, so a non-uppercase ObjectDN here would
  # silently break that join in a real deployment, not just this scenario.
  domain_short_upper:  fn.upper(ref.domain_short)
  domain_tld_upper:    fn.upper(ref.domain_tld)
  object_dn:           "CN=${ref.policy_guid},CN=POLICIES,CN=SYSTEM,DC=${ref.domain_short_upper},DC=${ref.domain_tld_upper}"
  # A real CSE GUID pair appended to the machine extension list.
  new_cse_guids:       "[{C6DC5466-785A-11D2-84D0-00C04FB169F7}{942A8E4F-A261-11D1-A760-00C04FB9603F}]"
  op_correlation_raw:  gen.uuid()
  op_correlation_id:   "{${ref.op_correlation_raw}}"
  proc_id:             gen.int(min=400, max=900)
  thread_id:           gen.int(min=500, max=4000)
  record_id:           gen.int(min=100000, max=999999)

steps:
  # EventID 5136 -- the gPCMachineExtensionNames attribute of an existing
  # groupPolicyContainer is written with a new CSE GUID pair.
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Security-Auditing
            "@Guid": "{54849625-5478-4994-A5BA-3E3B0328C30D}"
          EventID: 5136
          Version: 0
          Level: 0
          Task: 14081
          Opcode: 0
          Keywords: "0x8020000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.proc_id
            "@ThreadID": ref.thread_id
          Channel: Security
          Computer: ref.computer
          Security: {}
        EventData:
          Data:
            - "@Name": OpCorrelationID
              "#text": ref.op_correlation_id
            - "@Name": AppCorrelationID
              "#text": "-"
            - "@Name": SubjectUserSid
              "#text": ref.subject_sid
            - "@Name": SubjectUserName
              "#text": ref.subject_user
            - "@Name": SubjectDomainName
              "#text": ref.subject_domain
            - "@Name": SubjectLogonId
              "#text": ref.subject_logon_id
            - "@Name": DSName
              "#text": ref.domain_fqdn
            - "@Name": DSType
              "#text": "%%14676"
            - "@Name": ObjectDN
              "#text": ref.object_dn
            - "@Name": ObjectGUID
              "#text": ref.object_guid
            - "@Name": ObjectClass
              "#text": groupPolicyContainer
            - "@Name": AttributeLDAPDisplayName
              "#text": gPCMachineExtensionNames
            - "@Name": AttributeSyntaxOID
              "#text": "2.5.5.12"
            - "@Name": AttributeValue
              "#text": ref.new_cse_guids
            - "@Name": OperationType
              "#text": "%%14674"
