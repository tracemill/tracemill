type: scenario
description: |
  Active Directory persistence / privilege escalation: modification of sensitive
  Directory Service attributes (msDS-AllowedToDelegateTo, msDS-AllowedToActOnBehalfOfOtherIdentity,
  scriptPath, or msTSInitialProgram). Emits a single directory-service attribute write
  event (EventID 5136).
tags: [eid5136]
mitre:
  tactics: [defense-evasion, lateral-movement]
  techniques: [T1222.001, T1550]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  domain_dn:           "DC=${ref.domain_short_lower},DC=${ref.domain_tld}"
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  subject_user:        Administrator
  subject_domain:      ref.domain_short
  # The Security-channel WinEventLog input resolves SID fields to DOMAIN\account
  # before indexing, so this field carries a resolved name rather than a raw
  # S-1-5-21 SID. Pre-rendered here because nothing downstream resolves it.
  subject_sid:         "${ref.domain_short}\\${ref.subject_user}"
  subject_logon_id:    "0x303c7ba"
  target_user:         unrpiv
  target_object_dn:    "CN=${ref.target_user},CN=Users,${ref.domain_dn}"
  object_guid_raw:     gen.uuid()
  object_guid:         "{${ref.object_guid_raw}}"
  op_correlation_raw:  gen.uuid()
  op_correlation_id:   "{${ref.op_correlation_raw}}"
  proc_id:             gen.int(min=400, max=900)
  thread_id:           gen.int(min=500, max=4000)
  record_id:           gen.int(min=100000, max=999999)
  attribute_name:      msDS-AllowedToDelegateTo
  attribute_value:     "ar-win-dc"

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Security-Auditing
            "@Guid": "{54849625-5478-4994-A5BA-3E3B0328C30D}"
          EventID: 5136
          Version: 0
          Level: 0
          Task: 14081
          Opcode: 0
          Keywords: "0x8020000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.proc_id
            "@ThreadID": ref.thread_id
          Channel: Security
          Computer: ref.computer
          Security: {}
        EventData:
          Data:
            - "@Name": OpCorrelationID
              "#text": ref.op_correlation_id
            - "@Name": AppCorrelationID
              "#text": "-"
            - "@Name": SubjectUserSid
              "#text": ref.subject_sid
            - "@Name": SubjectUserName
              "#text": ref.subject_user
            - "@Name": SubjectDomainName
              "#text": ref.subject_domain
            - "@Name": SubjectLogonId
              "#text": ref.subject_logon_id
            - "@Name": DSName
              "#text": ref.domain_fqdn
            - "@Name": DSType
              "#text": "%%14676"
            - "@Name": ObjectDN
              "#text": ref.target_object_dn
            - "@Name": ObjectGUID
              "#text": ref.object_guid
            - "@Name": ObjectClass
              "#text": user
            - "@Name": AttributeLDAPDisplayName
              "#text": ref.attribute_name
            - "@Name": AttributeSyntaxOID
              "#text": "2.5.5.12"
            - "@Name": AttributeValue
              "#text": ref.attribute_value
            - "@Name": OperationType
              "#text": "%%14674"
