type: scenario
description: |
  The Directory Services Restore Mode (DSRM) administrator password of a
  domain controller is set. Security EID 4794 (An attempt was made to set the
  Directory Services Restore Mode administrator password) records the account
  that made the request, for example Administrator, the workstation the
  request came from, for example a link-local IPv6 address, and the status
  code, 0x0 for a request that completed without error.
tags: [eid4794]
mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1098]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  actor_user:         Administrator
  # The forwarder resolves SubjectUserSid to DOMAIN\name.
  actor_sid:          "${ref.domain_short}\\${ref.actor_user}"
  actor_logon_id:     gen.regex(pattern=0x[1-9a-f][0-9a-f]{4,5})
  workstation_iid:    gen.regex(pattern=[1-9a-f][0-9a-f]{3}:[1-9a-f][0-9a-f]{3}:[1-9a-f][0-9a-f]{3}:[1-9a-f][0-9a-f]{3})
  workstation:        "[fe80::${ref.workstation_iid}]"
  activity_id_raw:    fn.upper(gen.uuid())
  activity_id:        "{${ref.activity_id_raw}}"
  proc_id:            gen.int(min=500, max=900)
  thread_id:          gen.int(min=1000, max=8000)
  event_record_id:    gen.int(min=100000, max=999999)

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Security-Auditing
            "@Guid": "{54849625-5478-4994-A5BA-3E3B0328C30D}"
          EventID: 4794
          Version: 0
          Level: 0
          Task: 13824
          Opcode: 0
          Keywords: "0x8020000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation:
            "@ActivityID": ref.activity_id
          Execution:
            "@ProcessID": ref.proc_id
            "@ThreadID": ref.thread_id
          Channel: Security
          Computer: ref.computer
          Security: {}
        EventData:
          Data:
            - "@Name": SubjectUserSid
              "#text": ref.actor_sid
            - "@Name": SubjectUserName
              "#text": ref.actor_user
            - "@Name": SubjectDomainName
              "#text": ref.domain_short
            - "@Name": SubjectLogonId
              "#text": ref.actor_logon_id
            - "@Name": Workstation
              "#text": ref.workstation
            - "@Name": Status
              "#text": "0x0"
