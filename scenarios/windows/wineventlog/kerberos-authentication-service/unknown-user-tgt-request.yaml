type: scenario
description: |
  Failed Kerberos ticket request for a non-existent user: a Kerberos AS request
  (EventID 4768, Security channel, Audit Failure) is rejected with
  KDC_ERR_C_PRINCIPAL_UNKNOWN (Status 0x6) because the named account does not
  exist in the directory. No ticket is issued (encryption type 0xffffffff, a
  NULL target SID). A single such event is benign noise; a burst of them naming
  many different accounts from one source is Kerberos username enumeration or
  password spraying against invalid accounts. This models one atomic failure --
  a job repeats it with distinct user names to reach the volume a detection
  keys on. The requesting source address is the field the burst shares.
tags: [eid4768]
mitre:
  tactics: [credential-access]
  techniques: ["T1110.003"]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  # Domain controller (KDC) that rejects the request -- the detection's dest.
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  # The (non-existent) account name tried; left as a generator so a burst job's
  # iterations yield distinct users -- the distinct-user count is what the
  # detection thresholds on.
  target_user:        gen.username()
  service_name:       "krbtgt/${ref.domain_fqdn}"
  # Requesting host address in the IPv4-mapped IPv6 form Windows records; a burst
  # job pins it so every attempt shares one source.
  src_ipv4:           gen.ipv4()
  ip_address:         "::ffff:${ref.src_ipv4}"
  src_port:           gen.int(min=49152, max=65535)
  proc_id:            gen.int(min=400, max=900)
  thread_id:          gen.int(min=800, max=4000)
  event_record_id:    gen.int(min=100000, max=999999)

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Security-Auditing
            "@Guid": "{54849625-5478-4994-A5BA-3E3B0328C30D}"
          EventID: 4768
          Version: 0
          Level: 0
          Task: 14339
          Opcode: 0
          # 0x8010000000000000 = Audit Failure (the request was rejected).
          Keywords: "0x8010000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.proc_id
            "@ThreadID": ref.thread_id
          Channel: Security
          Computer: ref.computer
          Security: {}
        EventData:
          Data:
            - "@Name": TargetUserName
              "#text": ref.target_user
            - "@Name": TargetDomainName
              "#text": ref.domain_fqdn
            - "@Name": TargetSid
              "#text": "NULL SID"
            - "@Name": ServiceName
              "#text": ref.service_name
            - "@Name": ServiceSid
              "#text": "NULL SID"
            - "@Name": TicketOptions
              "#text": "0x40810010"
            - "@Name": Status
              "#text": "0x6"
            - "@Name": TicketEncryptionType
              "#text": "0xffffffff"
            - "@Name": PreAuthType
              "#text": "-"
            - "@Name": IpAddress
              "#text": ref.ip_address
            - "@Name": IpPort
              "#text": ref.src_port
            - "@Name": CertIssuerName
              "#text": ""
            - "@Name": CertSerialNumber
              "#text": ""
            - "@Name": CertThumbprint
              "#text": ""
