type: scenario
description: |
  Certificate-backed Kerberos TGT request for a machine account: a Ticket
  Granting Ticket (EventID 4768, Security channel) is issued to a computer
  account (TargetUserName ending in '$') and carries a client certificate
  thumbprint, meaning the ticket was obtained through PKINIT rather than a
  password. A machine account authenticating with a certificate it should not
  hold is the tell of an authentication-coercion-to-certificate-services relay:
  the attacker coerces a host to authenticate, relays it to an enterprise
  certificate authority to mint a certificate for that machine, then uses the
  certificate to request the machine's TGT. The requesting source address (not
  loopback), the machine account, and the issuing domain controller are the
  fields a detection groups by.
tags: [eid4768, petitpotam]
mitre:
  tactics: [credential-access]
  techniques: ["T1003"]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_short_upper: fn.upper(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  domain_fqdn_upper:  fn.upper(ref.domain_fqdn)
  # Domain controller (KDC) that issues the ticket -- the detection's dest.
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  # Coerced machine account the ticket is issued to; machine accounts end in '$'.
  host_num:           gen.int(min=10, max=99)
  machine_short:      "WIN-SRV${ref.host_num}"
  target_machine:     "${ref.machine_short}$"
  # TargetSid is emitted as the resolved DOMAIN\account form (not a raw S-1-5-...
  # SID) because the source capture recorded the resolved principal name; kept
  # verbatim for fidelity. Detections key on TargetUserName, not TargetSid.
  target_sid:         "${ref.domain_short_upper}\\${ref.target_machine}"
  # SHA-1 certificate thumbprint carried on the PKINIT request; presence is the
  # signal, not the value.
  cert_thumbprint:    gen.hex(len=40, case=upper)
  # Requesting host address in the IPv4-mapped IPv6 form Windows records; a
  # non-loopback source is what the detection requires.
  src_ipv4:           gen.ipv4()
  ip_address:         "::ffff:${ref.src_ipv4}"
  src_port:           gen.int(min=49152, max=65535)
  proc_id:            gen.int(min=400, max=900)
  thread_id:          gen.int(min=800, max=4000)
  event_record_id:    gen.int(min=100000, max=999999)

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Security-Auditing
            "@Guid": "{54849625-5478-4994-A5BA-3E3B0328C30D}"
          EventID: 4768
          Version: 0
          Level: 0
          Task: 14339
          Opcode: 0
          Keywords: "0x8020000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.proc_id
            "@ThreadID": ref.thread_id
          Channel: Security
          Computer: ref.computer
          Security: {}
        EventData:
          Data:
            - "@Name": TargetUserName
              "#text": ref.target_machine
            - "@Name": TargetDomainName
              "#text": ref.domain_fqdn_upper
            - "@Name": TargetSid
              "#text": ref.target_sid
            - "@Name": ServiceName
              "#text": krbtgt
            - "@Name": ServiceSid
              "#text": "${ref.domain_short_upper}\\krbtgt"
            - "@Name": TicketOptions
              "#text": "0x40810010"
            - "@Name": Status
              "#text": "0x0"
            - "@Name": TicketEncryptionType
              "#text": "0x12"
            # PreAuthType 16 (PA-PK-AS-REQ) = PKINIT / certificate-based pre-auth,
            # consistent with the certificate thumbprint above. (The source capture
            # recorded 2 alongside the cert -- an artifact; PKINIT pre-auth is 16.)
            - "@Name": PreAuthType
              "#text": "16"
            - "@Name": IpAddress
              "#text": ref.ip_address
            - "@Name": IpPort
              "#text": ref.src_port
            - "@Name": CertIssuerName
              "#text": ""
            - "@Name": CertSerialNumber
              "#text": ""
            - "@Name": CertThumbprint
              "#text": ref.cert_thumbprint
