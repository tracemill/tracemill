type: scenario
description: |
  A successful RDP logon (EventID 4624, LogonType 10 -- RemoteInteractive)
  recorded on the host being connected to. The interactive desktop path
  reports LogonProcessName User32 with the Negotiate package, and the
  connecting client's address in IpAddress. One run = one 4624.
tags: [eid4624]
mitre:
  tactics: [lateral-movement]
  techniques: ["T1021.001"]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  computer_short_raw: gen.hostname(class=windows-server)
  computer_short:     fn.upper(ref.computer_short_raw)
  target_user:        gen.username()
  # The Security-channel input resolves SID fields to DOMAIN\account before
  # indexing, so this carries a resolved name rather than a raw S-1-5-21 SID.
  target_sid:         "${ref.domain_short}\\${ref.target_user}"
  target_logon_hex:   gen.hex(len=5, case=lower)
  target_logon_id:    "0x${ref.target_logon_hex}"
  # Address of the connecting RDP client.
  src_ip:             gen.ipv4()
  logon_guid_raw:     gen.uuid()
  logon_guid_upper:   fn.upper(ref.logon_guid_raw)
  logon_guid:         "{${ref.logon_guid_upper}}"
  activity_id_raw:    gen.uuid()
  activity_id_upper:  fn.upper(ref.activity_id_raw)
  activity_id:        "{${ref.activity_id_upper}}"
  # RemoteInteractive: the load-bearing value -- the rule scopes to it.
  logon_type:         "10"
  # Windows pads LogonProcessName; the trailing space is part of the value.
  logon_process:      "User32 "
  auth_package:       "Negotiate"
  # Negotiate/RDP path reports no LM package and no key length; a job
  # driving an NTLM logon through this scenario overrides both.
  lm_package:         "-"
  key_length:         "0"
  process_id_hex:     gen.hex(len=3, case=lower)
  proc_id:            gen.int(min=600, max=900)
  thread_id:          gen.int(min=1000, max=4000)
  event_record_id:    gen.int(min=200000, max=999999)

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Security-Auditing
            "@Guid": "{54849625-5478-4994-A5BA-3E3B0328C30D}"
          EventID: 4624
          Version: 2
          Level: 0
          Task: 12544
          Opcode: 0
          Keywords: "0x8020000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation:
            "@ActivityID": ref.activity_id
          Execution:
            "@ProcessID": ref.proc_id
            "@ThreadID": ref.thread_id
          Channel: Security
          Computer: ref.computer
          Security: {}
        EventData:
          Data:
            - "@Name": SubjectUserSid
              "#text": "NT AUTHORITY\\SYSTEM"
            - "@Name": SubjectUserName
              "#text": "${ref.computer_short}$"
            - "@Name": SubjectDomainName
              "#text": ref.domain_short
            - "@Name": SubjectLogonId
              "#text": "0x3e7"
            - "@Name": TargetUserSid
              "#text": ref.target_sid
            - "@Name": TargetUserName
              "#text": ref.target_user
            - "@Name": TargetDomainName
              "#text": ref.domain_short
            - "@Name": TargetLogonId
              "#text": ref.target_logon_id
            - "@Name": LogonType
              "#text": ref.logon_type
            - "@Name": LogonProcessName
              "#text": ref.logon_process
            - "@Name": AuthenticationPackageName
              "#text": ref.auth_package
            - "@Name": WorkstationName
              "#text": ref.computer_short
            - "@Name": LogonGuid
              "#text": ref.logon_guid
            - "@Name": TransmittedServices
              "#text": "-"
            - "@Name": LmPackageName
              "#text": ref.lm_package
            - "@Name": KeyLength
              "#text": ref.key_length
            - "@Name": ProcessId
              "#text": "0x${ref.process_id_hex}"
            - "@Name": ProcessName
              "#text": "C:\\Windows\\System32\\svchost.exe"
            - "@Name": IpAddress
              "#text": ref.src_ip
            - "@Name": IpPort
              "#text": "0"
            - "@Name": ImpersonationLevel
              "#text": "%%1833"
            - "@Name": RestrictedAdminMode
              "#text": "%%1843"
            - "@Name": TargetOutboundUserName
              "#text": "-"
            - "@Name": TargetOutboundDomainName
              "#text": "-"
            - "@Name": VirtualAccount
              "#text": "%%1843"
            - "@Name": TargetLinkedLogonId
              "#text": "0x0"
            - "@Name": ElevatedToken
              "#text": "%%1842"
