type: scenario
description: |
  A successful network logon (EventID 4624, LogonType 3) as the local
  Administrator account, authenticated with NTLM from a remote source. Reusing a
  single local-Administrator credential to log on across many hosts is the
  successful arm of local-administrator credential stuffing / password reuse.
  The source address stays fixed while the logged-on host varies, so a job that
  loops this scenario models one attacker reusing the credential against many
  distinct machines. One run = one 4624; loop it in a job to cross the
  distinct-hosts threshold.
tags: [eid4624]
mitre:
  tactics: [lateral-movement]
  techniques: ["T1110.004"]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  # Target host being logged into -- varies each iteration to drive the
  # distinct-hosts count.
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  target_admin:       Administrator
  target_admin_sid:   "S-1-5-21-111222333-444555666-777888999-500"
  target_logon_hex:   gen.hex(len=7, case=lower)
  target_logon_id:    "0x${ref.target_logon_hex}"
  # Remote source reusing the credential (held constant across a burst).
  src_ip:             gen.ipv4()
  src_port:           gen.int(min=49152, max=65535)
  proc_id:            gen.int(min=600, max=900)
  thread_id:          gen.int(min=1000, max=4000)
  event_record_id:    gen.int(min=200000, max=999999)

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Security-Auditing
            "@Guid": "{54849625-5478-4994-A5BA-3E3B0328C30D}"
          EventID: 4624
          Version: 2
          Level: 0
          Task: 12544
          Opcode: 0
          Keywords: "0x8020000000000000"   # Audit Success
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.proc_id
            "@ThreadID": ref.thread_id
          Channel: Security
          Computer: ref.computer
          Security: {}
        EventData:
          Data:
            - "@Name": SubjectUserSid
              "#text": "NULL SID"
            - "@Name": SubjectUserName
              "#text": "-"
            - "@Name": SubjectDomainName
              "#text": "-"
            - "@Name": SubjectLogonId
              "#text": "0x0"
            - "@Name": TargetUserSid
              "#text": ref.target_admin_sid
            - "@Name": TargetUserName
              "#text": ref.target_admin
            - "@Name": TargetDomainName
              "#text": ref.domain_short
            - "@Name": TargetLogonId
              "#text": ref.target_logon_id
            - "@Name": LogonType
              "#text": "3"
            - "@Name": LogonProcessName
              "#text": "NtLmSsp"
            - "@Name": AuthenticationPackageName
              "#text": "NTLM"
            - "@Name": WorkstationName
              "#text": "-"
            - "@Name": LogonGuid
              "#text": "{00000000-0000-0000-0000-000000000000}"
            - "@Name": TransmittedServices
              "#text": "-"
            - "@Name": LmPackageName
              "#text": "-"
            - "@Name": KeyLength
              "#text": "0"
            - "@Name": ProcessId
              "#text": "0x0"
            - "@Name": ProcessName
              "#text": "-"
            - "@Name": IpAddress
              "#text": ref.src_ip
            - "@Name": IpPort
              "#text": ref.src_port
            - "@Name": ImpersonationLevel
              "#text": "%%1840"
            - "@Name": RestrictedAdminMode
              "#text": "-"
            - "@Name": TargetOutboundUserName
              "#text": "-"
            - "@Name": TargetOutboundDomainName
              "#text": "-"
            - "@Name": VirtualAccount
              "#text": "%%1843"
            - "@Name": TargetLinkedLogonId
              "#text": "0x0"
            - "@Name": ElevatedToken
              "#text": "%%1842"
