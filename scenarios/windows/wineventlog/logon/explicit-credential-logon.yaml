type: scenario
description: |
  A logon using explicit credentials (EventID 4648): a caller initiates a logon
  while supplying a different account's credentials, naming the target account
  and the server they are presented to. Runas and service accounts produce 4648
  legitimately, but one caller on one host presenting many distinct target
  accounts in a short window is the signature of an explicit-credential spray.
  Loop it in a job -- holding the caller and host constant, varying the target
  account -- to model the spray.
tags: [eid4648]
mitre:
  tactics: [credential-access]
  techniques: ["T1110.003"]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_upper:  fn.upper(ref.domain_short)
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  target_server:       gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  caller_user:         gen.username()
  caller_user_upper:   fn.upper(ref.caller_user)
  # Splunk's WinEventLog input resolves the 4648 SubjectUserSid to DOMAIN\USER on
  # ingest (master: `ATTACKRANGE\REED_LARSEN`), so we pre-render that form -- a raw
  # S-1-5-21 SID would diverge from the master. tracemill does no SID resolution.
  caller_sid_account:  "${ref.domain_short_upper}\\${ref.caller_user_upper}"
  target_user:         gen.username()
  target_user_upper:   fn.upper(ref.target_user)
  logon_id_hex:        gen.hex(len=6, case=lower)
  subject_logon_id:    "0x${ref.logon_id_hex}"
  activity_id:         fn.upper(gen.uuid())
  src_ip:              gen.ipv4()
  src_port:            gen.int(min=49152, max=65535)
  proc_id:             gen.int(min=500, max=900)
  thread_id:           gen.int(min=1000, max=8000)
  event_record_id:     gen.int(min=200000, max=999999)

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Security-Auditing
            "@Guid": "{54849625-5478-4994-A5BA-3E3B0328C30D}"
          EventID: 4648
          Version: 0
          Level: 0
          Task: 12544
          Opcode: 0
          Keywords: "0x8020000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation:
            "@ActivityID": "{${ref.activity_id}}"
          Execution:
            "@ProcessID": ref.proc_id
            "@ThreadID": ref.thread_id
          Channel: Security
          Computer: ref.computer
          Security: {}
        EventData:
          Data:
            - "@Name": SubjectUserSid
              "#text": ref.caller_sid_account
            - "@Name": SubjectUserName
              "#text": ref.caller_user
            - "@Name": SubjectDomainName
              "#text": ref.domain_short_upper
            - "@Name": SubjectLogonId
              "#text": ref.subject_logon_id
            - "@Name": LogonGuid
              "#text": "{00000000-0000-0000-0000-000000000000}"
            - "@Name": TargetUserName
              "#text": ref.target_user_upper
            # 4648 carries the target account's domain as the FQDN (master:
            # `attackrange.local`), unlike account-mgmt events' short NetBIOS form.
            - "@Name": TargetDomainName
              "#text": ref.domain_fqdn
            - "@Name": TargetLogonGuid
              "#text": "{00000000-0000-0000-0000-000000000000}"
            - "@Name": TargetServerName
              "#text": ref.target_server
            - "@Name": TargetInfo
              "#text": ref.target_server
            # Master emits EventData.ProcessId 0x4 with an empty ProcessName for
            # purplesharp 4648s -- intentionally unrelated to System.Execution/@ProcessID.
            - "@Name": ProcessId
              "#text": "0x4"
            - "@Name": ProcessName
              "#text": ""
            - "@Name": IpAddress
              "#text": ref.src_ip
            - "@Name": IpPort
              "#text": ref.src_port
