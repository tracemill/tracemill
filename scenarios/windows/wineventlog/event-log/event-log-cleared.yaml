type: scenario
description: |
  A Windows event log is cleared. System EID 104 (Microsoft-Windows-Eventlog)
  records the name of the cleared log, for example System, and the account
  that cleared it, for example Administrator, with its domain, for example
  CORP, and its SID. The event's backup path is empty.
tags: [eid104]
mitre:
  tactics: [defense-impairment]
  techniques: [T1685.005]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  event_record_id:    gen.int(min=10000, max=999999)
  eventlog_pid:       gen.int(min=300, max=1500)
  eventlog_tid:       gen.int(min=1000, max=4000)
  subject_user:       Administrator
  subject_user_sid:   "S-1-5-21-111222333-444555666-777888999-500"
  cleared_channel:    System

steps:
  - emit:
      event_type: windows.wineventlog@v1
      fields:
        System:
          Provider:
            "@Name": Microsoft-Windows-Eventlog
            "@Guid": "{fc65ddd8-d6ef-4962-83d5-6e5cfe9ce148}"
          EventID: 104
          Version: 0
          Level: 4
          Task: 104
          Opcode: 0
          Keywords: "0x8000000000000000"
          TimeCreated:
            "@SystemTime": gen.timestamp(format=wineventlog)
          EventRecordID: ref.event_record_id
          Correlation: {}
          Execution:
            "@ProcessID": ref.eventlog_pid
            "@ThreadID": ref.eventlog_tid
          Channel: System
          Computer: ref.computer
          Security:
            "@UserID": ref.subject_user_sid
        UserData:
          LogFileCleared:
            "@xmlns": "http://manifests.microsoft.com/win/2004/08/windows/eventlog"
            SubjectUserName: ref.subject_user
            SubjectDomainName: ref.domain_short
            Channel: ref.cleared_channel
            BackupPath: ""
