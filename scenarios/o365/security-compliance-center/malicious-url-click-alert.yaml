type: scenario
description: |
  Microsoft 365 Defender Safe Links alert for a malicious URL click. A mailbox
  user clicks a link that is later identified as potentially malicious, and the
  Security and Compliance Center raises "A potentially malicious URL click was
  detected" (AlertEntityGenerated) in the SecurityComplianceCenter workload. The
  alert payload describes the clicked URL and the Safe Links detection source.
  This is a distinct Defender alert type generated by automated URL protection,
  not a message a user submitted with the report-message button, so it carries
  no user-submission rescan verdict.
state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  victim_upn: "victim@example.onmicrosoft.com"
  clicked_url: "https://malicious.example/account-verify"
  click_ts: gen.timestamp()
  detected_ts: gen.timestamp()
  alert_record_id: gen.uuid()
  alert_id: gen.uuid()
  alert_item_id: gen.uuid()
  policy_id: gen.uuid()
  # Safe Links click alert payload (a JSON document carried as a string). The
  # "MaliciousUrlClick" detail describes the clicked URL and the protection
  # source; it has no user-submission rescan verdict.
  alert_data: '{"etype":"MaliciousUrl","aii":"${ref.alert_item_id}","eid":"${ref.clicked_url}","curlh":"8123456709123456780","tid":"${ref.tenant_id}","ts":"${ref.click_ts}","te":"${ref.click_ts}","trc":"${ref.victim_upn}","tdc":"1","at":"${ref.click_ts}","dm":"MDO Safe Links","ot":"Allowed","od":"User clicked on a URL which was identified as potentially malicious at a later time.","md":"${ref.detected_ts}","lon":"MaliciousUrlClick"}'
steps:
  - emit:
      event_type: o365.management@v1
      fields:
        Workload: SecurityComplianceCenter
        Operation: AlertEntityGenerated
        Name: "A potentially malicious URL click was detected"
        RecordType: 40
        Id: ref.alert_record_id
        OrganizationId: ref.tenant_id
        UserId: SecurityComplianceAlerts
        UserKey: SecurityComplianceAlerts
        UserType: 4
        Version: 1
        ResultStatus: Succeeded
        AlertId: ref.alert_id
        AlertEntityId: ref.clicked_url
        AlertType: System
        AlertLinks:
          - AlertLinkHref: ""
        Category: ThreatManagement
        Comments: "New alert"
        EntityType: MaliciousUrl
        ObjectId: ref.clicked_url
        PolicyId: ref.policy_id
        Severity: High
        Source: "Office 365 Security & Compliance"
        Status: Active
        Data: ref.alert_data
