type: scenario
description: |
  Microsoft 365 raises a security alert reporting that mail already delivered
  to a mailbox has been pulled back out of it. Automatic post-delivery removal
  fires when a message is judged malicious only after recipients already had
  it, so the alert marks the window in which someone may have opened the link
  or attachment.
mitre:
  tactics: [initial-access]
  techniques: ["T1566.002"]
state:
  tenant_id:        "11111111-1111-1111-1111-111111111111"
  alert_id:         gen.uuid()
  # The entity id is composed from the alert instance, not from the alert id;
  # the two are never equal in captured records.
  instance_id:      gen.uuid()
  entity_seq:       gen.int(min=1000000000000000000, max=9000000000000000000)
  entity_id:        "${ref.instance_id}-${ref.entity_seq}-1"
  record_id:        gen.uuid()
  policy_id:        gen.uuid()
  threat_policy_id: gen.uuid()
  recipient:        "employee@example.onmicrosoft.com"
  sender:           "billing@invoices-payments.example"
  subject:          "Documents for your signature - Thursday"
  bad_url:          "malicious-signing.example/auth"
  sender_ip:        gen.ipv4()
  message_id:       "<${ref.record_id}@mail.invoices-payments.example>"
  # Alert title as the console words it. It ends in a zero-width space, which
  # is how Microsoft emits these titles, written as an escape so the source
  # stays plain ASCII while the emitted value keeps the byte.
  alert_name:       "Email messages containing malicious URL removed after delivery\u200b"
  # Outcome recorded for the removal attempt. A Success form means the copy was
  # pulled; anything else means it stayed where it was.
  removal_result:   "Success_MessageQuarantined"
  # Detection time and threat-triage time are one value in captured records;
  # the scan window is a minute either side of it.
  alert_time:       gen.timestamp(format="2006-01-02T15:04:05.0000000Z")
  found_time:       gen.timestamp(format="2006-01-02T15:04:05.0000000Z", offset=-21s, truncate=1s)
  scan_start:       gen.timestamp(format="2006-01-02T15:04:05.0000000Z", offset=-60s)
  scan_end:         gen.timestamp(format="2006-01-02T15:04:05.0000000Z", offset=60s)
steps:
  - emit:
      event_type: o365.management@v1
      fields:
        Operation: AlertEntityGenerated
        Workload: SecurityComplianceCenter
        RecordType: 40
        ResultStatus: Succeeded
        Id: ref.record_id
        OrganizationId: ref.tenant_id
        UserId: SecurityComplianceAlerts
        UserKey: SecurityComplianceAlerts
        UserType: 4
        Version: 1
        AlertId: ref.alert_id
        AlertEntityId: ref.entity_id
        AlertType: System
        AlertLinks:
          - AlertLinkHref: ""
        Category: ThreatManagement
        Comments: "New alert"
        EntityType: MalwareFamily
        Name: ref.alert_name
        ObjectId: ref.entity_id
        PolicyId: ref.policy_id
        Severity: Informational
        Source: "Office 365 Security & Compliance"
        Status: Active
        Data: '{"etype": "MalwareFamily", "at": "${ref.alert_time}", "md": "${ref.found_time}", "sip": "${ref.sender_ip}", "ms": "${ref.subject}", "imsgid": "${ref.message_id}", "ttdt": "${ref.alert_time}", "ttr": "${ref.removal_result}", "eid": "${ref.entity_id}", "aii": "${ref.instance_id}", "thn": "reputation", "ts": "${ref.scan_start}", "te": "${ref.scan_end}", "fvs": "Filters", "tpt": "AntiMalwarePolicy", "tpid": "${ref.threat_policy_id}", "tid": "${ref.tenant_id}", "tht": "Malware, Malicious", "trc": "${ref.recipient}", "tsd": "${ref.sender}", "zu": "${ref.bad_url}", "pud": "${ref.bad_url}", "tdc": "1", "cpid": null, "lon": "Protection"}'
