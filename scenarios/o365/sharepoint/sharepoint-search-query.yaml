type: scenario
description: |
  A search is run against a SharePoint team site and Microsoft 365 records the
  query text. Searching a site collection for credential or payment terms is
  how someone with access to a compromised account locates the material worth
  taking, before any of it is downloaded.
mitre:
  tactics: [collection, credential-access]
  techniques: ["T1213.002", "T1552"]
state:
  tenant_id:  "11111111-1111-1111-1111-111111111111"
  actor_upn:  "compromised.user@example.onmicrosoft.com"
  actor_key:  "10037FFE8C9C6D32"
  src_ip:     gen.ipv4()
  record_id:  gen.uuid()
  query_text: "passwords"
  app_id:     "00000003-0000-0ff1-ce00-000000000000"
steps:
  - emit:
      event_type: o365.management@v1
      fields:
        Operation: SearchQueryInitiatedSharePoint
        Workload: SharePoint
        RecordType: 102
        Id: ref.record_id
        OrganizationId: ref.tenant_id
        UserId: ref.actor_upn
        UserKey: ref.actor_key
        UserType: 0
        Version: 1
        ClientIP: ref.src_ip
        QuerySource: SharePoint
        QueryText: ref.query_text
        ScenarioName: teamsitesearch
        ClientUserAgent: "Mozilla/5.0,(Windows NT 10.0; Win64; x64),AppleWebKit/537.36,(KHTML, like Gecko),Chrome/133.0.0.0,Safari/537.36"
        CustomProperties:
          - Name: UserAgent
            Value: "sharepointshared.teamsitesearch"
        AppAccessContext:
          APIId: ref.app_id
          ClientAppId: ref.app_id
