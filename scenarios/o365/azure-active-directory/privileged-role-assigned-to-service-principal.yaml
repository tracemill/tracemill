type: scenario
description: |
  A directory role is granted to a service principal in Microsoft Entra ID,
  recorded in the Microsoft 365 unified audit log as an "Add member to role."
  activity naming the role and its template. A workload identity holding an
  administrative role can act on the directory without a sign-in, a password or
  a multi-factor prompt.
  See https://attack.mitre.org/techniques/T1098/003/
mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1098.003]
state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  actor_upn: "adminUser@example.onmicrosoft.com"
  actor_puid: "10032002124AE785"
  actor_oid: gen.uuid()
  sp_object_id: gen.uuid()
  role_display: "Helpdesk Administrator"
  role_template_id: "729827e3-9c14-49f7-bb1b-9608f156bbb8"
  role_object_id: gen.uuid()
  role_wellknown: "HelpdeskAdmins"
  record_id: gen.uuid()
steps:
  - emit:
      event_type: o365.management@v1
      fields:
        Operation: "Add member to role."
        Workload: AzureActiveDirectory
        RecordType: 8
        ResultStatus: Success
        Id: ref.record_id
        InterSystemsId: gen.uuid()
        IntraSystemId: gen.uuid()
        SupportTicketId: ""
        OrganizationId: ref.tenant_id
        ActorContextId: ref.tenant_id
        TargetContextId: ref.tenant_id
        UserId: ref.actor_upn
        UserKey: "${ref.actor_puid}@example.onmicrosoft.com"
        UserType: 0
        Version: 1
        AzureActiveDirectoryEventType: 1
        ObjectId: "ServicePrincipal_${ref.sp_object_id}"
        ExtendedProperties:
          - Name: additionalDetails
            Value: "{}"
          - Name: extendedAuditEventCategory
            Value: Role
        ModifiedProperties:
          - Name: Role.ObjectID
            NewValue: ref.role_object_id
            OldValue: ""
          - Name: Role.DisplayName
            NewValue: ref.role_display
            OldValue: ""
          - Name: Role.TemplateId
            NewValue: ref.role_template_id
            OldValue: ""
          - Name: Role.WellKnownObjectName
            NewValue: ref.role_wellknown
            OldValue: ""
        Actor:
          - ID: ref.actor_upn
            Type: 5
          - ID: ref.actor_puid
            Type: 3
          - ID: "Microsoft Office 365 Portal"
            Type: 1
          - ID: "00000006-0000-0ff1-ce00-000000000000"
            Type: 2
          - ID: "User_${ref.actor_oid}"
            Type: 2
          - ID: ref.actor_oid
            Type: 2
          - ID: User
            Type: 2
        # Target[2] is the assignee kind; the directory records a service
        # principal assignee as "Other", which is what separates it from a
        # user assignment.
        Target:
          - ID: "ServicePrincipal_${ref.sp_object_id}"
            Type: 2
          - ID: ref.sp_object_id
            Type: 2
          - ID: Other
            Type: 2
