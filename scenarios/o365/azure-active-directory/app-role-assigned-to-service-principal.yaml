type: scenario
description: |
  An application role is granted to a service principal, recorded as an
  "Add app role assignment to service principal." activity in the Microsoft
  365 unified audit log. The granting actor is parameterised: a user models
  an administrator consenting to the grant, a service principal models an
  application granting itself the role without that consent step.

  The default role is full mailbox access via Exchange Web Services, the
  grant that lets its holder read any mailbox in the tenant.
tags: [eid-o365-approle]
mitre:
  tactics: [persistence]
  techniques: ["T1098.003"]

state:
  tenant_id:       "11111111-1111-1111-1111-111111111111"
  # "ServicePrincipal" or "User" -- the trailing Actor entry, which is what
  # distinguishes a self-granted role from an administrator-consented one.
  actor_kind:      ServicePrincipal
  actor_id:        "ServicePrincipal_fc8c8125-bc0c-499d-8344-e53c6e3caa81"
  actor_display:   LegacyTestOAuthApp
  actor_app_oid:   "869dc64b-95b2-4003-8098-3ba39296ea46"
  actor_oid:       gen.uuid()
  target_sp_oid:   gen.uuid()
  resource_app_id: "00000002-0000-0ff1-ce00-000000000000"
  resource_name:   "Office 365 Exchange Online"
  resource_spn:    "https://outlook.office.com;Microsoft.Exchange;00000002-0000-0ff1-ce00-000000000000"
  approle_id:      gen.uuid()
  approle_value:   full_access_as_app
  approle_display: "Use Exchange Web Services with full access to all mailboxes"
  grantee_oid:     gen.uuid()
  grantee_display: STRT_Oauth
  grantee_app_id:  gen.uuid()
  created_at:      "2/8/2024 9:49:53 PM"
  record_id:       gen.uuid()
  user_agent:      "Mozilla/5.0 (Macintosh; Darwin 23.3.0) PowerShell/7.3.4"

steps:
  - emit:
      event_type: o365.management@v1
      fields:
        Operation: "Add app role assignment to service principal."
        Workload: AzureActiveDirectory
        RecordType: 8
        ResultStatus: Success
        Id: ref.record_id
        InterSystemsId: gen.uuid()
        IntraSystemId: "00000000-0000-0000-0000-000000000000"
        SupportTicketId: ""
        OrganizationId: ref.tenant_id
        ActorContextId: ref.tenant_id
        TargetContextId: ref.tenant_id
        ObjectId: ref.resource_spn
        UserId: ref.actor_id
        UserKey: "Not Available"
        UserType: 4
        Version: 1
        AzureActiveDirectoryEventType: 1
        Actor:
          - ID: ref.actor_display
            Type: 1
          - ID: ref.actor_app_oid
            Type: 2
          - ID: "${ref.actor_kind}_${ref.actor_oid}"
            Type: 2
          - ID: ref.actor_oid
            Type: 2
          - ID: ref.actor_kind
            Type: 2
        Target:
          - ID: "ServicePrincipal_${ref.target_sp_oid}"
            Type: 2
          - ID: ref.target_sp_oid
            Type: 2
          - ID: ServicePrincipal
            Type: 2
          - ID: ref.resource_name
            Type: 1
          - ID: ref.resource_app_id
            Type: 2
          - ID: ref.resource_spn
            Type: 4
        # Order is load-bearing: the first three NewValue entries are read
        # positionally as the role id, value and description.
        ModifiedProperties:
          - Name: AppRole.Id
            NewValue: ref.approle_id
            OldValue: ""
          - Name: AppRole.Value
            NewValue: ref.approle_value
            OldValue: ""
          - Name: AppRole.DisplayName
            NewValue: ref.approle_display
            OldValue: ""
          - Name: AppRoleAssignment.CreatedDateTime
            NewValue: ref.created_at
            OldValue: ""
          - Name: AppRoleAssignment.LastModifiedDateTime
            NewValue: ref.created_at
            OldValue: ""
          - Name: ServicePrincipal.ObjectID
            NewValue: ref.grantee_oid
            OldValue: ""
          - Name: ServicePrincipal.DisplayName
            NewValue: ref.grantee_display
            OldValue: ""
          - Name: ServicePrincipal.AppId
            NewValue: ref.grantee_app_id
            OldValue: ""
          - Name: ServicePrincipal.Name
            NewValue: ref.grantee_app_id
            OldValue: ""
          - Name: TargetId.ServicePrincipalNames
            NewValue: ref.resource_spn
            OldValue: ""
        ExtendedProperties:
          - Name: additionalDetails
            Value: "{\"User-Agent\":\"${ref.user_agent}\",\"AppId\":\"${ref.resource_app_id}\"}"
          - Name: extendedAuditEventCategory
            Value: ServicePrincipal
