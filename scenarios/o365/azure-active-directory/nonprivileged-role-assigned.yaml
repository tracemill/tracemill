type: scenario
description: |
  Routine Microsoft Entra ID administration: a low-privilege, read-only
  directory role (Directory Readers) is assigned to a user account, recorded as
  an "Add member to role." activity in the Microsoft 365 unified audit log.
  Granting a non-privileged role that confers only read access to directory
  objects is ordinary administrative activity and is the legitimate counterpart
  to the assignment of a highly privileged role; a detection scoped to
  privileged roles must not alert on it. The event is structurally identical to
  a privileged assignment -- same operation, same user target class -- and
  differs only in the granted role's privilege.
state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  actor_sp_oid: "33333333-3333-3333-3333-333333333333"
  assignee_upn: "targetUser@example.onmicrosoft.com"
  assignee_oid: gen.uuid()
  assignee_puid: "10032001AABBCCDD"
  role_object_id: gen.uuid()
  actor_ip: gen.ipv4()
steps:
  - emit:
      event_type: o365.management@v1
      fields:
        Operation: "Add member to role."
        Workload: AzureActiveDirectory
        RecordType: 8
        ResultStatus: Success
        Id: gen.uuid()
        InterSystemsId: gen.uuid()
        IntraSystemId: gen.uuid()
        SupportTicketId: ""
        OrganizationId: ref.tenant_id
        ObjectId: ref.assignee_upn
        UserId: "ServicePrincipal_${ref.actor_sp_oid}"
        UserKey: "Not Available"
        UserType: 4
        Version: 1
        AzureActiveDirectoryEventType: 1
        ActorContextId: ref.tenant_id
        TargetContextId: ref.tenant_id
        ClientIP: ref.actor_ip
        ActorIpAddress: ref.actor_ip
        Actor:
          - ID: MS-PIM
            Type: 1
          - ID: "01fc33a7-78ba-4d2f-a4b7-768e336e890e"
            Type: 2
          - ID: "ServicePrincipal_${ref.actor_sp_oid}"
            Type: 2
          - ID: ref.actor_sp_oid
            Type: 2
          - ID: ServicePrincipal
            Type: 2
        Target:
          - ID: "User_${ref.assignee_oid}"
            Type: 2
          - ID: ref.assignee_oid
            Type: 2
          - ID: User
            Type: 2
          - ID: ref.assignee_upn
            Type: 5
          - ID: ref.assignee_puid
            Type: 3
        # Directory Readers (template 88d8e3e3-...) -- read-only access to
        # directory objects. It is not a privileged role, so an assignment of it
        # is benign and must not raise an alert.
        ModifiedProperties:
          - Name: Role.ObjectID
            NewValue: ref.role_object_id
            OldValue: ""
          - Name: Role.DisplayName
            NewValue: "Directory Readers"
            OldValue: ""
          - Name: Role.TemplateId
            NewValue: "88d8e3e3-8f55-4a1e-953a-9b9898b8876b"
            OldValue: ""
          - Name: Role.WellKnownObjectName
            NewValue: ""
            OldValue: ""
        ExtendedProperties:
          - Name: additionalDetails
            Value: "{}"
          - Name: extendedAuditEventCategory
            Value: Role
