type: scenario
description: |
  An existing Microsoft Entra ID application registration is changed so that
  accounts from other tenants can sign in to it. The Microsoft 365 unified
  audit log records an "Update application." activity (AzureActiveDirectory
  workload) whose modified properties show AvailableToOtherTenants changing
  from false to true, naming the acting user and the application by object id,
  display name, for example "Contoso Partner Portal", and application id.
  See https://learn.microsoft.com/en-us/entra/identity-platform/howto-convert-app-to-be-multi-tenant
mitre:
  tactics: [persistence]
  techniques: [T1098.003]
state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  actor_upn: "adminUser@example.onmicrosoft.com"
  actor_puid: "1003BFFD98415B4E"
  actor_session_oid: gen.uuid()
  actor_user_oid: gen.uuid()
  app_object_id: gen.uuid()
  app_client_id: gen.uuid()
  app_display_name: "Contoso Partner Portal"
steps:
  - emit:
      event_type: o365.management@v1
      fields:
        Actor:
          - ID: ref.actor_upn
            Type: 5
          - ID: ref.actor_puid
            Type: 3
          - ID: ref.actor_session_oid
            Type: 2
          - ID: "User_${ref.actor_user_oid}"
            Type: 2
          - ID: ref.actor_user_oid
            Type: 2
          - ID: User
            Type: 2
        ActorContextId: ref.tenant_id
        ActorIpAddress: ""
        AzureActiveDirectoryEventType: 1
        ClientIP: ""
        ExtendedProperties:
          - Name: additionalDetails
            Value: '{"User-Agent":"Mozilla/5.0 (Windows NT 6.3; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/109.0.0.0 Safari/537.36 Edg/109.0.1518.140","AppId":"${ref.app_client_id}"}'
          - Name: extendedAuditEventCategory
            Value: Application
        Id: gen.uuid()
        InterSystemsId: gen.uuid()
        IntraSystemId: "00000000-0000-0000-0000-000000000000"
        ModifiedProperties:
          - Name: AvailableToOtherTenants
            NewValue: "[\r\n  true\r\n]"
            OldValue: "[\r\n  false\r\n]"
          - Name: "Included Updated Properties"
            NewValue: AvailableToOtherTenants
            OldValue: ""
        ObjectId: "Application_${ref.app_object_id}"
        Operation: "Update application."
        OrganizationId: ref.tenant_id
        RecordType: 8
        ResultStatus: Success
        SupportTicketId: ""
        Target:
          - ID: "Application_${ref.app_object_id}"
            Type: 2
          - ID: ref.app_object_id
            Type: 2
          - ID: Application
            Type: 2
          - ID: ref.app_display_name
            Type: 1
          - ID: ref.app_client_id
            Type: 2
        TargetContextId: ref.tenant_id
        UserId: ref.actor_upn
        UserKey: "${ref.actor_puid}@example.onmicrosoft.com"
        UserType: 0
        Version: 1
        Workload: AzureActiveDirectory
