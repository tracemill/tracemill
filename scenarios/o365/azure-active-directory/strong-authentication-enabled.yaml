type: scenario
description: |
  Routine Microsoft 365 identity hygiene: an administrator turns per-user
  multi-factor authentication (Microsoft Entra ID "strong authentication")
  back on for an account, restoring the second-factor requirement. The change
  is recorded as a Microsoft Entra ID "Enable Strong Authentication." activity
  whose StrongAuthenticationRequirement after-state carries an enforced
  requirement that was absent before the change. This is the benign inverse of
  removing the requirement and must not be treated as an attack.
state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  # Administrator performing the change.
  actor_upn: "adminUser@example.onmicrosoft.com"
  actor_oid: gen.uuid()
  actor_puid: gen.hex(len=16, case=upper)
  # Target user account whose per-user MFA requirement is restored.
  target_upn: "targetUser@example.onmicrosoft.com"
  target_oid: gen.uuid()
  target_puid: gen.hex(len=16, case=upper)
steps:
  - emit:
      event_type: o365.management@v1
      fields:
        Operation: "Enable Strong Authentication."
        Workload: AzureActiveDirectory
        RecordType: 8
        ResultStatus: Success
        Id: gen.uuid()
        InterSystemsId: gen.uuid()
        IntraSystemId: gen.uuid()
        SupportTicketId: ""
        OrganizationId: ref.tenant_id
        ObjectId: ref.target_upn
        UserId: ref.actor_upn
        UserKey: "${ref.actor_puid}@example.onmicrosoft.com"
        UserType: 0
        Version: 1
        AzureActiveDirectoryEventType: 1
        ActorContextId: ref.tenant_id
        TargetContextId: ref.tenant_id
        ClientIP: ""
        ActorIpAddress: ""
        Actor:
          - ID: ref.actor_upn
            Type: 5
          - ID: ref.actor_puid
            Type: 3
          - ID: "User_${ref.actor_oid}"
            Type: 2
          - ID: ref.actor_oid
            Type: 2
          - ID: User
            Type: 2
        Target:
          - ID: "User_${ref.target_oid}"
            Type: 2
          - ID: ref.target_oid
            Type: 2
          - ID: User
            Type: 2
          - ID: ref.target_upn
            Type: 5
          - ID: ref.target_puid
            Type: 3
        ModifiedProperties:
          # Per-user MFA (strong authentication) requirement being restored: the
          # after-state (NewValue) carries an enforced requirement; the
          # before-state (OldValue) was an empty requirement set.
          - Name: StrongAuthenticationRequirement
            NewValue: '[{"RelyingParty":"*","State":1,"RememberDevicesNotIssuedBefore":"2024-01-15T00:00:00Z"}]'
            OldValue: "[]"
          - Name: Included Updated Properties
            NewValue: StrongAuthenticationRequirement
            OldValue: ""
        ExtendedProperties:
          - Name: additionalDetails
            Value: "{}"
          - Name: extendedAuditEventCategory
            Value: User
