type: scenario
description: |
  Defense evasion in Microsoft 365: an administrator changes a user's license
  assignment so that the Microsoft 365 Advanced Auditing plan is added to the
  account's disabled plans, turning off advanced audit logging for that
  account and reducing the telemetry available to defenders. The change is
  recorded as a Microsoft Entra ID "Change user license." activity whose
  detail payload shows the plan moving into the disabled-plans set.
mitre:
  tactics: [defense-evasion]
  techniques: [T1562.008]
