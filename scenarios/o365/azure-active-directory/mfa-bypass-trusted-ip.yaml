type: scenario
description: |
  Credential-access defense weakening in Microsoft 365: an administrator edits
  the tenant's trusted-IP (named location) multi-factor authentication policy
  so that a new IP range is added to the set of locations allowed to skip MFA.
  Sign-ins originating from the newly trusted range bypass the MFA prompt,
  lowering the bar for an attacker who controls that address space. The change
  is recorded as a Microsoft Entra ID "Set Company Information." activity whose
  StrongAuthentication policy after-state lists a trusted CIDR that was not
  present before the change.
mitre:
  tactics: [defense-evasion]
  techniques: [T1562.007]
state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  org_display_name: "Example Organization"
  actor_upn: "adminUser@example.onmicrosoft.com"
  actor_oid: "22222222-2222-2222-2222-222222222222"
  actor_key: gen.uuid()
steps:
  - emit:
      event_type: o365.management@v1
      fields:
        Operation: "Set Company Information."
        Workload: AzureActiveDirectory
        RecordType: 8
        ResultStatus: Success
        Id: gen.uuid()
        InterSystemsId: gen.uuid()
        IntraSystemId: gen.uuid()
        SupportTicketId: ""
        OrganizationId: ref.tenant_id
        UserId: ref.actor_upn
        UserKey: ref.actor_key
        ObjectId: "Company_${ref.tenant_id}"
        UserType: 0
        Version: 1
        AzureActiveDirectoryEventType: 1
        ActorContextId: ref.tenant_id
        TargetContextId: ref.tenant_id
        ClientIP: ""
        ActorIpAddress: ""
        Actor:
          - ID: ref.actor_upn
            Type: 5
          - ID: ref.actor_key
            Type: 3
          - ID: "User_${ref.actor_oid}"
            Type: 2
          - ID: ref.actor_oid
            Type: 2
          - ID: User
            Type: 2
        Target:
          - ID: "Company_${ref.tenant_id}"
            Type: 2
          - ID: ref.tenant_id
            Type: 2
          - ID: Directory
            Type: 2
          - ID: ref.org_display_name
            Type: 1
        ModifiedProperties:
          # StrongAuthentication trusted-IP policy. The after-state (NewValue) adds
          # the attacker-controlled CIDR 198.51.100.66/32 to the corporate range
          # 203.0.113.0/24 already present in the before-state (OldValue); the newly
          # trusted range is the one that gets to skip MFA. RFC 5737 documentation
          # ranges stand in for the corporate and attacker addresses.
          - Name: StrongAuthenticationPolicy
            NewValue: '[{"RelyingPartyStrongAuthenticationPolicies":[{"RelyingParties":["*"],"Rules":[{"SelectionConditions":[{"Claim":1,"Operator":0,"Values":["203.0.113.0/24","198.51.100.66/32"]}]}],"Enabled":true}]}]'
            OldValue: '[{"RelyingPartyStrongAuthenticationPolicies":[{"RelyingParties":["*"],"Rules":[{"SelectionConditions":[{"Claim":1,"Operator":0,"Values":["203.0.113.0/24"]}]}],"Enabled":true}]}]'
          - Name: Included Updated Properties
            NewValue: StrongAuthenticationPolicy
            OldValue: ""
        ExtendedProperties:
          - Name: additionalDetails
            Value: "{}"
          - Name: extendedAuditEventCategory
            Value: Company
