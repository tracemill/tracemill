type: scenario
description: |
  A new inbox rule is created on an Exchange Online mailbox through the
  Exchange administrative API that forwards messages containing a keyword to
  another address. The Microsoft 365 unified audit log records a New-InboxRule
  activity in the Exchange workload whose parameters carry the body keyword,
  for example invoice, the rule's name, for example pws_rule, and the
  forwarding action, for example ForwardTo or ForwardAsAttachmentTo, with its
  recipient, for example collector@mail-archive.example.
mitre:
  tactics: [collection]
  techniques: [T1114.003]
state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  org_name: "example.onmicrosoft.com"
  actor_upn: "compromisedUser@example.onmicrosoft.com"
  actor_key: gen.hex(len=16, case=upper)
  mailbox_object_id: gen.uuid()
  client_ip: gen.ipv4()
  client_port: gen.int(min=1024, max=65535)
  session_id: gen.uuid()
  match_keyword: "invoice"
  rule_name: "pws_rule"
  action_name: "ForwardTo"
  action_value: "collector@mail-archive.example"
steps:
  - emit:
      event_type: o365.management@v1
      fields:
        AppAccessContext:
          IssuedAtTime: "1970-01-01T00:00:00"
          UniqueTokenId: gen.regex(pattern=[A-Za-z0-9_-]{22})
        Id: gen.uuid()
        Operation: New-InboxRule
        OrganizationId: ref.tenant_id
        RecordType: 1
        ResultStatus: "True"
        UserKey: ref.actor_key
        UserType: 2
        Version: 1
        Workload: Exchange
        ClientIP: "${ref.client_ip}:${ref.client_port}"
        ObjectId: "${ref.mailbox_object_id}\\${ref.rule_name}"
        UserId: ref.actor_upn
        AppId: "fb78d390-0c51-40cd-8e17-fdbfab77341b"
        AppPoolName: MSExchangeAdminApiNetCore
        ClientAppId: ""
        ExternalAccess: false
        OrganizationName: ref.org_name
        OriginatingServer: "MN2PR00MB0000 (15.20.7409.026)"
        Parameters:
          - Name: BodyContainsWords
            Value: ref.match_keyword
          - Name: Name
            Value: ref.rule_name
          - Name: ref.action_name
            Value: ref.action_value
        RequestId: gen.uuid()
        SessionId: ref.session_id
