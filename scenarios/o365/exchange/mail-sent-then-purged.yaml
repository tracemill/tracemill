type: scenario
description: |
  A mailbox mails documents to an address outside the organisation and then
  purges the message from its own Sent Items, so the transport log still shows
  the delivery but the mailbox retains no copy of what left. Sending and then
  erasing the evidence of the send is the pairing that separates deliberate
  removal from ordinary mail handling.
mitre:
  tactics: [exfiltration, defense-evasion]
  techniques: ["T1114.001", "T1070.008"]
state:
  tenant_id:  gen.uuid()
  org_name:   "example.onmicrosoft.com"
  sender_upn: "insider@example.onmicrosoft.com"
  # The recipient must share no label with the organisation name: the detection
  # decides internal-versus-external by looking for the organisation's first
  # label inside the recipient address, so a domain like "partner.example.com"
  # would read as internal.
  recipient_addr: "collector@datadrop.test"
  subject:     "FW: Sensitive documents for review"
  mail_host:   "DS0PR08MB8979.namprd08.prod.outlook.com"
  msg_uuid:    gen.hex(len=40, case=upper)
  message_id:  "<${ref.msg_uuid}@${ref.mail_host}>"
  trace_id:    gen.uuid()
  send_id:     gen.uuid()
  purge_id:    gen.uuid()
  mailbox_guid: gen.uuid()
  session_id:  gen.uuid()
  owner_sid:   "S-1-5-21-7359471512-368169602-535915189-5160183"
  src_ip:      gen.ipv4()
  item_id:     gen.hex(len=48, case=upper)
  folder_id:   gen.hex(len=48, case=upper)
  size_bytes:  35275398
  attachments: "Executive Payroll Info.pdf (6281815b); key financials.pdf (1864099b); bank account info.pdf (1545088b)"
  # Folder the sent copy is purged from. Only Sent Items and Recoverable Items
  # are removals of the mailbox's own record of the send.
  purge_folder: "\\Sent Items"
  # The purge must land after the send, or the pairing reads as unordered.
  purge_delay: "5s"
steps:
  - emit:
      event_type: o365.messagetrace@v1
      fields:
        Organization:     ref.org_name
        MessageId:        ref.message_id
        MessageTraceId:   ref.trace_id
        SenderAddress:    ref.sender_upn
        RecipientAddress: ref.recipient_addr
        Subject:          ref.subject
        Status:           Delivered
        FromIP:           ref.src_ip
        ToIP:             null
        Size:             ref.size_bytes
        Index:            0
  - emit:
      event_type: o365.management@v1
      fields:
        Operation: Send
        Workload: Exchange
        RecordType: 2
        ResultStatus: Succeeded
        Id: ref.send_id
        OrganizationId: ref.tenant_id
        OrganizationName: ref.org_name
        UserId: ref.sender_upn
        UserKey: "10037FFE8CCD2298"
        UserType: 0
        Version: 1
        MailboxOwnerUPN: ref.sender_upn
        MailboxOwnerSid: ref.owner_sid
        LogonUserSid: ref.owner_sid
        MailboxGuid: ref.mailbox_guid
        LogonType: 0
        InternalLogonType: 0
        ExternalAccess: false
        SaveToSentItems: true
        ClientIP: ref.src_ip
        ClientIPAddress: ref.src_ip
        ClientInfoString: "Client=MSExchangeRPC"
        ClientProcessName: "OUTLOOK.EXE"
        ClientVersion: "16.0.18129.20030"
        ClientRequestId: "{6CD07038-3CAE-4E61-8C59-87F8B6568837}"
        OriginatingServer: "DS0PR08MB8979 (15.20.4200.000)\r\n"
        SessionId: ref.session_id
        AppAccessContext:
          APIId: ""
        Item:
          Id: ref.item_id
          ImmutableId: ref.item_id
          InternetMessageId: ref.message_id
          Subject: ref.subject
          SizeInBytes: ref.size_bytes
          Attachments: ref.attachments
          ParentFolder:
            Id: ref.folder_id
            Path: "\\Outbox"
  - wait:
      duration: ref.purge_delay
  - emit:
      event_type: o365.management@v1
      fields:
        Operation: HardDelete
        Workload: Exchange
        RecordType: 3
        ResultStatus: Succeeded
        Id: ref.purge_id
        OrganizationId: ref.tenant_id
        OrganizationName: ref.org_name
        UserId: ref.sender_upn
        UserKey: "10037FFE8CCD2298"
        UserType: 0
        Version: 1
        MailboxOwnerUPN: ref.sender_upn
        MailboxOwnerSid: ref.owner_sid
        LogonUserSid: ref.owner_sid
        MailboxGuid: ref.mailbox_guid
        LogonType: 0
        InternalLogonType: 0
        CrossMailboxOperation: false
        ExternalAccess: false
        ClientIP: ref.src_ip
        ClientIPAddress: ref.src_ip
        ClientInfoString: "Client=MSExchangeRPC"
        SessionId: ref.session_id
        Folder:
          Id: ref.folder_id
          Path: ref.purge_folder
        AffectedItems:
          - Id: ref.item_id
            InternetMessageId: ref.message_id
            Subject: ref.subject
            Attachments: ref.attachments
            ParentFolder:
              Id: ref.folder_id
              Path: ref.purge_folder
