type: scenario
description: |
  Defense evasion in Exchange Online: an administrator disables an
  organization-wide Safe Links rule, turning off the time-of-click URL
  scanning that protects mail and Office documents. Recorded in the
  Microsoft 365 unified audit log as a Disable-SafeLinksRule activity in the
  Exchange workload; malicious URLs then reach users unscanned.
  See https://attack.mitre.org/techniques/T1562/001/
mitre:
  tactics: [defense-evasion]
  techniques: [T1562.001]
state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  org_name: "example.onmicrosoft.com"
  actor_upn: "adminUser@example.onmicrosoft.com"
  actor_key: gen.hex(len=16, case=upper)
  client_ip: gen.ipv4()
  client_port: gen.int(min=1024, max=65535)
  session_id: gen.uuid()
  rule_guid: gen.uuid()
steps:
  - emit:
      event_type: o365.management@v1
      fields:
        Operation: Disable-SafeLinksRule
        Workload: Exchange
        RecordType: 1
        ResultStatus: "True"
        Id: gen.uuid()
        OrganizationId: ref.tenant_id
        OrganizationName: ref.org_name
        UserId: ref.actor_upn
        UserKey: ref.actor_key
        UserType: 2
        Version: 1
        ExternalAccess: false
        AppId: "80ccca67-54bd-44ab-8625-4b79c4dc7775"
        AppPoolName: MSExchangeAdminApiAppPool
        ClientAppId: ""
        ClientIP: "${ref.client_ip}:${ref.client_port}"
        ObjectId: "Organization-Wide Safe Links"
        OriginatingServer: "AM0PR00MB0000 (15.20.7249.013)"
        RequestId: gen.uuid()
        SessionId: ref.session_id
        AppAccessContext:
          IssuedAtTime: "2024-01-15T22:21:33"
          UniqueTokenId: gen.hex(len=22, case=lower)
        Parameters:
          - Name: Identity
            Value: ref.rule_guid
