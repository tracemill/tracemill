type: scenario
description: |
  On a compromised mailbox, an inbox rule that already exists is changed so
  that messages matching a keyword are forwarded to an outside address.
  Weaponising a rule the owner already has is quieter than adding one: the
  rule keeps its name and its place in the list, so a review of what rules
  exist shows nothing new, and the mail leaves the organisation.

  Recorded in the Microsoft 365 unified audit log as a rule-modification
  activity in the Exchange workload. It is a different record from a rule
  creation rather than the same record with another verb: it identifies the
  rule it changed and lists only the settings touched, it is attributed to
  the administrative API rather than the web client, and it carries the
  account handle in place of the address.
  See https://attack.mitre.org/techniques/T1114/003/
mitre:
  tactics: [collection, exfiltration]
  techniques: [T1114.003]
state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  org_name: "example.onmicrosoft.com"
  actor_upn: "compromisedUser@example.onmicrosoft.com"
  actor_key: "100320030DF47B14"
  client_ip: gen.ipv4()
  client_port: gen.int(min=1024, max=65535)
  session_id: gen.uuid()
  # The rule being changed, named as the owner sees it. It is carried twice:
  # once with the mailbox as the object the record acts on, and once as the
  # Identity setting.
  mailbox_guid: gen.uuid()
  rule_handle: gen.int(min=1000000000000000000, max=9000000000000000000)
  rule_name: "outlook2_rule"
  match_keyword: "invoice"
  action_name: "ForwardTo"
  action_value: "collector@mail-archive.example"
steps:
  - emit:
      event_type: o365.management@v1
      fields:
        Operation: set-InboxRule
        Workload: Exchange
        RecordType: 1
        ResultStatus: "True"
        Id: gen.uuid()
        OrganizationId: ref.tenant_id
        OrganizationName: ref.org_name
        UserId: ref.actor_upn
        UserKey: ref.actor_key
        UserType: 2
        Version: 1
        ExternalAccess: false
        AppId: "fb78d390-0c51-40cd-8e17-fdbfab77341b"
        AppPoolName: MSExchangeAdminApiNetCore
        ClientAppId: ""
        ClientIP: "${ref.client_ip}:${ref.client_port}"
        ObjectId: "${ref.mailbox_guid}\\${ref.rule_handle}"
        OriginatingServer: "MN2PR18MB3053 (15.20.7409.026)"
        RequestId: gen.uuid()
        SessionId: ref.session_id
        AppAccessContext:
          IssuedAtTime: "2024-03-28T18:52:13"
          UniqueTokenId: "0l26eXfIIkSUMZPlP5IFAA"
        Parameters:
          - Name: ref.action_name
            Value: ref.action_value
          - Name: Identity
            Value: ref.rule_name
          - Name: BodyContainsWords
            Value: ref.match_keyword
