type: scenario
description: |
  Defense evasion in Exchange Online mail protection: an administrator creates a
  new Safe Attachments policy with a permissive configuration. Safe Attachments
  detonates email attachments in a sandbox before delivery; the new policy is
  created disabled and set to allow messages through, so attachments are
  delivered without sandbox scanning for the mailboxes it is later scoped to.
  The change is recorded in the Microsoft 365 unified audit log as a
  New-SafeAttachmentPolicy activity in the Exchange workload, naming the policy
  and its parameters. Introducing a permissive Safe Attachments policy lets
  malicious attachments reach users unscanned and is a known way to weaken a
  tenant's mail defenses ahead of a malware campaign.
  See https://attack.mitre.org/techniques/T1562/001/
mitre:
  tactics: [defense-evasion]
  techniques: [T1562.001]
state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  org_name: "example.onmicrosoft.com"
  actor_upn: "adminUser@example.onmicrosoft.com"
  actor_key: gen.hex(len=16, case=upper)
  client_ip: gen.ipv4()
  client_port: gen.int(min=1024, max=65535)
  session_id: gen.uuid()
  # Name of the permissive Safe Attachments policy that is created.
  policy_name: "Bypass Attachment Scanning"
steps:
  - emit:
      event_type: o365.management@v1
      fields:
        Operation: New-SafeAttachmentPolicy
        Workload: Exchange
        RecordType: 1
        ResultStatus: "True"
        Id: gen.uuid()
        OrganizationId: ref.tenant_id
        OrganizationName: ref.org_name
        UserId: ref.actor_upn
        UserKey: ref.actor_key
        UserType: 2
        Version: 1
        ExternalAccess: false
        AppId: "80ccca67-54bd-44ab-8625-4b79c4dc7775"
        AppPoolName: MSExchangeAdminApiAppPool
        ClientAppId: ""
        ClientIP: "${ref.client_ip}:${ref.client_port}"
        # Tenant-qualified name of the new policy.
        ObjectId: "${ref.org_name}\\${ref.policy_name}"
        OriginatingServer: "AM0PR00MB0000 (15.20.7181.018)"
        RequestId: gen.uuid()
        SessionId: ref.session_id
        AppAccessContext:
          IssuedAtTime: "2024-01-15T18:53:20"
          UniqueTokenId: gen.hex(len=22, case=lower)
        # New policy created disabled and set to allow messages through, so
        # attachments are delivered without sandbox detonation.
        Parameters:
          - Name: Name
            Value: ref.policy_name
          - Name: Enable
            Value: "False"
          - Name: Action
            Value: Allow
