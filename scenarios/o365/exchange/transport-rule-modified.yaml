type: scenario
description: |
  An existing Exchange transport rule is modified so that messages matching a
  subject pattern are deleted in transit. Changing a rule that is already in
  place is quieter than adding one: the rule keeps its name and position, and
  only its behaviour changes, so a review of what rules exist shows nothing new.

  This is the modification form of the same mail-flow tampering. It differs
  from the creation form in more than the cmdlet: the record names the rule it
  changed rather than carrying an empty object, and it lists only the settings
  that were touched instead of the rule's full configuration.
mitre:
  tactics: [defense-evasion]
  techniques: ["T1564.008"]
state:
  tenant_id:       "11111111-1111-1111-1111-111111111111"
  org_name:        "example.onmicrosoft.com"
  actor_upn:       "admin@example.onmicrosoft.com"
  src_ip:          gen.ipv4()
  src_port:        gen.int(min=1024, max=65535)
  record_id:       gen.uuid()
  device_id:       gen.uuid()
  request_id:      gen.uuid()
  session_id:      gen.uuid()
  token_object_id: gen.uuid()
  app_id:          "497effe9-df71-4043-a8bb-14cf78c4b63b"
  operation:       "Set-TransportRule"
  # The rule being changed. It is carried twice: as the object the record acts
  # on, and as the Identity setting, which is what a consumer keys on to tell
  # which rule moved.
  rule_id:         gen.uuid()
  rule_name:       "Password Reset Email Drop"
  match_subject:   "Password was reset."
  priority:        "2"
steps:
  - emit:
      event_type: o365.management@v1
      fields:
        Operation: ref.operation
        Workload: Exchange
        RecordType: 1
        ResultStatus: "True"
        Id: ref.record_id
        OrganizationId: ref.tenant_id
        OrganizationName: ref.org_name
        UserId: ref.actor_upn
        UserKey: ref.actor_upn
        UserType: 2
        Version: 1
        ObjectId: ref.rule_name
        ClientIP: "${ref.src_ip}:${ref.src_port}"
        ClientAppId: ""
        CorrelationID: ""
        AppId: ref.app_id
        AppPoolName: MSExchangeAdminApiNetCore
        DeviceId: ref.device_id
        ExternalAccess: false
        OriginatingServer: "SN6PR08MB5488 (15.20.8335.015)"
        RequestId: ref.request_id
        SessionId: ref.session_id
        TokenObjectId: ref.token_object_id
        TokenTenantId: ref.tenant_id
        AppAccessContext:
          AADSessionId: ref.session_id
          IssuedAtTime: "2025-01-14T14:35:03"
          UniqueTokenId: "fjnbEEQzJkybACRSqMNcAA"
        Parameters:
          - Name: Priority
            Value: ref.priority
          - Name: Identity
            Value: ref.rule_id
          - Name: Name
            Value: ref.rule_name
          - Name: SubjectMatchesPatterns
            Value: ref.match_subject
          - Name: DeleteMessage
            Value: "True"
