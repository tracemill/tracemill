type: scenario
description: |
  An administrator assigns an Exchange Online management role to an account,
  recorded in the Microsoft 365 unified audit log as a
  New-ManagementRoleAssignment activity in the Exchange workload.

  The granted role and the assignee travel in the activity's Parameters
  name/value list rather than as top-level properties, so the role is bound by
  the job: a broad delegation role such as ApplicationImpersonation lets its
  holder act as any mailbox in the tenant, while a narrowly scoped
  administrative role is routine maintenance.
  See https://attack.mitre.org/techniques/T1098/002/
mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1098.002]
state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  org_name: "example.onmicrosoft.com"
  actor_upn: "adminUser@example.onmicrosoft.com"
  actor_key: gen.hex(len=16, case=upper)
  client_ip: gen.ipv4()
  client_port: gen.int(min=1024, max=65535)
  session_id: gen.uuid()
  assignee_upn: "serviceAccount@example.onmicrosoft.com"
  assignment_name: "role-assignment"
  role_name: "ApplicationImpersonation"
steps:
  - emit:
      event_type: o365.management@v1
      fields:
        Operation: New-ManagementRoleAssignment
        Workload: Exchange
        RecordType: 1
        ResultStatus: "True"
        Id: gen.uuid()
        OrganizationId: ref.tenant_id
        OrganizationName: ref.org_name
        UserId: ref.actor_upn
        UserKey: ref.actor_key
        UserType: 2
        Version: 1
        ExternalAccess: false
        AppId: gen.uuid()
        ClientAppId: ""
        ClientIP: "${ref.client_ip}:${ref.client_port}"
        ObjectId: "${ref.org_name}\\${ref.assignment_name}"
        OriginatingServer: "AM0PR00MB0000 (15.20.7386.023)"
        RequestId: gen.uuid()
        SessionId: ref.session_id
        AppAccessContext:
          IssuedAtTime: "2024-01-15T21:30:16"
          UniqueTokenId: gen.hex(len=22, case=lower)
        Parameters:
          - Name: User
            Value: ref.assignee_upn
          - Name: Name
            Value: ref.assignment_name
          - Name: Role
            Value: ref.role_name
