type: scenario
description: |
  An administrator account sets mailbox-level forwarding on an Exchange Online
  mailbox, so its incoming mail is forwarded to another address. The
  Microsoft 365 unified audit log records a Set-Mailbox activity in the
  Exchange workload whose parameters carry the mailbox identity, for example
  jdoe@example.onmicrosoft.com, and a forwarding setting, for example
  ForwardingSmtpAddress set to smtp:collector@mail-archive.example or
  ForwardingAddress set to a recipient in the organization. An empty
  forwarding value clears that setting.
mitre:
  tactics: [collection]
  techniques: [T1114.003]
state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  org_name: "example.onmicrosoft.com"
  actor_upn: "admin@example.onmicrosoft.com"
  actor_key: gen.hex(len=16, case=upper)
  client_ip: gen.ipv4()
  client_port: gen.int(min=1024, max=65535)
  session_id: gen.uuid()
  mailbox_alias: "jdoe"
  mailbox_upn: "${ref.mailbox_alias}@${ref.org_name}"
  forwarding_param: "ForwardingSmtpAddress"
  forwarding_value: "smtp:collector@mail-archive.example"
  # The record lists the two parameters in an order that depends on the
  # forwarding parameter: ForwardingSmtpAddress after Identity,
  # ForwardingAddress before it. Both positions are bindable.
  first_param_name: "Identity"
  first_param_value: ref.mailbox_upn
  second_param_name: ref.forwarding_param
  second_param_value: ref.forwarding_value
steps:
  - emit:
      event_type: o365.management@v1
      fields:
        AppId: ""
        ClientAppId: ""
        ClientIP: "${ref.client_ip}:${ref.client_port}"
        ExternalAccess: false
        Id: gen.uuid()
        ObjectId: ref.mailbox_alias
        Operation: Set-Mailbox
        OrganizationId: ref.tenant_id
        OrganizationName: ref.org_name
        OriginatingServer: "PH0PR00MB0000 (15.20.3654.025)"
        Parameters:
          - Name: ref.first_param_name
            Value: ref.first_param_value
          - Name: ref.second_param_name
            Value: ref.second_param_value
        RecordType: 1
        ResultStatus: "True"
        SessionId: ref.session_id
        UserId: ref.actor_upn
        UserKey: ref.actor_key
        UserType: 2
        Version: 1
        Workload: Exchange
