type: scenario
description: |
  A new inbox rule is created on an Exchange Online mailbox that moves
  messages into another folder, marks them as read and stops processing
  further rules. The Microsoft 365 unified audit log records a New-InboxRule
  activity in the Exchange workload whose parameters carry the rule's name,
  for example the three-character name ",.m", its destination folder, for
  example Conversation History, MarkAsRead set to True and
  StopProcessingRules set to True.
mitre:
  tactics: [defense-evasion]
  techniques: [T1564.008]
state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  org_name: "example.onmicrosoft.com"
  actor_upn: "compromisedUser@example.onmicrosoft.com"
  actor_object_id: gen.uuid()
  client_ip: gen.ipv4()
  client_port: gen.int(min=1024, max=65535)
  session_id: gen.uuid()
  rule_name: ",.m"
  move_to_folder: "Conversation History"
steps:
  - emit:
      event_type: o365.management@v1
      fields:
        AppAccessContext:
          AADSessionId: ref.session_id
          IssuedAtTime: "1970-01-01T00:00:00"
          UniqueTokenId: gen.regex(pattern=[A-Za-z0-9_-]{22})
        Id: gen.uuid()
        Operation: New-InboxRule
        OrganizationId: ref.tenant_id
        RecordType: 1
        ResultStatus: "True"
        UserKey: ref.actor_upn
        UserType: 2
        Version: 1
        Workload: Exchange
        ClientIP: "${ref.client_ip}:${ref.client_port}"
        ObjectId: "NAMPR17A009.PROD.OUTLOOK.COM/Microsoft Exchange Hosted Organizations/${ref.org_name}/${ref.actor_object_id}\\${ref.rule_name}"
        UserId: ref.actor_upn
        AppId: "00000002-0000-0ff1-ce00-000000000000"
        AppPoolName: MSExchangeOWAAppPool
        ClientAppId: ""
        CorrelationID: ""
        ExternalAccess: false
        OrganizationName: ref.org_name
        OriginatingServer: "SJ2PR17MB6442 (15.20.8335.015)"
        Parameters:
          - Name: AlwaysDeleteOutlookRulesBlob
            Value: "False"
          - Name: Force
            Value: "False"
          - Name: MoveToFolder
            Value: ref.move_to_folder
          - Name: Name
            Value: ref.rule_name
          - Name: MarkAsRead
            Value: "True"
          - Name: StopProcessingRules
            Value: "True"
        RequestId: gen.uuid()
        SessionId: ref.session_id
        TokenObjectId: ref.actor_object_id
        TokenTenantId: ref.tenant_id
