type: scenario
description: |
  Defense evasion in Exchange Online: on a compromised mailbox, a new inbox
  rule is created that silently relocates messages matching a chosen keyword
  into the seldom-read RSS Subscriptions folder and stops any further rule
  processing, hiding attacker-relevant mail -- security alerts, password-reset
  and login notifications -- from the account owner. Recorded in the Microsoft
  365 unified audit log as a New-InboxRule activity in the Exchange workload.
  See https://attack.mitre.org/techniques/T1564/008/
mitre:
  tactics: [defense-evasion]
  techniques: [T1564.008]
state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  org_name: "example.onmicrosoft.com"
  actor_upn: "compromisedUser@example.onmicrosoft.com"
  client_ip: gen.ipv4()
  client_port: gen.int(min=1024, max=65535)
  session_id: gen.uuid()
  rule_name: "clear category"
  match_keyword: "invoice"
  # The action the rule takes on a matching message. Only a subset of inbox-rule
  # actions relocates or forwards mail; a job can bind these to model a rule
  # whose action leaves the message where the owner will still see it.
  action_name:  "MoveToFolder"
  action_value: "RSS Subscriptions"
steps:
  - emit:
      event_type: o365.management@v1
      fields:
        Operation: New-InboxRule
        Workload: Exchange
        RecordType: 1
        ResultStatus: "True"
        Id: gen.uuid()
        OrganizationId: ref.tenant_id
        OrganizationName: ref.org_name
        UserId: ref.actor_upn
        UserKey: ref.actor_upn
        UserType: 2
        Version: 1
        ExternalAccess: false
        AppId: "00000002-0000-0ff1-ce00-000000000000"
        AppPoolName: MSExchangeOWAAppPool
        ClientAppId: ""
        CorrelationID: ""
        ClientIP: "${ref.client_ip}:${ref.client_port}"
        ObjectId: "NAMPR00A000.PROD.OUTLOOK.COM/Microsoft Exchange Hosted Organizations/${ref.org_name}/${ref.actor_upn}\\${ref.rule_name}"
        OriginatingServer: "AM0PR00MB0000 (15.20.8137.018)"
        RequestId: gen.uuid()
        SessionId: ref.session_id
        AppAccessContext:
          AADSessionId: ref.session_id
          IssuedAtTime: "1970-01-01T00:00:00"
          UniqueTokenId: gen.hex(len=22, case=lower)
        Parameters:
          - Name: AlwaysDeleteOutlookRulesBlob
            Value: "False"
          - Name: Force
            Value: "False"
          - Name: ref.action_name
            Value: ref.action_value
          - Name: Name
            Value: ref.rule_name
          - Name: SubjectOrBodyContainsWords
            Value: ref.match_keyword
          - Name: StopProcessingRules
            Value: "True"
