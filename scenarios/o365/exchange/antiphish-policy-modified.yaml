type: scenario
description: |
  Defense evasion in Exchange Online: an administrator weakens an
  anti-phishing policy, adding attacker-controlled domains and senders to its
  exclusion lists and disabling targeted-domain impersonation protection, so
  mail from those origins bypasses anti-phishing controls. Recorded in the
  Microsoft 365 unified audit log as a Set-AntiPhishPolicy activity in the
  Exchange workload.
  See https://attack.mitre.org/techniques/T1562/001/
mitre:
  tactics: [defense-evasion]
  techniques: [T1562.001]
state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  org_name: "example.onmicrosoft.com"
  actor_upn: "adminUser@example.onmicrosoft.com"
  actor_key: gen.hex(len=16, case=upper)
  client_ip: gen.ipv4()
  client_port: gen.int(min=1024, max=65535)
  session_id: gen.uuid()
  excluded_domain: "attacker-controlled.example"
  excluded_sender: "phisher@attacker-controlled.example"
steps:
  - emit:
      event_type: o365.management@v1
      fields:
        Operation: Set-AntiPhishPolicy
        Workload: Exchange
        RecordType: 1
        ResultStatus: "True"
        Id: gen.uuid()
        OrganizationId: ref.tenant_id
        OrganizationName: ref.org_name
        UserId: ref.actor_upn
        UserKey: ref.actor_key
        UserType: 2
        Version: 1
        ExternalAccess: false
        AppId: "80ccca67-54bd-44ab-8625-4b79c4dc7775"
        AppPoolName: MSExchangeAdminApiNetCore
        ClientAppId: ""
        ClientIP: "${ref.client_ip}:${ref.client_port}"
        ObjectId: "Executive Anti-Impersonation"
        OriginatingServer: "AM0PR00MB0000 (15.20.7386.023)"
        RequestId: gen.uuid()
        SessionId: ref.session_id
        AppAccessContext:
          IssuedAtTime: "2024-01-15T21:30:16"
          UniqueTokenId: gen.hex(len=22, case=lower)
        Parameters:
          - Name: Identity
            Value: "Executive Anti-Impersonation"
          - Name: ExcludedDomains
            Value: ref.excluded_domain
          - Name: ExcludedSenders
            Value: ref.excluded_sender
          - Name: EnableTargetedDomainsProtection
            Value: "False"
          - Name: EnableOrganizationDomainsProtection
            Value: "False"
          - Name: ImpersonationProtectionState
            Value: Manual
          - Name: EnableSpoofIntelligence
            Value: "True"
          - Name: AuthenticationFailAction
            Value: Quarantine
