type: job
name: O365 Privileged Role Assigned To Service Principal
detection:
  source: escu
  name: "ESCU - O365 Privileged Role Assigned To Service Principal - Rule"
  id: 80f3fc1b-705f-4080-bf08-f61bf013b900
description: |
  Validates detection of a privileged Microsoft Entra ID directory role being
  granted to a service principal, which lets a workload identity act on the
  directory with no sign-in or multi-factor prompt. The control grants the same
  class of role to a user account, which the detection excludes.
mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1098.003]
state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  admin_upn: "adminUser@example.onmicrosoft.com"
  sp_object_id: gen.uuid()
  sp_object_ref: "ServicePrincipal_${ref.sp_object_id}"
workloads:
  - scenario: scenarios/o365/azure-active-directory/privileged-role-assigned-to-service-principal
    bindings:
      tenant_id: ref.tenant_id
      actor_upn: ref.admin_upn
      sp_object_id: ref.sp_object_id
    expectation:
      expected: alert
      summary: >-
        A privileged directory role is granted to a service principal and must
        raise the detection.
      mitre:
        tactics: [persistence, privilege-escalation]
        techniques: [T1098.003]
      # The detection rebuilds its group keys from the record's nested lists,
      # so the alert is matched on its result rows.
      correlation:
        user: ref.sp_object_ref
        src_user: ref.admin_upn
        vendor_product: "Microsoft Office 365 AzureActiveDirectory"
  - scenario: scenarios/o365/azure-active-directory/privileged-role-assigned
    bindings:
      tenant_id: ref.tenant_id
      actor_upn: ref.admin_upn
    expectation:
      expected: none
      summary: >-
        The same administrator grants a privileged role to a user account. The
        detection scopes to non-user assignees, so this must not alert.
