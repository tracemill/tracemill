type: job
name: O365 High Number Of Failed Authentications for User
description: |
  Validates detection of a brute-force against a single account: 14 failed
  Entra ID sign-ins for one user from one address, above the >10 gate.
  The control fails four times for a different user, below it.
detection:
  source: escu
  name: "ESCU - O365 High Number Of Failed Authentications for User - Rule"
  id: 31641378-2fa9-42b1-948e-25e281cb98f7

mitre:
  tactics: [credential-access]
  techniques: ["T1110.001"]

state:
  tenant_id:    "11111111-1111-1111-1111-111111111111"
  victim_upn:   "targetuser@example.onmicrosoft.com"
  control_upn:  "analyst@example.onmicrosoft.com"
  attacker_src: gen.ipv4()
  control_src:  gen.ipv4()

workloads:
  - scenario: scenarios/o365/azure-active-directory/entra-signin-failure
    loop: 14
    bindings:
      tenant_id: ref.tenant_id
      actor_upn: ref.victim_upn
      src_ip:    ref.attacker_src
    expectation:
      expected: alert
      summary: "Repeated failed sign-ins against one account from one address"
      mitre:
        tactics: [credential-access]
        techniques: ["T1110.001"]

  - scenario: scenarios/o365/azure-active-directory/entra-signin-failure
    loop: 4
    bindings:
      tenant_id: ref.tenant_id
      actor_upn: ref.control_upn
      src_ip:    ref.control_src
    expectation:
      expected: none
      summary: "Four failures for one user stays below the gate"
