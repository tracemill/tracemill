type: job
detection:
  source: escu
  name: "O365 FullAccessAsApp Permission Assigned"
  id: 01a510b3-a6ac-4d50-8812-7e8a3cde3d79
description: |
  Validates detection of the Office 365 Exchange Online application permission
  full_access_as_app being granted to an application registration in Microsoft
  Entra ID (persistence / privilege escalation). An administrator updates an
  application registration so its RequiredResourceAccess gains the Exchange Online
  resource application with the full_access_as_app app role -- recorded as an
  "Update application." activity in the AzureActiveDirectory workload -- and the
  detection must raise an alert. The detection aggregates one result row per
  grant, matched to the modifying administrator, the operation signature, and the
  vendor product.
mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1098.002, T1098.003]
state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  admin_upn: "adminUser@example.onmicrosoft.com"
workloads:
  - scenario: scenarios/o365/azure-active-directory/full-access-as-app-grant
    bindings:
      tenant_id: ref.tenant_id
      actor_upn: ref.admin_upn
    expectation:
      expected: alert
      summary: >-
        Granting the Office 365 Exchange Online full_access_as_app application
        permission to an application registration (an "Update application."
        activity in the AzureActiveDirectory workload whose RequiredResourceAccess
        gains the full_access_as_app app role) raises the full-access-as-app-grant
        alert.
      mitre:
        tactics: [persistence, privilege-escalation]
        techniques: [T1098.002, T1098.003]
      correlation:
        user: ref.admin_upn
        signature: "Update application."
        vendor_product: "Microsoft Office 365 AzureActiveDirectory"
