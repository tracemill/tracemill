type: job
name: O365 Application Registration Owner Added
detection:
  source: escu
  name: "ESCU - O365 Application Registration Owner Added - Rule"
  id: c068d53f-6aaa-4558-8011-3734df878266
description: |
  Validates detection of an application-registration ownership change in
  Microsoft Entra ID (persistence). An administrator adds a new owner to an
  existing application registration -- recorded as an "Add owner to
  application." activity in the AzureActiveDirectory workload -- and the
  detection must raise an alert. A paired control has the same administrator
  edit the same application's reply URLs through an "Update application."
  operation, with no change of ownership, and must not raise the detection --
  confirming it discriminates on the ownership grant, not on application
  maintenance in general. The detection aggregates one result row per ownership
  change, so the alerting workload is matched to its row by the administrator,
  the operation signature, and the vendor product -- fields always present on
  the audit record, unlike the source IP, which Entra leaves empty for many
  non-interactive flows.
mitre:
  tactics: [persistence]
  techniques: [T1098]
state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  # One administrator manages the application; distinct source sessions for the
  # ownership grant and the routine edit.
  admin_upn: "adminUser@example.onmicrosoft.com"
  owner_add_src: gen.ipv4()
  app_edit_src: gen.ipv4()
  # The application both workloads act on, pinned once so the grant and the edit
  # target the same registration.
  app_object_id: gen.uuid()
  app_display_name: "Contoso Line-Of-Business App"
  new_owner_upn: "ownerUser@example.onmicrosoft.com"
workloads:
  - scenario: scenarios/o365/azure-active-directory/app-registration-owner-added
    bindings:
      tenant_id: ref.tenant_id
      actor_upn: ref.admin_upn
      actor_ip: ref.owner_add_src
      app_object_id: ref.app_object_id
      app_display_name: ref.app_display_name
      owner_upn: ref.new_owner_upn
    expectation:
      expected: alert
      summary: >-
        Adding a new owner to an existing application registration (an "Add
        owner to application." activity in the AzureActiveDirectory workload)
        raises the application-registration-owner-added alert.
      mitre:
        tactics: [persistence]
        techniques: [T1098]
      correlation:
        signature: "Add owner to application."
        user: ref.admin_upn
        vendor_product: "Microsoft Office 365 AzureActiveDirectory"
  - scenario: scenarios/o365/azure-active-directory/app-registration-updated
    bindings:
      tenant_id: ref.tenant_id
      actor_upn: ref.admin_upn
      actor_ip: ref.app_edit_src
      app_object_id: ref.app_object_id
      app_display_name: ref.app_display_name
    expectation:
      expected: none
      summary: >-
        Editing an application registration's reply URLs through an "Update
        application." operation, with no change of ownership, is routine
        application maintenance and must not raise the detection.
