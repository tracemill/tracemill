type: job
name: O365 Service Principal New Client Credentials
detection:
  source: escu
  name: "ESCU - O365 Service Principal New Client Credentials - Rule"
  id: a1b229e9-d962-4222-8c62-905a8a010453
description: |
  Validates detection of a new client secret being added to a Microsoft Entra
  ID application registration, which authenticates as that application without
  a password or multi-factor prompt. The control edits the same registration's
  redirect URLs, confirming the detection discriminates on the credential
  change rather than on application edits generally.
mitre:
  tactics: [persistence]
  techniques: [T1098.001]
state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  admin_upn: "adminUser@example.onmicrosoft.com"
  admin_puid: "1003BFFD98415B4E"
  app_object_id: gen.uuid()
  # How the registration is named in the audit record; fresh per run, so it is
  # what gives the correlation map run identity.
  app_object_ref: "Application_${ref.app_object_id}"
  app_display_name: "Contoso Line-Of-Business App"
workloads:
  - scenario: scenarios/o365/azure-active-directory/app-registration-client-secret-added
    bindings:
      tenant_id: ref.tenant_id
      actor_upn: ref.admin_upn
      actor_puid: ref.admin_puid
      app_object_id: ref.app_object_id
      app_display_name: ref.app_display_name
      added_key_name: "svc-automation"
    expectation:
      expected: alert
      summary: >-
        A new client secret is added to an existing application registration,
        giving its holder application-level access, and must raise the
        detection.
      mitre:
        tactics: [persistence]
        techniques: [T1098.001]
      # The detection aggregates away the per-event record id and splits rows on
      # a multivalue field, so the alert is matched on fields stable across rows.
      correlation:
        ObjectId: ref.app_object_ref
        user: ref.admin_upn
        vendor_product: "Microsoft Office 365 AzureActiveDirectory"
  - scenario: scenarios/o365/azure-active-directory/app-registration-updated
    bindings:
      tenant_id: ref.tenant_id
      actor_upn: ref.admin_upn
      actor_puid: ref.admin_puid
      app_object_id: ref.app_object_id
      app_display_name: ref.app_display_name
    expectation:
      expected: none
      summary: >-
        The same administrator updates the same registration's redirect URLs.
        No credential is added, so this must not raise the detection.
