type: job
detection:
  source: escu
  name: "O365 Email Security Feature Changed"
  id: 4d28013d-3a0f-4d65-a33f-4e8009fee0ae
description: |
  Validates detection of Exchange Online email-security controls being altered
  by an administrator. Four workloads, run as one admin session from a single
  source address, each weaken a different advanced mail-protection feature: a
  Safe Links rule is disabled, an anti-phishing policy is loosened to exclude
  attacker-controlled origins, a permissive Safe Attachments policy is created,
  and a permissive malware filter policy is created. Each change is an audited
  Exchange administrative activity that must raise the alert.

  The detection aggregates by a renamed per-record identifier, so the alert is
  matched back to each workload on the aggregate result row rather than on the
  individual audit record: the row's signature (the administrative operation,
  distinct per workload) plus the normalized vendor product uniquely identify
  the change that produced it.
mitre:
  tactics: [defense-evasion]
  techniques: [T1562.001]
state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  org_name: "example.onmicrosoft.com"
  attacker_upn: "adminUser@example.onmicrosoft.com"
  attacker_ip: gen.ipv4()
workloads:
  - scenario: scenarios/o365/exchange/safelinks-rule-disabled
    bindings:
      tenant_id: ref.tenant_id
      org_name: ref.org_name
      actor_upn: ref.attacker_upn
      client_ip: ref.attacker_ip
    expectation:
      expected: alert
      summary: >-
        Disabling an organization-wide Safe Links rule turns off time-of-click
        URL protection and raises the email-security-feature-changed alert.
      mitre:
        tactics: [defense-evasion]
        techniques: [T1562.001]
      correlation:
        signature: "Disable-SafeLinksRule"
        vendor_product: "Microsoft Office 365 Exchange"
  - scenario: scenarios/o365/exchange/antiphish-policy-modified
    bindings:
      tenant_id: ref.tenant_id
      org_name: ref.org_name
      actor_upn: ref.attacker_upn
      client_ip: ref.attacker_ip
    expectation:
      expected: alert
      summary: >-
        Loosening an anti-phishing policy to exclude attacker-controlled origins
        weakens impersonation protection and raises the alert.
      mitre:
        tactics: [defense-evasion]
        techniques: [T1562.001]
      correlation:
        signature: "Set-AntiPhishPolicy"
        vendor_product: "Microsoft Office 365 Exchange"
  - scenario: scenarios/o365/exchange/safeattachment-policy-created
    bindings:
      tenant_id: ref.tenant_id
      org_name: ref.org_name
      actor_upn: ref.attacker_upn
      client_ip: ref.attacker_ip
    expectation:
      expected: alert
      summary: >-
        Creating a permissive Safe Attachments policy that delivers attachments
        without sandbox scanning raises the alert.
      mitre:
        tactics: [defense-evasion]
        techniques: [T1562.001]
      correlation:
        signature: "New-SafeAttachmentPolicy"
        vendor_product: "Microsoft Office 365 Exchange"
  - scenario: scenarios/o365/exchange/malware-filter-policy-created
    bindings:
      tenant_id: ref.tenant_id
      org_name: ref.org_name
      actor_upn: ref.attacker_upn
      client_ip: ref.attacker_ip
    expectation:
      expected: alert
      summary: >-
        Creating a permissive malware filter policy that disables attachment
        filtering and zero-hour auto purge raises the alert.
      mitre:
        tactics: [defense-evasion]
        techniques: [T1562.001]
      correlation:
        signature: "New-MalwareFilterPolicy"
        vendor_product: "Microsoft Office 365 Exchange"
