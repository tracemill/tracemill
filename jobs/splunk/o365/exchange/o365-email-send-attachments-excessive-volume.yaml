type: job
name: Bulk Document Set Mailed Outside the Organisation
description: >-
  A mailbox sends dozens of documents to an external address in one message,
  alongside a second mailbox sending an ordinary three-attachment message to
  the same kind of address.
mitre:
  tactics: [defense-evasion, impact]
  techniques: ["T1070.008", "T1485"]
detection:
  source: escu
  name: "ESCU - O365 Email Send Attachments Excessive Volume - Rule"
  id: 70a050a2-8537-488a-a628-b60a9558d96a
state:
  tenant_id:    "11111111-1111-1111-1111-111111111111"
  org_name:     "example.onmicrosoft.com"
  insider_upn:  "bulk-send-insider@example.onmicrosoft.com"
  routine_upn:  "bulk-send-routine@example.onmicrosoft.com"
  # file_size is an output field, so the control sizes its own three documents.
  control_item_size:      243556
  control_transport_size: 333672
workloads:
  - scenario: scenarios/o365/exchange/mail-send-bulk-attachments
    bindings:
      tenant_id:  ref.tenant_id
      org_name:   ref.org_name
      sender_upn: ref.insider_upn
    expectation:
      expected: alert
      summary: "Thirty-three documents mailed to an external address in one message"
      mitre:
        tactics: [defense-evasion, impact]
        techniques: ["T1070.008", "T1485"]

  # Same send, to the same external domain, carrying an ordinary number of
  # documents -- the count is the only thing that differs.
  - scenario: scenarios/o365/exchange/mail-send-bulk-attachments
    bindings:
      tenant_id:   ref.tenant_id
      org_name:    ref.org_name
      sender_upn:  ref.routine_upn
      subject:     "Q3 close pack"
      attachments: "Q3 report.pdf (128444b); Meeting notes.docx (24110b); Budget draft.xlsx (91002b)"
      size_bytes:      ref.control_item_size
      transport_size:  ref.control_transport_size
    expectation:
      expected: none

  # Recipients inside the sender's own domain are nulled out before the count.
  - scenario: scenarios/o365/exchange/mail-send-bulk-attachments
    bindings:
      tenant_id:      ref.tenant_id
      org_name:       ref.org_name
      sender_upn:     ref.insider_upn
      recipient_addr: "records.archive@example.onmicrosoft.com"
    expectation:
      expected: none
      summary: "A bulk send to an internal recipient is excluded before the count applies"
