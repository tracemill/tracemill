type: job
name: O365 Email Password and Payroll Compromise Behavior
description: |
  Validates detection of payroll-fraud clean-up: a direct-deposit
  notification and a credential-reset notification are both delivered to
  one mailbox and then deleted from it, tied together by message id across
  the transport and mailbox-audit feeds.

  The control deletes two credential notifications and no payroll one, so
  only one of the two subject classes the rule requires is present.
detection:
  source: escu
  name: "ESCU - O365 Email Password and Payroll Compromise Behavior - Rule"
  id: e36de71a-6bdc-4002-98ff-e3e51b0d8f96

mitre:
  tactics: [defense-evasion, impact, collection]
  techniques: ["T1070.008", "T1485", "T1114.001"]

state:
  tenant_id:   "11111111-1111-1111-1111-111111111111"
  victim_upn:  "victim@example.onmicrosoft.com"
  control_upn: "analyst@example.onmicrosoft.com"

workloads:
  - scenario: scenarios/o365/exchange/payroll-and-credential-mail-deleted
    bindings:
      tenant_id:  ref.tenant_id
      victim_upn: ref.victim_upn
    expectation:
      expected: alert
      summary: "Payroll and credential notifications deleted from one mailbox"
      mitre:
        tactics: [defense-evasion, impact, collection]
        techniques: ["T1070.008", "T1485", "T1114.001"]

  - scenario: scenarios/o365/exchange/payroll-and-credential-mail-deleted
    bindings:
      tenant_id:       ref.tenant_id
      victim_upn:      ref.control_upn
      payroll_subject: "Account Recovery Notification"
    expectation:
      expected: none
      summary: "Two credential notifications without a payroll one satisfy only half the rule"
