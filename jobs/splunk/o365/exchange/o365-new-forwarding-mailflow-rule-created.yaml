type: job
name: O365 New Forwarding Mailflow Rule Created
detection:
  source: escu
  name: "ESCU - O365 New Forwarding Mailflow Rule Created - Rule"
  id: 289ed0a1-4c78-4a43-9321-44ea2e089c14
description: |
  Validates detection of a new transport rule configured to blind-copy
  mail to an outside address. The New-TransportRule record lists the rule's
  name and a BlindCopyTo recipient, for example collector@datadrop.test,
  among the rule's parameters; the rule is created disabled.
mitre:
  tactics: [collection]
  techniques: [T1114]
state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  org_name: "example.onmicrosoft.com"
  actor_upn: "admin@example.onmicrosoft.com"
  divert_to: "collector@datadrop.test"
workloads:
  - scenario: scenarios/o365/exchange/transport-rule-mail-diversion
    bindings:
      tenant_id: ref.tenant_id
      org_name: ref.org_name
      actor_upn: ref.actor_upn
      divert_to: ref.divert_to
    expectation:
      expected: alert
      summary: >-
        A new transport rule is configured to blind-copy matching mail to an
        address outside the organisation.
      mitre:
        tactics: [collection]
        techniques: [T1114]
