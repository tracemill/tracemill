type: job
name: O365 Email New Inbox Rule Created
detection:
  source: escu
  name: "ESCU - O365 Email New Inbox Rule Created - Rule"
  id: 449f525a-7b42-47be-96a7-d9724e336c19
description: |
  Validates detection of a mail-hiding inbox rule in Exchange Online. On a
  single compromised mailbox, a new inbox rule is created that moves messages
  matching a keyword into the seldom-read RSS Subscriptions folder and halts
  further rule processing, concealing attacker-relevant mail -- security
  alerts and password-reset notifications -- from the account owner. The
  activity must raise the alert. A second mailbox creates a rule whose only
  action marks matching mail as read, leaving it in place, which must not.
mitre:
  tactics: [defense-evasion]
  techniques: [T1564.008]
state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  org_name: "example.onmicrosoft.com"
  actor_upn: "compromisedUser@example.onmicrosoft.com"
  control_upn: "assistant@example.onmicrosoft.com"
  client_ip: gen.ipv4()
  control_ip: gen.ipv4()
  session_id: gen.uuid()
  control_session_id: gen.uuid()
  forward_upn: "inbox-rule-forward@example.onmicrosoft.com"
  redirect_upn: "inbox-rule-redirect@example.onmicrosoft.com"
  forward_ip: gen.ipv4()
  redirect_ip: gen.ipv4()
  forward_session_id: gen.uuid()
  redirect_session_id: gen.uuid()
workloads:
  - scenario: scenarios/o365/exchange/mail-hiding-inbox-rule
    bindings:
      tenant_id: ref.tenant_id
      org_name: ref.org_name
      actor_upn: ref.actor_upn
      client_ip: ref.client_ip
      session_id: ref.session_id
    expectation:
      expected: alert
      summary: >-
        Creating an inbox rule that relocates keyword-matching mail into the
        RSS Subscriptions folder and stops further rule processing hides
        attacker-relevant messages from the mailbox owner and raises the alert.
      mitre:
        tactics: [defense-evasion]
        techniques: [T1564.008]

  # A rule whose only action marks matching mail as read relocates and forwards
  # nothing, so no parameter of it falls in the set the detection scopes to.
  # MarkAsRead is an action Exchange really emits on this record type, not a
  # plausible invention, so the control rests on observed behaviour.
  - scenario: scenarios/o365/exchange/mail-hiding-inbox-rule
    bindings:
      tenant_id: ref.tenant_id
      org_name: ref.org_name
      actor_upn: ref.control_upn
      client_ip: ref.control_ip
      session_id: ref.control_session_id
      rule_name: "mark newsletters read"
      match_keyword: "newsletter"
      action_name: "MarkAsRead"
      action_value: "True"
    expectation:
      expected: none

  # Relocating mail is only one of the actions the detection scopes to. A rule
  # that forwards matching mail to an outside address takes the message out of
  # the organisation entirely, which is the exfiltration shape of the same abuse.
  - scenario: scenarios/o365/exchange/mail-hiding-inbox-rule
    bindings:
      tenant_id: ref.tenant_id
      org_name: ref.org_name
      actor_upn: ref.forward_upn
      client_ip: ref.forward_ip
      session_id: ref.forward_session_id
      rule_name: "archive invoices offsite"
      action_name: "ForwardTo"
      action_value: "collector@mail-archive.example"
    expectation:
      expected: alert
      summary: "An inbox rule forwards matching mail to an address outside the organisation"

  # Redirect differs from forward in that the owner keeps no copy at all.
  - scenario: scenarios/o365/exchange/mail-hiding-inbox-rule
    bindings:
      tenant_id: ref.tenant_id
      org_name: ref.org_name
      actor_upn: ref.redirect_upn
      client_ip: ref.redirect_ip
      session_id: ref.redirect_session_id
      rule_name: "reroute finance mail"
      action_name: "RedirectTo"
      action_value: "drop@mail-archive.example"
    expectation:
      expected: alert
      summary: "An inbox rule redirects matching mail away from the mailbox owner"
