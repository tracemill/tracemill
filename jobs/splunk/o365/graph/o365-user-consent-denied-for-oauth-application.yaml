type: job
name: Consent Refused for an Application Requesting Account Access
description: >-
  An application asks a user for access to their account and the user refuses,
  alongside an ordinary sign-in that completed. Only the refusal is of
  interest: it marks an application that got as far as the consent prompt.
mitre:
  tactics: [credential-access]
  techniques: ["T1528"]
detection:
  source: escu
  name: "ESCU - O365 User Consent Denied for OAuth Application - Rule"
  id: 2d8679ef-b075-46be-8059-c25116cb1072
state:
  target_upn:  "consent-target@example.onmicrosoft.com"
  target_name: "Consent Target"
  routine_upn:  "consent-routine@example.onmicrosoft.com"
  routine_name: "Consent Routine"
workloads:
  - scenario: scenarios/o365/graph/oauth-consent-declined
    bindings:
      actor_upn:  ref.target_upn
      actor_name: ref.target_name
    expectation:
      expected: alert
      summary: "A user refuses an application's request for access to their account"

  # The same prompt answered the other way. A completed sign-in carries no
  # refusal, so it is outside what this detection looks at. It is a separate
  # scenario rather than a rebinding: the outcome code is a number and the
  # accompanying detail is empty, neither of which a binding can carry.
  - scenario: scenarios/o365/graph/signin-succeeded
    bindings:
      actor_upn:  ref.routine_upn
      actor_name: ref.routine_name
    expectation:
      expected: none
      summary: "An ordinary completed sign-in, which carries no refusal to report"
