type: job
name: O365 PST Export Alert
detection:
  source: escu
  name: "ESCU - O365 PST export alert - Rule"
  id: 5f694cc4-a678-4a60-9410-bffca1b647dc
description: |
  Validates detection of a compliance alert for an eDiscovery search being
  started or exported, which packages matching mailbox content for download.
  The control is a different Security and Compliance Center alert raised through
  the same operation.
mitre:
  tactics: [collection]
  techniques: [T1114]
state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  operator_upn: "compliance-operator@example.onmicrosoft.com"
  alert_id: gen.uuid()
  control_policy_id: gen.uuid()
workloads:
  - scenario: scenarios/o365/security-compliance-center/ediscovery-search-exported-alert
    bindings:
      tenant_id: ref.tenant_id
      operator_upn: ref.operator_upn
      alert_id: ref.alert_id
    expectation:
      expected: alert
      summary: >-
        An eDiscovery search is started or its results exported, and must raise
        the detection.
      mitre:
        tactics: [collection]
        techniques: [T1114]

  # A post-delivery removal alert whose title names no malicious message.
  - scenario: scenarios/o365/security-compliance-center/zap-post-delivery-removal
    bindings:
      tenant_id:     ref.tenant_id
      alert_name:    "Email messages removed after delivery\u200b"
      sender:        "newsletter@campaign-mailer.example"
      detect_method: ',"dm":"FingerPrintMatch"'
      policy_fields: ',"tpt":"HostedContentFilterPolicy","tpid":"${ref.control_policy_id}"'
      url_fields:    ""
      threat_name:   "Phish, Malicious"
      threat_type:   "Phish, Malicious"
    expectation:
      expected: none
      summary: >-
        A post-delivery mail-removal alert carries a different alert name
        through the same operation and must not alert.
