type: job
name: O365 Email Reported By Admin Found Malicious
description: |
  Validates detection of a delivered message an administrator submitted
  for rescanning, which the rescan then judged malicious: the filters let
  it through and it reached a mailbox.

  The control submits a message the rescan clears, so only the verdict
  separates the two arms.
detection:
  source: escu
  name: "ESCU - O365 Email Reported By Admin Found Malicious - Rule"
  id: 94396c3e-7728-422a-9956-e4b77b53dbdf

mitre:
  tactics: [initial-access]
  techniques: ["T1566.001", "T1566.002"]

state:
  tenant_id:  "11111111-1111-1111-1111-111111111111"
  victim_upn: "victim@example.onmicrosoft.com"
  # Lifted from the scenario so it can key the result-row correlation below;
  # the rule renames it to signature_id and the fired row carries it.
  record_id:  gen.uuid()

workloads:
  - scenario: scenarios/o365/security-compliance-center/admin-submission-rescan-verdict
    bindings:
      tenant_id:  ref.tenant_id
      victim_upn: ref.victim_upn
      verdict:    Phish
      record_id:  ref.record_id
    expectation:
      expected: alert
      summary: "A submitted message the rescan judged phishing"
      mitre:
        tactics: [initial-access]
        techniques: ["T1566.001", "T1566.002"]
      correlation:
        signature_id: ref.record_id
        dest_user:    ref.victim_upn

  - scenario: scenarios/o365/security-compliance-center/admin-submission-rescan-verdict
    bindings:
      tenant_id:  ref.tenant_id
      victim_upn: ref.victim_upn
      verdict:    NotSpam
    expectation:
      expected: none
      summary: "A submitted message the rescan cleared is outside the verdict filter"
