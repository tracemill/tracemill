type: job
name: O365 Email Access By Security Administrator
description: |
  Validates detection of a security administrator opening a user's message
  from the Security and Compliance Center. The control is an alert raised
  in the same workload for mail removed after delivery, which the rule's
  operation scope excludes.
detection:
  source: escu
  name: "ESCU - O365 Email Access By Security Administrator - Rule"
  id: c6998a30-fef4-4e89-97ac-3bb0123719b4

mitre:
  tactics: [collection, exfiltration]
  techniques: ["T1114.002", "T1567"]

state:
  tenant_id:   "11111111-1111-1111-1111-111111111111"
  mailbox_upn: "victim@example.onmicrosoft.com"
  control_policy_id: gen.uuid()

workloads:
  - scenario: scenarios/o365/security-compliance-center/admin-mail-access
    bindings:
      tenant_id:   ref.tenant_id
      mailbox_upn: ref.mailbox_upn
    expectation:
      expected: alert
      summary: "A security administrator opens a user's message"
      mitre:
        tactics: [collection, exfiltration]
        techniques: ["T1114.002", "T1567"]

  # A post-delivery removal alert whose title names no malicious message.
  - scenario: scenarios/o365/security-compliance-center/zap-post-delivery-removal
    bindings:
      tenant_id:     ref.tenant_id
      recipient:     ref.mailbox_upn
      alert_name:    "Email messages removed after delivery\u200b"
      sender:        "newsletter@campaign-mailer.example"
      detect_method: ',"dm":"FingerPrintMatch"'
      policy_fields: ',"tpt":"HostedContentFilterPolicy","tpid":"${ref.control_policy_id}"'
      url_fields:    ""
      threat_name:   "Phish, Malicious"
      threat_type:   "Phish, Malicious"
    expectation:
      expected: none
      summary: >-
        An alert on mail removed after delivery is a different operation
