type: job
name: O365 Security And Compliance Alert Triggered
detection:
  source: escu
  name: "ESCU - O365 Security And Compliance Alert Triggered - Rule"
  id: 5b367cdd-8dfc-49ac-a9b7-6406cf27f33e
description: |
  Validates detection of a Microsoft 365 alert policy raising an alert. The
  audit log records an AlertTriggered activity in the Security and Compliance
  Center for the alert, for example Creation of forwarding/redirect rule,
  naming the user who set up mail forwarding or a redirect rule.
mitre:
  tactics: [defense-evasion, initial-access, persistence, privilege-escalation]
  techniques: ["T1078.004"]
state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  alerted_upn: "user15@example.onmicrosoft.com"
  alert_id: gen.uuid()
workloads:
  - scenario: scenarios/o365/security-compliance-center/alert-triggered
    bindings:
      tenant_id: ref.tenant_id
      alerted_upn: ref.alerted_upn
      alert_id: ref.alert_id
    expectation:
      expected: alert
      summary: "An alert policy raises an alert for a user creating a forwarding or redirect rule"
      mitre:
        tactics: [defense-evasion, initial-access, persistence, privilege-escalation]
        techniques: ["T1078.004"]
