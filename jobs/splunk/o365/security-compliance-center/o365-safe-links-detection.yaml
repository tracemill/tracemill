type: job
name: O365 Safe Links Detection
detection:
  source: escu
  name: "ESCU - O365 Safe Links Detection - Rule"
  id: 711d9e8c-2cb0-45cf-8813-5f191ecb9b26
description: |
  Validates detection of a Microsoft Defender Safe Links alert raised when a
  mailbox user clicks a URL later identified as malicious. The control is a
  different Defender alert for mail removed after delivery, which must not
  alert.
mitre:
  tactics: [initial-access]
  techniques: [T1566.001]
state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  victim_upn: "victim@example.onmicrosoft.com"
  alert_id: gen.uuid()
  control_policy_id: gen.uuid()
workloads:
  - scenario: scenarios/o365/security-compliance-center/malicious-url-click-alert
    bindings:
      tenant_id: ref.tenant_id
      victim_upn: ref.victim_upn
      clicked_url: "https://malicious.example/account-verify"
      alert_id: ref.alert_id
    expectation:
      expected: alert
      summary: >-
        Safe Links reports a user clicking a URL identified as malicious, and
        must raise the detection.
      mitre:
        tactics: [initial-access]
        techniques: [T1566.001]
      # The detection rebuilds its output columns after the aggregation, so the
      # alert is matched on its result rows.
      correlation:
        signature_id: ref.alert_id
        user: ref.victim_upn
        vendor_product: "Microsoft Office 365 SecurityComplianceCenter"

  # A post-delivery removal alert whose title names no malicious message.
  - scenario: scenarios/o365/security-compliance-center/zap-post-delivery-removal
    bindings:
      tenant_id:     ref.tenant_id
      recipient:     ref.victim_upn
      alert_name:    "Email messages removed after delivery\u200b"
      sender:        "newsletter@campaign-mailer.example"
      detect_method: ',"dm":"FingerPrintMatch"'
      policy_fields: ',"tpt":"HostedContentFilterPolicy","tpid":"${ref.control_policy_id}"'
      url_fields:    ""
      threat_name:   "Phish, Malicious"
      threat_type:   "Phish, Malicious"
    expectation:
      expected: none
      summary: >-
        Mail removed after delivery raises a different Defender alert through
        the same operation and must not alert.
