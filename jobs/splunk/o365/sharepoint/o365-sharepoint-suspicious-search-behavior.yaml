type: job
name: Team Site Searched for Credential and Payment Terms
description: >-
  A team site is searched for credential and payment material, alongside a
  second account running the same number of ordinary searches.
mitre:
  tactics: [collection]
  techniques: ["T1213.002"]
detection:
  source: escu
  name: "ESCU - O365 SharePoint Suspicious Search Behavior - Rule"
  id: 6ca919db-52f3-4c95-a4e9-7b189e8a043d
state:
  tenant_id:   gen.uuid()
  actor_upn:   "compromised.user@example.onmicrosoft.com"
  control_upn: "helpdesk.agent@example.onmicrosoft.com"
  actor_src:   gen.ipv4()
  control_src: gen.ipv4()
pools:
  - id: sensitive-terms
    csv:
      data: |
        term
        passwords
        bank routing
        payroll
  - id: routine-terms
    csv:
      data: |
        term
        offsite agenda
        lunch rota
        room booking
workloads:
  - scenario: scenarios/o365/sharepoint/sharepoint-search-query
    matrix:
      search: pool.sensitive-terms
    bindings:
      tenant_id:  ref.tenant_id
      actor_upn:  ref.actor_upn
      src_ip:     ref.actor_src
      query_text: ref.search.term
    expectation:
      expected: alert
      summary: "Three team-site searches for credential and payment terms"

  - scenario: scenarios/o365/sharepoint/sharepoint-search-query
    matrix:
      search: pool.routine-terms
    bindings:
      tenant_id:  ref.tenant_id
      actor_upn:  ref.control_upn
      src_ip:     ref.control_src
      query_text: ref.search.term
    expectation:
      expected: none
