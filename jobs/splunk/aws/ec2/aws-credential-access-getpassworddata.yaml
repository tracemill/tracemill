type: job
name: AWS Credential Access GetPasswordData
detection:
  source: escu
  name: "ESCU - AWS Credential Access GetPasswordData - Rule"
  id: 4d347c4a-306e-41db-8d10-b46baf71b3e2
description: |
  EC2 Windows password-data enumeration: a single assumed-role identity issues
  a high-volume burst of denied (Client.UnauthorizedOperation) GetPasswordData
  calls from one source IP, account, and Region -- each call naming a different
  running instance. Retrieving an instance's encrypted local administrator
  password is a credential-access step; doing it across many instances in a
  tight window is the enumeration signature. The workload loops one denied call
  fifteen times so the burst names fifteen distinct instances while every call
  shares one identity/source/account/Region group.

mitre:
  tactics: [credential-access]
  techniques: ["T1552"]

state:
  account_id: "111122223333"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  user_agent: "aws-cli/2.27.0 md/awscrt#0.27.0 ua/2.1 os/macos#15.3.1 md/arch#arm64 lang/python#3.13.0 md/command#ec2.get-password-data tracemill/1.0"
  actor:      gen.aws_identity(type=AssumedRole, accountId=ref.account_id)

workloads:
  - scenario: scenarios/aws/ec2/get-password-data-denied
    loop: 15
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      user_agent: ref.user_agent
      actor:      ref.actor
    expectation:
      summary: "Repeated denied GetPasswordData across many instances from one identity"
      expected: alert
      mitre:
        tactics: [credential-access]
        techniques: ["T1552"]
