type: job
detection:
  source: escu
  name: "AWS Exfiltration via DataSync Task"
  id: 05c4b09f-ea28-4c7c-a7aa-a246f665c8a2
description: |
  Exercises CreateTask (T1119) -- an adversary creates an AWS DataSync task that 
  defines an automated transfer toward an attacker-controlled destination
  location. Validates that the detection fires on any DataSync CreateTask call.
mitre:
  tactics: [collection]
  techniques: [T1119]

state:
  aws_region:  us-east-1
  dest_region: us-west-2
  account_id:  "111111111111"
  actor:       gen.aws_identity(type=AssumedRole, accountId=ref.account_id)
  source_ip:   gen.ipv4()
  user_agent:  "aws-cli/2.15.30 Python/3.11.8 Linux/6.5.0-1018-aws exec-env/CloudShell exe/x86_64.amzn.2 prompt/off tracemill/1.0"

workloads:
  - scenario: scenarios/aws/datasync/create-task
    bindings:
      aws_region:  ref.aws_region
      dest_region: ref.dest_region
      account_id:  ref.account_id
      actor:       ref.actor
      source_ip:   ref.source_ip
      user_agent:  ref.user_agent
    expectation:
      summary: "DataSync CreateTask to attacker-controlled destination"
      expected: alert
