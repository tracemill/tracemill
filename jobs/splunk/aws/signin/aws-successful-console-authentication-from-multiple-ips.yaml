type: job
name: AWS Successful Console Authentication From Multiple IPs
detection:
  source: escu
  name: "ESCU - AWS Successful Console Authentication From Multiple IPs - Rule"
  id: 395e50e1-2b87-4fa3-8632-0dfbdcbcd2cb
description: |
  Successful AWS Management Console sign-ins for one identity from multiple
  source IPs (valid cloud account, concurrent credential use).

  Runs the console sign-in burst two ways: an attack burst where one root
  identity signs in successfully from two distinct source IPs inside a
  5-minute window, and a single-location control where a different identity
  signs in repeatedly from one IP. A detection thresholding on the distinct
  source-IP count per identity fires on the first and not the second.

mitre:
  tactics: [initial-access]
  techniques: [T1078.004]

state:
  aws_region:      us-east-1
  # The two bursts run under distinct accounts so they form separate
  # per-identity groups: the attack identity spans multiple IPs, the control
  # identity stays on one. Account is constant within each burst, so each
  # collapses into a single group whose distinct-IP count is what the
  # detection thresholds on.
  attack_account:  "111111111111"
  control_account: "222222222222"
  # Control source IPs: two entries resolving to one address, so the control
  # burst stays at distinct_ip_count = 1.
  control_ip:      gen.ipv4()
  control_ips:
    - ref.control_ip
    - ref.control_ip
  # Inter-event stagger for both bursts. Kept short so each burst's sign-ins
  # land in one 5-minute counting window; raise to spread them out.
  step_delay:      "2s"
  step_jitter:     0.5

workloads:
  # Attack: same root identity, two distinct source IPs (the scenario default)
  # in one window -> distinct_ip_count = 2 > 1 -> fires.
  - scenario: scenarios/aws/signin/console-login-from-multiple-ips
    bindings:
      account_id:  ref.attack_account
      aws_region:  ref.aws_region
      step_delay:  ref.step_delay
      step_jitter: ref.step_jitter
    expectation:
      expected: alert
      summary: "One root identity signing in to the AWS Console from 2 distinct IPs in 5 minutes"
      mitre:
        tactics: [initial-access]
        techniques: [T1078.004]

  # Control: a different identity signing in twice from a single repeated IP ->
  # distinct_ip_count = 1 -> does not fire. Confirms the detection discriminates
  # on distinct-IP count, not sign-in volume.
  - scenario: scenarios/aws/signin/console-login-from-multiple-ips
    bindings:
      account_id:  ref.control_account
      aws_region:  ref.aws_region
      source_ips:  ref.control_ips
      step_delay:  ref.step_delay
      step_jitter: ref.step_jitter
    expectation:
      expected: none
      summary: "Single-location control -- one identity signing in repeatedly from one IP"
