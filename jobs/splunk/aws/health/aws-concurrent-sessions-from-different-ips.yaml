type: job
name: AWS Concurrent Sessions From Different Ips
detection:
  source: escu
  name: "ESCU - AWS Concurrent Sessions From Different Ips - Rule"
  id: 51c04fdb-2746-465a-b86e-b413a09c9085
description: |
  Concurrent AWS sessions from different source IPs (T1185 session hijacking).

  Runs the AWS Health console-poll burst (DescribeEventAggregates) two ways: an
  attack burst where one identity polls from three distinct source IPs in a
  5-minute window, and a single-location control where a different identity
  polls repeatedly from one IP. A detection thresholding on the distinct
  source-IP count per identity fires on the first and not the second.

mitre:
  tactics: [collection]
  techniques: ["T1185"]

state:
  aws_region:       us-east-1
  # The two bursts run under distinct accounts so they form separate
  # per-identity groups: the attack identity spans multiple IPs, the control
  # identity stays on one. Account is constant within each burst, so each
  # collapses into a single group whose distinct-IP count is what the
  # detection thresholds on.
  attack_account:   "111111111111"
  control_account:  "222222222222"
  # Control source IPs: three entries all resolving to one address, so the
  # control burst stays at distinct_ip_count = 1.
  control_ip:       gen.ipv4()
  control_ips:
    - ref.control_ip
    - ref.control_ip
    - ref.control_ip
  # Inter-event stagger for both bursts. Kept short so each burst's events land
  # in one 5-minute counting window; raise to spread the sessions out.
  step_delay:       "2s"
  step_jitter:      0.5

workloads:
  # Attack: same identity, three distinct source IPs (the scenario default) in
  # one window -> distinct_ip_count = 3 > 1 -> fires.
  - scenario: scenarios/aws/health/concurrent-sessions-from-different-ips
    bindings:
      account_id:  ref.attack_account
      aws_region:  ref.aws_region
      step_delay:  ref.step_delay
      step_jitter: ref.step_jitter
    expectation:
      expected: alert
      summary: "Concurrent AWS sessions -- one identity polling AWS Health from 3 distinct IPs in 5 minutes"
      mitre:
        tactics: [collection]
        techniques: ["T1185"]

  # Control: a different identity making the same call three times from a single
  # repeated IP -> distinct_ip_count = 1 -> does not fire. Confirms the
  # detection discriminates on distinct-IP count, not call volume.
  - scenario: scenarios/aws/health/concurrent-sessions-from-different-ips
    bindings:
      account_id:  ref.control_account
      aws_region:  ref.aws_region
      source_ips:  ref.control_ips
      step_delay:  ref.step_delay
      step_jitter: ref.step_jitter
    expectation:
      expected: none
      summary: "Single-location control -- one identity polling AWS Health repeatedly from one IP"
