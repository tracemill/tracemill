type: job
name: AWS New MFA Method Registered For User
detection:
  source: escu
  name: "ESCU - AWS New MFA Method Registered For User - Rule"
  id: 4e3c26f2-4fb9-4bd7-ab46-1b76ffa2a23b
description: |
  Exercises detection of a new MFA method being registered on an AWS
  identity (IAM CreateVirtualMFADevice). Models the post-compromise
  persistence pattern where an attacker provisions their own virtual MFA
  device to retain durable access.
mitre:
  tactics: [persistence, credential-access]
  techniques: [T1556.006]

state:
  aws_region:  us-east-1
  account_id:  "111122223333"
  target_user: compromised-user
  source_ip:   gen.ipv4()
  user_agent:  "aws-cli/2.15.40 md/awscrt#0.20.9 ua/2.0 os/linux#5.15 md/arch#x86_64 lang/python#3.11.8 cfg/retry-mode#standard md/command#iam.create-virtual-mfa-device tracemill/1.0"
  actor:       gen.aws_identity(type=IAMUser, userName=ref.target_user, accountId=ref.account_id)

workloads:
  - scenario: scenarios/aws/iam/create-virtual-mfa-device
    bindings:
      aws_region:  ref.aws_region
      account_id:  ref.account_id
      user_name:   ref.target_user
      source_ip:   ref.source_ip
      user_agent:  ref.user_agent
      actor:       ref.actor
    expectation:
      expected: alert
      summary: "IAM CreateVirtualMFADevice registers a new MFA method for persistence"
