type: job
name: AWS IAM discovery via access-denied API calls
detection:
  source: escu
  name: "ESCU - AWS IAM AccessDenied Discovery Events - Rule"
  id: 3e1f1568-9633-11eb-a69c-acde48001122
description: |
  Emits a burst of denied read-only discovery calls from a single IAMUser/IP
  across a dozen AWS services, all carrying one timestamp. Every event shares
  src/user/account/region, so failure counting keyed on (src, user,
  vendor_account, vendor_region, vendor_product) collapses the burst into one
  group that clears a five-failure threshold with margin, with at least one
  distinct method and source.

mitre:
  tactics: [discovery]
  techniques: ["T1580"]

state:
  account_id:    "111122223333"
  aws_region:    us-east-1
  source_ip:     gen.ipv4()
  user_name:     attacker
  user_agent:    "Boto3/1.14.6 Python/3.9.4 Darwin/20.3.0 Botocore/1.17.6 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/iam/discovery-access-denied-burst
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      user_name:  ref.user_name
      user_agent: ref.user_agent
    expectation:
      expected: alert
      summary: "AWS IAM AccessDenied burst -- discovery scan from a single IAMUser/IP"
      mitre:
        tactics: [discovery]
        techniques: ["T1580"]
