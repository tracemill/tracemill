type: job
name: AWS Password Policy Changes
detection:
  source: escu
  name: "ESCU - AWS Password Policy Changes - Rule"
  id: aee4a575-7064-4e60-b511-246f9baf9895
description: |
  Walks one assumed-role session from one source address through reading,
  weakening and then deleting the account IAM password policy, so the three
  calls read as a single actor dismantling the account's password defenses.
  A fourth workload is a control: a separate, unprivileged principal is
  refused the same rewrite, which must not be reported as a change.
mitre:
  tactics: [discovery, defense-evasion, persistence]
  techniques: [T1201, T1556]

state:
  aws_region: us-east-1
  account_id: "111111111111"
  source_ip:  gen.ipv4()
  actor:      gen.aws_identity(type=AssumedRole, accountId=ref.account_id)
  control_source_ip: gen.ipv4()
  control_actor:     gen.aws_identity(type=AssumedRole, accountId=ref.account_id)

workloads:
  - scenario: scenarios/aws/iam/discover-password-policy
    bindings:
      aws_region: ref.aws_region
      account_id: ref.account_id
      source_ip:  ref.source_ip
      actor:      ref.actor
    expectation:
      expected: alert
      summary: "GetAccountPasswordPolicy -- account password policy read"
      mitre:
        tactics: [discovery]
        techniques: [T1201]
  - scenario: scenarios/aws/iam/weaken-password-policy
    bindings:
      aws_region: ref.aws_region
      account_id: ref.account_id
      source_ip:  ref.source_ip
      actor:      ref.actor
    expectation:
      expected: alert
      summary: "UpdateAccountPasswordPolicy -- policy rewritten without digit or letter-case requirements"
      mitre:
        tactics: [defense-evasion, persistence]
        techniques: [T1556]
  - scenario: scenarios/aws/iam/delete-password-policy
    bindings:
      aws_region: ref.aws_region
      account_id: ref.account_id
      source_ip:  ref.source_ip
      actor:      ref.actor
    expectation:
      expected: alert
      summary: "DeleteAccountPasswordPolicy -- custom policy removed entirely"
      mitre:
        tactics: [defense-evasion, persistence]
        techniques: [T1556]
  - scenario: scenarios/aws/iam/weaken-password-policy-denied
    bindings:
      aws_region: ref.aws_region
      account_id: ref.account_id
      source_ip:  ref.control_source_ip
      actor:      ref.control_actor
    expectation:
      expected: none
      summary: "UpdateAccountPasswordPolicy refused with AccessDenied -- policy unchanged, must not fire"
