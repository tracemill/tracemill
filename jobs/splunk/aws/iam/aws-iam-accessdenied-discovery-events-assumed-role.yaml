type: job
name: AWS IAM discovery via access-denied API calls (assumed role)
detection:
  source: escu
  name: "ESCU - AWS IAM AccessDenied Discovery Events - Rule"
  id: 3e1f1568-9633-11eb-a69c-acde48001122
description: |
  Emits the same denied read-only discovery burst as the IAM-user variant,
  but from an assumed-role session; failure counting scoped to IAM-user
  identities does not cover role-assuming principals, so the scan must not
  be reported.

mitre:
  tactics: [discovery]
  techniques: ["T1580"]

state:
  account_id:  "111122223333"
  aws_region:  us-east-1
  source_ip:   gen.ipv4()
  user_agent:  "Boto3/1.14.6 Python/3.9.4 Darwin/20.3.0 Botocore/1.17.6 tracemill/1.0"
  actor:       gen.aws_identity(type=AssumedRole, accountId=ref.account_id)

workloads:
  - scenario: scenarios/aws/iam/discovery-access-denied-burst
    bindings:
      account_id:  ref.account_id
      aws_region:  ref.aws_region
      source_ip:   ref.source_ip
      user_agent:  ref.user_agent
      actor:       ref.actor
    expectation:
      expected: none
      summary: "AccessDenied discovery burst from an assumed-role principal -- IAM-user-scoped failure counting must not fire"
