type: job
detection:
  source: escu
  name: "AWS ECR Container Upload Outside Business Hours"
  id: d4c4d4eb-3994-41ca-a25e-a82d64e125bb
description: |
  Validation job for off-hours container image uploads to Amazon ECR.

  Emits a single ECR PutImage call from a routine deployment identity to a
  private repository. When the run lands outside standard working hours (or
  on a weekend), the push registers a new image manifest and tag at an
  anomalous time -- the signal an off-hours-upload analytic keys on.

mitre:
  tactics: [execution]
  techniques: ["T1204.003"]

state:
  account_id:      "111111111111"
  aws_region:      us-east-1
  registry_id:     "111111111111"
  user_name:       ci-deploy
  actor:           gen.aws_identity(type=IAMUser, userName=ref.user_name, accountId=ref.account_id)
  repository_name: "platform/api-server"
  image_tag:       latest

workloads:
  - scenario: scenarios/aws/ecr/put-image-off-hours
    bindings:
      account_id:      ref.account_id
      aws_region:      ref.aws_region
      registry_id:     ref.registry_id
      actor:           ref.actor
      repository_name: ref.repository_name
      image_tag:       ref.image_tag
    expectation:
      summary: Off-hours ECR image upload by a routine deployment identity
      expected: alert
