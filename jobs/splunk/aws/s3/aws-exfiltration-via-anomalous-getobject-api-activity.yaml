type: job
detection:
  source: escu
  name: "AWS Exfiltration via Anomalous GetObject API Activity"
  id: e4384bbf-5835-4831-8d85-694de6ad2cc6
description: |
  Data exfiltration from S3 by anomalous object-read volume. Several
  identities read objects from a shared bucket at normal, low rates while one
  identity -- from a single source address -- retrieves objects in a
  high-volume burst that stands out sharply against its peers. A baseline that
  scores each identity's read count against the population of readers flags the
  outlier while leaving the routine readers unremarked.

  The reads are paced (eps): routine readers emit at roughly one read per
  second, while the outlier reads about an order of magnitude faster. The wide
  read-rate contrast -- not just the total count -- is what makes the outlier
  identity stand out over any scoring window.
mitre:
  tactics: [collection]
  techniques: [T1530]

# Each identity's userIdentity is pinned once in job state (job state is
# evaluated a single time), so every read from a given identity carries the
# same principalId / accessKeyId / arn across all of its loop iterations --
# one identity, one stable actor.
state:
  account_id:     "111111111111"
  aws_region:     us-west-2
  bucket_name:    security-content
  attacker_user:  bulk-exporter
  attacker_ip:    gen.ipv4()
  attacker_actor: gen.aws_identity(type=IAMUser, userName=ref.attacker_user, accountId=ref.account_id)
  reader1_user:   analytics-reader
  reader1_ip:     gen.ipv4()
  reader1_actor:  gen.aws_identity(type=IAMUser, userName=ref.reader1_user, accountId=ref.account_id)
  reader2_user:   etl-reader
  reader2_ip:     gen.ipv4()
  reader2_actor:  gen.aws_identity(type=IAMUser, userName=ref.reader2_user, accountId=ref.account_id)
  reader3_user:   dashboard-reader
  reader3_ip:     gen.ipv4()
  reader3_actor:  gen.aws_identity(type=IAMUser, userName=ref.reader3_user, accountId=ref.account_id)
  reader4_user:   backup-reader
  reader4_ip:     gen.ipv4()
  reader4_actor:  gen.aws_identity(type=IAMUser, userName=ref.reader4_user, accountId=ref.account_id)
  reader5_user:   audit-reader
  reader5_ip:     gen.ipv4()
  reader5_actor:  gen.aws_identity(type=IAMUser, userName=ref.reader5_user, accountId=ref.account_id)

workloads:
  # Baseline population: routine readers at normal, low read counts, paced at
  # about one read per second. Each is a distinct, stable identity/source, so
  # the scoring window sees a tight cluster of low, slow per-identity read
  # rates that the outlier below is measured against.
  - scenario: scenarios/aws/s3/get-object
    loop: 3
    eps: 1
    bindings:
      account_id:  ref.account_id
      aws_region:  ref.aws_region
      bucket_name: ref.bucket_name
      actor:       ref.reader1_actor
      source_ip:   ref.reader1_ip
    expectation:
      expected: none
      summary: "Routine low-volume object reads by an analytics identity"

  - scenario: scenarios/aws/s3/get-object
    loop: 4
    eps: 1
    bindings:
      account_id:  ref.account_id
      aws_region:  ref.aws_region
      bucket_name: ref.bucket_name
      actor:       ref.reader2_actor
      source_ip:   ref.reader2_ip
    expectation:
      expected: none
      summary: "Routine low-volume object reads by an ETL identity"

  - scenario: scenarios/aws/s3/get-object
    loop: 3
    eps: 1
    bindings:
      account_id:  ref.account_id
      aws_region:  ref.aws_region
      bucket_name: ref.bucket_name
      actor:       ref.reader3_actor
      source_ip:   ref.reader3_ip
    expectation:
      expected: none
      summary: "Routine low-volume object reads by a dashboard identity"

  - scenario: scenarios/aws/s3/get-object
    loop: 5
    eps: 1
    bindings:
      account_id:  ref.account_id
      aws_region:  ref.aws_region
      bucket_name: ref.bucket_name
      actor:       ref.reader4_actor
      source_ip:   ref.reader4_ip
    expectation:
      expected: none
      summary: "Routine low-volume object reads by a backup identity"

  - scenario: scenarios/aws/s3/get-object
    loop: 4
    eps: 1
    bindings:
      account_id:  ref.account_id
      aws_region:  ref.aws_region
      bucket_name: ref.bucket_name
      actor:       ref.reader5_actor
      source_ip:   ref.reader5_ip
    expectation:
      expected: none
      summary: "Routine low-volume object reads by an audit identity"

  # Outlier: one identity from one source retrieves objects in a sustained,
  # rapid burst (about an order of magnitude faster than the routine readers)
  # -- the anomalous read rate the detection is built to surface. Kept brief
  # enough that the whole burst scores against the same population window.
  - scenario: scenarios/aws/s3/get-object
    loop: 80
    eps: 8
    bindings:
      account_id:  ref.account_id
      aws_region:  ref.aws_region
      bucket_name: ref.bucket_name
      actor:       ref.attacker_actor
      source_ip:   ref.attacker_ip
    expectation:
      expected: alert
      summary: "Anomalous high-rate object retrieval by a single identity"
      mitre:
        tactics: [collection]
        techniques: [T1530]
