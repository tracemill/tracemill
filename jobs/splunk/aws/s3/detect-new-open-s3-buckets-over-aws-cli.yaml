type: job
name: Detect New Open S3 Buckets over AWS CLI
detection:
  source: escu
  name: "ESCU - Detect New Open S3 Buckets over AWS CLI - Rule"
  id: 39c61d09-8b30-4154-922b-2d0a694ecc22
description: "S3 bucket opened to the AllUsers and AuthenticatedUsers groups through an aws-cli PutBucketAcl request carrying x-amz-grant-* headers (T1530), with an SDK-issued copy of the same grant and an owner-only ACL reset as controls."

mitre:
  tactics: [collection]
  techniques: [T1530]

state:
  user_agent_aws_cli: "[aws-cli/2.0.45 Python/3.7.4 Darwin/20.2.0 exe/x86_64 command/s3api.put-bucket-acl tracemill/1.0]"
  user_agent_sdk:     "Boto3/1.34.51 Python/3.11.8 Linux/5.15.0-101-generic Botocore/1.34.51 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/s3/put-bucket-acl-grant-headers
    bindings:
      user_agent: ref.user_agent_aws_cli
    expectation:
      expected: alert
      summary: "aws-cli PutBucketAcl with x-amz-grant-* headers to AllUsers/AuthenticatedUsers"
  - scenario: scenarios/aws/s3/put-bucket-acl-grant-headers
    bindings:
      user_agent: ref.user_agent_sdk
    expectation:
      expected: none
      summary: "Same public grant headers issued through an AWS SDK (Boto3 userAgent)"
  - scenario: scenarios/aws/s3/put-bucket-acl-private
    expectation:
      expected: none
      summary: "Owner-only ACL reset from the S3 console (benign baseline)"
