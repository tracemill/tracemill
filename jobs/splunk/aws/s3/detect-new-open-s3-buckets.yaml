type: job
description: |
  S3 bucket made publicly accessible via PutBucketAcl (T1530). Exercises
  the three API forms that grant the AllUsers group, plus an owner-only
  control. Per-analytic coverage:
  docs/detection-gaps/aws-s3-put-bucket-acl-public-access-gaps.md.

mitre:
  tactics: [collection]
  techniques: [T1530]

state:
  user_agent_aws_cli: "[aws-cli/2.0.45 Python/3.7.4 Darwin/20.2.0 exe/x86_64 command/s3api.put-bucket-acl tracemill/1.0]"
  user_agent_sdk:     "Boto3/1.34.51 Python/3.11.8 Linux/5.15.0-101-generic Botocore/1.34.51 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/s3/make-bucket-public-acl
    expectation:
      expected: alert
      summary: "XML body AccessControlPolicy grant to AllUsers"
  - scenario: scenarios/aws/s3/put-bucket-acl-header-form
    expectation:
      expected: alert
      summary: "x-amz-grant-read header to AllUsers"
  - scenario: scenarios/aws/s3/put-bucket-acl-canned-acl
    bindings:
      user_agent: ref.user_agent_aws_cli
    expectation:
      expected: alert
      summary: "Canned ACL public-read via aws-cli (--acl public-read)"
  - scenario: scenarios/aws/s3/put-bucket-acl-canned-acl
    bindings:
      user_agent: ref.user_agent_sdk
    expectation:
      expected: alert
      summary: "Canned ACL public-read via AWS SDK (Boto3 userAgent)"
  - scenario: scenarios/aws/s3/put-bucket-acl-private
    expectation:
      expected: none
      summary: "Owner-only ACL (benign baseline)"
