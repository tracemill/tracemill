type: job
detection:
  source: escu
  name: "AWS Defense Evasion Delete Cloudtrail"
  id: 82092925-9ca1-4e06-98b8-85a2d3889552
description: |
  Actor deletes a CloudTrail trail to disable logging.

mitre:
  tactics: [defense-evasion]
  techniques: [T1562.008]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  user_agent: "aws-cli/2.15.30 Python/3.11.8 Darwin/23.4.0 source/x86_64 prompt/off tracemill/1.0"
  actor:      gen.aws_identity(type=IAMUser, accountId=ref.account_id)
  trail_name: production-trail

workloads:
  - scenario: scenarios/aws/cloudtrail/delete-trail
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      user_agent: ref.user_agent
      actor:      ref.actor
      trail_name: ref.trail_name
    expectation:
      summary: AWS Defense Evasion Delete Cloudtrail
      expected: alert
