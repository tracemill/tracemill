type: job
name: Azure AD High Number Of Failed Authentications For User
detection:
  source: escu
  name: "ESCU - Azure AD High Number Of Failed Authentications For User - Rule"
  id: 630b1694-210a-48ee-a450-6f79e7679f2c
description: |
  Validates detection of a high number of failed Microsoft Entra ID (Azure AD)
  authentications against a single user (credential access / brute force): 30
  failed interactive sign-ins (error code 50126) against one tenant user,
  each from an independently generated source IP, well above the "more than
  20 failures in 10 minutes" threshold the detection enforces. Varying the
  source IP per attempt confirms the detection is genuinely scoped to the
  target user rather than incidentally keyed on a single shared IP.

mitre:
  tactics: [credential-access]
  techniques: [T1110.001]

state:
  tenant_id:  "11111111-1111-1111-1111-111111111111"
  victim_upn: "targetUser@example.onmicrosoft.com"
  victim_id:  gen.uuid()

workloads:
  - scenario: scenarios/azure/signin/failed-authentication-from-ip
    loop: 30
    bindings:
      tenant_id:  ref.tenant_id
      victim_upn: ref.victim_upn
      victim_id:  ref.victim_id
    expectation:
      summary: "30 failed Entra ID sign-ins (error 50126) against one user, from independently varying source IPs, exceed the >20-in-10-minutes threshold and trigger the detection."
      expected: alert
      mitre:
        tactics: [credential-access]
        techniques: [T1110.001]
