type: job
name: Azure AD Service Principal Authentication
detection:
  source: escu
  name: "ESCU - Azure AD Service Principal Authentication - Rule"
  id: 5a2ec401-60bb-474e-b936-1e66e7aa4060
description: |
  Validates detection of a service principal authenticating in a
  Microsoft Entra ID (Azure AD) tenant: a SOC compares every
  ServicePrincipalSignInLogs record against a known-application
  baseline to spot an unfamiliar or anomalous app credential in use.

  No control: the detection has no predicate beyond the
  ServicePrincipalSignInLogs category, so any other sign-in category
  would only restate that filter rather than test specificity.

mitre:
  tactics: [defense-evasion, initial-access, persistence, privilege-escalation]
  techniques: [T1078.004]

state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  src_ip:    gen.ipv4()

workloads:
  - scenario: scenarios/azure/signin/service-principal-signin
    bindings:
      tenant_id: ref.tenant_id
      src_ip:    ref.src_ip
    expectation:
      expected: alert
      summary: "A service principal authenticates in the tenant"
      mitre:
        tactics: [defense-evasion, initial-access, persistence, privilege-escalation]
        techniques: [T1078.004]
