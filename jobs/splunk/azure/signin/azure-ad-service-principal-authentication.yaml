type: job
name: Azure AD Service Principal Authentication
detection:
  source: escu
  name: "ESCU - Azure AD Service Principal Authentication - Rule"
  id: 5a2ec401-60bb-474e-b936-1e66e7aa4060
description: |
  Validates detection of a service principal authenticating in a
  Microsoft Entra ID (Azure AD) tenant (defense evasion / initial
  access / persistence / privilege escalation via cloud-account abuse,
  T1078.004): every ServicePrincipalSignInLogs record is in scope, so
  the detection is a monitoring baseline rather than a filter -- a SOC
  compares its output against a known-application baseline to spot an
  unfamiliar or anomalous app credential in use. A control confirms
  specificity: a regular interactive user sign-in, a different
  SignInLogs category entirely, does not match the detection's
  ServicePrincipalSignInLogs-scoped filter.

mitre:
  tactics: [defense-evasion, initial-access, persistence, privilege-escalation]
  techniques: [T1078.004]

state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  src_ip:    gen.ipv4()

workloads:
  - scenario: scenarios/azure/signin/service-principal-signin
    bindings:
      tenant_id: ref.tenant_id
      src_ip:    ref.src_ip
    expectation:
      expected: alert
      summary: "A service principal authenticates in the tenant"
      mitre:
        tactics: [defense-evasion, initial-access, persistence, privilege-escalation]
        techniques: [T1078.004]

  - scenario: scenarios/azure/signin/successful-single-factor-signin
    bindings:
      tenant_id: ref.tenant_id
      src_ip:    ref.src_ip
    expectation:
      expected: none
      summary: "A regular interactive user sign-in does not match the detection's ServicePrincipalSignInLogs-scoped filter"
