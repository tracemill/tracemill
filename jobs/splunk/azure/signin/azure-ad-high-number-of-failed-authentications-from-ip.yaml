type: job
description: |
  Validates detection of a high number of failed Microsoft Entra ID (Azure AD)
  authentications from a single source IP (credential access / brute force):
  30 failed interactive sign-ins (error code 50126) from one IP against one
  tenant user within a short window, well above the "more than 20 failures in
  10 minutes" threshold the detection enforces.
mitre:
  tactics: [credential-access]
  techniques: [T1110.001]

state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  src_ip: gen.ipv4()
  victim_upn: "targetUser@example.onmicrosoft.com"
  victim_id: gen.uuid()

workloads:
  - scenario: scenarios/azure/signin/failed-authentication-from-ip
    loop: 30
    bindings:
      tenant_id:  ref.tenant_id
      src_ip:     ref.src_ip
      victim_upn: ref.victim_upn
      victim_id:  ref.victim_id
    expectation:
      summary: "30 failed Entra ID sign-ins (error 50126) from one source IP exceed the >20-in-10-minutes threshold and trigger the detection."
      expected: alert
      mitre:
        tactics: [credential-access]
        techniques: [T1110.001]
