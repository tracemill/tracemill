type: job
name: Detect Distributed Password Spray Attempts
detection:
  source: escu
  name: "ESCU - Detect Distributed Password Spray Attempts - Rule"
  id: b1a82fc8-8a9f-4344-9ec2-bde5c5331b57
description: |
  Validates detection of a distributed password spray: failed
  authentications across more than 30 distinct users and source IPs
  within a 10-minute window, judged by a 3-sigma outlier test. The
  attack loops 35 times with the source IP unbound, pairing each user
  with its own address and a run-unique user agent that the fired
  alert's result row is correlated on.

  No control: a sibling detection aggregates tenant-wide with no
  grouping key, so it fires on this workload's own volume.

mitre:
  tactics: [credential-access]
  techniques: [T1110.003]

state:
  tenant_id:   "11111111-1111-1111-1111-111111111111"
  ua_build:    gen.int(min=1000, max=9999)
  user_agent:  "Mozilla/5.0 (Windows NT; Windows NT 10.0; en-US) WindowsPowerShell/5.1.22621.${ref.ua_build}"

pools:
  - id: spray-targets
    sampling:
      mode: round_robin
    csv:
      data: |
        victim_upn
        user1@example.onmicrosoft.com
        user2@example.onmicrosoft.com
        user3@example.onmicrosoft.com
        user4@example.onmicrosoft.com
        user5@example.onmicrosoft.com
        user6@example.onmicrosoft.com
        user7@example.onmicrosoft.com
        user8@example.onmicrosoft.com
        user9@example.onmicrosoft.com
        user10@example.onmicrosoft.com
        user11@example.onmicrosoft.com
        user12@example.onmicrosoft.com
        user13@example.onmicrosoft.com
        user14@example.onmicrosoft.com
        user15@example.onmicrosoft.com
        user16@example.onmicrosoft.com
        user17@example.onmicrosoft.com
        user18@example.onmicrosoft.com
        user19@example.onmicrosoft.com
        user20@example.onmicrosoft.com
        user21@example.onmicrosoft.com
        user22@example.onmicrosoft.com
        user23@example.onmicrosoft.com
        user24@example.onmicrosoft.com
        user25@example.onmicrosoft.com
        user26@example.onmicrosoft.com
        user27@example.onmicrosoft.com
        user28@example.onmicrosoft.com
        user29@example.onmicrosoft.com
        user30@example.onmicrosoft.com
        user31@example.onmicrosoft.com
        user32@example.onmicrosoft.com
        user33@example.onmicrosoft.com
        user34@example.onmicrosoft.com
        user35@example.onmicrosoft.com

workloads:
  - scenario: scenarios/azure/signin/failed-authentication-from-ip
    loop: 35
    bindings:
      tenant_id:   ref.tenant_id
      victim_upn:  pool.spray-targets.victim_upn
      user_agent:  ref.user_agent
    expectation:
      expected: alert
      summary: "35 distinct users each fail to authenticate from their own distinct source IP within a 10-minute window, clearing both distinct-count thresholds"
      mitre:
        tactics: [credential-access]
        techniques: [T1110.003]
      correlation:
        sourcetype: "azure:monitor:aad"
        user_agent: ref.user_agent
