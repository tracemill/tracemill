type: job
name: Detect Distributed Password Spray Attempts
detection:
  source: escu
  name: "ESCU - Detect Distributed Password Spray Attempts - Rule"
  id: b1a82fc8-8a9f-4344-9ec2-bde5c5331b57
description: |
  Validates detection of a distributed password spray attack via the
  CIM Authentication data model and a 3-sigma statistical outlier test
  (T1110.003): failed authentications spread across more than 30
  distinct users and more than 30 distinct source IPs within a
  10-minute window, grouped by signature and user agent. With a single
  observed burst, the per-(signature, user agent) standard deviation is
  0, so the outlier bound collapses to the burst's own counts -- any
  burst exceeding the detection's fixed floor of 30 for both distinct
  users and distinct source IPs is flagged. Reuses the merged
  failed-authentication-from-ip scenario. The attack workload loops 35
  times against one user agent, drawing a distinct target user from a
  pool each iteration and leaving the source IP unbound so each
  attempt also draws a fresh, distinct address -- a one-to-one
  user/IP pairing that clears both distinct-count thresholds at once.
  The detection's tstats + eventstats + mvexpand pipeline does not
  support per-event correlation, so the workload is credited by the
  fired alert's own result-row fields (signature_id, sourcetype, user
  agent) rather than per-event attribution.

  No control workload: the sibling "Azure AD Multi-Source Failed
  Authentications Spike" detection aggregates failed authentications
  tenant-wide with no grouping key of its own, so it fires whenever
  total failed-auth volume across any concurrent workloads in the same
  window exceeds its own (lower) thresholds -- which the attack
  workload's 35 users/IPs alone already does. A control run alongside
  it would be misattributed that same alert.

mitre:
  tactics: [credential-access]
  techniques: [T1110.003]

state:
  tenant_id:   "11111111-1111-1111-1111-111111111111"
  user_agent:  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"

pools:
  - id: spray-targets
    sampling:
      mode: round_robin
    csv:
      data: |
        victim_upn
        user1@example.onmicrosoft.com
        user2@example.onmicrosoft.com
        user3@example.onmicrosoft.com
        user4@example.onmicrosoft.com
        user5@example.onmicrosoft.com
        user6@example.onmicrosoft.com
        user7@example.onmicrosoft.com
        user8@example.onmicrosoft.com
        user9@example.onmicrosoft.com
        user10@example.onmicrosoft.com
        user11@example.onmicrosoft.com
        user12@example.onmicrosoft.com
        user13@example.onmicrosoft.com
        user14@example.onmicrosoft.com
        user15@example.onmicrosoft.com
        user16@example.onmicrosoft.com
        user17@example.onmicrosoft.com
        user18@example.onmicrosoft.com
        user19@example.onmicrosoft.com
        user20@example.onmicrosoft.com
        user21@example.onmicrosoft.com
        user22@example.onmicrosoft.com
        user23@example.onmicrosoft.com
        user24@example.onmicrosoft.com
        user25@example.onmicrosoft.com
        user26@example.onmicrosoft.com
        user27@example.onmicrosoft.com
        user28@example.onmicrosoft.com
        user29@example.onmicrosoft.com
        user30@example.onmicrosoft.com
        user31@example.onmicrosoft.com
        user32@example.onmicrosoft.com
        user33@example.onmicrosoft.com
        user34@example.onmicrosoft.com
        user35@example.onmicrosoft.com

workloads:
  - scenario: scenarios/azure/signin/failed-authentication-from-ip
    loop: 35
    bindings:
      tenant_id:   ref.tenant_id
      victim_upn:  pool.spray-targets.victim_upn
      user_agent:  ref.user_agent
    expectation:
      expected: alert
      summary: "35 distinct users each fail to authenticate from their own distinct source IP within a 10-minute window, clearing both distinct-count thresholds"
      mitre:
        tactics: [credential-access]
        techniques: [T1110.003]
      correlation:
        signature_id: "Sign-in activity"
        sourcetype:   "azure:monitor:aad"
        user_agent:   ref.user_agent
