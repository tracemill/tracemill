type: job
name: Azure AD Device Code Authentication
detection:
  source: escu
  name: "ESCU - Azure AD Device Code Authentication - Rule"
  id: d68d8732-6f7e-4ee5-a6eb-737f2b990b91
description: |
  Validates detection of a Microsoft Entra ID (Azure AD) sign-in that
  completed using the OAuth device-code authentication protocol
  (device-code phishing, a way to bypass MFA and Conditional Access
  enforcement, T1528 / T1566.002). A control confirms specificity: an
  ordinary sign-in by the same user to the same application, using no
  special authentication protocol, does not match the detection's
  device-code-scoped filter.

mitre:
  tactics: [defense-evasion, initial-access]
  techniques: [T1528, T1566.002]

state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  user_upn:  "employee@example.onmicrosoft.com"
  src_ip:    gen.ipv4()

workloads:
  - scenario: scenarios/azure/signin/device-code-authentication
    bindings:
      tenant_id: ref.tenant_id
      user_upn:  ref.user_upn
      src_ip:    ref.src_ip
    expectation:
      expected: alert
      summary: "A sign-in completes using the OAuth device-code authentication protocol"
      mitre:
        tactics: [defense-evasion, initial-access]
        techniques: [T1528, T1566.002]

  - scenario: scenarios/azure/signin/device-code-authentication
    bindings:
      tenant_id:     ref.tenant_id
      user_upn:      ref.user_upn
      src_ip:        ref.src_ip
      auth_protocol: "none"
    expectation:
      expected: none
      summary: "An ordinary sign-in with no special authentication protocol does not match the device-code-scoped filter"
