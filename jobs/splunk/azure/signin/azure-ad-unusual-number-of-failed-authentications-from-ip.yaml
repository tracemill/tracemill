type: job
name: Azure AD Unusual Number of Failed Authentications From Ip
detection:
  source: escu
  name: "ESCU - Azure AD Unusual Number of Failed Authentications From Ip - Rule"
  id: 3d8d3a36-93b8-42d7-8d91-c5f24cec223d
description: |
  Validates detection of a single source IP failing to authenticate
  against an unusually high number of distinct Azure AD users (error
  code 50126, invalid credentials), using a 3-sigma statistical
  outlier test over 5-minute buckets rather than a fixed threshold
  (T1110.003/T1110.004): consistent with a password spraying attack.
  With a single observed 5-minute burst, the per-IP standard deviation
  is 0, so the outlier bound collapses to the burst's own count -- any
  burst exceeding the detection's fixed floor of 10 distinct users is
  flagged. Upstream also tags this T1586.003 (Compromise Accounts, a
  Resource Development technique describing account acquisition
  outside the victim's tenant, which failed authentication attempts
  inside that tenant can never represent); used T1110.003/T1110.004
  only. Reuses the merged failed-authentication-from-ip scenario. The
  attack workload loops 15 times against one source IP, drawing a
  distinct target user from a pool each iteration (above the fixed
  floor of 10). A control loops 5 times against a different source IP
  with only 5 distinct users, below the floor.

mitre:
  tactics: [credential-access]
  techniques: [T1110.003, T1110.004]

state:
  tenant_id:  "11111111-1111-1111-1111-111111111111"
  attack_ip:  gen.ipv4()
  control_ip: gen.ipv4()

pools:
  - id: spray-targets
    sampling:
      mode: round_robin
    csv:
      data: |
        victim_upn
        user1@example.onmicrosoft.com
        user2@example.onmicrosoft.com
        user3@example.onmicrosoft.com
        user4@example.onmicrosoft.com
        user5@example.onmicrosoft.com
        user6@example.onmicrosoft.com
        user7@example.onmicrosoft.com
        user8@example.onmicrosoft.com
        user9@example.onmicrosoft.com
        user10@example.onmicrosoft.com
        user11@example.onmicrosoft.com
        user12@example.onmicrosoft.com
        user13@example.onmicrosoft.com
        user14@example.onmicrosoft.com
        user15@example.onmicrosoft.com
  - id: routine-targets
    sampling:
      mode: round_robin
    csv:
      data: |
        victim_upn
        helpdesk-user1@example.onmicrosoft.com
        helpdesk-user2@example.onmicrosoft.com
        helpdesk-user3@example.onmicrosoft.com
        helpdesk-user4@example.onmicrosoft.com
        helpdesk-user5@example.onmicrosoft.com

workloads:
  - scenario: scenarios/azure/signin/failed-authentication-from-ip
    loop: 15
    bindings:
      tenant_id:  ref.tenant_id
      src_ip:     ref.attack_ip
      victim_upn: pool.spray-targets.victim_upn
    expectation:
      expected: alert
      summary: "One source IP fails to authenticate against 15 distinct users in one burst, above the detection's fixed floor of 10"
      mitre:
        tactics: [credential-access]
        techniques: [T1110.003, T1110.004]

  - scenario: scenarios/azure/signin/failed-authentication-from-ip
    loop: 5
    bindings:
      tenant_id:  ref.tenant_id
      src_ip:     ref.control_ip
      victim_upn: pool.routine-targets.victim_upn
    expectation:
      expected: none
      summary: "A different source IP fails to authenticate against only 5 distinct users -- below the detection's fixed floor of 10 -- and does not match the filter"
