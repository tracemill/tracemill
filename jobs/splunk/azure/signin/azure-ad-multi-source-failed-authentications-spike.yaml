type: job
name: Azure AD Multi-Source Failed Authentications Spike
detection:
  source: escu
  name: "ESCU - Azure AD Multi-Source Failed Authentications Spike - Rule"
  id: 116e11a9-63ea-41eb-a66a-6a13bdc7d2c7
description: |
  Validates detection of a distributed password spraying attack in
  Azure AD (T1110.003/T1110.004): a spike in failed authentications
  (error code 50126, invalid credentials) spread across more than 20
  distinct users, more than 20 distinct source IPs, and more than 20
  distinct IP-user combinations within a 5-minute window -- consistent
  with an adversary distributing login attempts across many sources to
  avoid per-IP or per-user thresholds. Upstream also tags this
  T1586.003 (Compromise Accounts, a Resource Development technique
  describing account acquisition outside the victim's tenant, which
  failed authentication attempts inside that tenant can never
  represent); used T1110.003/T1110.004 only. Reuses the merged
  failed-authentication-from-ip scenario. The attack workload loops 25
  times, drawing a distinct target user from a pool each iteration and
  leaving the source IP unbound so each attempt also draws a fresh,
  distinct address -- a one-to-one user/IP pairing that clears all
  three distinct-count thresholds at once.

  No control workload: the detection's own aggregation has no grouping
  key at all (a tenant-wide stats with no BY clause), so any second
  workload's events within the same 5-minute window merge into the
  same global counts as the attack's, making an isolated expected:none
  demonstration structurally impossible within one validation run.

mitre:
  tactics: [credential-access]
  techniques: [T1110.003, T1110.004]

state:
  tenant_id: "11111111-1111-1111-1111-111111111111"

pools:
  - id: spray-targets
    sampling:
      mode: round_robin
    csv:
      data: |
        victim_upn
        user1@example.onmicrosoft.com
        user2@example.onmicrosoft.com
        user3@example.onmicrosoft.com
        user4@example.onmicrosoft.com
        user5@example.onmicrosoft.com
        user6@example.onmicrosoft.com
        user7@example.onmicrosoft.com
        user8@example.onmicrosoft.com
        user9@example.onmicrosoft.com
        user10@example.onmicrosoft.com
        user11@example.onmicrosoft.com
        user12@example.onmicrosoft.com
        user13@example.onmicrosoft.com
        user14@example.onmicrosoft.com
        user15@example.onmicrosoft.com
        user16@example.onmicrosoft.com
        user17@example.onmicrosoft.com
        user18@example.onmicrosoft.com
        user19@example.onmicrosoft.com
        user20@example.onmicrosoft.com
        user21@example.onmicrosoft.com
        user22@example.onmicrosoft.com
        user23@example.onmicrosoft.com
        user24@example.onmicrosoft.com
        user25@example.onmicrosoft.com
workloads:
  - scenario: scenarios/azure/signin/failed-authentication-from-ip
    loop: 25
    bindings:
      tenant_id:  ref.tenant_id
      victim_upn: pool.spray-targets.victim_upn
    expectation:
      expected: alert
      summary: "25 distinct users each fail to authenticate from their own distinct source IP within a 5-minute window, clearing all three distinct-count thresholds"
      mitre:
        tactics: [credential-access]
        techniques: [T1110.003, T1110.004]
