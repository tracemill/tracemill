type: job
detection:
  source: escu
  name: "Azure AD Authentication Failed During MFA Challenge"
  id: e62c9c2e-bf51-4719-906c-3074618fcc1c
description: |
  Validates detection of a failed Microsoft Entra ID (Azure AD) multi-factor
  authentication challenge: an interactive sign-in with error code 500121, the
  password and MFA steps both failed, and an "MFA denied" status -- a possible
  attempt to bypass MFA with compromised credentials.

  The detection collapses matching sign-ins into an aggregate row with no
  per-event identity, so this job correlates on that row.
mitre:
  tactics: [credential-access]
  techniques: [T1621]

state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  src_ip: gen.ipv4()
  victim_upn: "targetUser@example.onmicrosoft.com"
  victim_id: gen.uuid()

workloads:
  - scenario: scenarios/azure/signin/mfa-challenge-failed
    bindings:
      tenant_id:  ref.tenant_id
      src_ip:     ref.src_ip
      victim_upn: ref.victim_upn
      victim_id:  ref.victim_id
    expectation:
      summary: "A failed Entra ID MFA challenge (error 500121, MFA denied) triggers the detection; matched on the aggregate result row."
      expected: alert
      mitre:
        tactics: [credential-access]
        techniques: [T1621]
      correlation:
        # CIM aliases applied by the add-on: user <- userPrincipalName,
        # src <- ipAddress, vendor_account <- tenantId; vendor_product is its
        # constant.
        user:           ref.victim_upn
        src:            ref.src_ip
        vendor_account: ref.tenant_id
        vendor_product: "Azure AD"
