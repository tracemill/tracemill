type: job
name: Microsoft Intune Device Health Scripts
detection:
  source: escu
  name: "ESCU - Microsoft Intune Device Health Scripts - Rule"
  id: 6fe42e07-15b1-4caa-b547-7885666cb1bd
description: |
  Validates detection of an Intune device health (remediation) script
  being created, updated, deleted, or assigned. These scripts run with
  SYSTEM-level privileges on every device they target, so the same
  capability enables code execution and lateral movement onto
  Intune-managed endpoints.

  No control: every scenario on this surface trips one of the sibling
  Intune detections, so an isolated control is not constructible here.

mitre:
  tactics: [execution, lateral-movement, defense-evasion, command-and-control]
  techniques: [T1072, T1021.007, T1202, T1105]

state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  admin_upn: "admin@example.onmicrosoft.com"

workloads:
  - scenario: scenarios/azure/intune/create-device-health-script
    bindings:
      tenant_id: ref.tenant_id
      admin_upn: ref.admin_upn
    expectation:
      expected: alert
      summary: "A device health script is created"
      mitre:
        tactics: [execution, lateral-movement, defense-evasion, command-and-control]
        techniques: [T1072, T1021.007, T1202, T1105]
