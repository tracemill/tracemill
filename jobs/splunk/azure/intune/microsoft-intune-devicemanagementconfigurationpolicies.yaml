type: job
name: Microsoft Intune DeviceManagementConfigurationPolicies
detection:
  source: escu
  name: "ESCU - Microsoft Intune DeviceManagementConfigurationPolicies - Rule"
  id: 3c49e5ed-625c-408c-a2c7-8e2b524efb2c
description: |
  Validates detection of an Intune device management configuration
  policy being created, updated, deleted, or assigned. These policies
  remotely manage settings on Intune-managed devices, so this
  legitimate admin capability can also be abused to disable defenses
  and evade detection tenant-wide. A control confirms specificity: an
  unrelated Intune management operation (creating a device health
  script) does not match the detection's configuration-policy-scoped
  filter.

mitre:
  tactics: [execution, lateral-movement, defense-evasion, privilege-escalation]
  techniques: [T1072, T1484, T1021.007, T1562.001, T1562.004]

state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  admin_upn: "admin@example.onmicrosoft.com"

workloads:
  - scenario: scenarios/azure/intune/patch-device-management-configuration-policy
    bindings:
      tenant_id: ref.tenant_id
      admin_upn: ref.admin_upn
    expectation:
      expected: alert
      summary: "A device management configuration policy is updated"
      mitre:
        tactics: [execution, lateral-movement, defense-evasion, privilege-escalation]
        techniques: [T1072, T1484, T1021.007, T1562.001, T1562.004]

  - scenario: scenarios/azure/signin/successful-single-factor-signin
    bindings:
      tenant_id: ref.tenant_id
      user_upn:  ref.admin_upn
    expectation:
      expected: none
      summary: "An ordinary Entra ID sign-in -- a different Azure Monitor sourcetype entirely -- does not match the detection's Intune-activity-scoped filter"
