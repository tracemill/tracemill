type: job
name: Microsoft Intune Bulk Wipe
detection:
  source: escu
  name: "ESCU - Microsoft Intune Bulk Wipe - Rule"
  id: c3f48aa9-878e-443f-8889-e42a11a9bea9
description: |
  Validates detection of a high volume of "wipe ManagedDevice" actions
  triggered from the Intune admin portal (5+ by one administrator,
  T1561.001): this action factory resets a device enrolled in the
  tenant, so an attacker abusing it at scale can perform a large-scale
  data wiping attack against every managed endpoint the account can
  reach. The attack workload loops six times (above the >=5 threshold)
  against one administrator; a benign control loops the same scenario
  twice against a different administrator, below the threshold.

mitre:
  tactics: [impact]
  techniques: [T1561.001]

state:
  tenant_id:     "11111111-1111-1111-1111-111111111111"
  attacker_upn:  "admin@example.onmicrosoft.com"
  routine_upn:   "helpdesk-user@example.onmicrosoft.com"

workloads:
  - scenario: scenarios/azure/intune/wipe-managed-device
    loop: 6
    bindings:
      tenant_id: ref.tenant_id
      admin_upn: ref.attacker_upn
    expectation:
      expected: alert
      summary: "One administrator triggers six device wipes, exceeding the >=5 threshold"
      mitre:
        tactics: [impact]
        techniques: [T1561.001]

  - scenario: scenarios/azure/intune/wipe-managed-device
    loop: 2
    bindings:
      tenant_id: ref.tenant_id
      admin_upn: ref.routine_upn
    expectation:
      expected: none
      summary: "A different administrator triggers two device wipes -- ordinary offboarding activity below the threshold -- and does not match the detection's volume-scoped filter"
