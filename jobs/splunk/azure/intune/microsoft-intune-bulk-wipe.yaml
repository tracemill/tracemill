type: job
name: Microsoft Intune Bulk Wipe
detection:
  source: escu
  name: "ESCU - Microsoft Intune Bulk Wipe - Rule"
  id: c3f48aa9-878e-443f-8889-e42a11a9bea9
description: |
  Validates detection of five or more device wipes triggered from the
  Intune admin portal by one administrator. Each factory-resets an
  enrolled device, so abusing this at scale wipes every managed
  endpoint the account can reach. The attack loops six times, above
  the threshold.

  No control: any sub-threshold wipe burst trips the Manual Device
  Management detection, which matches every managed-device operation,
  so an isolated control is not constructible here.

mitre:
  tactics: [impact]
  techniques: [T1561.001]

state:
  tenant_id:     "11111111-1111-1111-1111-111111111111"
  attacker_upn:  "admin@example.onmicrosoft.com"

workloads:
  - scenario: scenarios/azure/intune/wipe-managed-device
    loop: 6
    bindings:
      tenant_id: ref.tenant_id
      admin_upn: ref.attacker_upn
    expectation:
      expected: alert
      summary: "One administrator triggers six device wipes, exceeding the >=5 threshold"
      mitre:
        tactics: [impact]
        techniques: [T1561.001]
