type: job
name: Microsoft Intune Mobile Apps
detection:
  source: escu
  name: "ESCU - Microsoft Intune Mobile Apps - Rule"
  id: 98e6b389-2806-4426-a580-8a92cb0d9710
description: |
  Validates detection of a packaged mobile application being added,
  updated, or deleted in the tenant's Intune app catalog. This
  legitimate software deployment capability can be abused to push a
  malicious payload to every device the app targets. Upstream ships
  this detection with no attack_data test entry at all (status:
  experimental); the scenario is synthesized from the same
  operationName naming pattern (verb+ObjectType) observed across the
  other, genuinely captured Intune operations in the same audit
  stream, so there is no captured master to fidelity-check against.
  A control confirms specificity: an unrelated Intune management
  operation (creating a device health script) does not match the
  detection's mobile-app-scoped filter.

mitre:
  tactics: [execution, lateral-movement, defense-evasion, command-and-control]
  techniques: [T1072, T1021.007, T1202, T1105]

state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  admin_upn: "admin@example.onmicrosoft.com"

workloads:
  - scenario: scenarios/azure/intune/create-mobile-app
    bindings:
      tenant_id: ref.tenant_id
      admin_upn: ref.admin_upn
    expectation:
      expected: alert
      summary: "A packaged mobile app is added to the tenant's app catalog"
      mitre:
        tactics: [execution, lateral-movement, defense-evasion, command-and-control]
        techniques: [T1072, T1021.007, T1202, T1105]

  - scenario: scenarios/azure/signin/successful-single-factor-signin
    bindings:
      tenant_id: ref.tenant_id
      user_upn:  ref.admin_upn
    expectation:
      expected: none
      summary: "An ordinary Entra ID sign-in -- a different Azure Monitor sourcetype entirely -- does not match the detection's Intune-activity-scoped filter"
