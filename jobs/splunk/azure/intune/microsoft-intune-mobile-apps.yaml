type: job
name: Microsoft Intune Mobile Apps
detection:
  source: escu
  name: "ESCU - Microsoft Intune Mobile Apps - Rule"
  id: 98e6b389-2806-4426-a580-8a92cb0d9710
description: |
  Validates detection of a packaged mobile application being added,
  updated, or deleted in the tenant's Intune app catalog. The same
  software deployment path can push a malicious payload to every
  device the app targets.

  No control: every scenario on this surface trips one of the sibling
  Intune detections, so an isolated control is not constructible here.

mitre:
  tactics: [execution, lateral-movement, defense-evasion, command-and-control]
  techniques: [T1072, T1021.007, T1202, T1105]

state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  admin_upn: "admin@example.onmicrosoft.com"

workloads:
  - scenario: scenarios/azure/intune/create-mobile-app
    bindings:
      tenant_id: ref.tenant_id
      admin_upn: ref.admin_upn
    expectation:
      expected: alert
      summary: "A packaged mobile app is added to the tenant's app catalog"
      mitre:
        tactics: [execution, lateral-movement, defense-evasion, command-and-control]
        techniques: [T1072, T1021.007, T1202, T1105]
