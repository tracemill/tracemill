type: job
name: Azure AD User Enabled And Password Reset
detection:
  source: escu
  name: "ESCU - Azure AD User Enabled And Password Reset - Rule"
  id: 1347b9e8-2daa-4a6f-be73-b421d3d9e268
description: |
  Validates detection of a Microsoft Entra ID (Azure AD) enable-then-reset
  sequence: an administrator re-enables a previously disabled account and resets
  its password within two minutes, a backdoor-identity persistence path. The
  attack workload emits the full enable trail ("Enable account" plus "Update
  user") and a follow-on "Reset password (by admin)" on one target inside the
  correlation window; a benign control resets a different account's password
  with no preceding enable, and must not alert.
mitre:
  tactics: [persistence]
  techniques: [T1098]
state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  admin_upn: "admin@example.onmicrosoft.com"
  # Distinct targets per workload: the sequence is correlated per account, so
  # the benign reset must act on a different account than the attack chain --
  # otherwise the lone reset could pair with the attack's enable in the same
  # window and raise the alert spuriously.
  attack_target_upn: "user@example.onmicrosoft.com"
  benign_target_upn: "helpdesk-reset-user@example.onmicrosoft.com"
  source_ip: gen.ipv4()
workloads:
  - scenario: scenarios/azure/audit/enable-account-and-reset-password
    bindings:
      tenant_id:  ref.tenant_id
      admin_upn:  ref.admin_upn
      target_upn: ref.attack_target_upn
      src_ip:     ref.source_ip
    expectation:
      expected: alert
      correlation:
        user: ref.attack_target_upn
        initiatedBy: ref.admin_upn
        vendor_product: "Azure AD"
      summary: >-
        An administrator enables a previously disabled account and resets its
        password within two minutes -- the enable-then-reset chain on one target
        raises the alert.
      mitre:
        tactics: [persistence]
        techniques: [T1098]

  - scenario: scenarios/azure/audit/admin-password-reset
    bindings:
      tenant_id:  ref.tenant_id
      admin_upn:  ref.admin_upn
      target_upn: ref.benign_target_upn
      src_ip:     ref.source_ip
    expectation:
      expected: none
      summary: >-
        A standalone administrative password reset on an account that was not
        enabled beforehand does not start the enable-then-reset sequence, so no
        alert fires.
