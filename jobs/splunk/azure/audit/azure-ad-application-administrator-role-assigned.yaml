type: job
detection:
  source: escu
  name: "Azure AD Application Administrator Role Assigned"
  id: eac4de87-7a56-4538-a21b-277897af6d8d
description: |
  Validates detection of an Azure AD "Add member to role" assignment granting the
  Application Administrator role -- a privilege-escalation and persistence path,
  since that role manages enterprise application credentials. The attack workload
  emits one such record (sufficient to alert); a benign control assigns the User
  Administrator role instead and must not alert.
mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1098.003]
state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  admin_upn: "admin@example.onmicrosoft.com"
  attack_target_upn: "user@example.onmicrosoft.com"
  benign_target_upn: "helpdesk-user@example.onmicrosoft.com"
  source_ip: gen.ipv4()
workloads:
  - scenario: scenarios/azure/audit/assign-application-administrator-role
    bindings:
      tenant_id:  ref.tenant_id
      admin_upn:  ref.admin_upn
      target_upn: ref.attack_target_upn
      src_ip:     ref.source_ip
    expectation:
      expected: alert
      correlation:
        user: ref.attack_target_upn
        initiatedBy: ref.admin_upn
        vendor_product: "Azure AD"
      summary: >-
        One "Add member to role" record granting the Application Administrator
        role raises the alert.
      mitre:
        tactics: [persistence, privilege-escalation]
        techniques: [T1098.003]

  - scenario: scenarios/azure/audit/assign-user-administrator-role
    bindings:
      tenant_id:  ref.tenant_id
      admin_upn:  ref.admin_upn
      target_upn: ref.benign_target_upn
      src_ip:     ref.source_ip
    expectation:
      expected: none
      summary: >-
        Assigning the User Administrator role does not match the detection, so no
        alert fires.
