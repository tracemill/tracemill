type: job
name: Azure AD Privileged Graph API Permission Assigned
detection:
  source: escu
  name: "ESCU - Azure AD Privileged Graph API Permission Assigned - Rule"
  id: 5521f8c5-1aa3-473c-9eb7-853701924a06
description: |
  Validates detection of an application registration being granted one
  of three high-risk Microsoft Graph API permissions --
  Application.ReadWrite.All, AppRoleAssignment.ReadWrite.All, or
  RoleManagement.ReadWrite.Directory -- each of which grants broad
  control over Azure AD directory and application settings
  (persistence / privilege escalation, T1098.003). Upstream tags this
  detection T1003.002 (OS Credential Dumping via SAM), which doesn't
  match its actual behavior and mismatches its own dataset path
  (T1098.003); used T1098.003 instead, matching the sibling
  permission-grant detection. The detection's grouping key includes a
  field the SPL synthesizes out of a JSON blob via spath, which has no
  raw-event counterpart, so the workload is credited by the fired
  alert's result-row fields rather than per-event attribution. A
  control confirms specificity: the same application being granted an
  ordinary, unrelated permission does not match the detection's
  entitlement-scoped filter.

  All three entitlement arms are modeled as expected:alert, since all
  three represent genuine attack presence regardless of whether the
  detection currently catches them. The RoleManagement.ReadWrite.Directory
  arm (1bfefb4e...) is a confirmed non-firing upstream defect: the SPL's
  own OR-clause has a literal leading space inside its quoted match value
  ("...EntitlementId"=" 1bfefb4e-..."), so it never matches a real
  entitlement id -- verified directly against the fired alert's own
  result rows. That workload is expected to fail live until the upstream
  SPL is fixed; it is kept as expected:alert rather than reclassified to
  match the buggy behavior, so the gap stays visible. It is isolated from
  the Exchange (FullAccessAsApp) entitlement granted in the other arms:
  a sibling detection's own SPL synthesizes its Permissions field from
  the whole modified-properties blob, so including that entitlement here
  would let the sibling's alert coincidentally satisfy this workload's
  correlation fields and mask the gap instead of exposing it.

mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1098.003]

state:
  tenant_id:   "11111111-1111-1111-1111-111111111111"
  admin_upn:   "admin@example.onmicrosoft.com"
  src_ip:      gen.ipv4()
  app_display: "Mail Reader App"

