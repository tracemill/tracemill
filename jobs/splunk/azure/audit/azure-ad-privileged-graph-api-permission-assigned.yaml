type: job
name: Azure AD Privileged Graph API Permission Assigned
detection:
  source: escu
  name: "ESCU - Azure AD Privileged Graph API Permission Assigned - Rule"
  id: 5521f8c5-1aa3-473c-9eb7-853701924a06
description: |
  Validates detection of an application registration being granted one
  of three high-risk Microsoft Graph API permissions, each granting
  broad control over Azure AD directory and application settings.

  The Application.ReadWrite.All arm does not alert: the
  detection's OR-clause carries a literal leading space inside its
  quoted match value, so that entitlement never matches. It is kept as
  expected:alert so the gap stays visible, and excludes the Exchange
  entitlement the other arms carry, which a sibling detection would
  otherwise match and mask the gap.
mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1098.003]

state:
  tenant_id:   "11111111-1111-1111-1111-111111111111"
  admin_upn:   "admin@example.onmicrosoft.com"
  src_ip:      gen.ipv4()
  app_display: "Mail Reader App"

workloads:
  - scenario: scenarios/azure/audit/app-registration-permission-grant
    bindings:
      tenant_id:             ref.tenant_id
      admin_upn:             ref.admin_upn
      src_ip:                ref.src_ip
      app_display:           ref.app_display
      permission_grant_old:  "[{\"ResourceAppId\":\"00000003-0000-0000-c000-000000000000\",\"RequiredAppPermissions\":[{\"EntitlementId\":\"570282fd-fa5c-430d-a7fd-fc8dc98a9dca\",\"DirectAccessGrant\":false,\"ImpersonationAccessGrants\":[20]},{\"EntitlementId\":\"7427e0e9-2fba-42fe-b0c0-848c9e6a8182\",\"DirectAccessGrant\":false,\"ImpersonationAccessGrants\":[20]},{\"EntitlementId\":\"e1fe6dd8-ba31-4d61-89e7-88639da4683d\",\"DirectAccessGrant\":false,\"ImpersonationAccessGrants\":[20]},{\"EntitlementId\":\"810c84a8-4a9e-49e6-bf7d-12d183f40d01\",\"DirectAccessGrant\":true,\"ImpersonationAccessGrants\":[]}],\"EncodingVersion\":1}]"
      permission_grant_new:  "[{\"ResourceAppId\":\"00000003-0000-0000-c000-000000000000\",\"RequiredAppPermissions\":[{\"EntitlementId\":\"570282fd-fa5c-430d-a7fd-fc8dc98a9dca\",\"DirectAccessGrant\":false,\"ImpersonationAccessGrants\":[20]},{\"EntitlementId\":\"7427e0e9-2fba-42fe-b0c0-848c9e6a8182\",\"DirectAccessGrant\":false,\"ImpersonationAccessGrants\":[20]},{\"EntitlementId\":\"e1fe6dd8-ba31-4d61-89e7-88639da4683d\",\"DirectAccessGrant\":false,\"ImpersonationAccessGrants\":[20]},{\"EntitlementId\":\"810c84a8-4a9e-49e6-bf7d-12d183f40d01\",\"DirectAccessGrant\":true,\"ImpersonationAccessGrants\":[]},{\"EntitlementId\":\"1bfefb4e-e0b5-418b-a88f-73c46d2cc8e9\",\"DirectAccessGrant\":true,\"ImpersonationAccessGrants\":[]}],\"EncodingVersion\":1}]"
    expectation:
      expected: alert
      summary: "An application registration is granted Application.ReadWrite.All (1bfefb4e...) alone. The detection does not match this entitlement, so the workload documents the gap rather than masking it; the Exchange entitlement is omitted so a sibling detection cannot satisfy this workload's correlation instead."
      mitre:
        tactics: [persistence, privilege-escalation]
        techniques: [T1098.003]
      correlation:
        dest:        ref.tenant_id
        user:        ref.admin_upn
        src:         ref.src_ip
        Permissions: "1bfefb4e-e0b5-418b-a88f-73c46d2cc8e9"

