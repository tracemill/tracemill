type: job
name: Azure AD PIM Role Assigned
detection:
  source: escu
  name: "ESCU - Azure AD PIM Role Assigned - Rule"
  id: fcd6dfeb-191c-46a0-a29c-c306382145ab
description: |
  Validates detection of a user being made eligible for a Privileged
  Identity Management (PIM) directory role (persistence / privilege
  escalation, T1098.003): once eligible, the user can self-activate the
  role without further approval, giving an attacker a standing path to
  privileged access. A control confirms specificity: removing the same
  user's eligible-role assignment does not match the detection's
  add-scoped filter.

mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1098.003]

state:
  tenant_id:  "11111111-1111-1111-1111-111111111111"
  target_upn: "targetUser@example.onmicrosoft.com"
  src_ip:     gen.ipv4()

workloads:
  - scenario: scenarios/azure/audit/pim-eligible-role-assignment
    bindings:
      tenant_id:  ref.tenant_id
      target_upn: ref.target_upn
      src_ip:     ref.src_ip
    expectation:
      expected: alert
      summary: "A user is made eligible for a PIM directory role"
      mitre:
        tactics: [persistence, privilege-escalation]
        techniques: [T1098.003]

  - scenario: scenarios/azure/audit/pim-eligible-role-assignment
    bindings:
      tenant_id:             ref.tenant_id
      target_upn:            ref.target_upn
      src_ip:                ref.src_ip
      operation_name:        "Remove eligible member from role in PIM completed (timebound)"
      operation_type:        "AdminRemoveEligibleRole"
      second_resource_type:  "RoleAssignment"
    expectation:
      expected: none
      summary: "The same user's eligible-role assignment is removed and does not match the detection's add-scoped filter"
