type: job
name: Azure AD New Custom Domain Added
detection:
  source: escu
  name: "ESCU - Azure AD New Custom Domain Added - Rule"
  id: 30c47f45-dd6a-4720-9963-0bca6c8686ef
description: |
  Validates detection of a new unverified custom domain being added to a
  Microsoft Entra ID (Azure AD) tenant (defense evasion / privilege
  escalation via identity-federation backdoor, T1484.002). The
  detection's grouping key includes a field the SPL renames out of the
  audit record's targetResources array, which has no raw-event
  counterpart, so the workload is credited by the fired alert's
  result-row fields rather than per-event attribution. A control
  confirms specificity: a different, unscoped operation on the same
  domain (verifying domain ownership) does not match the detection's
  operation-scoped filter.

mitre:
  tactics: [defense-evasion, privilege-escalation]
  techniques: [T1484.002]

state:
  tenant_id:  "11111111-1111-1111-1111-111111111111"
  admin_upn:  "admin@example.onmicrosoft.com"
  src_ip:     gen.ipv4()
  domain:     "newdomain.com"

workloads:
  - scenario: scenarios/azure/audit/add-unverified-domain
    bindings:
      tenant_id: ref.tenant_id
      admin_upn: ref.admin_upn
      src_ip:    ref.src_ip
      domain:    ref.domain
    expectation:
      expected: alert
      summary: "An unverified custom domain is added to the tenant"
      mitre:
        tactics: [defense-evasion, privilege-escalation]
        techniques: [T1484.002]
      correlation:
        dest:   ref.tenant_id
        user:   ref.admin_upn
        src:    ref.src_ip
        domain: ref.domain

  - scenario: scenarios/azure/audit/add-unverified-domain
    bindings:
      tenant_id:             ref.tenant_id
      admin_upn:             ref.admin_upn
      src_ip:                ref.src_ip
      domain:                ref.domain
      operation_name:        "Verify domain"
      activity_display_name: "Verify domain"
    expectation:
      expected: none
      summary: "The same domain has its ownership verified -- a different, unscoped operation -- and does not match the detection's Add-unverified-domain-scoped filter"
