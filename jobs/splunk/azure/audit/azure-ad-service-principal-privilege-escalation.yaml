type: job
name: Azure AD Service Principal Privilege Escalation
detection:
  source: escu
  name: "ESCU - Azure AD Service Principal Privilege Escalation - Rule"
  id: 29eb39d3-2bc8-49cc-99b3-35593191a588
description: |
  Validates detection of a service principal granting itself an app
  role assignment: one that already holds enough permission to manage
  app role assignments elevates its own access with no human approval,
  outside the admin-consent workflow. The shared scenario binds the
  acting and target display names to the same value to model
  self-assignment.

  No control: another job on the same shared scenario exercises a
  detection that matches every event the scenario emits, so any
  expected:none workload here would be attributed that alert instead.

mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1098.003]

state:
  tenant_id:     "11111111-1111-1111-1111-111111111111"
  actor_display: "MashAuthTest"

workloads:
  - scenario: scenarios/azure/audit/app-role-assignment-by-sp
    bindings:
      tenant_id:            ref.tenant_id
      actor_app_display:    ref.actor_display
      grant_target_display: ref.actor_display
    expectation:
      expected: alert
      summary: "A service principal grants itself an app role assignment"
      mitre:
        tactics: [persistence, privilege-escalation]
        techniques: [T1098.003]
