type: job
name: Azure AD Privileged Role Assigned
detection:
  source: escu
  name: "ESCU - Azure AD Privileged Role Assigned - Rule"
  id: a28f0bc3-3400-4a6e-a2da-89b9e95f0d2a
description: |
  Validates detection of a user being assigned any privileged Azure AD
  built-in role (persistence / privilege escalation, T1098.003). Unlike
  the role-specific sibling detections, this one checks the assigned
  role against Splunk's privileged_azure_ad_roles lookup, so it fires
  for any of the ~38 roles that lookup marks privileged, not just one.
  Reuses the merged assign-directory-role scenario at its own default
  (Global Administrator). A control confirms specificity: assigning
  Reports Reader -- a genuinely non-privileged, read-only role, per
  Microsoft's own documentation, and absent from the lookup -- does
  not match the detection's privileged-role filter.

mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1098.003]

state:
  tenant_id:  "11111111-1111-1111-1111-111111111111"
  admin_upn:  "admin@example.onmicrosoft.com"
  target_upn: "user@example.onmicrosoft.com"
  src_ip:     gen.ipv4()

workloads:
  - scenario: scenarios/azure/audit/assign-directory-role
    bindings:
      tenant_id:  ref.tenant_id
      admin_upn:  ref.admin_upn
      target_upn: ref.target_upn
      src_ip:     ref.src_ip
    expectation:
      expected: alert
      summary: "A user is assigned a privileged directory role (Global Administrator)"
      mitre:
        tactics: [persistence, privilege-escalation]
        techniques: [T1098.003]

  - scenario: scenarios/azure/audit/assign-directory-role
    bindings:
      tenant_id:             ref.tenant_id
      admin_upn:             ref.admin_upn
      target_upn:            ref.target_upn
      src_ip:                ref.src_ip
      role_display_name:     "Reports Reader"
      role_template_id:      "4a5d8f65-41da-4de4-8968-e035b65339cf"
      role_well_known_name:  "\"ReportsReader\""
    expectation:
      expected: none
      summary: "The same user is assigned a genuinely non-privileged role -- Reports Reader -- and does not match the detection's privileged-role filter"
