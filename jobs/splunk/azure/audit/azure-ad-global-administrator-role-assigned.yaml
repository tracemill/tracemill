type: job
name: Azure AD Global Administrator Role Assigned
detection:
  source: escu
  name: "ESCU - Azure AD Global Administrator Role Assigned - Rule"
  id: 825fed20-309d-4fd1-8aaf-cd49c1bb093c
description: |
  Validates detection of a user being assigned the Global Administrator
  directory role in a Microsoft Entra ID (Azure AD) tenant -- the most
  privileged built-in role, a common persistence and
  privilege-escalation step once an attacker gains any administrative
  foothold (T1098.003). The detection's group-by tuple never includes
  a per-event record id, so the workload is credited by the fired
  alert's result-row fields (tenant, target user, source IP, admin)
  rather than per-event attribution. A control confirms specificity:
  assigning an unrelated, narrower role to the same user does not
  match the detection's Global-Administrator-scoped filter.

mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1098.003]

state:
  tenant_id:               "11111111-1111-1111-1111-111111111111"
  admin_upn:               "admin@example.onmicrosoft.com"
  target_upn:              "user@example.onmicrosoft.com"
  src_ip:                  gen.ipv4()
  control_role_well_known: null

workloads:
  - scenario: scenarios/azure/audit/assign-directory-role
    bindings:
      tenant_id:  ref.tenant_id
      admin_upn:  ref.admin_upn
      target_upn: ref.target_upn
      src_ip:     ref.src_ip
    expectation:
      expected: alert
      summary: "A user is assigned the Global Administrator directory role"
      mitre:
        tactics: [persistence, privilege-escalation]
        techniques: [T1098.003]
      correlation:
        dest: ref.tenant_id
        user: ref.target_upn
        src:  ref.src_ip

  - scenario: scenarios/azure/audit/assign-directory-role
    bindings:
      tenant_id:            ref.tenant_id
      admin_upn:            ref.admin_upn
      target_upn:           ref.target_upn
      src_ip:               ref.src_ip
      role_display_name:    "Groups Administrator"
      role_well_known_name: ref.control_role_well_known
    expectation:
      expected: none
      summary: "The same user is assigned an unrelated, narrower role -- Groups Administrator -- and does not match the Global-Administrator-scoped filter"
