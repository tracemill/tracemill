type: job
name: Azure AD External Guest User Invited
detection:
  source: escu
  name: "ESCU - Azure AD External Guest User Invited - Rule"
  id: c1fb4edb-cab1-4359-9b40-925ffd797fb5
description: |
  Validates detection of an administrator inviting an external user as
  a guest into a Microsoft Entra ID (Azure AD) tenant (persistence via
  a B2B guest account, T1136.003). A control confirms specificity: an
  unrelated, ordinary directory operation by the same administrator
  does not match the invite-scoped filter.

mitre:
  tactics: [persistence]
  techniques: [T1136.003]

state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  admin_upn: "admin@example.onmicrosoft.com"
  src_ip:    gen.ipv4()

workloads:
  - scenario: scenarios/azure/audit/invite-external-guest-user
    bindings:
      tenant_id: ref.tenant_id
      admin_upn: ref.admin_upn
      src_ip:    ref.src_ip
    expectation:
      expected: alert
      summary: "An administrator invites an external user as a guest into the tenant"
      mitre:
        tactics: [persistence]
        techniques: [T1136.003]

  - scenario: scenarios/azure/audit/invite-external-guest-user
    bindings:
      tenant_id:      ref.tenant_id
      admin_upn:      ref.admin_upn
      src_ip:         ref.src_ip
      operation_name: "Update user"
    expectation:
      expected: none
      summary: "An unrelated, ordinary directory operation does not match the invite-scoped filter"
