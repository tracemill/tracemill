type: job
name: Azure Runbook Webhook Created
detection:
  source: escu
  name: "ESCU - Azure Runbook Webhook Created - Rule"
  id: e98944a9-92e4-443c-81b8-a322e33ce75a
description: |
  Validates detection of a new Azure Automation Runbook Webhook being
  created or updated (T1078.004): a webhook exposes an unauthenticated
  URL on the Internet that triggers a runbook, so an attacker who
  creates one gains a way to execute code, create users, or otherwise
  maintain persistence and control over Azure resources without any
  further authentication. A control confirms specificity: merely
  generating a candidate webhook URI -- a read-only-effect step that
  creates no webhook resource -- does not match the detection's
  webhook-creation-scoped filter.

mitre:
  tactics: [defense-evasion, initial-access, persistence, privilege-escalation]
  techniques: [T1078.004]

state:
  tenant_id:       "11111111-1111-1111-1111-111111111111"
  subscription_id: "22222222-2222-2222-2222-222222222222"
  caller_upn:      "admin@example.onmicrosoft.com"
  src_ip:          gen.ipv4()

workloads:
  - scenario: scenarios/azure/audit/create-automation-webhook
    bindings:
      tenant_id:       ref.tenant_id
      subscription_id: ref.subscription_id
      caller_upn:      ref.caller_upn
      src_ip:          ref.src_ip
    expectation:
      expected: alert
      summary: "A new Azure Automation Runbook webhook is created"
      mitre:
        tactics: [defense-evasion, initial-access, persistence, privilege-escalation]
        techniques: [T1078.004]

  - scenario: scenarios/azure/audit/generate-automation-webhook-uri
    bindings:
      tenant_id:       ref.tenant_id
      subscription_id: ref.subscription_id
      caller_upn:      ref.caller_upn
      src_ip:          ref.src_ip
    expectation:
      expected: none
      summary: "The same user only generates a candidate webhook URI -- a read-only-effect step that creates no webhook resource -- and does not match the detection's webhook-creation-scoped filter"
