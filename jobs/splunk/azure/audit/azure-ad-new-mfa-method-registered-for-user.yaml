type: job
name: Azure AD New MFA Method Registered For User
detection:
  source: escu
  name: "ESCU - Azure AD New MFA Method Registered For User - Rule"
  id: 2628b087-4189-403f-9044-87403f777a1b
description: |
  Validates detection of a Microsoft Entra ID (Azure AD) user
  registering a new authentication (MFA) method (credential access /
  defense evasion / persistence via MFA bypass, T1556.006): an attacker
  who registers their own method on a compromised account can
  authenticate without the legitimate owner's device. The detection's
  grouping key is built entirely from raw/CIM event fields with no
  array-indexed synthesis, but per-event attribution still doesn't
  resolve for this SPL shape, so the workload is credited by the fired
  alert's result-row fields instead. A control confirms specificity:
  the same user removing a registered method (the inverse action) does
  not match the detection's registration (operationType=Add) -scoped
  filter.

mitre:
  tactics: [credential-access, defense-evasion, persistence]
  techniques: [T1556.006]

state:
  tenant_id:           "11111111-1111-1111-1111-111111111111"
  victim_upn:          "targetUser@example.onmicrosoft.com"
  victim_id:           gen.uuid()
  src_ip:              gen.ipv4()
  operation_name:      "User registered security info"
  result_description:  "User registered Mobile Phone SMS"

workloads:
  - scenario: scenarios/azure/audit/register-security-info
    bindings:
      tenant_id:           ref.tenant_id
      victim_upn:          ref.victim_upn
      victim_id:           ref.victim_id
      src_ip:              ref.src_ip
      operation_name:      ref.operation_name
      result_description:  ref.result_description
    expectation:
      expected: alert
      summary: "A user registers a new authentication (MFA) method"
      mitre:
        tactics: [credential-access, defense-evasion, persistence]
        techniques: [T1556.006]
      correlation:
        dest:               ref.tenant_id
        user:               ref.victim_upn
        src:                ref.src_ip
        resultDescription:  ref.result_description
        signature:          ref.operation_name

  - scenario: scenarios/azure/audit/register-security-info
    bindings:
      tenant_id:           ref.tenant_id
      victim_upn:          ref.victim_upn
      victim_id:           ref.victim_id
      src_ip:              ref.src_ip
      operation_name:      "User deregistered security info"
      operation_type:      "Delete"
      result_description:  "User deregistered Mobile Phone SMS"
    expectation:
      expected: none
      summary: "The same user removes a registered authentication method -- the inverse operation -- and does not match the detection's registration-scoped filter"
