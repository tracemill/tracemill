type: job
name: Azure AD Service Principal New Client Credentials
detection:
  source: escu
  name: "ESCU - Azure AD Service Principal New Client Credentials - Rule"
  id: e3adc0d3-9e4b-4b5d-b662-12cec1adff2a
description: |
  Validates detection of a new client credential (password or
  certificate key) added to an application registration. An attacker
  who compromises an admin account can mint a secret for an
  application that already holds elevated permissions, a durable way
  to authenticate as that application. The record id does not survive
  the detection's field renaming, so the workload is credited by the
  fired alert's result-row fields. A control confirms specificity: the
  same admin granting an ordinary permission does not match.

mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1098.001]

state:
  tenant_id:      "11111111-1111-1111-1111-111111111111"
  admin_upn:      "admin@example.onmicrosoft.com"
  src_ip:         gen.ipv4()
  key_identifier: gen.uuid()
  key_display:    "test-creds"

workloads:
  - scenario: scenarios/azure/audit/add-application-credential
    bindings:
      tenant_id:      ref.tenant_id
      admin_upn:      ref.admin_upn
      src_ip:         ref.src_ip
      key_identifier: ref.key_identifier
      key_display:    ref.key_display
    expectation:
      expected: alert
      summary: "A new client credential is added to an application registration"
      mitre:
        tactics: [persistence, privilege-escalation]
        techniques: [T1098.001]
      correlation:
        dest: ref.tenant_id
        user: ref.admin_upn
        src:  ref.src_ip
        "modifiedProperties{}.newValue": "[\"[KeyIdentifier=${ref.key_identifier},KeyType=Password,KeyUsage=Verify,DisplayName=${ref.key_display}]\"]"

  - scenario: scenarios/azure/audit/app-registration-permission-grant
    bindings:
      tenant_id:            ref.tenant_id
      admin_upn:            ref.admin_upn
      src_ip:               ref.src_ip
      permission_grant_old: "[{\"ResourceAppId\":\"00000003-0000-0000-c000-000000000000\",\"RequiredAppPermissions\":[{\"EntitlementId\":\"570282fd-fa5c-430d-a7fd-fc8dc98a9dca\",\"DirectAccessGrant\":false,\"ImpersonationAccessGrants\":[20]}],\"EncodingVersion\":1}]"
      permission_grant_new: "[{\"ResourceAppId\":\"00000003-0000-0000-c000-000000000000\",\"RequiredAppPermissions\":[{\"EntitlementId\":\"570282fd-fa5c-430d-a7fd-fc8dc98a9dca\",\"DirectAccessGrant\":false,\"ImpersonationAccessGrants\":[20]},{\"EntitlementId\":\"64a6cbf3-b035-4a1e-b571-d996b0deac1b\",\"DirectAccessGrant\":false,\"ImpersonationAccessGrants\":[20]}],\"EncodingVersion\":1}]"
    expectation:
      expected: none
      summary: "The same admin grants the application an ordinary permission -- a different Update application operation, without the Certificates and secrets management suffix -- and does not match the detection's credential-management-scoped filter"
