type: job
name: Azure AD Service Principal Owner Added
detection:
  source: escu
  name: "ESCU - Azure AD Service Principal Owner Added - Rule"
  id: 7ddf2084-6cf3-4a44-be83-474f7b73c701
description: |
  Validates detection of a user being added as an owner of an
  application registration. Owners can manage the application's
  credentials and permissions without a directory role, and service
  principals support neither MFA nor conditional access, making this a
  durable foothold. A control confirms specificity: an admin adding
  themselves as owner is excluded as self-service and does not match.

mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1098]

state:
  tenant_id:        "11111111-1111-1111-1111-111111111111"
  admin_upn:        "admin@example.onmicrosoft.com"
  admin_object_id:  gen.uuid()
  src_ip:           gen.ipv4()

workloads:
  - scenario: scenarios/azure/audit/add-owner-to-application
    bindings:
      tenant_id:        ref.tenant_id
      admin_upn:        ref.admin_upn
      admin_object_id:  ref.admin_object_id
      src_ip:           ref.src_ip
    expectation:
      expected: alert
      summary: "A different user is added as owner of an application registration"
      mitre:
        tactics: [persistence, privilege-escalation]
        techniques: [T1098]

  - scenario: scenarios/azure/audit/add-owner-to-application
    bindings:
      tenant_id:            ref.tenant_id
      admin_upn:            ref.admin_upn
      admin_object_id:      ref.admin_object_id
      src_ip:               ref.src_ip
      new_owner_upn:        ref.admin_upn
      new_owner_object_id:  ref.admin_object_id
    expectation:
      expected: none
      summary: "The same admin adds themselves as owner of an application registration -- excluded by the detection's own initiatedBy!=newOwner filter -- and does not match"
