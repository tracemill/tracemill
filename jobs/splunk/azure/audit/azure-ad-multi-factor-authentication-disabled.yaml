type: job
name: Azure AD Multi-Factor Authentication Disabled
detection:
  source: escu
  name: "ESCU - Azure AD Multi-Factor Authentication Disabled - Rule"
  id: 482dd42a-acfa-486b-a0bb-d6fcda27318e
description: |
  Validates detection of a user's multi-factor authentication being
  disabled in a Microsoft Entra ID (Azure AD) tenant -- removal of an
  essential security control that can be used to maintain persistent
  access without re-triggering an MFA challenge (T1556.006). The
  source IP is populated even though the master sample has none (a
  directory-service-initiated change omits it), so `src` resolves for
  correlation. A control confirms specificity: the same user having an
  unrelated authentication property updated (their registered phone
  number) does not match the MFA-disable-scoped filter.

mitre:
  tactics: [credential-access, defense-evasion, persistence, resource-development]
  techniques: [T1556.006, T1586.003]

state:
  tenant_id:  "11111111-1111-1111-1111-111111111111"
  admin_upn:  "admin@example.onmicrosoft.com"
  target_upn: "user@example.onmicrosoft.com"
  src_ip:     gen.ipv4()

workloads:
  - scenario: scenarios/azure/audit/disable-strong-authentication
    bindings:
      tenant_id:  ref.tenant_id
      admin_upn:  ref.admin_upn
      target_upn: ref.target_upn
      src_ip:     ref.src_ip
    expectation:
      expected: alert
      summary: "A user's multi-factor authentication is disabled"
      mitre:
        tactics: [credential-access, defense-evasion, persistence, resource-development]
        techniques: [T1556.006, T1586.003]

  - scenario: scenarios/azure/audit/disable-strong-authentication
    bindings:
      tenant_id:            ref.tenant_id
      admin_upn:            ref.admin_upn
      target_upn:           ref.target_upn
      src_ip:               ref.src_ip
      operation_name:       "Update user"
      property_name:        "StrongAuthenticationUserDetails"
      property_old_value:   "[{\"PhoneNumber\":null,\"AlternativePhoneNumber\":null,\"Email\":null,\"VoiceOnlyPhoneNumber\":null}]"
      property_new_value:   "[{\"PhoneNumber\":\"+1 3071234321\",\"AlternativePhoneNumber\":null,\"Email\":null,\"VoiceOnlyPhoneNumber\":null}]"
    expectation:
      expected: none
      summary: "The same user has their registered phone number updated -- a different, unscoped authentication property -- and does not match the MFA-disable-scoped filter"
