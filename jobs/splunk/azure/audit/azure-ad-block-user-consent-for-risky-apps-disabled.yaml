type: job
name: Azure AD Block User Consent For Risky Apps Disabled
detection:
  source: escu
  name: "ESCU - Azure AD Block User Consent For Risky Apps Disabled - Rule"
  id: 875de3d7-09bc-4916-8c0a-0929f4ced3d8
description: |
  Validates detection of the risk-based step-up consent control being
  disabled in a Microsoft Entra ID (Azure AD) tenant's authorization
  policy (defense evasion, T1562): the AllowUserConsentForRiskyApps
  setting flips to true. A control confirms specificity: the opposite,
  protective change -- re-enabling the control -- does not match the
  detection's scoped filter.

mitre:
  tactics: [defense-evasion]
  techniques: [T1562]

state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  admin_upn: "admin@example.onmicrosoft.com"
  src_ip:    gen.ipv4()

workloads:
  - scenario: scenarios/azure/audit/authorization-policy-consent-setting-change
    bindings:
      tenant_id: ref.tenant_id
      admin_upn: ref.admin_upn
      src_ip:    ref.src_ip
    expectation:
      expected: alert
      summary: "An administrator disables the risk-based step-up consent control (AllowUserConsentForRiskyApps set to true)"
      mitre:
        tactics: [defense-evasion]
        techniques: [T1562]

  - scenario: scenarios/azure/audit/authorization-policy-consent-setting-change
    bindings:
      tenant_id:               ref.tenant_id
      admin_upn:               ref.admin_upn
      src_ip:                  ref.src_ip
      allow_user_consent_new:  "[false]"
      allow_user_consent_old:  "[true]"
    expectation:
      expected: none
      summary: "An administrator re-enables the risk-based step-up consent control -- the opposite, protective change does not match the detection's scoped filter"
