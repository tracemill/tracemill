type: job
name: Azure AD Service Principal Created
detection:
  source: escu
  name: "ESCU - Azure AD Service Principal Created - Rule"
  id: f8ba49e7-ffd3-4b53-8f61-e73974583c5d
description: |
  Validates detection of a user creating a new service principal in a
  Microsoft Entra ID (Azure AD) tenant. An attacker with admin rights
  can register an application and give it a credential that
  authenticates without interactive sign-in or MFA, a durable and
  less-visible foothold. A control confirms specificity: a service
  principal created by an internal Azure system process, with no human
  initiator, does not match.

mitre:
  tactics: [persistence]
  techniques: [T1136.003]

state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  admin_upn: "admin@example.onmicrosoft.com"
  src_ip:    gen.ipv4()

workloads:
  - scenario: scenarios/azure/audit/add-service-principal
    bindings:
      tenant_id: ref.tenant_id
      admin_upn: ref.admin_upn
      src_ip:    ref.src_ip
    expectation:
      expected: alert
      summary: "A user creates a new service principal"
      mitre:
        tactics: [persistence]
        techniques: [T1136.003]

  - scenario: scenarios/azure/audit/add-service-principal-system-initiated
    bindings:
      tenant_id: ref.tenant_id
    expectation:
      expected: none
      summary: "A service principal is created by an internal Azure system process with no human initiator and does not match the detection's admin-initiated-scoped filter"
