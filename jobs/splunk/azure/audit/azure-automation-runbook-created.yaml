type: job
name: Azure Automation Runbook Created
detection:
  source: escu
  name: "ESCU - Azure Automation Runbook Created - Rule"
  id: 178d696d-6dc6-4ee8-9d25-93fee34eaf5b
description: |
  Validates detection of a new Azure Automation Runbook being created
  or updated (persistence, T1136.003): a runbook is a script Azure
  Automation executes on a schedule, on demand, or attached to a
  managed identity, so an adversary with privileged access can use one
  to maintain persistence, escalate privileges, or execute malicious
  code -- up to creating Global Administrators or running code on VMs.
  The detection excludes Azure's own built-in tutorial runbooks
  (AzureAutomationTutorial*) as benign noise. A control confirms
  specificity: creating one of those built-in tutorial runbooks does
  not match the detection's filter.

mitre:
  tactics: [persistence]
  techniques: [T1136.003]

state:
  tenant_id:       "11111111-1111-1111-1111-111111111111"
  subscription_id: "22222222-2222-2222-2222-222222222222"
  caller_upn:      "admin@example.onmicrosoft.com"
  src_ip:          gen.ipv4()

workloads:
  - scenario: scenarios/azure/resource-activity/create-automation-runbook
    bindings:
      tenant_id:       ref.tenant_id
      subscription_id: ref.subscription_id
      caller_upn:      ref.caller_upn
      src_ip:          ref.src_ip
    expectation:
      expected: alert
      summary: "A new Azure Automation Runbook is created"
      mitre:
        tactics: [persistence]
        techniques: [T1136.003]

  - scenario: scenarios/azure/resource-activity/create-automation-runbook
    bindings:
      tenant_id:       ref.tenant_id
      subscription_id: ref.subscription_id
      caller_upn:      ref.caller_upn
      src_ip:          ref.src_ip
      runbook_name:    "AzureAutomationTutorialWithIdentity"
    expectation:
      expected: none
      summary: "One of Azure's own built-in tutorial runbooks is created and does not match the detection's filter, which excludes AzureAutomationTutorial* by name"
