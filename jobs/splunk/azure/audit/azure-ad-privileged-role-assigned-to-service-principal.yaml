type: job
name: Azure AD Privileged Role Assigned to Service Principal
detection:
  source: escu
  name: "ESCU - Azure AD Privileged Role Assigned to Service Principal - Rule"
  id: 5dfaa3d3-e2e4-4053-8252-16d9ee528c41
description: |
  Validates detection of a privileged Azure AD role being assigned to a
  service principal rather than a human user (persistence / privilege
  escalation, T1098.003): a service principal authenticates with a
  credential an attacker can mint or steal without triggering
  interactive sign-in or MFA controls, so a privileged role on one is a
  durable, hard-to-notice backdoor. The SPL's CIM `user` field doesn't
  resolve to anything meaningful for a service-principal target, so
  the workload is credited by the fired alert's result-row fields
  (dest, initiatedBy, displayName, role) instead. A control confirms
  specificity: assigning the same service principal a genuinely
  non-privileged role (Reports Reader) does not match the detection's
  privileged-role filter.

mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1098.003]

state:
  tenant_id:  "11111111-1111-1111-1111-111111111111"
  admin_upn:  "admin@example.onmicrosoft.com"
  sp_display: "App 5"
  src_ip:     gen.ipv4()

workloads:
  - scenario: scenarios/azure/audit/assign-directory-role-to-service-principal
    bindings:
      tenant_id:  ref.tenant_id
      admin_upn:  ref.admin_upn
      sp_display: ref.sp_display
      src_ip:     ref.src_ip
    expectation:
      expected: alert
      summary: "A privileged directory role is assigned to a service principal"
      mitre:
        tactics: [persistence, privilege-escalation]
        techniques: [T1098.003]
      correlation:
        dest:        ref.tenant_id
        initiatedBy: ref.admin_upn
        displayName: ref.sp_display
        role:        "\"Privileged Role Administrator\""

  - scenario: scenarios/azure/audit/assign-directory-role-to-service-principal
    bindings:
      tenant_id:             ref.tenant_id
      admin_upn:             ref.admin_upn
      sp_display:            ref.sp_display
      src_ip:                ref.src_ip
      role_display_name:     "Reports Reader"
      role_template_id:      "4a5d8f65-41da-4de4-8968-e035b65339cf"
      role_well_known_name:  "\"ReportsReader\""
    expectation:
      expected: none
      summary: "The same service principal is assigned a genuinely non-privileged role -- Reports Reader -- and does not match the detection's privileged-role filter"
