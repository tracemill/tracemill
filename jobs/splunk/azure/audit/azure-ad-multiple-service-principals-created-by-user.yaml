type: job
name: Azure AD Multiple Service Principals Created by User
detection:
  source: escu
  name: "ESCU - Azure AD Multiple Service Principals Created by User - Rule"
  id: 32880707-f512-414e-bd7f-204c0c85b758
description: |
  Validates detection of a single Azure AD user creating more than
  three distinct new service principals within a 10-minute window
  (persistence, T1136.003): an adversary who controls a user account
  can rapidly create multiple OAuth applications to stage an attack or
  expand their foothold. The attack workload loops five times,
  drawing a distinct target display name from a pool each iteration
  (above the >3 threshold). The control uses a service principal
  actor instead of a user, avoiding both this detection's
  user-initiated-scoped filter and the sibling "Azure AD Service
  Principal Created" detection, which fires on any user-initiated
  service principal creation regardless of volume and would otherwise
  co-fire on any user-initiated control at all.

mitre:
  tactics: [persistence]
  techniques: [T1136.003]

state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  admin_upn: "admin@example.onmicrosoft.com"

pools:
  - id: rogue-sp-names
    sampling:
      mode: round_robin
    csv:
      data: |
        sp_display
        Malicious1
        Malicious2
        Malicious3
        Malicious4
        Malicious5

workloads:
  - scenario: scenarios/azure/audit/add-service-principal
    loop: 5
    bindings:
      tenant_id:  ref.tenant_id
      admin_upn:  ref.admin_upn
      sp_display: pool.rogue-sp-names.sp_display
    expectation:
      expected: alert
      summary: "A user creates five distinct new service principals within a short window"
      mitre:
        tactics: [persistence]
        techniques: [T1136.003]

  - scenario: scenarios/azure/audit/add-service-principal-by-sp
    loop: 2
    bindings:
      tenant_id:         ref.tenant_id
      actor_app_display: "Routine Sync App"
      sp_display:        "RoutineApp"
    expectation:
      expected: none
      summary: "A service principal, not a user, creates service principals and does not match the detection's user-initiated-scoped filter"
