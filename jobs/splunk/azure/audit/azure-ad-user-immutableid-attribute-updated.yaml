type: job
name: Azure AD User ImmutableId Attribute Updated
detection:
  source: escu
  name: "ESCU - Azure AD User ImmutableId Attribute Updated - Rule"
  id: 0c0badad-4536-4a84-a561-5ff760f3c00e
description: |
  Validates detection of a Microsoft Entra ID (Azure AD) user's
  SourceAnchor (ImmutableId) attribute being modified. That attribute
  is the anchor matching a directory user to its synchronized
  on-premises identity, so repointing it sets up a federation backdoor
  that impersonates the user and bypasses password and MFA
  requirements. A control confirms specificity: the same operation
  changing an unrelated profile attribute does not match.

mitre:
  tactics: [persistence]
  techniques: [T1098]

state:
  tenant_id:  "11111111-1111-1111-1111-111111111111"
  admin_upn:  "admin@example.onmicrosoft.com"
  target_upn: "targetUser@example.onmicrosoft.com"
  src_ip:     gen.ipv4()

workloads:
  - scenario: scenarios/azure/audit/update-user-directory-attribute
    bindings:
      tenant_id:  ref.tenant_id
      admin_upn:  ref.admin_upn
      target_upn: ref.target_upn
      src_ip:     ref.src_ip
    expectation:
      expected: alert
      summary: "A user's SourceAnchor (ImmutableId) attribute is modified"
      mitre:
        tactics: [persistence]
        techniques: [T1098]

  - scenario: scenarios/azure/audit/update-user-directory-attribute
    bindings:
      tenant_id:            ref.tenant_id
      admin_upn:            ref.admin_upn
      target_upn:           ref.target_upn
      src_ip:               ref.src_ip
      attribute_name:       "Department"
      attribute_old_value:  "\"Engineering\""
      attribute_new_value:  "\"Sales\""
    expectation:
      expected: none
      summary: "The same operation changing the user's department instead does not match the detection's SourceAnchor-scoped filter"
