type: job
name: Azure Automation Account Created
detection:
  source: escu
  name: "ESCU - Azure Automation Account Created - Rule"
  id: 860902fd-2e76-46b3-b050-ba548dab576c
description: |
  Validates detection of a new Azure Automation account being created
  or updated within a subscription (persistence, T1136.003): Automation
  accounts can run runbooks with attached managed identities and
  orchestrate actions across Azure and on-premises systems, so a newly
  created one -- especially with elevated privileges -- gives an
  attacker a path to persistence, scheduled malicious code execution,
  and further privilege escalation. A control confirms specificity:
  creating a runbook on an existing automation account -- a related but
  distinct operation in the same resource family -- does not match the
  detection's account-creation-scoped filter.

mitre:
  tactics: [persistence]
  techniques: [T1136.003]

state:
  tenant_id:       "11111111-1111-1111-1111-111111111111"
  subscription_id: "22222222-2222-2222-2222-222222222222"
  caller_upn:      "admin@example.onmicrosoft.com"
  src_ip:          gen.ipv4()

workloads:
  - scenario: scenarios/azure/audit/create-automation-account
    bindings:
      tenant_id:       ref.tenant_id
      subscription_id: ref.subscription_id
      caller_upn:      ref.caller_upn
      src_ip:          ref.src_ip
    expectation:
      expected: alert
      summary: "A new Azure Automation account is created"
      mitre:
        tactics: [persistence]
        techniques: [T1136.003]

  - scenario: scenarios/azure/audit/create-automation-runbook
    bindings:
      tenant_id:       ref.tenant_id
      subscription_id: ref.subscription_id
      caller_upn:      ref.caller_upn
      src_ip:          ref.src_ip
    expectation:
      expected: none
      summary: "A runbook is created on an existing automation account -- a related but distinct operation -- and does not match the detection's account-creation-scoped filter"
