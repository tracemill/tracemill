type: job
name: Azure AD Privileged Authentication Administrator Role Assigned
detection:
  source: escu
  name: "ESCU - Azure AD Privileged Authentication Administrator Role Assigned - Rule"
  id: a7da845d-6fae-41cf-b823-6c0b8c55814a
description: |
  Validates detection of a user being assigned the Privileged
  Authentication Administrator directory role in a Microsoft Entra ID
  (Azure AD) tenant (persistence / privilege escalation, T1098.003):
  holders can set or reset authentication methods for any user,
  including Global Administrators, letting an attacker pivot from this
  role to full tenant compromise. Upstream tags this detection
  T1003.002 (OS Credential Dumping via SAM), which doesn't match its
  actual behavior; used T1098.003 instead, matching the sibling
  Global-Administrator and PIM role-assignment detections. The role
  template id is the real Microsoft-assigned value confirmed against
  Splunk's own privileged_azure_ad_roles lookup (the dataset's own
  TemplateId field is unreliable -- it repeats the same GUID across
  three different role-assignment events in the same log). A control
  confirms specificity: assigning an unrelated, narrower role to the
  same user does not match the detection's Privileged-Authentication-
  Administrator-scoped filter.

mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1098.003]

state:
  tenant_id:  "11111111-1111-1111-1111-111111111111"
  admin_upn:  "admin@example.onmicrosoft.com"
  target_upn: "user@example.onmicrosoft.com"
  src_ip:     gen.ipv4()

workloads:
  - scenario: scenarios/azure/audit/assign-directory-role
    bindings:
      tenant_id:             ref.tenant_id
      admin_upn:             ref.admin_upn
      target_upn:            ref.target_upn
      src_ip:                ref.src_ip
      role_display_name:     "Privileged Authentication Administrator"
      role_template_id:      "7be44c8a-adaf-4e2a-84d6-ab2649e08a13"
      role_well_known_name:  "\"UserAccountAdmins\""
    expectation:
      expected: alert
      summary: "A user is assigned the Privileged Authentication Administrator directory role"
      mitre:
        tactics: [persistence, privilege-escalation]
        techniques: [T1098.003]

  - scenario: scenarios/azure/audit/assign-directory-role
    bindings:
      tenant_id:             ref.tenant_id
      admin_upn:             ref.admin_upn
      target_upn:            ref.target_upn
      src_ip:                ref.src_ip
      role_display_name:     "Groups Administrator"
      role_template_id:      "fdd7a751-b60b-444a-984c-02652fe8fa1c"
      role_well_known_name:  "\"GroupsAdmins\""
    expectation:
      expected: none
      summary: "The same user is assigned an unrelated, narrower role -- Groups Administrator -- and does not match the Privileged-Authentication-Administrator-scoped filter"
