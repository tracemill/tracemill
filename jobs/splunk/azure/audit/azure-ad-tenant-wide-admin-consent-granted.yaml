type: job
name: Azure AD Tenant Wide Admin Consent Granted
detection:
  source: escu
  name: "ESCU - Azure AD Tenant Wide Admin Consent Granted - Rule"
  id: dc02c0ee-6ac0-4c7f-87ba-8ce43a4e4418
description: |
  Validates detection of a Microsoft Entra ID (Azure AD) administrator granting
  tenant-wide consent to an OAuth application. A single directory audit record
  with a "Consent to application" operation, a success result, and a consent
  grant whose ConsentType is AllPrincipals -- applying to every user in the
  directory rather than a single principal -- is sufficient to raise the alert.
mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1098.003]
state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
workloads:
  - scenario: scenarios/azure/audit/tenant-wide-admin-consent
    bindings:
      tenant_id: ref.tenant_id
    expectation:
      expected: alert
      summary: >-
        A "Consent to application" audit record whose ConsentType is
        AllPrincipals raises the tenant-wide admin-consent alert.
      mitre:
        tactics: [persistence, privilege-escalation]
        techniques: [T1098.003]
