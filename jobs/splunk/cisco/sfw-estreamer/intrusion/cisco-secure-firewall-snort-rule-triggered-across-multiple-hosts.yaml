type: job
name: Cisco Secure Firewall Snort Rule Triggered Across Multiple Hosts
detection:
  source: escu
  name: "ESCU - Cisco Secure Firewall - Snort Rule Triggered Across Multiple Hosts - Rule"
  id: a4c76d0a-56b6-44be-814b-939746c4d406
description: |
  Validates detection of one intrusion signature matching flows from many
  distinct source addresses within an hour.

  The firewall's intrusion engine matches the same file-executable
  signature for the download of executable content on HTTP flows from more
  than ten distinct external content-delivery addresses, for example
  146.75.78.172, to one internal workstation. Each event carries the same
  signature, classification and detection-mode inline result.

  A benign control models a second file-executable signature, for example
  the one for Portable Executable file magic, matching the same kind of
  download from nine distinct sources to another workstation within the
  same hour.

mitre:
  tactics: [command-and-control, defense-evasion]
  techniques: [T1105, T1027]

state:
  device_uuid: gen.uuid()
  # The anchor draws from the /24's host range; it is the one alert-row
  # value that differs between runs, since the alert groups by signature
  # rather than by host. The control's range is disjoint so an attack row
  # never lists the control's workstation.
  dest_octet:         gen.int(min=11, max=130)
  dest_ip:            "172.16.3.${ref.dest_octet}"
  control_dest_octet: gen.int(min=131, max=250)
  control_dest_ip:    "172.16.3.${ref.control_dest_octet}"
  control_signature_id:       15306
  control_signature_revision: 22

pools:
  # Content-delivery addresses that served the scenario's Windows Update
  # download; all geolocate as the scenario's initiator does. Round-robin
  # over more rows than the loop count keeps every iteration's source
  # distinct.
  - id: update-cdn-sources
    sampling:
      mode: round_robin
    string_list:
      values:
        - 146.75.78.172
        - 184.25.59.69
        - 23.46.30.37
        - 23.205.89.9
        - 23.51.25.207
        - 23.46.30.23
        - 23.215.11.159
        - 23.54.78.50
        - 23.46.30.27
        - 23.215.11.143
        - 23.48.99.75
        - 23.51.25.80
        - 23.46.30.22
        - 23.35.69.138
        - 217.20.51.20
        - 23.35.69.147
        - 208.89.73.145
        - 23.51.25.94
        - 208.89.73.147
        - 23.215.11.137
        - 23.35.68.210
        - 23.48.99.68
  # Exactly nine addresses, so the control's distinct-source count cannot
  # reach ten however many times the pool wraps.
  - id: control-cdn-sources
    sampling:
      mode: round_robin
    string_list:
      values:
        - 23.46.30.37
        - 146.75.78.172
        - 184.25.59.69
        - 23.205.89.9
        - 23.51.25.207
        - 23.46.30.23
        - 23.215.11.159
        - 23.54.78.50
        - 23.46.30.27

workloads:
  - scenario: scenarios/cisco/sfw-estreamer/intrusion/executable-download-signature-match
    loop: 12
    bindings:
      device_uuid:  ref.device_uuid
      responder_ip: ref.dest_ip
      initiator_ip: pool.update-cdn-sources
    expectation:
      expected: alert
      summary: "One intrusion signature matched on flows from more than ten distinct sources within an hour"
      mitre:
        tactics: [command-and-control, defense-evasion]
        techniques: [T1105, T1027]
      correlation:
        # The alert row lists every destination its signature matched in the
        # hour; the add-on aliases dest from the responder address.
        dest: ref.dest_ip

  - scenario: scenarios/cisco/sfw-estreamer/intrusion/executable-download-signature-match
    loop: 9
    bindings:
      device_uuid:          ref.device_uuid
      responder_ip:         ref.control_dest_ip
      initiator_ip:         pool.control-cdn-sources
      signature_id:         ref.control_signature_id
      signature_revision:   ref.control_signature_revision
      rule_message:         "FILE-EXECUTABLE Portable Executable binary file magic detected"
      http_uri:             "/d/msdownload/update/software/defu/2025/04/am_delta_patch_1.427.204.0_f561be89cdb4dc64fd4e222d5335c3955a9074f8.exe"
      firewall_policy_uuid: "00000000-0000-0000-0000-000067f8c9aa"
    expectation:
      expected: none
      summary: "Benign control: one intrusion signature matched on flows from nine distinct sources, below the alert threshold"
      correlation:
        dest: ref.control_dest_ip
