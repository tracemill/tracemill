type: job
name: Windows InstallUtil Credential Theft
detection:
  source: escu
  name: "ESCU - Windows InstallUtil Credential Theft - Rule"
  id: ccfeddec-43ec-11ec-b494-acde48001122
description: |
  Validates detection of InstallUtil.exe loading the Windows SAM and
  Credential Vault client libraries: Sysmon EID 7 (Image Load) records one
  64-bit InstallUtil.exe process loading samlib.dll, the SAM Library DLL, and
  then vaultcli.dll, the Credential Vault Client Library, both signed by
  Microsoft and loaded from System32.

mitre:
  tactics: [defense-evasion]
  techniques: [T1218.004]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/image-load/installutil-credential-library-load
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
    expectation:
      expected: alert
      summary: "InstallUtil.exe loads samlib.dll and vaultcli.dll"
      mitre:
        tactics: [defense-evasion]
        techniques: [T1218.004]
