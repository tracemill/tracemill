type: job
name: Spoolsv Suspicious Loaded Modules
detection:
  source: escu
  name: "ESCU - Spoolsv Suspicious Loaded Modules - Rule"
  id: a5e451f8-da81-11eb-b245-acde48001122
description: |
  Validates detection of the print spooler loading several DLLs from the
  printer driver directory: Sysmon EID 7 (Image Load) records one spoolsv.exe
  process loading three different DLLs from
  C:\Windows\System32\spool\drivers\x64\3, a copy of kernelbase.dll, the
  Unidrv printer driver UNIDRV.DLL and an unsigned DLL, for example evil.dll,
  as a PrintNightmare (CVE-2021-34527) exploit makes it do. The events are
  evidence of the loads, not of what the unsigned DLL then ran.
tags: [cve-2021-34527]

mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1547.012]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  payload_dll:        evil.dll

workloads:
  - scenario: scenarios/windows/sysmon/image-load/spoolsv-driver-dll-load
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      payload_dll:  ref.payload_dll
    expectation:
      expected: alert
      summary: "spoolsv.exe loads kernelbase.dll, UNIDRV.DLL and evil.dll from the x64 printer driver directory"
      mitre:
        tactics: [persistence, privilege-escalation]
        techniques: [T1547.012]
