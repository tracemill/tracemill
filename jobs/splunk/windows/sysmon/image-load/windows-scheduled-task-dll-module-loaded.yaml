type: job
name: Windows Scheduled Task DLL Module Loaded
detection:
  source: escu
  name: "ESCU - Windows Scheduled Task DLL Module Loaded - Rule"
  id: bc5b2304-f241-419b-874a-e927f667b7b6
description: |
  Validates detection of a process running from a temp or other writable
  directory loading the Task Scheduler COM library: Sysmon EID 7 (Image Load)
  records a process, for example C:\Temp\valleyrat.exe, loading
  C:\Windows\System32\taskschd.dll, the Microsoft-signed Task Scheduler COM
  API.

tags: [valleyrat]
mitre:
  tactics: [execution, persistence, privilege-escalation]
  techniques: [T1053]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/image-load/taskschd-dll-load
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
    expectation:
      expected: alert
      summary: "A process in C:\\Temp loads the Task Scheduler COM library taskschd.dll"
      mitre:
        tactics: [execution, persistence, privilege-escalation]
        techniques: [T1053]
