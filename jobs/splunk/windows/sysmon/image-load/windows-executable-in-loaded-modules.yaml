type: job
name: Windows Executable in Loaded Modules
detection:
  source: escu
  name: "ESCU - Windows Executable in Loaded Modules - Rule"
  id: 3e27af56-fcf0-4113-988d-24969b062be7
description: |
  Validates detection of an unsigned executable mapped into a process as a
  module: Sysmon EID 7 (Image Load) records a process, for example the njRAT
  client server.exe in the user's AppData\Local\Temp folder, loading its own
  unsigned .exe image, which has no version, product or company information.
tags: [njrat]

mitre:
  tactics: [execution]
  techniques: [T1129]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/image-load/njrat-server-exe-image-load
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
    expectation:
      expected: alert
      summary: "The njRAT client server.exe is recorded loading its own unsigned executable image"
      mitre:
        tactics: [execution]
        techniques: [T1129]

  - scenario: scenarios/windows/sysmon/image-load/signed-system-exe-image-load
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
    expectation:
      expected: none
      summary: "A signed Windows executable, dwm.exe, recorded loading its own image does not match the unsigned-image filter"
