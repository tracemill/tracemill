type: job
name: Windows Known Abused DLL Loaded Suspiciously
detection:
  source: escu
  name: "ESCU - Windows Known Abused DLL Loaded Suspiciously - Rule"
  id: dd6d1f16-adc0-4e87-9c34-06189516b803
description: |
  Validates detection of a library commonly abused for DLL side-loading or
  search-order hijacking loaded from outside the Windows system and Program
  Files directories: Sysmon EID 7 (Image Load) records a process, for example
  a copied calc.exe at the root of drive D:, loading an unsigned
  WindowsCodecs.dll from that same directory. A benign control models the
  Windows Calculator, win32calc.exe, loading the signed WindowsCodecs.dll from
  C:\Windows\System32.

tags: [qakbot]
mitre:
  tactics: [persistence, privilege-escalation, defense-evasion]
  techniques: [T1574.001]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  control_record_id:  gen.int(min=100000, max=199999)

workloads:
  - scenario: scenarios/windows/sysmon/image-load/calc-windowscodecs-side-load
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
    expectation:
      expected: alert
      summary: "A copied calc.exe loads an unsigned WindowsCodecs.dll from its own directory outside the Windows system directories"
      mitre:
        tactics: [persistence, privilege-escalation, defense-evasion]
        techniques: [T1574.001]

  - scenario: scenarios/windows/sysmon/image-load/win32calc-windowscodecs-load
    bindings:
      domain_short:    ref.domain_short
      domain_tld:      ref.domain_tld
      computer:        ref.computer
      event_record_id: ref.control_record_id
    expectation:
      expected: none
      summary: "The Windows Calculator loads the signed WindowsCodecs.dll from C:\\Windows\\System32"
