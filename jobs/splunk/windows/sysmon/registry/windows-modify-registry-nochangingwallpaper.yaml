type: job
name: Windows Modify Registry NoChangingWallPaper
detection:
  source: escu
  name: "ESCU - Windows Modify Registry NoChangingWallPaper - Rule"
  id: a2276412-e254-4e9a-9082-4d92edb6a3e0
description: |
  Validates detection of the wallpaper-change restriction policy being set
  through the registry: reg.exe writes NoChangingWallPaper as the string
  value 1 under a user's HKU\<SID> Policies\ActiveDesktop key. Group Policy
  defines this per-user value, which prevents the user from changing the
  desktop background, as a DWORD.

mitre:
  tactics: [defense-evasion]
  techniques: [T1112]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  user:               Administrator
  user_sid:           "S-1-5-21-111222333-444555666-777888999-500"

workloads:
  - scenario: scenarios/windows/sysmon/registry/wallpaper-change-policy-set
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      user:         ref.user
      user_sid:     ref.user_sid
    expectation:
      expected: alert
      summary: "reg.exe sets NoChangingWallPaper to 1 under the user's Policies\\ActiveDesktop key"
      mitre:
        tactics: [defense-evasion]
        techniques: [T1112]
