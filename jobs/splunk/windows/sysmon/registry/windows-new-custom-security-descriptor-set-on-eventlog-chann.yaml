type: job
name: Windows New Custom Security Descriptor Set On EventLog Channel
detection:
  source: escu
  name: "ESCU - Windows New Custom Security Descriptor Set On EventLog Channel - Rule"
  id: c0e5dd5a-2117-41d5-a04c-82a762a86a38
description: |
  Validates detection of an event log having its access control replaced.
  Sysmon EID 13 (RegistryEvent value set) records a CustomSD value written
  under the event log Setup key carrying a descriptor that denies read
  access to Everyone, leaving the log collecting but unreadable. A second
  value created under the same key, with no descriptor, is expected to stay
  quiet.

mitre:
  tactics: [defense-evasion, defense-impairment]
  techniques: [T1685.001]

state:
  domain_short:         CORP
  domain_tld:           local
  domain_short_lower:   fn.lower(ref.domain_short)
  domain_fqdn:          "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:             gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  customsd_guid_raw:    fn.upper(gen.uuid())
  customsd_process_guid: "{${ref.customsd_guid_raw}}"
  customsd_record_id:   gen.int(min=250300, max=250399)
  control_record_id:    gen.int(min=250400, max=250499)

workloads:
  - scenario: scenarios/windows/sysmon/registry/eventlog-setup-customsd-set
    bindings:
      computer:         ref.computer
      event_record_id:  ref.customsd_record_id
      process_guid_raw: ref.customsd_guid_raw
    expectation:
      expected: alert
      summary: "A CustomSD descriptor denying Everyone is written on the event log Setup key"
      mitre:
        tactics: [defense-evasion, defense-impairment]
        techniques: [T1685.001]
      correlation:
        process_guid: ref.customsd_process_guid
        dest:         ref.computer

  - scenario: scenarios/windows/sysmon/registry/eventlog-setup-placeholder-value-added
    bindings:
      computer:        ref.computer
      event_record_id: ref.control_record_id
    expectation:
      expected: none
      summary: "An empty placeholder value is created under the same Setup key"
