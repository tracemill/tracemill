type: job
name: Windows LSA Secrets NoLMhash Registry
detection:
  source: escu
  name: "ESCU - Windows LSA Secrets NoLMhash Registry - Rule"
  id: 48cc1605-538c-4223-8382-e36bee5b540d
description: |
  Validates detection of LAN Manager hash storage being enabled through the
  registry: reg.exe sets the NoLMHash DWORD under
  HKLM\System\CurrentControlSet\Control\Lsa to 0, so that each password of
  14 characters or fewer changed afterward is also stored as a weak, quickly
  cracked LM hash.

mitre:
  tactics: [credential-access]
  techniques: [T1003.004]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  user:               gen.username()

workloads:
  - scenario: scenarios/windows/sysmon/registry/lm-hash-storage-enable
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      user:         ref.user
    expectation:
      expected: alert
      summary: "reg.exe sets the Lsa NoLMHash registry value to 0"
      mitre:
        tactics: [credential-access]
        techniques: [T1003.004]
