type: job
name: Windows Impair Defense Set Win Defender Smart Screen Level To Warn
detection:
  source: escu
  name: "ESCU - Windows Impair Defense Set Win Defender Smart Screen Level To Warn - Rule"
  id: cc2a3425-2703-47e7-818f-3dca1b0bc56f
description: |
  Validates detection of the Windows SmartScreen policy level being set to
  Warn: reg.exe sets the ShellSmartScreenLevel policy value to Warn, so
  where the SmartScreen policy is enabled, users can dismiss the warning and
  run downloads that are unrecognized or reported as malicious.

mitre:
  tactics: [defense-impairment]
  techniques: [T1685]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/registry/smartscreen-level-warn
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
    expectation:
      expected: alert
      summary: "reg.exe sets the ShellSmartScreenLevel policy value to Warn"
      mitre:
        tactics: [defense-impairment]
        techniques: [T1685]
