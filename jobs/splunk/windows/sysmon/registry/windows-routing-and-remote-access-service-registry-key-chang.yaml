type: job
name: Windows Routing and Remote Access Service Registry Key Change
detection:
  source: escu
  name: "ESCU - Windows Routing and Remote Access Service Registry Key Change - Rule"
  id: a93df51e-e612-40b7-a105-33e288160575
description: |
  Validates detection of a change under the Routing and Remote Access
  router manager configuration. Sysmon EID 13 (RegistryEvent value set)
  records reg.exe writing a value under the RemoteAccess RouterManagers Ip
  key naming a DLL in a user's Downloads folder. The service reads its
  router manager configuration from this key, so a path written there is
  consumed by a service process rather than by the user who wrote it.

mitre:
  tactics: [defense-evasion]
  techniques: [T1112]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  rras_guid_raw:      fn.upper(gen.uuid())
  rras_process_guid:  "{${ref.rras_guid_raw}}"
  rras_record_id:     gen.int(min=135100, max=135199)

workloads:
  - scenario: scenarios/windows/sysmon/registry/rras-router-manager-dll-set
    bindings:
      computer:         ref.computer
      event_record_id:  ref.rras_record_id
      process_guid_raw: ref.rras_guid_raw
    expectation:
      expected: alert
      summary: "A DLL path is written under the RemoteAccess router manager key"
      mitre:
        tactics: [defense-evasion]
        techniques: [T1112]
      correlation:
        process_guid: ref.rras_process_guid
        dest:         ref.computer
