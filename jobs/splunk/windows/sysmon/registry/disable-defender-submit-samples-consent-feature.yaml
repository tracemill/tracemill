type: job
name: Disable Defender Submit Samples Consent Feature
detection:
  source: escu
  name: "ESCU - Disable Defender Submit Samples Consent Feature - Rule"
  id: 73922ff8-3022-11ec-bf5e-acde48001122
description: |
  Validates detection of reg.exe setting the Microsoft Defender SpyNet
  SubmitSamplesConsent policy value to 0: Defender stops uploading suspicious
  files for analysis, so a sample it cannot classify locally never reaches
  the cloud for a verdict.
tags: [icedid]

mitre:
  tactics: [defense-impairment]
  techniques: [T1685]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/registry/defender-policy-set
    bindings:
      computer:      ref.computer
      policy_subkey: "\\SpyNet"
      value_name:    SubmitSamplesConsent
      details:       "DWORD (0x00000000)"
    expectation:
      expected: alert
      summary: "SubmitSamplesConsent is set to 0"
      mitre:
        tactics: [defense-impairment]
        techniques: [T1685]
