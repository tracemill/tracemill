type: job
name: Disable Defender Enhanced Notification
detection:
  source: escu
  name: "ESCU - Disable Defender Enhanced Notification - Rule"
  id: dc65678c-301f-11ec-8e30-acde48001122
description: |
  Validates detection of reg.exe setting the Microsoft Defender Reporting
  DisableEnhancedNotifications policy value to 1: Defender stops raising the
  enhanced notifications that tell a user protection was turned off or a
  threat was found.
tags: [icedid]

mitre:
  tactics: [defense-impairment]
  techniques: [T1685]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/registry/defender-policy-set
    bindings:
      computer:      ref.computer
      policy_subkey: "\\Reporting"
      value_name:    DisableEnhancedNotifications
    expectation:
      expected: alert
      summary: "DisableEnhancedNotifications is set to 1"
      mitre:
        tactics: [defense-impairment]
        techniques: [T1685]
