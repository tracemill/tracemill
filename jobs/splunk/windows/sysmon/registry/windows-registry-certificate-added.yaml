type: job
name: Windows Registry Certificate Added
detection:
  source: escu
  name: "ESCU - Windows Registry Certificate Added - Rule"
  id: 5ee98b2f-8b9e-457a-8bdc-dd41aaba9e87
description: |
  Validates detection of a certificate being added to the machine root
  store. Sysmon EID 13 (RegistryEvent value set) records certutil.exe
  writing the Blob value for a new certificate under the SystemCertificates
  ROOT store. Anything held there is trusted host-wide, so code and
  connections signed with that certificate look legitimate to Windows and
  to the tools that defer to it.

mitre:
  tactics: [defense-evasion]
  techniques: [T1553.004]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  cert_record_id:     gen.int(min=716100, max=716199)

workloads:
  - scenario: scenarios/windows/sysmon/registry/root-certificate-blob-added
    bindings:
      computer:        ref.computer
      event_record_id: ref.cert_record_id
    expectation:
      expected: alert
      summary: "A certificate Blob is written into the machine root store"
      mitre:
        tactics: [defense-evasion]
        techniques: [T1553.004]
