type: job
name: Windows Service Creation Using Registry Entry
detection:
  source: escu
  name: "ESCU - Windows Service Creation Using Registry Entry - Rule"
  id: 25212358-948e-11ec-ad47-acde48001122
description: |
  Validates detection of a service entry being written straight into the
  registry. Sysmon EID 13 (RegistryEvent value set) records reg.exe setting
  the ImagePath value of a service under CurrentControlSet to cmd.exe, in
  place of the binary the service was installed with. The Service Control
  Manager runs whatever ImagePath names, as SYSTEM, without anything new
  being installed.

mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1574.011]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  imagepath_record_id: gen.int(min=16100, max=16199)

workloads:
  - scenario: scenarios/windows/sysmon/registry/service-imagepath-repointed
    bindings:
      computer:        ref.computer
      event_record_id: ref.imagepath_record_id
    expectation:
      expected: alert
      summary: "A service ImagePath value is rewritten to name a command shell"
      mitre:
        tactics: [persistence, privilege-escalation]
        techniques: [T1574.011]
