type: job
name: Windows Modify Registry Utilize ProgIDs
detection:
  source: escu
  name: "ESCU - Windows Modify Registry Utilize ProgIDs - Rule"
  id: 64fa82dd-fd11-472a-9e94-c221fffa591d
description: |
  Validates detection of a ProgID redirection used to get a payload run
  with elevation. Two Sysmon EID 13 (RegistryEvent value set) events from
  one registry editor plant a shell open command under a new file class and
  then point the ms-settings class CurVer value at it, so an auto-elevating
  settings handler runs the payload in place of the real handler.

mitre:
  tactics: [defense-evasion]
  techniques: [T1112]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  progid_record_id:   gen.int(min=1260100, max=1260199)

workloads:
  - scenario: scenarios/windows/sysmon/registry/ms-settings-progid-hijack
    bindings:
      computer:        ref.computer
      event_record_id: ref.progid_record_id
    expectation:
      expected: alert
      summary: "The ms-settings CurVer default value is pointed at a planted file class"
      mitre:
        tactics: [defense-evasion]
        techniques: [T1112]
