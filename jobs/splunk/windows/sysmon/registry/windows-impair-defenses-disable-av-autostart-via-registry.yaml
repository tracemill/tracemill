type: job
name: Windows Impair Defenses Disable AV AutoStart via Registry
detection:
  source: escu
  name: "ESCU - Windows Impair Defenses Disable AV AutoStart via Registry - Rule"
  id: 31a13f43-812e-4752-a6ca-c6c87bf03e83
description: |
  Validates detection of an antivirus product's automatic start being turned
  off through the registry: regedit.exe sets the autostart DWORD under the
  Kingsoft Antivirus or Tencent PC Manager HKLM configuration key to 0, so
  from the next boot the product no longer launches on its own.
tags: [valleyrat]

mitre:
  tactics: [defense-evasion]
  techniques: [T1112]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/registry/av-autostart-disable
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      registry_key: "HKLM\\SOFTWARE\\WOW6432Node\\kingsoft\\antivirus\\KAVReport"
      value_name:   AutoStart
      details:      "DWORD (0x00000000)"
    expectation:
      expected: alert
      summary: "regedit.exe sets the Kingsoft Antivirus KAVReport AutoStart value to 0"
      mitre:
        tactics: [defense-evasion]
        techniques: [T1112]

  - scenario: scenarios/windows/sysmon/registry/av-autostart-disable
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      registry_key: "HKLM\\SOFTWARE\\WOW6432Node\\Tencent\\QQPCMgr"
      value_name:   autostart
      details:      "DWORD (0x00000000)"
    expectation:
      expected: alert
      summary: "regedit.exe sets the Tencent PC Manager QQPCMgr autostart value to 0"
      mitre:
        tactics: [defense-evasion]
        techniques: [T1112]
