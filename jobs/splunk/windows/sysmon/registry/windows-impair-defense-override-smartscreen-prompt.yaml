type: job
name: Windows Impair Defense Override SmartScreen Prompt
detection:
  source: escu
  name: "ESCU - Windows Impair Defense Override SmartScreen Prompt - Rule"
  id: 08058866-7987-486f-b042-275715ef6e9d
description: |
  Validates detection of the Microsoft Edge SmartScreen prompt override
  being allowed through policy: reg.exe sets the
  PreventSmartScreenPromptOverride DWORD under
  HKLM\SOFTWARE\Policies\Microsoft\Edge to 0, so on a domain-joined or
  device-managed host Microsoft Edge lets users click past Microsoft
  Defender SmartScreen warnings about potentially malicious websites.

mitre:
  tactics: [defense-impairment]
  techniques: [T1685]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  user:               gen.username()

workloads:
  - scenario: scenarios/windows/sysmon/registry/edge-smartscreen-prompt-override
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      user:         ref.user
    expectation:
      expected: alert
      summary: "reg.exe sets the Edge PreventSmartScreenPromptOverride policy DWORD to 0"
      mitre:
        tactics: [defense-impairment]
        techniques: [T1685]
