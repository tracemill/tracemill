type: job
name: Windows Deleted Registry By A Non Critical Process File Path
detection:
  source: escu
  name: "ESCU - Windows Deleted Registry By A Non Critical Process File Path - Rule"
  id: 15e70689-f55b-489e-8a80-6d0cd6d8aad2
description: |
  Validates detection of registry keys deleted by a program running outside
  the system directories. Sysmon EID 1 (Process Create) records a binary
  started from C:\Temp, and EID 12 (RegistryEvent object delete) records that
  same process removing the per-user Run key, which is how destructive tooling
  strips autostart entries.

mitre:
  tactics: [defense-evasion]
  techniques: [T1112]

state:
  domain_short:         CORP
  domain_tld:           local
  domain_short_lower:   fn.lower(ref.domain_short)
  domain_fqdn:          "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:             gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  wiper_guid_raw:       fn.upper(gen.uuid())
  wiper_process_guid:   "{${ref.wiper_guid_raw}}"
  wiper_process_rec:    gen.int(min=90000, max=90499)
  wiper_delete_rec:     gen.int(min=91000, max=91499)
  agent_process_rec:    gen.int(min=90500, max=90999)
  agent_delete_rec:     gen.int(min=91500, max=91999)

workloads:
  - scenario: scenarios/windows/sysmon/registry/temp-binary-deletes-run-key
    bindings:
      computer:          ref.computer
      process_guid_raw:  ref.wiper_guid_raw
      process_record_id: ref.wiper_process_rec
      delete_record_id:  ref.wiper_delete_rec
    expectation:
      expected: alert
      summary: "A binary run from C:\\Temp deletes the per-user Run key"
      mitre:
        tactics: [defense-evasion]
        techniques: [T1112]
      correlation:
        process_guid: ref.wiper_process_guid
        dest:         ref.computer

  - scenario: scenarios/windows/sysmon/registry/monitor-service-reloads-own-config
    bindings:
      computer:          ref.computer
      process_record_id: ref.agent_process_rec
      delete_record_id:  ref.agent_delete_rec
    expectation:
      expected: none
      summary: "A monitoring agent in Program Files clears its own driver parameters"
