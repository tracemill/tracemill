type: job
name: Disable Defender MpEngine Registry
detection:
  source: escu
  name: "ESCU - Disable Defender MpEngine Registry - Rule"
  id: cc391750-3024-11ec-955a-acde48001122
description: |
  Validates detection of reg.exe setting the Microsoft Defender MpEngine
  MpEnablePus policy value to 0: Defender stops submitting potentially
  unwanted samples for cloud-delivered analysis, so a newly seen file no
  longer earns a cloud verdict.
tags: [icedid]

mitre:
  tactics: [defense-impairment]
  techniques: [T1685]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/registry/defender-policy-set
    bindings:
      computer:      ref.computer
      policy_subkey: "\\MpEngine"
      value_name:    MpEnablePus
      details:       "DWORD (0x00000000)"
    expectation:
      expected: alert
      summary: "MpEnablePus is set to 0"
      mitre:
        tactics: [defense-impairment]
        techniques: [T1685]
