type: job
name: Windows Modify Registry With MD5 Reg Key Name
detection:
  source: escu
  name: "ESCU - Windows Modify Registry With MD5 Reg Key Name - Rule"
  id: 4662c6b1-0754-455e-b9ff-3ee730af3ba8
description: |
  Validates detection of njRAT storing binary data in the registry (T1112):
  a binary value with a 32-character hexadecimal name written directly under
  a hexadecimal-named key in the user's HKU\<SID>\SOFTWARE hive.
tags: [njrat]

mitre:
  tactics: [defense-evasion]
  techniques: [T1112]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  user_sid:           "S-1-5-21-3946589728-3102711660-3528854901-500"
  njrat_value:        "HKU\\${ref.user_sid}\\SOFTWARE\\c4d89260ab33f649750816ed8ac2eedd\\2681e81bb4c4b3e6338ce2a456fb93a7"
  userassist_value:   "HKU\\${ref.user_sid}\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Explorer\\UserAssist\\{CEBFF5CD-ACE2-4F4F-9178-9926F41749EA}\\Count\\HRZR_PGYFRFFVBA"

workloads:
  - scenario: scenarios/windows/sysmon/registry/njrat-md5-key-binary-value
    bindings:
      domain_short:  ref.domain_short
      domain_tld:    ref.domain_tld
      computer:      ref.computer
      user_sid:      ref.user_sid
      target_object: ref.njrat_value
    expectation:
      expected: alert
      summary: "The njRAT client writes a binary value with an MD5-style name under an MD5-style key in the user's SOFTWARE hive"
      mitre:
        tactics: [defense-evasion]
        techniques: [T1112]
      correlation:
        dest:          ref.computer
        registry_path: ref.njrat_value

  - scenario: scenarios/windows/sysmon/registry/explorer-userassist-count-update
    bindings:
      domain_short:  ref.domain_short
      domain_tld:    ref.domain_tld
      computer:      ref.computer
      user_sid:      ref.user_sid
      target_object: ref.userassist_value
    expectation:
      expected: none
      summary: "Explorer updates a binary UserAssist value for the signed-in user"
      correlation:
        dest:          ref.computer
        registry_path: ref.userassist_value
