type: job
name: Detect Remote Access Software Usage Registry
detection:
  source: escu
  name: "ESCU - Detect Remote Access Software Usage Registry - Rule"
  id: 33804986-25dd-43cf-bb6b-dc14956c7cbc
description: |
  Validates detection of remote-support tooling registered to start with the
  host. Sysmon EID 13 (RegistryEvent value set) records services.exe writing a
  new service ImagePath that points at a remote-access agent, which lets
  whoever holds the matching console open an interactive session on the host.

mitre:
  tactics: [command-and-control]
  techniques: [T1219]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  agent_guid_raw:     fn.upper(gen.uuid())
  agent_process_guid: "{${ref.agent_guid_raw}}"
  agent_record_id:    gen.int(min=525000, max=525499)
  control_record_id:  gen.int(min=525500, max=525999)

workloads:
  - scenario: scenarios/windows/sysmon/registry/remote-access-service-imagepath-set
    bindings:
      computer:         ref.computer
      event_record_id:  ref.agent_record_id
      process_guid_raw: ref.agent_guid_raw
    expectation:
      expected: alert
      summary: "A new service ImagePath points at a remote-support agent"
      mitre:
        tactics: [command-and-control]
        techniques: [T1219]
      correlation:
        process_guid: ref.agent_process_guid
        dest:         ref.computer

  - scenario: scenarios/windows/sysmon/registry/w32time-config-set
    bindings:
      computer:        ref.computer
      event_record_id: ref.control_record_id
    expectation:
      expected: none
      summary: "The Windows time service records its own clock-confidence value"
