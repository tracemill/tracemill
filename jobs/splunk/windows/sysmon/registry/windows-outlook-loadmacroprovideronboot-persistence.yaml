type: job
name: Windows Outlook LoadMacroProviderOnBoot Persistence
detection:
  source: escu
  name: "ESCU - Windows Outlook LoadMacroProviderOnBoot Persistence - Rule"
  id: 93c91139-01f8-4905-802b-0d106f026b13
description: |
  Validates detection of an Outlook VBA project being set to load at startup
  (T1112, T1137): a process sets the LoadMacroProviderOnBoot DWORD under a
  user's HKU\<SID>\SOFTWARE\Microsoft\Office\16.0\Outlook key to 1, so
  Outlook loads that user's VBA project when it starts, as the NotDoor
  backdoor loader does when it installs its Outlook macro.
tags: [notdoor]

mitre:
  tactics: [defense-evasion, persistence]
  techniques: [T1112, T1137]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  username:           gen.username()
  user:               "${ref.domain_short}\\${ref.username}"
  user_rid:           gen.int(min=1001, max=1999)
  image:              "c:\\ProgramData\\Onedrive.exe"

workloads:
  - scenario: scenarios/windows/sysmon/registry/outlook-macro-load-on-boot-set
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      username:     ref.username
      user:         ref.user
      user_rid:     ref.user_rid
      image:        ref.image
    expectation:
      expected: alert
      summary: "c:\\ProgramData\\Onedrive.exe sets the Outlook LoadMacroProviderOnBoot registry value to 1"
      mitre:
        tactics: [defense-evasion, persistence]
        techniques: [T1112, T1137]
