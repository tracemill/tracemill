type: job
name: Windows Modify Show Compress Color And Info Tip Registry
detection:
  source: escu
  name: "ESCU - Windows Modify Show Compress Color And Info Tip Registry - Rule"
  id: b7548c2e-9a10-11ec-99e3-acde48001122
description: |
  Validates detection of Explorer view settings being tampered with through
  the registry (T1112): reg.exe sets ShowCompColor and ShowInfoTip to 0 under
  the current user's Explorer\Advanced key, turning off color display of
  compressed and encrypted files and the pop-up descriptions for files and
  folders, as HermeticWiper does.

mitre:
  tactics: [defense-evasion]
  techniques: [T1112]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/registry/explorer-advanced-view-tamper
    bindings:
      computer:   ref.computer
      value_name: ShowCompColor
    expectation:
      expected: alert
      summary: "reg.exe sets ShowCompColor to 0 under the user's Explorer\\Advanced key"
      mitre:
        tactics: [defense-evasion]
        techniques: [T1112]

  - scenario: scenarios/windows/sysmon/registry/explorer-advanced-view-tamper
    bindings:
      computer:   ref.computer
      value_name: ShowInfoTip
    expectation:
      expected: alert
      summary: "reg.exe sets ShowInfoTip to 0 under the user's Explorer\\Advanced key"
      mitre:
        tactics: [defense-evasion]
        techniques: [T1112]
