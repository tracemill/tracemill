type: job
name: Windows Modify Registry Disable Restricted Admin
detection:
  source: escu
  name: "ESCU - Windows Modify Registry Disable Restricted Admin - Rule"
  id: cee573a0-7587-48e6-ae99-10e8c657e89a
description: |
  Validates detection of Restricted Admin mode for Remote Desktop being
  enabled through the registry (T1112): reg.exe sets the
  DisableRestrictedAdmin DWORD under
  HKLM\System\CurrentControlSet\Control\Lsa to 0, which turns the mode on,
  so that if the host accepts Remote Desktop connections, a local
  administrator account can open a Remote Desktop session to it with only
  the account's NTLM hash.

mitre:
  tactics: [defense-evasion]
  techniques: [T1112]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  user:               gen.username()

workloads:
  - scenario: scenarios/windows/sysmon/registry/restricted-admin-rdp-enable
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      user:         ref.user
    expectation:
      expected: alert
      summary: "reg.exe sets the Lsa DisableRestrictedAdmin registry value to 0"
      mitre:
        tactics: [defense-evasion]
        techniques: [T1112]
