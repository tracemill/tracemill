type: job
name: Windows Registry Dotnet ETW Disabled Via ENV Variable
detection:
  source: escu
  name: "ESCU - Windows Registry Dotnet ETW Disabled Via ENV Variable - Rule"
  id: 55502381-5cce-491b-9277-7cb1d10bc0df
description: |
  Validates detection of .NET runtime Event Tracing for Windows being
  disabled through an environment variable: a process sets the
  COMPlus_ETWEnabled string value to 0 under the Environment registry key,
  for a single user under HKU\<SID>\Environment or machine-wide under
  HKLM\System\CurrentControlSet\Control\Session Manager\Environment, so .NET
  processes started afterwards that inherit that environment emit no .NET
  runtime ETW events.

mitre:
  tactics: [defense-impairment]
  techniques: [T1685]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  user:               gen.username()
  user_rid:           gen.int(min=1001, max=1999)
  user_sid:           "S-1-5-21-111222333-444555666-777888999-${ref.user_rid}"

workloads:
  - scenario: scenarios/windows/sysmon/registry/dotnet-etw-env-var-disable
    bindings:
      domain_short:    ref.domain_short
      domain_tld:      ref.domain_tld
      computer:        ref.computer
      user:            ref.user
      environment_key: "HKU\\${ref.user_sid}\\Environment"
    expectation:
      expected: alert
      summary: "reg.exe sets COMPlus_ETWEnabled to 0 under the user's Environment key"
      mitre:
        tactics: [defense-impairment]
        techniques: [T1685]

  - scenario: scenarios/windows/sysmon/registry/dotnet-etw-env-var-disable
    bindings:
      domain_short:    ref.domain_short
      domain_tld:      ref.domain_tld
      computer:        ref.computer
      user:            ref.user
      environment_key: "HKLM\\System\\CurrentControlSet\\Control\\Session Manager\\Environment"
    expectation:
      expected: alert
      summary: "reg.exe sets COMPlus_ETWEnabled to 0 under the machine-wide Session Manager Environment key"
      mitre:
        tactics: [defense-impairment]
        techniques: [T1685]
