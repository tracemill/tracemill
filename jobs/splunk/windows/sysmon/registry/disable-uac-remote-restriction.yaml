type: job
name: Disable UAC Remote Restriction
detection:
  source: escu
  name: "ESCU - Disable UAC Remote Restriction - Rule"
  id: 9928b732-210e-11ec-b65e-acde48001122
description: |
  Validates detection of UAC remote restrictions being disabled: setting
  LocalAccountTokenFilterPolicy to 1 under
  HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System stops
  Windows from filtering the tokens of local administrator accounts that
  sign in over the network, so remote connections with a local admin
  credential run with full administrator rights.

mitre:
  tactics: [privilege-escalation, defense-evasion]
  techniques: [T1548.002]

state:
  domain_short: CORP
  domain_tld:   local

workloads:
  - scenario: scenarios/windows/sysmon/registry/remote-uac-restriction-disable
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
    expectation:
      expected: alert
      summary: "reg.exe sets LocalAccountTokenFilterPolicy to 1, disabling UAC remote restrictions"
      mitre:
        tactics: [privilege-escalation, defense-evasion]
        techniques: [T1548.002]
