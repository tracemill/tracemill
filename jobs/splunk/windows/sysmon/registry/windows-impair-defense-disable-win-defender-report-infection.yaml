type: job
name: Windows Impair Defense Disable Win Defender Report Infection
detection:
  source: escu
  name: "ESCU - Windows Impair Defense Disable Win Defender Report Infection - Rule"
  id: 201946c6-b1d5-42bb-a7e0-5f7123f47fc4
description: |
  Validates detection of reg.exe setting the Malicious Software Removal Tool
  DontReportInfectionInformation policy value to 1 (T1685): the tool still
  removes the malware it finds but no longer sends Microsoft its report of
  the infections it detected.

mitre:
  tactics: [defense-impairment]
  techniques: [T1685]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  user:               gen.username()

workloads:
  - scenario: scenarios/windows/sysmon/registry/mrt-infection-report-disable
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      user:         ref.user
    expectation:
      expected: alert
      summary: "reg.exe sets the MRT DontReportInfectionInformation policy value to 1"
      mitre:
        tactics: [defense-impairment]
        techniques: [T1685]
