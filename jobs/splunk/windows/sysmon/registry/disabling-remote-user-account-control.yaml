type: job
name: Disabling Remote User Account Control
detection:
  source: escu
  name: "ESCU - Disabling Remote User Account Control - Rule"
  id: bbc644bc-37df-4e1a-9c88-ec9a53e2038c
description: |
  Validates detection of User Account Control being disabled: setting
  EnableLUA to 0 under
  HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System switches
  UAC off after the next restart, so administrator accounts run every
  process with a full administrator token and elevate without a consent
  prompt.

mitre:
  tactics: [privilege-escalation, defense-evasion]
  techniques: [T1548.002]

state:
  domain_short: CORP
  domain_tld:   local

workloads:
  - scenario: scenarios/windows/sysmon/registry/uac-disable-enablelua
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
    expectation:
      expected: alert
      summary: "reg.exe sets EnableLUA to 0, disabling User Account Control"
      mitre:
        tactics: [privilege-escalation, defense-evasion]
        techniques: [T1548.002]
