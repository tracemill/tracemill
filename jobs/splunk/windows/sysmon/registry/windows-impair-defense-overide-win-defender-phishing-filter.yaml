type: job
name: Windows Impair Defense Overide Win Defender Phishing Filter
detection:
  source: escu
  name: "ESCU - Windows Impair Defense Overide Win Defender Phishing Filter - Rule"
  id: 10ca081c-57b1-4a78-ba56-14a40a7e116a
description: |
  Validates detection of legacy Microsoft Edge SmartScreen being weakened
  by policy (T1685): reg.exe sets the EnabledV9 or PreventOverride DWORD
  under HKLM\SOFTWARE\Policies\Microsoft\MicrosoftEdge\PhishingFilter to 0,
  which in the legacy (EdgeHTML) version of Edge turns SmartScreen off or
  lets users click past its warnings to a site it flagged as unsafe.

mitre:
  tactics: [defense-impairment]
  techniques: [T1685]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  user:               gen.username()

workloads:
  - scenario: scenarios/windows/sysmon/registry/legacy-edge-smartscreen-weaken
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      user:         ref.user
      value_name:   EnabledV9
    expectation:
      expected: alert
      summary: "reg.exe sets the legacy Edge PhishingFilter EnabledV9 policy value to 0"
      mitre:
        tactics: [defense-impairment]
        techniques: [T1685]

  - scenario: scenarios/windows/sysmon/registry/legacy-edge-smartscreen-weaken
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      user:         ref.user
      value_name:   PreventOverride
    expectation:
      expected: alert
      summary: "reg.exe sets the legacy Edge PhishingFilter PreventOverride policy value to 0"
      mitre:
        tactics: [defense-impairment]
        techniques: [T1685]
