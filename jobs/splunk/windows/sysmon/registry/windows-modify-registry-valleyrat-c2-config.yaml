type: job
name: Windows Modify Registry ValleyRAT C2 Config
detection:
  source: escu
  name: "ESCU - Windows Modify Registry ValleyRAT C2 Config - Rule"
  id: ac59298a-8d81-4c02-8c9b-ffdac993891f
description: |
  Validates detection of ValleyRAT storing its configuration in the
  registry (T1112): valleyrat.exe writes its own path to SelfPath and its
  command-and-control server address and port to the binary IpDateInfo
  value under the user's HKU\<SID>\Console key.
tags: [valleyrat]

mitre:
  tactics: [defense-evasion]
  techniques: [T1112]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/registry/valleyrat-c2-config-set
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
    expectation:
      expected: alert
      summary: "valleyrat.exe writes SelfPath and the binary IpDateInfo value under HKU\\<SID>\\Console"
      mitre:
        tactics: [defense-evasion]
        techniques: [T1112]
