type: job
name: Disabling CMD Application
detection:
  source: escu
  name: "ESCU - Disabling CMD Application - Rule"
  id: ff86077c-9212-11eb-a1e6-acde48001122
description: |
  Validates detection of the command prompt being disabled by policy:
  reg.exe sets the DisableCMD DWORD to 1 under the user's
  HKU\<SID>\SOFTWARE\Policies\Microsoft\Windows\System key, so cmd.exe
  refuses to open a prompt or run batch files for that user.

mitre:
  tactics: [defense-evasion, defense-impairment]
  techniques: [T1112, T1685]

state:
  domain_short: CORP
  domain_tld:   local

workloads:
  - scenario: scenarios/windows/sysmon/registry/disable-cmd-policy-set
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
    expectation:
      expected: alert
      summary: "reg.exe sets DisableCMD to 1 under the user's Policies\\Microsoft\\Windows\\System key"
      mitre:
        tactics: [defense-evasion, defense-impairment]
        techniques: [T1112, T1685]
