type: job
name: Windows AD DSRM Account Changes
detection:
  source: escu
  name: "ESCU - Windows AD DSRM Account Changes - Rule"
  id: 08cb291e-ea77-48e8-a95a-0799319bf056
description: |
  Validates detection of Directory Services Restore Mode administrator logon
  being enabled through the registry: reg.exe sets the
  DSRMAdminLogonBehavior DWORD under
  HKLM\System\CurrentControlSet\Control\Lsa on a domain controller to 1,
  which lets the DSRM administrator log on while the AD DS service is
  stopped, or to 2, which lets it log on at any time, including over the
  network.

mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1098]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  user:               gen.username()

workloads:
  - scenario: scenarios/windows/sysmon/registry/dsrm-admin-logon-behavior-set
    bindings:
      domain_short:        ref.domain_short
      domain_tld:          ref.domain_tld
      computer:            ref.computer
      user:                ref.user
      dsrm_logon_behavior: "1"
    expectation:
      expected: alert
      summary: "reg.exe sets DSRMAdminLogonBehavior to 1"
      mitre:
        tactics: [persistence, privilege-escalation]
        techniques: [T1098]

  - scenario: scenarios/windows/sysmon/registry/dsrm-admin-logon-behavior-set
    bindings:
      domain_short:        ref.domain_short
      domain_tld:          ref.domain_tld
      computer:            ref.computer
      user:                ref.user
      dsrm_logon_behavior: "2"
    expectation:
      expected: alert
      summary: "reg.exe sets DSRMAdminLogonBehavior to 2"
      mitre:
        tactics: [persistence, privilege-escalation]
        techniques: [T1098]
