type: job
name: Add DefaultUser And Password In Registry
detection:
  source: escu
  name: "ESCU - Add DefaultUser And Password In Registry - Rule"
  id: d4a3eb62-0f1e-11ec-a971-acde48001122
description: |
  Validates detection of stored logon credentials that let a host sign in
  without a prompt. Sysmon EID 13 (RegistryEvent value set) records reg.exe
  writing the DefaultUserName and DefaultPassword values under the Winlogon
  key, so the named account logs on automatically at the next boot.

mitre:
  tactics: [credential-access]
  techniques: [T1552.002]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  winlogon_key:       "HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon"
  logon_user:         gen.username()
  logon_password:     gen.hex(len=5, case=lower)
  user_guid_raw:      fn.upper(gen.uuid())
  user_record_id:     gen.int(min=48000000, max=48399999)
  password_guid_raw:  fn.upper(gen.uuid())
  password_record_id: gen.int(min=48400000, max=48799999)
  control_record_id:  gen.int(min=48800000, max=49199999)

workloads:
  - scenario: scenarios/windows/sysmon/registry/winlogon-default-credentials-set
    bindings:
      computer:         ref.computer
      event_record_id:  ref.user_record_id
      process_guid_raw: ref.user_guid_raw
      details:          ref.logon_user
    expectation:
      expected: alert
      summary: "reg.exe stores the account name used for automatic logon"
      mitre:
        tactics: [credential-access]
        techniques: [T1552.002]

  - scenario: scenarios/windows/sysmon/registry/winlogon-default-credentials-set
    bindings:
      computer:         ref.computer
      event_record_id:  ref.password_record_id
      process_guid_raw: ref.password_guid_raw
      target_object:    "${ref.winlogon_key}\\DefaultPassword"
      details:          ref.logon_password
    expectation:
      expected: alert
      summary: "reg.exe stores the cleartext password used for automatic logon"
      mitre:
        tactics: [credential-access]
        techniques: [T1552.002]

  - scenario: scenarios/windows/sysmon/registry/w32time-config-set
    bindings:
      computer:        ref.computer
      event_record_id: ref.control_record_id
    expectation:
      expected: none
      summary: "The Windows time service records its own clock-confidence value"
