type: job
name: Windows Disable Memory Crash Dump
detection:
  source: escu
  name: "ESCU - Windows Disable Memory Crash Dump - Rule"
  id: 59e54602-9680-11ec-a8a6-acde48001122
description: |
  Validates detection of memory crash dumps being disabled through the
  registry (T1485): a process sets the CrashDumpEnabled DWORD under
  HKLM\System\CurrentControlSet\Control\CrashControl to 0, so Windows
  writes no memory dump when the system stops with a bug check.

mitre:
  tactics: [impact]
  techniques: [T1485]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/registry/crash-dump-disable
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
    expectation:
      expected: alert
      summary: "A process sets CrashDumpEnabled to 0 under the CrashControl key"
      mitre:
        tactics: [impact]
        techniques: [T1485]
