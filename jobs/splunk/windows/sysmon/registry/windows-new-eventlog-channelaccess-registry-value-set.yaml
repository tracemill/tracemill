type: job
name: Windows New EventLog ChannelAccess Registry Value Set
detection:
  source: escu
  name: "ESCU - Windows New EventLog ChannelAccess Registry Value Set - Rule"
  id: 16eb11bc-ef42-42e8-9d0c-d21e0fa15725
description: |
  Validates detection of an event channel being locked away from readers.
  Sysmon EID 13 (RegistryEvent value set) records a ChannelAccess security
  descriptor that denies read access to Everyone written on a channel key.
  The channel keeps collecting while its contents stop being readable.

mitre:
  tactics: [defense-evasion, defense-impairment]
  techniques: [T1685.001]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  channel_guid_raw:    fn.upper(gen.uuid())
  channel_process_guid: "{${ref.channel_guid_raw}}"
  channel_record_id:   gen.int(min=243000, max=243499)

workloads:
  - scenario: scenarios/windows/sysmon/registry/winevt-channel-access-restricted
    bindings:
      computer:         ref.computer
      event_record_id:  ref.channel_record_id
      process_guid_raw: ref.channel_guid_raw
    expectation:
      expected: alert
      summary: "A ChannelAccess descriptor denying Everyone is written on a channel key"
      mitre:
        tactics: [defense-evasion, defense-impairment]
        techniques: [T1685.001]
      correlation:
        process_guid: ref.channel_process_guid
        dest:         ref.computer
