type: job
name: Enable WDigest UseLogonCredential Registry
detection:
  source: escu
  name: "ESCU - Enable WDigest UseLogonCredential Registry - Rule"
  id: 0c7d8ffe-25b1-11ec-9f39-acde48001122
description: |
  Validates detection of WDigest cleartext credential caching being
  enabled through the registry (T1112, T1003): reg.exe sets the
  UseLogonCredential DWORD under
  HKLM\System\CurrentControlSet\Control\SecurityProviders\WDigest to 1, so
  that on a host without Credential Guard lsass.exe keeps a cleartext copy
  of the password of each user who signs on with a password afterward.

mitre:
  tactics: [defense-evasion, credential-access]
  techniques: [T1112, T1003]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  user:               gen.username()

workloads:
  - scenario: scenarios/windows/sysmon/registry/wdigest-cleartext-creds-enable
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      user:         ref.user
    expectation:
      expected: alert
      summary: "reg.exe sets the WDigest UseLogonCredential registry value to 1"
      mitre:
        tactics: [defense-evasion, credential-access]
        techniques: [T1112, T1003]
