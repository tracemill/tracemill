type: job
name: Screensaver Event Trigger Execution
detection:
  source: escu
  name: "ESCU - Screensaver Event Trigger Execution - Rule"
  id: 58cea3ec-1f6d-11ec-8560-acde48001122
description: |
  Validates detection of screensaver persistence (T1546.002): reg.exe sets
  the per-user SCRNSAVE.EXE value under HKU\<SID>\Control Panel\Desktop to
  an attacker-dropped .scr payload that Winlogon launches when the session
  goes idle.

mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1546.002]

workloads:
  - scenario: scenarios/windows/sysmon/registry/screensaver-scrnsave-exe-set
    expectation:
      expected: alert
      summary: "reg.exe points the user's SCRNSAVE.EXE value at a dropped .scr payload"
      mitre:
        tactics: [persistence, privilege-escalation]
        techniques: [T1546.002]
