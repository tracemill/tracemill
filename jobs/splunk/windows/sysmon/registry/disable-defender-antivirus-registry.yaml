type: job
name: Disable Defender AntiVirus Registry
detection:
  source: escu
  name: "ESCU - Disable Defender AntiVirus Registry - Rule"
  id: aa4f695a-3024-11ec-9987-acde48001122
description: |
  Validates detection of reg.exe setting the Microsoft Defender
  DisableAntiVirus policy value to 1 (T1562.001). The control sets a
  different Defender policy value to 1 under the same key.
tags: [icedid]

mitre:
  tactics: [defense-evasion]
  techniques: [T1562.001]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/registry/defender-policy-set
    bindings:
      computer: ref.computer
    expectation:
      expected: alert
      summary: "DisableAntiVirus is set to 1"
      mitre:
        tactics: [defense-evasion]
        techniques: [T1562.001]

  - scenario: scenarios/windows/sysmon/registry/defender-policy-set
    bindings:
      computer:      ref.computer
      policy_subkey: "\\SpyNet"
      value_name:    DisableBlockAtFirstSeen
    expectation:
      expected: none
      summary: "A different Defender policy value, DisableBlockAtFirstSeen, is set to 1"
