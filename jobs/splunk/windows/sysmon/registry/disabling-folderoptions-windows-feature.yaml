type: job
name: Disabling FolderOptions Windows Feature
detection:
  source: escu
  name: "ESCU - Disabling FolderOptions Windows Feature - Rule"
  id: 83776de4-921a-11eb-868a-acde48001122
description: |
  Validates detection of the Folder Options dialog being disabled by policy:
  reg.exe sets the NoFolderOptions DWORD to 1 under the Policies\Explorer
  key, for a single user under HKU\<SID> or machine-wide under HKLM, so the
  user cannot turn on the display of hidden files or file extensions.

mitre:
  tactics: [defense-impairment]
  techniques: [T1685]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  user_rid:           gen.int(min=1001, max=1999)
  user_sid:           "S-1-5-21-111222333-444555666-777888999-${ref.user_rid}"

workloads:
  - scenario: scenarios/windows/sysmon/registry/folder-options-policy-disable
    bindings:
      domain_short:  ref.domain_short
      domain_tld:    ref.domain_tld
      computer:      ref.computer
      registry_root: "HKU\\${ref.user_sid}"
    expectation:
      expected: alert
      summary: "reg.exe sets NoFolderOptions to 1 under the user's Policies\\Explorer key"
      mitre:
        tactics: [defense-impairment]
        techniques: [T1685]

  - scenario: scenarios/windows/sysmon/registry/folder-options-policy-disable
    bindings:
      domain_short:  ref.domain_short
      domain_tld:    ref.domain_tld
      computer:      ref.computer
      registry_root: HKLM
    expectation:
      expected: alert
      summary: "reg.exe sets NoFolderOptions to 1 under the machine-wide HKLM Policies\\Explorer key"
      mitre:
        tactics: [defense-impairment]
        techniques: [T1685]
