type: job
name: Eventvwr UAC Bypass
detection:
  source: escu
  name: "ESCU - Eventvwr UAC Bypass - Rule"
  id: 9cf8fe08-7ad8-11eb-9819-acde48001122
description: |
  Validates detection of the Event Viewer UAC bypass (T1548.002): reg.exe
  and PowerShell each plant a command under the per-user
  mscfile\shell\open\command handler that auto-elevating eventvwr.exe
  resolves before HKLM.

mitre:
  tactics: [privilege-escalation, defense-evasion]
  techniques: [T1548.002]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  user_rid:           gen.int(min=1001, max=1999)
  reg_image:          "C:\\Windows\\system32\\reg.exe"
  powershell_image:   "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe"

workloads:
  - scenario: scenarios/windows/sysmon/registry/uac-bypass-shell-command-hijack
    bindings:
      computer: ref.computer
      user_rid: ref.user_rid
      image:    ref.reg_image
    expectation:
      expected: alert
      summary: "reg.exe plants a command under the per-user mscfile open-command handler hijacked by eventvwr.exe."
      mitre:
        tactics: [privilege-escalation, defense-evasion]
        techniques: [T1548.002]

  - scenario: scenarios/windows/sysmon/registry/uac-bypass-shell-command-hijack
    bindings:
      computer: ref.computer
      user_rid: ref.user_rid
      image:    ref.powershell_image
    expectation:
      expected: alert
      summary: "PowerShell plants the same mscfile open-command hijack."
      mitre:
        tactics: [privilege-escalation, defense-evasion]
        techniques: [T1548.002]
