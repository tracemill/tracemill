type: job
name: Windows Impair Defense Deny Security Software With Applocker
detection:
  source: escu
  name: "ESCU - Windows Impair Defense Deny Security Software With Applocker - Rule"
  id: e0b6ca60-9e29-4450-b51a-bba0abae2313
description: |
  Validates detection of an AppLocker rule that blocks security software:
  powershell.exe writes an AppLocker executable rule into the local Group
  Policy object that denies Everyone every executable signed by an antivirus
  vendor's publisher certificate, so once the Application Identity service
  enforces the policy, none of that vendor's executables can start.

mitre:
  tactics: [defense-impairment]
  techniques: [T1685]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/registry/applocker-deny-av-publisher
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
    expectation:
      expected: alert
      summary: "powershell.exe writes an AppLocker Exe rule denying executables signed by O=KASPERSKY LAB"
      mitre:
        tactics: [defense-impairment]
        techniques: [T1685]
