type: job
name: Windows Office Product Spawned Control
detection:
  source: escu
  name: "ESCU - Windows Office Product Spawned Control - Rule"
  id: 081c485d-ac8d-4bee-ad4c-525772fead4d
description: |
  Validates detection of a Microsoft Office application starting the Windows
  Control Panel. Sysmon EID 1 (Process Create) records an Office application,
  for example WINWORD.EXE, starting control.exe with a command line that names
  a Control Panel item (.cpl) file in a user-writable directory, for example
  docusign.cpl in the user's AppData\Local\Temp folder.

mitre:
  tactics: [initial-access]
  techniques: [T1566.001]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  user_name:          Administrator

workloads:
  - scenario: scenarios/windows/sysmon/process-create/office-spawns-control-cpl
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      user_name:    ref.user_name
      parent_image: "C:\\Program Files\\Microsoft Office\\root\\Office16\\WINWORD.EXE"
      cpl_name:     docusign.cpl
    expectation:
      expected: alert
      summary: "WINWORD.EXE starts control.exe to load docusign.cpl from the user's AppData\\Local\\Temp folder"
      mitre:
        tactics: [initial-access]
        techniques: [T1566.001]
