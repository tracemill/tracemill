type: job
name: Windows Binary Proxy Execution Mavinject DLL Injection
detection:
  source: escu
  name: "ESCU - Windows Binary Proxy Execution Mavinject DLL Injection - Rule"
  id: ccf4b61b-1b26-4f2e-a089-f2009c569c57
description: |
  Validates detection of the Microsoft Application Virtualization Injector
  being run to inject a DLL into a running process. Sysmon EID 1 (Process
  Create) records mavinject.exe starting with a target process ID, a DLL
  and an injection switch on its command line, for example
  `/INJECTRUNNING` with a DLL path from cmd.exe, or `/HMODULE=` with a
  module base address and a DLL name from powershell.exe. The event
  records the launch and its command line, not whether the DLL was loaded
  into the target process.
mitre:
  tactics: [defense-evasion]
  techniques: [T1218.013]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  logon_guid_raw:     fn.upper(gen.uuid())
  logon_id_hex:       gen.hex(len=6, case=lower)

workloads:
  - scenario: scenarios/windows/sysmon/process-create/mavinject-dll-injection
    bindings:
      domain_short:   ref.domain_short
      domain_tld:     ref.domain_tld
      computer:       ref.computer
      logon_guid_raw: ref.logon_guid_raw
      logon_id_hex:   ref.logon_id_hex
    expectation:
      expected: alert
      summary: "mavinject.exe /INJECTRUNNING injects a DLL into a running process"
      mitre:
        tactics: [defense-evasion]
        techniques: [T1218.013]

  - scenario: scenarios/windows/sysmon/process-create/mavinject-dll-injection
    bindings:
      domain_short:        ref.domain_short
      domain_tld:          ref.domain_tld
      computer:            ref.computer
      logon_guid_raw:      ref.logon_guid_raw
      logon_id_hex:        ref.logon_id_hex
      command_line:        '"C:\Windows\system32\mavinject.exe" 4964 /HMODULE=0x013C0000 foo.dll 4'
      current_directory:   'C:\Users\Administrator\'
      parent_image:        'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
      parent_command_line: '"C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" '
    expectation:
      expected: alert
      summary: "mavinject.exe /HMODULE=0x injects a DLL into a running process"
      mitre:
        tactics: [defense-evasion]
        techniques: [T1218.013]
