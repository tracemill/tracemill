type: job
name: Windows Wermgr Spawning System Integrity Process
detection:
  source: escu
  name: "ESCU - Windows Wermgr Spawning System Integrity Process - Rule"
  id: d39634c8-7ce7-4503-a5da-73ca3c758fb9
description: |
  Validates detection of the Windows Error Reporting manager starting a
  child process at System integrity: Sysmon EID 1 (Process Create) records
  wermgr.exe, started with `-upload` and running as NT AUTHORITY\SYSTEM,
  starting conhost.exe as NT AUTHORITY\SYSTEM at System integrity.
tags: [rogueplanet]

mitre:
  tactics: [defense-evasion, privilege-escalation]
  techniques: [T1068, T1134.001]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/process-create/wermgr-upload-spawns-system-conhost
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
    expectation:
      expected: alert
      summary: "wermgr.exe -upload starts conhost.exe at System integrity as SYSTEM"
      mitre:
        tactics: [defense-evasion, privilege-escalation]
        techniques: [T1068, T1134.001]
