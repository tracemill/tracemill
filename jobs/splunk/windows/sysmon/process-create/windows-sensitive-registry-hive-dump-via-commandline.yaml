type: job
name: Windows Sensitive Registry Hive Dump Via CommandLine
detection:
  source: escu
  name: "ESCU - Windows Sensitive Registry Hive Dump Via CommandLine - Rule"
  id: 5aaff29d-0cce-405b-9ee8-5d06b49d045e
description: |
  Validates detection of a sensitive registry hive copied out from the
  command line: Sysmon EID 1 (Process Create) records cmd.exe starting
  reg.exe with a `save` command line for an HKLM hive, for example
  HKLM\sam, or regedit.exe with an `/E` command line that exports an HKLM
  hive, for example HKEY_LOCAL_MACHINE\SAM, to a .reg file.

mitre:
  tactics: [credential-access]
  techniques: [T1003.002]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/process-create/reg-save-sensitive-hive
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      hive:         sam
    expectation:
      expected: alert
      summary: "cmd.exe starts reg.exe with save HKLM\\sam"
      mitre:
        tactics: [credential-access]
        techniques: [T1003.002]

  - scenario: scenarios/windows/sysmon/process-create/regedit-export-sensitive-hive
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      registry_key: 'HKEY_LOCAL_MACHINE\SAM'
      export_file:  test2.reg
    expectation:
      expected: alert
      summary: "cmd.exe starts regedit.exe with /E test2.reg HKEY_LOCAL_MACHINE\\SAM"
      mitre:
        tactics: [credential-access]
        techniques: [T1003.002]
