type: job
name: Windows MSIExec DLLRegisterServer
detection:
  source: escu
  name: "ESCU - Windows MSIExec DLLRegisterServer - Rule"
  id: fdb59aef-d88f-4909-8369-ec2afbd2c398
description: |
  Validates detection of the Windows Installer being run to register a DLL:
  Sysmon EID 1 (Process Create) records cmd.exe starting msiexec.exe with the
  `/y` switch and the path of a DLL, for example MSIRunner.dll, which makes
  msiexec.exe load the DLL and call its DllRegisterServer export. The event
  records the launch and its command line, not whether the DLL loaded or what
  its export ran.
mitre:
  tactics: [defense-evasion]
  techniques: [T1218.007]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  logon_guid_raw:     fn.upper(gen.uuid())
  logon_id_hex:       gen.hex(len=6, case=lower)

workloads:
  - scenario: scenarios/windows/sysmon/process-create/msiexec-register-dll
    bindings:
      domain_short:   ref.domain_short
      domain_tld:     ref.domain_tld
      computer:       ref.computer
      logon_guid_raw: ref.logon_guid_raw
      logon_id_hex:   ref.logon_id_hex
    expectation:
      expected: alert
      summary: "msiexec.exe /y registers a DLL through its DllRegisterServer export"
      mitre:
        tactics: [defense-evasion]
        techniques: [T1218.007]
