type: job
name: Windows Modify System Firewall with Notable Process Path
detection:
  source: escu
  name: "ESCU - Windows Modify System Firewall with Notable Process Path - Rule"
  id: cd6d7410-9146-4471-a418-49edba6dadc4
description: |
  Validates detection of a program in a temporary folder adding itself to the
  Windows Firewall allowed programs list. Sysmon EID 1 (Process Create)
  records a program in the user's AppData\Local\Temp folder, for example the
  njRAT client server.exe, starting netsh.exe with the command line `netsh
  firewall add allowedprogram "<program path>" "server.exe" ENABLE`, where
  the path is the program's own, for example
  C:\Users\Administrator\AppData\Local\Temp\2\server.exe. The event records
  the command that adds the exception, not any traffic the program then sends
  or receives.
tags: [njrat]

mitre:
  tactics: [defense-impairment]
  techniques: [T1686]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  user_name:           Administrator
  logon_guid_raw:      fn.upper(gen.uuid())
  logon_id_hex:        gen.hex(len=5, case=lower)
  temp_record_id:      gen.int(min=5000, max=99999)
  temp2_record_id:     gen.int(min=100000, max=199999)

workloads:
  - scenario: scenarios/windows/sysmon/process-create/netsh-firewall-allowedprogram
    bindings:
      domain_short:        ref.domain_short
      domain_tld:          ref.domain_tld
      computer:            ref.computer
      sysmon_pid:          ref.sysmon_pid
      sysmon_tid:          ref.sysmon_tid
      user_name:           ref.user_name
      logon_guid_raw:      ref.logon_guid_raw
      logon_id_hex:        ref.logon_id_hex
      event_record_id:     ref.temp_record_id
      program_dir:         "C:\\Users\\Administrator\\AppData\\Local\\Temp"
      current_directory:   "C:\\Users\\Administrator\\Downloads\\Server\\"
      parent_command_line: '"C:\Users\Administrator\AppData\Local\Temp\server.exe" '
    expectation:
      expected: alert
      summary: "server.exe in AppData\\Local\\Temp adds itself to the firewall allowed programs list with netsh"
      mitre:
        tactics: [defense-impairment]
        techniques: [T1686]

  - scenario: scenarios/windows/sysmon/process-create/netsh-firewall-allowedprogram
    bindings:
      domain_short:        ref.domain_short
      domain_tld:          ref.domain_tld
      computer:            ref.computer
      sysmon_pid:          ref.sysmon_pid
      sysmon_tid:          ref.sysmon_tid
      user_name:           ref.user_name
      logon_guid_raw:      ref.logon_guid_raw
      logon_id_hex:        ref.logon_id_hex
      event_record_id:     ref.temp2_record_id
      program_dir:         "C:\\Users\\Administrator\\AppData\\Local\\Temp\\2"
      current_directory:   "C:\\Users\\ADMINI~1\\AppData\\Local\\Temp\\2\\"
      parent_command_line: '"C:\Users\Administrator\AppData\Local\Temp\2\server.exe"'
    expectation:
      expected: alert
      summary: "server.exe in AppData\\Local\\Temp\\2 adds itself to the firewall allowed programs list with netsh"
      mitre:
        tactics: [defense-impairment]
        techniques: [T1686]
