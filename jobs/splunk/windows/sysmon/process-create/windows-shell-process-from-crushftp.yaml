type: job
name: Windows Shell Process from CrushFTP
detection:
  source: escu
  name: "ESCU - Windows Shell Process from CrushFTP - Rule"
  id: 459628e3-1b00-4e9b-9e5b-7da8961aea35
description: |
  Validates detection of the CrushFTP service starting a Windows command
  shell: Sysmon EID 1 (Process Create) records crushftpservice.exe under
  C:\Program Files\CrushFTP10 starting cmd.exe with a command line, for
  example `cmd.exe /c whoami`, at high integrity under a local
  administrator account.

mitre:
  tactics: [execution, initial-access, persistence]
  techniques: [T1059.001, T1059.003, T1190, T1505]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/process-create/crushftp-service-spawns-cmd
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      user_name:    Administrator
      command_line: cmd.exe /c whoami
    expectation:
      expected: alert
      summary: "The CrushFTP service process crushftpservice.exe starts cmd.exe"
      mitre:
        tactics: [execution, initial-access, persistence]
        techniques: [T1059.001, T1059.003, T1190, T1505]
