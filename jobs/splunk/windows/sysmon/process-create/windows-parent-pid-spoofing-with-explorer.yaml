type: job
name: Windows Parent PID Spoofing with Explorer
detection:
  source: escu
  name: "ESCU - Windows Parent PID Spoofing with Explorer - Rule"
  id: 17f8f69c-5d00-4c88-9c6f-493bbdef20a1
description: |
  Validates detection of Windows Explorer started with the `/root,` switch and
  a program path as its root target: Sysmon EID 1 (Process Create) records
  explorer.exe starting with a command line of `explorer.exe`, the `/root,`
  switch and a quoted program path, for example
  "c:\windows\system32\calc.exe", with no parent image recorded.

mitre:
  tactics: [defense-evasion, privilege-escalation]
  techniques: [T1134.004]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:         gen.int(min=1000, max=4000)
  sysmon_tid:         gen.int(min=1000, max=9999)
  user_name:          Administrator
  logon_guid_raw:     fn.upper(gen.uuid())
  logon_id_hex:       gen.hex(len=5, case=lower)

workloads:
  - scenario: scenarios/windows/sysmon/process-create/explorer-root-target-launch
    bindings:
      domain_short:   ref.domain_short
      domain_tld:     ref.domain_tld
      computer:       ref.computer
      sysmon_pid:     ref.sysmon_pid
      sysmon_tid:     ref.sysmon_tid
      user_name:      ref.user_name
      logon_guid_raw: ref.logon_guid_raw
      logon_id_hex:   ref.logon_id_hex
      target_path:    'c:\windows\system32\calc.exe'
    expectation:
      expected: alert
      summary: "explorer.exe starts with /root, and calc.exe as its root target"
      mitre:
        tactics: [defense-evasion, privilege-escalation]
        techniques: [T1134.004]
