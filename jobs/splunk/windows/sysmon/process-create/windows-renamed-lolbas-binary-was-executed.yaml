type: job
name: Windows Renamed LOLBAS Binary was Executed
detection:
  source: escu
  name: "ESCU - Windows Renamed LOLBAS Binary was Executed - Rule"
  id: 10c3850e-810d-41b4-a197-2f14d7883579
description: |
  Validates detection of a built-in Windows tool run under a different file
  name. Sysmon EID 1 (Process Create) records a copy of curl.exe saved on
  the user's Desktop under another name, for example wasup.exe, its
  original file name still naming the tool.

mitre:
  tactics: [defense-evasion]
  techniques: [T1036.003]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  process_guid_raw:   gen.uuid()
  process_guid:       "{${ref.process_guid_raw}}"

workloads:
  - scenario: scenarios/windows/sysmon/process-create/renamed-system-binary-execution
    bindings:
      domain_short:     ref.domain_short
      domain_tld:       ref.domain_tld
      computer:         ref.computer
      process_guid_raw: ref.process_guid_raw
    expectation:
      expected: alert
      summary: "A copy of curl.exe saved as wasup.exe runs from the Desktop"
      mitre:
        tactics: [defense-evasion]
        techniques: [T1036.003]
      correlation:
        process_guid: ref.process_guid
        dest:         ref.computer
