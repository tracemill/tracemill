type: job
name: Windows Mustang Panda USB Tool Execution
detection:
  source: escu
  name: "ESCU - Windows Mustang Panda USB Tool Execution - Rule"
  id: e66a167f-6506-4e5b-8e4d-1b04940c70be
description: |
  Validates detection of a program started from the root of a non-system
  drive under a listed file name. Sysmon EID 1 (Process Create) records
  Explorer starting an executable from a removable drive, for example
  E:\CefSub.exe, at Medium integrity with the drive root as its working
  directory.

mitre:
  tactics: [persistence, privilege-escalation, defense-evasion, execution, exfiltration]
  techniques: [T1574.001, T1204.002, T1020]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/process-create/removable-drive-tool-execution
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
    expectation:
      expected: alert
      summary: "Explorer starts E:\\CefSub.exe from the root of a removable drive"
      mitre:
        tactics: [persistence, privilege-escalation, defense-evasion, execution, exfiltration]
        techniques: [T1574.001, T1204.002, T1020]
