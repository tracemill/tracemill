type: job
name: Detect MSHTA Url in Command Line
detection:
  source: escu
  name: "ESCU - Detect MSHTA Url in Command Line - Rule"
  id: 9b3af1e6-5b68-11eb-ae93-0242ac130002
description: |
  Validates detection of mshta.exe launching with an http:// or https://
  URL in its command line (T1218.005), a way to fetch and execute a
  remote HTA file while bypassing controls that only monitor
  browser-based downloads. Two attack workloads cover both URL schemes
  the detection's OR scopes to. A control opens a local HTA file with
  no URL and must not fire.

mitre:
  tactics: [defense-evasion]
  techniques: [T1218.005]

state:
  domain_short:              CORP
  domain_tld:                local
  domain_short_lower:        fn.lower(ref.domain_short)
  domain_fqdn:                "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:                   gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  username:                   gen.username()
  control_current_directory:  "C:\\Users\\${ref.username}\\AppData\\Local\\Temp\\2\\"
  control_hta_target:         "C:\\Users\\${ref.username}\\AppData\\Roaming\\Microsoft\\Windows\\Start Menu\\Programs\\Startup\\T1218.005.hta"

workloads:
  - scenario: scenarios/windows/sysmon/process-create/mshta-url-load
    bindings:
      computer:   ref.computer
      username:   ref.username
      hta_target: "https://raw.githubusercontent.com/redcanaryco/atomic-red-team/24549e3866407c3080b95b6afebf78e8acd23352/atomics/T1218.005/src/T1218.005.hta"
    expectation:
      expected: alert
      summary: "mshta.exe fetches a remote HTA file over https://"
      mitre:
        tactics: [defense-evasion]
        techniques: [T1218.005]

  - scenario: scenarios/windows/sysmon/process-create/mshta-url-load
    bindings:
      computer:   ref.computer
      username:   ref.username
      hta_target: "http://198.51.100.20/payload.hta"
    expectation:
      expected: alert
      summary: "mshta.exe fetches a remote HTA file over http://"
      mitre:
        tactics: [defense-evasion]
        techniques: [T1218.005]

  - scenario: scenarios/windows/sysmon/process-create/mshta-url-load
    bindings:
      computer:            ref.computer
      username:            ref.username
      hta_target:          ref.control_hta_target
      current_directory:   ref.control_current_directory
      parent_image:        "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe"
      parent_command_line: "\"C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe\" -noninteractive -Command exit"
    expectation:
      expected: none
      summary: "mshta.exe opening a local HTA file with no URL does not match the http/https-scoped filter"
