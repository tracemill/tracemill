type: job
description: |
  hh.exe (Microsoft HTML Help) loads a Compiled HTML Help file (CHM) from
  a remote HTTP/HTTPS URL; the URL appears directly in the process command
  line and the detection fires on the *http* pattern.

  A local CHM open provides the false-positive control: hh.exe is launched
  by Explorer to display a help file, no remote fetch occurs, and the
  detection must not fire.

mitre:
  tactics: [defense-evasion]
  techniques: [T1218.001]

tags: []

state:
  domain_short:      CORP
  domain_tld:        local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:       "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:          gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  user:              gen.username()

  chm_path:              "C:\\Users\\${ref.user}\\Documents\\help.chm"
  benign_command_line:   "\"C:\\Windows\\hh.exe\" \"${ref.chm_path}\""
  benign_current_dir:    "C:\\Users\\${ref.user}\\"
  benign_logon_id:       "0x1234ab"
  benign_session_id:     1
  benign_integrity:      Medium
  benign_parent_image:   "C:\\Windows\\explorer.exe"
  benign_parent_cmdline: "C:\\Windows\\explorer.exe"

workloads:
  - scenario: scenarios/windows/sysmon/process-create/hh-remote-url-load
    bindings:
      computer: ref.computer
      user:     ref.user
    expectation:
      expected: alert
      summary: hh.exe with HTTP URL in command line triggers the detection

  - scenario: scenarios/windows/sysmon/process-create/hh-remote-url-load
    bindings:
      computer:            ref.computer
      user:                ref.user
      command_line:        ref.benign_command_line
      current_directory:   ref.benign_current_dir
      logon_id:            ref.benign_logon_id
      terminal_session_id: ref.benign_session_id
      integrity_level:     ref.benign_integrity
      parent_image:        ref.benign_parent_image
      parent_command_line: ref.benign_parent_cmdline
    expectation:
      expected: none
      summary: hh.exe opening a local CHM from Explorer does not trigger the http-based filter
