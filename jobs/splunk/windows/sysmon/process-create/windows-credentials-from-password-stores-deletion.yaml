type: job
name: Windows Credentials from Password Stores Deletion
detection:
  source: escu
  name: "ESCU - Windows Credentials from Password Stores Deletion - Rule"
  id: 46d676aa-40c6-4fe6-b917-d23b621f0f89
description: |
  Validates detection of cmdkey deleting a credential stored in Windows
  Credential Manager: Sysmon EID 1 (Process Create) records cmd.exe starting
  cmdkey.exe with a `/delete:` command line that names the stored
  credential's target, for example Server01.
mitre:
  tactics: [credential-access]
  techniques: [T1555]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/process-create/cmdkey-delete-stored-credential
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
    expectation:
      expected: alert
      summary: "cmdkey.exe starts with /delete:Server01"
      mitre:
        tactics: [credential-access]
        techniques: [T1555]
