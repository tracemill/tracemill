type: job
name: Windows Indirect Command Execution Via forfiles
detection:
  source: escu
  name: "ESCU - Windows Indirect Command Execution Via forfiles - Rule"
  id: 1fdf31c9-ff4d-4c48-b799-0e8666e08787
description: |
  Validates detection of a program run through the forfiles.exe /c command
  option: Sysmon EID 1 (Process Create) records cmd.exe starting forfiles.exe
  with `/p c:\windows\system32 /m notepad.exe /c calc.exe`, and a second
  Sysmon EID 1 records forfiles.exe starting calc.exe as its child process.

mitre:
  tactics: [defense-evasion]
  techniques: [T1202]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:         gen.int(min=1000, max=4000)
  sysmon_tid:         gen.int(min=1000, max=9999)
  user_name:          Administrator
  logon_guid_raw:     gen.uuid()
  logon_id_hex:       gen.hex(len=6, case=lower)
  shell_guid_raw:     gen.uuid()
  shell_process_id:   gen.int(min=1000, max=9999)

workloads:
  - scenario: scenarios/windows/sysmon/process-create/forfiles-runs-command
    bindings:
      domain_short:     ref.domain_short
      domain_tld:       ref.domain_tld
      computer:         ref.computer
      sysmon_pid:       ref.sysmon_pid
      sysmon_tid:       ref.sysmon_tid
      user_name:        ref.user_name
      logon_guid_raw:   ref.logon_guid_raw
      logon_id_hex:     ref.logon_id_hex
      shell_guid_raw:   ref.shell_guid_raw
      shell_process_id: ref.shell_process_id
    expectation:
      expected: alert
      summary: "forfiles.exe runs calc.exe through its /c option"
      mitre:
        tactics: [defense-evasion]
        techniques: [T1202]
