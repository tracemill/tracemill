type: job
name: Windows ComputerDefaults Spawning a Process
detection:
  source: escu
  name: "ESCU - Windows ComputerDefaults Spawning a Process - Rule"
  id: 697eb4c0-1008-4c3c-b5ae-7bd9b39adbd6
description: |
  Validates detection of ComputerDefaults.exe starting a child process:
  Sysmon EID 1 (Process Create) records an executable, for example
  C:\Temp\castlerat_SEMIFIX.exe, starting ComputerDefaults.exe at High
  integrity, and ComputerDefaults.exe starting a new process of that same
  executable at High integrity.
tags: [castle-rat]

mitre:
  tactics: [privilege-escalation, defense-evasion]
  techniques: [T1548.002]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  username:           gen.username()

workloads:
  - scenario: scenarios/windows/sysmon/process-create/computerdefaults-uac-bypass-chain
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      username:     ref.username
    expectation:
      expected: alert
      summary: "An executable starts ComputerDefaults.exe, and ComputerDefaults.exe starts a new High-integrity process of that executable"
      mitre:
        tactics: [privilege-escalation, defense-evasion]
        techniques: [T1548.002]
