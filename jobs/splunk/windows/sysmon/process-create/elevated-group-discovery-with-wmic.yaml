type: job
name: Elevated Group Discovery With Wmic
detection:
  source: escu
  name: "ESCU - Elevated Group Discovery With Wmic - Rule"
  id: 3f6bbf22-093e-4cb4-9641-83f47b8444b6
description: |
  Validates detection of wmic.exe reading the membership of a privileged
  Active Directory group through the WMI LDAP provider, which names the
  accounts worth stealing next. One arm per group name the rule scopes to,
  "Dns Admins" among them -- the spelling the rule matches, not the built-in
  DnsAdmins group. The control reads an ordinary group the same way.

mitre:
  tactics: [discovery]
  techniques: [T1069.002]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/process-create/wmic-ldap-group-member-query
    bindings:
      computer: ref.computer
    expectation:
      expected: alert
      summary: "The Domain Admins member list is read through the LDAP provider"
      mitre:
        tactics: [discovery]
        techniques: [T1069.002]

  - scenario: scenarios/windows/sysmon/process-create/wmic-ldap-group-member-query
    bindings:
      computer:   ref.computer
      group_name: Enterprise Admins
    expectation:
      expected: alert
      summary: "The forest-wide Enterprise Admins group is read the same way"
      mitre:
        tactics: [discovery]
        techniques: [T1069.002]

  - scenario: scenarios/windows/sysmon/process-create/wmic-ldap-group-member-query
    bindings:
      computer:   ref.computer
      group_name: Schema Admins
    expectation:
      expected: alert
      summary: "Schema Admins is read, the group that can rewrite the forest schema"
      mitre:
        tactics: [discovery]
        techniques: [T1069.002]

  - scenario: scenarios/windows/sysmon/process-create/wmic-ldap-group-member-query
    bindings:
      computer:   ref.computer
      group_name: Account Operators
    expectation:
      expected: alert
      summary: "Account Operators is read, a group that can create and reset accounts"
      mitre:
        tactics: [discovery]
        techniques: [T1069.002]

  - scenario: scenarios/windows/sysmon/process-create/wmic-ldap-group-member-query
    bindings:
      computer:   ref.computer
      group_name: Server Operators
    expectation:
      expected: alert
      summary: "Server Operators is read, a group that can log on to domain controllers"
      mitre:
        tactics: [discovery]
        techniques: [T1069.002]

  - scenario: scenarios/windows/sysmon/process-create/wmic-ldap-group-member-query
    bindings:
      computer:   ref.computer
      group_name: Protected Users
    expectation:
      expected: alert
      summary: "Protected Users is read, naming the accounts hardened against credential theft"
      mitre:
        tactics: [discovery]
        techniques: [T1069.002]

  - scenario: scenarios/windows/sysmon/process-create/wmic-ldap-group-member-query
    bindings:
      computer:   ref.computer
      group_name: Dns Admins
    expectation:
      expected: alert
      summary: "Dns Admins is read, the spelling the rule matches rather than the built-in DnsAdmins"
      mitre:
        tactics: [discovery]
        techniques: [T1069.002]

  - scenario: scenarios/windows/sysmon/process-create/wmic-ldap-group-member-query
    bindings:
      computer:   ref.computer
      group_name: Helpdesk
    expectation:
      expected: none
      summary: "An ordinary group is read through the same provider and query shape"
