type: job
name: Windows Security Account Manager Stopped
detection:
  source: escu
  name: "ESCU - Windows Security Account Manager Stopped - Rule"
  id: 69c12d59-d951-431e-ab77-ec426b8d65e6
description: |
  Validates detection of a request to stop the Security Accounts Manager
  service: Sysmon EID 1 (Process Create) records an executable in
  C:\Users\Public, for example mTEJH.exe, starting net.exe with the command
  line `stop "samss" /y`, and a second Sysmon EID 1 records net.exe starting
  net1.exe with the same arguments.
tags: [ryuk]
mitre:
  tactics: [impact]
  techniques: [T1489]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/process-create/net-stop-samss
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
    expectation:
      expected: alert
      summary: "net.exe and net1.exe start with stop \"samss\" /y"
      mitre:
        tactics: [impact]
        techniques: [T1489]
