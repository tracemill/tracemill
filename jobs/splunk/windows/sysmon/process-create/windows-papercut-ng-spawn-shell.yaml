type: job
name: Windows PaperCut NG Spawn Shell
detection:
  source: escu
  name: "ESCU - Windows PaperCut NG Spawn Shell - Rule"
  id: a602d9a2-aaea-45f8-bf0f-d851168d61ca
description: |
  Validates detection of the PaperCut NG application server starting a
  shell: Sysmon EID 1 (Process Create) records pc-app.exe, the Java runtime
  of the PaperCut NG service, running as NT AUTHORITY\SYSTEM and starting
  cmd.exe with a command line that runs PowerShell, and a second Sysmon
  EID 1 records the same process starting powershell.exe with an encoded
  command.

mitre:
  tactics: [execution, initial-access, persistence]
  techniques: [T1059, T1190, T1133]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/process-create/papercut-ng-spawns-shell
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
    expectation:
      expected: alert
      summary: "PaperCut NG's pc-app.exe starts cmd.exe and powershell.exe as NT AUTHORITY\\SYSTEM"
      mitre:
        tactics: [execution, initial-access, persistence]
        techniques: [T1059, T1190, T1133]
