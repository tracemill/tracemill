type: job
name: NLTest Domain Trust Discovery
detection:
  source: escu
  name: "ESCU - NLTest Domain Trust Discovery - Rule"
  id: c3e05466-5f22-11eb-ae93-0242ac130002
description: |
  Validates detection of nltest.exe enumerating the domain's trust
  relationships, which maps where a compromised account can reach beyond its
  own domain. Each switch is covered on its own as well as together, and a
  renamed copy alerts on the nltestrk.exe original file name. The control
  queries the host's secure channel, which names no trust.

mitre:
  tactics: [discovery]
  techniques: [T1482]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)

  file_version:       10.0.14393.3986 (rs1_release.201002-1707)
  integrity_level:    High
  hashes:             "MD5=4ADBAD5694EB3EBA955EC07D8C0D3078,SHA256=E683028BCFC99EFD1BE498359FB798A27505637C10951BD8D5CD91AD21981418,IMPHASH=4C049D80BB0FE7E8B0688666FFF88442"

workloads:
  - scenario: scenarios/windows/sysmon/process-create/nltest-domain-controller-query
    bindings:
      domain_short:        ref.domain_short
      domain_tld:          ref.domain_tld
      computer:            ref.computer
      file_version:        ref.file_version
      integrity_level:     ref.integrity_level
      hashes:              ref.hashes
      nltest_switch:       "/domain_trusts"
      command_line:        "nltest  /domain_trusts "
      parent_image:        'C:\Windows\System32\cmd.exe'
      parent_command_line: '"C:\Windows\system32\cmd.exe" /c "nltest /domain_trusts" '
    expectation:
      expected: alert
      summary: "nltest /domain_trusts enumerates the domain's trusts"
      mitre:
        tactics: [discovery]
        techniques: [T1482]

  - scenario: scenarios/windows/sysmon/process-create/nltest-domain-controller-query
    bindings:
      domain_short:        ref.domain_short
      domain_tld:          ref.domain_tld
      computer:            ref.computer
      file_version:        ref.file_version
      integrity_level:     ref.integrity_level
      hashes:              ref.hashes
      nltest_switch:       "/domain_trusts /all_trusts"
      parent_command_line: '"C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" '
    expectation:
      expected: alert
      summary: "The all_trusts form widens the query to every trust in the forest"
      mitre:
        tactics: [discovery]
        techniques: [T1482]

  - scenario: scenarios/windows/sysmon/process-create/nltest-domain-controller-query
    bindings:
      domain_short:    ref.domain_short
      domain_tld:      ref.domain_tld
      computer:        ref.computer
      file_version:    ref.file_version
      integrity_level: ref.integrity_level
      hashes:          ref.hashes
      nltest_switch:   "/all_trusts"
    expectation:
      expected: alert
      summary: "/all_trusts alerts on its own, though nltest answers it with usage text"
      mitre:
        tactics: [discovery]
        techniques: [T1482]

  - scenario: scenarios/windows/sysmon/process-create/nltest-domain-controller-query
    bindings:
      domain_short:    ref.domain_short
      domain_tld:      ref.domain_tld
      computer:        ref.computer
      file_version:    ref.file_version
      integrity_level: ref.integrity_level
      hashes:          ref.hashes
      nltest_switch:   "/domain_trusts"
      image:           "C:\\Temp\\nl.exe"
      exec_path:       "C:\\Temp\\nl.exe"
    expectation:
      expected: alert
      summary: "A renamed copy alerts on the nltestrk.exe original file name"
      mitre:
        tactics: [discovery]
        techniques: [T1482]

  - scenario: scenarios/windows/sysmon/process-create/nltest-domain-controller-query
    bindings:
      domain_short:    ref.domain_short
      domain_tld:      ref.domain_tld
      computer:        ref.computer
      file_version:    ref.file_version
      integrity_level: ref.integrity_level
      hashes:          ref.hashes
      nltest_switch:   "/query"
    expectation:
      expected: none
      summary: "nltest /query reports the secure channel status and names no trust"
