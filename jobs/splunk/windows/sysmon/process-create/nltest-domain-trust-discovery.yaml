type: job
name: NLTest Domain Trust Discovery
detection:
  source: escu
  name: "ESCU - NLTest Domain Trust Discovery - Rule"
  id: c3e05466-5f22-11eb-ae93-0242ac130002
description: |
  Validates detection of nltest.exe enumerating the domain's trust
  relationships, which maps where a compromised account can reach beyond its
  own domain. Both switches the rule names are covered, and a renamed copy
  alerts on the nltestrk.exe original file name. The control queries the
  host's secure channel, which names no trust.

mitre:
  tactics: [discovery]
  techniques: [T1482]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/process-create/nltest-domain-controller-query
    bindings:
      computer:      ref.computer
      nltest_switch: "/domain_trusts"
    expectation:
      expected: alert
      summary: "nltest /domain_trusts enumerates the domain's trusts"
      mitre:
        tactics: [discovery]
        techniques: [T1482]

  - scenario: scenarios/windows/sysmon/process-create/nltest-domain-controller-query
    bindings:
      computer:      ref.computer
      nltest_switch: "/domain_trusts /all_trusts"
    expectation:
      expected: alert
      summary: "The all_trusts form widens the query to every trust in the forest"
      mitre:
        tactics: [discovery]
        techniques: [T1482]

  - scenario: scenarios/windows/sysmon/process-create/nltest-domain-controller-query
    bindings:
      computer:      ref.computer
      nltest_switch: "/domain_trusts"
      image:         "C:\\Temp\\nl.exe"
      exec_path:     "C:\\Temp\\nl.exe"
    expectation:
      expected: alert
      summary: "A renamed copy alerts on the nltestrk.exe original file name"
      mitre:
        tactics: [discovery]
        techniques: [T1482]

  - scenario: scenarios/windows/sysmon/process-create/nltest-domain-controller-query
    bindings:
      computer:      ref.computer
      nltest_switch: "/query"
    expectation:
      expected: none
      summary: "nltest /query reports the secure channel status and names no trust"
