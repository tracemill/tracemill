type: job
name: Windows BitLocker Suspicious Command Usage
detection:
  source: escu
  name: "ESCU - Windows BitLocker Suspicious Command Usage - Rule"
  id: d0e6ec70-6e40-41a2-8b93-8d9ff077a746
description: |
  Validates detection of a request to remove the BitLocker key protectors
  from a volume: Sysmon EID 1 (Process Create) records cmd.exe starting
  manage-bde.exe at High integrity with the arguments `-protectors -delete`
  and a volume, for example C:. The event records the request, not whether
  any protector is removed.
tags: [shrinklocker]
mitre:
  tactics: [impact]
  techniques: [T1486, T1490]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/process-create/manage-bde-protectors-delete
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
    expectation:
      expected: alert
      summary: "manage-bde.exe starts with -protectors -delete C:"
      mitre:
        tactics: [impact]
        techniques: [T1486, T1490]
