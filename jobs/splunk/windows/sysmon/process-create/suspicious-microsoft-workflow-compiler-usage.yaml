type: job
name: Suspicious microsoft workflow compiler usage
detection:
  source: escu
  name: "ESCU - Suspicious microsoft workflow compiler usage - Rule"
  id: 9bbc62e8-55d8-11eb-ae93-0242ac130002
description: |
  Validates detection of the .NET Framework workflow compiler starting:
  Sysmon EID 1 (Process Create) records the launch of
  Microsoft.Workflow.Compiler.exe from its Framework64 directory, or of a
  copy saved under another name, for example svchost.exe.exe in C:\Temp,
  that still carries Microsoft.Workflow.Compiler.exe as its original file
  name. A parent process, for example powershell.exe, passes an XML
  parameters file on the command line.

mitre:
  tactics: [defense-evasion]
  techniques: [T1127]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  logon_guid_raw:     fn.upper(gen.uuid())
  logon_id_hex:       gen.hex(len=5, case=lower)
  parameters_file:    "C:\\AtomicRedTeam\\atomics\\T1218\\src\\T1218.xml"

workloads:
  - scenario: scenarios/windows/sysmon/process-create/workflow-compiler-launch
    bindings:
      domain_short:    ref.domain_short
      domain_tld:      ref.domain_tld
      computer:        ref.computer
      logon_guid_raw:  ref.logon_guid_raw
      logon_id_hex:    ref.logon_id_hex
      parameters_file: ref.parameters_file
    expectation:
      expected: alert
      summary: "The workflow compiler starts from its Framework64 directory"
      mitre:
        tactics: [defense-evasion]
        techniques: [T1127]

  - scenario: scenarios/windows/sysmon/process-create/workflow-compiler-launch
    bindings:
      domain_short:        ref.domain_short
      domain_tld:          ref.domain_tld
      computer:            ref.computer
      logon_guid_raw:      ref.logon_guid_raw
      logon_id_hex:        ref.logon_id_hex
      parameters_file:     ref.parameters_file
      image:               "C:\\Temp\\svchost.exe.exe"
      command_line:        "\"C:\\temp\\svchost.exe.exe\" ${ref.parameters_file}"
      current_directory:   "C:\\Users\\Administrator\\"
      parent_command_line: "\"C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe\" "
    expectation:
      expected: alert
      summary: "A copy of the workflow compiler starts as svchost.exe.exe"
      mitre:
        tactics: [defense-evasion]
        techniques: [T1127]
