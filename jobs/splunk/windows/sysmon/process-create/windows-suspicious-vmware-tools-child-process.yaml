type: job
name: Windows Suspicious VMWare Tools Child Process
detection:
  source: escu
  name: "ESCU - Windows Suspicious VMWare Tools Child Process - Rule"
  id: 1f77661a-0fe3-4b8d-a62c-7dff06906d26
description: |
  Validates detection of VMware Tools starting a command shell. Sysmon EID 1
  (Process Create) records vmtoolsd.exe, running as SYSTEM, starting cmd.exe
  with a recursive directory listing of the whole system drive redirected
  into a file under the Windows Temp directory.

mitre:
  tactics: [execution]
  techniques: [T1059]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  process_guid_raw:   fn.upper(gen.uuid())

workloads:
  - scenario: scenarios/windows/sysmon/process-create/vmware-tools-spawns-cmd
    bindings:
      domain_short:     ref.domain_short
      computer:         ref.computer
      process_guid_raw: ref.process_guid_raw
    expectation:
      expected: alert
      summary: "vmtoolsd.exe starts cmd.exe to list the system drive into a temporary file"
      mitre:
        tactics: [execution]
        techniques: [T1059]
      correlation:
        process_guid: ref.process_guid_raw
        dest:         ref.computer
