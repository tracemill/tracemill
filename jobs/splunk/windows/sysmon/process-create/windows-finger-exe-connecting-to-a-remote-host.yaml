type: job
name: Windows Finger.exe Connecting to a Remote Host
detection:
  source: escu
  name: "ESCU - Windows Finger.exe Connecting to a Remote Host - Rule"
  id: 86a5686a-7bc4-469c-9f88-2620279ede6e
description: |
  Validates detection of finger.exe querying a user on a remote host:
  Sysmon EID 1 (Process Create) records finger.exe starting with a
  `user@host` argument that names a remote host, for example an IPv4
  address, from a parent process such as cmd.exe or powershell.exe.
  finger.exe sends the request to the Finger service on that host and
  prints the reply to the console. The event records the command, not
  whether the remote host answered.
mitre:
  tactics: [command-and-control]
  techniques: [T1071]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  logon_guid_raw:     gen.uuid()
  logon_id_hex:       gen.hex(len=5, case=lower)
  cmd_record_id:      gen.int(min=5000, max=4999999)
  ps_record_id:       gen.int(min=5000000, max=9999999)

workloads:
  - scenario: scenarios/windows/sysmon/process-create/finger-remote-host-query
    bindings:
      domain_short:   ref.domain_short
      domain_tld:     ref.domain_tld
      computer:       ref.computer
      logon_guid_raw: ref.logon_guid_raw
      logon_id_hex:   ref.logon_id_hex
      record_id:      ref.cmd_record_id
    expectation:
      expected: alert
      summary: "cmd.exe starts finger.exe with a user@host argument"
      mitre:
        tactics: [command-and-control]
        techniques: [T1071]

  - scenario: scenarios/windows/sysmon/process-create/finger-remote-host-query
    bindings:
      domain_short:        ref.domain_short
      domain_tld:          ref.domain_tld
      computer:            ref.computer
      logon_guid_raw:      ref.logon_guid_raw
      logon_id_hex:        ref.logon_id_hex
      record_id:           ref.ps_record_id
      current_directory:   'C:\Sysmon\'
      command_line:        '"C:\Windows\system32\finger.exe" kali@10.0.2.13'
      parent_image:        'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
      parent_command_line: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
    expectation:
      expected: alert
      summary: "powershell.exe starts finger.exe with a user@host argument"
      mitre:
        tactics: [command-and-control]
        techniques: [T1071]
