type: job
name: Suspicious Process Executed From Container File
detection:
  source: escu
  name: "ESCU - Suspicious Process Executed From Container File - Rule"
  id: d8120352-3b62-411c-8cb6-7b47584dd5e8
description: |
  Validates detection of a script or executable opened from inside an
  archive file: Sysmon EID 1 (Process Create) records explorer.exe starting
  wscript.exe with a JScript file, for example can you cancel ideal image
  contract 79426.js, that sits in the folder Windows creates in the user's
  Temp directory when a file is opened from a zip archive.

mitre:
  tactics: [execution, defense-evasion]
  techniques: [T1204.002, T1036.008]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  user_name:          VICTIM
  logon_guid_raw:     gen.uuid()
  logon_id_hex:       gen.hex(len=5, case=lower)
  parent_guid_raw:    gen.uuid()
  parent_process_id:  gen.int(min=1000, max=9999)

workloads:
  - scenario: scenarios/windows/sysmon/process-create/wscript-runs-script-from-zip
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      user_name:         ref.user_name
      logon_guid_raw:    ref.logon_guid_raw
      logon_id_hex:      ref.logon_id_hex
      parent_guid_raw:   ref.parent_guid_raw
      parent_process_id: ref.parent_process_id
      archive_name:      Can_you_cancel_ideal_image_contract_95756.zip
      script_name:       can you cancel ideal image contract 79426.js
    expectation:
      expected: alert
      summary: "wscript.exe opens a .js file from a zip archive's Temp folder"
      mitre:
        tactics: [execution, defense-evasion]
        techniques: [T1204.002, T1036.008]
