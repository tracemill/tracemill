type: job
name: Windows UAC Bypass Suspicious Escalation Behavior
detection:
  source: escu
  name: "ESCU - Windows UAC Bypass Suspicious Escalation Behavior - Rule"
  id: 00d050d3-a5b4-4565-a6a5-a31f69681dc3
description: |
  Validates detection of a UAC bypass that raises a process chain from medium
  to high integrity: Sysmon EID 1 (Process Create) records cmd.exe at Medium
  integrity setting a command under the ms-settings protocol handler key and
  launching fodhelper.exe, fodhelper.exe created by that shell at High
  integrity, and cmd.exe created by fodhelper.exe at High integrity.

mitre:
  tactics: [privilege-escalation, defense-evasion]
  techniques: [T1548.002]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  username:           gen.username()
  process_guid_raw:   fn.upper(gen.uuid())
  process_guid:       "{${ref.process_guid_raw}}"

workloads:
  - scenario: scenarios/windows/sysmon/process-create/fodhelper-uac-bypass-chain
    bindings:
      domain_short:     ref.domain_short
      domain_tld:       ref.domain_tld
      computer:         ref.computer
      username:         ref.username
      process_guid_raw: ref.process_guid_raw
    expectation:
      expected: alert
      summary: "A medium-integrity cmd.exe starts fodhelper.exe at High integrity after an ms-settings handler hijack, and fodhelper.exe starts a High-integrity cmd.exe"
      mitre:
        tactics: [privilege-escalation, defense-evasion]
        techniques: [T1548.002]
      # Three joined tstats searches: the alert rows map back to no single event.
      correlation:
        dest:         ref.computer
        process_guid: ref.process_guid
