type: job
name: Wermgr Process Spawned CMD Or Powershell Process
detection:
  source: escu
  name: "ESCU - Wermgr Process Spawned CMD Or Powershell Process - Rule"
  id: e8fc95bc-a107-11eb-a978-acde48001122
description: |
  Validates detection of a command shell started by the Windows Error
  Reporting manager. Sysmon EID 1 (Process Create) records wermgr.exe
  starting cmd.exe with no arguments at High integrity, as a wermgr.exe
  process running TrickBot's code does. The event records the launch, not
  the commands the shell then ran.
tags: [trickbot]

mitre:
  tactics: [execution]
  techniques: [T1059]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/process-create/wermgr-spawns-cmd
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
    expectation:
      expected: alert
      summary: "wermgr.exe starts cmd.exe with no arguments"
      mitre:
        tactics: [execution]
        techniques: [T1059]
