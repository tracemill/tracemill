type: job
name: Windows Credential Dumping LSASS Memory Createdump
detection:
  source: escu
  name: "ESCU - Windows Credential Dumping LSASS Memory Createdump - Rule"
  id: b3b7ce35-fce5-4c73-85f4-700aeada81a9
description: |
  Validates detection of a process memory dump taken with createdump.exe,
  the crash dump generator that ships with the .NET runtime and PowerShell
  7. Sysmon EID 1 (Process Create) records createdump.exe, with original
  file name FX_VER_INTERNALNAME_STR, starting from the PowerShell 7 folder
  under a powershell.exe parent. The command line asks for a full dump (-u)
  of a target process id, for example that of lsass.exe, written to the
  file named by -f, for example dotnet-lsass.dmp in the user's
  AppData\Local\Temp folder. The event records the launch against that
  process id, not that the dump file was written or that credentials were
  read from it.
tags: [createdump]
mitre:
  tactics: [credential-access]
  techniques: [T1003.001]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/process-create/createdump-process-memory-dump
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
    expectation:
      expected: alert
      summary: "createdump.exe launched with -u and -f against a target process id"
      mitre:
        tactics: [credential-access]
        techniques: [T1003.001]
