type: job
name: Windows DotNet Binary in Non Standard Path
detection:
  source: escu
  name: "ESCU - Windows DotNet Binary in Non Standard Path - Rule"
  id: fddf3b56-7933-11ec-98a6-acde48001122
description: |
  Validates detection of a signed .NET Framework utility running from
  outside the Windows directories, using a copied binary to run code under a
  trusted signature. Sysmon EID 1 (Process Create) records a renamed copy of
  the installation utility started by a scripting host, once under a
  world-writable data folder and once under a temporary folder, its original
  file name unchanged.

mitre:
  tactics: [defense-evasion]
  techniques: [T1036.003, T1218.004]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  second_record_id:   gen.int(min=100000, max=199999)
  first_guid_raw:     fn.upper(gen.uuid())
  first_guid:         "{${ref.first_guid_raw}}"
  second_guid_raw:    fn.upper(gen.uuid())
  second_guid:        "{${ref.second_guid_raw}}"

workloads:
  - scenario: scenarios/windows/sysmon/process-create/dotnet-utility-outside-framework
    bindings:
      domain_short:     ref.domain_short
      domain_tld:       ref.domain_tld
      computer:         ref.computer
      process_guid_raw: ref.first_guid_raw
    expectation:
      expected: alert
      summary: "A renamed copy of the installation utility runs from a data folder"
      mitre:
        tactics: [defense-evasion]
        techniques: [T1036.003, T1218.004]
      # The rule filters its rows through a post-stats lookup, so match the row's process GUID and host.
      correlation:
        process_guid: ref.first_guid
        dest:         ref.computer

  - scenario: scenarios/windows/sysmon/process-create/dotnet-utility-outside-framework
    bindings:
      domain_short:     ref.domain_short
      domain_tld:       ref.domain_tld
      computer:         ref.computer
      event_record_id:  ref.second_record_id
      process_guid_raw: ref.second_guid_raw
      image:            'C:\Temp\installut.exe'
      exe_invoked:      'C:\temp\installut.exe'
    expectation:
      expected: alert
      summary: "A second renamed copy runs from a temporary folder"
      mitre:
        tactics: [defense-evasion]
        techniques: [T1036.003, T1218.004]
      correlation:
        process_guid: ref.second_guid
        dest:         ref.computer
