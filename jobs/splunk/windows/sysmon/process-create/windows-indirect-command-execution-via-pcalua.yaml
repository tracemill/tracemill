type: job
name: Windows Indirect Command Execution Via pcalua
detection:
  source: escu
  name: "ESCU - Windows Indirect Command Execution Via pcalua - Rule"
  id: 3428ac18-a410-4823-816c-ce697d26f7a8
description: |
  Validates detection of a program started through the Program Compatibility
  Assistant: Sysmon EID 1 (Process Create) records cmd.exe starting pcalua.exe
  with `-a` and the program to run, for example calc.exe or
  C:\Windows\System32\calc.exe, and a second Sysmon EID 1 records that
  program starting with pcalua.exe as its parent image.

mitre:
  tactics: [defense-evasion]
  techniques: [T1202]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:         gen.int(min=1000, max=4000)
  sysmon_tid:         gen.int(min=1000, max=9999)
  user_name:          Administrator
  logon_guid_raw:     fn.upper(gen.uuid())
  logon_id_hex:       gen.hex(len=6, case=lower)
  shell_guid_raw:     fn.upper(gen.uuid())
  shell_process_id:   gen.int(min=1000, max=9999)

workloads:
  - scenario: scenarios/windows/sysmon/process-create/pcalua-launch-program
    bindings:
      domain_short:     ref.domain_short
      domain_tld:       ref.domain_tld
      computer:         ref.computer
      sysmon_pid:       ref.sysmon_pid
      sysmon_tid:       ref.sysmon_tid
      user_name:        ref.user_name
      logon_guid_raw:   ref.logon_guid_raw
      logon_id_hex:     ref.logon_id_hex
      shell_guid_raw:   ref.shell_guid_raw
      shell_process_id: ref.shell_process_id
      program_argument: "calc.exe "
    expectation:
      expected: alert
      summary: "pcalua.exe -a starts calc.exe named without a path"
      mitre:
        tactics: [defense-evasion]
        techniques: [T1202]

  - scenario: scenarios/windows/sysmon/process-create/pcalua-launch-program
    bindings:
      domain_short:     ref.domain_short
      domain_tld:       ref.domain_tld
      computer:         ref.computer
      sysmon_pid:       ref.sysmon_pid
      sysmon_tid:       ref.sysmon_tid
      user_name:        ref.user_name
      logon_guid_raw:   ref.logon_guid_raw
      logon_id_hex:     ref.logon_id_hex
      shell_guid_raw:   ref.shell_guid_raw
      shell_process_id: ref.shell_process_id
      program_argument: "C:\\Windows\\System32\\calc.exe"
    expectation:
      expected: alert
      summary: "pcalua.exe -a starts calc.exe by its full path"
      mitre:
        tactics: [defense-evasion]
        techniques: [T1202]
