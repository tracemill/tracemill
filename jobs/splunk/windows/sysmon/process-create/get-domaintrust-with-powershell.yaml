type: job
name: Get-DomainTrust with PowerShell
detection:
  source: escu
  name: "ESCU - Get-DomainTrust with PowerShell - Rule"
  id: 4fa7f846-054a-11ec-a836-acde48001122
description: |
  Validates detection of PowerShell calling Get-DomainTrust, the PowerView
  function that enumerates domain trust relationships: Sysmon EID 1 (Process
  Create) records powershell.exe, started by cmd.exe and run by a user, for
  example a domain administrator, with a command line that fetches
  PowerView.ps1 from a URL with Invoke-WebRequest (IWR), runs it with
  Invoke-Expression (IEX) and then calls Get-DomainTrust.

tags: [powerview]
mitre:
  tactics: [discovery]
  techniques: [T1482]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  user_name:          Administrator

workloads:
  - scenario: scenarios/windows/sysmon/process-create/powerview-get-domaintrust
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      user_name:    ref.user_name
    expectation:
      expected: alert
      summary: "powershell.exe fetches PowerView from a URL and calls Get-DomainTrust"
      mitre:
        tactics: [discovery]
        techniques: [T1482]
