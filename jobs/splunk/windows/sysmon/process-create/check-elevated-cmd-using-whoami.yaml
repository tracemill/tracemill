type: job
name: Check Elevated CMD using whoami
detection:
  source: escu
  name: "ESCU - Check Elevated CMD using whoami - Rule"
  id: a9079b18-1633-11ec-859c-acde48001122
description: |
  Validates detection of a shell piping whoami group output through find
  looking for the high-integrity SID (T1033), a way to check the current
  process's privilege level without triggering a UAC prompt. A control
  runs whoami alone, with no pipe and no SID check, and must not fire.

mitre:
  tactics: [discovery]
  techniques: [T1033]

state:
  domain_short:      CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  username:           gen.username()

workloads:
  - scenario: scenarios/windows/sysmon/process-create/cmd-whoami-integrity-check
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      username:     ref.username
      piped_command: 'whoami /groups | find "12288"'
    expectation:
      expected: alert
      summary: "cmd.exe pipes whoami group output through find for the high-integrity SID"
      mitre:
        tactics: [discovery]
        techniques: [T1033]

  - scenario: scenarios/windows/sysmon/process-create/cmd-whoami-integrity-check
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      username:     ref.username
      piped_command: 'whoami /groups | find "Administrators"'
      # A script-host parent is faithful to the attack path but is itself
      # detected by a separate control; the specificity check must isolate the
      # command-line predicate, so it runs under an ordinary interactive parent.
      parent_image: C:\Windows\explorer.exe
      parent_command_line: C:\Windows\Explorer.EXE
    expectation:
      expected: none
      summary: "whoami piped to find on an unrelated string, with no script-host parent, does not match the piped-find-for-the-high-integrity-SID filter"
