type: job
name: Windows PowerShell Process With Malicious String
detection:
  source: escu
  name: "ESCU - Windows PowerShell Process With Malicious String - Rule"
  id: 5df35d50-e1a3-4a52-a337-92e69d9b1b8a
description: |
  Validates detection of PowerShell importing PowerView, the PowerSploit
  reconnaissance script, as a module. Sysmon EID 1 (Process Create) records
  powershell.exe, started by cmd.exe and run by a user, for example a domain
  administrator, with a command line that runs Import-Module on PowerView.ps1
  from a local directory, for example a PowerSploit download under the user's
  Downloads folder. The event records the import command, not any PowerView
  function that ran afterwards.

tags: [powerview]
mitre:
  tactics: [execution]
  techniques: [T1059.001]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  user_name:          Administrator
  # The rule filters through a lookup after tstats, so its alert is matched on
  # the result row; a per-run GUID keeps that match to this run's event.
  process_guid_raw:   fn.upper(gen.uuid())
  process_guid:       "{${ref.process_guid_raw}}"

workloads:
  - scenario: scenarios/windows/sysmon/process-create/powerview-import-module
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      user_name:    ref.user_name
      process_guid_raw: ref.process_guid_raw
      module_dir:   "C:\\Users\\${ref.user_name}\\Downloads\\PowerSploit-master\\Recon"
    expectation:
      expected: alert
      summary: "powershell.exe imports PowerView.ps1 from a PowerSploit download"
      mitre:
        tactics: [execution]
        techniques: [T1059.001]
      correlation:
        process_guid: ref.process_guid
