type: job
name: Dump LSASS via procdump
detection:
  source: escu
  name: "ESCU - Dump LSASS via procdump - Rule"
  id: 3742ebfe-64c2-11eb-ae93-0242ac130002
description: |
  Validates detection of ProcDump writing a full memory dump of a process
  that holds credential material, which can then be parsed offline rather
  than on the host. Arms cover a renamed copy caught by its version
  resource, the slash form of the dump flag, and the SamSs service as an
  alternate target. The control dumps a process that holds no credentials.

mitre:
  tactics: [credential-access]
  techniques: [T1003.001]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  tool_dir:           C:\AtomicRedTeam\atomics\T1003.001\bin

workloads:
  - scenario: scenarios/windows/sysmon/process-create/procdump-lsass-dump
    bindings:
      computer: ref.computer
    expectation:
      expected: alert
      summary: "procdump -ma writes a full dump of lsass.exe"
      mitre:
        tactics: [credential-access]
        techniques: [T1003.001]

  - scenario: scenarios/windows/sysmon/process-create/procdump-lsass-dump
    bindings:
      computer:            ref.computer
      image:               "${ref.tool_dir}\\notprocdump64.exe"
      command_line:        '"C:\AtomicRedTeam\atomics\T1003.001\bin\notprocdump.exe" -accepteula -ma lsass.exe C:\Windows\Temp\lsass_dump.dmp'
      parent_image:        "${ref.tool_dir}\\notprocdump.exe"
      parent_command_line: '"C:\AtomicRedTeam\atomics\T1003.001\bin\notprocdump.exe" -accepteula -ma lsass.exe C:\Windows\Temp\lsass_dump.dmp'
    expectation:
      expected: alert
      summary: "A renamed copy alerts on the procdump original file name"
      mitre:
        tactics: [credential-access]
        techniques: [T1003.001]

  - scenario: scenarios/windows/sysmon/process-create/procdump-lsass-dump
    bindings:
      computer:  ref.computer
      dump_flag: "/ma"
    expectation:
      expected: alert
      summary: "The slash form of the full-dump flag is equivalent"
      mitre:
        tactics: [credential-access]
        techniques: [T1003.001]

  - scenario: scenarios/windows/sysmon/process-create/procdump-lsass-dump
    bindings:
      computer:    ref.computer
      dump_target: samss
      dump_file:   C:\Windows\Temp\samss_dump.dmp
    expectation:
      expected: alert
      summary: "The SamSs service is dumped instead of lsass.exe"
      mitre:
        tactics: [credential-access]
        techniques: [T1003.001]

  - scenario: scenarios/windows/sysmon/process-create/procdump-lsass-dump
    bindings:
      computer:    ref.computer
      dump_target: notepad.exe
      dump_file:   C:\Windows\Temp\notepad_dump.dmp
    expectation:
      expected: none
      summary: "A dump of a process that holds no credential material"
