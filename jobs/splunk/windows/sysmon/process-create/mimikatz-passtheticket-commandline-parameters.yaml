type: job
name: Mimikatz PassTheTicket CommandLine Parameters
detection:
  source: escu
  name: "ESCU - Mimikatz PassTheTicket CommandLine Parameters - Rule"
  id: 13bbd574-83ac-11ec-99d4-acde48001122
description: |
  Validates detection of mimikatz running a Kerberos ticket command, either
  exporting the tickets held in LSASS or injecting one back into the current
  session, both of which let an operator authenticate as the ticket's owner
  without its password. The control runs the privilege command the operator
  issues first, which takes no tickets.

mitre:
  tactics: [credential-access]
  techniques: [T1550.003]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/process-create/mimikatz-kerberos-ticket-command
    bindings:
      computer:            ref.computer
    expectation:
      expected: alert
      summary: "mimikatz exports the tickets held in LSASS"
      mitre:
        tactics: [credential-access]
        techniques: [T1550.003]


  - scenario: scenarios/windows/sysmon/process-create/mimikatz-kerberos-ticket-command
    bindings:
      computer:            ref.computer
      command_line:        'mimikatz.exe  "kerberos::ptt [0;133115ef]-2-0-40e10000-Administrator@krbtgt-CORP.LOCAL.kirbi"'
    expectation:
      expected: alert
      summary: "mimikatz injects an exported ticket into the current session"
      mitre:
        tactics: [credential-access]
        techniques: [T1550.003]


  - scenario: scenarios/windows/sysmon/process-create/mimikatz-kerberos-ticket-command
    bindings:
      computer:            ref.computer
      command_line:        'mimikatz.exe  "privilege::debug" "exit"'
    expectation:
      expected: none
      summary: "The privilege command alone, which takes no tickets"

