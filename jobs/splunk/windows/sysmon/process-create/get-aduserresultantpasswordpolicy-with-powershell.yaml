type: job
name: Get ADUserResultantPasswordPolicy with PowerShell
detection:
  source: escu
  name: "ESCU - Get ADUserResultantPasswordPolicy with Powershell - Rule"
  id: 8b5ef342-065a-11ec-b0fc-acde48001122
description: |
  Validates detection of Get-ADUserResultantPasswordPolicy being run to read
  the password policy that applies to a user, which tells an attacker how
  many guesses a password-spray can afford before it locks the account out.
  Arms cover both shells the rule scopes to. The control reads the same
  policy objects through a cmdlet the rule does not name.

mitre:
  tactics: [discovery]
  techniques: [T1201]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/process-create/shell-ad-discovery-cmdlet
    bindings:
      computer: ref.computer
    expectation:
      expected: alert
      summary: "powershell.exe runs Get-ADUserResultantPasswordPolicy"
      mitre:
        tactics: [discovery]
        techniques: [T1201]

  - scenario: scenarios/windows/sysmon/process-create/shell-ad-discovery-cmdlet
    bindings:
      computer:            ref.computer
      image:               "C:\\Windows\\System32\\cmd.exe"
      original_file_name:  Cmd.Exe
      host_description:    Windows Command Processor
      file_version:        10.0.14393.0 (rs1_release.160715-1616)
      file_hash:           "MD5=F4F684066175B77E0C3A000549D2922C,SHA256=935C1861DF1F4018D698E8B65ABFA02D7E9037D8F68CA3C2065B6CA165D44AD2,IMPHASH=3062ED732D4B25D1C64F084DAC97D37A"
      command_line:        "cmd.exe  /c powershell.exe Get-ADUserResultantPasswordPolicy"
      parent_command_line: 'C:\Windows\system32\cmd.exe /c ""C:\Temp\ad2.bat" "'
    expectation:
      expected: alert
      summary: "The cmd.exe wrapper carries the cmdlet on its own command line"
      mitre:
        tactics: [discovery]
        techniques: [T1201]

  - scenario: scenarios/windows/sysmon/process-create/shell-ad-discovery-cmdlet
    bindings:
      computer: ref.computer
      cmdlet:   Get-ADFineGrainedPasswordPolicy
    expectation:
      expected: none
      summary: "A sibling cmdlet returns the same policy objects without being named by the rule"
