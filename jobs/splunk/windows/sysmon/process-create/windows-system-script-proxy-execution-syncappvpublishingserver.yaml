type: job
name: Windows System Script Proxy Execution Syncappvpublishingserver
detection:
  source: escu
  name: "ESCU - Windows System Script Proxy Execution Syncappvpublishingserver - Rule"
  id: 8dd73f89-682d-444c-8b41-8e679966ad3c
description: |
  Validates detection of the signed Windows script
  SyncAppvPublishingServer.vbs run through the Windows Script Host: Sysmon
  EID 1 (Process Create) records cmd.exe starting wscript.exe with a
  command line that runs C:\windows\system32\SyncAppvPublishingServer.vbs
  and passes a PowerShell command, for example "\n;Start-Process calc".

mitre:
  tactics: [defense-evasion]
  techniques: [T1216, T1218]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  user_name:          VICTIM
  logon_guid_raw:     fn.upper(gen.uuid())
  logon_id_hex:       gen.hex(len=6, case=lower)
  parent_guid_raw:    fn.upper(gen.uuid())
  parent_process_id:  gen.int(min=1000, max=9999)

workloads:
  - scenario: scenarios/windows/sysmon/process-create/wscript-syncappvpublishingserver-vbs-command
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      user_name:         ref.user_name
      logon_guid_raw:    ref.logon_guid_raw
      logon_id_hex:      ref.logon_id_hex
      parent_guid_raw:   ref.parent_guid_raw
      parent_process_id: ref.parent_process_id
      ps_command:        '\n;Start-Process calc'
    expectation:
      expected: alert
      summary: "wscript.exe runs SyncAppvPublishingServer.vbs with a PowerShell command"
      mitre:
        tactics: [defense-evasion]
        techniques: [T1216, T1218]
