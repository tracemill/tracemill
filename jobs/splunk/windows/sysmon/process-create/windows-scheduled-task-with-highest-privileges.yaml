type: job
name: Windows Scheduled Task with Highest Privileges
detection:
  source: escu
  name: "ESCU - Windows Scheduled Task with Highest Privileges - Rule"
  id: 2f15e1a4-0fc2-49dd-919e-cbbe60699218
description: |
  Validates detection of schtasks.exe creating a scheduled task with the
  highest run level: Sysmon EID 1 (Process Create) records cmd.exe
  starting schtasks.exe with `/create /f /sc onlogon /rl highest`, a task
  name, for example Roaming, and a task action (`/tr`) that starts a
  program in the user's profile, for example asyncrat.exe in
  AppData\Roaming.
tags: [asyncrat]
mitre:
  tactics: [execution, persistence, privilege-escalation]
  techniques: [T1053.005]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/process-create/schtasks-create-highest-runlevel
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
    expectation:
      expected: alert
      summary: "schtasks.exe creates a logon task with /rl highest"
      mitre:
        tactics: [execution, persistence, privilege-escalation]
        techniques: [T1053.005]
