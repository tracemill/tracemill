type: job
name: Windows Office Product Spawned Rundll32 With No DLL
detection:
  source: escu
  name: "ESCU - Windows Office Product Spawned Rundll32 With No DLL - Rule"
  id: f28e787e-69ca-480e-9f98-ab970e6d4bcc
description: |
  Validates detection of an Office application starting rundll32.exe on a
  file with no .dll extension. Sysmon EID 1 (Process Create) records
  EXCEL.EXE, opening a macro-enabled workbook, starting rundll32.exe on a
  relative path with an export, for example
  ..\oepddl.igk1,DllRegisterServer, as in IcedID phishing workbooks.
tags: [icedid]

mitre:
  tactics: [initial-access]
  techniques: [T1566.001]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/process-create/office-macro-spawns-rundll32
    bindings:
      domain_short: ref.domain_short
      computer:     ref.computer
    expectation:
      expected: alert
      summary: "EXCEL.EXE starts rundll32.exe on ..\\oepddl.igk1 with no .dll extension"
      mitre:
        tactics: [initial-access]
        techniques: [T1566.001]
