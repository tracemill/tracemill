type: job
name: Detect SharpHound Usage
detection:
  source: escu
  name: "ESCU - Detect SharpHound Usage - Rule"
  id: dd04b29a-beed-11eb-87bc-acde48001122
description: |
  Validates detection of the SharpHound Active Directory collector running,
  keyed on its process name or the original file name in its version
  resource. A renamed copy still alerts through the original file name. The
  control runs AzureHound, a sibling collector from the same family.

mitre:
  tactics: [discovery]
  techniques: [T1069.001, T1069.002, T1087.001, T1087.002, T1482]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/process-create/sharphound-collection
    bindings:
      computer: ref.computer
    expectation:
      expected: alert
      summary: "SharpHound runs under its own name"
      mitre:
        tactics: [discovery]
        techniques: [T1069.001, T1069.002, T1087.001, T1087.002, T1482]

  - scenario: scenarios/windows/sysmon/process-create/sharphound-collection
    bindings:
      computer:            ref.computer
      image:               "C:\\Temp\\notsharph.exe"
      command_line:        '"C:\temp\notsharph.exe" --CollectionMethod all'
      parent_image:        "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe"
      parent_command_line: '"C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe"'
    expectation:
      expected: alert
      summary: "A renamed copy runs; the original file name still identifies it"
      mitre:
        tactics: [discovery]
        techniques: [T1069.001, T1069.002, T1087.001, T1087.002, T1482]

  - scenario: scenarios/windows/sysmon/process-create/invoke-azurehound
    bindings:
      computer: ref.computer
    expectation:
      expected: none
      summary: "AzureHound runs under PowerShell; neither name matches"
