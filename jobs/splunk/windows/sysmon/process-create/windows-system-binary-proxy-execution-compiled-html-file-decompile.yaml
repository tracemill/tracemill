type: job
name: Windows System Binary Proxy Execution Compiled HTML File Decompile
detection:
  source: escu
  name: "ESCU - Windows System Binary Proxy Execution Compiled HTML File Decompile - Rule"
  id: 2acf0e19-4149-451c-a3f3-39cd3c77e37d
description: |
  Validates detection of the HTML Help viewer started to decompile a
  compiled HTML Help file: Sysmon EID 1 (Process Create) records cmd.exe
  starting C:\Windows\hh.exe with the -decompile switch, a .chm file and
  a destination directory, at high integrity under a local administrator
  account.

mitre:
  tactics: [defense-evasion]
  techniques: [T1218.001]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/process-create/hh-decompile-chm
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      user_name:    Administrator
      chm_path:     'C:\AtomicRedTeam\atomics\T1218.001\src\T1218.001.chm'
      output_dir:   'C:\AtomicRedTeam\atomics\T1218.001\src'
    expectation:
      expected: alert
      summary: "hh.exe runs with -decompile against a compiled HTML Help file"
      mitre:
        tactics: [defense-evasion]
        techniques: [T1218.001]
