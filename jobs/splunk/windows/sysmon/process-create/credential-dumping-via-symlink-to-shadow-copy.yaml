type: job
name: Credential Dumping via Symlink to Shadow Copy
detection:
  source: escu
  name: "ESCU - Credential Dumping via Symlink to Shadow Copy - Rule"
  id: c5eac648-fae0-4263-91a6-773df1f4c903
description: |
  Validates detection of cmd.exe creating a symbolic link to a Volume
  Shadow Copy device path via the built-in `mklink` command (T1003.003),
  a way to expose files that are normally locked while in use -- such as
  the NTDS.dit database or the SAM/SECURITY/SYSTEM registry hives -- for
  later reading through the link, without a specialized dumping tool.
  Two controls model legitimate cmd.exe activity that shares one of the
  two gating tokens but not both: reading a shadow copy device path
  without mklink, and creating a symlink to an ordinary network share
  (no shadow copy device path). Neither must fire.

mitre:
  tactics: [credential-access]
  techniques: [T1003.003]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  username:           gen.username()
  user:               "${ref.domain_short}\\${ref.username}"

workloads:
  - scenario: scenarios/windows/sysmon/process-create/cmd-mklink-shadow-copy
    bindings:
      computer:     ref.computer
      username:     ref.username
      user:         ref.user
      cmd_command:  "vssadmin.exe create shadow /for=C: & mklink /D C:\\Temp\\vssstore \\\\?\\GLOBALROOT\\Device\\HarddiskVolumeShadowCopy1"
    expectation:
      expected: alert
      summary: "cmd.exe creates a symlink to a Volume Shadow Copy device path"
      mitre:
        tactics: [credential-access]
        techniques: [T1003.003]

  - scenario: scenarios/windows/sysmon/process-create/cmd-mklink-shadow-copy
    bindings:
      computer:     ref.computer
      username:     ref.username
      user:         ref.user
      cmd_command:  "dir \\\\?\\GLOBALROOT\\Device\\HarddiskVolumeShadowCopy1\\Windows\\NTDS"
    expectation:
      expected: none
      summary: "Reading a shadow copy device path without mklink does not match the mklink-scoped filter"

  - scenario: scenarios/windows/sysmon/process-create/cmd-mklink-shadow-copy
    bindings:
      computer:     ref.computer
      username:     ref.username
      user:         ref.user
      cmd_command:  "mklink /D C:\\Users\\Public\\SharedLogs \\\\fileserver\\logs"
    expectation:
      expected: none
      summary: "A symlink to an ordinary network share (no shadow copy device path) does not match the shadow-copy-scoped filter"
