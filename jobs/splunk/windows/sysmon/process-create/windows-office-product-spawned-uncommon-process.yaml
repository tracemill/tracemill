type: job
name: Windows Office Product Spawned Uncommon Process
detection:
  source: escu
  name: "ESCU - Windows Office Product Spawned Uncommon Process - Rule"
  id: 55d8741c-fa32-4692-8109-410304961eb8
description: |
  Validates detection of an Office application starting regsvr32.exe:
  Sysmon EID 1 (Process Create) records EXCEL.EXE, opening an .xlsb
  workbook, starting regsvr32.exe with the -s switch to silently register a
  file with a .sys extension under C:\Users\Public\Libraries, as in IcedID
  phishing workbooks. A benign control models the Firefox post-update helper
  starting regsvr32.exe on the same host to silently register a DLL from the
  Firefox installation directory.
tags: [icedid]

mitre:
  tactics: [initial-access]
  techniques: [T1566.001]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  user_name:          Administrator
  logon_guid_raw:     fn.upper(gen.uuid())
  logon_id_hex:       gen.hex(len=6, case=lower)
  control_record_id:  gen.int(min=100000, max=199999)

workloads:
  - scenario: scenarios/windows/sysmon/process-create/excel-spawns-regsvr32
    bindings:
      domain_short:   ref.domain_short
      domain_tld:     ref.domain_tld
      computer:       ref.computer
      user_name:      ref.user_name
      logon_guid_raw: ref.logon_guid_raw
      logon_id_hex:   ref.logon_id_hex
    expectation:
      expected: alert
      summary: "EXCEL.EXE starts regsvr32.exe to silently register a .sys file under C:\\Users\\Public\\Libraries"
      mitre:
        tactics: [initial-access]
        techniques: [T1566.001]

  - scenario: scenarios/windows/sysmon/process-create/firefox-helper-regsvr32
    bindings:
      domain_short:    ref.domain_short
      domain_tld:      ref.domain_tld
      computer:        ref.computer
      user_name:       ref.user_name
      logon_guid_raw:  ref.logon_guid_raw
      logon_id_hex:    ref.logon_id_hex
      event_record_id: ref.control_record_id
    expectation:
      expected: none
      summary: "The Firefox post-update helper starts regsvr32.exe to silently register a Firefox DLL"
