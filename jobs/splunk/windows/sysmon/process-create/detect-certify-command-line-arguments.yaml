type: job
name: Detect Certify Command Line Arguments
detection:
  source: escu
  name: "ESCU - Detect Certify Command Line Arguments - Rule"
  id: e6d2dc61-a8b9-4b03-906c-da0ca75d71b8
description: |
  Validates detection of Certify and Certipy AD CS enumeration and abuse via
  Sysmon EID 1 process-create events (T1649, T1105). Covers certipy find, req,
  and auth subcommands alongside Certify find /vulnerable and request /ca
  variants, confirming the Endpoint.Processes tstats rule fires on each tool
  and subcommand pattern. The detection ANDs two token lists (an action word
  such as find/auth/req, and a flag such as -username/-u/-ca/*vulnerable*); a
  control matches only the action-word list to confirm the AND is enforced.
tags: [certify, certipy]
mitre:
  tactics: [credential-access, command-and-control]
  techniques: [T1649, T1105]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  username:            gen.username()
  user:                "${ref.domain_short}\\${ref.username}"
  ca_host:             "ca.${ref.domain_fqdn}"
  ca_name:             "Corporate Certificate Authority"
  template_name:       UserAuthentication
  target_user:         administrator
  certipy_image:       "C:\\Users\\${ref.username}\\Desktop\\certipy.exe"
  certify_image:       "C:\\Users\\${ref.username}\\Desktop\\Certify.exe"
  certipy_hashes:      "MD5=7A7DC777AD1EB059A120F382155497CB,SHA256=21AD41408CA97A5F8830AC482686F4F3E5A85A35B93808DEBC542F48D68D8812,IMPHASH=BA5546933531FAFA869B1F86A4E2A959"
  certify_hashes:      "MD5=C0552C81E78CDE0A3DB009DB32024FD7,SHA256=DB31650DC56C928D71F1EC0E8CBD6AE56849BF334D121F9BB9CE41090A23171D,IMPHASH=F34D5F2D4577ED6D9CEEC516C1F5A744"

workloads:
  - scenario: scenarios/windows/sysmon/process-create/certify-tool-execution
    bindings:
      domain_short:       ref.domain_short
      domain_tld:         ref.domain_tld
      computer:           ref.computer
      username:           ref.username
      user:               ref.user
      image:              ref.certipy_image
      command_line:       "certipy.exe  find -vulnerable -username ${ref.username}@${ref.domain_fqdn}"
      integrity_level:    High
      hashes:             ref.certipy_hashes
    expectation:
      expected: alert
      summary: "certipy.exe find -vulnerable -username fires the Certify command line detection"

  - scenario: scenarios/windows/sysmon/process-create/certify-tool-execution
    bindings:
      domain_short:       ref.domain_short
      domain_tld:         ref.domain_tld
      computer:           ref.computer
      username:           ref.username
      user:               ref.user
      image:              ref.certipy_image
      command_line:       "certipy.exe  req -u ${ref.username}@${ref.domain_fqdn} -ca \"${ref.ca_name}\" -target ${ref.ca_host} -template \"${ref.template_name}\" -upn ${ref.target_user}"
      integrity_level:    High
      hashes:             ref.certipy_hashes
    expectation:
      expected: alert
      summary: "certipy.exe req -u ... -ca ... fires the Certify command line detection"

  - scenario: scenarios/windows/sysmon/process-create/certify-tool-execution
    bindings:
      domain_short:       ref.domain_short
      domain_tld:         ref.domain_tld
      computer:           ref.computer
      username:           ref.username
      user:               ref.user
      image:              ref.certipy_image
      command_line:       "certipy.exe  auth -pfx ${ref.target_user}.pfx -username ${ref.target_user} -domain ${ref.domain_fqdn}"
      integrity_level:    High
      hashes:             ref.certipy_hashes
    expectation:
      expected: alert
      summary: "certipy.exe auth -pfx ... -username ... fires the Certify command line detection"

  - scenario: scenarios/windows/sysmon/process-create/certify-tool-execution
    bindings:
      domain_short:       ref.domain_short
      domain_tld:         ref.domain_tld
      computer:           ref.computer
      username:           ref.username
      user:               ref.user
      image:              ref.certify_image
      file_version:       "1.0.0.0"
      description:        Certify
      product:            Certify
      original_file_name: Certify.exe
      command_line:       "Certify.exe  find /vulnerable"
      integrity_level:    Medium
      hashes:             ref.certify_hashes
    expectation:
      expected: alert
      summary: "Certify.exe find /vulnerable fires the Certify command line detection"

  - scenario: scenarios/windows/sysmon/process-create/certify-tool-execution
    bindings:
      domain_short:       ref.domain_short
      domain_tld:         ref.domain_tld
      computer:           ref.computer
      username:           ref.username
      user:               ref.user
      image:              ref.certify_image
      file_version:       "1.0.0.0"
      description:        Certify
      product:            Certify
      original_file_name: Certify.exe
      command_line:       "Certify.exe  request /ca:\"${ref.ca_host}\\${ref.ca_name}\" /template:\"${ref.template_name}\" /altuser:${ref.target_user}"
      integrity_level:    Medium
      hashes:             ref.certify_hashes
    expectation:
      expected: alert
      summary: "Certify.exe request /ca:... fires the Certify command line detection"

  # Control: action word present (find) but no qualifying flag -- the AND
  # must not be satisfied by the action-word list alone.
  - scenario: scenarios/windows/sysmon/process-create/certify-tool-execution
    bindings:
      domain_short:       ref.domain_short
      domain_tld:         ref.domain_tld
      computer:           ref.computer
      username:           ref.username
      user:               ref.user
      image:              ref.certipy_image
      command_line:       "certipy.exe  find -debug"
      integrity_level:    High
      hashes:             ref.certipy_hashes
    expectation:
      expected: none
      summary: "certipy.exe find with no qualifying flag does not match the flag-scoped filter"
