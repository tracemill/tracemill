type: job
name: Windows Attempt To Stop Security Service
detection:
  source: escu
  name: "ESCU - Windows Attempt To Stop Security Service - Rule"
  id: 9ed27cea-4e27-4eff-b2c6-aac9e78a7517
description: |
  Validates detection of a request to stop a security service: Sysmon EID 1
  (Process Create) records cmd.exe starting sc.exe with a `stop` command line
  that names a security service, for example windefend, the Microsoft
  Defender Antivirus service.

mitre:
  tactics: [defense-impairment]
  techniques: [T1685]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  process_guid_raw:   fn.upper(gen.uuid())
  process_guid:       "{${ref.process_guid_raw}}"

workloads:
  - scenario: scenarios/windows/sysmon/process-create/sc-stop-security-service
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      process_guid: ref.process_guid
    expectation:
      expected: alert
      summary: "sc.exe starts with stop windefend"
      mitre:
        tactics: [defense-impairment]
        techniques: [T1685]
      # The rule keeps only rows a post-stats lookup marks as security
      # services, so the alert is matched on the surviving row.
      correlation:
        dest:         ref.computer
        process_guid: ref.process_guid
