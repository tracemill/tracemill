type: job
name: Windows Credential Target Information Structure in Commandline
detection:
  source: escu
  name: "ESCU - Windows Credential Target Information Structure in Commandline - Rule"
  id: f79c5d7a-dd99-4263-93e1-49ace5634c82
description: |
  Validates detection of a command line that carries a marshaled
  CREDENTIAL_TARGET_INFORMATION structure: Sysmon EID 1 (Process Create)
  records NetExec (nxc.exe) started with its coerce_plus module and the
  PetitPotam method, naming a listener as a host name followed by the
  marshaled structure that DNS-based Kerberos coercion attacks
  (CVE-2025-33073) use to spoof an SPN and redirect authentication.
tags: [netexec, cve-2025-33073]
mitre:
  tactics: [credential-access, command-and-control]
  techniques: [T1557.001, T1187, T1071.004]

state:
  domain_short: CORP
  domain_tld:   local
  host_short:   gen.hostname(class=windows-workstation)
  user_name:    gen.username()

workloads:
  - scenario: scenarios/windows/sysmon/process-create/netexec-coerce-plus
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      host_short:   ref.host_short
      user_name:    ref.user_name
    expectation:
      expected: alert
      summary: "NetExec runs coerce_plus with a listener name that carries a marshaled CREDENTIAL_TARGET_INFORMATION structure"
      mitre:
        tactics: [credential-access, command-and-control]
        techniques: [T1557.001, T1187, T1071.004]
