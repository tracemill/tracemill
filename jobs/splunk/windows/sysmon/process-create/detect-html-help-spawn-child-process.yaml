type: job
description: |
  Two attack workloads emit Sysmon EID 1 process-create events where the
  Microsoft HTML Help viewer hh.exe is the parent process spawning a child
  interpreter -- a hidden PowerShell carrying an encoded command and a
  command shell -- the parent-image basename the SPL filters on. Both
  exercise System Binary Proxy Execution via a compiled HTML Help (.chm)
  file and must trigger the detection.

  A third workload is the false-positive control: Explorer launches hh.exe
  to display a help file normally, so hh.exe appears only as the created
  process and never as a parent. It must not trigger the detection.

mitre:
  tactics: [defense-evasion]
  techniques: [T1218.001]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  username:            gen.username()

  # PowerShell child variant
  ps_image:               "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe"
  ps_original_file_name:  PowerShell.EXE
  ps_file_version:        "10.0.14393.206 (rs1_release.160915-0644)"
  ps_description:         Windows PowerShell
  ps_command_line:        '"C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" -WindowStyle Hidden -EncodedCommand '
  ps_current_directory:   "C:\\Windows\\system32\\"
  ps_hashes:              "MD5=097CE5761C89434367598B34FE32893B,SHA256=BA4038FD20E474C047BE8AAD5BFACDB1BFC1DDBE12F803F473B7918D8D819436,IMPHASH=CAEE994F79D85E47C06E5FA9CDEAE453"
  ps_parent_command_line: '"C:\Windows\hh.exe" "C:\Users\Administrator\Test.chm"'

  # Command-shell child variant
  cmd_image:               "C:\\Windows\\System32\\cmd.exe"
  cmd_original_file_name:  Cmd.Exe
  cmd_file_version:        "10.0.14393.0 (rs1_release.160715-1616)"
  cmd_description:         Windows Command Processor
  cmd_command_line:        '"C:\Windows\System32\cmd.exe" /c calc.exe'
  cmd_current_directory:   "C:\\Users\\ADMINI~1\\AppData\\Local\\Temp\\2\\"
  cmd_hashes:              "MD5=F4F684066175B77E0C3A000549D2922C,SHA256=935C1861DF1F4018D698E8B65ABFA02D7E9037D8F68CA3C2065B6CA165D44AD2,IMPHASH=3062ED732D4B25D1C64F084DAC97D37A"
  cmd_parent_command_line: 'hh.exe  C:\AtomicRedTeam\atomics\T1218.001\src\T1218.001.chm'

workloads:
  - scenario: scenarios/windows/sysmon/process-create/hh-spawn-child-process
    bindings:
      computer:            ref.computer
      username:            ref.username
      image:               ref.ps_image
      original_file_name:  ref.ps_original_file_name
      file_version:        ref.ps_file_version
      description:         ref.ps_description
      command_line:        ref.ps_command_line
      current_directory:   ref.ps_current_directory
      hashes:              ref.ps_hashes
      parent_command_line: ref.ps_parent_command_line
    expectation:
      expected: alert
      summary: hh.exe spawning a hidden PowerShell child fires the detection.

  - scenario: scenarios/windows/sysmon/process-create/hh-spawn-child-process
    bindings:
      computer:            ref.computer
      username:            ref.username
      image:               ref.cmd_image
      original_file_name:  ref.cmd_original_file_name
      file_version:        ref.cmd_file_version
      description:         ref.cmd_description
      command_line:        ref.cmd_command_line
      current_directory:   ref.cmd_current_directory
      hashes:              ref.cmd_hashes
      parent_command_line: ref.cmd_parent_command_line
    expectation:
      expected: alert
      summary: hh.exe spawning cmd.exe fires the detection.

  - scenario: scenarios/windows/sysmon/process-create/hh-launched-from-explorer
    bindings:
      computer:  ref.computer
      username:  ref.username
    expectation:
      expected: none
      summary: Explorer launching hh.exe (hh.exe is the child) must not fire.
