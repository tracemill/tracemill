type: job
name: Windows Credentials from Password Stores Creation
detection:
  source: escu
  name: "ESCU - Windows Credentials from Password Stores Creation - Rule"
  id: c0c5a479-bf57-4ca0-af3a-4c7081e5ba05
description: |
  Validates detection of cmdkey.exe storing a generic credential in Windows
  Credential Manager: Sysmon EID 1 (Process Create) records cmd.exe starting
  cmdkey.exe with `/generic:` naming the credential's target, for example
  127.0.0.2, `/user:` naming an account, for example SafeMode, and `/pass:`
  carrying its password in clear text.
tags: [darkgate]
mitre:
  tactics: [credential-access]
  techniques: [T1555]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/process-create/cmdkey-generic-credential-create
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
    expectation:
      expected: alert
      summary: "cmdkey.exe stores a generic credential with /generic and /user"
      mitre:
        tactics: [credential-access]
        techniques: [T1555]
