type: job
name: Credential Dumping via Copy Command from Shadow Copy
detection:
  source: escu
  name: "ESCU - Credential Dumping via Copy Command from Shadow Copy - Rule"
  id: d8c406fe-23d2-45f3-a983-1abe7b83ff3b
description: |
  Validates detection of cmd.exe copying a sensitive file (NTDS.dit or
  the SAM/SECURITY/SYSTEM registry hives) out of a Volume Shadow Copy
  (T1003.003). Copying an unrelated file must not fire.

mitre:
  tactics: [credential-access]
  techniques: [T1003.003]

state:
  domain_short:      CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  username:           gen.username()
  user:               "${ref.domain_short}\\${ref.username}"

workloads:
  - scenario: scenarios/windows/sysmon/process-create/cmd-copy-from-shadow-copy
    bindings:
      computer:     ref.computer
      username:     ref.username
      user:         ref.user
      copy_command: "copy \\\\?\\GLOBALROOT\\Device\\HarddiskVolumeShadowCopy1\\Windows\\NTDS\\NTDS.dit C:\\Windows\\Temp\\ntds.dit"
    expectation:
      expected: alert
      summary: "cmd.exe copies NTDS.dit out of a shadow copy"
      mitre:
        tactics: [credential-access]
        techniques: [T1003.003]

  - scenario: scenarios/windows/sysmon/process-create/cmd-copy-from-shadow-copy
    bindings:
      computer:     ref.computer
      username:     ref.username
      user:         ref.user
      copy_command: "copy C:\\Temp\\notes.txt C:\\Temp\\notes2.txt"
    expectation:
      expected: none
      summary: "Copying an unrelated file does not match the sensitive-path-scoped filter"
