type: job
name: Windows Diskshadow Proxy Execution
detection:
  source: escu
  name: "ESCU - Windows Diskshadow Proxy Execution - Rule"
  id: 58adae9e-8ea3-11ec-90f6-acde48001122
description: |
  Validates detection of diskshadow.exe running a script file in script
  mode: Sysmon EID 1 (Process Create) records powershell.exe starting
  diskshadow.exe with `-S` and the path of a script file, for example a .txt
  file, and a second Sysmon EID 1 records diskshadow.exe starting a program,
  for example calc.exe, as its child process.

mitre:
  tactics: [defense-evasion]
  techniques: [T1218]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:         gen.int(min=1000, max=4000)
  sysmon_tid:         gen.int(min=1000, max=9999)
  user_name:          Administrator
  logon_guid_raw:     fn.upper(gen.uuid())
  logon_id_hex:       gen.hex(len=6, case=lower)
  parent_guid_raw:    fn.upper(gen.uuid())
  parent_process_id:  gen.int(min=1000, max=9999)

workloads:
  - scenario: scenarios/windows/sysmon/process-create/diskshadow-script-mode
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      sysmon_pid:        ref.sysmon_pid
      sysmon_tid:        ref.sysmon_tid
      user_name:         ref.user_name
      logon_guid_raw:    ref.logon_guid_raw
      logon_id_hex:      ref.logon_id_hex
      parent_guid_raw:   ref.parent_guid_raw
      parent_process_id: ref.parent_process_id
    expectation:
      expected: alert
      summary: "diskshadow.exe -S runs a script file that starts calc.exe"
      mitre:
        tactics: [defense-evasion]
        techniques: [T1218]
