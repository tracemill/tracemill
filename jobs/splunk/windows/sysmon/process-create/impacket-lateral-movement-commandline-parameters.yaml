type: job
name: Impacket Lateral Movement Commandline Parameters
detection:
  source: escu
  name: "ESCU - Impacket Lateral Movement Commandline Parameters - Rule"
  id: 8ce07472-496f-11ec-ab3b-3e22fbd008af
description: |
  Validates detection of Impacket-style remote-execution command shells.
  The workload emits a Sysmon EID 1 process-create event for cmd.exe running
  a single command quietly and redirecting its output to a loopback admin share
  ("/Q /c <command> 1> \\127.0.0.1\ADMIN$\__<id> 2>&1"), the output-capture
  pattern these lateral-movement tools share.

tags: [impacket]
mitre:
  tactics: [lateral-movement]
  techniques: [T1021.003, T1021.002]

workloads:
  - scenario: scenarios/windows/sysmon/process-create/impacket-exec-cmd-redirect
    expectation:
      expected: alert
      summary: "Impacket Lateral Movement Commandline Parameters"
      mitre:
        tactics: [lateral-movement]
        techniques: [T1021.003, T1021.002]
