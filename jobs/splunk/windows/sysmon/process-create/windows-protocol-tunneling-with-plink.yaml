type: job
name: Windows Protocol Tunneling with Plink
detection:
  source: escu
  name: "ESCU - Windows Protocol Tunneling with Plink - Rule"
  id: 8aac5e1e-0fab-4437-af0b-c6e60af23eed
description: |
  Validates detection of the PuTTY command-line SSH client opening a tunnel.
  Sysmon EID 1 (Process Create) records powershell.exe starting plink.exe
  with a command line that connects over SSH to a remote host, for example
  example.com on port 443, passes a user name and password, and asks the
  remote host to forward a port to 127.0.0.1:3389 on the local machine (-R).
  The event records the launch and its command line, not whether the
  connection or the forward succeeded.
tags: [plink]
mitre:
  tactics: [command-and-control, lateral-movement]
  techniques: [T1572, T1021.004]

state:
  domain_short: CORP
  domain_tld:   local
  host_short:   gen.hostname(class=windows-workstation)

workloads:
  - scenario: scenarios/windows/sysmon/process-create/plink-ssh-reverse-tunnel
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      host_short:   ref.host_short
    expectation:
      expected: alert
      summary: "plink.exe opens an SSH connection with a remote forward to the local RDP port"
      mitre:
        tactics: [command-and-control, lateral-movement]
        techniques: [T1572, T1021.004]
