type: job
name: Windows Office Product Spawned Child Process For Download
detection:
  source: escu
  name: "ESCU - Windows Office Product Spawned Child Process For Download - Rule"
  id: f02b64b8-cbea-4f75-bf77-7a05111566b1
description: |
  Validates detection of an Office application starting a program that is
  not a web browser with a web address on its command line. Sysmon EID 1
  (Process Create) records POWERPNT.EXE starting mshta.exe with an https
  URL argument, for example a shortened link.

mitre:
  tactics: [initial-access]
  techniques: [T1566.001]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/process-create/office-app-spawns-url-fetcher
    bindings:
      domain_short: ref.domain_short
      computer:     ref.computer
    expectation:
      expected: alert
      summary: "POWERPNT.EXE starts mshta.exe with an https URL"
      mitre:
        tactics: [initial-access]
        techniques: [T1566.001]
