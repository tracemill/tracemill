type: job
name: Windows MSIExec Unregister DLLRegisterServer
detection:
  source: escu
  name: "ESCU - Windows MSIExec Unregister DLLRegisterServer - Rule"
  id: a27db3c5-1a9a-46df-a577-765d3f1a3c24
description: |
  Validates detection of the Windows Installer being run to unregister a DLL:
  Sysmon EID 1 (Process Create) records cmd.exe starting msiexec.exe with the
  `/z` switch and the path of a DLL, for example MSIRunner.dll, which makes
  msiexec.exe load the DLL and call its DllUnregisterServer export. The event
  records the launch and its command line, not whether the DLL loaded or what
  its export ran.
mitre:
  tactics: [defense-evasion]
  techniques: [T1218.007]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  logon_guid_raw:     fn.upper(gen.uuid())
  logon_id_hex:       gen.hex(len=6, case=lower)

workloads:
  - scenario: scenarios/windows/sysmon/process-create/msiexec-unregister-dll
    bindings:
      domain_short:   ref.domain_short
      domain_tld:     ref.domain_tld
      computer:       ref.computer
      logon_guid_raw: ref.logon_guid_raw
      logon_id_hex:   ref.logon_id_hex
    expectation:
      expected: alert
      summary: "msiexec.exe /z unregisters a DLL through its DllUnregisterServer export"
      mitre:
        tactics: [defense-evasion]
        techniques: [T1218.007]
