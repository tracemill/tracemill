type: job
name: Windows Mock Trusted Directory MSC File Creation
detection:
  source: escu
  name: "ESCU - Windows Mock Trusted Directory MSC File Creation - Rule"
  id: de8cc077-2dba-4060-af78-c98b3cfc5407
description: |
  Validates detection of an MSC file written to a mock trusted directory.
  Sysmon EID 11 (File Create) records a process, for example powershell.exe,
  writing a Microsoft Management Console (.msc) file, for example WmiMgmt.msc,
  into a look-alike of a trusted Windows directory, for example C:\Windows
  \System32 with a space after Windows. The event is evidence of the write. A
  console file there opens elevated without a UAC prompt only when an
  auto-elevating program such as mmc.exe loads it for a user in the local
  Administrators group.

mitre:
  tactics: [defense-evasion, privilege-escalation, persistence]
  techniques: [T1218.014, T1548.002, T1574]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  username:            gen.username()

workloads:
  - scenario: scenarios/windows/sysmon/file-create/mock-trusted-dir-msc-write
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      username:     ref.username
      image:        "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe"
      file_dir:     "C:\\Windows \\System32"
      file_name:    WmiMgmt.msc
    expectation:
      expected: alert
      summary: "powershell.exe writes WmiMgmt.msc into the mock directory C:\\Windows \\System32"
      mitre:
        tactics: [defense-evasion, privilege-escalation, persistence]
        techniques: [T1218.014, T1548.002, T1574]
