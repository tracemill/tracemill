type: job
name: Shai-Hulud 2 Exfiltration Artifact Files
detection:
  source: escu
  name: "ESCU - Shai-Hulud 2 Exfiltration Artifact Files - Rule"
  id: 9e7d3c0f-4a5b-6c8d-1e2f-3a4b5c6d7e8f
description: |
  Validates detection of Shai-Hulud 2.0 artifact files written to disk
  (T1074.001, T1552.001, T1195.002): Sysmon EID 11 (File Create) records a
  process, for example node.exe, writing cloud.json, contents.json,
  environment.json, truffleSecrets.json and actionsSecrets.json one after
  another into a repository folder under the user's profile. The events are
  evidence of the writes, not of what the files contain or of their
  exfiltration.
tags: [shai-hulud]

mitre:
  tactics: [collection, credential-access, initial-access]
  techniques: [T1074.001, T1552.001, T1195.002]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  username:           gen.username()

workloads:
  - scenario: scenarios/windows/sysmon/file-create/shai-hulud-exfil-artifact-write
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      username:     ref.username
    expectation:
      expected: alert
      summary: "node.exe writes cloud.json, contents.json, environment.json, truffleSecrets.json and actionsSecrets.json into a repository folder"
      mitre:
        tactics: [collection, credential-access, initial-access]
        techniques: [T1074.001, T1552.001, T1195.002]
