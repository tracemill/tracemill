type: job
name: Windows MsMpEng Writing to System32
detection:
  source: escu
  name: "ESCU - Windows MsMpEng Writing to System32 - Rule"
  id: dc615235-1241-411a-b170-b34a4c8924aa
description: |
  Validates detection of Microsoft Defender exploitation for privilege
  escalation (T1068, T1543.003): Sysmon EID 15 (FileCreateStreamHash) records
  the Defender antimalware service process, MsMpEng.exe, running as SYSTEM,
  writing a file under C:\Windows\System32, for example the driver file
  drivers\ypupsude.sys. The event is evidence of the write; a driver written
  there runs only once a service is registered for it and started.

mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1068, T1543.003]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/file-create/msmpeng-system32-driver-write
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
    expectation:
      expected: alert
      summary: "MsMpEng.exe writes ypupsude.sys into C:\\Windows\\System32\\drivers"
      mitre:
        tactics: [persistence, privilege-escalation]
        techniques: [T1068, T1543.003]
