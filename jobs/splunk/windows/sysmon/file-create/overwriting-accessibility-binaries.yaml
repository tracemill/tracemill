type: job
name: Overwriting Accessibility Binaries
detection:
  source: escu
  name: "ESCU - Overwriting Accessibility Binaries - Rule"
  id: 13c2f6c3-10c5-4deb-9ba1-7c4460ebe4ae
description: |
  Validates detection of accessibility program replacement (T1546.008): a
  process, for example cmd.exe, overwrites an accessibility program in
  C:\Windows\System32, for example sethc.exe (Sticky Keys). If the new file
  is a working program, invoking that feature at the Windows sign-in screen
  runs it as SYSTEM before anyone signs in.

mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1546.008]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/file-create/accessibility-binary-overwrite
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      image:        "C:\\Windows\\system32\\cmd.exe"
      file_name:    sethc.exe
    expectation:
      expected: alert
      summary: "cmd.exe overwrites C:\\Windows\\System32\\sethc.exe"
      mitre:
        tactics: [persistence, privilege-escalation]
        techniques: [T1546.008]
