type: job
name: Windows Credentials from Password Stores Chrome Copied in TEMP Dir
detection:
  source: escu
  name: "ESCU - Windows Credentials from Password Stores Chrome Copied in TEMP Dir - Rule"
  id: 4d14c86d-fdee-4393-94da-238d2706902f
description: |
  Validates detection of Chrome credential store files staged in the Temp
  folder: Sysmon EID 11 (File Create) records a process, for example
  python.exe running from the user's Downloads folder, creating a file with
  a Chrome credential store name, for example Login Data (the saved-login
  database) or Local State (the file that holds its encryption key), in a
  Chrome subfolder of a folder under the user's AppData\Local\Temp
  directory. The events are evidence of the file writes, not of the
  credentials being decrypted or sent off the host.
tags: [braodo]

mitre:
  tactics: [credential-access]
  techniques: [T1555.003]

state:
  domain_short:            CORP
  domain_tld:              local
  host_short:              gen.hostname(class=windows-workstation)
  process_guid_raw:        fn.upper(gen.uuid())
  process_guid:            "{${ref.process_guid_raw}}"
  process_id:              gen.int(min=1000, max=9999)
  sysmon_pid:              gen.int(min=1000, max=4000)
  sysmon_tid:              gen.int(min=1000, max=9999)
  login_data_record_id:    gen.int(min=100000, max=499999)
  local_state_record_id:   gen.int(min=500000, max=999999)

workloads:
  - scenario: scenarios/windows/sysmon/file-create/browser-credential-temp-write
    bindings:
      domain_short:    ref.domain_short
      domain_tld:      ref.domain_tld
      host_short:      ref.host_short
      process_guid:    ref.process_guid
      process_id:      ref.process_id
      sysmon_pid:      ref.sysmon_pid
      sysmon_tid:      ref.sysmon_tid
      event_record_id: ref.login_data_record_id
      store_dir:       "Chrome 0"
      file_name:       "Login Data"
    expectation:
      expected: alert
      summary: "python.exe writes Login Data into a Chrome subfolder of a folder in the user's Temp directory"
      mitre:
        tactics: [credential-access]
        techniques: [T1555.003]

  - scenario: scenarios/windows/sysmon/file-create/browser-credential-temp-write
    bindings:
      domain_short:    ref.domain_short
      domain_tld:      ref.domain_tld
      host_short:      ref.host_short
      process_guid:    ref.process_guid
      process_id:      ref.process_id
      sysmon_pid:      ref.sysmon_pid
      sysmon_tid:      ref.sysmon_tid
      event_record_id: ref.local_state_record_id
      store_dir:       "Chrome 0"
      file_name:       "Local State"
    expectation:
      expected: alert
      summary: "python.exe writes Local State into a Chrome subfolder of a folder in the user's Temp directory"
      mitre:
        tactics: [credential-access]
        techniques: [T1555.003]
