type: job
name: Spoolsv Writing a DLL - Sysmon
detection:
  source: escu
  name: "ESCU - Spoolsv Writing a DLL - Sysmon - Rule"
  id: 347fd388-da87-11eb-836d-acde48001122
description: |
  Validates detection of a print spooler driver DLL write: Sysmon EID 1
  (Process Create) records services.exe starting the Print Spooler service
  process, spoolsv.exe, as SYSTEM, and Sysmon EID 11 (File Create) records
  that process creating a DLL in the x64 printer driver directory, for
  example C:\Windows\System32\spool\drivers\x64\3\New\evil.dll, as a
  PrintNightmare (CVE-2021-34527) exploit makes it do. The events are
  evidence of the write, not of the DLL being loaded.
tags: [cve-2021-34527]

mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1547.012]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  file_dir:           "C:\\Windows\\System32\\spool\\drivers\\x64\\3\\New"
  file_name:          evil.dll

workloads:
  - scenario: scenarios/windows/sysmon/file-create/spoolsv-driver-dll-write
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      file_dir:     ref.file_dir
      file_name:    ref.file_name
    expectation:
      expected: alert
      summary: "spoolsv.exe writes evil.dll into the x64 printer driver directory"
      mitre:
        tactics: [persistence, privilege-escalation]
        techniques: [T1547.012]
