type: job
name: Samsam Test File Write
detection:
  source: escu
  name: "ESCU - Samsam Test File Write - Rule"
  id: 493a879d-519d-428f-8f57-a06a0fdc107e
description: |
  Validates detection of a SamSam ransomware test file write (T1486): Sysmon
  EID 11 (File Create) records a process, for example cmd.exe, creating
  test.txt directly in C:\Windows\System32. The event is evidence of the
  write, not of encryption.
tags: [samsam]

mitre:
  tactics: [impact]
  techniques: [T1486]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/file-create/samsam-test-file-write
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
    expectation:
      expected: alert
      summary: "cmd.exe creates test.txt in C:\\Windows\\System32"
      mitre:
        tactics: [impact]
        techniques: [T1486]
