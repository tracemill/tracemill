type: job
name: File with Samsam Extension
detection:
  source: escu
  name: "ESCU - File with Samsam Extension - Rule"
  id: 02c6cfc2-ae66-4735-bfc7-6291da834cbf
description: |
  Validates detection of a file written with an extension that SamSam
  ransomware gives the files it encrypts (T1486): Sysmon EID 11 (File
  Create) records a process, for example powershell.exe, creating a file
  such as malware.stubbin in a user's Downloads folder. The event is
  evidence of the write, not of encryption.
tags: [samsam]

mitre:
  tactics: [impact]
  techniques: [T1486]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  username:            gen.username()

workloads:
  - scenario: scenarios/windows/sysmon/file-create/ransomware-extension-write
    bindings:
      domain_short: ref.domain_short
      computer:     ref.computer
      username:     ref.username
      image:        "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe"
      file_dir:     "C:\\Users\\${ref.username}\\Downloads"
      file_name:    malware.stubbin
    expectation:
      expected: alert
      summary: "powershell.exe creates a file with the SamSam .stubbin extension in Downloads"
      mitre:
        tactics: [impact]
        techniques: [T1486]
