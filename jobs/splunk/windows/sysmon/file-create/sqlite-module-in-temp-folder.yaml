type: job
name: Sqlite Module In Temp Folder
detection:
  source: escu
  name: "ESCU - Sqlite Module In Temp Folder - Rule"
  id: 0f216a38-f45f-11eb-b09c-acde48001122
description: |
  Validates detection of an SQLite library module written into a user's
  temp folder (T1005): Sysmon EID 11 (File Create) records a process, for
  example a copy of rundll32.exe running from C:\Temp, creating
  sqlite32.dll or sqlite64.dll under the user's AppData\Local\Temp folder.
  The event is evidence of the write, not of the module being loaded or of
  any data being read.
tags: [icedid]

mitre:
  tactics: [collection]
  techniques: [T1005]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  username:           gen.username()
  process_guid_raw:   fn.upper(gen.uuid())
  process_guid:       "{${ref.process_guid_raw}}"
  process_id:         gen.int(min=1000, max=9999)
  sysmon_pid:         gen.int(min=1000, max=4000)

workloads:
  - scenario: scenarios/windows/sysmon/file-create/sqlite-module-temp-write
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      username:     ref.username
      process_guid: ref.process_guid
      process_id:   ref.process_id
      sysmon_pid:   ref.sysmon_pid
      file_name:    sqlite64.dll
    expectation:
      expected: alert
      summary: "A copy of rundll32.exe running from C:\\Temp writes sqlite64.dll into the user's temp folder"
      mitre:
        tactics: [collection]
        techniques: [T1005]

  - scenario: scenarios/windows/sysmon/file-create/sqlite-module-temp-write
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      username:     ref.username
      process_guid: ref.process_guid
      process_id:   ref.process_id
      sysmon_pid:   ref.sysmon_pid
      file_name:    sqlite32.dll
    expectation:
      expected: alert
      summary: "A copy of rundll32.exe running from C:\\Temp writes sqlite32.dll into the user's temp folder"
      mitre:
        tactics: [collection]
        techniques: [T1005]
