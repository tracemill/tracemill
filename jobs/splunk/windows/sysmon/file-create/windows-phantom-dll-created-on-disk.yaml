type: job
name: Windows Phantom DLL Created on Disk
detection:
  source: escu
  name: "ESCU - Windows Phantom DLL Created on Disk - Rule"
  id: 34cb2dfb-1dec-4b6b-bc72-c3904e5e4521
description: |
  Validates detection of a phantom DLL written into System32. Sysmon EID 11
  (File Create) records a process, for example the System process, creating a
  DLL that standard Windows installations do not ship but that a Windows
  component tries to load, for example C:\Windows\System32\phoneinfo.dll. A
  process that looks for the DLL loads it the next time it runs, with that
  process's privileges, which escalates privilege only when an unprivileged
  user caused the write. The event records the write, not the load.

mitre:
  tactics: [persistence, privilege-escalation, defense-evasion]
  techniques: [T1574.001, T1068]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/file-create/phantom-dll-system32-write
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      image:        System
      file_dir:     "C:\\Windows\\System32"
      file_name:    phoneinfo.dll
    expectation:
      expected: alert
      summary: "The System process writes phoneinfo.dll into C:\\Windows\\System32"
      mitre:
        tactics: [persistence, privilege-escalation, defense-evasion]
        techniques: [T1574.001, T1068]
