type: job
name: Msmpeng Application DLL Side Loading
detection:
  source: escu
  name: "ESCU - Msmpeng Application DLL Side Loading - Rule"
  id: 8bb3f280-dd9b-11eb-84d5-acde48001122
description: |
  Validates detection of msmpeng.exe and mpsvc.dll written together outside
  the Windows Defender install folder, the file layout of a DLL side-load of
  the Defender antimalware service executable. Sysmon EID 11 (File Create)
  records a process, for example cmd.exe, writing msmpeng.exe and then
  mpsvc.dll into one directory, for example C:\Windows, the pair the REvil
  dropper wrote in the attack on Kaseya VSA customers. The events are
  evidence of the writes, not of the DLL being loaded: it runs only if a copy
  of MsMpEng.exe is started from that directory.
tags: [revil]

mitre:
  tactics: [persistence, privilege-escalation, defense-evasion]
  techniques: [T1574.001]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/file-create/msmpeng-mpsvc-side-load-write
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      image:        "C:\\Windows\\system32\\cmd.exe"
      target_dir:   "C:\\Windows"
    expectation:
      expected: alert
      summary: "cmd.exe writes msmpeng.exe and mpsvc.dll into C:\\Windows"
      mitre:
        tactics: [persistence, privilege-escalation, defense-evasion]
        techniques: [T1574.001]
