type: job
name: Windows Outlook Macro Created by Suspicious Process
detection:
  source: escu
  name: "ESCU - Windows Outlook Macro Created by Suspicious Process - Rule"
  id: 3ec347e3-a94a-4a8b-a918-8306ea403182
description: |
  Validates detection of an Outlook VBA project write (T1137, T1059.005):
  Sysmon EID 11 (File Create) records a process, for example
  powershell.exe, writing VbaProject.OTM into a user's
  AppData\Roaming\Microsoft\Outlook folder, the file in which Outlook keeps
  the user's VBA macro project. The event is evidence of the write; Outlook
  runs macros in the project only when it loads the project and its macro
  security settings allow them.
tags: [notdoor]

mitre:
  tactics: [execution, persistence]
  techniques: [T1137, T1059.005]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  username:           gen.username()
  user:               "${ref.domain_short}\\${ref.username}"
  image:              "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe"

workloads:
  - scenario: scenarios/windows/sysmon/file-create/outlook-vba-project-write
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      username:     ref.username
      user:         ref.user
      image:        ref.image
    expectation:
      expected: alert
      summary: "powershell.exe writes VbaProject.OTM into the user's AppData\\Roaming\\Microsoft\\Outlook folder"
      mitre:
        tactics: [execution, persistence]
        techniques: [T1137, T1059.005]
