type: job
name: Windows Alternate DataStream - Base64 Content
detection:
  source: escu
  name: "ESCU - Windows Alternate DataStream - Base64 Content - Rule"
  id: 683f48de-982f-4a7e-9aac-9cec550da498
description: |
  Validates detection of a base64 payload hidden in an alternate data
  stream. Sysmon EID 15 (FileCreateStreamHash) records the PowerShell
  scripting environment writing a named stream onto a text file on the
  Desktop, together with the hash of the bytes written and the stream's
  base64 contents, which decode to a UTF-16 script.

mitre:
  tactics: [defense-evasion]
  techniques: [T1564.004]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  process_guid_raw:   fn.upper(gen.uuid())
  process_guid:       "{${ref.process_guid_raw}}"

workloads:
  - scenario: scenarios/windows/sysmon/file-create/alternate-data-stream-payload-write
    bindings:
      domain_short:     ref.domain_short
      computer:         ref.computer
      process_guid_raw: ref.process_guid_raw
    expectation:
      expected: alert
      summary: "A named stream on a Desktop text file is written with base64 content"
      mitre:
        tactics: [defense-evasion]
        techniques: [T1564.004]
      correlation:
        process_guid: ref.process_guid
        dest:         ref.computer
