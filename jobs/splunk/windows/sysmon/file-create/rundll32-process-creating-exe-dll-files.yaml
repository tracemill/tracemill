type: job
name: Rundll32 Process Creating Exe Dll Files
detection:
  source: escu
  name: "ESCU - Rundll32 Process Creating Exe Dll Files - Rule"
  id: 6338266a-ee2a-11eb-bf68-acde48001122
description: |
  Validates detection of rundll32.exe writing a DLL (T1218.011): Sysmon
  EID 11 (File Create) records rundll32.exe creating a randomly named DLL
  in a randomly named folder under a user's AppData\Local directory, as
  the IcedID loader does. The event is evidence of the write, not that
  the DLL is later loaded.
tags: [icedid]

mitre:
  tactics: [defense-evasion]
  techniques: [T1218.011]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  username:           gen.username()

workloads:
  - scenario: scenarios/windows/sysmon/file-create/rundll32-dll-write
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      username:     ref.username
    expectation:
      expected: alert
      summary: "rundll32.exe creates a randomly named DLL under the user's AppData\\Local directory"
      mitre:
        tactics: [defense-evasion]
        techniques: [T1218.011]
