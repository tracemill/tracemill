type: job
name: Windows Credentials from Web Browsers Saved in TEMP Folder
detection:
  source: escu
  name: "ESCU - Windows Credentials from Web Browsers Saved in TEMP Folder - Rule"
  id: b36b23ea-763c-417b-bd4a-6a378dabad1a
description: |
  Validates detection of browser credential files staged in the Temp folder:
  Sysmon EID 11 (File Create) records a process, for example python.exe
  running from the user's Downloads folder, creating a file with a browser
  credential file name, for example Firefox's logins.json or cookies.sqlite,
  or a file such as pass.txt or master_key.txt, in a per-browser subfolder of
  a folder under the user's AppData\Local\Temp directory. The events are
  evidence of the file writes, not of the credentials being decrypted or sent
  off the host.
tags: [braodo]

mitre:
  tactics: [credential-access]
  techniques: [T1555.003]

state:
  domain_short:            CORP
  domain_tld:              local
  host_short:              gen.hostname(class=windows-workstation)
  process_guid_raw:        fn.upper(gen.uuid())
  process_guid:            "{${ref.process_guid_raw}}"
  process_id:              gen.int(min=1000, max=9999)
  sysmon_pid:              gen.int(min=1000, max=4000)
  sysmon_tid:              gen.int(min=1000, max=9999)
  cookies_record_id:       gen.int(min=100000, max=249999)
  logins_record_id:        gen.int(min=250000, max=499999)
  master_key_record_id:    gen.int(min=500000, max=749999)
  pass_record_id:          gen.int(min=750000, max=999999)

workloads:
  - scenario: scenarios/windows/sysmon/file-create/browser-credential-temp-write
    bindings:
      domain_short:    ref.domain_short
      domain_tld:      ref.domain_tld
      host_short:      ref.host_short
      process_guid:    ref.process_guid
      process_id:      ref.process_id
      sysmon_pid:      ref.sysmon_pid
      sysmon_tid:      ref.sysmon_tid
      event_record_id: ref.cookies_record_id
      store_dir:       "firefox\\profile1"
      file_name:       "cookies.sqlite"
    expectation:
      expected: alert
      summary: "python.exe writes cookies.sqlite into a Firefox profile subfolder of a folder in the user's Temp directory"
      mitre:
        tactics: [credential-access]
        techniques: [T1555.003]

  - scenario: scenarios/windows/sysmon/file-create/browser-credential-temp-write
    bindings:
      domain_short:    ref.domain_short
      domain_tld:      ref.domain_tld
      host_short:      ref.host_short
      process_guid:    ref.process_guid
      process_id:      ref.process_id
      sysmon_pid:      ref.sysmon_pid
      sysmon_tid:      ref.sysmon_tid
      event_record_id: ref.logins_record_id
      store_dir:       "firefox\\profile1"
      file_name:       "logins.json"
    expectation:
      expected: alert
      summary: "python.exe writes logins.json into a Firefox profile subfolder of a folder in the user's Temp directory"
      mitre:
        tactics: [credential-access]
        techniques: [T1555.003]

  - scenario: scenarios/windows/sysmon/file-create/browser-credential-temp-write
    bindings:
      domain_short:    ref.domain_short
      domain_tld:      ref.domain_tld
      host_short:      ref.host_short
      process_guid:    ref.process_guid
      process_id:      ref.process_id
      sysmon_pid:      ref.sysmon_pid
      sysmon_tid:      ref.sysmon_tid
      event_record_id: ref.master_key_record_id
      store_dir:       "Chrome 0"
      file_name:       "master_key.txt"
    expectation:
      expected: alert
      summary: "python.exe writes master_key.txt into a Chrome subfolder of a folder in the user's Temp directory"
      mitre:
        tactics: [credential-access]
        techniques: [T1555.003]

  - scenario: scenarios/windows/sysmon/file-create/browser-credential-temp-write
    bindings:
      domain_short:    ref.domain_short
      domain_tld:      ref.domain_tld
      host_short:      ref.host_short
      process_guid:    ref.process_guid
      process_id:      ref.process_id
      sysmon_pid:      ref.sysmon_pid
      sysmon_tid:      ref.sysmon_tid
      event_record_id: ref.pass_record_id
      store_dir:       "Chrome 0"
      file_name:       "pass.txt"
    expectation:
      expected: alert
      summary: "python.exe writes pass.txt into a Chrome subfolder of a folder in the user's Temp directory"
      mitre:
        tactics: [credential-access]
        techniques: [T1555.003]
