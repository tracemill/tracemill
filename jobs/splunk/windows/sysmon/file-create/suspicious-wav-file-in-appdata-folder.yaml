type: job
name: Suspicious WAV file in Appdata Folder
detection:
  source: escu
  name: "ESCU - Suspicious WAV file in Appdata Folder - Rule"
  id: 5be109e6-1ac5-11ec-b421-acde48001122
description: |
  Validates detection of a WAV audio file written under AppData (T1113):
  Sysmon EID 1 (Process Create) records a process, for example a copy of the
  Windows command processor, starting from the user's roaming AppData folder,
  and Sysmon EID 11 (File Create) records the same process writing a WAV file,
  for example audio\2021-09-09-17.40.wav, into that AppData\Roaming tree. The
  events are evidence of the WAV file write, not of a recording or of
  exfiltration.
tags: [remcos]

mitre:
  tactics: [collection]
  techniques: [T1113]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  user_name:          Administrator
  target_filename:    "C:\\Users\\${ref.user_name}\\AppData\\Roaming\\audio\\2021-09-09-17.40.wav"

workloads:
  - scenario: scenarios/windows/sysmon/file-create/audio-capture-wav-write
    bindings:
      domain_short:    ref.domain_short
      domain_tld:      ref.domain_tld
      computer:        ref.computer
      user_name:       ref.user_name
      target_filename: ref.target_filename
    expectation:
      expected: alert
      summary: "A process running from AppData\\Roaming writes a WAV file into an audio folder in the same tree"
      mitre:
        tactics: [collection]
        techniques: [T1113]
      correlation:
        dest:      ref.computer
        file_path: ref.target_filename
