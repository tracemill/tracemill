type: job
name: Trickbot Named Pipe
detection:
  source: escu
  name: "ESCU - Trickbot Named Pipe - Rule"
  id: 1804b0a4-a682-11eb-8f68-acde48001122
description: |
  Validates detection of a named pipe created with the logged name
  \pipe\pidplacesomepipe: Sysmon EID 17 (Pipe Created) records a process,
  for example PowerShell_ISE.exe, creating the pipe.

mitre:
  tactics: [defense-evasion, privilege-escalation]
  techniques: [T1055]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/named-pipe/placesomepipe-pipe-create
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
    expectation:
      expected: alert
      summary: "PowerShell_ISE.exe creates the pipe \\pipe\\pidplacesomepipe"
      mitre:
        tactics: [defense-evasion, privilege-escalation]
        techniques: [T1055]
