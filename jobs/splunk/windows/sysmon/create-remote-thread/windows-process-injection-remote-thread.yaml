type: job
name: Windows Process Injection Remote Thread
detection:
  source: escu
  name: "ESCU - Windows Process Injection Remote Thread - Rule"
  id: 8a618ade-ca8f-4d04-b972-2d526ba59924
description: |
  Validates detection of a remote thread started inside a running Windows
  process: Sysmon EID 8 (CreateRemoteThread) records a source process, for
  example a 32-bit wermgr.exe running from SysWOW64, creating a thread in a
  target process, for example explorer.exe, Taskmgr.exe, rdpclip.exe or
  PING.EXE, with no start module or start function resolved for the
  thread's start address.
tags: [qakbot]

mitre:
  tactics: [defense-evasion, privilege-escalation]
  techniques: [T1055.002]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  source_guid_raw:    fn.upper(gen.uuid())
  source_process_id:  gen.int(min=1000, max=9999)

workloads:
  - scenario: scenarios/windows/sysmon/create-remote-thread/wermgr-remote-thread-injection
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      source_guid_raw:   ref.source_guid_raw
      source_process_id: ref.source_process_id
      target_image:      "C:\\Windows\\explorer.exe"
      start_address:     "0x0000000002D00000"
    expectation:
      expected: alert
      summary: "wermgr.exe creates a remote thread inside explorer.exe"
      mitre:
        tactics: [defense-evasion, privilege-escalation]
        techniques: [T1055.002]

  - scenario: scenarios/windows/sysmon/create-remote-thread/wermgr-remote-thread-injection
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      source_guid_raw:   ref.source_guid_raw
      source_process_id: ref.source_process_id
      target_image:      "C:\\Windows\\System32\\Taskmgr.exe"
      start_address:     "0x0000000000C20000"
    expectation:
      expected: alert
      summary: "wermgr.exe creates a remote thread inside Taskmgr.exe"
      mitre:
        tactics: [defense-evasion, privilege-escalation]
        techniques: [T1055.002]

  - scenario: scenarios/windows/sysmon/create-remote-thread/wermgr-remote-thread-injection
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      source_guid_raw:   ref.source_guid_raw
      source_process_id: ref.source_process_id
      target_image:      "C:\\Windows\\System32\\rdpclip.exe"
      start_address:     "0x0000000000760000"
    expectation:
      expected: alert
      summary: "wermgr.exe creates a remote thread inside rdpclip.exe"
      mitre:
        tactics: [defense-evasion, privilege-escalation]
        techniques: [T1055.002]

  - scenario: scenarios/windows/sysmon/create-remote-thread/wermgr-remote-thread-injection
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      source_guid_raw:   ref.source_guid_raw
      source_process_id: ref.source_process_id
      target_image:      "C:\\Windows\\System32\\PING.EXE"
      start_address:     "0x0000000000850000"
    expectation:
      expected: alert
      summary: "wermgr.exe creates a remote thread inside PING.EXE"
      mitre:
        tactics: [defense-evasion, privilege-escalation]
        techniques: [T1055.002]
