type: job
name: LOLBAS Rare Network Connection
detection:
  source: escu
  name: "ESCU - LOLBAS Rare Network Connection - Rule"
  id: d09b66cc-269b-4675-81b5-a3dabe4f5ac2
description: |
  Validates detection of a signed Windows binary with no reason to reach the
  internet, such as stordiag.exe, opening an outbound connection to a public
  address. Sysmon EID 3 (Network Connect) records the image and destination.
  Benign controls model an unlisted binary and the same binary reaching an
  internal address.

mitre:
  tactics: [command-and-control, defense-evasion, exfiltration]
  techniques: [T1105, T1218, T1567]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/network-connect/lolbas-outbound-connection
    bindings:
      computer: ref.computer
    expectation:
      expected: alert
      summary: "stordiag.exe opens an outbound TLS connection to a public address"
      mitre:
        tactics: [command-and-control, defense-evasion, exfiltration]
        techniques: [T1105, T1218, T1567]

  - scenario: scenarios/windows/sysmon/network-connect/lolbas-outbound-connection
    bindings:
      computer:      ref.computer
      image:            "C:\\Windows\\System32\\cmd.exe"
      dest_ip:          137.117.109.130
      dest_hostname:    ""
      source_port_name: ""
      rule_name:        ""
      provider_guid:    "{5770385F-C22A-43E0-BF4C-06F5698FFBD9}"
      process_guid_raw: fn.upper(gen.uuid())
    expectation:
      expected: none
      summary: "A console opens the same connection, which the rule does not list"

  - scenario: scenarios/windows/sysmon/network-connect/lolbas-outbound-connection
    bindings:
      computer:      ref.computer
      dest_ip:       192.168.1.10
      dest_hostname: fileserver.lan.local
    expectation:
      expected: none
      summary: "The same binary reaches an internal address, which the rule excludes"
