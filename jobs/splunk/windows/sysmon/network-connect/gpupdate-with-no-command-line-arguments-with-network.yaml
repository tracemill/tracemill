type: job
name: GPUpdate with no Command Line Arguments with Network
detection:
  source: escu
  name: "ESCU - GPUpdate with no Command Line Arguments with Network - Rule"
  id: 2c853856-a140-11eb-a5b5-acde48001122
description: |
  Validates detection of gpupdate.exe started with no command-line arguments
  and then opening an outbound network connection. Sysmon EID 1 (Process
  Create) records Microsoft Word starting the 32-bit
  C:\Windows\SysWOW64\gpupdate.exe with a command line that is only its
  image path, and Sysmon EID 3 (Network Connect) records the same process
  connecting to a public address on port 443, for example 34.218.235.219.
  The events record the launch and the connection, not what code ran inside
  the process.
tags: [cobalt-strike]

mitre:
  tactics: [defense-evasion]
  techniques: [T1055]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  user_name:          gen.username()

workloads:
  - scenario: scenarios/windows/sysmon/network-connect/gpupdate-no-args-network-connect
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      user_name:    ref.user_name
    expectation:
      expected: alert
      summary: "Microsoft Word starts gpupdate.exe with no arguments and the process connects to a public address on port 443"
      mitre:
        tactics: [defense-evasion]
        techniques: [T1055]
      correlation:
        dest:      ref.computer
        process:   "C:\\Windows\\SysWOW64\\gpupdate.exe"
        user:      ref.user_name
        dest_port: "443"
