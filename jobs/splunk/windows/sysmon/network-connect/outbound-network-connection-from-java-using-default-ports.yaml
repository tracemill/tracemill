type: job
name: Outbound Network Connection from Java Using Default Ports
detection:
  source: escu
  name: "ESCU - Outbound Network Connection from Java Using Default Ports - Rule"
  id: d2c14d28-5c47-11ec-9892-acde48001122
description: |
  Validates detection of a Java process opening an outbound connection to an
  LDAP or RMI port. Sysmon EID 1 (Process Create) records java.exe starting a
  Java server application, for example an Apache ActiveMQ broker, and Sysmon
  EID 3 (Network Connect) records the same process initiating a TCP
  connection to a remote host on an LDAP or RMI port, for example 1389.

mitre:
  tactics: [initial-access, persistence]
  techniques: [T1190, T1133]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  user_name:          Administrator
  image:              "C:\\Program Files (x86)\\Java\\jre1.8.0_491\\bin\\java.exe"
  dest_port:          1389

workloads:
  - scenario: scenarios/windows/sysmon/network-connect/java-outbound-ldap-rmi-port
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      user_name:    ref.user_name
      image:        ref.image
      dest_port:    ref.dest_port
    expectation:
      expected: alert
      summary: "java.exe starts a Java server application and connects out to an LDAP port"
      mitre:
        tactics: [initial-access, persistence]
        techniques: [T1190, T1133]
      correlation:
        dest:         ref.computer
        process_path: ref.image
        dest_port:    ref.dest_port
