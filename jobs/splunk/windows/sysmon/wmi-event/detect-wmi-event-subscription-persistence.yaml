type: job
name: Detect WMI Event Subscription Persistence
detection:
  source: escu
  name: "ESCU - Detect WMI Event Subscription Persistence - Rule"
  id: 01d9a0c2-cece-11eb-ab46-acde48001122
description: |
  Validates detection of a WMI event consumer being registered or removed
  (T1546.003). The control binds a filter to the same consumer, which is part
  of the same subscription but a different event.

mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1546.003]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  username:           gen.username()

workloads:
  - scenario: scenarios/windows/sysmon/wmi-event/command-line-consumer
    bindings:
      computer: ref.computer
      username: ref.username
    expectation:
      expected: alert
      summary: "A command-line event consumer is registered"
      mitre:
        tactics: [persistence, privilege-escalation]
        techniques: [T1546.003]

  - scenario: scenarios/windows/sysmon/wmi-event/command-line-consumer
    bindings:
      computer:  ref.computer
      username:  ref.username
      operation: Deleted
    expectation:
      expected: alert
      summary: "The same consumer is removed"
      mitre:
        tactics: [persistence, privilege-escalation]
        techniques: [T1546.003]

  - scenario: scenarios/windows/sysmon/wmi-event/filter-consumer-binding
    bindings:
      computer: ref.computer
      username: ref.username
    expectation:
      expected: none
      summary: "A filter is bound to the consumer; the binding is not a consumer event"
