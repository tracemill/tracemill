type: job
name: WMI Permanent Event Subscription - Sysmon
detection:
  source: escu
  name: "ESCU - WMI Permanent Event Subscription - Sysmon - Rule"
  id: ad05aae6-3b2a-4f73-af97-57bd26cee3b9
description: |
  Validates detection of a permanent WMI event subscription being created:
  Sysmon EID 21 (WmiEventConsumerToFilter) records a user binding an event
  filter to a command-line event consumer of the same name in the
  root\subscription namespace. The event records the binding, not the
  consumer's command running.

mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1546.003]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  username:           gen.username()

workloads:
  - scenario: scenarios/windows/sysmon/wmi-event/filter-consumer-binding
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      username:     ref.username
    expectation:
      expected: alert
      summary: "An event filter is bound to a command-line event consumer"
      mitre:
        tactics: [persistence, privilege-escalation]
        techniques: [T1546.003]
