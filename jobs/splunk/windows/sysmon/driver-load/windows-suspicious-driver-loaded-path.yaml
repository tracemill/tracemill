type: job
name: Windows Suspicious Driver Loaded Path
detection:
  source: escu
  name: "ESCU - Windows Suspicious Driver Loaded Path - Rule"
  id: 2ca1c4a1-8342-4750-9363-905650e0c933
description: |
  Validates detection of a kernel driver loaded from a directory that does
  not normally hold drivers: Sysmon EID 6 (Driver Loaded) records the WinRing0
  hardware-access driver, signed by Noriyuki MIYAZAKI, loaded from a path such
  as C:\Windows\Fonts\WinRing0x64.sys.

tags: [xmrig]
mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1543.003]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/driver-load/winring0-driver-load
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
    expectation:
      expected: alert
      summary: "The WinRing0 driver is loaded from C:\\Windows\\Fonts"
      mitre:
        tactics: [persistence, privilege-escalation]
        techniques: [T1543.003]
