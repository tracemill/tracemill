type: job
name: Windows Data Destruction Recursive Exec Files Deletion
detection:
  source: escu
  name: "ESCU - Windows Data Destruction Recursive Exec Files Deletion - Rule"
  id: 3596a799-6320-4a2f-8772-a9e98ddb2960
description: |
  Validates detection of a wiper deleting executable files in bulk: Sysmon
  EID 23 (File Delete) records a single process, for example
  swiftslicer.exe, deleting more than a hundred executable, driver and DLL
  files, for example under C:\Boot and C:\Program Files, as one user on one
  host within a two-minute window. Each event carries the deleted file's
  hashes and shows that Sysmon archived a copy of it.

mitre:
  tactics: [impact]
  techniques: [T1485]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  user_name:          Administrator
  image:              "C:\\Temp\\swiftslicer.exe"
  process_guid_raw:   fn.upper(gen.uuid())
  process_id:         gen.int(min=1000, max=9999)
  sysmon_pid:         gen.int(min=1000, max=4000)
  sysmon_tid:         gen.int(min=1000, max=9999)

pools:
  - id: deleted-executables
    sampling:
      mode: round_robin
    csv:
      data: |
        file_dir,file_name,hashes
