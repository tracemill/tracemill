type: job
name: Excessive File Deletion In WinDefender Folder
detection:
  source: escu
  name: "ESCU - Excessive File Deletion In WinDefender Folder - Rule"
  id: b5baa09a-7a05-11ec-8da4-acde48001122
description: |
  Validates detection of mass file deletion in the Windows Defender data
  folder: Sysmon EID 23 (File Delete) records one process, for example
  powershell.exe running as SYSTEM, deleting more than fifty files under
  C:\ProgramData\Microsoft\Windows Defender on one host, for example
  signature definition backups, platform resource files, scan history and a
  scan cache file. The events show the files' deletion, not whether Defender
  keeps running afterwards.

mitre:
  tactics: [impact]
  techniques: [T1485]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  sysmon_pid:         gen.int(min=1000, max=4000)
  sysmon_tid:         gen.int(min=1000, max=9999)
  user:               "NT AUTHORITY\\SYSTEM"
  user_sid:           S-1-5-18
  image:              "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe"
  process_guid_raw:   fn.upper(gen.uuid())
  process_id:         gen.int(min=1000, max=9999)
  record_base:        gen.int(min=1000, max=9999)

pools:
  - id: defender-folder-files
    sampling:
      mode: round_robin
    csv:
      data: |
