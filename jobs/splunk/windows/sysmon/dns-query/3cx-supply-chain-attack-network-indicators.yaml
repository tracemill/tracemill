type: job
name: 3CX Supply Chain Attack Network Indicators
detection:
  source: escu
  name: "ESCU - 3CX Supply Chain Attack Network Indicators - Rule"
  id: 791b727c-deec-4fbe-a732-756131b3c5a1
description: |
  Validates the ESCU "3CX Supply Chain Attack Network Indicators" detection.

  The SPL aggregates Sysmon DNS queries via the Network_Resolution datamodel
  and filters them through the curated `3cx_ioc_domains` lookup.

tags: [3cx, cve-2023-29059]
mitre:
  tactics: [initial-access]
  techniques: ["T1195.002"]

state:
  query_name:         "www.3cx.com"
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/dns-query/3cx-ioc-dns-query
    bindings:
      query_name: ref.query_name
      computer:   ref.computer
    expectation:
      expected: alert
      summary: "3CX supply chain — DNS query to a known-IOC domain"
      mitre:
        tactics: [initial-access]
        techniques: ["T1195.002"]
