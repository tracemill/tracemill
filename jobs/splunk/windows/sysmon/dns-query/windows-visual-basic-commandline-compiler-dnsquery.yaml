type: job
name: Windows Visual Basic Commandline Compiler DNSQuery
detection:
  source: escu
  name: "ESCU - Windows Visual Basic Commandline Compiler DNSQuery - Rule"
  id: 8976744a-ae7a-46a4-8128-690df85c2af4
description: |
  Validates detection of the Visual Basic command-line compiler resolving a
  domain name: Sysmon EID 22 (DnsQuery) records vbc.exe, for example the .NET
  Framework copy in C:\Windows\Microsoft.NET\Framework\v4.0.30319, querying a
  domain name, for example electrico.co.zw, and the address it resolved to.

mitre:
  tactics: [command-and-control]
  techniques: [T1071.004]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/sysmon/dns-query/vbc-compiler-dns-query
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
    expectation:
      expected: alert
      summary: "vbc.exe resolves a domain name"
      mitre:
        tactics: [command-and-control]
        techniques: [T1071.004]
