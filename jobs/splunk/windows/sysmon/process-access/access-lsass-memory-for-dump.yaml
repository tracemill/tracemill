type: job
name: Access LSASS Memory for Dump Creation
detection:
  source: escu
  name: "ESCU - Access LSASS Memory for Dump Creation - Rule"
  id: fb4c31b0-13e8-4155-8aa5-24de4b8d6717
description: |
  Validates detection of a process opening lsass.exe with full access from a
  call stack through dbgcore.dll: Sysmon EID 10 (ProcessAccess) records a
  process, for example procdump64.exe or rundll32.exe running the comsvcs.dll
  MiniDump export, opening lsass.exe with GrantedAccess 0x1fffff. A benign
  control models svchost.exe, running as SYSTEM, opening lsass.exe with
  query-only access (0x1400).

mitre:
  tactics: [credential-access]
  techniques: [T1003.001]

workloads:
  - scenario: scenarios/windows/sysmon/process-access/lsass-dump-procdump
    expectation:
      expected: alert
      summary: "Access LSASS Memory for Dump Creation"
      mitre:
        tactics: [credential-access]
        techniques: [T1003.001]

  - scenario: scenarios/windows/sysmon/process-access/lsass-dump-comsvcs
    expectation:
      expected: alert
      summary: "Access LSASS Memory for Dump Creation"
      mitre:
        tactics: [credential-access]
        techniques: [T1003.001]

  - scenario: scenarios/windows/sysmon/process-access/lsass-access-system-service
    expectation:
      expected: none
      summary: "svchost.exe running as NT AUTHORITY\\SYSTEM opens lsass.exe with GrantedAccess 0x1400"
