type: job
name: Windows Non-System Account Targeting Lsass
detection:
  source: escu
  name: "ESCU - Windows Non-System Account Targeting Lsass - Rule"
  id: b1ce9a72-73cf-11ec-981b-acde48001122
description: |
  Validates detection of a process running under a user account, rather
  than a built-in NT AUTHORITY account, opening lsass.exe: Sysmon EID 10
  (ProcessAccess) records mimikatz.exe, run by a user, for example a domain
  administrator, opening lsass.exe with memory-read access (0x1010) and
  that user as its source account. A benign control models svchost.exe,
  running as NT AUTHORITY\SYSTEM, opening lsass.exe on the same host with
  query-only access (0x1400).

tags: [mimikatz]
mitre:
  tactics: [credential-access]
  techniques: [T1003.001]

state:
  domain_short:        CORP
  domain_tld:          local
  domain_short_lower:  fn.lower(ref.domain_short)
  domain_fqdn:         "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  sysmon_pid:          gen.int(min=1000, max=4000)
  sysmon_tid:          gen.int(min=1000, max=9999)
  lsass_guid_raw:      fn.upper(gen.uuid())
  lsass_process_guid:  "{${ref.lsass_guid_raw}}"
  lsass_pid:           gen.int(min=500, max=1200)
  control_record_id:   gen.int(min=100000, max=199999)

workloads:
  - scenario: scenarios/windows/sysmon/process-access/lsass-access-mimikatz
    bindings:
      domain_short:        ref.domain_short
      domain_tld:          ref.domain_tld
      computer:            ref.computer
      sysmon_pid:          ref.sysmon_pid
      sysmon_tid:          ref.sysmon_tid
      target_process_guid: ref.lsass_process_guid
      target_pid:          ref.lsass_pid
    expectation:
      expected: alert
      summary: "mimikatz.exe running as a domain user opens lsass.exe with GrantedAccess 0x1010"
      mitre:
        tactics: [credential-access]
        techniques: [T1003.001]

  - scenario: scenarios/windows/sysmon/process-access/lsass-access-system-service
    bindings:
      domain_short:        ref.domain_short
      domain_tld:          ref.domain_tld
      computer:            ref.computer
      sysmon_pid:          ref.sysmon_pid
      sysmon_tid:          ref.sysmon_tid
      target_process_guid: ref.lsass_process_guid
      target_pid:          ref.lsass_pid
      event_record_id:     ref.control_record_id
    expectation:
      expected: none
      summary: "svchost.exe running as NT AUTHORITY\\SYSTEM opens lsass.exe with GrantedAccess 0x1400"
