type: job
name: Spoolsv Suspicious Process Access
detection:
  source: escu
  name: "ESCU - Spoolsv Suspicious Process Access - Rule"
  id: 799b606e-da81-11eb-93f8-acde48001122
description: |
  Validates detection of the print spooler opening a process from printer
  driver DLL code, as in a PrintNightmare (CVE-2021-34527) exploit: Sysmon
  EID 10 (Process Access) records spoolsv.exe opening a rundll32.exe process
  with full access (GrantedAccess 0x1fffff), with a call trace that runs
  through a DLL in the x64 printer driver directory
  C:\Windows\System32\spool\drivers\x64\3, for example evil.dll. The event
  is evidence of the access request, not of what rundll32.exe then ran.
tags: [cve-2021-34527]

mitre:
  tactics: [privilege-escalation]
  techniques: [T1068]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  payload_dll:        evil.dll

workloads:
  - scenario: scenarios/windows/sysmon/process-access/spoolsv-driver-rundll32-access
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      payload_dll:  ref.payload_dll
    expectation:
      expected: alert
      summary: "spoolsv.exe opens rundll32.exe with GrantedAccess 0x1fffff from evil.dll in the x64 printer driver directory"
      mitre:
        tactics: [privilege-escalation]
        techniques: [T1068]
