type: job
name: Detect Credential Dumping through LSASS access
detection:
  source: escu
  name: "ESCU - Detect Credential Dumping through LSASS access - Rule"
  id: 2c365e57-4414-4540-8dc0-73ab10729996
description: |
  Validates detection of a process opening lsass.exe with an access mask
  commonly used to read credential material from its memory (GrantedAccess
  0x1010 or 0x1410) via Sysmon EID 10 (ProcessAccess). Two attack workloads
  cover both access masks the detection's OR scopes to: rundll32.exe
  invoking the comsvcs.dll MiniDump export (0x1410, a real captured
  technique), and a masquerading tool using the narrower VM-read-only mask
  (0x1010). A benign control models svchost.exe, running as SYSTEM, opening
  lsass.exe with query-only access (0x1400).

mitre:
  tactics: [credential-access]
  techniques: [T1003.001]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  username:           gen.username()
  dumper_image:       "C:\\Users\\${ref.username}\\AppData\\Local\\Temp\\dumper.exe"
  dumper_call_trace:  "C:\\Windows\\SYSTEM32\\ntdll.dll+a5a94|C:\\Windows\\System32\\KERNELBASE.dll+221bd|${ref.dumper_image}+1a2b|C:\\Windows\\System32\\KERNEL32.DLL+84d4|C:\\Windows\\SYSTEM32\\ntdll.dll+51791"
  control_record_id:  gen.int(min=100000, max=199999)
  comsvcs_guid_raw:   gen.uuid()
  comsvcs_guid:       "{${ref.comsvcs_guid_raw}}"
  dumper_guid_raw:    gen.uuid()
  dumper_guid:        "{${ref.dumper_guid_raw}}"

workloads:
  - scenario: scenarios/windows/sysmon/process-access/lsass-access-credential-dump
    bindings:
      computer:            ref.computer
      source_process_guid: ref.comsvcs_guid
    expectation:
      expected: alert
      summary: "rundll32.exe accesses lsass.exe via comsvcs.dll MiniDump with GrantedAccess 0x1410"
      mitre:
        tactics: [credential-access]
        techniques: [T1003.001]
      # The rule rewrites CallTrace, a group-by field, with a post-stats
      # eval, so per-event attribution cannot match the surviving row.
      correlation:
        dest:              ref.computer
        SourceProcessGUID: ref.comsvcs_guid

  - scenario: scenarios/windows/sysmon/process-access/lsass-access-credential-dump
    bindings:
      computer:            ref.computer
      source_image:        ref.dumper_image
      granted_access:      "0x1010"
      call_trace:          ref.dumper_call_trace
      source_process_guid: ref.dumper_guid
    expectation:
      expected: alert
      summary: "A masquerading tool accesses lsass.exe with the narrower VM-read-only GrantedAccess 0x1010"
      mitre:
        tactics: [credential-access]
        techniques: [T1003.001]
      correlation:
        dest:              ref.computer
        SourceProcessGUID: ref.dumper_guid

  - scenario: scenarios/windows/sysmon/process-access/lsass-access-system-service
    bindings:
      domain_short:    ref.domain_short
      domain_tld:      ref.domain_tld
      computer:        ref.computer
      event_record_id: ref.control_record_id
    expectation:
      expected: none
      summary: "svchost.exe running as NT AUTHORITY\\SYSTEM opens lsass.exe with GrantedAccess 0x1400"
