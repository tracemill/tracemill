type: job
name: Detect Credential Dumping through LSASS access
detection:
  source: escu
  name: "ESCU - Detect Credential Dumping through LSASS access - Rule"
  id: 2c365e57-4414-4540-8dc0-73ab10729996
description: |
  Validates detection of a process opening lsass.exe with an access
  mask commonly used to read credential material from its memory
  (GrantedAccess 0x1010 or 0x1410) via Sysmon EID 10 (ProcessAccess),
  T1003.001. Two attack workloads cover both access masks the
  detection's OR scopes to: rundll32.exe invoking the comsvcs.dll
  MiniDump export (0x1410, a real captured technique), and a
  masquerading tool using the narrower VM-read-only mask (0x1010). A
  benign control models routine svchost.exe access to lsass.exe
  (0x1400, outside the detection's two access masks) and must not
  fire.

mitre:
  tactics: [credential-access]
  techniques: [T1003.001]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  username:           gen.username()
  dumper_image:       "C:\\Users\\${ref.username}\\AppData\\Local\\Temp\\dumper.exe"
  dumper_call_trace:  "C:\\Windows\\SYSTEM32\\ntdll.dll+a5a94|C:\\Windows\\System32\\KERNELBASE.dll+221bd|${ref.dumper_image}+1a2b|C:\\Windows\\System32\\KERNEL32.DLL+84d4|C:\\Windows\\SYSTEM32\\ntdll.dll+51791"

workloads:
  - scenario: scenarios/windows/sysmon/process-access/lsass-access-credential-dump
    bindings:
      computer:     ref.computer
    expectation:
      expected: alert
      summary: "rundll32.exe accesses lsass.exe via comsvcs.dll MiniDump with GrantedAccess 0x1410"
      mitre:
        tactics: [credential-access]
        techniques: [T1003.001]

  - scenario: scenarios/windows/sysmon/process-access/lsass-access-credential-dump
    bindings:
      computer:       ref.computer
      source_image:   ref.dumper_image
      granted_access: "0x1010"
      call_trace:     ref.dumper_call_trace
    expectation:
      expected: alert
      summary: "A masquerading tool accesses lsass.exe with the narrower VM-read-only GrantedAccess 0x1010"
      mitre:
        tactics: [credential-access]
        techniques: [T1003.001]

  - scenario: scenarios/windows/sysmon/process-access/lsass-access-routine
    bindings:
      computer: ref.computer
    expectation:
      expected: none
      summary: "Routine svchost.exe access to lsass.exe (GrantedAccess 0x1400) does not match either scoped access mask"
