type: job
name: Windows Event Log Cleared
detection:
  source: escu
  name: "ESCU - Windows Event Log Cleared - Rule"
  id: ad517544-aff9-4c96-bd99-d6eb43bfbb6a
description: |
  Validates detection of Windows event logs being cleared: Security EID 1102
  records the Security audit log being cleared, and System EID 104 records
  an event log, for example System, being cleared. Both events name the
  account that cleared the log, for example Administrator.

mitre:
  tactics: [defense-impairment]
  techniques: [T1685.005]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  eventlog_pid:       gen.int(min=300, max=1500)
  subject_user:       Administrator

workloads:
  - scenario: scenarios/windows/wineventlog/event-log/security-log-cleared
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      eventlog_pid: ref.eventlog_pid
      subject_user: ref.subject_user
    expectation:
      expected: alert
      summary: "The Security audit log is cleared (EID 1102)"
      mitre:
        tactics: [defense-impairment]
        techniques: [T1685.005]

  - scenario: scenarios/windows/wineventlog/event-log/event-log-cleared
    bindings:
      domain_short:    ref.domain_short
      domain_tld:      ref.domain_tld
      computer:        ref.computer
      eventlog_pid:    ref.eventlog_pid
      subject_user:    ref.subject_user
      cleared_channel: System
    expectation:
      expected: alert
      summary: "The System event log is cleared (EID 104)"
      mitre:
        tactics: [defense-impairment]
        techniques: [T1685.005]
