type: job
name: Windows AD DSRM Password Reset
detection:
  source: escu
  name: "ESCU - Windows AD DSRM Password Reset - Rule"
  id: d1ab841c-36a6-46cf-b50f-b2b04b31182a
description: |
  Validates detection of the Directory Services Restore Mode (DSRM)
  administrator password being set on a domain controller. Security EID 4794
  records the account that made the request, for example Administrator.

mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1098]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  domain_controller:  gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  workstation_iid:    gen.regex(pattern=[1-9a-f][0-9a-f]{3}:[1-9a-f][0-9a-f]{3}:[1-9a-f][0-9a-f]{3}:[1-9a-f][0-9a-f]{3})
  workstation:        "[fe80::${ref.workstation_iid}]"

workloads:
  - scenario: scenarios/windows/wineventlog/account-management/dsrm-password-set
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.domain_controller
      actor_user:   Administrator
      workstation:  ref.workstation
    expectation:
      expected: alert
      summary: "The DSRM administrator password is set on a domain controller (EventID 4794)"
      mitre:
        tactics: [persistence, privilege-escalation]
        techniques: [T1098]
      correlation:
        src:  ref.workstation
        dest: ref.domain_controller
