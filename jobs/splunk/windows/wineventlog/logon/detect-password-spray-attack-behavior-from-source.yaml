type: job
name: Detect Password Spray Attack Behavior From Source
detection:
  source: escu
  name: "ESCU - Detect Password Spray Attack Behavior From Source - Rule"
  id: b6391b15-e913-4c2c-8949-9eecc06efacc
description: |
  Validation job for Detect Password Spray Attack Behavior From Source.
  12 failed-logon events (EID 4625) from one fixed source against 12
  distinct users -- above the user_dc >= 10 threshold. No successes, so
  success/failure = 0 < 0.25 and failed_dc > success_dc.

  The control repeats failures for a single user from a different
  source: one distinct user, below the threshold, must not alert.

mitre:
  tactics: [credential-access]
  techniques: ["T1110.003"]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  src_host:           gen.ipv4()
  # Grouping key of the detection: TA-Windows aliases src <- WorkstationName
  # for 4625, so this must be pinned for the burst to collapse into one row.
  spray_host:         gen.hostname(class=windows-workstation)
  # Separate source, so the control forms its own group rather than
  # joining the spray's.
  control_host:       gen.hostname(class=windows-workstation)
  control_src_host:   gen.ipv4()
  control_user:       gen.username()
  # SPL uppercases the grouping key (src=upper(src)); the alert row
  # carries that form, so the correlation value must match it.
  spray_host_upper:   fn.upper(ref.spray_host)

workloads:
  - scenario: scenarios/windows/wineventlog/logon/failed-login-from-src
    loop: 12
    bindings:
      src_host:     ref.src_host
      workstation:  ref.spray_host
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     "${ref.spray_host}.${ref.domain_fqdn}"
    expectation:
      expected: alert
      summary: "Password spray -- many distinct users targeted from one source"
      mitre:
        tactics: [credential-access]
        techniques: ["T1110.003"]
      correlation:
        src: ref.spray_host_upper

  - scenario: scenarios/windows/wineventlog/logon/failed-login-from-src
    loop: 6
    bindings:
      src_host:     ref.control_src_host
      workstation:  ref.control_host
      target_user:  ref.control_user
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     "${ref.control_host}.${ref.domain_fqdn}"
    expectation:
      expected: none
      summary: "One user failing repeatedly from one source is a forgotten password, not a spray."
