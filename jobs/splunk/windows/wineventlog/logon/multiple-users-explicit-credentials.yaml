type: job
name: Windows Multiple Users Fail To Authenticate Wth ExplicitCredentials
detection:
  source: escu
  # "Wth" is the upstream ESCU detection name verbatim (id below, still typo'd as
  # of version 13) -- source:escu resolves by exact name, so do NOT "fix" it.
  name: "ESCU - Windows Multiple Users Fail To Authenticate Wth ExplicitCredentials - Rule"
  id: e61918fa-9ca4-11eb-836c-acde48001122
description: |
  Validates detection of an explicit-credential spray: a single caller on one
  host initiates logons supplying the credentials of many distinct target
  accounts (Security EventID 4648) in a short window, exceeding the distinct-
  target-accounts threshold. A benign control -- a caller presenting a couple of
  service-account credentials from a legitimate host -- stays below the threshold
  and must not fire.

mitre:
  tactics: [credential-access]
  techniques: ["T1110.003"]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  spray_host:         gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  spray_caller:       gen.username()
  benign_host:        gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  benign_caller:      gen.username()

workloads:
  - scenario: scenarios/windows/wineventlog/logon/explicit-credential-logon
    loop: 35
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.spray_host
      caller_user:  ref.spray_caller
    expectation:
      expected: alert
      summary: "One caller presents 35 distinct target-account credentials from one host (EventID 4648)"
      mitre:
        tactics: [credential-access]
        techniques: ["T1110.003"]

  - scenario: scenarios/windows/wineventlog/logon/explicit-credential-logon
    loop: 3
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.benign_host
      caller_user:  ref.benign_caller
    expectation:
      expected: none
      summary: "A caller presents a couple of credentials from one host (below threshold)"
