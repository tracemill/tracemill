type: job
name: Detect Password Spray Attack Behavior On User
detection:
  source: escu
  name: "ESCU - Detect Password Spray Attack Behavior On User - Rule"
  id: a7539705-7183-4a12-9b6a-b6eef645a6d7
description: |
  Validation job for Detect Password Spray Attack Behavior On User.
  15 failed-logon events (EID 4625) targeting one fixed user from 15
  distinct source workstations — above the src_dc >= 10 threshold. No
  successes, so success/failure = 0 < 0.25 and failed_dc > success_dc.

mitre:
  tactics: [credential-access]
  techniques: ["T1110.003"]

state:
  target_user:       gen.username()
  target_user_upper: fn.upper(ref.target_user)

workloads:
  - scenario: scenarios/windows/wineventlog/logon/failed-login-from-src
    loop: 15
    bindings:
      target_user: ref.target_user
    expectation:
      expected: alert
      summary: "Password spray — one user targeted from many distinct sources"
      mitre:
        tactics: [credential-access]
        techniques: ["T1110.003"]
      correlation:
        # SPL normalises the target username to uppercase via upper(user).
        # target_user_upper holds fn.upper(ref.target_user); see #323 for
        # native fn.*() support in correlation values.
        user: ref.target_user_upper
