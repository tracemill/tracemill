type: job
detection:
  source: escu
  name: "Windows Local Administrator Credential Stuffing"
  id: 09555511-aca6-484a-b6ab-72cd03d73c34
description: |
  Validates detection of local-administrator credential stuffing: one source
  address drives network logons as the Administrator account (LogonType 3)
  against many distinct hosts, exceeding the distinct-hosts threshold. Two
  attack arms model both outcomes -- successful reuse (EventID 4624) and failed
  attempts (EventID 4625). A low-volume benign control -- routine administrator
  access to a single server -- stays below the threshold and must not fire.

mitre:
  tactics: [lateral-movement]
  techniques: ["T1110.004"]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  attacker_ip:        gen.ipv4()
  benign_ip:          gen.ipv4()
  benign_host:        gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  # Attack arm 1: successful Administrator network logons across 35 distinct hosts.
  - scenario: scenarios/windows/wineventlog/logon/admin-network-logon-success
    loop: 35
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      src_ip:       ref.attacker_ip
    expectation:
      expected: alert
      summary: "Successful Administrator network logons from one source across 35 hosts (EventID 4624)"
      mitre:
        tactics: [lateral-movement]
        techniques: ["T1110.004"]

  # Attack arm 2: failed Administrator network logons across 35 distinct hosts.
  - scenario: scenarios/windows/wineventlog/logon/failed-login-from-src
    loop: 35
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      src_host:     ref.attacker_ip
      target_user:  Administrator
    expectation:
      expected: alert
      summary: "Failed Administrator network logons from one source across 35 hosts (EventID 4625)"
      mitre:
        tactics: [lateral-movement]
        techniques: ["T1110.004"]

  # Benign control: routine administrator access to a single server, below threshold.
  - scenario: scenarios/windows/wineventlog/logon/admin-network-logon-success
    loop: 4
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      src_ip:       ref.benign_ip
      computer:     ref.benign_host
    expectation:
      expected: none
      summary: "Routine administrator access to a single server (below distinct-hosts threshold)"
