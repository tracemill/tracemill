type: job
name: Windows Unusual Count Of Users Failed To Authenticate From Process
detection:
  source: escu
  name: "ESCU - Windows Unusual Count Of Users Failed To Authenticate From Process - Rule"
  id: 25bdb6cb-2e49-4d34-a93c-d6c567c122fe
description: |
  Validates outlier detection of an on-host password spray: one process
  generates interactive failed logons (EventID 4625, LogonType 2) against
  15 distinct accounts, above the >10 distinct-user gate. The control
  mistypes one account three times from a legitimate tool on another host
  and must not fire.

  The burst is emitted in one go so all attempts fall in one search window
  and one 2-minute bucket, where the standard deviation is zero and the
  outlier bound collapses to the distinct-user count itself. A split burst
  can leave both halves under the >10 gate.

mitre:
  tactics: [credential-access]
  techniques: ["T1110.003"]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  host:               gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  spray_user:         gen.username()
  spray_process:      "C:\\Tools\\PurpleSharp\\PurpleSharp.exe"
  spray_pid_hex:      gen.hex(len=3, case=lower)
  benign_host:        gen.hostname(class=windows-workstation, domain=ref.domain_fqdn)
  benign_user:        gen.username()
  benign_target:      gen.username()
  benign_process:     "C:\\Windows\\System32\\runas.exe"
  benign_pid_hex:     gen.hex(len=3, case=lower)

workloads:
  - scenario: scenarios/windows/wineventlog/logon/failed-login-from-process
    # Closest comfortable margin over the >10 distinct-user gate.
    loop: 15
    bindings:
      domain_short:   ref.domain_short
      domain_tld:     ref.domain_tld
      computer:       ref.host
      subject_user:   ref.spray_user
      process_name:   ref.spray_process
      process_id_hex: ref.spray_pid_hex
    expectation:
      expected: alert
      summary: "Interactive failed logons against 15 distinct users from one process (EventID 4625)"
      mitre:
        tactics: [credential-access]
        techniques: ["T1110.003"]

  - scenario: scenarios/windows/wineventlog/logon/failed-login-from-process
    loop: 3
    bindings:
      domain_short:   ref.domain_short
      domain_tld:     ref.domain_tld
      computer:       ref.benign_host
      subject_user:   ref.benign_user
      process_name:   ref.benign_process
      target_user:    ref.benign_target
      process_id_hex: ref.benign_pid_hex
    expectation:
      expected: none
      summary: "One account mistyped a few times from a legitimate tool (below threshold)"
