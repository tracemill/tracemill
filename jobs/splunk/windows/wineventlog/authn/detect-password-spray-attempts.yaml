type: job
description: |
  Validates the ESCU "Detect Password Spray Attempts" detection
  (T1110.003) via result_row_correlation.

  The detection's SPL post-aggregates failed-login events through a
  synthesized counter key (`src+"__"+sourcetype+"__"+signature_id`),
  which classifies as `wont_correlate` under per-event attribution.
  This job uses `detection.correlation` to bridge the gap — the
  correlation tuple matches the alert's result-row src/sourcetype/
  signature_id back to this workload.

  Splunk savedsearch (verbatim): "Detect Password Spray Attempts"

  Replays a 50-attempt failed-login burst from a single source IP
  against 50 distinct users (`gen.username()` re-evaluates per loop
  iteration), well above the detection's outlier threshold
  (unique_accounts > 30 and >= upperBound).

  Failure-mode mix: a 2-row inline pool round-robins across two
  real-world NTLM authentication failures — the loop count (50) is
  even, so the burst splits 25 / 25 across the two modes. The pool's
  single shared invariant is `AuthenticationPackageName = NTLM`;
  every other surface (LogonType, LogonProcessName) and the failure
  triple (Status, SubStatus, FailureReason) varies per row, modelling
  a sprayer that probes both classic SMB / Net-Logon and legacy
  cleartext / Basic-auth surfaces (e.g. older IIS, on-prem OWA) with
  a mix of wrong-password and bad-username outcomes:

    - row 1: LogonType=3, LogonProcessName=NtLmSsp, AuthPackage=NTLM
             Status=0xC000006D / SubStatus=0xC000006A / Reason=%%2313
             (network NTLM, wrong password — canonical CrackMapExec /
             MSOLSpray hit against a valid account)
    - row 2: LogonType=8, LogonProcessName=Advapi, AuthPackage=NTLM
             Status=0xC000006D / SubStatus=0xC0000064 / Reason=%%2313
             (network cleartext / Basic-style, bad username — typical
             when the sprayer hasn't yet enumerated valid accounts)

  Both tuples are coherent rows drawn from the canonical pools
  `library/pools/windows-auth-profiles.csv` and
  `library/pools/windows-logon-failure-modes.csv`. Mixing across rows
  would produce nonsensical events (e.g. LogonType=10 +
  LogonProcessName=NtLmSsp doesn't happen on real Windows), so each
  iteration draws *one* full row via a single `auth_row: pool.…`
  binding and the per-field bindings extract from it via dot-path —
  this guarantees the six failure-mode fields stay row-coherent even
  though bindings re-evaluate per iteration.

  Why pin (src_host, workstation, computer) in job state: a password
  spray is one attacker (one source IP, one workstation hostname)
  hitting one target DC against many users. Job-level state evaluates
  once at start and the workload pulls it through via pass-through
  bindings (`workstation: ref.workstation` etc.), so the attacker
  fingerprint stays fixed across all 50 iterations while target users
  and the failure-mode row rotate. Without these pins, the scenario's
  `gen.hostname()` defaults would re-evaluate each iteration and
  produce 50 different attackers and 50 different targets — not a
  spray.

  Correlation note: refs in `detection.correlation` are restricted at
  parse time to job-state keys (the only stable values across
  iterations); `ref.workstation` qualifies because it is declared in
  the job's `state` block.
tags: [splunk, escu, t1110.003, password-spray, wont_correlate, result_row_correlation]
mitre:
  tactics: [credential-access]
  techniques: ["T1110.003"]

state:
  src_host:    gen.ipv4()
  workstation: gen.hostname(class=windows-workstation)
  computer:    gen.hostname(class=windows-server, domain=corp.local)

pools:
  - id: ntlm-failure-modes
    description: |
      Two real-world NTLM logon-failure surfaces. Each row is a
      coherent (logon_type, logon_process, auth_package) tuple paired
      with a coherent (status, sub_status, failure_reason) triple.
      Single shared invariant across rows: auth_package = NTLM.
      Round-robin sampling pairs cleanly with an even loop count for
      a 50/50 split.
    sampling:
      mode: round_robin
    csv:
      data: |
        logon_type,logon_process,auth_package,status_code,sub_status,failure_reason
        3,NtLmSsp,NTLM,0xC000006D,0xC000006A,%%2313
        8,Advapi,NTLM,0xC000006D,0xC0000064,%%2313

workloads:
  - scenario: scenarios/windows/wineventlog/authn/failed-login-from-src
    loop: 50
    bindings:
      src_host:       ref.src_host
      workstation:    ref.workstation
      computer:       ref.computer
      # One pool draw per iteration. Round-robin advances the pool
      # cursor by exactly one row, so all six per-field bindings
      # below extract from the *same* row for a given iteration.
      # If each per-field binding called `pool.ntlm-failure-modes.<field>`
      # directly, every binding would issue its own Get() and the
      # cursor would advance six times per iteration — fields would
      # come from six different rows and produce incoherent events.
      auth_row:       pool.ntlm-failure-modes
      logon_type:     ref.auth_row.logon_type
      logon_process:  ref.auth_row.logon_process
      auth_package:   ref.auth_row.auth_package
      status_code:    ref.auth_row.status_code
      sub_status:     ref.auth_row.sub_status
      failure_reason: ref.auth_row.failure_reason
    detection:
      expected: alert
      attack: "Password spray — high-volume failed logins from a single source"
      mitre:
        tactics: [credential-access]
        techniques: ["T1110.003"]
      correlation:
        # The detection's final `| table` projection includes _time, src,
        # action, app, unique_accounts, unique_user_names, total_failures,
        # sourcetype, signature_id, counter. src + sourcetype +
        # signature_id uniquely identifies rows attributable to this
        # workload's burst. TA-Windows CIM aliases `src` ← WorkstationName
        # for 4625, so the alert row's `src` field is the workstation
        # hostname.
        src:           ref.workstation
        signature_id:  "4625"
        sourcetype:    "XmlWinEventLog"
