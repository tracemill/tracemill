type: job
description: |
  Validates the ESCU "Detect Password Spray Attempts" detection
  (T1110.003) via result_row_correlation. The detection's SPL
  synthesizes a counter key (`src+"__"+sourcetype+"__"+signature_id`),
  which classifies as `wont_correlate` under per-event attribution —
  `detection.correlation` bridges the gap.

  50-attempt failed-login burst from a single source against 50
  distinct users (well above the `unique_accounts > 30` threshold).
  A 2-row inline pool round-robins across two real-world NTLM logon
  failures, splitting the burst 25/25:

    - row 1: NTLM/SMB, wrong-password
             LogonType=3, LogonProcessName=NtLmSsp, AuthPackage=NTLM
             0xC000006D / 0xC000006A / %%2313
    - row 2: NTLM/cleartext, bad-username
             LogonType=8, LogonProcessName=Advapi, AuthPackage=NTLM
             0xC000006D / 0xC0000064 / %%2313

  Single shared invariant across rows: `AuthenticationPackageName =
  NTLM`. Both tuples are coherent rows from
  `library/pools/windows-auth-profiles.csv` and
  `windows-logon-failure-modes.csv` — mixing fields across rows
  produces nonsensical events, so each iteration draws *one* row via
  `auth_row: pool.…` and the per-field bindings extract from it.

  `src_host`, `workstation`, `computer` pin once in job state so the
  attacker fingerprint stays fixed across all 50 iterations while
  target users and the failure-mode row rotate.
tags: [splunk, escu, t1110.003, password-spray, wont_correlate, result_row_correlation]
mitre:
  tactics: [credential-access]
  techniques: ["T1110.003"]

state:
  src_host:    gen.ipv4()
  workstation: gen.hostname(class=windows-workstation)
  computer:    gen.hostname(class=windows-server, domain=corp.local)

pools:
  - id: ntlm-failure-modes
    sampling:
      mode: round_robin
    csv:
      data: |
        logon_type,logon_process,auth_package,status_code,sub_status,failure_reason
        3,NtLmSsp,NTLM,0xC000006D,0xC000006A,%%2313
        8,Advapi,NTLM,0xC000006D,0xC0000064,%%2313

workloads:
  - scenario: scenarios/windows/wineventlog/authn/failed-login-from-src
    loop: 50
    bindings:
      src_host:       ref.src_host
      workstation:    ref.workstation
      computer:       ref.computer
      # One pool draw per iteration. Per-field bindings would each
      # issue their own Get() and scramble fields across rows.
      auth_row:       pool.ntlm-failure-modes
      logon_type:     ref.auth_row.logon_type
      logon_process:  ref.auth_row.logon_process
      auth_package:   ref.auth_row.auth_package
      status_code:    ref.auth_row.status_code
      sub_status:     ref.auth_row.sub_status
      failure_reason: ref.auth_row.failure_reason
    detection:
      expected: alert
      attack: "Password spray — high-volume failed logins from a single source"
      mitre:
        tactics: [credential-access]
        techniques: ["T1110.003"]
      correlation:
        # TA-Windows CIM aliases `src` ← WorkstationName for 4625, so
        # the alert row's `src` field is the workstation hostname.
        src:           ref.workstation
        signature_id:  "4625"
        sourcetype:    "XmlWinEventLog"
