type: job
description: |
  Loop-based variant of `detect-password-spray-attempts.yaml`. Same
  detection target (ESCU "Detect Password Spray Attempts", T1110.003)
  and same correlation contract — only the structure differs.

  Where the matrix sibling produces 40 events via 2 auth rows × 20
  structural `iter` axis values (cartesian = 40 single-emit
  invocations), this job produces 50 events via 25 invocations of a
  2-step scenario (`failed-login-multi-mode-from-src`) that emits one
  NTLM/SMB and one RDP failure per invocation. End result: 25 NTLM +
  25 RDP, 50 unique target users, comfortably above the detection's
  `unique_accounts > 30` outlier threshold.

  Structural pros vs. the matrix sibling:
    - No structural `iter` axis — the loop count expresses iteration
      directly. Less idiom-specific, easier to read.
    - Mode mix is part of the scenario's contract, not the job's.
      Other jobs that want the same NTLM+RDP pair can reuse the
      scenario without re-declaring an inline pool.
  Cons:
    - Mode set is fixed by the scenario; can't be overridden via
      bindings. For arbitrary mode combinations, use the matrix
      sibling with a different inline pool.
    - Each invocation produces a back-to-back NTLM→RDP pair against
      two distinct users; under the matrix sibling the auth-row order
      depends on cartesian-iteration order. Both are equally
      indistinguishable from a real spray to the detection.

  TA-Windows bucketing flaw: same as the matrix sibling — under a
  buggy TA the burst fragments across per-LogonType buckets, none of
  which exceed threshold; under a fixed TA the combined 50-event
  burst lands in one bucket and fires. `expected: alert` therefore
  encodes the *intended* behaviour; a passing test means the TA
  pipeline is bucketing correctly.
tags: [splunk, escu, t1110.003, password-spray]
mitre:
  tactics: [credential-access]
  techniques: ["T1110.003"]

state:
  # Pin once at job init and stay constant across every loop iteration —
  # a password spray is one attacker (src_host, workstation) hitting one
  # target DC (computer) against many users.
  src_host:    gen.ipv4()
  workstation: gen.hostname(class=windows-workstation)
  computer:    gen.hostname(class=windows-server, domain=corp.local)

workloads:
  - scenario: scenarios/windows/wineventlog/authn/failed-login-multi-mode-from-src
    loop: 25
    bindings:
      src_host:    ref.src_host
      workstation: ref.workstation
      computer:    ref.computer
    detection:
      expected: alert
      attack: "Password spray (NTLM + RDP, multi-step scenario) — failed logins from a single source"
      mitre:
        tactics: [credential-access]
        techniques: ["T1110.003"]
      correlation:
        # Same correlation contract as the matrix sibling: TA-Windows
        # CIM aliases `src` ← WorkstationName for 4625, so the alert
        # row's `src` field is the workstation hostname (verified
        # empirically against a real Splunk firing).
        src:           ref.workstation
        signature_id:  "4625"
        sourcetype:    "XmlWinEventLog"
