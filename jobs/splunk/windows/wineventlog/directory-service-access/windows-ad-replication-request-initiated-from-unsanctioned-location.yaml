type: job
name: Windows AD Replication Request Initiated from Unsanctioned Location
detection:
  source: escu
  name: "ESCU - Windows AD Replication Request Initiated from Unsanctioned Location - Rule"
  id: 50998483-bb15-457b-a870-965080d9e3d3
description: |
  Validates detection of directory replication requested by a machine
  account from a host that is not a sanctioned domain controller: a
  network logon (EventID 4624) followed by a replication extended-right
  request (EventID 4662) under the same logon session.

  The control issues the same request under a user account, which the
  rule's subject filter excludes.

mitre:
  tactics: [credential-access]
  techniques: [T1003.006]

state:
  domain_short:    CORP
  machine_account: "SRV19$"
  user_account:    Administrator

workloads:
  - scenario: scenarios/windows/wineventlog/directory-service-access/ad-replication-request-dcsync
    bindings:
      domain_short: ref.domain_short
      subject_user: ref.machine_account
    expectation:
      expected: alert
      summary: "Replication extended rights exercised by a machine account over a network logon"
      mitre:
        tactics: [credential-access]
        techniques: [T1003.006]
      correlation:
        user: ref.machine_account

  - scenario: scenarios/windows/wineventlog/directory-service-access/ad-replication-request-dcsync
    bindings:
      domain_short: ref.domain_short
      subject_user: ref.user_account
    expectation:
      expected: none
      summary: "The same request under a user account is outside this rule's subject filter"
