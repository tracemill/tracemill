type: job
name: Windows Service Created with Suspicious Service Path
detection:
  source: escu
  name: "ESCU - Windows Service Created with Suspicious Service Path - Rule"
  id: 429141be-8311-11eb-adb6-acde48001122
description: |
  Validates detection of a Windows service installed with an .exe binary
  outside the Windows, Program Files and ProgramData directories. System
  EID 7045 (Service Control Manager) records a service, for example
  MockService, installed with the binary path, for example
  C:\Temp\mockService.exe.

mitre:
  tactics: [execution]
  techniques: [T1569.002]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  user_sid:           "S-1-5-21-111222333-444555666-777888999-500"

workloads:
  - scenario: scenarios/windows/wineventlog/service-control-manager/service-installed
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.computer
      user_sid:     ref.user_sid
      service_name: MockService
      image_path:   "C:\\Temp\\mockService.exe"
      service_type: user mode service
      start_type:   auto start
      account_name: LocalSystem
    expectation:
      expected: alert
      summary: "A service is installed with the binary C:\\Temp\\mockService.exe"
      mitre:
        tactics: [execution]
        techniques: [T1569.002]
