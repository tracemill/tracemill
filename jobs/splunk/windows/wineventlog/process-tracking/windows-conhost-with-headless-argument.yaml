type: job
name: Windows ConHost with Headless Argument
detection:
  source: escu
  name: "ESCU - Windows ConHost with Headless Argument - Rule"
  id: d5039508-998d-4cfc-8b5e-9dcd679d9a62
description: |
  Validates detection of the Windows console host started in headless mode.
  Windows Security EID 4688 (Process Creation) records cmd.exe starting
  C:\Windows\System32\conhost.exe with the --headless argument followed by a
  command to run, for example calc.exe.

mitre:
  tactics: [defense-evasion]
  techniques: [T1564.003, T1564.006]

state:
  domain_short: CORP
  domain_tld:   local
  host_short:   gen.hostname(class=windows-workstation)
  user_name:    gen.username()

workloads:
  - scenario: scenarios/windows/wineventlog/process-tracking/conhost-headless-launch
    bindings:
      domain_short:  ref.domain_short
      domain_tld:    ref.domain_tld
      host_short:    ref.host_short
      user_name:     ref.user_name
      child_command: calc.exe
    expectation:
      expected: alert
      summary: "cmd.exe starts conhost.exe with --headless and the command calc.exe"
      mitre:
        tactics: [defense-evasion]
        techniques: [T1564.003, T1564.006]
