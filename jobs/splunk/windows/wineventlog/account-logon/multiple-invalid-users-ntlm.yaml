type: job
name: Windows Multiple Invalid Users Failed To Authenticate Using NTLM
detection:
  source: escu
  name: "ESCU - Windows Multiple Invalid Users Failed To Authenticate Using NTLM - Rule"
  id: 57ad5a64-9df7-11eb-a290-acde48001122
description: |
  Validates detection of an NTLM password-spray against nonexistent accounts: a
  single workstation drives credential-validation failures (Security EventID
  4776, status "account does not exist") for many distinct user names in a short
  window, exceeding the distinct-invalid-users threshold. A benign control -- a
  handful of failures from a different workstation -- stays below the threshold
  and must not fire.

mitre:
  tactics: [credential-access]
  techniques: ["T1110.003"]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  auth_server:        gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  spray_workstation:  gen.hostname(class=windows-workstation)
  benign_workstation: gen.hostname(class=windows-workstation)
  invalid_user_status: "0xc0000064"

workloads:
  - scenario: scenarios/windows/wineventlog/account-logon/ntlm-credential-validation-failure
    loop: 35
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.auth_server
      workstation:  ref.spray_workstation
      status:       ref.invalid_user_status
    expectation:
      expected: alert
      summary: "NTLM validation failures for 35 distinct nonexistent accounts from one workstation (EventID 4776)"
      mitre:
        tactics: [credential-access]
        techniques: ["T1110.003"]

  - scenario: scenarios/windows/wineventlog/account-logon/ntlm-credential-validation-failure
    loop: 4
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.auth_server
      workstation:  ref.benign_workstation
      status:       ref.invalid_user_status
    expectation:
      expected: none
      summary: "A few NTLM validation failures from one workstation (below threshold)"
