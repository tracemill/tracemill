type: job
name: Windows AD Suspicious Attribute Modification
detection:
  source: escu
  name: "ESCU - Windows AD Suspicious Attribute Modification - Rule"
  id: 5682052e-ce55-4f9f-8d28-59191420b7e0
description: |
  Validates detection of Active Directory suspicious attribute modifications
  via directory-service changes auditing (Security EventID 5136, T1222.001, T1550).
mitre:
  tactics: [defense-evasion, lateral-movement]
  techniques: [T1222.001, T1550]
state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  dc_host:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  subject_user:       Administrator
  # Generated per run so the correlation tuple below is unique to this run:
  # target_user reaches the alert row as `user` (via the modified object's DN),
  # and every other correlation field is a constant.
  target_user:        gen.username()
workloads:
  - scenario: scenarios/windows/wineventlog/directory-service-changes/windows-ad-suspicious-attribute-modification
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.dc_host
      subject_user: ref.subject_user
      target_user:  ref.target_user
    expectation:
      expected: alert
      summary: "Sensitive AD attribute (msDS-AllowedToDelegateTo) modified on a domain controller"
      correlation:
        src_user: ref.subject_user
        user: ref.target_user
        AttributeLDAPDisplayName: "msDS-AllowedToDelegateTo"
