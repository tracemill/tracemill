type: job
name: Windows AD ServicePrincipalName Added To Domain Account
detection:
  source: escu
  name: "ESCU - Windows AD ServicePrincipalName Added To Domain Account - Rule"
  id: 8a1259cb-0ea7-409c-8bfe-74bad89259f9
description: |
  Validates detection of a Service Principal Name (SPN) addition to a domain account
  via directory-service changes auditing (Security EventID 5136, T1098).
mitre:
  tactics: [credential-access, privilege-escalation]
  techniques: [T1098]
state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  dc_host:            gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  admin_user:         Administrator
workloads:
  - scenario: scenarios/windows/wineventlog/directory-service-changes/spn-added-to-account
    bindings:
      domain_short: ref.domain_short
      domain_tld:   ref.domain_tld
      computer:     ref.dc_host
      subject_user: ref.admin_user
    expectation:
      expected: alert
      summary: "Service Principal Name (SPN) added to a domain user account"
      mitre:
        tactics: [credential-access, privilege-escalation]
        techniques: [T1098]
