type: job
name: Windows Find Interesting ACL with FindInterestingDomainAcl
detection:
  source: escu
  name: "ESCU - Windows Find Interesting ACL with FindInterestingDomainAcl - Rule"
  id: e4a96dfd-667a-4487-b942-ccef5a1e81e8
description: |
  Validates detection of PowerShell searching Active Directory for unusual
  access control entries: PowerShell/Operational EID 4104 (Script Block
  Logging) records a block holding a Find-InterestingDomainAcl command.

mitre:
  tactics: [discovery]
  techniques: [T1087.002]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      provider_guid:     "{A0C1853B-5C40-4B15-8766-3CF1C58F985A}"
      script_block_text: Find-InterestingDomainAcl
    expectation:
      expected: alert
      summary: "PowerShell runs Find-InterestingDomainAcl to look for weak domain ACLs"
      mitre:
        tactics: [discovery]
        techniques: [T1087.002]
