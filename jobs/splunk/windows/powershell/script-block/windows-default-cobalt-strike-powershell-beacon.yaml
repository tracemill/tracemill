type: job
name: Windows Default Cobalt Strike PowerShell Beacon
detection:
  source: escu
  name: "ESCU - Windows Default Cobalt Strike PowerShell Beacon - Rule"
  id: 25b6329b-d6b7-4ccd-9ac2-6ca1dfd2b0c1
description: |
  Validates detection of the default Cobalt Strike PowerShell payload
  template: PowerShell/Operational EID 4104 (Script Block Logging) records a
  block, read from a script file, that defines the template's
  func_get_proc_address function, which uses $var_unsafe_native_methods to
  reach Microsoft.Win32.UnsafeNativeMethods in System.dll and calls
  $var_gpa.Invoke to resolve an address through GetModuleHandle and
  GetProcAddress.
tags: [cobalt-strike]

mitre:
  tactics: [execution]
  techniques: [T1059.001, T1204.002]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      provider_guid:     "{A0C1853B-5C40-4B15-8766-3CF1C58F985A}"
      script_path:       "C:\\Users\\snapattack\\Desktop\\beacon.ps1"
      script_block_text: "function func_get_proc_address {\n\
        \tParam ($var_module, $var_procedure)\t\t\n\
        \t$var_unsafe_native_methods = ([AppDomain]::CurrentDomain.GetAssemblies() | Where-Object { $_.GlobalAssemblyCache -And $_.Location.Split('\\\\')[-1].Equals('System.dll') }).GetType('Microsoft.Win32.UnsafeNativeMethods')\n\
        \t$var_gpa = $var_unsafe_native_methods.GetMethod('GetProcAddress', [Type[]] @('System.Runtime.InteropServices.HandleRef', 'string'))\n\
        \treturn $var_gpa.Invoke($null, @([System.Runtime.InteropServices.HandleRef](New-Object System.Runtime.InteropServices.HandleRef((New-Object IntPtr), ($var_unsafe_native_methods.GetMethod('GetModuleHandle')).Invoke($null, @($var_module)))), $var_procedure))\n\
        }"
    expectation:
      expected: alert
      summary: "PowerShell logs a block defining func_get_proc_address via UnsafeNativeMethods"
      mitre:
        tactics: [execution]
        techniques: [T1059.001, T1204.002]
