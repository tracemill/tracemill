type: job
name: Windows Find Domain Organizational Units with GetDomainOU
detection:
  source: escu
  name: "ESCU - Windows Find Domain Organizational Units with GetDomainOU - Rule"
  id: 0ada2f82-b7af-40cc-b1d7-1e5985afcb4e
description: |
  Validates detection of PowerShell enumeration of Active Directory
  organizational units: PowerShell/Operational EID 4104 (Script Block
  Logging) records a block holding a Get-DomainOU command.

mitre:
  tactics: [discovery]
  techniques: [T1087.002]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      provider_guid:     "{A0C1853B-5C40-4B15-8766-3CF1C58F985A}"
      script_block_text: Get-DomainOU
    expectation:
      expected: alert
      summary: "PowerShell runs Get-DomainOU to enumerate organizational units"
      mitre:
        tactics: [discovery]
        techniques: [T1087.002]
