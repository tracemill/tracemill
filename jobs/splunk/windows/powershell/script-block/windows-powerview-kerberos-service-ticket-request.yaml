type: job
name: Windows PowerView Kerberos Service Ticket Request
detection:
  source: escu
  name: "ESCU - Windows PowerView Kerberos Service Ticket Request - Rule"
  id: 970455a1-4ac2-47e1-a9a5-9e75443ddcb9
description: |
  Validates detection of a PowerShell request for Kerberos service tickets:
  PowerShell/Operational EID 4104 (Script Block Logging) records a block
  holding a bare Get-DomainSPNTicket command.

mitre:
  tactics: [credential-access]
  techniques: [T1558.003]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      provider_guid:     "{A0C1853B-5C40-4B15-8766-3CF1C58F985A}"
      script_block_text: Get-DomainSPNTicket
    expectation:
      expected: alert
      summary: "PowerShell runs Get-DomainSPNTicket to request Kerberos service tickets"
      mitre:
        tactics: [credential-access]
        techniques: [T1558.003]
