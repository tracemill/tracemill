type: job
name: GetDomainGroup with PowerShell Script Block
detection:
  source: escu
  name: "ESCU - GetDomainGroup with PowerShell Script Block - Rule"
  id: 09725404-a44f-4ed3-9efa-8ed5d69e4c53
description: |
  Validates detection of PowerShell enumeration of Active Directory groups:
  PowerShell/Operational EID 4104 (Script Block Logging) records a block
  holding a Get-DomainGroup command.

mitre:
  tactics: [discovery]
  techniques: [T1069.002]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      provider_guid:     "{A0C1853B-5C40-4B15-8766-3CF1C58F985A}"
      script_block_text: get-domaingroup
    expectation:
      expected: alert
      summary: "PowerShell runs Get-DomainGroup to enumerate domain groups"
      mitre:
        tactics: [discovery]
        techniques: [T1069.002]
