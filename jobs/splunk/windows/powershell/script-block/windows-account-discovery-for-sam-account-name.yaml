type: job
name: Windows Account Discovery for Sam Account Name
detection:
  source: escu
  name: "ESCU - Windows Account Discovery for Sam Account Name - Rule"
  id: 69934363-e1dd-4c49-8651-9d7663dd4d2f
description: |
  Validates detection of PowerShell enumeration of domain user account
  attributes: PowerShell/Operational EID 4104 (Script Block Logging) records
  a block, read from a script file, that runs Get-NetUser
  -PreauthNotRequire, then Get-NetUser -UACFilter NOT_ACCOUNTDISABLE
  selecting samaccountname, description, pwdlastset, logoncount and
  badpwdcount, followed by Get-NetComputer and Get-NetGroup commands.

mitre:
  tactics: [discovery]
  techniques: [T1087]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      provider_guid:     "{A0C1853B-5C40-4B15-8766-3CF1C58F985A}"
      script_path:       "C:\\Temp\\svr.ps1"
      script_block_text: "Get-NetUser -PreauthNotRequire\r\n\
        Get-NetUser -UACFilter NOT_ACCOUNTDISABLE | select samaccountname, description, pwdlastset, logoncount, badpwdcount\r\n\
        Get-NetComputer | select samaccountname\r\n\
        Get-NetGroup\r\n\
        Get-NetDiDomain"
    expectation:
      expected: alert
      summary: "PowerShell runs Get-NetUser selecting samaccountname and pwdlastset"
      mitre:
        tactics: [discovery]
        techniques: [T1087]
