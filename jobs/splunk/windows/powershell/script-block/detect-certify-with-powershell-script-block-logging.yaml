type: job
name: Detect Certify With PowerShell Script Block Logging
detection:
  source: escu
  name: "ESCU - Detect Certify With PowerShell Script Block Logging - Rule"
  id: f533ca6c-9440-4686-80cb-7f294c07812a
description: |
  Validates detection of Certify run from PowerShell to look for vulnerable
  AD CS certificate templates: PowerShell/Operational EID 4104 (Script Block
  Logging) records a block that calls the Certify entry point
  [Certify.Program]::Main with the arguments find /vulnerable.
tags: [certify]

mitre:
  tactics: [execution, credential-access]
  techniques: [T1059.001, T1649]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      script_block_text: "[Certify.Program]::Main(\"find /vulnerable\".Split())"
    expectation:
      expected: alert
      summary: "PowerShell runs [Certify.Program]::Main(\"find /vulnerable\")"
      mitre:
        tactics: [execution, credential-access]
        techniques: [T1059.001, T1649]
