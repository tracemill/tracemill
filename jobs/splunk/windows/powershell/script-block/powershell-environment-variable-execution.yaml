type: job
name: PowerShell Environment Variable Execution
detection:
  source: escu
  name: "ESCU - PowerShell Environment Variable Execution - Rule"
  id: 02c1d8e9-044c-401f-906c-cc95445af8bd
description: |
  Validates detection of PowerShell executing code stored in an environment
  variable: PowerShell/Operational EID 4104 (Script Block Logging) records a
  block that runs IEX (Invoke-Expression) on a user environment variable,
  for example $env:INTERNAL_DB_CACHE, and then clears that variable with
  [Environment]::SetEnvironmentVariable.

mitre:
  tactics: [execution]
  techniques: [T1059.001]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      script_block_text: "IEX $env:INTERNAL_DB_CACHE;[Environment]::SetEnvironmentVariable('INTERNAL_DB_CACHE',$null,'User')"
    expectation:
      expected: alert
      summary: "PowerShell runs IEX on an environment variable, then clears it"
      mitre:
        tactics: [execution]
        techniques: [T1059.001]
