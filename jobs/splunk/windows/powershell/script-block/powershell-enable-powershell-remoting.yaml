type: job
name: PowerShell Enable PowerShell Remoting
detection:
  source: escu
  name: "ESCU - PowerShell Enable PowerShell Remoting - Rule"
  id: 40e3b299-19a5-4460-96e9-e1467f714f8e
description: |
  Validates detection of PowerShell enabling PowerShell remoting:
  PowerShell/Operational EID 4104 (Script Block Logging) records a block
  holding an Enable-PSRemoting -Force command.

mitre:
  tactics: [execution]
  techniques: [T1059.001]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      provider_guid:     "{A0C1853B-5C40-4B15-8766-3CF1C58F985A}"
      script_block_text: Enable-PSRemoting -force
    expectation:
      expected: alert
      summary: "PowerShell runs Enable-PSRemoting -force to turn on PowerShell remoting"
      mitre:
        tactics: [execution]
        techniques: [T1059.001]
