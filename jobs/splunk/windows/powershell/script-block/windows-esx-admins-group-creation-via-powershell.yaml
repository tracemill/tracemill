type: job
name: Windows ESX Admins Group Creation via PowerShell
detection:
  source: escu
  name: "ESCU - Windows ESX Admins Group Creation via PowerShell - Rule"
  id: f48a5557-be06-4b96-b8e8-be563e387620
description: |
  Validates detection of a PowerShell attempt to create an Active Directory
  group named "ESX Admins": PowerShell/Operational EID 4104 (Script Block
  Logging) records a block holding a New-ADGroup command with that group
  name.

mitre:
  tactics: [persistence]
  techniques: [T1136.002, T1136.001]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      script_block_text: "New-ADGroup -Name 'ESX Admins' -GroupScope Global -GroupCategory Security"
    expectation:
      expected: alert
      summary: "PowerShell runs New-ADGroup -Name 'ESX Admins'"
      mitre:
        tactics: [persistence]
        techniques: [T1136.002, T1136.001]
