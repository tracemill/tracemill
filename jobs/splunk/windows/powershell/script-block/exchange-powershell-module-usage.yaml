type: job
name: Exchange PowerShell Module Usage
detection:
  source: escu
  name: "ESCU - Exchange PowerShell Module Usage - Rule"
  id: 2d10095e-05ae-11ec-8fdf-acde48001122
description: |
  Validates detection of Exchange management cmdlets run from PowerShell:
  PowerShell/Operational EID 4104 (Script Block Logging) records a block
  holding a New-ManagementRoleAssignment command that assigns the Mailbox
  Import Export role to a user, for example Administrator.

mitre:
  tactics: [execution]
  techniques: [T1059.001]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      provider_guid:     "{A0C1853B-5C40-4B15-8766-3CF1C58F985A}"
      script_block_text: "New-ManagementRoleAssignment -Role \"Mailbox Import Export\" -User \"Administrator\""
    expectation:
      expected: alert
      summary: "PowerShell runs New-ManagementRoleAssignment -Role \"Mailbox Import Export\""
      mitre:
        tactics: [execution]
        techniques: [T1059.001]
