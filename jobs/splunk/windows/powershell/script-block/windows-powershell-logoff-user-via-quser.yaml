type: job
name: Windows Powershell Logoff User via Quser
detection:
  source: escu
  name: "ESCU - Windows Powershell Logoff User via Quser - Rule"
  id: 6d70780d-4cfe-4820-bafd-1b43941986b5
description: |
  Validates detection of PowerShell logging off user sessions listed by
  quser: PowerShell/Operational EID 4104 (Script Block Logging) records a
  block that pipes quser output to ForEach-Object and calls logoff with a
  field split from each line of that output.

mitre:
  tactics: [execution, impact]
  techniques: [T1059.001, T1531]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      script_block_text: "quser | ForEach-Object { logoff ($_ -split ' +')[-6] }\n"
    expectation:
      expected: alert
      summary: "PowerShell runs quser | ForEach-Object { logoff ... } for each session"
      mitre:
        tactics: [execution, impact]
        techniques: [T1059.001, T1531]
