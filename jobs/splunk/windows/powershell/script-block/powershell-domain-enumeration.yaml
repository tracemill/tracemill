type: job
name: PowerShell Domain Enumeration
detection:
  source: escu
  name: "ESCU - PowerShell Domain Enumeration - Rule"
  id: e1866ce2-ca22-11eb-8e44-acde48001122
description: |
  Validates detection of PowerShell domain enumeration:
  PowerShell/Operational EID 4104 (Script Block Logging) records a block
  holding the get-addomain command, the Get-ADDomain cmdlet that reads the
  Active Directory domain's properties.

mitre:
  tactics: [execution]
  techniques: [T1059.001]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      provider_guid:     "{A0C1853B-5C40-4B15-8766-3CF1C58F985A}"
      script_block_text: get-addomain
    expectation:
      expected: alert
      summary: "PowerShell runs get-addomain to read the Active Directory domain"
      mitre:
        tactics: [execution]
        techniques: [T1059.001]
