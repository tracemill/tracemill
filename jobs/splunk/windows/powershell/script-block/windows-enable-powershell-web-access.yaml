type: job
name: Windows Enable PowerShell Web Access
detection:
  source: escu
  name: "ESCU - Windows Enable PowerShell Web Access - Rule"
  id: 175bb2de-6227-416b-9678-9b61999cd21f
description: |
  Validates detection of PowerShell Web Access being set up:
  PowerShell/Operational EID 4104 (Script Block Logging) records a block
  holding an Install-PswaWebApplication command, which installs the
  PowerShell Web Access gateway web application, here with a self-signed
  test certificate (-UseTestCertificate).

mitre:
  tactics: [execution]
  techniques: [T1059.001]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      script_block_text: "{Install-PswaWebApplication -UseTestCertificate}"
    expectation:
      expected: alert
      summary: "PowerShell runs Install-PswaWebApplication -UseTestCertificate"
      mitre:
        tactics: [execution]
        techniques: [T1059.001]
