type: job
name: Windows PowerShell Get CIMInstance Remote Computer
detection:
  source: escu
  name: "ESCU - Windows PowerShell Get CIMInstance Remote Computer - Rule"
  id: d8c972eb-ed84-431a-8869-ca4bd83257d1
description: |
  Validates detection of Get-CimInstance querying a remote computer:
  PowerShell/Operational EID 4104 (Script Block Logging) records a block
  running Get-CimInstance for the Win32_LoggedOnUser class with
  -ComputerName pointing at another host.

mitre:
  tactics: [execution]
  techniques: [T1059.001]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      provider_guid:     "{A0C1853B-5C40-4B15-8766-3CF1C58F985A}"
      script_block_text: "Get-CimInstance -ClassName Win32_LoggedOnUser -ComputerName mswin-dc01"
    expectation:
      expected: alert
      summary: "PowerShell runs Get-CimInstance Win32_LoggedOnUser on a remote -ComputerName"
      mitre:
        tactics: [execution]
        techniques: [T1059.001]
