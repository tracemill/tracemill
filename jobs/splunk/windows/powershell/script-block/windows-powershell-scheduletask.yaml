type: job
name: Windows PowerShell ScheduleTask
detection:
  source: escu
  name: "ESCU - Windows PowerShell ScheduleTask - Rule"
  id: ddf82fcb-e9ee-40e3-8712-a50b5bf323fc
description: |
  Validates detection of PowerShell creating a scheduled task with the
  ScheduledTasks cmdlets: PowerShell/Operational EID 4104 (Script Block
  Logging) records a block that builds a task with New-ScheduledTaskAction
  (for example running calc.exe), New-ScheduledTaskTrigger -AtLogon,
  New-ScheduledTaskPrincipal for the Administrators group at the highest run
  level, New-ScheduledTaskSettingsSet and New-ScheduledTask, then registers
  it with Register-ScheduledTask.

mitre:
  tactics: [execution, persistence, privilege-escalation]
  techniques: [T1053.005, T1059.001]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      provider_guid:     "{A0C1853B-5C40-4B15-8766-3CF1C58F985A}"
      script_block_text: |-
        {$Action = New-ScheduledTaskAction -Execute "calc.exe"
        $Trigger = New-ScheduledTaskTrigger -AtLogon
        $User = New-ScheduledTaskPrincipal -GroupId "BUILTIN\Administrators" -RunLevel Highest
        $Set = New-ScheduledTaskSettingsSet
        $object = New-ScheduledTask -Action $Action -Principal $User -Trigger $Trigger -Settings $Set
        Register-ScheduledTask AtomicTask -InputObject $object}
    expectation:
      expected: alert
      summary: "PowerShell runs New-ScheduledTask and Register-ScheduledTask for a logon task"
      mitre:
        tactics: [execution, persistence, privilege-escalation]
        techniques: [T1053.005, T1059.001]
