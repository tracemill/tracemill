type: job
name: Windows PowerView AD Access Control List Enumeration
detection:
  source: escu
  name: "ESCU - Windows PowerView AD Access Control List Enumeration - Rule"
  id: 39405650-c364-4e1e-a740-32a63ef042a6
description: |
  Validates detection of PowerShell enumeration of the access control list
  on an Active Directory object: PowerShell/Operational EID 4104 (Script
  Block Logging) records a block running Get-ObjectAcl with -ResolveGUIDs
  against a user identity and passing each returned entry's
  SecurityIdentifier to ConvertFrom-SID.

mitre:
  tactics: [initial-access, persistence, privilege-escalation, defense-evasion, discovery]
  techniques: [T1078.002, T1069]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      provider_guid:     "{A0C1853B-5C40-4B15-8766-3CF1C58F985A}"
      script_block_text: "Get-ObjectAcl -Identity reed_potts -ResolveGUIDs | Foreach-Object {$_ | Add-Member -NotePropertyName Identity -NotePropertyValue (ConvertFrom-SID $_.SecurityIdentifier.value) -Force; $_}"
    expectation:
      expected: alert
      summary: "PowerShell runs Get-ObjectAcl -ResolveGUIDs to read an AD object's ACL"
      mitre:
        tactics: [initial-access, persistence, privilege-escalation, defense-evasion, discovery]
        techniques: [T1078.002, T1069]
