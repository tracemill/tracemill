type: job
name: Windows Cobalt Strike PowerShell Loader
detection:
  source: escu
  name: "ESCU - Windows Cobalt Strike PowerShell Loader - Rule"
  id: a6351724-06dc-42dd-939f-679add826e76
description: |
  Validates detection of a PowerShell loader that decompresses and runs an
  embedded payload in memory: PowerShell/Operational EID 4104 (Script Block
  Logging) records a block that loads a Base64-encoded gzip blob into an
  IO.MemoryStream with [Convert]::FromBase64String, then ends with IEX over
  an IO.StreamReader reading an IO.Compression.GzipStream in Decompress
  mode. PowerShell logged the block at Warning level, which it does for
  blocks it flags as suspicious.

mitre:
  tactics: [execution, resource-development]
  techniques: [T1608, T1059.001]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  level:              3

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      level:             ref.level
      provider_guid:     "{A0C1853B-5C40-4B15-8766-3CF1C58F985A}"
      script_block_text: "$s=New-Object IO.MemoryStream(,[Convert]::FromBase64String(\"\"));IEX (New-Object IO.StreamReader(New-Object IO.Compression.GzipStream($s,[IO.Compression.CompressionMode]::Decompress))).ReadToEnd();"
    expectation:
      expected: alert
      summary: "PowerShell runs IEX over a GzipStream-decompressed Base64 payload in memory"
      mitre:
        tactics: [execution, resource-development]
        techniques: [T1608, T1059.001]
