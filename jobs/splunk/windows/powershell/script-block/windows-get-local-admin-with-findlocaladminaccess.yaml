type: job
name: Windows Get Local Admin with FindLocalAdminAccess
detection:
  source: escu
  name: "ESCU - Windows Get Local Admin with FindLocalAdminAccess - Rule"
  id: d2988160-3ce9-4310-b59d-905334920cdd
description: |
  Validates detection of PowerShell searching the domain for hosts where the
  current user has local administrator access: PowerShell/Operational EID
  4104 (Script Block Logging) records a block holding a
  Find-LocalAdminAccess command.

mitre:
  tactics: [discovery]
  techniques: [T1087.002]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      provider_guid:     "{A0C1853B-5C40-4B15-8766-3CF1C58F985A}"
      script_block_text: Find-LocalAdminAccess
    expectation:
      expected: alert
      summary: "PowerShell runs Find-LocalAdminAccess to find hosts with local admin"
      mitre:
        tactics: [discovery]
        techniques: [T1087.002]
