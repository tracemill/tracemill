type: job
name: Windows File Share Discovery With Powerview
detection:
  source: escu
  name: "ESCU - Windows File Share Discovery With Powerview - Rule"
  id: a44c0be1-d7ab-41e4-92fd-aa9af4fe232c
description: |
  Validates detection of network file share discovery with
  Invoke-ShareFinder: PowerShell/Operational EID 4104 (Script Block Logging)
  records a block holding an Invoke-ShareFinder command with
  -CheckShareAccess, the switch that limits results to shares the current
  user can read.

mitre:
  tactics: [discovery]
  techniques: [T1135]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      script_block_text: Invoke-ShareFinder -CheckShareAccess -Verbose
    expectation:
      expected: alert
      summary: "PowerShell runs Invoke-ShareFinder -CheckShareAccess to find readable shares"
      mitre:
        tactics: [discovery]
        techniques: [T1135]
