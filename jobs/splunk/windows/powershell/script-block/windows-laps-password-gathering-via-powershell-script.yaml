type: job
name: Windows LAPS Password Gathering Via PowerShell Script
detection:
  source: escu
  name: "ESCU - Windows LAPS Password Gathering Via PowerShell Script - Rule"
  id: 02b712b6-5996-4537-b72a-cad3cb1bb3b4
description: |
  Validates detection of an attempt to read a computer's LAPS local
  administrator password from Active Directory: PowerShell/Operational EID
  4104 (Script Block Logging) records a block running Get-ADComputer against
  a computer with -Properties ms-Mcs-AdmPwd, the attribute that holds the
  LAPS password.

mitre:
  tactics: [credential-access]
  techniques: [T1552, T1003]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      provider_guid:     "{A0C1853B-5C40-4B15-8766-3CF1C58F985A}"
      script_block_text: Get-AdComputer arrakis -Properties ms-Mcs-AdmPwd
    expectation:
      expected: alert
      summary: "PowerShell runs Get-ADComputer -Properties ms-Mcs-AdmPwd"
      mitre:
        tactics: [credential-access]
        techniques: [T1552, T1003]
