type: job
name: PowerShell Script Block With URL Chain
detection:
  source: escu
  name: "ESCU - PowerShell Script Block With URL Chain - Rule"
  id: 4a3f2a7d-6402-4e64-a76a-869588ec3b57
description: |
  Validates detection of a PowerShell script block that carries a chain of
  download URLs: PowerShell/Operational EID 4104 (Script Block Logging)
  records an obfuscated block, logged at Warning level, holding an array of
  ten https URLs, for example ones ending in /xmlrpc.php. A loop picks one
  at random every 20 seconds and passes it to a function that sends
  gzip-compressed, base64-encoded host details in a Cookie header through
  System.Net.WebRequest and passes part of the reply to Iex.
tags: [gootloader]

mitre:
  tactics: [execution, command-and-control]
  techniques: [T1059.001, T1105]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  level:              3

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
