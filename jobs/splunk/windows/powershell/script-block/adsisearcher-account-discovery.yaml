type: job
name: AdsiSearcher Account Discovery
detection:
  source: escu
  name: "ESCU - AdsiSearcher Account Discovery - Rule"
  id: de7fcadc-04f3-11ec-a241-acde48001122
description: |
  Validates detection of Active Directory user discovery through the
  [adsisearcher] type accelerator: PowerShell/Operational EID 4104 (Script
  Block Logging) records a block that builds an [adsisearcher] query with
  the filter objectcategory=user and calls its FindAll() and FindOne()
  methods.

mitre:
  tactics: [discovery]
  techniques: [T1087.002]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      provider_guid:     "{A0C1853B-5C40-4B15-8766-3CF1C58F985A}"
      script_block_text: "{([adsisearcher]\"objectcategory=user\").FindAll(); ([adsisearcher]\"objectcategory=user\").FindOne()}"
    expectation:
      expected: alert
      summary: "PowerShell runs [adsisearcher]\"objectcategory=user\" with FindAll()"
      mitre:
        tactics: [discovery]
        techniques: [T1087.002]
