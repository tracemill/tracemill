type: job
name: Powershell Windows Defender Exclusion Commands
detection:
  source: escu
  name: "ESCU - Powershell Windows Defender Exclusion Commands - Rule"
  id: 907ac95c-4dd9-11ec-ba2c-acde48001122
description: |
  Validates detection of a PowerShell command adding a Microsoft Defender
  Antivirus exclusion: PowerShell/Operational EID 4104 (Script Block
  Logging) records a block holding an Add-MpPreference command with the
  -ExclusionPath parameter and a folder path, for example
  C:\Path\To\Exclude.

mitre:
  tactics: [defense-impairment]
  techniques: [T1685]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      provider_guid:     "{A0C1853B-5C40-4B15-8766-3CF1C58F985A}"
      script_block_text: "Add-MpPreference -ExclusionPath \"C:\\Path\\To\\Exclude\""
    expectation:
      expected: alert
      summary: "PowerShell runs Add-MpPreference -ExclusionPath to add a Defender exclusion"
      mitre:
        tactics: [defense-impairment]
        techniques: [T1685]
