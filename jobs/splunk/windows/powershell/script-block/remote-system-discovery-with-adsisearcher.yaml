type: job
name: Remote System Discovery with Adsisearcher
detection:
  source: escu
  name: "ESCU - Remote System Discovery with Adsisearcher - Rule"
  id: 70803451-0047-4e12-9d63-77fa7eb8649c
description: |
  Validates detection of Active Directory computer discovery through the
  [adsisearcher] type accelerator: PowerShell/Operational EID 4104 (Script
  Block Logging) records a block that builds an [adsisearcher] query with
  the filter objectcategory=computer and calls its FindAll() method.

mitre:
  tactics: [discovery]
  techniques: [T1018]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      provider_guid:     "{A0C1853B-5C40-4B15-8766-3CF1C58F985A}"
      script_block_text: "([adsisearcher]\"objectcategory=computer\").FindAll()"
    expectation:
      expected: alert
      summary: "PowerShell runs [adsisearcher]\"objectcategory=computer\" with FindAll()"
      mitre:
        tactics: [discovery]
        techniques: [T1018]
