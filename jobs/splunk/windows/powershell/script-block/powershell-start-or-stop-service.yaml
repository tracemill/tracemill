        <#-----------------------------------------------------------------------------------------------------------\r\n\
        \x20   Initialize-Ec2Disk brings online, partitions and formats disk.\r\n\
        -------------------------------------------------------------------------------------------------------------#>\r\n\
        function Initialize-Ec2Disk\r\n\
        {\r\n\
        \x20 param(\r\n\
        \x20   [Parameter(Mandatory = $true,Position = 0)]\r\n\
        \x20   [int]$DiskIndex,\r\n\
        \r\n\
        \x20   [Parameter(Mandatory = $true,Position = 1)]\r\n\
        \x20   [int]$EphemeralCount,\r\n\
        \r\n\
        \x20   [Parameter(Mandatory = $true,Position = 2)]\r\n\
        \x20   [bool]$IsEphemeral = $false\r\n\
        \x20 )\r\n\
        \r\n\
        \x20 Write-Log (\"Initializing disk {0} begins\" -f $DiskIndex)\r\n\
        \r\n\
        \x20 $isLargeDisk = $false\r\n\
        \r\n\
        \x20 try\r\n\
        \x20 {\r\n\
        \x20   # If the disk size exceeds 2199023255551 bytes (2 TB),\r\n\
        \x20   # the disk must use GPT partition table.\r\n\
        \x20   $disk = Get-Disk -Number $DiskIndex\r\n\
        \x20   if ($disk.Size -gt 2199023255551)\r\n\
        \x20   {\r\n\
        \x20     $isLargeDisk = $true\r\n\
        \x20   }\r\n\
        \x20 }\r\n\
        \x20 catch\r\n\
        \x20 {\r\n\
        \x20   Write-ErrorLog (\"Failed to get disk size: {0}\" -f $_.Exception.Message)\r\n\
        \x20 }\r\n\
        \r\n\
        \x20 try\r\n\
        \x20 {\r\n\
        \x20   Write-Log (\"Initializing the disk ...\")\r\n\
        \r\n\
        \x20   if (-not $isLargeDisk)\r\n\
        \x20   {\r\n\
        \x20     Initialize-Disk -Number $DiskIndex -PartitionStyle MBR | Out-Null\r\n\
        \x20   }\r\n\
        \x20   else\r\n\
        \x20   {\r\n\
        \x20     Initialize-Disk -Number $DiskIndex -PartitionStyle GPT | Out-Null\r\n\
        \x20   }\r\n\
        \x20 }\r\n\
        \x20 catch\r\n\
        \x20 {\r\n\
        \x20   Write-ErrorLog (\"Failed to initialize disk: {0}\" -f $_.Exception.Message)\r\n\
        \x20 }\r\n\
        \r\n\
        \x20 $driveLetter = \"\"\r\n\
        \r\n\
        \x20 try\r\n\
        \x20 {\r\n\
        \x20   Write-Log \"Looking for drive letter ...\"\r\n\
        \r\n\
        \x20   # If the disk is ephmeral (instance storage), drive letter starts from Z.\r\n\
        \x20   # Otherwise, drive letter starts from D.\r\n\
        \x20   if ($IsEphemeral)\r\n\
        \x20   {\r\n\
        \x20     # One-liner to get next available drive letter from Z to A.\r\n\
        \x20     for ($i = 91; Get-PSDrive ($driveLetter = [char] -- $i) 2>$null) {}\r\n\
        \x20   }\r\n\
        \x20   else\r\n\
        \x20   {\r\n\
        \x20     # One-liner to get next available drive letter from A to Z.\r\n\
        \x20     for ($i = 67; Get-PSDrive ($driveLetter = [char]++ $i) 2>$null) {}\r\n\
        \x20   }\r\n\
        \x20 }\r\n\
        \x20 catch\r\n\
        \x20 {\r\n\
        \x20   Write-ErrorLog (\"Failed to initialize disk: {0}. There is no available drive letter left to use\" -f $DiskIndex)\r\n\
        \x20   return \"\"\r\n\
        \x20 }\r\n\
        \r\n\
        \x20 try\r\n\
        \x20 {\r\n\
        \x20   # Stop Shell HW Detection service to prevent the prompt to pop up.\r\n\
        \x20   Stop-Service -Name ShellHWDetection -ErrorAction SilentlyContinue\r\n\
        \r\n\
        \x20   Write-Log (\"Creating partition with drive letter {0} ...\" -f $driveLetter)\r\n\
        \r\n\
        \x20   # Create a partition with the given drive index and letter.\r\n\
        \x20   if (-not $isLargeDisk)\r\n\
        \x20   {\r\n\
        \x20     $partition = New-Partition $DiskIndex -MbrType IFS -DriveLetter $driveLetter -UseMaximumSize -IsActive\r\n\
        \x20   }\r\n\
        \x20   else\r\n\
        \x20   {\r\n\
        \x20     $partition = New-Partition $DiskIndex -GptType '{ebd0a0a2-b9e5-4433-87c0-68b6b72699c7}' -DriveLetter $driveLetter -UseMaximumSize\r\n\
        \x20   }\r\n\
        \r\n\
        \x20   # Check if volume is formatted for the disk.\r\n\
        \x20   # If volume is not in OK status, we need to format the volume with given parameters.\r\n\
        \x20   $formatted = Get-Volume -Partition $partition\r\n\
        \x20   if (-not $formatted -or $formatted.OperationalStatus -ne \"OK\")\r\n\
        \x20   {\r\n\
        \x20     Write-Log \"Formatting the volume ...\"\r\n\
        \r\n\
        \x20     # Format the volume on the created/exsiting partition using the partition reference.\r\n\
        \x20     if ($IsEphemeral)\r\n\
        \x20     {\r\n\
        \x20       $formatted = Format-Volume -Partition $partition -FileSystem NTFS -NewFileSystemLabel \"Temporary Storage $($EphemeralCount)\" -Confirm:$false\r\n\
        \x20     }\r\n\
        \x20     else\r\n\
        \x20     {\r\n\
        \x20       $formatted = Format-Volume -Partition $partition -FileSystem NTFS -Confirm:$false\r\n\
        \x20     }\r\n\
        \x20   }\r\n\
        \x20   else\r\n\
        \x20   {\r\n\
        \x20     throw New-Object System.Exception (\"Volume already has been formatted.\")\r\n\
        \x20   }\r\n\
        \r\n\
        \x20   # This updates the drive info\r\n\
        \x20   Get-PSDrive | Out-Null\r\n\
        \r\n\
        \x20   Write-Log (\"Disk {0} is successfully initialized, partitioned and formatted\" -f $DiskIndex)\r\n\
        \r\n\
        \x20   return $driveLetter\r\n\
        \x20 }\r\n\
        \x20 catch\r\n\
        \x20 {\r\n\
        \x20   Write-ErrorLog (\"Failed to initialize disk {0}: {1}\" -f $DiskIndex,$_.Exception.Message)\r\n\
        \x20 }\r\n\
        \x20 finally\r\n\
        \x20 {\r\n\
        \x20   # Start the service back.\r\n\
        \x20   Start-Service -Name ShellHWDetection -ErrorAction SilentlyContinue\r\n\
        \x20 }\r\n\
        \r\n\
        \x20 return \"\"\r\n\
        }\r\n\
