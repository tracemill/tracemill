type: job
name: PowerShell Start or Stop Service
detection:
  source: escu
  name: "ESCU - PowerShell Start or Stop Service - Rule"
  id: 04207f8a-e08d-4ee6-be26-1e0c4488b04a
description: |
  Validates detection of PowerShell stopping and starting a Windows service:
  PowerShell/Operational EID 4104 (Script Block Logging) records a block
  read from a script file that defines an Initialize-Ec2Disk function, which
  calls Stop-Service on a service, for example ShellHWDetection, before it
  partitions and formats a disk and Start-Service on it afterwards.

mitre:
  tactics: [execution]
  techniques: [T1059.001]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      provider_guid:     "{A0C1853B-5C40-4B15-8766-3CF1C58F985A}"
