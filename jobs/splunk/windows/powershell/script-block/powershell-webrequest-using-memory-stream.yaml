type: job
name: PowerShell WebRequest Using Memory Stream
detection:
  source: escu
  name: "ESCU - PowerShell WebRequest Using Memory Stream - Rule"
  id: 103affa6-924a-4b53-aff4-1d5075342aab
description: |
  Validates detection of a PowerShell web request built from .NET classes
  alongside an in-memory stream: PowerShell/Operational EID 4104 (Script
  Block Logging) records an obfuscated block defining a function that
  gzip-compresses host details, such as environment variables, process
  names, window titles and drive usage, through System.IO.MemoryStream,
  sends them base64-encoded in a Cookie header with System.Net.WebRequest,
  and passes part of the response to Iex.
tags: [gootloader]

mitre:
  tactics: [execution, defense-evasion, command-and-control]
  techniques: [T1059.001, T1105, T1027.011]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
