type: job
name: Get DomainUser with PowerShell Script Block
detection:
  source: escu
  name: "ESCU - Get DomainUser with PowerShell Script Block - Rule"
  id: 61994268-04f4-11ec-865c-acde48001122
description: |
  Validates detection of domain user enumeration with the PowerView function
  Get-DomainUser: PowerShell/Operational EID 4104 (Script Block Logging)
  records a block running Get-DomainUser, for example with
  -PreauthNotRequired and -Properties distinguishedname to list the accounts
  that do not require Kerberos pre-authentication.
tags: [powerview]

mitre:
  tactics: [discovery]
  techniques: [T1087.002]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      provider_guid:     "{A0C1853B-5C40-4B15-8766-3CF1C58F985A}"
      script_block_text: "Get-DomainUser -PreauthNotRequired -Properties distinguishedname -Verbose"
    expectation:
      expected: alert
      summary: "PowerShell runs Get-DomainUser -PreauthNotRequired -Properties distinguishedname"
      mitre:
        tactics: [discovery]
        techniques: [T1087.002]
