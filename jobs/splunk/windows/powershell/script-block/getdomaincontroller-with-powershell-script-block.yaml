type: job
name: GetDomainController with PowerShell Script Block
detection:
  source: escu
  name: "ESCU - GetDomainController with PowerShell Script Block - Rule"
  id: 676b600a-a94d-4951-b346-11329431e6c1
description: |
  Validates detection of PowerShell enumeration of Active Directory domain
  controllers: PowerShell/Operational EID 4104 (Script Block Logging)
  records a block holding a Get-DomainController command.

mitre:
  tactics: [discovery]
  techniques: [T1018]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      provider_guid:     "{A0C1853B-5C40-4B15-8766-3CF1C58F985A}"
      script_block_text: get-domaincontroller
    expectation:
      expected: alert
      summary: "PowerShell runs Get-DomainController to list domain controllers"
      mitre:
        tactics: [discovery]
        techniques: [T1018]
