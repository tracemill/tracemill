type: job
name: Detect Empire with PowerShell Script Block Logging
detection:
  source: escu
  name: "ESCU - Detect Empire with PowerShell Script Block Logging - Rule"
  id: bc1dc6b8-c954-11eb-bade-acde48001122
description: |
  Validates detection of a PowerShell download stager that fetches its
  payload with System.Net.WebClient: PowerShell/Operational EID 4104 (Script
  Block Logging) records a block that turns off script block logging and
  sets amsiInitFailed through reflection, decodes a server address with
  [Convert]::FromBase64String, downloads data with WebClient.DownloadData,
  RC4-decrypts it and runs the result with IEX. PowerShell logged the block
  at Warning level, which it does for blocks it flags as suspicious.
tags: [empire]

mitre:
  tactics: [execution]
  techniques: [T1059.001]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  level:              3

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      level:             ref.level
      provider_guid:     "{A0C1853B-5C40-4B15-8766-3CF1C58F985A}"
