type: job
name: Windows Root Domain linked policies Discovery
detection:
  source: escu
  name: "ESCU - Windows Root Domain linked policies Discovery - Rule"
  id: 80ffaede-1f12-49d5-a86e-b4b599b68b3c
description: |
  Validates detection of Active Directory discovery of Group Policy links on
  the domain root: PowerShell/Operational EID 4104 (Script Block Logging)
  records a block that takes the SearchRoot path of an [adsisearcher]
  object, reads its gPLink attribute through [ADSI], and prints the path and
  display name of each linked policy.

mitre:
  tactics: [discovery]
  techniques: [T1087.002]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      provider_guid:     "{A0C1853B-5C40-4B15-8766-3CF1C58F985A}"
      script_block_text: "(([adsisearcher]’’).SearchRooT).Path | %{if(([ADSI]”$_”).gPlink){Write-Host “[+] Domain Path:”([ADSI]”$_”).Path;$a=((([ADSI]”$_”).gplink) -replace “[[;]” -split “]”);for($i=0;$i -lt $a.length;$i++){if($a[$i]){Write-Host “Policy Path[$i]:”([ADSI]($a[$i]).Substring(0,$a[$i].length-1)).Path;Write-Host “Policy Name[$i]:”([ADSI]($a[$i]).Substring(0,$a[$i].length-1)).DisplayName} };Write-Output “`n” }}"
    expectation:
      expected: alert
      summary: "PowerShell runs [adsisearcher] SearchRoot and reads gPLink policy paths"
      mitre:
        tactics: [discovery]
        techniques: [T1087.002]
