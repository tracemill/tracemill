type: job
name: Windows PowerShell Invoke-RestMethod IP Information Collection
detection:
  source: escu
  name: "ESCU - Windows PowerShell Invoke-RestMethod IP Information Collection - Rule"
  id: 8db47e12-9c3e-4f5a-b0d6-e42a1895cd4f
description: |
  Validates detection of PowerShell requesting the host's public IP and
  geolocation details with Invoke-RestMethod: PowerShell/Operational EID
  4104 (Script Block Logging) records a block that calls Invoke-RestMethod
  against the ipinfo.io JSON endpoint and stores the response in a variable.

mitre:
  tactics: [execution, discovery]
  techniques: [T1082, T1016, T1059.001]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      script_block_text: "# Get IP and geolocation information from ipinfo.io\r\n\
        $ipInfoResult = Invoke-RestMethod -Uri \"https://ipinfo.io/json\" -Method Get"
    expectation:
      expected: alert
      summary: "PowerShell runs Invoke-RestMethod -Uri https://ipinfo.io/json"
      mitre:
        tactics: [execution, discovery]
        techniques: [T1082, T1016, T1059.001]
