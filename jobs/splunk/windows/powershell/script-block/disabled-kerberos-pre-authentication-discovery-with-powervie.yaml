type: job
name: Disabled Kerberos Pre-Authentication Discovery With PowerView
detection:
  source: escu
  name: "ESCU - Disabled Kerberos Pre-Authentication Discovery With PowerView - Rule"
  id: b0b34e2c-90de-11ec-baeb-acde48001122
description: |
  Validates detection of a search for domain accounts that do not require
  Kerberos pre-authentication: PowerShell/Operational EID 4104 (Script Block
  Logging) records a block running the PowerView function Get-DomainUser
  with -PreauthNotRequired.
tags: [powerview]

mitre:
  tactics: [credential-access]
  techniques: [T1558.004]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      provider_guid:     "{A0C1853B-5C40-4B15-8766-3CF1C58F985A}"
      script_block_text: Get-DomainUser -PreauthNotRequired
    expectation:
      expected: alert
      summary: "PowerShell runs Get-DomainUser -PreauthNotRequired"
      mitre:
        tactics: [credential-access]
        techniques: [T1558.004]
