type: job
name: Windows PowerShell Disable HTTP Logging
detection:
  source: escu
  name: "ESCU - Windows PowerShell Disable HTTP Logging - Rule"
  id: 27958de0-2857-43ca-9d4c-b255cf59dcab
description: |
  Validates detection of PowerShell turning off IIS site logging:
  PowerShell/Operational EID 4104 (Script Block Logging) records a block
  holding a Set-ItemProperty command that sets the Logfile.enabled property
  of an IIS site, for example Default Web Site, to false.

mitre:
  tactics: [persistence, defense-impairment]
  techniques: [T1505.004, T1685.001]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      provider_guid:     "{A0C1853B-5C40-4B15-8766-3CF1C58F985A}"
      script_block_text: "Set-ItemProperty -Path 'IIS:\\Sites\\Default Web Site' -Name Logfile.enabled -Value false"
    expectation:
      expected: alert
      summary: "PowerShell runs Set-ItemProperty to set an IIS site's Logfile.enabled to false"
      mitre:
        tactics: [persistence, defense-impairment]
        techniques: [T1505.004, T1685.001]
