type: job
name: Windows ClipBoard Data via Get-ClipBoard
detection:
  source: escu
  name: "ESCU - Windows ClipBoard Data via Get-ClipBoard - Rule"
  id: ab73289e-2246-4de0-a14b-67006c72a893
description: |
  Validates detection of clipboard collection with Get-Clipboard:
  PowerShell/Operational EID 4104 (Script Block Logging) records a block
  holding a bare Get-Clipboard command, which returns the current contents
  of the Windows clipboard.

mitre:
  tactics: [collection]
  techniques: [T1115]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      provider_guid:     "{A0C1853B-5C40-4B15-8766-3CF1C58F985A}"
      script_block_text: Get-Clipboard
    expectation:
      expected: alert
      summary: "PowerShell runs Get-Clipboard to read the clipboard contents"
      mitre:
        tactics: [collection]
        techniques: [T1115]
