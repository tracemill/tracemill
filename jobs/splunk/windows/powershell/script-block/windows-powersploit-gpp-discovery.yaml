type: job
name: Windows PowerSploit GPP Discovery
detection:
  source: escu
  name: "ESCU - Windows PowerSploit GPP Discovery - Rule"
  id: 0130a0df-83a1-4647-9011-841e950ff302
description: |
  Validates detection of Group Policy Preferences password discovery:
  PowerShell/Operational EID 4104 (Script Block Logging) records a block
  holding the bare command Get-CachedGPPPassword, the PowerSploit function
  that searches the locally cached Group Policy Preferences files for stored
  passwords and decrypts them.
tags: [powersploit]

mitre:
  tactics: [credential-access]
  techniques: [T1552.006]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      provider_guid:     "{A0C1853B-5C40-4B15-8766-3CF1C58F985A}"
      script_block_text: Get-CachedGPPPassword
    expectation:
      expected: alert
      summary: "PowerShell runs the PowerSploit Get-CachedGPPPassword command"
      mitre:
        tactics: [credential-access]
        techniques: [T1552.006]
