type: job
name: Windows PowerView SPN Discovery
detection:
  source: escu
  name: "ESCU - Windows PowerView SPN Discovery - Rule"
  id: a7093c28-796c-4ebb-9997-e2c18b870837
description: |
  Validates detection of PowerShell discovery of domain accounts with
  service principal names: PowerShell/Operational EID 4104 (Script Block
  Logging) records a block holding a Get-NetUser command with the -SPN
  parameter.

mitre:
  tactics: [credential-access]
  techniques: [T1558.003]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      provider_guid:     "{A0C1853B-5C40-4B15-8766-3CF1C58F985A}"
      script_block_text: Get-NetUser -SPN
    expectation:
      expected: alert
      summary: "PowerShell runs Get-NetUser -SPN to list accounts with SPNs"
      mitre:
        tactics: [credential-access]
        techniques: [T1558.003]
