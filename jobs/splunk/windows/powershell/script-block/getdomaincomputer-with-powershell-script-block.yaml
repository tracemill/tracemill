type: job
name: GetDomainComputer with PowerShell Script Block
detection:
  source: escu
  name: "ESCU - GetDomainComputer with PowerShell Script Block - Rule"
  id: f64da023-b988-4775-8d57-38e512beb56e
description: |
  Validates detection of PowerShell enumeration of Active Directory computer
  objects: PowerShell/Operational EID 4104 (Script Block Logging) records a
  block holding a Get-DomainComputer command.

mitre:
  tactics: [discovery]
  techniques: [T1018]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      provider_guid:     "{A0C1853B-5C40-4B15-8766-3CF1C58F985A}"
      script_block_text: Get-DomainComputer
    expectation:
      expected: alert
      summary: "PowerShell runs Get-DomainComputer to enumerate domain computers"
      mitre:
        tactics: [discovery]
        techniques: [T1018]
