type: job
name: Powershell Remove Windows Defender Directory
detection:
  source: escu
  name: "ESCU - Powershell Remove Windows Defender Directory - Rule"
  id: adf47620-79fa-11ec-b248-acde48001122
description: |
  Validates detection of a PowerShell attempt to delete the Windows Defender
  data directory: PowerShell/Operational EID 4104 (Script Block Logging)
  records a block holding an rmdir -Recurse command aimed at the
  Microsoft\Windows Defender folder under ProgramData.

mitre:
  tactics: [defense-impairment]
  techniques: [T1685]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      provider_guid:     "{A0C1853B-5C40-4B15-8766-3CF1C58F985A}"
      script_block_text: rmdir 'C:\ProgramData\Microsoft\Windows Defender' -Recurse
    expectation:
      expected: alert
      summary: "PowerShell runs rmdir -Recurse on the ProgramData Windows Defender folder"
      mitre:
        tactics: [defense-impairment]
        techniques: [T1685]
