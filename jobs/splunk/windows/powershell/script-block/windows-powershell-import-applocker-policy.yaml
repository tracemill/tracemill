type: job
name: Windows Powershell Import Applocker Policy
detection:
  source: escu
  name: "ESCU - Windows Powershell Import Applocker Policy - Rule"
  id: 102af98d-0ca3-4aa4-98d6-7ab2b98b955a
description: |
  Validates detection of PowerShell applying an AppLocker policy from an XML
  file: PowerShell/Operational EID 4104 (Script Block Logging) records a
  block that runs Import-Module AppLocker and then Set-AppLockerPolicy
  -XMLPolicy with a policy file, for example 5.xml.

mitre:
  tactics: [execution, defense-impairment]
  techniques: [T1059.001, T1685]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      provider_guid:     "{A0C1853B-5C40-4B15-8766-3CF1C58F985A}"
      script_block_text: "Import-Module applocker ; Set-AppLockerPolicy -XMLPolicy 5.xml"
    expectation:
      expected: alert
      summary: "PowerShell runs Import-Module applocker; Set-AppLockerPolicy -XMLPolicy"
      mitre:
        tactics: [execution, defense-impairment]
        techniques: [T1059.001, T1685]
