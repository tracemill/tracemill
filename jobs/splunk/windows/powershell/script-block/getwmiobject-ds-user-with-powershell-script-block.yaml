type: job
name: GetWmiObject DS User with PowerShell Script Block
detection:
  source: escu
  name: "ESCU - GetWmiObject DS User with PowerShell Script Block - Rule"
  id: fabd364e-04f3-11ec-b34b-acde48001122
description: |
  Validates detection of domain user enumeration through WMI:
  PowerShell/Operational EID 4104 (Script Block Logging) records a block
  holding a Get-WmiObject command that queries the ds_user class in the
  root\directory\ldap namespace, which returns the Active Directory user
  accounts of the domain.

mitre:
  tactics: [discovery]
  techniques: [T1087.002]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      provider_guid:     "{A0C1853B-5C40-4B15-8766-3CF1C58F985A}"
      script_block_text: get-wmiobject -class ds_user -namespace root\directory\ldap
    expectation:
      expected: alert
      summary: "PowerShell runs Get-WmiObject -class ds_user -namespace root\\directory\\ldap"
      mitre:
        tactics: [discovery]
        techniques: [T1087.002]
