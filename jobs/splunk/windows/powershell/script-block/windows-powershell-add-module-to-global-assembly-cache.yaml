type: job
name: Windows PowerShell Add Module to Global Assembly Cache
detection:
  source: escu
  name: "ESCU - Windows PowerShell Add Module to Global Assembly Cache - Rule"
  id: 3fc16961-97e5-4a5b-a079-e4ab0d9763eb
description: |
  Validates detection of PowerShell using the .NET Publish class that
  installs assemblies into the Global Assembly Cache: PowerShell/Operational
  EID 4104 (Script Block Logging) records a block that creates a
  System.EnterpriseServices.Internal.Publish object with New-Object.

mitre:
  tactics: [persistence]
  techniques: [T1505.004]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      provider_guid:     "{A0C1853B-5C40-4B15-8766-3CF1C58F985A}"
      script_block_text: new-object system.enterpriseservices.internal.publish
    expectation:
      expected: alert
      summary: "PowerShell runs New-Object System.EnterpriseServices.Internal.Publish"
      mitre:
        tactics: [persistence]
        techniques: [T1505.004]
