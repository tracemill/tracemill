type: job
name: Get-ForestTrust with PowerShell Script Block
detection:
  source: escu
  name: "ESCU - Get-ForestTrust with PowerShell Script Block - Rule"
  id: 70fac80e-0bf1-11ec-9ba0-acde48001122
description: |
  Validates detection of PowerView source code that references
  Get-ForestTrust being loaded into PowerShell: PowerShell/Operational EID
  4104 (Script Block Logging) records one fragment of a longer block holding
  PowerView function definitions, among them Get-DomainTrustMapping, whose
  help text names Get-ForestTrust as a dependency. PowerShell logged the
  block at Warning level, which it does for blocks it flags as suspicious.
tags: [powerview]

mitre:
  tactics: [execution, discovery]
  techniques: [T1482, T1059.001]

state:
  domain_short:       CORP
  domain_tld:         local
  domain_short_lower: fn.lower(ref.domain_short)
  domain_fqdn:        "${ref.domain_short_lower}.${ref.domain_tld}"
  computer:           gen.hostname(class=windows-server, domain=ref.domain_fqdn)
  level:              3

workloads:
  - scenario: scenarios/windows/powershell/script-block/script-block-logged
    bindings:
      domain_short:      ref.domain_short
      domain_tld:        ref.domain_tld
      computer:          ref.computer
      level:             ref.level
      provider_guid:     "{A0C1853B-5C40-4B15-8766-3CF1C58F985A}"
      message_number:    "74"
      message_total:     "76"
