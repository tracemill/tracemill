        \x20       $Credential = [Management.Automation.PSCredential]::Empty\n\
        \x20   )\n\
        \n\
        \x20   # keep track of domains seen so we don't hit infinite recursion\n\
        \x20   $SeenDomains = @{}\n\
        \n\
        \x20   # our domain status tracker\n\
        \x20   $Domains = New-Object System.Collections.Stack\n\
        \n\
        \x20   $DomainTrustArguments = @{}\n\
        \x20   if ($PSBoundParameters['API']) { $DomainTrustArguments['API'] = $API }\n\
