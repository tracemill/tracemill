        \x20           $GroupDistinguishedName = $_.distinguishedname\n\
        \x20           $GroupDomain = $GroupDistinguishedName.SubString($GroupDistinguishedName.IndexOf('DC=')) -replace 'DC=','' -replace ',','.'\n\
        \n\
        \x20           $_.member | ForEach-Object {\n\
