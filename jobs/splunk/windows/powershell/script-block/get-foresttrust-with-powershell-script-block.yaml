        \x20   [OutputType('PowerView.DomainTrust.NET')]\n\
        \x20   [OutputType('PowerView.DomainTrust.LDAP')]\n\
        \x20   [OutputType('PowerView.DomainTrust.API')]\n\
        \x20   [CmdletBinding(DefaultParameterSetName = 'LDAP')]\n\
        \x20   Param(\n\
        \x20       [Parameter(ParameterSetName = 'API')]\n\
        \x20       [Switch]\n\
        \x20       $API,\n\
        \n\
        \x20       [Parameter(ParameterSetName = 'NET')]\n\
        \x20       [Switch]\n\
        \x20       $NET,\n\
        \n\
        \x20       [Parameter(ParameterSetName = 'LDAP')]\n\
        \x20       [ValidateNotNullOrEmpty()]\n\
        \x20       [Alias('Filter')]\n\
        \x20       [String]\n\
        \x20       $LDAPFilter,\n\
        \n\
