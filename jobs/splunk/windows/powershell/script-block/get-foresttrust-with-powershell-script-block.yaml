        \n\
        \n\
        function Get-DomainTrustMapping {\n\
        <#\n\
        .SYNOPSIS\n\
        \n\
        This function enumerates all trusts for the current domain and then enumerates\n\
        all trusts for each domain it finds.\n\
        \n\
        Author: Will Schroeder (@harmj0y)  \n\
        License: BSD 3-Clause  \n\
        Required Dependencies: Get-Domain, Get-DomainTrust, Get-ForestTrust  \n\
        \n\
        .DESCRIPTION\n\
        \n\
        This function will enumerate domain trust relationships for the current domain using\n\
        a number of methods, and then enumerates all trusts for each found domain, recursively\n\
        mapping all reachable trust relationships. By default, and LDAP search using the filter\n\
        '(objectClass=trustedDomain)' is used- if any LDAP-appropriate parameters are specified\n\
        LDAP is used as well. If the -NET flag is specified, the .NET method\n\
        GetAllTrustRelationships() is used on the System.DirectoryServices.ActiveDirectory.Domain\n\
        object. If the -API flag is specified, the Win32 API DsEnumerateDomainTrusts() call is\n\
        used to enumerate instead. If any \n\
        \n\
        .PARAMETER API\n\
        \n\
        Switch. Use an API call (DsEnumerateDomainTrusts) to enumerate the trusts instead of the\n\
        built-in LDAP method.\n\
        \n\
        .PARAMETER NET\n\
        \n\
        Switch. Use .NET queries to enumerate trusts instead of the default LDAP method.\n\
        \n\
        .PARAMETER LDAPFilter\n\
        \n\
        Specifies an LDAP query string that is used to filter Active Directory objects.\n\
        \n\
        .PARAMETER Properties\n\
        \n\
        Specifies the properties of the output object to retrieve from the server.\n\
        \n\
        .PARAMETER SearchBase\n\
        \n\
        The LDAP source to search through, e.g. \"LDAP://OU=secret,DC=testlab,DC=local\"\n\
        Useful for OU queries.\n\
        \n\
        .PARAMETER Server\n\
        \n\
        Specifies an Active Directory server (domain controller) to bind to.\n\
        \n\
        .PARAMETER SearchScope\n\
        \n\
        Specifies the scope to search under, Base/OneLevel/Subtree (default of Subtree).\n\
        \n\
        .PARAMETER ResultPageSize\n\
        \n\
        Specifies the PageSize to set for the LDAP searcher object.\n\
        \n\
        .PARAMETER ServerTimeLimit\n\
        \n\
        Specifies the maximum amount of time the server spends searching. Default of 120 seconds.\n\
        \n\
        .PARAMETER Tombstone\n\
        \n\
        Switch. Specifies that the searcher should also return deleted/tombstoned objects.\n\
        \n\
        .PARAMETER Credential\n\
        \n\
        A [Management.Automation.PSCredential] object of alternate credentials\n\
        for connection to the target domain.\n\
        \n\
        .EXAMPLE\n\
        \n\
        Get-DomainTrustMapping | Export-CSV -NoTypeInformation trusts.csv\n\
        \n\
        Map all reachable domain trusts using .NET methods and output everything to a .csv file.\n\
        \n\
        .EXAMPLE\n\
        \n\
        Get-DomainTrustMapping -API | Export-CSV -NoTypeInformation trusts.csv\n\
        \n\
        Map all reachable domain trusts using Win32 API calls and output everything to a .csv file.\n\
        \n\
        .EXAMPLE\n\
        \n\
        Get-DomainTrustMapping -NET | Export-CSV -NoTypeInformation trusts.csv\n\
        \n\
        Map all reachable domain trusts using .NET methods and output everything to a .csv file.\n\
        \n\
        .EXAMPLE\n\
        \n\
        $SecPassword = ConvertTo-SecureString 'Password123!' -AsPlainText -Force\n\
        $Cred = New-Object System.Management.Automation.PSCredential('TESTLAB\\dfm.a', $SecPassword)\n\
        Get-DomainTrustMapping -Server 'PRIMARY.testlab.local' | Export-CSV -NoTypeInformation trusts.csv\n\
        \n\
        Map all reachable domain trusts using LDAP, binding to the PRIMARY.testlab.local server for queries\n\
        using the specified alternate credentials, and output everything to a .csv file.\n\
        \n\
        .OUTPUTS\n\
        \n\
        PowerView.DomainTrust.LDAP\n\
        \n\
        Custom PSObject with translated domain LDAP trust result fields (default).\n\
        \n\
        PowerView.DomainTrust.NET\n\
        \n\
        A TrustRelationshipInformationCollection returned when using .NET methods.\n\
        \n\
        PowerView.DomainTrust.API\n\
        \n\
        Custom PSObject with translated domain API trust result fields.\n\
        #>\n\
        \n\
