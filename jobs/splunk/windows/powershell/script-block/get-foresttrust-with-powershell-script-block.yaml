        \x20   if ($PSBoundParameters['LDAPFilter']) { $DomainTrustArguments['LDAPFilter'] = $LDAPFilter }\n\
        \x20   if ($PSBoundParameters['Properties']) { $DomainTrustArguments['Properties'] = $Properties }\n\
        \x20   if ($PSBoundParameters['SearchBase']) { $DomainTrustArguments['SearchBase'] = $SearchBase }\n\
        \x20   if ($PSBoundParameters['Server']) { $DomainTrustArguments['Server'] = $Server }\n\
        \x20   if ($PSBoundParameters['SearchScope']) { $DomainTrustArguments['SearchScope'] = $SearchScope }\n\
        \x20   if ($PSBoundParameters['ResultPageSize']) { $DomainTrustArguments['ResultPageSize'] = $ResultPageSize }\n\
        \x20   if ($PSBoundParameters['ServerTimeLimit']) { $DomainTrustArguments['ServerTimeLimit'] = $ServerTimeLimit }\n\
        \x20   if ($PSBoundParameters['Tombstone']) { $DomainTrustArguments['Tombstone'] = $Tombstone }\n\
        \x20   if ($PSBoundParameters['Credential']) { $DomainTrustArguments['Credential'] = $Credential }\n\
        \n\
        \x20   # get the current domain and push it onto the stack\n\
        \x20   if ($PSBoundParameters['Credential']) {\n\
        \x20       $CurrentDomain = (Get-Domain -Credential $Credential).Name\n\
        \x20   }\n\
        \x20   else {\n\
