        \x20       [ValidateNotNullOrEmpty()]\n\
        \x20       [Alias('ADSPath')]\n\
        \x20       [String]\n\
        \x20       $SearchBase,\n\
        \n\
        \x20       [Parameter(ParameterSetName = 'LDAP')]\n\
