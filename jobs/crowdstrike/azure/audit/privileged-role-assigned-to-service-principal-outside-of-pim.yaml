type: job
name: Microsoft Entra ID Privileged Role Assigned to Service Principal outside of PIM
detection:
  source: ngsiem_template
  name: "Microsoft - Entra ID - Privileged Role Assigned to Service Principal outside of PIM"
  id: 37a73fdc-18c2-42ac-a4bd-bceb15f2d795
description: |
  An administrator adds a service principal directly to the Privileged
  Role Administrator directory role, outside Privileged Identity
  Management. The application behind the service principal can then
  assign any directory role, including to itself.

mitre:
  tactics: [privilege-escalation]
  techniques: [T1098.003]

state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  admin_upn: "admin@example.onmicrosoft.com"
  src_ip:    gen.ipv4()

workloads:
  - scenario: scenarios/azure/audit/assign-directory-role-to-service-principal
    bindings:
      tenant_id: ref.tenant_id
      admin_upn: ref.admin_upn
      src_ip:    ref.src_ip
    expectation:
      expected: alert
      summary: "A service principal is added directly to the Privileged Role Administrator role"
      mitre:
        tactics: [privilege-escalation]
        techniques: [T1098.003]
