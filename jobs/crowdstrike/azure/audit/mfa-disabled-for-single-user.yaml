type: job
name: Microsoft Entra ID MFA Disabled for Single User
detection:
  source: ngsiem_template
  name: "Microsoft - Entra ID - MFA Disabled for Single User"
  id: 1db326ab-fa77-4145-b692-06f8022b8944
description: |
  An administrator disables per-user multi-factor authentication for one
  account, removing the second factor that would stop a stolen password
  from being used.

mitre:
  tactics: [persistence]
  techniques: [T1556.006]

state:
  tenant_id:  "11111111-1111-1111-1111-111111111111"
  admin_upn:  "admin@example.onmicrosoft.com"
  target_upn: "user@example.onmicrosoft.com"
  src_ip:     gen.ipv4()

workloads:
  - scenario: scenarios/azure/audit/disable-strong-authentication
    bindings:
      tenant_id:  ref.tenant_id
      admin_upn:  ref.admin_upn
      target_upn: ref.target_upn
      src_ip:     ref.src_ip
    expectation:
      expected: alert
      summary: "Per-user MFA is disabled for an account"
      mitre:
        tactics: [persistence]
        techniques: [T1556.006]
