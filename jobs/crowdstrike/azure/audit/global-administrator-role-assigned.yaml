type: job
name: Microsoft Entra ID Global Administrator Role Assigned
detection:
  source: ngsiem_template
  name: "Microsoft - Entra ID - Global Administrator Role Assigned"
  id: dcc20f98-c5ca-475e-b5af-84344eae83fb
description: |
  An administrator adds a user to the Global Administrator directory role,
  the most privileged built-in role in a Microsoft Entra ID tenant. A
  control assigns the same user Service Support Administrator, a narrow
  role, instead.

mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1098.003]

state:
  tenant_id:  "11111111-1111-1111-1111-111111111111"
  admin_upn:  "admin@example.onmicrosoft.com"
  target_upn: "user@example.onmicrosoft.com"
  src_ip:     gen.ipv4()

workloads:
  - scenario: scenarios/azure/audit/assign-directory-role
    bindings:
      tenant_id:  ref.tenant_id
      admin_upn:  ref.admin_upn
      target_upn: ref.target_upn
      src_ip:     ref.src_ip
    expectation:
      expected: alert
      summary: "A user is added to the Global Administrator directory role"
      mitre:
        tactics: [persistence, privilege-escalation]
        techniques: [T1098.003]

  - scenario: scenarios/azure/audit/assign-directory-role
    bindings:
      tenant_id:            ref.tenant_id
      admin_upn:            ref.admin_upn
      target_upn:           ref.target_upn
      src_ip:               ref.src_ip
      role_display_name:    "Service Support Administrator"
      role_template_id:     "f023fd81-a637-4b56-95fd-791ac0226033"
      role_well_known_name: "\"ServiceSupportAdmins\""
    expectation:
      expected: none
      summary: "The same user is added to Service Support Administrator, a narrow role"
