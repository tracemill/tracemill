type: job
name: Microsoft Entra ID Privileged Role Assigned to User Account outside of PIM
detection:
  source: ngsiem_template
  name: "Microsoft - Entra ID - Privileged Role Assigned to User Account outside of PIM"
  id: 0b33013a-339b-4c62-b558-e7b8e8580a33
description: |
  An administrator adds a user directly to a privileged directory role,
  Global Administrator, instead of granting it through Privileged Identity
  Management. A control assigns the same user Directory Readers, a
  read-only role.

mitre:
  tactics: [privilege-escalation]
  techniques: [T1098.003]

state:
  tenant_id:  "11111111-1111-1111-1111-111111111111"
  admin_upn:  "admin@example.onmicrosoft.com"
  target_upn: "user@example.onmicrosoft.com"
  src_ip:     gen.ipv4()

workloads:
  - scenario: scenarios/azure/audit/assign-directory-role
    bindings:
      tenant_id:  ref.tenant_id
      admin_upn:  ref.admin_upn
      target_upn: ref.target_upn
      src_ip:     ref.src_ip
    expectation:
      expected: alert
      summary: "A user is added directly to the Global Administrator role"
      mitre:
        tactics: [privilege-escalation]
        techniques: [T1098.003]

  - scenario: scenarios/azure/audit/assign-directory-role
    bindings:
      tenant_id:            ref.tenant_id
      admin_upn:            ref.admin_upn
      target_upn:           ref.target_upn
      src_ip:               ref.src_ip
      role_display_name:    "Directory Readers"
      role_template_id:     "88d8e3e3-8f55-4a1e-953a-9b9898b8876b"
      role_well_known_name: "\"\""
    expectation:
      expected: none
      summary: "The same user is added to Directory Readers, a read-only role"
