type: job
name: Microsoft Entra ID Temporary Access Pass Added to User Account
detection:
  source: ngsiem_template
  name: "Microsoft - Entra ID - Temporary Access Pass Added to User Account"
  id: fc9156ab-7cab-45d3-a4ce-cbcb0137fe12
description: |
  An administrator registers a Temporary Access Pass for a user. The pass
  is a time-limited passcode that satisfies sign-in, including MFA, so
  whoever holds it can sign in as the user and register new methods.

mitre:
  tactics: [privilege-escalation]
  techniques: [T1078.004]

state:
  tenant_id:  "11111111-1111-1111-1111-111111111111"
  victim_upn: "targetUser@example.onmicrosoft.com"
  src_ip:     gen.ipv4()

workloads:
  - scenario: scenarios/azure/audit/register-security-info
    bindings:
      tenant_id:          ref.tenant_id
      victim_upn:         ref.victim_upn
      src_ip:             ref.src_ip
      operation_name:     "Admin registered security info"
      result_description: "Admin registered temporary access pass method for user"
    expectation:
      expected: alert
      summary: "An administrator registers a Temporary Access Pass for a user"
      mitre:
        tactics: [privilege-escalation]
        techniques: [T1078.004]
