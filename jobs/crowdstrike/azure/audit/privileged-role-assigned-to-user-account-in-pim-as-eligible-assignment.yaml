type: job
name: Microsoft Entra ID Privileged Role Assigned to User Account in PIM as Eligible Assignment
detection:
  source: ngsiem_template
  name: "Microsoft - Entra ID - Privileged Role Assigned to User Account in PIM as Eligible Assignment"
  id: cd64fcb0-ab09-4fc4-b95b-039fe5852632
description: |
  Privileged Identity Management completes a time-bound eligible
  assignment of the Global Administrator role to a user, who can then
  activate the role at will. A control removes an eligible assignment
  instead.

mitre:
  tactics: [privilege-escalation]
  techniques: [T1098.003]

state:
  tenant_id:  "11111111-1111-1111-1111-111111111111"
  target_upn: "targetUser@example.onmicrosoft.com"
  src_ip:     gen.ipv4()

workloads:
  - scenario: scenarios/azure/audit/pim-eligible-role-assignment
    bindings:
      tenant_id:  ref.tenant_id
      target_upn: ref.target_upn
      src_ip:     ref.src_ip
    expectation:
      expected: alert
      summary: "A user is made eligible for the Global Administrator role in PIM"
      mitre:
        tactics: [privilege-escalation]
        techniques: [T1098.003]

  - scenario: scenarios/azure/audit/pim-eligible-role-assignment
    bindings:
      tenant_id:            ref.tenant_id
      target_upn:           ref.target_upn
      src_ip:               ref.src_ip
      operation_name:       "Remove eligible member from role in PIM completed (timebound)"
      operation_type:       "AdminRemoveEligibleRole"
      second_resource_type: "RoleAssignment"
    expectation:
      expected: none
      summary: "An eligible Global Administrator assignment is removed in PIM"
