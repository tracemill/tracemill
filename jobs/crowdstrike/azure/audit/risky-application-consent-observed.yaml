type: job
name: Microsoft Entra ID Risky Application Consent Observed
detection:
  source: ngsiem_template
  name: "Microsoft - Entra ID - Risky Application Consent Observed"
  id: 3a3225d0-fa56-419a-b7e1-88659cb80c1d
description: |
  A user tries to consent to mailbox permissions for an application that
  Microsoft has flagged as risky, and the consent is blocked. The attempt
  shows a user being targeted by a consent-phishing application.

mitre:
  tactics: [credential-access]
  techniques: [T1528]

state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  user_upn:  "user@example.onmicrosoft.com"
  src_ip:    gen.ipv4()

workloads:
  - scenario: scenarios/azure/audit/consent-blocked-risky-app
    bindings:
      tenant_id: ref.tenant_id
      user_upn:  ref.user_upn
      src_ip:    ref.src_ip
    expectation:
      expected: alert
      summary: "A consent to an application flagged as risky is blocked"
      mitre:
        tactics: [credential-access]
        techniques: [T1528]
