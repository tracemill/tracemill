type: job
name: Microsoft Entra ID Admin Deleted MFA Authentication Method
detection:
  source: ngsiem_template
  name: "Microsoft - Entra ID - Admin Deleted MFA Authentication Method"
  id: 4466f2ed-1c01-43f0-9185-9b4a1817cd8a
description: |
  An administrator deletes one of a user's registered authentication
  methods. Removing a method can strip the user's second factor or clear
  the way for an attacker to register their own.

mitre:
  tactics: [persistence]
  techniques: [T1556.006]

state:
  tenant_id:  "11111111-1111-1111-1111-111111111111"
  victim_upn: "targetUser@example.onmicrosoft.com"
  src_ip:     gen.ipv4()

workloads:
  - scenario: scenarios/azure/audit/register-security-info
    bindings:
      tenant_id:          ref.tenant_id
      victim_upn:         ref.victim_upn
      src_ip:             ref.src_ip
      operation_name:     "Admin deleted security info"
      operation_type:     "Delete"
      result_description: "Admin deleted Mobile Phone SMS method for user"
    expectation:
      expected: alert
      summary: "An administrator deletes a user's authentication method"
      mitre:
        tactics: [persistence]
        techniques: [T1556.006]
