type: job
name: Microsoft Entra ID Consent to Known Suspicious OAuth Client
detection:
  source: ngsiem_template
  name: "Microsoft - Entra ID - Known Suspicious OAuth Clients"
  id: 874b0d57-ed4e-43f9-8845-fe71c36a415f
description: |
  A user consents to delegated mailbox permissions for an application
  whose client ID belongs to a publicly reported malicious OAuth
  application. A control grants the same consent to an application with
  an unremarkable client ID.

mitre:
  tactics: [credential-access]
  techniques: [T1528]

state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  user_upn:  "user@example.onmicrosoft.com"
  src_ip:    gen.ipv4()

workloads:
  - scenario: scenarios/azure/audit/consent-to-application-granted
    bindings:
      tenant_id: ref.tenant_id
      user_upn:  ref.user_upn
      src_ip:    ref.src_ip
      app_id:    "ff8d92dc-3d82-41d6-bcbd-b9174d163620"
    expectation:
      expected: alert
      summary: "A user consents to an application with a known malicious client ID"
      mitre:
        tactics: [credential-access]
        techniques: [T1528]

  - scenario: scenarios/azure/audit/consent-to-application-granted
    bindings:
      tenant_id: ref.tenant_id
      user_upn:  ref.user_upn
      src_ip:    ref.src_ip
    expectation:
      expected: none
      summary: "The same consent is granted to an application with an unremarkable client ID"
