type: job
name: Microsoft Entra ID Guest Promoted to Member
detection:
  source: ngsiem_template
  name: "Microsoft - Entra ID - Guest Promoted to Member"
  id: 837b073c-8f22-4d20-aac1-fb9a2191cd3f
description: |
  An administrator changes a guest account's user type to member. Members
  get the default access of internal users, so a promoted guest can read
  much more of the directory than a guest can.

mitre:
  tactics: [persistence]
  techniques: [T1098]

state:
  tenant_id:  "11111111-1111-1111-1111-111111111111"
  admin_upn:  "admin@example.onmicrosoft.com"
  target_upn: "partner_example.com#EXT#@example.onmicrosoft.com"
  src_ip:     gen.ipv4()

workloads:
  - scenario: scenarios/azure/audit/update-user-directory-attribute
    bindings:
      tenant_id:           ref.tenant_id
      admin_upn:           ref.admin_upn
      target_upn:          ref.target_upn
      src_ip:              ref.src_ip
      attribute_name:      "UserType"
      attribute_old_value: "\"Guest\""
      attribute_new_value: "\"Member\""
    expectation:
      expected: alert
      summary: "A guest account's user type is changed to member"
      mitre:
        tactics: [persistence]
        techniques: [T1098]
