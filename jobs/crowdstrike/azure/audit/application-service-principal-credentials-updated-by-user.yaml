type: job
name: Microsoft Entra ID Application Credentials Updated by User
detection:
  source: ngsiem_template
  name: "Microsoft - Entra ID - Application/Service Principal Credentials Updated by User"
  id: c27fd6bb-b8c1-4247-a13c-9d045acf6733
description: |
  A user adds a client secret to an application registration through the
  certificates and secrets blade. A new credential on an existing
  application lets whoever holds it sign in as that application and use
  every permission it has been granted.

mitre:
  tactics: [privilege-escalation]
  techniques: [T1098.001]

state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  admin_upn: "admin@example.onmicrosoft.com"
  src_ip:    gen.ipv4()

workloads:
  - scenario: scenarios/azure/audit/add-application-credential
    bindings:
      tenant_id: ref.tenant_id
      admin_upn: ref.admin_upn
      src_ip:    ref.src_ip
    expectation:
      expected: alert
      summary: "A user adds a client secret to an application registration"
      mitre:
        tactics: [privilege-escalation]
        techniques: [T1098.001]
