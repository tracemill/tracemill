type: job
name: Microsoft Entra ID New Authentication Domain Added
detection:
  source: ngsiem_template
  name: "Microsoft - Entra ID - New Authentication Domain Added"
  id: db50d9fe-922b-4421-99e5-6fa493848f2b
description: |
  An administrator changes the authentication settings of a tenant
  domain, as when a domain is switched to federated sign-in. A federated
  domain trusts tokens from an external identity provider, which an
  attacker who controls that provider can mint for any user. A control
  adds an unverified domain without changing authentication.

mitre:
  tactics: [privilege-escalation]
  techniques: [T1484.002]

state:
  tenant_id: "11111111-1111-1111-1111-111111111111"
  admin_upn: "admin@example.onmicrosoft.com"
  src_ip:    gen.ipv4()

workloads:
  - scenario: scenarios/azure/audit/add-unverified-domain
    bindings:
      tenant_id:      ref.tenant_id
      admin_upn:      ref.admin_upn
      src_ip:         ref.src_ip
      operation_name: "Set domain authentication"
    expectation:
      expected: alert
      summary: "The authentication settings of a tenant domain are changed"
      mitre:
        tactics: [privilege-escalation]
        techniques: [T1484.002]

  - scenario: scenarios/azure/audit/add-unverified-domain
    bindings:
      tenant_id: ref.tenant_id
      admin_upn: ref.admin_upn
      src_ip:    ref.src_ip
    expectation:
      expected: none
      summary: "An unverified domain is added without an authentication change"
