type: job
name: AWS CloudTrail Restore Public AWS RDS Instance - Sigma
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - Restore Public AWS RDS Instance - Sigma"
  id: c3f265c7-ff03-4056-8ab2-d486227b4599
description: |
  A DB snapshot is restored into a publicly accessible instance with a
  RestoreDBInstanceFromDBSnapshot call that sets publiclyAccessible to true,
  which puts the snapshot's data behind an internet-facing endpoint.

mitre:
  tactics: [exfiltration]
  techniques: [T1537, T1578.002]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/rds#1.103.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/rds/restore-db-instance-public
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "RestoreDBInstanceFromDBSnapshot -- restored instance is publicly accessible"
      expected: alert
