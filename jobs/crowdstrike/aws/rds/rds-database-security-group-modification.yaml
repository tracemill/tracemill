type: job
name: AWS CloudTrail RDS Database Security Group Modification - Sigma
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - RDS Database Security Group Modification - Sigma"
  id: 14f3f1c8-02d5-43a2-a191-91ffb52d3015
description: |
  A DB security group is created with a CreateDBSecurityGroup call; these
  groups decide which addresses can reach a database.

mitre:
  tactics: [defense-evasion]
  techniques: [T1562.007]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/rds#1.103.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/rds/create-db-security-group
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "CreateDBSecurityGroup -- new DB security group"
      expected: alert
