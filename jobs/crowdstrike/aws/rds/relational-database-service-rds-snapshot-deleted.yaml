type: job
name: AWS CloudTrail Relational Database Service (RDS) Snapshot Deleted
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - Relational Database Service (RDS) Snapshot Deleted"
  id: 37e2aa16-1140-4d29-9c32-3155542b4de4
description: |
  An actor removes a database restore path. The detection has two branches:
  DeleteDBSnapshot or DeleteDBClusterSnapshot succeeding, or ModifyDBInstance
  setting backupRetentionPeriod to zero. This job drives the
  snapshot-deletion branch.

mitre:
  tactics: [impact]
  techniques: [T1485]

state:
  account_id: "000000000000"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor:      gen.aws_identity(type=AssumedRole, accountId=ref.account_id)
  user_agent: "Boto3/1.34.51 Python/3.11.8 Linux/5.15.0-101-generic Botocore/1.34.51 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/rds/delete-db-snapshot
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "DeleteDBSnapshot -- manual snapshot deleted, succeeding"
      expected: alert
