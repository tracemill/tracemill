type: job
name: AWS CloudTrail AWS RDS Master Password Change - Sigma
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - AWS RDS Master Password Change - Sigma"
  id: 8a63cdd4-6207-414a-85bc-7e032bd3c1a2
description: |
  The master password of an RDS instance is reset with a ModifyDBInstance
  call that sets a new masterUserPassword, handing whoever set it direct
  database access.

mitre:
  tactics: [exfiltration]
  techniques: [T1020]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor:      gen.aws_identity(type=AssumedRole, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/rds#1.91.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/rds/reset-rds-master-password
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "ModifyDBInstance -- pendingModifiedValues carries a new masterUserPassword"
      expected: alert
