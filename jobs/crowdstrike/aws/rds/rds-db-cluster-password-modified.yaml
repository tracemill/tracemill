type: job
name: AWS CloudTrail RDS DB Cluster Password Modified
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - RDS DB Cluster Password Modified"
  id: fe934938-d5e3-48b8-b5e5-75a093eb2989
description: |
  The master user password of an Aurora DB cluster is reset with a
  successful ModifyDBCluster call that sets masterUserPassword and applies
  it immediately; whoever sets it controls every database in the cluster.

mitre:
  tactics: [credential-access, persistence]
  techniques: [T1098, T1078.004]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/rds#1.103.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/rds/modify-db-cluster-master-password
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "ModifyDBCluster -- master user password reset and applied immediately"
      expected: alert
