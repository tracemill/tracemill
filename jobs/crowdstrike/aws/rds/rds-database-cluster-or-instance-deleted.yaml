type: job
name: AWS CloudTrail RDS Database Cluster or Instance Deleted
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - RDS Database Cluster or Instance Deleted"
  id: a153feeb-5335-4d96-a0d3-5cb173b185fe
description: |
  An RDS DB instance is deleted with a successful DeleteDBInstance call
  that skips the final snapshot and deletes the automated backups, removing
  the ways back.

mitre:
  tactics: [impact]
  techniques: [T1485]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/rds#1.103.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/rds/delete-db-instance
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "DeleteDBInstance -- instance deleted with no final snapshot and no automated backups"
      expected: alert
