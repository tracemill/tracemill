type: job
name: AWS CloudTrail Bedrock Guardrail Deleted
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - Bedrock Guardrail Deleted"
  id: 60a8851e-cc3a-4347-986e-51c897e0eb53
description: |
  A Bedrock guardrail is removed, lifting the content and topic policy that
  sits in front of the models. The rule keys on a successful
  bedrock.amazonaws.com DeleteGuardrail call.

mitre:
  tactics: [defense-evasion]
  techniques: [T1562.001]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor:      gen.aws_identity(type=AssumedRole, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/bedrock#1.29.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/bedrock/delete-guardrail
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "DeleteGuardrail -- the model guardrail is removed"
      expected: alert
