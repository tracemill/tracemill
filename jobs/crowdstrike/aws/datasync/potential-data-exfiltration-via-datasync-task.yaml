type: job
name: AWS CloudTrail Potential Data Exfiltration via DataSync Task
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - Potential Data Exfiltration via DataSync Task"
  id: 9d7c9d9e-c175-4f4c-bae6-599a6c95ea77
description: |
  A DataSync task is created with a successful CreateTask call, standing up
  a scheduled bulk copy between two storage locations that will keep moving
  data out on its own.

mitre:
  tactics: [exfiltration]
  techniques: [T1537]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor:      gen.aws_identity(type=AssumedRole, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/datasync#1.34.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/datasync/create-task
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "CreateTask -- an hourly DataSync copy is scheduled to a second region"
      expected: alert
