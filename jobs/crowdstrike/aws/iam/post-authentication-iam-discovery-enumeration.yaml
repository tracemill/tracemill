type: job
name: AWS CloudTrail Post-Authentication IAM Discovery Enumeration
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - Post-Authentication IAM Discovery Enumeration"
  id: 20a7faca-9e12-4cf9-b23a-f1f276cb4459
description: |
  An identity authenticates and then surveys IAM. The rule keeps the
  identity, source address and user agent of successful sign-ins and role
  assumptions from 10 to 70 minutes before it runs, and fires when the same
  triple makes more than five successful IAM reads across more than three
  distinct actions. The job authenticates with AssumeRole, whose
  userIdentity is the caller, then makes eight distinct IAM reads at once
  and the same eight again twelve minutes later. The first batch is matched
  by a rule running at the template's own hourly schedule and 1h10m
  lookback; the second by a rule deployed with a lookback of about ten
  minutes, which only sees reads made after the authentication has aged
  into the table.

mitre:
  tactics: [discovery, initial-access]
  techniques: [T1069.003, T1087.004, T1580, T1078]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/iam#1.44.0 tracemill/1.0"
  role:       gen.username()

workloads:
  - scenario: scenarios/aws/sts/assume-role
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
      role_name:  ref.role
    expectation:
      summary: "AssumeRole -- the authentication the reads are matched to"
      expected: alert
  - scenario: scenarios/aws/iam/iam-enumeration-reads
    start_after: 10s
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
      role_name:  ref.role
    expectation:
      summary: "Eight distinct successful IAM reads right after the authentication"
      expected: alert
  - scenario: scenarios/aws/iam/iam-enumeration-reads
    start_after: 12m
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
      role_name:  ref.role
    expectation:
      summary: "The same eight reads twelve minutes later, same identity, address and agent"
      expected: alert
