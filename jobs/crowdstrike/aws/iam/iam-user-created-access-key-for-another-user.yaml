type: job
name: AWS CloudTrail IAM User Created Access Key For Another User
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - IAM User Created Access Key For Another User"
  id: 97242334-baa6-4501-8d15-9b3f4f577b8c
description: |
  One IAM user mints a long-lived access key belonging to a different IAM
  user. The rule keys on a successful CreateAccessKey by an IAMUser caller
  where the request's userName differs from the caller's own.

mitre:
  tactics: [persistence, credential-access]
  techniques: [T1098.001, T1606]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor:      gen.aws_identity(type=IAMUser, userName=attacker-user, accountId=ref.account_id)
  new_key:    gen.aws_access_key(userName=target-admin, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/iam#1.44.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/iam/create-access-key
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      new_key:    ref.new_key
      user_agent: ref.user_agent
    expectation:
      summary: "CreateAccessKey -- the caller mints a key whose userName is another IAM user"
      expected: alert
