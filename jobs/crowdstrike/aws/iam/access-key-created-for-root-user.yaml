type: job
name: AWS CloudTrail Access Key Created for Root User
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - Access Key Created for Root User"
  id: bb418a2c-90de-4c23-aee9-dd85b3f86a45
description: |
  The account root mints itself a long-lived access key, turning the
  unrestricted root credential into a programmatic one. The rule keys on a
  successful CreateAccessKey whose caller is Root and whose request carries
  no target user name -- the marker that root is acting on itself.

mitre:
  tactics: [persistence]
  techniques: [T1098.001]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor:      gen.aws_identity(type=Root, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/iam#1.44.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/iam/create-access-key
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "CreateAccessKey -- the root identity mints a long-lived access key"
      expected: alert
