type: job
name: AWS CloudTrail Suspicious IAM User Creation - Administrative Keywords
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - Suspicious IAM User Creation - Administrative Keywords"
  id: 8dd6f633-7933-439d-bfc0-67628b5aa5ca
description: |
  An actor creates an IAM user whose name borrows administrative or service
  vocabulary, to blend in with legitimate privileged accounts: a successful
  CreateUser whose requested userName reads like a backup service admin.

mitre:
  tactics: [defense-evasion, persistence]
  techniques: [T1036, T1078.004, T1136.003]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/iam#1.44.0 tracemill/1.0"
  suffix:     gen.hex(len=4, case=lower)
  new_user:   "svc-backup-admin-${ref.suffix}"

workloads:
  - scenario: scenarios/aws/iam/create-user
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
      user_name:  ref.new_user
    expectation:
      summary: "CreateUser -- requested userName contains admin, backup and svc"
      expected: alert
