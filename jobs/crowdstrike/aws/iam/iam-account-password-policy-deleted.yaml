type: job
name: AWS CloudTrail IAM Account Password Policy Updated or Deleted
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - IAM Account Password Policy Updated or Deleted"
  id: 80ce7df3-9b7d-420e-bedf-be186ccb0cd8
description: |
  An assumed-role session deletes the account IAM password policy outright,
  reverting to the built-in default and dropping every complexity, rotation
  and reuse requirement the administrators configured.

mitre:
  tactics: [defense-evasion, persistence]
  techniques: [T1556]

state:
  aws_region: us-east-1
  account_id: "111111111111"
  source_ip:  gen.ipv4()
  actor:      gen.aws_identity(type=AssumedRole, accountId=ref.account_id)

workloads:
  - scenario: scenarios/aws/iam/delete-password-policy
    bindings:
      aws_region: ref.aws_region
      account_id: ref.account_id
      source_ip:  ref.source_ip
      actor:      ref.actor
    expectation:
      summary: "DeleteAccountPasswordPolicy -- custom policy removed entirely"
      expected: alert
