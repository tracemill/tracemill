type: job
name: AWS CloudTrail IAM Group Creation/Deletion
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - IAM Group Creation/Deletion"
  id: fdcb972a-0cc3-47fa-a7e6-6cc0fa8551a4
description: |
  An actor creates an IAM group outside the normal provisioning path with a
  successful CreateGroup call from an SDK client.

mitre:
  tactics: [persistence]
  techniques: [T1098]

state:
  account_id: "111122223333"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  user_name:  attacker
  actor:      gen.aws_identity(type=IAMUser, userName=ref.user_name, accountId=ref.account_id)
  user_agent: "Boto3/1.34.51 Python/3.11.8 Linux/5.15.0-101-generic Botocore/1.34.51 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/iam/create-group
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      user_name:  ref.user_name
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "CreateGroup -- new IAM group created, succeeding"
      expected: alert
