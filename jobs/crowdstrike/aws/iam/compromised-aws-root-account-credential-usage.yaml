type: job
name: AWS CloudTrail Compromised AWS Root Account Credential Usage
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - Compromised AWS Root Account Credential Usage"
  id: 68855b05-0233-46df-b157-5ac2845573ff
description: |
  The account root identity mints programmatic credentials from a public
  address. The detection requires userIdentity.type Root, one of a long list
  of account, IAM and billing actions, a non-private source address, and a
  user agent outside its allow list -- which excludes browsers, aws-cli,
  aws-sdk prefixed agents, Terraform and AWS-internal callers. A Boto3 agent
  matches none of those exclusions, so it satisfies the rule while staying
  an ordinary SDK caller.

mitre:
  tactics: [initial-access, persistence, privilege-escalation, defense-evasion, credential-access]
  techniques: [T1078.004, T1133, T1528]

state:
  account_id: "000000000000"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor:      gen.aws_identity(type=Root, accountId=ref.account_id)
  user_agent: "Boto3/1.34.51 Python/3.11.8 Linux/5.15.0-101-generic Botocore/1.34.51 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/iam/create-access-key
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "CreateAccessKey -- root identity minting a key from a public address"
      expected: alert
