type: job
name: AWS CloudTrail IAM MFA Device Deactivated
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - IAM MFA Device Deactivated"
  id: bce55dd7-815d-480e-a126-30612ab3ffe9
description: |
  An IAM user's second factor is taken off the account. The rule keys on a
  successful DeactivateMFADevice or DeleteVirtualMFADevice from
  iam.amazonaws.com, with nothing else required.

mitre:
  tactics: [impact]
  techniques: [T1531]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  target_user: compromised-user
  actor:      gen.aws_identity(type=IAMUser, userName=ref.target_user, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/iam#1.44.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/iam/deactivate-mfa-device
    bindings:
      account_id:  ref.account_id
      aws_region:  ref.aws_region
      source_ip:   ref.source_ip
      target_user: ref.target_user
      actor:       ref.actor
      user_agent:  ref.user_agent
    expectation:
      summary: "DeactivateMFADevice -- the user's virtual MFA device is detached"
      expected: alert
