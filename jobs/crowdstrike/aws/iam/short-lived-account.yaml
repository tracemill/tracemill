type: job
name: AWS CloudTrail Short Lived Account
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - Short Lived Account"
  id: 37ca9bcc-42b4-45c4-ad47-f741f2653b63
description: |
  An IAM user is created with CreateUser and deleted again with DeleteUser
  a short while later, in the same account and under the same userName --
  the trace of a throwaway identity.

mitre:
  tactics: [persistence]
  techniques: [T1136.003]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/iam#1.44.0 tracemill/1.0"
  temp_user:  gen.username()

workloads:
  - scenario: scenarios/aws/iam/create-user
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
      user_name:  ref.temp_user
    expectation:
      summary: "CreateUser -- a temporary IAM user"
      expected: alert
  - scenario: scenarios/aws/iam/delete-user
    start_after: 10s
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
      user_name:  ref.temp_user
    expectation:
      summary: "DeleteUser -- the same user removed in the same account"
      expected: alert
