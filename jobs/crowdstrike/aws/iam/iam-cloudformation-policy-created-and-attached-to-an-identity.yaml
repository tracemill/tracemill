type: job
name: AWS CloudTrail IAM Cloudformation Policy Created and Attached to an Identity
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - IAM Cloudformation Policy Created and Attached to an Identity"
  id: 957e3768-fba1-40e1-99a3-272710edc674
description: |
  An actor creates a customer-managed policy and attaches it to a role: a
  successful CreatePolicy whose document allows iam:PassRole and
  cloudformation:* on every resource, then a successful AttachRolePolicy of
  that policy by its ARN -- a path to running CloudFormation as any role.

mitre:
  tactics: [privilege-escalation]
  techniques: [T1098.003]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/iam#1.44.0 tracemill/1.0"
  policy:     gen.username()
  role:       gen.username()

workloads:
  - scenario: scenarios/aws/iam/create-policy
    bindings:
      account_id:      ref.account_id
      aws_region:      ref.aws_region
      source_ip:       ref.source_ip
      actor:           ref.actor
      user_agent:      ref.user_agent
      policy_name:     ref.policy
      policy_document: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["iam:PassRole","cloudformation:*"],"Resource":"*"}]}'
    expectation:
      summary: "CreatePolicy -- iam:PassRole and cloudformation:* on Resource *"
      expected: alert
  - scenario: scenarios/aws/iam/attach-role-policy
    start_after: 10s
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
      role_name:  ref.role
      policy_arn: "arn:aws:iam::${ref.account_id}:policy/${ref.policy}"
    expectation:
      summary: "AttachRolePolicy -- the policy just created, by its ARN"
      expected: alert
