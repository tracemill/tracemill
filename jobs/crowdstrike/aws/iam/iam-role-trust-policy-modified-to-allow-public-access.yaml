type: job
name: AWS CloudTrail IAM Role Trust Policy Modified to Allow Public Access
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - IAM Role Trust Policy Modified to Allow Public Access"
  id: 1a966047-7c43-4f0a-a9a5-f6996a075b18
description: |
  An actor rewrites a role's trust policy so that any AWS principal may
  assume it. The rule fires on a successful UpdateAssumeRolePolicy whose
  policyDocument has no (or an empty) Condition and an Allow statement with
  Principal.AWS "*".

mitre:
  tactics: [defense-evasion]
  techniques: [T1484]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/iam#1.44.0 tracemill/1.0"
  role:       gen.username()

workloads:
  - scenario: scenarios/aws/iam/update-assume-role-policy
    bindings:
      account_id:      ref.account_id
      aws_region:      ref.aws_region
      source_ip:       ref.source_ip
      actor:           ref.actor
      user_agent:      ref.user_agent
      role_name:       ref.role
      policy_document: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":"*"},"Action":"sts:AssumeRole"}]}'
    expectation:
      summary: 'UpdateAssumeRolePolicy -- Allow to Principal AWS "*" with no Condition'
      expected: alert
