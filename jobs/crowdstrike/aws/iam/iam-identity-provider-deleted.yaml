type: job
name: AWS CloudTrail IAM Identity Provider Deleted
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - IAM Identity Provider Deleted"
  id: aee3a329-89db-4e7c-a37c-bf00c3f9ca85
description: |
  An actor removes an identity provider from the account. The rule fires on
  a successful DeleteOpenIDConnectProvider or DeleteSAMLProvider; the job
  uses the OpenID Connect form.

mitre:
  tactics: [defense-evasion]
  techniques: [T1484.002]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/iam#1.44.0 tracemill/1.0"
  idp_host:   gen.domain()

workloads:
  - scenario: scenarios/aws/iam/delete-open-id-connect-provider
    bindings:
      account_id:    ref.account_id
      aws_region:    ref.aws_region
      source_ip:     ref.source_ip
      actor:         ref.actor
      user_agent:    ref.user_agent
      provider_host: ref.idp_host
    expectation:
      summary: "DeleteOpenIDConnectProvider -- an OIDC issuer removed"
      expected: alert
