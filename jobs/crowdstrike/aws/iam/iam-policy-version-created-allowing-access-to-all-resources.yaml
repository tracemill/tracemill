type: job
name: AWS CloudTrail IAM Policy Version Created Allowing Access to All Resources
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - IAM Policy Version Created Allowing Access to All Resources"
  id: 052bfa98-a6ca-4b27-aaee-23b172a8e417
description: |
  A managed policy gains a new default version that allows everything
  everywhere: a successful CreatePolicyVersion from an ordinary SDK client
  whose policyDocument allows Action "*" on Resource "*".

mitre:
  tactics: [privilege-escalation]
  techniques: [T1078.004]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor:      gen.aws_identity(type=IAMUser, userName=attacker-user, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/iam#1.44.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/iam/policy-version-allow-all-actions
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "CreatePolicyVersion -- new default version allows Action * on Resource *"
      expected: alert
