type: job
name: AWS CloudTrail IAM User Created with Full Access and Credentials
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - IAM User Created with Full Access and Credentials"
  id: 51fa5289-feb2-49db-b813-380cdc8261b6
description: |
  An actor creates an IAM user, gives it AdministratorAccess and mints it
  an access key. The rule correlates CreateUser, AttachUserPolicy of
  arn:aws:iam::aws:policy/AdministratorAccess and CreateAccessKey or
  CreateLoginProfile on the same caller ARN and requested userName, with
  CreateUser first.

mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1136.003, T1098.001]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/iam#1.44.0 tracemill/1.0"
  new_user:   gen.username()
  new_key:    gen.aws_access_key(userName=ref.new_user, accountId=ref.account_id)

workloads:
  - scenario: scenarios/aws/iam/create-user
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
      user_name:  ref.new_user
    expectation:
      summary: "CreateUser -- the backdoor user"
      expected: alert
  - scenario: scenarios/aws/iam/attach-user-policy
    start_after: 10s
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
      user_name:  ref.new_user
      policy_arn: "arn:aws:iam::aws:policy/AdministratorAccess"
    expectation:
      summary: "AttachUserPolicy -- AdministratorAccess on the new user"
      expected: alert
  - scenario: scenarios/aws/iam/create-access-key
    start_after: 20s
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
      new_key:    ref.new_key
    expectation:
      summary: "CreateAccessKey -- a long-lived key for the new user"
      expected: alert
