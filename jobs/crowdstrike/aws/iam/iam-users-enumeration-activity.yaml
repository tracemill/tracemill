type: job
name: AWS CloudTrail IAM Users Enumeration Activity
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - IAM Users Enumeration Activity"
  id: 5f68f3b6-ca5a-4f31-b360-8f4025a7f556
description: |
  One identity repeatedly lists the account's IAM users. The rule groups
  successful ListUsers events by userIdentity ARN and type and fires from
  the second call onward.

mitre:
  tactics: [discovery]
  techniques: [T1087.004]

state:
  account_id: "111122223333"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  user_name:  attacker
  actor:      gen.aws_identity(type=IAMUser, userName=ref.user_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/iam#1.44.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/iam/discovery-access-denied-burst
    # Each pass of the discovery burst issues one ListUsers, so three passes
    # clear the threshold of two calls per identity.
    loop: 3
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      user_name:  ref.user_name
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "Three enumeration sweeps by one IAM user, each issuing a ListUsers call"
      expected: alert
