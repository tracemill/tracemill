type: job
name: AWS CloudTrail IAM Users Enumeration Activity
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - IAM Users Enumeration Activity"
  id: 5f68f3b6-ca5a-4f31-b360-8f4025a7f556
description: |
  One identity lists the account's IAM users repeatedly: several successful
  ListUsers calls by one caller in a short span.

mitre:
  tactics: [discovery]
  techniques: [T1087.004]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/iam#1.44.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/iam/list-users
    loop: 3
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "Three successful ListUsers calls by one caller"
      expected: alert
