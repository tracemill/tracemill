type: job
name: AWS CloudTrail IAM Admin User Deleted
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - IAM Admin User Deleted"
  id: 89021239-b273-43d6-935d-14b6dc982c12
description: |
  An actor strips an administrator of its policy and deletes the user. The
  rule self-joins successful DetachUserPolicy (policyArn matching
  Administrator) and DeleteUser calls on the same caller ARN and target
  userName.

mitre:
  tactics: [impact]
  techniques: [T1531]

state:
  account_id:  "111111111111"
  aws_region:  us-east-1
  source_ip:   gen.ipv4()
  actor_name:  gen.username()
  actor:       gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent:  "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/iam#1.44.0 tracemill/1.0"
  target_user: gen.username()

workloads:
  - scenario: scenarios/aws/iam/detach-user-policy
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
      user_name:  ref.target_user
      policy_arn: "arn:aws:iam::aws:policy/AdministratorAccess"
    expectation:
      summary: "DetachUserPolicy -- AdministratorAccess removed from the target user"
      expected: alert
  - scenario: scenarios/aws/iam/delete-user
    start_after: 10s
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
      user_name:  ref.target_user
    expectation:
      summary: "DeleteUser -- the same caller deletes the same user"
      expected: alert
