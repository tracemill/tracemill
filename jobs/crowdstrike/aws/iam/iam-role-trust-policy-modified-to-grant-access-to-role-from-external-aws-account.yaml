type: job
name: AWS CloudTrail IAM Role Trust Policy Modified to Grant Access to Role from External AWS Account
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - IAM Role Trust Policy Modified to Grant Access to Role from External AWS Account"
  id: 2990863b-052c-46e7-947d-381f13037727
description: |
  An actor rewrites a role's trust policy so that a principal in another
  AWS account may assume it. The rule extracts every account id from the
  ARNs in the new policyDocument of a successful UpdateAssumeRolePolicy and
  fires when one differs from the recipient account.

mitre:
  tactics: [privilege-escalation]
  techniques: [T1098]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/iam#1.44.0 tracemill/1.0"
  role:       gen.username()

workloads:
  - scenario: scenarios/aws/iam/update-assume-role-policy
    bindings:
      account_id:      ref.account_id
      aws_region:      ref.aws_region
      source_ip:       ref.source_ip
      actor:           ref.actor
      user_agent:      ref.user_agent
      role_name:       ref.role
      policy_document: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":"arn:aws:iam::999988887777:root"},"Action":"sts:AssumeRole"}]}'
    expectation:
      summary: "UpdateAssumeRolePolicy -- trust grants the root of account 999988887777"
      expected: alert
