type: job
name: AWS CloudTrail IAM User Login Profile Added for Root
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - IAM User Login Profile Added for Root"
  id: 586fa5ea-06bd-4390-92a2-947a1e0e6b32
description: |
  The account root creates a console password for itself through the API.
  The rule keys on a successful CreateLoginProfile whose caller is Root,
  whose identity carries an access key id (so the call came from the API or
  CLI rather than the console), and whose request names no target user.

mitre:
  tactics: [persistence]
  techniques: [T1098.001]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor:      gen.aws_identity(type=Root, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/iam#1.44.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/iam/create-login-profile
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "CreateLoginProfile -- the root identity adds a console password via the API"
      expected: alert
