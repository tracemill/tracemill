type: job
name: AWS CloudTrail IAM Access Key Deleted
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - IAM Access Key Deleted"
  id: e13f2dea-5f66-4378-97be-5ee8f2054e9b
description: |
  An actor deletes an IAM user's access key. The rule fires on any
  successful DeleteAccessKey call.

mitre:
  tactics: [impact]
  techniques: [T1531]

state:
  account_id:  "111111111111"
  aws_region:  us-east-1
  source_ip:   gen.ipv4()
  actor_name:  gen.username()
  actor:       gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent:  "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/iam#1.44.0 tracemill/1.0"
  target_user: gen.username()

workloads:
  - scenario: scenarios/aws/iam/delete-access-key
    bindings:
      account_id:    ref.account_id
      aws_region:    ref.aws_region
      source_ip:     ref.source_ip
      actor:         ref.actor
      user_agent:    ref.user_agent
      user_name:     ref.target_user
      access_key_id: gen.regex(pattern=AKIA[A-Z0-9]{16})
    expectation:
      summary: "DeleteAccessKey -- an IAM user's access key removed"
      expected: alert
