type: job
name: AWS CloudTrail AWS IAM S3Browser User or AccessKey Creation
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - AWS IAM S3Browser User or AccessKey Creation - Sigma"
  id: db014773-d9d9-4792-91e5-133337c0ffee
description: |
  Programmatic credentials are minted from the S3 Browser desktop client.
  The deciding predicate is the user agent: the detection accepts CreateUser
  or CreateAccessKey on iam.amazonaws.com only when the agent matches
  /S3 Browser/i.

mitre:
  tactics: [persistence]
  techniques: [T1078.004]

state:
  account_id: "000000000000"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor:      gen.aws_identity(type=IAMUser, userName=attacker-user, accountId=ref.account_id)
  # The rule keys on this string; anything else cannot satisfy it.
  user_agent: "S3 Browser 9.5.5 https://s3browser.com"

workloads:
  - scenario: scenarios/aws/iam/create-access-key
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "CreateAccessKey -- access key minted from an S3 Browser client"
      expected: alert
