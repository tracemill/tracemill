type: job
name: AWS CloudTrail EFS File System or Mount Deleted
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - EFS File System or Mount Deleted"
  id: 81e23b42-e88e-42bd-bdda-2eb73886dbe0
description: |
  An Amazon EFS file system or one of its mount targets is deleted. The
  rule keys on successful DeleteFileSystem and DeleteMountTarget calls:
  the first destroys the data, the second cuts clients off from it.

mitre:
  tactics: [impact]
  techniques: [T1485]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/efs#1.36.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/elasticfilesystem/delete-file-system
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "DeleteFileSystem -- an EFS file system deleted successfully"
      expected: alert
