type: job
name: AWS CloudTrail External KMS Key Material Imported
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - External KMS Key Material Imported"
  id: 215af647-7f3e-422b-9d40-bf596ba1e655
description: |
  Key material generated outside AWS is imported into a KMS key. The rule
  fires on any successful ImportKeyMaterial call, because whoever holds that
  material controls the key's data independently of AWS.

mitre:
  tactics: [impact]
  techniques: [T1486]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/kms#1.38.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/kms/import-key-material
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "ImportKeyMaterial -- key material imported into an EXTERNAL-origin key"
      expected: alert
