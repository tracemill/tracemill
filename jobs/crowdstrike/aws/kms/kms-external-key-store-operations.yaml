type: job
name: AWS CloudTrail KMS External Key Store Operations
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - KMS External Key Store Operations"
  id: 4569a7de-400d-4551-af25-24059b57bbb6
description: |
  An attempt to disconnect a KMS custom key store. The rule fires on any
  create, connect, update or disconnect of a custom key store, whatever the
  outcome, since each of these can cut off or redirect the keys held in it.

mitre:
  tactics: [impact]
  techniques: [T1486]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/kms#1.38.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/kms/disconnect-custom-key-store-not-found
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "DisconnectCustomKeyStore -- refused, no key store with that ID"
      expected: alert
