type: job
name: AWS CloudTrail KMS Customer Managed Key Disabled or Scheduled for Deletion
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - KMS Customer Managed Key Disabled or Scheduled for Deletion"
  id: 24ac93a7-0ae5-45f1-a345-165cb8c292df
description: |
  A customer managed KMS key is scheduled for deletion with a successful
  ScheduleKeyDeletion call. The key enters PendingDeletion at once, so
  cryptographic use stops immediately; the key material is destroyed when
  the waiting period ends.

mitre:
  tactics: [impact]
  techniques: [T1485]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/kms#1.38.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/kms/schedule-key-deletion
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      user_agent: ref.user_agent
    expectation:
      summary: "ScheduleKeyDeletion -- key scheduled for deletion after seven days"
      expected: alert
