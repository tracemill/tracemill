type: job
name: AWS CloudTrail KMS Key Locked Out Through Key Policy Update
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - KMS Key Locked Out Through Key Policy Update"
  id: 95508717-aea9-48d6-970d-cde3a28a37b3
description: |
  A KMS key policy is rewritten with the lockout safety check waived. The
  rule keys on a successful PutKeyPolicy carrying
  bypassPolicyLockoutSafetyCheck "true", then parses the submitted policy and
  fires unless its first statement still allows the caller or the account
  root.

mitre:
  tactics: [impact]
  techniques: [T1531]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor:      gen.aws_identity(type=IAMUser, userName=attacker-user, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/kms#1.38.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/kms/put-key-policy-wildcard-encrypt
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "PutKeyPolicy -- key policy replaced with the lockout safety check bypassed"
      expected: alert
