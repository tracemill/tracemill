type: job
name: AWS CloudTrail KMS Key Policy Updated
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - KMS Key Policy Updated"
  id: 0dd12862-642d-4f4b-99bd-c3c09910c330
description: |
  An actor rewrites a KMS key policy with PutKeyPolicy and then works the
  key from a public address: a burst of Decrypt, GenerateDataKey and
  Encrypt calls against that same key by the same user.

mitre:
  tactics: [persistence]
  techniques: [T1098.003]

state:
  account_id: "000000000000"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  user_name:  attacker-user
  actor:      gen.aws_identity(type=IAMUser, userName=ref.user_name, accountId=ref.account_id)
  user_agent: "Boto3/1.34.51 Python/3.11.8 Linux/5.15.0-101-generic Botocore/1.34.51 tracemill/1.0"
  # Generated so two runs of this job never touch the same key.
  key_id:     gen.uuid()
  key_arn:    "arn:aws:kms:${ref.aws_region}:${ref.account_id}:key/${ref.key_id}"

workloads:
  - scenario: scenarios/aws/kms/key-policy-rewrite-and-usage
    # Three distinct key operations per iteration; four iterations give
    # twelve.
    loop: 4
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      user_name:  ref.user_name
      actor:      ref.actor
      user_agent: ref.user_agent
      key_id:     ref.key_id
      key_arn:    ref.key_arn
    expectation:
      summary: "PutKeyPolicy then twelve Decrypt, GenerateDataKey and Encrypt calls on that key"
      expected: alert
