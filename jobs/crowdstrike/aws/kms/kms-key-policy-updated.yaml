type: job
name: AWS CloudTrail KMS Key Policy Updated
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - KMS Key Policy Updated"
  id: 0dd12862-642d-4f4b-99bd-c3c09910c330
description: |
  An actor rewrites a KMS key policy and then works the key. The detection
  tables every PutKeyPolicy by user name and the key id its response
  carries, then matches later key operations against that table on user name
  and key, where the key is read from the response, the first resource ARN,
  or the request. It fires above two distinct operations and ten events on
  one key from a public address.

  Both halves are one workload: the PutKeyPolicy that builds the table is
  never part of the resulting alert, so a separate leg for it could not be
  credited.

mitre:
  tactics: [persistence]
  techniques: [T1098.003]

state:
  account_id: "000000000000"
  aws_region: us-east-1
  # Public: the rule drops private source addresses before counting.
  source_ip:  45.33.32.13
  user_name:  attacker-user
  actor:      gen.aws_identity(type=IAMUser, userName=ref.user_name, accountId=ref.account_id)
  user_agent: "Boto3/1.34.51 Python/3.11.8 Linux/5.15.0-101-generic Botocore/1.34.51 tracemill/1.0"
  # Generated so two runs of this job never join on the same key.
  key_id:     gen.uuid()
  key_arn:    "arn:aws:kms:us-east-1:000000000000:key/${ref.key_id}"

workloads:
  - scenario: scenarios/aws/kms/key-policy-rewrite-and-usage
    # Three distinct key operations per iteration; four iterations give
    # twelve, clearing the >2 distinct and >=10 total bounds.
    loop: 4
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      user_name:  ref.user_name
      actor:      ref.actor
      user_agent: ref.user_agent
      key_id:     ref.key_id
      key_arn:    ref.key_arn
    expectation:
      summary: "PutKeyPolicy then twelve Decrypt, GenerateDataKey and Encrypt calls on that key"
      expected: alert
