type: job
name: AWS CloudTrail Multiple Secret Retrievals from AWS Secrets Manager
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - Multiple Secret Retrievals from AWS Secrets Manager"
  id: 239b374b-9fd1-4f4a-9f21-d68d11f81116
description: |
  One identity reads many different secrets in a short window. The rule
  buckets successful GetSecretValue and BatchGetSecretValue calls into
  ten-minute windows per caller ARN, principal id, identity type and account,
  counts the distinct secret ids, and fires above ten -- a sweep of the
  secret store rather than an application reading its own secret.

mitre:
  tactics: [credential-access]
  techniques: [T1555.006]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  # The rule drops sources whose ASN org is AMAZON-AES; a residential ISP
  # block keeps the caller outside every Amazon range.
  source_ip:  gen.ipv4(cidr=73.0.0.0/8)
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/secretsmanager#1.35.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/secretsmanager/get-secret-value
    # Twenty-four reads against the threshold of more than ten distinct secrets
    # keeps one ten-minute bucket over it even when the burst straddles a bucket
    # edge; secret_id is left unbound so every pass reads a different secret.
    loop: 24
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor_name: ref.actor_name
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "Twenty-four GetSecretValue calls by one IAM user, each for a different secret"
      expected: alert
