type: job
name: AWS CloudTrail Potential SES Enumeration
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - Potential SES Enumeration"
  id: 01fa16a5-65a2-4d9a-822d-627aee80ae34
description: |
  A caller inspects the SES account before abusing it: which identities it
  can send as, and its sending quota and sandbox status. The rule keys on
  successful GetAccount and ListIdentities calls and groups them per account
  and user.

mitre:
  tactics: [discovery]
  techniques: [T1526]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/ses#1.29.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/ses/list-identities
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor_name: ref.actor_name
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "ListIdentities -- an IAM user lists the SES domain identities"
      expected: alert
