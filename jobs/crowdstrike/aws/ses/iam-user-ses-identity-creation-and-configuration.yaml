type: job
name: AWS CloudTrail IAM User SES Identity Creation and Configuration
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - IAM User SES Identity Creation and Configuration"
  id: 108581b7-529d-4eaf-b12f-a845ec872c59
description: |
  An IAM user registers a new sending identity in SES with a successful
  CreateEmailIdentity call. Stolen IAM user keys are commonly used to stand
  up SES for spam and phishing.

mitre:
  tactics: [resource-development]
  techniques: [T1585.002]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/sesv2#1.41.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/ses/create-email-identity
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor_name: ref.actor_name
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "CreateEmailIdentity -- an IAM user registers a domain as an SES sending identity"
      expected: alert
