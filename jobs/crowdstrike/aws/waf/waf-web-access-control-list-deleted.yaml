type: job
name: AWS CloudTrail WAF Web Access Control List Deleted
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - WAF Web Access Control List Deleted"
  id: 315df85b-0060-47b3-9a2b-5af61ee87557
description: |
  A WAF web ACL is deleted with a successful DeleteWebACL call, removing the
  whole rule set in front of the protected resource.

mitre:
  tactics: [defense-evasion]
  techniques: [T1562.001]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor:      gen.aws_identity(type=IAMUser, userName=attacker-cli, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/waf#1.25.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/waf/delete-webacl
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "DeleteWebACL -- the web ACL protecting the resource is deleted"
      expected: alert
