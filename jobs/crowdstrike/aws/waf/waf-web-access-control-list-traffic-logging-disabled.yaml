type: job
name: AWS CloudTrail WAF Web Access Control List Traffic Logging Disabled
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - WAF Web Access Control List Traffic Logging Disabled"
  id: 17e33320-8a56-4e9f-be2b-bd57e9b9e48c
description: |
  A web ACL's logging configuration is deleted with a successful
  DeleteLoggingConfiguration call, so the requests it inspects stop being
  recorded while the ACL keeps running.

mitre:
  tactics: [defense-evasion]
  techniques: [T1562.008]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor:      gen.aws_identity(type=IAMUser, userName=attacker-cli, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/wafv2#1.57.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/waf/delete-logging-configuration
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "DeleteLoggingConfiguration -- the web ACL stops writing traffic logs"
      expected: alert
