type: job
name: AWS CloudTrail CloudWatch Alarm Deleted
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - CloudWatch Alarm Deleted"
  id: 46194bd2-30c1-41cb-bbe2-622f14e7f60a
description: |
  A CloudWatch alarm is deleted with a successful DeleteAlarms call from an
  IAM user's SDK client rather than an AWS service acting on its own.

mitre:
  tactics: [defense-evasion]
  techniques: [T1562.008]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/cloudwatch#1.45.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/monitoring/delete-alarms
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "DeleteAlarms -- one alarm deleted by an IAM user's SDK client"
      expected: alert
