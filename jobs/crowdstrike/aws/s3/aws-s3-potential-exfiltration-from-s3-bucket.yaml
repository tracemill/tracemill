type: job
name: AWS S3 Potential Exfiltration from S3 Bucket
detection:
  source: ngsiem_template
  name: "AWS - S3 - Potential Exfiltration from S3 Bucket"
  id: 813d0539-49c0-4539-8e02-9c24c2b891fd
description: |
  One principal pulls more than ten gigabytes out of S3 from a public
  address. The detection sums bytesTransferredOut across GetObject data
  events per user name and fires above ten gigabytes, so the volume moved,
  not the number of reads, is the deciding predicate.

mitre:
  tactics: [collection, exfiltration]
  techniques: [T1530, T1567]

state:
  account_id: "111111111111"
  aws_region: us-west-2
  source_ip:  gen.ipv4()
  # Generated: the rule groups on user name and three constants, so a fixed
  # name would pool two runs of this job into one sum.
  user_name:  gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.user_name, accountId=ref.account_id)
  user_agent: "Boto3/1.34.51 Python/3.11.8 Linux/5.15.0-101-generic Botocore/1.34.51 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/s3/get-object
    # Six reads of roughly two gigabytes each sum past the ten-gigabyte bound
    # with margin, in a handful of events rather than thousands.
    loop: 6
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      user_name:  ref.user_name
      actor:      ref.actor
      user_agent: ref.user_agent
      bytes_out:  gen.int(min=2000000000, max=2400000000)
    expectation:
      summary: "Six GetObject reads summing past ten gigabytes from one identity"
      expected: alert
