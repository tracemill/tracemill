type: job
name: AWS CloudTrail Potential S3 Bucket Enumeration
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - Potential S3 Bucket Enumeration"
  id: a2d2932f-1416-4559-bf70-49eba474041f
description: |
  An identity that is not an assumed role or an AWS service works through
  the account's buckets. The detection counts ListBuckets and GetBucket*
  calls per account, source address and identity in five-minute spans and
  fires above ten, with no outcome gate; it excludes only console and
  browser agents, which its regex anchors on a leading bracket.

mitre:
  tactics: [discovery]
  techniques: [T1619]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  user_name:  gen.username()
  # IAMUser, because the rule excludes AssumedRole and AWSService identities.
  actor:      gen.aws_identity(type=IAMUser, userName=ref.user_name, accountId=ref.account_id)
  user_agent: "Boto3/1.34.51 Python/3.11.8 Linux/5.15.0-101-generic Botocore/1.34.51 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/s3/bucket-enumeration-burst
    # Four qualifying calls per iteration; three iterations give twelve,
    # clearing the >10 bound inside one five-minute span.
    loop: 3
    bindings:
      account_id:  ref.account_id
      aws_region:  ref.aws_region
      source_ip:   ref.source_ip
      user_name:   ref.user_name
      actor:       ref.actor
      user_agent:  ref.user_agent
      bucket_name: gen.regex(pattern=corp-archive-[a-z0-9]{10})
    expectation:
      summary: "Twelve ListBuckets and GetBucket* calls from one IAM user in one span"
      expected: alert
