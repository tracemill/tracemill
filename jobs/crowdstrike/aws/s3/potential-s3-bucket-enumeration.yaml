type: job
name: AWS CloudTrail Potential S3 Bucket Enumeration
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - Potential S3 Bucket Enumeration"
  id: a2d2932f-1416-4559-bf70-49eba474041f
description: |
  An IAM user works through the account's buckets from an SDK client: a
  burst of ListBuckets and GetBucket* calls from one source address in a
  few minutes, surveying what the account stores and how each bucket is
  configured.

mitre:
  tactics: [discovery]
  techniques: [T1619]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  user_name:  gen.username()
  # IAMUser: a long-lived identity driven by hand, not a role session or an
  # AWS service.
  actor:      gen.aws_identity(type=IAMUser, userName=ref.user_name, accountId=ref.account_id)
  user_agent: "Boto3/1.34.51 Python/3.11.8 Linux/5.15.0-101-generic Botocore/1.34.51 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/s3/bucket-enumeration-burst
    # Four calls per iteration; three iterations give twelve inside one short
    # span.
    loop: 3
    bindings:
      account_id:  ref.account_id
      aws_region:  ref.aws_region
      source_ip:   ref.source_ip
      user_name:   ref.user_name
      actor:       ref.actor
      user_agent:  ref.user_agent
      bucket_name: gen.regex(pattern=corp-archive-[a-z0-9]{10})
    expectation:
      summary: "Twelve ListBuckets and GetBucket* calls from one IAM user in one span"
      expected: alert
