type: job
name: AWS CloudTrail S3 Bucket Replication to External Account Attempted
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - S3 Bucket Replication to External Account Attempted"
  id: f01f81a5-4f41-48f9-bc64-4374b982559c
description: |
  A replication rule is put on a bucket so its objects are copied out
  continuously. The rule keys on PutBucketReplication whose
  ReplicationConfiguration.Rule.Destination names an Account, the marker of
  a destination owned outside this account.

mitre:
  tactics: [exfiltration]
  techniques: [T1537]

state:
  account_id: "111111111111"
  aws_region: us-west-2
  source_ip:  gen.ipv4()
  actor:      gen.aws_identity(type=AssumedRole, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/s3#1.79.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/s3/put-bucket-replication
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "PutBucketReplication -- a replication rule is added for a second bucket"
      expected: alert
