type: job
name: AWS CloudTrail Potential Brute Force on S3 Bucket
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - Potential Brute Force on S3 Bucket"
  id: de2e6e70-f84d-4c2c-998d-14f965713007
description: |
  A caller from outside the bucket owner's account walks object keys, most
  of which do not resolve. The rule keeps S3 GetObject and CopyObject events
  whose caller account differs from the recipient account, then fires when
  one caller shows more than one success alongside more than twenty
  NoSuchKey, AccessDenied or NoSuchVersion failures.

mitre:
  tactics: [collection]
  techniques: [T1530]

state:
  account_id:          "111111111111"
  external_account_id: "999988887777"
  aws_region: us-west-2
  source_ip:  gen.ipv4()
  user_name:  gen.username()
  # The caller is registered in a different account from the bucket owner --
  # the cross-account test the rule applies before counting.
  actor:      gen.aws_identity(type=IAMUser, userName=ref.user_name, accountId=ref.external_account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/s3#1.79.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/s3/get-object
    loop: 25
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      user_name:  ref.user_name
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "Twenty-five object reads against one bucket by a caller from another account"
      expected: alert
