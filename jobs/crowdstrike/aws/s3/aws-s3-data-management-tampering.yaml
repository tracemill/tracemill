type: job
name: AWS CloudTrail AWS S3 Data Management Tampering - Sigma
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - AWS S3 Data Management Tampering - Sigma"
  id: 78b3756a-7804-4ef7-8555-7b9024a02e2d
description: |
  Server access logging is switched off on an S3 bucket. The rule fires on
  a fixed list of bucket configuration actions, PutBucketLogging among
  them, whatever their outcome.

mitre:
  tactics: [exfiltration]
  techniques: [T1537]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "[aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/s3#1.79.0 tracemill/1.0]"

workloads:
  - scenario: scenarios/aws/s3/disable-bucket-logging
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "PutBucketLogging -- empty logging status turns access logging off"
      expected: alert
