type: job
name: AWS CloudTrail S3 Bucket Versioning Enumeration from External IP Address
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - S3 Bucket Versioning Enumeration from External IP Address"
  id: 7e0a764a-8e73-44b3-a715-a659b69e3fac
description: |
  A principal that has listed the account's buckets then checks the
  versioning state of more than fifty of them from a public address. The
  detection tables the ARNs that called ListBuckets, matches the
  GetBucketVersioning calls against it, and counts distinct bucket names per
  ARN; the count, not the call, is the deciding predicate.

mitre:
  tactics: [discovery]
  techniques: [T1619]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  # Public: the rule drops private source addresses before counting.
  source_ip:  45.33.32.14
  user_name:  gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.user_name, accountId=ref.account_id)
  user_agent: "Boto3/1.34.51 Python/3.11.8 Linux/5.15.0-101-generic Botocore/1.34.51 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/s3/bucket-enumeration-burst
    # One GetBucketVersioning on a fresh bucket per iteration; fifty-one
    # iterations clear the >50 distinct-bucket bound, and each also emits the
    # ListBuckets the lookup table is built from.
    loop: 51
    bindings:
      account_id:  ref.account_id
      aws_region:  ref.aws_region
      source_ip:   ref.source_ip
      user_name:   ref.user_name
      actor:       ref.actor
      user_agent:  ref.user_agent
      bucket_name: gen.regex(pattern=corp-archive-[a-z0-9]{10})
    expectation:
      summary: "GetBucketVersioning across fifty-one distinct buckets by a bucket-listing ARN"
      expected: alert
