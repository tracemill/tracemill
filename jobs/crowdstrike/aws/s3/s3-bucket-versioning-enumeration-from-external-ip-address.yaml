type: job
name: AWS CloudTrail S3 Bucket Versioning Enumeration from External IP Address
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - S3 Bucket Versioning Enumeration from External IP Address"
  id: 7e0a764a-8e73-44b3-a715-a659b69e3fac
description: |
  A principal lists the account's buckets with ListBuckets and then checks
  the versioning state of more than fifty of them with GetBucketVersioning,
  all from one public address -- a survey of which buckets keep recoverable
  history.

mitre:
  tactics: [discovery]
  techniques: [T1619]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  user_name:  gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.user_name, accountId=ref.account_id)
  user_agent: "Boto3/1.34.51 Python/3.11.8 Linux/5.15.0-101-generic Botocore/1.34.51 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/s3/bucket-enumeration-burst
    # One ListBuckets and one GetBucketVersioning on a fresh bucket per
    # iteration, so fifty-one iterations cover fifty-one distinct buckets.
    loop: 51
    bindings:
      account_id:  ref.account_id
      aws_region:  ref.aws_region
      source_ip:   ref.source_ip
      user_name:   ref.user_name
      actor:       ref.actor
      user_agent:  ref.user_agent
      bucket_name: gen.regex(pattern=corp-archive-[a-z0-9]{10})
    expectation:
      summary: "GetBucketVersioning across fifty-one distinct buckets by a bucket-listing ARN"
      expected: alert
