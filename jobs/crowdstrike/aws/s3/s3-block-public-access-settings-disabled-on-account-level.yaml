type: job
name: AWS CloudTrail S3 Block Public Access Settings Disabled on Account Level
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - S3 Block Public Access Settings Disabled on Account Level"
  id: 526b001c-4c6b-4aee-976a-4cef40ea9dfb
description: |
  The account-wide S3 Block Public Access guard is turned off: a successful
  PutAccountPublicAccessBlock sets all four flags to false, so bucket-level
  policies and ACLs can once again make data public.

mitre:
  tactics: [defense-evasion]
  techniques: [T1562]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "[aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/s3control#1.66.0 tracemill/1.0]"

workloads:
  - scenario: scenarios/aws/s3/disable-account-public-access-block
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "PutAccountPublicAccessBlock -- all four account-level flags set false"
      expected: alert
