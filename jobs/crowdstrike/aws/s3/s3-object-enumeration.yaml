type: job
name: AWS CloudTrail S3 Object Enumeration
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - S3 Object Enumeration"
  id: 40a65c08-8fdb-4593-a447-e31e6fc7ba3e
description: |
  One identity reads objects from S3 at a rate that suggests it is walking
  a bucket. The rule counts successful List, Get and Head object calls per
  caller ARN and fires at one hundred.

mitre:
  tactics: [discovery, collection]
  techniques: [T1619, T1530, T1213, T1526]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "[aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/s3#1.79.0 tracemill/1.0]"

workloads:
  - scenario: scenarios/aws/s3/get-object
    loop: 110
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
      user_name:  ref.actor_name
    expectation:
      summary: "One hundred and ten object reads by one IAM user"
      expected: alert
