type: job
name: AWS CloudTrail Log Trail Impairment via S3 Lifecycle Rule
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - Log Trail Impairment via S3 Lifecycle Rule"
  id: 305c7485-5483-405a-8054-7f92f281fa25
description: |
  A lifecycle rule is put on the CloudTrail log bucket so the records expire
  before anyone reads them: a successful PutBucketLifecycle on a bucket
  named for cloudtrail sets object expiration to one day.

mitre:
  tactics: [defense-evasion]
  techniques: [T1562.008]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor:      gen.aws_identity(type=IAMUser, userName=gen.username(), accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/s3#1.79.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/s3/put-bucket-lifecycle
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "PutBucketLifecycle -- the cloudtrail log bucket expires objects after one day"
      expected: alert
