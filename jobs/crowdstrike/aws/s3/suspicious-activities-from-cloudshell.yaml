type: job
name: AWS CloudTrail Suspicious Activities from CloudShell
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - Suspicious Activities from CloudShell"
  id: b1f61186-35c5-42b4-91a5-8d26e0b512fb
description: |
  An operator drives write operations from an AWS CloudShell session: a run
  of StartInstances calls whose user agent carries the CloudShell exec-env
  marker, by one IAM user from one source address.

mitre:
  tactics: [execution]
  techniques: [T1059.009, T1651]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  user_name:  gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.user_name, accountId=ref.account_id)
  # A CloudShell session's SDK agent: the boto3 form carries the exec-env
  # marker without the aws-cli prefix.
  user_agent: "Boto3/1.34.51 md/Botocore#1.34.51 ua/2.0 os/linux#5.10 lang/python#3.11.8 exec-env/CloudShell Botocore/1.34.51 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/ec2/start-instances
    loop: 6
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      user_name:  ref.user_name
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "Six StartInstances calls from a CloudShell session"
      expected: alert
