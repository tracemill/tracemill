type: job
name: AWS CloudTrail Suspicious Secret Scanning Tool Detected (Trufflehog)
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - Suspicious Secret Scanning Tool Detected (Trufflehog)"
  id: 95ae4721-df5c-4b70-bdfb-aff3feb4243e
description: |
  TruffleHog verifies every AWS access key it finds by calling STS
  GetCallerIdentity with it, and it identifies itself in the User-Agent of
  that call: a successful GetCallerIdentity carrying the TruffleHog user
  agent is a found key being checked for validity.

mitre:
  tactics: [discovery, credential-access]
  techniques: [T1087.004, T1552.001]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "TruffleHog"

workloads:
  - scenario: scenarios/aws/sts/get-caller-identity
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor_name: ref.actor_name
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "GetCallerIdentity with the TruffleHog user agent -- a found access key being verified"
      expected: alert
