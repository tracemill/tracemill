type: job
name: AWS CloudTrail Temporary User Credentials Created
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - Temporary User Credentials Created"
  id: a96f0b8a-98dd-458c-986b-3f4670cb1ff2
description: |
  An IAM user mints temporary credentials for a federated user with a
  successful GetFederationToken call. The federated session outlives a
  revoked parent key and can reach the Management Console.

mitre:
  tactics: [defense-evasion, persistence]
  techniques: [T1550.001, T1098.001]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  user_name:  gen.username()
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/sts#1.34.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/sts/federation-token-console-access
    bindings:
      account_id:     ref.account_id
      aws_region:     ref.aws_region
      source_ip:      ref.source_ip
      user_name:      ref.user_name
      sts_user_agent: ref.user_agent
    expectation:
      summary: "GetFederationToken -- an IAM user mints federated temporary credentials"
      expected: alert
