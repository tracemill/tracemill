type: job
name: AWS CloudTrail Lambda Layer Version Policy Modified to Allow Public Access
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - Lambda Layer Version Policy Modified to Allow Public Access"
  id: ef9f9d7d-d309-4c17-b469-c9052b9f20f7
description: |
  A Lambda layer version is shared with every principal. The rule keys on
  successful AddLayerVersionPermission calls whose principal is exactly
  "*", which lets other accounts pull the layer's code or attach it to
  their own functions.

mitre:
  tactics: [persistence]
  techniques: [T1098]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/lambda#1.72.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/lambda/add-layer-version-permission-public
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "AddLayerVersionPermission -- layer version shared with principal *"
      expected: alert
