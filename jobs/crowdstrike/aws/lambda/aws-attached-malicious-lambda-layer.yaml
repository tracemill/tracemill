type: job
name: AWS CloudTrail AWS Attached Malicious Lambda Layer - Sigma
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - AWS Attached Malicious Lambda Layer - Sigma"
  id: 97fbabf8-8e1b-47a2-b7d5-a418d2b95e3d
description: |
  A Lambda function's configuration is updated. The rule keys on any
  lambda.amazonaws.com UpdateFunctionConfiguration call, whatever its API
  version suffix, because that is the call that attaches a layer, and layer
  code runs inside the function on every invocation.

mitre:
  tactics: [persistence, execution]
  techniques: [T1525, T1648]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/lambda#1.72.0 tracemill/1.0"
  layer_account_id: "222222222222"

workloads:
  - scenario: scenarios/aws/lambda/update-function-configuration-layer
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
      layer_account_id: ref.layer_account_id
    expectation:
      summary: "UpdateFunctionConfiguration -- a layer from another account attached to a Lambda function"
      expected: alert
