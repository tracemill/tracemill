type: job
name: AWS CloudTrail CloudWatch Log Group Deleted
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - CloudWatch Log Group Deleted"
  id: 2d2cf44c-d6b3-42d3-9ffc-30ca84bbfe43
description: |
  A CloudWatch log group is deleted, taking every stream it holds with it.
  The rule keys on a successful logs.amazonaws.com DeleteLogGroup call.

mitre:
  tactics: [defense-evasion]
  techniques: [T1562.001]

state:
  account_id: "111111111111"
  aws_region: us-west-2
  source_ip:  gen.ipv4()
  actor:      gen.aws_identity(type=IAMUser, userName=attacker-cli, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/cloudwatchlogs#1.45.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/logs/delete-log-group
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "DeleteLogGroup -- a CloudWatch log group is destroyed"
      expected: alert
