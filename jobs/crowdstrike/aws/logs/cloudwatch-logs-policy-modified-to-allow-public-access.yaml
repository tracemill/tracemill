type: job
name: AWS CloudTrail CloudWatch Logs Policy Modified to Allow Public Access
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - CloudWatch Logs Policy Modified to Allow Public Access"
  id: 4239b2bd-300c-4b9d-9077-684da161e3fa
description: |
  A CloudWatch Logs resource policy gains a wildcard-principal statement: a
  successful PutResourcePolicy call installs an Allow statement whose AWS
  principal is "*".

mitre:
  tactics: [defense-evasion]
  techniques: [T1562.008]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/cloudwatchlogs#1.47.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/logs/put-resource-policy-any-principal
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "PutResourcePolicy -- Allow statement with a wildcard AWS principal"
      expected: alert
