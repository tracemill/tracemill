type: job
name: AWS CloudTrail Potential Session Hijacking
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - Potential Session Hijacking"
  id: 2f20781e-e0dd-4e49-8135-0969e780ed77
description: |
  One console identity polls the Health dashboard from more than one
  network at once: concurrent DescribeEventAggregates calls under the same
  IAM user arrive from addresses belonging to different network operators,
  as they would if a stolen session were replayed elsewhere.

mitre:
  tactics: [lateral-movement]
  techniques: [T1550.004]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  # One identity across the sessions.
  actor:      gen.aws_identity(type=IAMUser, userName=gen.username(), accountId=ref.account_id)
  user_agent: "AWS Internal"

workloads:
  - scenario: scenarios/aws/health/concurrent-sessions-from-different-ips
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "Three concurrent Health console sessions for one identity from three addresses"
      expected: alert
