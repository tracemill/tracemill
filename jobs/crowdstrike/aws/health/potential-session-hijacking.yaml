type: job
name: AWS CloudTrail Potential Session Hijacking
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - Potential Session Hijacking"
  id: 2f20781e-e0dd-4e49-8135-0969e780ed77
description: |
  One console identity polls the Health dashboard from more than one
  network at once. The rule groups successful health.amazonaws.com
  DescribeEventAggregates events by account, region, userIdentity ARN and
  type, and fires when the source addresses resolve to more than one
  network operator.

mitre:
  tactics: [lateral-movement]
  techniques: [T1550.004]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  # One identity across the sessions: the rule groups per ARN.
  actor:      gen.aws_identity(type=IAMUser, userName=gen.username(), accountId=ref.account_id)
  user_agent: "AWS Internal"

workloads:
  - scenario: scenarios/aws/health/concurrent-sessions-from-different-ips
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "Three concurrent Health console sessions for one identity from three addresses"
      expected: alert
