type: job
name: AWS CloudTrail AWS Config Disabling Channel/Recorder - Sigma
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - AWS Config Disabling Channel/Recorder - Sigma"
  id: 07330162-dba1-4746-8121-a9647d49d297
description: |
  AWS Config recording is interrupted. The rule keys on any
  config.amazonaws.com DeleteDeliveryChannel or StopConfigurationRecorder
  call, whatever its outcome.

mitre:
  tactics: [defense-evasion]
  techniques: [T1562.001]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/configservice#1.52.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/config/stop-configuration-recorder
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "StopConfigurationRecorder -- the account's configuration recorder stopped"
      expected: alert
