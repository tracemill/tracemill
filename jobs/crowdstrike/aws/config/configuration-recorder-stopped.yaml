type: job
name: AWS CloudTrail Configuration Recorder Stopped
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - Configuration Recorder Stopped"
  id: a3e2eeed-efd0-4f65-bc1a-5f6643c30bd0
description: |
  AWS Config recording is stopped with a successful StopConfigurationRecorder
  call, so no resource change is recorded until the recorder is restarted.

mitre:
  tactics: [defense-evasion]
  techniques: [T1562.001]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/configservice#1.52.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/config/stop-configuration-recorder
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "StopConfigurationRecorder -- successful stop of the default recorder"
      expected: alert
