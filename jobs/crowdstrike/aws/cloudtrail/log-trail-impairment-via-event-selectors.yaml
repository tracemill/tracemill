type: job
name: AWS CloudTrail Log Trail Impairment via Event Selectors
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - Log Trail Impairment via Event Selectors"
  id: 20494a95-25c2-4400-a6bd-b4dab91a0d1b
description: |
  A trail's event selectors are changed to stop recording management
  events. The rule fires on a successful PutEventSelectors call where a
  basic selector sets includeManagementEvents to false, or where advanced
  selectors leave out the Management category.

mitre:
  tactics: [defense-evasion]
  techniques: [T1562.001]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/cloudtrail#1.46.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/cloudtrail/put-event-selectors-exclude-management
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "PutEventSelectors -- basic selector with includeManagementEvents false"
      expected: alert
