type: job
name: AWS CloudTrail Log Trail Suspended
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - Log Trail Suspended"
  id: 00d1cf1c-7e1c-4d9f-956c-cd1783d12375
description: |
  Actor calls StopLogging to suspend recording of API activity and log-file
  delivery for a CloudTrail trail, blinding downstream detection.

mitre:
  tactics: [defense-evasion]
  techniques: [T1562.008]

state:
  account_id: "111111111111"
  aws_region: us-west-2
  source_ip:  gen.ipv4()
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/cloudtrail#1.46.0 tracemill/1.0"
  actor:      gen.aws_identity(type=IAMUser, accountId=ref.account_id)
  trail_name: production-trail

workloads:
  - scenario: scenarios/aws/cloudtrail/stop-logging
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      user_agent: ref.user_agent
      actor:      ref.actor
      trail_name: ref.trail_name
    expectation:
      summary: "StopLogging -- CloudTrail trail recording suspended"
      expected: alert
