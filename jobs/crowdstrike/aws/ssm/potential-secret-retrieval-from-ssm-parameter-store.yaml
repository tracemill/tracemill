type: job
name: AWS CloudTrail Potential Secret Retrieval from SSM Parameter Store
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - Potential Secret Retrieval from SSM Parameter Store"
  id: a19de921-d545-4b21-b5ee-4427d6836f10
description: |
  An actor enumerates the Parameter Store and then reads a secret by name.
  The detection admits DescribeParameters unconditionally and GetParameter
  only when the requested name matches its credential-word regex, then
  requires more than one distinct action per identity type, user name and
  source address -- so neither call fires it alone.

mitre:
  tactics: [credential-access, collection]
  techniques: [T1555.006, T1552, T1119]

state:
  account_id: "111122223333"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  user_name:  scanner
  actor:      gen.aws_identity(type=IAMUser, userName=ref.user_name, accountId=ref.account_id)
  user_agent: "Boto3/1.34.51 Python/3.11.8 Linux/5.15.0-101-generic Botocore/1.34.51 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/ssm/parameter-store-secret-access
    bindings:
      account_id:     ref.account_id
      aws_region:     ref.aws_region
      source_ip:      ref.source_ip
      user_name:      ref.user_name
      actor:          ref.actor
      user_agent:     ref.user_agent
      parameter_name: "/prod/database/master-password"
    expectation:
      summary: "DescribeParameters then GetParameter -- two distinct actions on a password-named parameter"
      expected: alert
