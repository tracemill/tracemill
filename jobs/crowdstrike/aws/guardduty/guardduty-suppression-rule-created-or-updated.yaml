type: job
name: AWS CloudTrail GuardDuty Suppression Rule Created or Updated
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - GuardDuty Suppression Rule Created or Updated"
  id: 0e551e50-0066-4355-a36f-25a259861f65
description: |
  A GuardDuty suppression rule is created. The rule fires on a successful
  CreateFilter or UpdateFilter call whose action is ARCHIVE, because matching
  findings are archived before anyone sees them.

mitre:
  tactics: [defense-evasion]
  techniques: [T1562.001]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/guardduty#1.54.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/guardduty/create-filter-archive
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "CreateFilter -- filter with action ARCHIVE on a finding type"
      expected: alert
