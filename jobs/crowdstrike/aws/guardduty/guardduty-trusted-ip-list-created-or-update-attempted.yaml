type: job
name: AWS CloudTrail GuardDuty Trusted IP List Created or Update Attempted
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - GuardDuty Trusted IP List Created or Update Attempted"
  id: f8a0513d-6f5b-4d90-ab04-5b2c02182fb5
description: |
  A GuardDuty trusted IP list is created. The rule fires on any successful
  CreateIPSet or UpdateIPSet call, since either one decides which addresses
  GuardDuty stops reporting on.

mitre:
  tactics: [defense-evasion]
  techniques: [T1562.001]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/guardduty#1.54.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/guardduty/create-ip-set
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "CreateIPSet -- successful trusted IP list creation"
      expected: alert
