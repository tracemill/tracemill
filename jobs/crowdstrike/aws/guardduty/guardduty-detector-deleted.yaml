type: job
name: AWS CloudTrail GuardDuty Detector Deleted
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - GuardDuty Detector Deleted"
  id: c45dbff4-b6db-49e6-981e-b1211b3e75a7
description: |
  Actor deletes a GuardDuty detector, disabling threat detection for the
  region.

mitre:
  tactics: [defense-evasion]
  techniques: [T1562.001]

state:
  account_id:  "111111111111"
  aws_region:  us-east-1
  source_ip:   gen.ipv4()
  actor:       gen.aws_identity(type=IAMUser, userName=attacker-cli, accountId=ref.account_id)
  tls_version: "TLSv1.3"
  tls_cipher:  TLS_AES_128_GCM_SHA256

workloads:
  - scenario: scenarios/aws/guardduty/delete-detector
    bindings:
      account_id:  ref.account_id
      aws_region:  ref.aws_region
      source_ip:   ref.source_ip
      actor:       ref.actor
      tls_version: ref.tls_version
      tls_cipher:  ref.tls_cipher
    expectation:
      summary: "DeleteDetector -- GuardDuty detector removed for the region"
      expected: alert
