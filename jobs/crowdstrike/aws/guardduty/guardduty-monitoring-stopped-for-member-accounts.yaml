type: job
name: AWS CloudTrail GuardDuty Monitoring Stopped for Member Accounts
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - GuardDuty Monitoring Stopped for Member Accounts"
  id: c620feae-567e-482c-a7d6-3a764c3326fc
description: |
  A GuardDuty administrator stops monitoring a member account. The rule
  fires on any successful StopMonitoringMembers call, since findings from
  that account stop reaching the administrator.

mitre:
  tactics: [defense-evasion]
  techniques: [T1562.001]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/guardduty#1.54.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/guardduty/stop-monitoring-members
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "StopMonitoringMembers -- member account named in a successful call"
      expected: alert
