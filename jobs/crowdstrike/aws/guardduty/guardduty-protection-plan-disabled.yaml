type: job
name: AWS CloudTrail GuardDuty Protection Plan Disabled
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - GuardDuty Protection Plan Disabled"
  id: c2f782cf-a64a-4a06-8ee0-49d496be8aa9
description: |
  A GuardDuty protection plan is turned off: a successful UpdateDetector
  call sets the S3 data event protection feature to DISABLED.

mitre:
  tactics: [defense-evasion]
  techniques: [T1562.001]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/guardduty#1.54.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/guardduty/update-detector-disable-feature
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "UpdateDetector -- S3 data event protection set to DISABLED"
      expected: alert
