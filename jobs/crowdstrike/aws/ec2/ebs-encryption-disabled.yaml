type: job
name: AWS CloudTrail EBS Encryption Disabled
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - EBS Encryption Disabled"
  id: 1aa552b3-5b6c-410c-a15c-2e3b067576a6
description: |
  An actor turns off EBS encryption by default for a region. The rule
  fires on a successful DisableEbsEncryptionByDefault call whose user agent
  is not Terraform or Packer.

mitre:
  tactics: [impact]
  techniques: [T1565.001]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/ec2#1.231.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/ec2/disable-ebs-encryption-by-default
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "DisableEbsEncryptionByDefault -- succeeds from an SDK client, not Terraform or Packer"
      expected: alert
