type: job
name: AWS CloudTrail Network Route Modified
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - Network Route Modified"
  id: a38f9acf-5cf8-4aa7-89a2-c563ea3c2c24
description: |
  An actor repoints a VPC route. The rule fires on a successful
  ReplaceRoute, ReplaceRouteTableAssociation or DisassociateRouteTable.

mitre:
  tactics: [defense-evasion]
  techniques: [T1562]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/ec2#1.231.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/ec2/replace-route
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "ReplaceRoute -- default route repointed at a network interface"
      expected: alert
