type: job
name: AWS CloudTrail Network Route Deleted
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - Network Route Deleted"
  id: 40028e21-de59-4a8c-a520-4aa484950608
description: |
  An actor deletes a route from a VPC route table with a successful
  DeleteRoute call, cutting the subnet off from wherever that route led.

mitre:
  tactics: [impact]
  techniques: [T1498]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/ec2#1.231.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/ec2/delete-route
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "DeleteRoute -- default route removed from a route table"
      expected: alert
