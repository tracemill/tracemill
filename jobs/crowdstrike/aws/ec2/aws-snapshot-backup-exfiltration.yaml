type: job
name: AWS CloudTrail AWS Snapshot Backup Exfiltration - Sigma
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - AWS Snapshot Backup Exfiltration - Sigma"
  id: abae8fec-57bd-4f87-aff6-6e3db989843d
description: |
  An EBS snapshot's share list is rewritten so the volume can be restored
  outside the account. The rule keys on the bare ec2.amazonaws.com
  ModifySnapshotAttribute call, so the public form -- create-volume
  permission granted to group "all" -- carries it.

mitre:
  tactics: [exfiltration]
  techniques: [T1537]

state:
  account_id: "111111111111"
  aws_region: us-west-2
  source_ip:  gen.ipv4()
  actor:      gen.aws_identity(type=IAMUser, userName=gen.username(), accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/ec2#1.231.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/ec2/share-snapshot-public-group-all
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "ModifySnapshotAttribute -- createVolumePermission add grants group all"
      expected: alert
