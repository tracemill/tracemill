type: job
name: AWS CloudTrail New Network Route Added - Sigma
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - New Network Route Added - Sigma"
  id: c803b2ce-c4a2-4836-beae-b112010390b1
description: |
  An actor adds a route to a VPC route table with a CreateRoute call,
  pointing the default route at an internet gateway.

mitre:
  tactics: [initial-access]
  techniques: [T1190]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/ec2#1.231.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/ec2/create-route
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "CreateRoute -- default route to an internet gateway"
      expected: alert
