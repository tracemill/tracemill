type: job
name: AWS CloudTrail EC2 Network Access Control List Deleted
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - EC2 Network Access Control List Deleted"
  id: cd36bf50-cdd6-4a9d-a63d-3c5b5dd1fe6b
description: |
  An actor removes a subnet-level network access control restriction with a
  successful DeleteNetworkAclEntry call, dropping one rule from the ACL that
  fronts the subnet.

mitre:
  tactics: [defense-evasion]
  techniques: [T1562.001]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor:      gen.aws_identity(type=IAMUser, userName=gen.username(), accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/ec2#1.231.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/ec2/delete-network-acl-entry
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "DeleteNetworkAclEntry -- subnet ACL rule removed, succeeding"
      expected: alert
