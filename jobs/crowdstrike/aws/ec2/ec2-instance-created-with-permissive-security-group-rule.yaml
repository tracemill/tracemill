type: job
name: AWS CloudTrail EC2 Instance Created with Permissive Security Group Rule
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - EC2 Instance Created with Permissive Security Group Rule"
  id: 19d489a9-4e02-46a5-826e-7b0442189b1b
description: |
  One identity opens a security group to the internet and launches an
  instance behind it. The rule groups successful AuthorizeSecurityGroupIngress
  and RunInstances events by account, user, source IP and security group,
  and fires when both actions appear under the same group.

mitre:
  tactics: [impact]
  techniques: [T1496]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  # Account, user, source IP and security group are the rule's group key, so
  # both legs share all four.
  user_name:  gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.user_name, accountId=ref.account_id)
  source_ip:  gen.ipv4()
  group_hex:  gen.hex(len=17, case=lower)
  group_id:   "sg-${ref.group_hex}"
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/ec2#1.231.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/ec2/authorize-sg-ingress-open
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      user_name:  ref.user_name
      actor:      ref.actor
      source_ip:  ref.source_ip
      group_id:   ref.group_id
      user_agent: ref.user_agent
    expectation:
      summary: "AuthorizeSecurityGroupIngress -- the group is opened to cidrIp 0.0.0.0/0"
      expected: alert
  - scenario: scenarios/aws/ec2/run-instances
    # The instance is placed behind the group that was just opened.
    start_after: 10s
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      user_name:  ref.user_name
      actor:      ref.actor
      source_ip:  ref.source_ip
      group_id:   ref.group_id
      user_agent: ref.user_agent
    expectation:
      summary: "RunInstances -- an instance is launched into that same security group"
      expected: alert
