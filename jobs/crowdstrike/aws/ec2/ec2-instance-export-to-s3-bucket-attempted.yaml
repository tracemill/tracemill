type: job
name: AWS CloudTrail EC2 Instance Export to S3 Bucket Attempted
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - EC2 Instance Export to S3 Bucket Attempted"
  id: 16734b88-6ca8-4254-b089-398952a0c58b
description: |
  An actor tries to export an instance's disks to an S3 bucket with
  CreateInstanceExportTask and is refused -- an attempt at copying a whole
  machine out of the account.

mitre:
  tactics: [collection]
  techniques: [T1074.002]

state:
  account_id:     "111111111111"
  aws_region:     us-east-1
  source_ip:      gen.ipv4()
  user_agent:     "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/ec2#1.231.0 tracemill/1.0"
  role_name:      gen.username()
  role_id:        gen.regex(pattern=AROA[A-Z0-9]{17})
  session_name:   gen.username()
  session_key_id: gen.regex(pattern=ASIA[A-Z0-9]{16})

workloads:
  - scenario: scenarios/aws/ec2/create-instance-export-task-denied
    bindings:
      account_id:     ref.account_id
      aws_region:     ref.aws_region
      source_ip:      ref.source_ip
      user_agent:     ref.user_agent
      role_name:      ref.role_name
      role_id:        ref.role_id
      session_name:   ref.session_name
      session_key_id: ref.session_key_id
    expectation:
      summary: "CreateInstanceExportTask -- refused export of an instance to S3"
      expected: alert
