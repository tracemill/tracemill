type: job
name: AWS CloudTrail EC2 Instance Created or Modified with Instance Metadata Service Version 1 (IMDSv1)
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - EC2 Instance Created or Modified with Instance Metadata Service Version 1 (IMDSv1)"
  id: ef72c289-0db9-4795-a293-1f6289e0a9b0
description: |
  An actor reconfigures a running instance so its metadata service answers
  unauthenticated IMDSv1 requests: ModifyInstanceMetadataOptions leaves the
  HttpEndpoint enabled and sets HttpTokens to optional, so any process on
  the host can fetch the instance role's credentials without a session
  token.

mitre:
  tactics: [defense-evasion]
  techniques: [T1578]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  user_name:  gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.user_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/ec2#1.231.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/ec2/modify-instance-metadata-options
    bindings:
      account_id:    ref.account_id
      aws_region:    ref.aws_region
      source_ip:     ref.source_ip
      user_name:     ref.user_name
      actor:         ref.actor
      user_agent:    ref.user_agent
      http_endpoint: enabled
      http_tokens:   optional
    expectation:
      summary: "ModifyInstanceMetadataOptions -- HttpEndpoint enabled with HttpTokens optional"
      expected: alert
