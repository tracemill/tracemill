type: job
name: AWS CloudTrail New Network ACL Entry Added - Sigma
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - New Network ACL Entry Added - Sigma"
  id: e1f7febb-7b94-4234-b5c6-00fb8500f5dd
description: |
  A new entry is added to a VPC network ACL. The rule keys on the bare
  ec2.amazonaws.com CreateNetworkAclEntry call with no condition on the
  rule's contents, so a narrow single-port entry carries it.

mitre:
  tactics: [initial-access]
  techniques: [T1190]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor:      gen.aws_identity(type=AssumedRole, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/ec2#1.231.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/ec2/create-acl-single-port
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "CreateNetworkAclEntry -- a single-port inbound allow entry is added"
      expected: alert
