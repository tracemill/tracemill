type: job
name: AWS CloudTrail EC2 Network ACL Entry Created or Modified To Allow Ingress on All or High Range of Open Ports
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - EC2 Network ACL Entry Created or Modified To Allow Ingress on All or High Range of Open Ports"
  id: 6b7adb21-5de5-43c7-a385-f8ba7e068e5f
description: |
  A network ACL gains an inbound allow rule spanning a wide block of ports:
  a CreateNetworkAclEntry call adds an ingress TCP entry with ruleAction
  allow whose port range runs from 0 to 1024.

mitre:
  tactics: [defense-evasion]
  techniques: [T1562.007]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor:      gen.aws_identity(type=AssumedRole, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/ec2#1.231.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/ec2/acl-open-tcp-range
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "CreateNetworkAclEntry -- inbound TCP allow spanning ports 0-1024"
      expected: alert
