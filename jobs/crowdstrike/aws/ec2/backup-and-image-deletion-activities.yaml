type: job
name: AWS CloudTrail Backup and Image Deletion Activities
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - Backup and Image Deletion Activities"
  id: 6c8e6373-fd73-4cc5-b51a-b61fa993bb3b
description: |
  One identity deletes recovery points at machine speed. The detection
  aggregates DeregisterImage and DeleteSnapshot on ec2.amazonaws.com and
  DeleteRecoveryPoint on backup.amazonaws.com per account, user name and
  public source address, and fires above a hundred events in the window;
  the snapshot deletions alone clear it.

mitre:
  tactics: [impact]
  techniques: [T1485]

state:
  account_id: "111111111111"
  aws_region: us-west-2
  # One identity and one address for the whole burst: the rule aggregates on
  # both, so a value that varied per event would split the count.
  source_ip:  gen.ipv4()
  user_name:  gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.user_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/ec2#1.231.0 tracemill/1.0"
  # Each iteration emits one DeleteSnapshot, so the loop count is the count
  # the rule sees. 101 clears the >100 bound by one, and the rest of the
  # sequence's events fall outside the rule's action list.
  step_delay:  "150ms"
  step_jitter: 0.3

workloads:
  - scenario: scenarios/aws/ec2/snapshot-exfil-sequence
    loop: 101
    bindings:
      account_id:  ref.account_id
      aws_region:  ref.aws_region
      source_ip:   ref.source_ip
      actor:       ref.actor
      user_agent:  ref.user_agent
      step_delay:  ref.step_delay
      step_jitter: ref.step_jitter
    expectation:
      summary: "One hundred and one DeleteSnapshot events from one identity and source address"
      expected: alert
