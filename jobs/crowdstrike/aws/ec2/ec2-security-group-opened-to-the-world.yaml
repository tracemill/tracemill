type: job
name: AWS CloudTrail EC2 Security Group Opened To the World
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - EC2 Security Group Opened To the World"
  id: 58d55b28-edb3-4814-aa34-af7890e32b86
description: |
  A security group gains an ingress rule reachable from anywhere: a
  successful AuthorizeSecurityGroupIngress opens all protocols to cidrIp
  0.0.0.0/0.

mitre:
  tactics: [defense-evasion]
  techniques: [T1562.001]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  user_name:  gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.user_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/ec2#1.231.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/ec2/authorize-sg-ingress-open
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      user_name:  ref.user_name
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "AuthorizeSecurityGroupIngress -- all protocols opened to cidrIp 0.0.0.0/0"
      expected: alert
