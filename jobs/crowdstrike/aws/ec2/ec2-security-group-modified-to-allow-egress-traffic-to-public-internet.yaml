type: job
name: AWS CloudTrail EC2 Security Group Modified to Allow Egress Traffic to Public Internet
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - EC2 Security Group Modified to Allow Egress Traffic to Public Internet"
  id: d179c412-90b2-41f9-bd10-7c62c72b2937
description: |
  An actor opens outbound traffic from a security group to the whole
  internet. The rule keys on a successful AuthorizeSecurityGroupEgress whose
  ipPermissions carry cidrIp 0.0.0.0/0 or cidrIpv6 ::/0.

mitre:
  tactics: [defense-evasion]
  techniques: [T1562.007]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/ec2#1.231.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/ec2/authorize-sg-egress-open
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "AuthorizeSecurityGroupEgress -- tcp/443 egress to 0.0.0.0/0"
      expected: alert
