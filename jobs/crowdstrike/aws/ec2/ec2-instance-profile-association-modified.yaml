type: job
name: AWS CloudTrail EC2 Instance Profile Association Modified
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - EC2 Instance Profile Association Modified"
  id: e352fb6d-f3f3-4e95-925a-b4b8f1c3fffb
description: |
  An actor swaps the instance profile on a running instance with a
  successful ReplaceIamInstanceProfileAssociation call, changing which role's
  credentials the instance can obtain.

mitre:
  tactics: [privilege-escalation]
  techniques: [T1098]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/ec2#1.231.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/ec2/replace-iam-instance-profile-association
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "ReplaceIamInstanceProfileAssociation -- instance profile swapped on an instance"
      expected: alert
