type: job
name: AWS CloudTrail Admin Credential Fetch Attempts from Multiple EC2 Instances
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - Admin Credential Fetch Attempts from Multiple EC2 Instances"
  id: f64f3991-520d-4196-a29c-b7edf18e7214
description: |
  One identity walks the account asking for the Windows administrator
  password of instance after instance. The rule groups GetPasswordData
  events by account and userIdentity ARN and fires on five or more distinct
  requestParameters.instanceId values, whatever the outcome.

mitre:
  tactics: [credential-access]
  techniques: [T1552.005]

state:
  account_id: "111122223333"
  aws_region: us-east-1
  # Evaluated once, so the whole sweep is credited to one ARN -- the key the
  # rule groups on.
  actor:      gen.aws_identity(type=AssumedRole, accountId=ref.account_id)
  source_ip:  gen.ipv4()
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/ec2#1.231.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/ec2/get-password-data-denied
    # Eight attempts against the threshold of five distinct instance ids; the
    # scenario's instance id is left unbound so it is regenerated each pass.
    loop: 8
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      actor:      ref.actor
      source_ip:  ref.source_ip
      user_agent: ref.user_agent
    expectation:
      summary: "Eight GetPasswordData attempts by one role session across eight distinct instances"
      expected: alert
