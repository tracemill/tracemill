type: job
name: AWS CloudTrail Multiple EC2 Key Pairs Created
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - Multiple EC2 Key Pairs Created"
  id: 849ac2a5-ab1d-4d50-a02d-5519136534b4
description: |
  One identity mints SSH key pair after SSH key pair: a run of successful
  CreateKeyPair calls by one IAM user, each returning a distinct
  fingerprint -- a persistence foothold spread across many instances.

mitre:
  tactics: [persistence]
  techniques: [T1098.004]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  # One identity for the whole burst.
  user_name:  gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.user_name, accountId=ref.account_id)
  source_ip:  gen.ipv4()
  # A scripted burst comes from an SDK client, not the console.
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/ec2#1.231.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/ec2/create-key-pair
    # Key name and fingerprint are left unbound so each pass returns a
    # distinct one.
    loop: 14
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      user_name:  ref.user_name
      actor:      ref.actor
      source_ip:  ref.source_ip
      user_agent: ref.user_agent
    expectation:
      summary: "Fourteen EC2 key pairs created by one IAM user, each with a distinct fingerprint"
      expected: alert
