type: job
name: AWS CloudTrail AWS EC2 Startup Shell Script Change - Sigma
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - AWS EC2 Startup Shell Script Change - Sigma"
  id: 1ab3c5ed-5baf-417b-bb6b-78ca33f6c3df
description: |
  An actor rewrites the user data of a stopped instance with
  ModifyInstanceAttribute on the userData attribute, so new code runs at
  its next boot.

mitre:
  tactics: [execution]
  techniques: [T1059.004]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/ec2#1.231.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/ec2/modify-instance-user-data
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "ModifyInstanceAttribute -- attribute userData on a stopped instance"
      expected: alert
