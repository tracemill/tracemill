type: job
name: AWS CloudTrail EC2 Traffic Mirroring Detected
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - EC2 Traffic Mirroring Detected"
  id: 35022a95-2920-4db8-8b93-da23480ada1b
description: |
  An actor starts building a traffic mirror with a successful
  CreateTrafficMirrorFilter call, the first piece of a setup that copies a
  network interface's packets to a destination of the actor's choosing.

mitre:
  tactics: [exfiltration]
  techniques: [T1020]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/ec2#1.231.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/ec2/create-traffic-mirror-filter
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "CreateTrafficMirrorFilter -- new traffic mirror filter created"
      expected: alert
