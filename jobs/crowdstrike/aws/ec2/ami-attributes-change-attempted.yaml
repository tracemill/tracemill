type: job
name: AWS CloudTrail AMI Attributes Change Attempted
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - AMI Attributes Change Attempted"
  id: abfc3f2b-006d-4dc9-b2d2-a63c40791975
description: |
  A private machine image is opened up for launch by someone else: a
  successful ModifyImageAttribute adds the "all" group to the AMI's launch
  permissions, so any AWS account can start instances from it.

mitre:
  tactics: [exfiltration]
  techniques: [T1537]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor:      gen.aws_identity(type=AssumedRole, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/ec2#1.231.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/ec2/share-image-publicly
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "ModifyImageAttribute -- launchPermission add grants the AMI to group all"
      expected: alert
