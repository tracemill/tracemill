type: job
name: AWS CloudTrail AWS EC2 Disable EBS Encryption - Sigma
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - AWS EC2 Disable EBS Encryption - Sigma"
  id: 16124c2d-e40b-4fcc-8f2c-5ab7870a2223
description: |
  An actor turns off EBS encryption by default for a region with a
  DisableEbsEncryptionByDefault call, so new volumes are created unencrypted.

mitre:
  tactics: [impact]
  techniques: [T1565]

state:
  account_id: "111111111111"
  aws_region: us-east-1
  source_ip:  gen.ipv4()
  actor_name: gen.username()
  actor:      gen.aws_identity(type=IAMUser, userName=ref.actor_name, accountId=ref.account_id)
  user_agent: "aws-sdk-go-v2/1.36.5 ua/2.1 os/linux lang/go#1.24.4 md/GOOS#linux md/GOARCH#amd64 api/ec2#1.231.0 tracemill/1.0"

workloads:
  - scenario: scenarios/aws/ec2/disable-ebs-encryption-by-default
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.source_ip
      actor:      ref.actor
      user_agent: ref.user_agent
    expectation:
      summary: "DisableEbsEncryptionByDefault -- default EBS encryption turned off"
      expected: alert
