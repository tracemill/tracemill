type: job
name: AWS CloudTrail Potential Successful Password Spray Attack
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - Potential Successful Password Spray Attack"
  id: c610f0a0-5beb-4b69-af4f-cc8706cb861f
description: |
  A large console password spray against one account that lands one
  successful sign-in. The rule groups ConsoleLogin events by account and
  source-IP organisation and fires only when all five bounds hold at once:
  more than a thousand failures, over ninety percent of attempts failing,
  more than fifty distinct user names, more than one source address, and a
  non-zero success rate.

mitre:
  tactics: [credential-access]
  techniques: [T1110.003]

state:
  # The rule groups on account and source-IP organisation only, so a fixed
  # account would merge this spray with any other job emitting from the same
  # resolvers in the same window; a per-run account keeps the group private.
  account_id: gen.aws_account_id()
  aws_region: us-east-1
  # The rule groups on the source IP's registered organisation, so both spray
  # addresses are public resolvers inside one AS (Google, AS15169); two
  # generated addresses would almost certainly land in different orgs and
  # split the group.
  spray_ip_a: "8.8.8.8"
  spray_ip_b: "8.8.4.4"
  user_agent: "Go-http-client/1.1 tracemill/1.0"
  # 0.2s with jitter paces just over a thousand attempts into roughly two
  # minutes of event time -- far inside the rule's window.
  step_delay:  "200ms"
  step_jitter: 0.3

workloads:
  # Two failure halves, one per address, so the spray clears the
  # more-than-one-distinct-IP bound while staying in one source-IP org.
  # Together they total 1010 failures against the bound of more than 1000,
  # and 1010 distinct user names against the bound of more than 50.
  - scenario: scenarios/aws/signin/console-login-failed-auth
    loop: 505
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.spray_ip_a
      user_agent: ref.user_agent
      spray_user: gen.username()
      actor:      gen.aws_identity(type=IAMUser, userName=ref.spray_user, accountId=ref.account_id)
      step_delay:  ref.step_delay
      step_jitter: ref.step_jitter
    expectation:
      summary: "Five hundred and five failed console sign-ins from the first spray address"
      expected: alert
  - scenario: scenarios/aws/signin/console-login-failed-auth
    loop: 505
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.spray_ip_b
      user_agent: ref.user_agent
      spray_user: gen.username()
      actor:      gen.aws_identity(type=IAMUser, userName=ref.spray_user, accountId=ref.account_id)
      step_delay:  ref.step_delay
      step_jitter: ref.step_jitter
    expectation:
      summary: "Five hundred and five failed console sign-ins from the second spray address"
      expected: alert
  # One success in 1011 attempts keeps the failure rate above
  # ninety percent while making the success rate non-zero.
  - scenario: scenarios/aws/signin/console-login-without-mfa
    start_after: 10s
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.spray_ip_a
      user_agent: ref.user_agent
      actor:      gen.aws_identity(type=IAMUser, userName=gen.username(), accountId=ref.account_id)
    expectation:
      summary: "One sprayed password succeeds, making the group's success rate non-zero"
      expected: alert
