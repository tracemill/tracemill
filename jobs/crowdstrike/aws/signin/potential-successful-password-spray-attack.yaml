type: job
name: AWS CloudTrail Potential Successful Password Spray Attack
detection:
  source: ngsiem_template
  name: "AWS - CloudTrail - Potential Successful Password Spray Attack"
  id: c610f0a0-5beb-4b69-af4f-cc8706cb861f
description: |
  A large console password spray against one account that lands one
  successful sign-in: just over a thousand ConsoleLogin failures across as
  many distinct user names, from two addresses in the same network, with a
  single success landing while the spray is still running.

mitre:
  tactics: [credential-access]
  techniques: [T1110.003]

state:
  # A per-run account keeps this spray apart from any other job emitting
  # from the same resolvers in the same window.
  account_id: gen.aws_account_id()
  aws_region: us-east-1
  # Both spray addresses are public resolvers inside one AS (Google,
  # AS15169), so the spray comes from one network; two generated addresses
  # would almost certainly land in different orgs.
  spray_ip_a: "8.8.8.8"
  spray_ip_b: "8.8.4.4"
  user_agent: "Go-http-client/1.1 tracemill/1.0"
  # 0.2s with jitter paces just over a thousand attempts into roughly two
  # minutes of event time.
  step_delay:  "200ms"
  step_jitter: 0.3

workloads:
  # Two failure halves, one per address, so the spray comes from more than
  # one address while staying in one network. Together they total 1010
  # failures across 1010 distinct user names.
  - scenario: scenarios/aws/signin/console-login-failed-auth
    loop: 505
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.spray_ip_a
      user_agent: ref.user_agent
      spray_user: gen.username()
      actor:      gen.aws_identity(type=IAMUser, userName=ref.spray_user, accountId=ref.account_id)
      step_delay:  ref.step_delay
      step_jitter: ref.step_jitter
    expectation:
      summary: "Five hundred and five failed console sign-ins from the first spray address"
      expected: alert
  - scenario: scenarios/aws/signin/console-login-failed-auth
    loop: 505
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.spray_ip_b
      user_agent: ref.user_agent
      spray_user: gen.username()
      actor:      gen.aws_identity(type=IAMUser, userName=ref.spray_user, accountId=ref.account_id)
      step_delay:  ref.step_delay
      step_jitter: ref.step_jitter
    expectation:
      summary: "Five hundred and five failed console sign-ins from the second spray address"
      expected: alert
  # A single success among 1011 attempts, as a spray that lands one
  # password would show.
  - scenario: scenarios/aws/signin/console-login-without-mfa
    start_after: 10s
    bindings:
      account_id: ref.account_id
      aws_region: ref.aws_region
      source_ip:  ref.spray_ip_a
      user_agent: ref.user_agent
      actor:      gen.aws_identity(type=IAMUser, userName=gen.username(), accountId=ref.account_id)
    expectation:
      summary: "One sprayed password succeeds, making the group's success rate non-zero"
      expected: alert
